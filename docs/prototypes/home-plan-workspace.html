<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone · 把想法整理成可执行方案</title>
  <style>
    :root{--bg:#e9ecea;--paper:#fbfbf8;--paper2:#f4f5f1;--ink:#17231f;--ink2:#3f4c47;--muted:#65706c;--line:#d9ddda;--line2:#c8ceca;--teal:#176d63;--teal-dark:#10574f;--teal-soft:#dcece7;--amber:#8f5c19;--amber-soft:#f6ead8;--red:#99463c;--shadow:0 24px 70px rgba(28,42,37,.13);--r:18px}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.45}
    .app{position:relative;width:min(1180px,calc(100% - 32px));height:min(800px,calc(100vh - 32px));min-height:660px;margin:16px auto;overflow:hidden;border:1px solid rgba(23,35,31,.09);border-radius:22px;background:var(--paper);box-shadow:var(--shadow)}
    .topbar{height:62px;padding:0 24px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:18px}.brand{display:flex;align-items:center;gap:9px;font-weight:820}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--ink);color:#bfe6dd;font-size:11px}.top-spacer{flex:1}.history-btn,.ghost-btn,.icon-btn{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink2);font-weight:700}.history-btn{padding:7px 11px}.history-btn:hover,.ghost-btn:hover,.icon-btn:hover{background:var(--paper2)}.avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--teal-soft);color:var(--teal-dark);font-size:11px;font-weight:800}
    .live-strip{display:none;min-height:47px;padding:9px 24px;align-items:center;gap:11px;border-bottom:1px solid #ead4b4;background:var(--amber-soft);color:#65461e}.live-strip.show{display:flex}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}.live-copy{min-width:0;flex:1}.live-copy b{display:block}.live-copy span{display:block;color:#795d38;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live-action{border:0;background:transparent;color:#6f4814;font-weight:800}.live-action:hover{text-decoration:underline;text-underline-offset:3px}
    .screen{height:calc(100% - 62px);overflow:auto}.screen.has-live{height:calc(100% - 109px)}.home{width:min(790px,calc(100% - 40px));margin:0 auto;padding:72px 0 48px}.home-head{text-align:center;margin-bottom:29px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;font-weight:750}.home h1{margin:0;font-size:clamp(34px,5vw,50px);line-height:1.12;letter-spacing:-.045em}.home-head .lead{max-width:590px;margin:13px auto 0;color:var(--ink2);font-size:16px}
    .composer{border:1px solid var(--line2);border-radius:16px;background:#fff;box-shadow:0 12px 35px rgba(27,42,37,.08);overflow:hidden}.idea{display:block;width:100%;height:146px;padding:19px 20px;border:0;resize:none;background:transparent;color:var(--ink);font-size:16px;line-height:1.65}.idea::placeholder{color:#89928f}.source-row{padding:11px 12px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);background:#fdfdfb}.source-row>span{margin:0 4px;color:var(--muted);font-size:12px}.source-btn{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font-size:12px;font-weight:700}.source-btn:hover{border-color:#9dbbb4;background:var(--teal-soft);color:var(--teal-dark)}.source-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.source-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal-dark);font-size:12px;font-weight:700}.source-chip button{width:18px;height:18px;padding:0;border:0;border-radius:50%;background:rgba(23,109,99,.12);color:inherit;line-height:1}
    .workflow{margin-top:23px}.workflow-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.workflow h2{margin:0;font-size:14px}.workflow small{color:var(--muted)}.workflow-options{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.workflow-btn{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink2);text-align:left;font-weight:740}.workflow-btn span{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:500}.workflow-btn:hover{border-color:#9ebbb5}.workflow-btn.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-dark)}.workflow-btn.on span{color:#407a72}.home-actions{margin-top:22px;display:flex;justify-content:flex-end}.primary{min-height:42px;padding:9px 17px;border:1px solid var(--teal);border-radius:10px;background:var(--teal);color:#fff;font-weight:800;box-shadow:0 4px 12px rgba(23,109,99,.18)}.primary:hover{background:var(--teal-dark)}
    .editor-screen{display:none;height:100%;grid-template-rows:auto minmax(0,1fr) auto}.editor-head{padding:20px 26px 15px;display:flex;align-items:flex-start;gap:18px;border-bottom:1px solid var(--line)}.back{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink2);font-size:18px}.editor-title{min-width:0;flex:1}.editor-title input{width:100%;padding:0;border:0;background:transparent;color:var(--ink);font-size:20px;font-weight:800}.editor-title p{margin:4px 0 0;color:var(--muted);font-size:12px}.saved{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.saved i{width:7px;height:7px;border-radius:50%;background:#5d9a74}.editor-body{min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(310px,.88fr)}.md-pane{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.pane-head{height:45px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.pane-head b{color:var(--ink2)}.md{width:100%;flex:1;min-height:0;padding:19px 21px;border:0;resize:none;background:#fdfdfb;color:#27322e;font:14px/1.75 Consolas,"SFMono-Regular",monospace;tab-size:2}.preview{min-height:0;overflow:auto;padding:22px 24px}.preview h2{margin:0 0 14px;font-size:20px}.preview h3{margin:20px 0 6px;font-size:13px}.preview p,.preview li{color:var(--ink2)}.preview ul{padding-left:20px}.preview .empty-preview{color:var(--muted)}.editor-foot{min-height:68px;padding:12px 22px;display:flex;align-items:center;gap:13px;border-top:1px solid var(--line);background:#fff}.agent-select{display:flex;align-items:center;gap:9px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper2)}.agent-select span{color:var(--muted);font-size:11px}.agent-select b{font-size:13px}.foot-note{flex:1;color:var(--muted);font-size:12px}.send{min-width:148px}
    .scrim{position:absolute;inset:0;z-index:8;background:rgba(20,31,27,.2);opacity:0;pointer-events:none;transition:opacity .17s ease-out}.drawer{position:absolute;z-index:9;top:0;right:0;width:min(390px,calc(100% - 24px));height:100%;padding:22px;background:var(--paper);box-shadow:-20px 0 50px rgba(22,35,30,.16);transform:translateX(103%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}.app.drawer-open .scrim{opacity:1;pointer-events:auto}.app.drawer-open .drawer{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.drawer h2{margin:0;font-size:20px}.icon-btn{width:34px;height:34px}.history-list{display:grid;gap:8px}.history-item{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:left}.history-item:hover{border-color:#9ebbb5}.history-item b{display:block}.history-item span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.history-meta{margin-top:9px;display:flex;justify-content:space-between;gap:8px}.badge{padding:2px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal-dark);font-size:10px;font-weight:800}.badge.wait{background:var(--amber-soft);color:var(--amber)}
    .state-demo{position:fixed;left:50%;bottom:19px;z-index:20;display:flex;gap:2px;padding:4px;transform:translateX(-50%);border-radius:999px;background:rgba(12,14,13,.84);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.2)}.state-demo button{height:28px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.6);font-size:12px}.state-demo button.on{background:rgba(255,255,255,.14);color:#fff}.toast{position:fixed;top:16px;left:50%;z-index:30;padding:8px 13px;transform:translate(-50%,-8px);border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:.17s ease-out}.toast.show{opacity:1;transform:translate(-50%,0)}
    .pane-head{height:auto;min-height:45px;padding:8px 18px}
    [data-app-state="draft"],[data-app-state="editing"],[data-app-state="running"],[data-app-state="review"]{display:none}
    @media(max-width:760px){.app{width:100%;height:100%;min-height:0;margin:0;border:0;border-radius:0}.topbar{padding:0 15px}.screen{height:calc(100% - 62px)}.home{width:calc(100% - 28px);padding:40px 0 90px}.home h1{font-size:34px}.workflow-options{grid-template-columns:1fr 1fr}.source-row{overflow-x:auto}.source-row>span{display:none}.source-btn{white-space:nowrap}.editor-head{padding:15px}.editor-body{display:block;overflow:auto}.md-pane{height:48%;min-height:310px;border-right:0;border-bottom:1px solid var(--line)}.preview{min-height:280px}.editor-foot{position:sticky;bottom:0;padding:10px 12px}.foot-note{display:none}.agent-select{flex:1}.send{min-width:auto}.state-demo{display:none}.history-btn{font-size:0}.history-btn::after{content:'历史';font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar"><div class="brand"><span class="mark">OT</span><span>OneTone</span></div><div class="top-spacer"></div><button class="history-btn" id="openHistory" type="button">历史方案</button><span class="avatar">你</span></header>
    <div class="live-strip" id="liveStrip" aria-live="polite"><span class="live-dot"></span><div class="live-copy"><b id="liveTitle">首页方案正在由 Agent 执行</b><span id="liveDetail">已经完成内容读取，正在修改页面结构</span></div><button class="live-action" id="liveAction" type="button">查看进度</button></div>
    <main class="screen" id="screen">
      <section class="home" id="homeView">
        <header class="home-head"><p class="eyebrow">从想法到可执行方案</p><h1>今天想做什么？</h1><p class="lead">说清目标，放入已有内容。OneTone 会整理成一份可以直接交给 Agent 的完整方案。</p></header>
        <div class="composer"><textarea class="idea" id="ideaInput" aria-label="描述你想完成的事" placeholder="例如：重新设计首页，让第一次使用的人能快速开始，老用户可以继续上次工作……"></textarea><div class="source-row" id="sourcePicker"><span>加入内容</span><button class="source-btn" data-source="粘贴的文字" type="button">粘贴文字</button><button class="source-btn" data-source="产品截图.png" type="button">添加图片</button><button class="source-btn" data-source="PRODUCT.md" type="button">添加文件</button><button class="source-btn" data-source="参考网页" type="button">添加网址</button><button class="source-btn" data-source="本地代码目录" type="button">导入目录</button></div></div>
        <div class="source-chips" id="sourceChips" aria-live="polite"></div>
        <section class="workflow" aria-labelledby="workflowTitle"><div class="workflow-head"><h2 id="workflowTitle">选择整理方式</h2><small>之后仍可修改</small></div><div class="workflow-options"><button class="workflow-btn on" data-workflow="新建功能" type="button">新建功能<span>从想法形成完整实现任务</span></button><button class="workflow-btn" data-workflow="修改功能" type="button">修改功能<span>基于现有内容调整体验</span></button><button class="workflow-btn" data-workflow="修复问题" type="button">修复问题<span>描述现象并限定修复范围</span></button><button class="workflow-btn" data-workflow="验收结果" type="button">验收结果<span>检查效果、测试与风险</span></button></div></section>
        <div class="home-actions"><button class="primary" id="makePlan" type="button" disabled>整理成方案</button></div>
      </section>
      <section class="editor-screen" id="editorView">
        <header class="editor-head"><button class="back" id="backHome" type="button" aria-label="返回输入">‹</button><div class="editor-title"><input id="planTitle" value="首页体验重新设计" aria-label="方案标题"><p><span id="workflowLabel">新建功能</span> · 方案会自动保存到历史</p></div><span class="saved"><i></i>已保存</span></header>
        <div class="editor-body"><section class="md-pane"><div class="pane-head"><b>Markdown 方案</b><span>可以直接修改</span></div><textarea class="md" id="planEditor" spellcheck="false" aria-label="Markdown 方案"></textarea></section><article class="preview" id="preview" aria-label="方案预览"></article></div>
        <footer class="editor-foot"><div class="agent-select"><span>发送给</span><b>Codex</b></div><p class="foot-note">将发送当前方案和已导入的内容，不包含其他历史记录。</p><button class="primary send" id="sendAgent" type="button">发送完整方案</button></footer>
      </section>
    </main>
    <div class="scrim" id="scrim"></div><aside class="drawer" id="historyDrawer" aria-labelledby="historyTitle" aria-hidden="true"><header class="drawer-head"><h2 id="historyTitle">历史方案</h2><button class="icon-btn" id="closeHistory" type="button" aria-label="关闭历史方案">×</button></header><div class="history-list"><button class="history-item" data-open-plan="首页视觉简化" type="button"><b>首页视觉简化</b><span>让能力更直接，不做搜索引擎式首页</span><span class="history-meta"><i class="badge wait">待验收</i><time>今天 09:42</time></span></button><button class="history-item" data-open-plan="语音启动流程" type="button"><b>语音启动流程</b><span>优化第一次设置唤醒词的体验</span><span class="history-meta"><i class="badge">Agent 已完成</i><time>昨天</time></span></button><button class="history-item" data-open-plan="托盘快捷控制" type="button"><b>托盘快捷控制</b><span>减少切换窗口完成常用操作</span><span class="history-meta"><i class="badge">已通过</i><time>10 月 6 日</time></span></button></div></aside>
  </div>
  <div class="state-demo" aria-label="原型状态"><button class="on" data-demo="draft" type="button">输入</button><button data-demo="editing" type="button">整理</button><button data-demo="running" type="button">执行中</button><button data-demo="review" type="button">待验收</button></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
    const app=$('#app'),home=$('#homeView'),editor=$('#editorView'),screen=$('#screen'),live=$('#liveStrip'),idea=$('#ideaInput'),makePlan=$('#makePlan'),md=$('#planEditor'),preview=$('#preview');let workflow='新建功能';let sources=[];let appState='draft';
    const samples={新建功能:['## 目标','重新设计 OneTone 首页，让新用户可以快速开始，也让常规用户能恢复工作。','','## 已有内容','- 用户的原始描述','- 已导入的参考内容','','## 需要完成','- 保留一个主要输入入口','- 所有导入能力直接可见','- 生成可编辑的 Markdown 方案','- 将完整方案发送给 Agent','','## 不要改动','- 不改变底层 Agent 协议','- 不把工程配置暴露给用户','','## 验收标准','- 首次用户能在一分钟内生成第一份方案','- 历史方案可以重新打开并继续编辑','- Agent 结果返回后可以进入验收'],修改功能:['## 修改目标','简化现有首页，同时保留已经有效的交互。','','## 现状与材料','- 原始需求和导入内容','','## 修改范围','- 调整首页信息结构','- 保留历史方案入口','','## 不要改动','- 现有数据和 Agent 连接','','## 验收标准','- 核心路径更短','- 旧方案仍可恢复'],修复问题:['## 问题现象','描述用户看到的问题。','','## 复现材料','- 截图、文件或代码目录','','## 修复要求','- 先定位原因，再做最小修复','- 保留现有数据','','## 验收标准','- 原问题无法复现','- 相关检查通过'],验收结果:['## 验收目标','确认 Agent 的结果是否满足原始需求。','','## 需要检查','- 实际运行效果','- 关键交互','- 测试结果','- 是否出现范围外改动','','## 输出','- 通过','- 需要修改，并列出具体问题']};
    function buildPlan(){const title=idea.value.trim()||'继续整理这项工作';const sourceLines=sources.length?sources.map(x=>'- '+x):['- 暂无额外材料'];return [`# ${title}`,'',...samples[workflow].map(line=>line==='- 用户的原始描述'?'- '+title:line==='- 已导入的参考内容'?sourceLines.join('\n'):line)].join('\n')}
    function renderPreview(){const lines=md.value.split('\n');preview.innerHTML=lines.map(line=>{if(line.startsWith('# '))return `<h2>${esc(line.slice(2))}</h2>`;if(line.startsWith('## '))return `<h3>${esc(line.slice(3))}</h3>`;if(line.startsWith('- '))return `<li>${esc(line.slice(2))}</li>`;if(!line.trim())return '<div style="height:5px"></div>';return `<p>${esc(line)}</p>`}).join('')||'<p class="empty-preview">方案内容为空</p>'}
    function esc(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
    function setState(next){appState=next;$$('[data-demo]').forEach(b=>b.classList.toggle('on',b.dataset.demo===next));const edit=next!=='draft';home.style.display=edit?'none':'block';editor.style.display=edit?'grid':'none';live.classList.toggle('show',next==='running'||next==='review');screen.classList.toggle('has-live',next==='running'||next==='review');if(next==='running'){$('#liveTitle').textContent='方案正在由 Agent 执行';$('#liveDetail').textContent='已读取完整方案和导入内容，正在处理';$('#liveAction').textContent='查看进度'}if(next==='review'){$('#liveTitle').textContent='Agent 已完成，等待你验收';$('#liveDetail').textContent='请先查看实际结果，再决定通过或继续修改';$('#liveAction').textContent='开始验收'}if(edit&&!md.value){md.value=buildPlan();renderPreview()}}
    function renderSources(){$('#sourceChips').innerHTML=sources.map((x,i)=>`<span class="source-chip">${esc(x)}<button type="button" data-remove="${i}" aria-label="移除 ${esc(x)}">×</button></span>`).join('');$$('[data-remove]').forEach(b=>b.onclick=()=>{sources.splice(Number(b.dataset.remove),1);renderSources()})}
    function openDrawer(open){app.classList.toggle('drawer-open',open);$('#historyDrawer').setAttribute('aria-hidden',String(!open));if(open)$('#closeHistory').focus();else $('#openHistory').focus()}
    function toast(message){const t=$('#toast');t.textContent=message;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
    idea.addEventListener('input',()=>makePlan.disabled=!idea.value.trim());$$('[data-source]').forEach(b=>b.onclick=()=>{if(!sources.includes(b.dataset.source))sources.push(b.dataset.source);renderSources();toast('已加入 '+b.dataset.source)});$$('[data-workflow]').forEach(b=>b.onclick=()=>{workflow=b.dataset.workflow;$$('[data-workflow]').forEach(x=>x.classList.toggle('on',x===b))});
    makePlan.onclick=()=>{$('#workflowLabel').textContent=workflow;$('#planTitle').value=(idea.value.trim().slice(0,18)||workflow);md.value=buildPlan();renderPreview();setState('editing')};md.addEventListener('input',renderPreview);$('#backHome').onclick=()=>setState('draft');$('#sendAgent').onclick=()=>{setState('running');toast('完整方案已发送给 Codex')};$('#liveAction').onclick=()=>{if(appState==='running')toast('Agent 正在执行，当前不需要介入');else setState('editing')};
    $('#openHistory').onclick=()=>openDrawer(true);$('#closeHistory').onclick=()=>openDrawer(false);$('#scrim').onclick=()=>openDrawer(false);$$('[data-open-plan]').forEach(b=>b.onclick=()=>{idea.value=b.dataset.openPlan;workflow='修改功能';md.value=`# ${b.dataset.openPlan}\n\n## 当前状态\n从历史方案恢复，可以继续编辑或再次发送。\n\n## 下一步\n- 查看上次结果\n- 补充修改要求\n- 发送完整方案`;renderPreview();openDrawer(false);setState('editing');toast('已恢复历史方案')});$$('[data-demo]').forEach(b=>b.onclick=()=>setState(b.dataset.demo));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&app.classList.contains('drawer-open'))openDrawer(false)});setState('draft');
  </script>
</body>
</html>
