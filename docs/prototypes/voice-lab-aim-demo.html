<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneTone · 对准演示 · 语音输入</title>
  <style>
    :root {
      --ink:#13202c; --muted:#5d7186; --line:rgba(19,32,44,.12);
      --accent:#0f5f7a; --accent-strong:#1f8fb8; --ok:#0f6b5c; --warn:#b42318;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f7fa,#e8eef4);padding:28px 16px 48px}
    .page{max-width:440px;margin:0 auto}
    h1{margin:0 0 6px;font-size:18px;font-weight:750}
    .lead{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.4}
    .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 11px;font:650 12px inherit;cursor:pointer}
    .tab.is-on{background:color-mix(in srgb,var(--accent) 12%,white);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
    .hint{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.4}
    .card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;overflow:visible}
    .beats{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:4px}
    .beat{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;border:1px solid var(--line);background:#f4f7fa;font-size:10.5px;font-weight:650;color:#8494a6;opacity:.55}
    .beat.is-done{opacity:.75}.beat.is-on{opacity:1;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 12%,white)}
    .rec{display:none;margin:0 0 8px;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));background:color-mix(in srgb,var(--ok) 10%,white);color:var(--ok);font-size:10.5px;font-weight:750}
    .rec.is-on{display:inline-flex}
    .stage{position:relative;height:96px;border-radius:8px;border:1px solid #d5dee8;background:#eef3f7;overflow:visible;padding-top:36px;user-select:none;transition:background .2s,border-color .2s,box-shadow .2s}
    .stage.is-rec{border-color:color-mix(in srgb,#5ad0f5 40%,#d5dee8);background:color-mix(in srgb,#081018 28%,#eef3f7);box-shadow:inset 0 0 0 1px color-mix(in srgb,#081018 18%,transparent)}
    .stage.is-rec::after{content:"截屏";position:absolute;right:8px;top:8px;z-index:7;padding:1px 6px;border-radius:4px;background:rgba(8,16,24,.82);color:#9fe3f7;font:750 9px/1.4 ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;pointer-events:none}
    .stage.is-replay{border-color:color-mix(in srgb,#5ad0f5 45%,#d5dee8);background:color-mix(in srgb,#5ad0f5 8%,#eef3f7)}
    .mq{position:absolute;z-index:3;display:none;pointer-events:none;box-sizing:border-box;border:2px solid #5ad0f5;background:rgba(90,208,245,.18);transition:width .7s cubic-bezier(.16,1,.3,1),height .7s cubic-bezier(.16,1,.3,1),left .7s cubic-bezier(.16,1,.3,1),top .7s cubic-bezier(.16,1,.3,1)}
    .mq.is-on{display:block}.mq.is-draw{border-style:dashed}
    .pin{position:absolute;z-index:5;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;background:#1aa3d1;opacity:0;pointer-events:none;box-shadow:0 0 0 3px rgba(26,163,209,.35)}
    .pin.is-on{opacity:1}
    .capsule{position:absolute;left:10px;right:10px;top:6px;z-index:6;display:flex;align-items:center;gap:6px;min-height:26px;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent-strong) 28%,#d5dee8);background:color-mix(in srgb,var(--accent-strong) 10%,#fff);color:var(--accent);font-size:11px;font-weight:650;opacity:0;transform:translateY(-6px) scale(.96);pointer-events:none;transition:opacity .22s ease,transform .22s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s}
    .capsule.is-on{opacity:1;transform:translateY(0) scale(1)}
    .capsule.is-commit{opacity:.55;transform:translateY(2px) scale(.98);background:color-mix(in srgb,var(--ok) 10%,#fff);border-color:color-mix(in srgb,var(--ok) 30%,#d5dee8);color:var(--ok)}
    .capsule.is-skip{opacity:.85;transform:translateY(1px) scale(.98);background:color-mix(in srgb,var(--muted) 12%,#fff);border-color:color-mix(in srgb,var(--muted) 35%,#d5dee8);color:var(--muted)}
    .capsule__mic{flex:0 0 auto;font-size:12px;line-height:1}
    .capsule__status{flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .capsule__waves{display:none;align-items:flex-end;gap:2px;height:12px;margin-left:auto;flex:0 0 auto}
    .capsule.is-listen .capsule__waves,.capsule.is-transcribe .capsule__waves{display:inline-flex}
    .capsule__waves i{display:block;width:2px;border-radius:1px;background:var(--accent-strong);animation:wave .7s ease-in-out infinite}
    .capsule__waves i:nth-child(1){height:4px}.capsule__waves i:nth-child(2){height:8px;animation-delay:.08s}.capsule__waves i:nth-child(3){height:12px;animation-delay:.16s}.capsule__waves i:nth-child(4){height:7px;animation-delay:.24s}.capsule__waves i:nth-child(5){height:5px;animation-delay:.32s}
    .capsule__partial{flex:1 1 auto;min-width:0;margin-left:4px;color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;max-width:0;transition:opacity .18s,max-width .22s}
    .capsule.is-transcribe .capsule__partial{opacity:1;max-width:12em}
    .capsule.is-commit .capsule__partial,.capsule.is-skip .capsule__partial{opacity:0;max-width:0}
    .box{position:absolute;left:10px;right:10px;bottom:10px;height:30px;border-radius:8px;border:1.5px solid #cbd5e1;background:#f8fafc;display:flex;align-items:center;gap:5px;padding:0 9px;font-size:12px;color:#94a3b8;transition:border-color .2s,box-shadow .2s,background .2s,transform .12s}
    .box.is-focus{border-color:var(--accent-strong);background:#fff;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-strong) 18%,transparent)}
    .box.is-press{transform:scale(.985);border-color:var(--accent-strong);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-strong) 28%,transparent)}
    .box.is-probe{border-color:#f0c2be;box-shadow:0 0 0 2px rgba(180,35,24,.12);animation:probePulse .9s ease-in-out 1}
    .box.is-probe-ok{border-color:color-mix(in srgb,var(--ok) 55%,#cbd5e1);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 18%,transparent);animation:probeOkPulse .9s ease-in-out 1}
    .box.is-miss{border-color:#e8b4b0;opacity:.85}
    .box.is-dim{opacity:.42;filter:grayscale(.15)}
    .spot{position:absolute;left:54%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent-strong);opacity:0}
    .spot.is-rec{opacity:1;background:var(--warn);animation:spotRec 1s ease infinite}
    .spot.is-on{opacity:.9;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-strong) 22%,transparent)}
    .stage.is-replay .spot.is-on{animation:spotReplay 1.1s ease infinite}
    .caret{width:1.5px;height:13px;background:var(--accent);opacity:0;flex:0 0 auto}
    .caret.is-on{opacity:1;animation:blink .9s step-end infinite}
    .typed{color:var(--ink);font-weight:650;white-space:nowrap}.ph{opacity:.5}.ph.is-hide{display:none}
    .pointer{position:absolute;width:14px;height:14px;z-index:4;border-radius:50% 50% 50% 0;background:#13202c;transform:rotate(-45deg) scale(.7);opacity:0;margin-left:-2px;margin-top:-2px;transition:left .7s cubic-bezier(.16,1,.3,1),top .7s cubic-bezier(.16,1,.3,1),opacity .18s,transform .14s,background .15s;box-shadow:0 1px 3px rgba(0,0,0,.28)}
    .pointer.is-show{opacity:1;transform:rotate(-45deg) scale(1)}.pointer.is-press{transform:rotate(-45deg) scale(.78);opacity:1}
    .pointer.is-rec{background:var(--accent);box-shadow:0 0 0 3px rgba(90,208,245,.35),0 1px 3px rgba(0,0,0,.28)}
    .pointer.is-replay{background:#1aa3d1;box-shadow:0 0 0 3px rgba(26,163,209,.3),0 1px 3px rgba(0,0,0,.28)}
    .ripple{position:absolute;width:12px;height:12px;border-radius:50%;border:2.5px solid #5ad0f5;opacity:0;z-index:3;transform:translate(-50%,-50%) scale(.35)}
    .ripple.is-on{animation:ripple .7s ease-out forwards}
    .clickLbl{position:absolute;z-index:5;transform:translate(-50%,-100%);padding:2px 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;font-weight:750;opacity:0;white-space:nowrap}
    .clickLbl.is-rec{background:var(--accent)}.clickLbl.is-replay{background:#1aa3d1}
    .clickLbl.is-on{animation:clickPop .9s ease forwards}
    .mark{position:absolute;right:12px;bottom:14px;font-size:16px;opacity:0;transform:scale(.85)}.mark.is-on{opacity:1;transform:scale(1)}
    .say{margin:10px 0 0;min-height:1.4em;font-size:13px;font-weight:650;line-height:1.4}
    .say.is-ok{color:var(--ok)}.say.is-warn{color:var(--warn)}.say.is-muted{color:var(--muted);font-weight:550}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes ripple{0%{opacity:.95;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.6)}}
    @keyframes clickPop{0%{opacity:0;transform:translate(-50%,-100%) scale(.9)}15%,72%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-100%) scale(.96)}}
    @keyframes wave{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    @keyframes spotRec{0%,100%{box-shadow:0 0 0 0 rgba(90,208,245,.4);transform:scale(1)}50%{box-shadow:0 0 0 6px transparent;transform:scale(1.15)}}
    @keyframes spotReplay{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,#5ad0f5 40%,transparent);transform:scale(1)}50%{box-shadow:0 0 0 6px color-mix(in srgb,#5ad0f5 12%,transparent);transform:scale(1.12)}}
    @keyframes probePulse{0%,100%{box-shadow:0 0 0 2px rgba(180,35,24,.12)}50%{box-shadow:0 0 0 4px rgba(180,35,24,.22)}}
    @keyframes probeOkPulse{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 18%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 28%,transparent)}}
  </style>
</head>
<body>
  <div class="page">
    <h1>对准演示 · 语音输入</h1>
    <p class="lead">四种策略：智能填入 · 先对准再填入 · 直接填入 · 只在已对准时填。</p>
    <div class="tabs">
      <button type="button" class="tab is-on" data-mode="smart">智能填入</button>
      <button type="button" class="tab" data-mode="auto">先对准，再填入</button>
      <button type="button" class="tab" data-mode="none">直接填入</button>
      <button type="button" class="tab" data-mode="probe">只在已对准时填</button>
    </div>
    <p class="hint" id="hint">推荐 · 不录制；自动识别输入框并激活，再写入</p>
    <div class="card">
      <ol class="beats" id="beats"></ol>
      <div class="rec" id="rec">已记住位置 · 可复用</div>
      <div class="stage" id="stage">
        <div class="capsule" id="capsule" aria-hidden="true">
          <span class="capsule__mic">🎙</span>
          <span class="capsule__status" id="capStatus"></span>
          <span class="capsule__waves" id="capWaves"><i></i><i></i><i></i><i></i><i></i></span>
          <span class="capsule__partial" id="capPartial"></span>
        </div>
        <div class="box" id="box">
          <span class="spot" id="spot"></span>
          <span class="caret" id="caret"></span>
          <span class="typed" id="typed"></span>
          <span class="ph" id="ph">聊天输入框</span>
        </div>
        <span class="mq" id="mq"></span>
        <span class="pin" id="pin"></span>
        <span class="clickLbl" id="clickLbl">圈住</span>
        <span class="pointer" id="pointer"></span>
        <span class="ripple" id="ripple"></span>
        <span class="mark" id="mark"></span>
      </div>
      <p class="say is-muted" id="say">准备演示…</p>
    </div>
  </div>
  <script>
(function(){
  var SAMPLE='继续改这里';
  var HINT={
    smart:'推荐 · 不录制；自动识别输入框并激活，再写入（找不到才用其它兜底）',
    auto:'先圈住聊天输入框再点一下；之后说话会回放同一落点再填入（辅助）',
    none:'不激活输入框；文字直接写到当前光标处',
    probe:'只有已经点进聊天输入框才写入；否则这轮先跳过（演示会交替两种情况）'
  };
  var STORIES={
    smart:{beats:[
      {icon:'🎙',label:'开始语音输入'},
      {icon:'◎',label:'自动识别输入框'},
      {icon:'☝',label:'激活输入框'},
      {icon:'✅',label:'填入完成'}
    ],endCls:'is-ok',mark:'✅'},
    auto:{beats:[
      {icon:'🎙',label:'开始语音输入'},
      {icon:'☝',label:'回放动作 · 点进输入框'},
      {icon:'〰',label:'语音输入中'},
      {icon:'✅',label:'填入完成'}
    ],setup:'⏺ 圈住输入框 · 再点一下（一次，之后复用）',endCls:'is-ok',mark:'✅'},
    none:{beats:[
      {icon:'🎙',label:'开始语音输入'},
      {icon:'〰',label:'语音输入中'},
      {icon:'✅',label:'写到光标处'}
    ],endCls:'is-ok',mark:'✅'},
    probeMiss:{beats:[
      {icon:'↖',label:'还没点进输入框'},
      {icon:'🎙',label:'开始语音输入'},
      {icon:'🔍',label:'检查还没对准'},
      {icon:'⏭',label:'这轮先跳过'}
    ],endCls:'is-muted',mark:'⏭'},
    probeHit:{beats:[
      {icon:'✎',label:'已点进输入框'},
      {icon:'🎙',label:'开始语音输入'},
      {icon:'🔍',label:'检查已对准'},
      {icon:'✅',label:'填入完成'}
    ],endCls:'is-ok',mark:'✅'}
  };
  var mode='smart', recorded=false, probeHit=false, timers=[];
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),box=$('box'),caret=$('caret'),typed=$('typed'),ph=$('ph');
  var pointer=$('pointer'),ripple=$('ripple'),clickLbl=$('clickLbl'),mark=$('mark');
  var capsule=$('capsule'),capStatus=$('capStatus'),capPartial=$('capPartial');
  var mq=$('mq'),pin=$('pin');
  var spot=$('spot'),say=$('say'),beatsEl=$('beats'),rec=$('rec'),hint=$('hint');
  function story(){return mode==='probe'?(probeHit?STORIES.probeHit:STORIES.probeMiss):(STORIES[mode]||STORIES.auto)}
  function clear(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[]}
  function later(ms,fn){timers.push(setTimeout(fn,ms))}
  function paintBeats(){
    var s=story();beatsEl.innerHTML='';
    for(var i=0;i<s.beats.length;i++){
      var li=document.createElement('li');li.className='beat';
      li.innerHTML='<span>'+s.beats[i].icon+'</span><span>'+s.beats[i].label+'</span>';
      beatsEl.appendChild(li);
    }
    hint.textContent=HINT[mode];
    stage.setAttribute('data-mode',mode);
    rec.classList.toggle('is-on', mode==='auto' && recorded);
  }
  function setBeat(i){
    var items=beatsEl.querySelectorAll('.beat');
    for(var n=0;n<items.length;n++){items[n].classList.toggle('is-on',n===i);items[n].classList.toggle('is-done',n<i)}
  }
  function sayAt(i,cls){
    var s=story(),b=s.beats[i];
    var line=b.icon+' '+b.label;
    if(i===s.beats.length-1){
      if(mode==='smart') line='✅ 智能填入完成';
      else if(mode==='auto') line='✅ 填入完成';
      else if(mode==='none') line='✅ 写到光标处';
      else if(s.endCls==='is-ok') line='✅ 已对准 · 填入';
      else line='⏭ 还没对准 · 这轮先跳过';
    }
    say.textContent=line;
    say.className='say '+(cls||(i===s.beats.length-1?s.endCls:''));
    setBeat(i);
  }
  function sayText(t,cls){say.textContent=t;say.className='say '+(cls||'')}
  function showMark(){mark.textContent=story().mark;mark.className='mark is-on'}
  function setCapsule(state,statusText,partialText){
    capsule.className='capsule'+(state?' is-on is-'+state:'');
    capStatus.textContent=statusText||'';
    capPartial.textContent=partialText||'';
  }
  function mqAround(){
    var sr=stage.getBoundingClientRect(),br=box.getBoundingClientRect(),pad=7;
    return{l:br.left-sr.left-pad,t:br.top-sr.top-pad,r:br.right-sr.left+pad,b:br.bottom-sr.top+pad};
  }
  function placeMq(rect,on){
    if(!on||!rect){mq.classList.remove('is-on','is-draw');mq.style.cssText='';return}
    mq.style.left=Math.round(rect.l)+'px';mq.style.top=Math.round(rect.t)+'px';
    mq.style.width=Math.max(0,Math.round(rect.r-rect.l))+'px';mq.style.height=Math.max(0,Math.round(rect.b-rect.t))+'px';
    mq.classList.add('is-on');
  }
  function placePin(p,on){
    if(!on||!p){pin.classList.remove('is-on');pin.style.left='';pin.style.top='';return}
    pin.style.left=p.x+'px';pin.style.top=p.y+'px';pin.classList.add('is-on');
  }
  function reset(){
    box.classList.remove('is-focus','is-probe','is-probe-ok','is-miss','is-press','is-dim');
    caret.classList.remove('is-on');typed.textContent='';ph.classList.remove('is-hide');
    pointer.classList.remove('is-show','is-press','is-rec','is-replay');pointer.style.left='';pointer.style.top='';
    ripple.classList.remove('is-on');
    clickLbl.classList.remove('is-on','is-rec','is-replay');clickLbl.textContent='圈住';
    spot.classList.remove('is-on','is-rec');
    placeMq(null,false);placePin(null,false);
    stage.classList.remove('is-rec','is-replay');
    setCapsule('','','');
    mark.textContent='';mark.className='mark';
    rec.classList.toggle('is-on', mode==='auto' && recorded);
    if(recorded && mode==='auto'){placeMq(mqAround(),true);placePin(pt(.55),true)}
    setBeat(-1);
  }
  function pt(r){var sr=stage.getBoundingClientRect(),br=box.getBoundingClientRect();return{x:br.left-sr.left+br.width*(r==null?.55:r),y:br.top-sr.top+br.height*.5}}
  function offPt(){return{x:22,y:48}}
  function showPtr(p,on){pointer.style.left=p.x+'px';pointer.style.top=p.y+'px';pointer.classList.toggle('is-show',!!on)}
  function clickAt(p,text,kind){
    if(text) clickLbl.textContent=text;
    clickLbl.classList.remove('is-rec','is-replay');
    if(kind==='rec') clickLbl.classList.add('is-rec');
    if(kind==='replay') clickLbl.classList.add('is-replay');
    clickLbl.style.left=p.x+'px';clickLbl.style.top=Math.max(14,p.y-22)+'px';
    clickLbl.classList.remove('is-on');void clickLbl.offsetWidth;clickLbl.classList.add('is-on');
    ripple.classList.remove('is-on');ripple.style.left=p.x+'px';ripple.style.top=p.y+'px';void ripple.offsetWidth;ripple.classList.add('is-on');
  }
  function typeInto(el,text,ms,done){var i=0;el.textContent='';(function tick(){if(i>=text.length){if(done)done();return}el.textContent+=text.charAt(i++);later(ms,tick)})()}

  function playStroke(kind,start,end,then){
    var isRec=kind==='rec';
    var rect=mqAround(),dragFrom={x:rect.l,y:rect.t},dragTo={x:rect.r,y:rect.b};
    var clickPt=end||{x:(rect.l+rect.r)/2,y:(rect.t+rect.b)/2};
    pointer.classList.remove('is-rec','is-replay','is-press');
    stage.classList.toggle('is-rec',isRec);stage.classList.toggle('is-replay',!isRec);
    pointer.classList.add(isRec?'is-rec':'is-replay');
    if(isRec){
      sayText('第一步：按住拖动，圈住输入框');
      placePin(null,false);
      placeMq({l:dragFrom.x,t:dragFrom.y,r:dragFrom.x,b:dragFrom.y},true);mq.classList.add('is-draw');
      showPtr(dragFrom,true);clickAt(dragFrom,'圈住','rec');
      later(280,function(){placeMq(rect,true);showPtr(dragTo,true)});
      later(1100,function(){
        mq.classList.remove('is-draw');
        sayText('第二步：在蓝框内点一下精确落点');
        clickAt(clickPt,'点一下','rec');
        showPtr({x:Math.max(dragFrom.x+8,clickPt.x-28),y:Math.max(dragFrom.y+8,clickPt.y-10)},true);
      });
      later(1500,function(){showPtr(clickPt,true)});
      later(1900,function(){pointer.classList.add('is-press');placePin(clickPt,true);clickAt(clickPt,'点一下','rec')});
      later(2600,function(){
        pointer.classList.remove('is-press','is-show','is-rec','is-replay');
        clickLbl.classList.remove('is-on','is-rec','is-replay');
        stage.classList.remove('is-rec','is-replay');
        if(then) then();
      });
      return;
    }
    placeMq(rect,true);placePin(clickPt,true);
    var from=start||{x:Math.max(12,clickPt.x-48),y:Math.max(36,clickPt.y-16)};
    showPtr(from,true);
    later(280,function(){showPtr(clickPt,true)});
    later(1000,function(){
      pointer.classList.add('is-press');box.classList.add('is-press');
      clickAt(clickPt,'回放','replay');placePin(clickPt,true);
    });
    later(1700,function(){
      pointer.classList.remove('is-press','is-show','is-rec','is-replay');
      clickLbl.classList.remove('is-on','is-rec','is-replay');
      stage.classList.remove('is-rec','is-replay');
      box.classList.remove('is-press');box.classList.add('is-focus');caret.classList.add('is-on');
      if(then) then();
    });
  }

  function startCapsule(beatIdx,then){
    sayAt(beatIdx);setCapsule('start','开始语音输入…','');
    later(500,function(){setCapsule('listen','语音输入中…','')});
    later(1100,function(){if(then)then()});
  }

  function capsuleTranscribeAndCommit(beatIdx,then,skipSay){
    if(!skipSay) sayAt(beatIdx);setCapsule('transcribe','语音输入中…','');
    later(350,function(){
      typeInto(capPartial,SAMPLE,90,function(){
        later(380,function(){
          setCapsule('commit','填入中…','');
          ph.classList.add('is-hide');
          box.classList.remove('is-dim','is-miss','is-probe');box.classList.add('is-focus');
          caret.classList.add('is-on');
          typeInto(typed,SAMPLE,70,function(){
            later(320,function(){setCapsule('','','');if(then)then()});
          });
        });
      });
    });
  }

  function autoFindAndActivateBox(then){
    sayAt(1);setCapsule('listen','正在识别输入框…','');
    var end=pt(.55),from=offPt();
    showPtr(from,true);box.classList.add('is-probe-ok');
    later(280,function(){showPtr(end,true)});
    later(900,function(){
      sayAt(2);setCapsule('listen','正在激活…','');
      pointer.classList.add('is-press');box.classList.remove('is-probe-ok');box.classList.add('is-press');
      clickAt(end,'激活','replay');
    });
    later(1400,function(){
      pointer.classList.remove('is-press','is-show','is-rec','is-replay');
      clickLbl.classList.remove('is-on','is-rec','is-replay');
      box.classList.remove('is-press');box.classList.add('is-focus');caret.classList.add('is-on');
      setCapsule('listen','已激活输入框…','');
      if(then) then();
    });
  }

  function runSmart(){
    placeMq(null,false);placePin(null,false);
    startCapsule(0,function(){
      autoFindAndActivateBox(function(){
        capsuleTranscribeAndCommit(3,function(){
          sayAt(3,'is-ok');showMark();later(2400,restart);
        },true);
      });
    });
  }

  function runAutoRuntime(){
    var end=pt(.55),start={x:Math.max(16,end.x-56),y:Math.max(36,end.y-18)};
    startCapsule(0,function(){
      sayAt(1);setCapsule('listen','语音输入中…','');
      playStroke('replay',start,end,function(){
        capsuleTranscribeAndCommit(2,function(){
          sayAt(3,'is-ok');showMark();later(2400,restart);
        });
      });
    });
  }

  function runAuto(){
    var end=pt(.55),start={x:Math.max(16,end.x-56),y:Math.max(36,end.y-18)};
    if(!recorded){
      setBeat(-1);sayText(STORIES.auto.setup);
      playStroke('rec',start,end,function(){
        recorded=true;rec.classList.add('is-on');
        sayText('已记住位置 · 之后会点回同一处','is-ok');
        later(1100,function(){reset();runAutoRuntime()});
      });
      return;
    }
    runAutoRuntime();
  }

  function runNone(){
    placeMq(null,false);placePin(null,false);
    box.classList.add('is-focus');caret.classList.add('is-on');
    startCapsule(0,function(){
      capsuleTranscribeAndCommit(1,function(){
        sayAt(2,'is-ok');showMark();later(2400,restart);
      });
    });
  }

  function runProbe(){
    placeMq(null,false);placePin(null,false);
    if(probeHit){
      box.classList.add('is-focus');caret.classList.add('is-on');
      sayAt(0);
      later(900,function(){
        startCapsule(1,function(){
          sayAt(2);setCapsule('listen','检查已对准…','');
          box.classList.remove('is-probe','is-miss','is-dim');box.classList.add('is-focus','is-probe-ok');
          later(900,function(){
            box.classList.remove('is-probe-ok');
            capsuleTranscribeAndCommit(2,function(){
              sayAt(3,'is-ok');showMark();
              later(2400,function(){probeHit=false;restart()});
            },true);
          });
        });
      });
      return;
    }
    box.classList.add('is-dim');
    sayAt(0);showPtr(offPt(),true);
    later(1000,function(){
      startCapsule(1,function(){
        sayAt(2);setCapsule('listen','检查还没对准…','');
        pointer.classList.remove('is-show');box.classList.remove('is-dim');box.classList.add('is-probe');
        later(1200,function(){
          box.classList.remove('is-probe');box.classList.add('is-miss');
          setCapsule('skip','还没对准 · 这轮先跳过','');
          sayAt(3,'is-muted');showMark();
          later(2400,function(){probeHit=true;restart()});
        });
      });
    });
  }

  function restart(){
    clear();reset();paintBeats();
    if(mode==='smart') runSmart();
    else if(mode==='none') runNone();
    else if(mode==='probe') runProbe();
    else runAuto();
  }

  document.querySelectorAll('.tab').forEach(function(btn){
    btn.addEventListener('click',function(){
      mode=btn.getAttribute('data-mode')||'smart';
      recorded=false;probeHit=false;
      document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('is-on',b===btn)});
      restart();
    });
  });
  restart();
})();
  </script>
</body>
</html>
