<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone · 可选择的共创台</title><style>

.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.toast{transition:none}}@media(max-width:800px){.mt{padding:16px 12px 90px}.mt-grid{grid-template-columns:1fr}.shelf,.bench{min-height:auto}.bench{padding:25px 20px}.selection{grid-template-columns:1fr}.plus{text-align:center}.tm{padding:18px 12px 90px}.time-page{padding:26px 20px}.record{grid-template-columns:1fr}.action-grid{grid-template-columns:repeat(2,1fr)}.action-tile:last-child{grid-column:1/-1}.choices{grid-template-columns: </style></head><body><div id="stage"></div><nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">材料 × 工具</button><button class="proto-picker-item">过去 × 现在 × 接下来</button><button class="proto-picker-item">先选行动</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
const materialTool=()=>`<main class="mt"><header class="mt-head"><div class="brand">一声 OneTone</div><small>先拿材料，再选工具</small></header><div class="mt-grid"><aside class="shelf"><h2>材料架</h2><p>选择你想处理的东西</p><div class="shelf-group"><h3>手边</h3><button class="item selected" data-mat="voice-pilot"><b>voice-pilot</b><small>当前项目</small></button><button class="item" data-mat="4 个变化文件"><b>4 个变化文件</b><small>14:32 更新</small></button><button class="item" data-mat="首页截图"><b>首页截图</b><small>刚刚保存</small></button></div><div class="shelf-group"><h3>过去</h3><button class="item" data-mat="Codex 最近会话"><b>Codex 最近会话</b><small>没有可靠标题</small></button><button class="item" data-mat="昨天的工作记录"><b>昨天的工作记录</b><small>7 条事实</small></button></div></aside><section class="bench"><span class="bench-label">工作面</span><h1>把材料和工具放到一起</h1><p class="bench-copy">OneTone 不替你判断任务，只帮你把可用的东西放到手边。</p><div class="selection"><div class="selection-card"><span>材料</span><b id="mtMaterial">voice-pilot</b></div><div class="plus">＋</div><div class="selection-card"><span>工具</span><b id="mtTool">输入</b></div></div><div class="work-area"><h2 id="mtPrompt">给 voice-pilot 写下一条要求</h2><textarea aria-label="工作内容" placeholder="输入要求、判断或记录……"></textarea></div><div class="bench-actions"><button class="btn primary" data-act="已放到工作面">放到工作面</button><button class="btn" data-act="已保存这次组合">保存组合</button></div></section><aside class="shelf"><h2>工具架</h2><p>选择你准备怎么处理</p><div class="shelf-group"><h3>表达</h3><button class="item tool-item selected" data-tool="输入"><b>输入</b><small>打字、粘贴、文件</small></button><button class="item tool-item" data-tool="说话"><b>说话</b><small>语音输入</small></button><button class="item tool-item" data-tool="记录"><b>记录</b><small>笔记、收藏、待办</small></button></div><div class="shelf-group"><h3>处理</h3><button class="item tool-item" data-tool="查看"><b>查看</b><small>变化、预览、历史</small></button><button class="item tool-item" data-tool="操作"><b>操作</b><small>暂停、继续、确认</small></button></div></aside></div></main>`;
const time=()=>`<main class="tm"><div class="tm-shell"><header class="tm-head"><div><h1>你想处理哪个时间？</h1><p>过去用来找回，现在用来动手，接下来用来安排。</p></div><div class="brand">OneTone</div></header><nav class="time-nav"><button data-time="past"><b>过去</b>找回和查看</button><button class="on" data-time="now"><b>现在</b>输入和操作</button><button data-time="future"><b>接下来</b>记录和规划</button></nav><section class="time-page" data-page="past"><div class="time-lead"><div><h2>找回做过的事</h2><p>这里展示记录，不替你总结任务。</p></div><div class="time-tools"><button data-act="搜索历史">搜索</button><button data-act="比较版本">比较</button></div></div><div class="records"><div class="record"><time>昨天</time><div><b>Codex 会话</b><small>voice-pilot · 11 条活动</small></div><button data-act="打开历史会话">打开</button></div><div class="record"><time>周一</time><div><b>首页文件变化</b><small>6 个文件 · 有截图</small></div><button data-act="查看历史变化">查看</button></div><div class="record"><time>9 月 28 日</time><div><b>可恢复版本</b><small>构建通过 · 用户已保留</small></div><button data-act="查看可恢复版本">查看</button></div></div></section><section class="time-page on" data-page="now"><div class="time-lead"><div><h2>使用手边的材料和工具</h2><p>当前项目来自前台窗口，是否相关由你决定。</p></div><div class="time-tools"><button data-act="开始说话">说话</button><button data-act="打开 Soft Pad">Soft Pad</button></div></div><div class="records"><div class="record"><time>材料</time><div><b>voice-pilot</b><small>当前项目 · 4 个文件变化</small></div><button data-act="打开当前项目">打开</button></div><div class="record"><time>机器</time><div><b>Codex 有新活动</b><small>没有可靠任务标题</small></div><button data-act="打开 Codex">查看</button></div><div class="record"><time>事实</time><div><b>类型检查结束</b><small>退出码 0 · 14:32</small></div><button data-act="查看命令记录">记录</button></div></div></section><section class="time-page" data-page="future"><div class="time-lead"><div><h2>把下一步留给未来</h2><p>计划由你写，系统负责保存和提醒。</p></div></div><div class="future-note"><input aria-label="写下下一步" placeholder="下一步准备做什么？"><div class="plan-chips"><button data-act="关联当前项目">关联 voice-pilot</button><button data-act="关联当前变化">关联 4 个变化文件</button><button data-act="交给 Codex">交给 Codex</button><button data-act="设为稍后提醒">稍后提醒</button></div><div class="bench-actions" style="margin-top:30px"><button class="btn primary" data-act="已保存下一步">保存下一步</button></div></div></section></div></main>`;
const actions=()=>`<main class="ac"><div class="ac-shell"><header class="ac-head"><div><h1>现在准备做什么？</h1><p>先选行动，再选择材料和操作方式。</p></div><span class="context-pill">当前：voice-pilot</span></header><nav class="action-grid"><button class="action-tile on" data-kind="input"><b>输入</b><small>增加要求和材料</small></button><button class="action-tile" data-kind="view"><b>查看</b><small>理解变化和记录</small></button><button class="action-tile" data-kind="control"><b>操作</b><small>控制 Agent</small></button><button class="action-tile" data-kind="record"><b>记录</b><small>保存人的判断</small></button><button class="action-tile" data-kind="plan"><b>规划</b><small>安排下一步</small></button></nav><section class="action-work"><h2 id="acTitle">增加一条新的内容</h2><p id="acCopy">选择要输入到哪里，再选择打字、说话或添加材料。</p><div class="choices" id="acChoices"><button class="choice" data-act="选择当前项目"><b>当前项目</b><small>voice-pilot</small></button><button class="choice" data-act="选择 Codex 会话"><b>Codex 会话</b><small>有新活动</small></button><button class="choice" data-act="创建独立记录"><b>独立记录</b><small>不关联 Agent</small></button></div><div class="selected-material"><span>手边材料</span><b>voice-pilot · 4 个变化文件 · 首页截图</b></div><div class="channel-row" id="acChannels"><span>怎么输入</span><button data-act="打开文字输入">打字</button><button data-act="开始语音输入">说话</button><button data-act="粘贴剪贴板">粘贴</button><button data-act="选择文件">文件</button><button data-act="添加截图">截图</button></div></section></div></main>`;
const variants=[materialTool,time,actions];
const actionInfo={input:['增加一条新的内容','选择要输入到哪里，再选择打字、说话或添加材料。',['当前项目','Codex 会话','独立记录'],['打字','说话','粘贴','文件','截图']],view:['查看已有内容','选择想了解的材料，再打开变化、预览、历史或原始记录。',['文件变化','页面预览','过去记录'],['看变化','打开预览','查看原始数据']],control:['控制正在运行的工具','只显示当前真实可用的操作，不推断任务是否应该继续。',['Codex','Claude','Soft Pad'],['暂停','继续','确认','切换']],record:['保存你的判断','把结论、疑问或决定写下来，机器只负责保存。',['当前项目','当前变化','独立笔记'],['记一句','收藏','标记待办']],plan:['安排接下来要做的事','计划由你决定，可以关联材料、Agent 和提醒时间。',['下一步','待验证结果','以后再做'],['写计划','关联材料','稍后提醒']]};
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>stage.innerHTML=variants[i]())}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);j===i?el.setAttribute('aria-current','true'):el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
const toast=document.getElementById('toast');let timer;function show(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1600)}document.addEventListener('click',e=>{const act=e.target.closest('[data-act]');if(act){show(act.dataset.act);return}const mat=e.target.closest('[data-mat]');if(mat){document.querySelectorAll('[data-mat]').forEach(x=>x.classList.toggle('selected',x===mat));document.getElementById('mtMaterial').textContent=mat.dataset.mat;show('已选择材料');return}const tool=e.target.closest('[data-tool]');if(tool){document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('selected',x===tool));document.getElementById('mtTool').textContent=tool.dataset.tool;document.getElementById('mtPrompt').textContent=tool.dataset.tool==='查看'?'选择想查看的内容':tool.dataset.tool==='操作'?'选择可以执行的控制':tool.dataset.tool+'到 '+document.getElementById('mtMaterial').textContent;show('已选择工具');return}const timeBtn=e.target.closest('[data-time]');if(timeBtn){document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('on',x===timeBtn));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===timeBtn.dataset.time));return}const kind=e.target.closest('[data-kind]');if(kind){document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('on',x===kind));const info=actionInfo[kind.dataset.kind];document.getElementById('acTitle').textContent=info[0];document.getElementById('acCopy').textContent=info[1];document.getElementById('acChoices').innerHTML=info[2].map(x=>`<button class="choice" data-act="选择${x}"><b>${x}</b><small>点击选择</small></button>`).join('');document.getElementById('acChannels').innerHTML='<span>可用方式</span>'+info[3].map(x=>`<button data-act="${x}">${x}</button>`).join('')}});
</script></body></html>
