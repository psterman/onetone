<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneTone · Agent 通道关联原型</title>
  <style>
    :root{--ink:#102d4d;--muted:#6d8298;--line:#dbe5ec;--paper:#fbfaf7;--panel:#fff;--blue:#147fc4;--teal:#087f7c;--amber:#b87918;--red:#bd5d5d;--soft-blue:#eaf6fd;--soft-teal:#e9f8f4;--soft-amber:#fff4df;--soft-red:#fff0ee;--shadow:0 16px 36px rgba(17,53,82,.08)}
    *{box-sizing:border-box} body{margin:0;background:#eaf1f5;color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
    button,select{font:inherit} button{cursor:pointer}.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
    aside{background:#f8fbfc;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;gap:10px;align-items:center;padding:0 8px}.brand-mark{width:34px;height:34px;border-radius:11px;background:#102b4a;color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted);font-size:11px}.search{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;color:var(--muted)}nav{display:grid;gap:5px}nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;color:#5a728a}nav button.active,nav button:hover{background:#dff2ff;color:#0878bd;font-weight:700}.side-foot{margin-top:auto;padding:12px;color:#91a4b3;font-size:12px}
    main{padding:28px 34px 50px;max-width:1280px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{color:var(--teal);font-weight:800;letter-spacing:.02em}.topbar h1{font-size:27px;line-height:1.2;margin:5px 0}.topbar p{margin:0;color:var(--muted)}.help{border:1px solid #b8d5e8;background:#fff;color:var(--blue);border-radius:10px;padding:9px 13px;font-weight:700}
    .hero{display:flex;justify-content:space-between;gap:20px;align-items:center;background:var(--ink);color:#fff;border-radius:20px;padding:23px 26px;box-shadow:var(--shadow);margin-bottom:20px}.hero h2{margin:0 0 4px;font-size:20px}.hero p{margin:0;color:#c4d4e3}.hero-kpi{display:flex;gap:25px;text-align:right}.hero-kpi strong{display:block;font-size:25px}.hero-kpi span{font-size:12px;color:#bed0df}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:#5e7488;border-radius:999px;padding:7px 12px}.filter.active{border-color:#9fcfe9;background:var(--soft-blue);color:#0878bd;font-weight:700}.select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:var(--ink)}
    .roster{display:grid;gap:10px}.agent{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(17,53,82,.03)}.agent-main{display:grid;grid-template-columns:minmax(210px,1.3fr) 1fr 190px auto;gap:18px;align-items:center;padding:17px 20px}.identity{display:flex;gap:12px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;background:#35aa78;margin-top:7px;box-shadow:0 0 0 4px #e6f6ef}.dot.idle{background:#a9bac7;box-shadow:0 0 0 4px #eef2f4}.name{font-size:16px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin-top:2px}.project{color:#4d687f}.project b{display:block;color:var(--ink);font-weight:700}.cap{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;white-space:nowrap}.confirm{background:var(--soft-teal);color:#08746e}.best{background:var(--soft-amber);color:#a56a10}.unknown{background:#eef2f5;color:#65798b}.unsupported{background:var(--soft-red);color:#ae5b5b}.pending{font-size:11px;color:#9b7a37}.channels{display:flex;gap:5px;flex-wrap:wrap}.channel{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 7px;font-size:11px;color:#5b7186}.channel.bound{border-color:#b9e6d8;background:#f0fbf7;color:#187b6d}.channel.unbound{border-style:dashed;color:#8b9baa}.channel.off{background:#f5f6f7;color:#9aa6af}.row-actions{display:flex;align-items:center;gap:6px}.row-actions button{border:1px solid var(--line);background:#fff;color:#527089;border-radius:8px;padding:7px 9px}.row-actions button.primary{background:#edf8f8;border-color:#b9e4df;color:#087b77}.row-actions .chevron{border:0;font-size:19px;color:#7790a2;padding:3px 6px}.details{border-top:1px solid var(--line);background:#fbfdfe;padding:20px;display:none}.agent.open .details{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}.context{border-right:1px solid var(--line);padding-right:20px}.context h3,.routes h3{margin:0 0 10px;font-size:14px}.context p{margin:7px 0;color:#567087}.context strong{color:var(--ink)}.routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.routes h3{grid-column:1/-1}.route{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.route-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.route h4{margin:0;font-size:14px}.route small{color:var(--muted)}.route p{margin:9px 0;color:#587086;font-size:12px}.route button{border:0;background:transparent;color:var(--blue);padding:0;font-weight:700}.mapping{display:inline-block;background:#f0f4f7;border-radius:6px;padding:3px 6px;color:#556e82;font-size:12px}.toast{position:fixed;right:24px;bottom:24px;background:#102d4d;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:15px}
    @media(max-width:980px){.app{grid-template-columns:72px 1fr}aside{padding:18px 8px}.brand div:not(.brand-mark),.search,nav span,.side-foot{display:none}main{padding:22px}.agent-main{grid-template-columns:1fr auto}.project,.cap{grid-column:1/-1}.row-actions{grid-column:2;grid-row:1}.detail-grid{grid-template-columns:1fr}.context{border-right:0;border-bottom:1px solid var(--line);padding:0 0 15px}.routes{grid-template-columns:1fr}}
    .quick-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.quick-actions button{border:1px solid #b9d9e8;background:#f5fbfe;color:#126b9c;border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700}.quick-actions button.best-action{border-color:#e9ca91;background:#fff8ea;color:#a56a10}.quick-actions button:disabled{border-color:#e2e7eb;background:#f5f6f7;color:#a0adb6;cursor:not-allowed}
    @media(max-width:600px){main{padding:16px}.hero{display:block}.hero-kpi{text-align:left;margin-top:16px}.toolbar{align-items:flex-start;flex-direction:column}.agent-main{padding:15px}.routes{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="brand"><div class="brand-mark">◒</div><div><strong>一声 OneTone</strong><small>让 Agent 真正可用</small></div></div><div class="search">⌕　搜索功能或设置…</div><nav><button class="active">⌂ <span>首页</span></button><button>☷ <span>我的习惯</span></button><button>⌨ <span>按键设置</span></button><button>▦ <span>虚拟键盘</span></button><button>♙ <span>Agent</span></button><button>▥ <span>数据</span></button><button>♩ <span>语音设置</span></button><button>▣ <span>摄像头</span></button></nav><div class="side-foot">原型 · Agent × 通道关联</div></aside>
    <main>
      <header class="topbar"><div><div class="eyebrow">Agent 工作台</div><h1>先选 Agent，再决定怎么控制它</h1><p>首页把状态、能力和通道放在同一条上下文里。</p></div><button class="help" data-toast="这是独立原型，不会修改真实设置">原型说明</button></header>
      <section class="hero"><div><h2>你的 Agent 都连接在哪里？</h2><p>从工作状态开始，再看它能通过哪些通道响应。</p></div><div class="hero-kpi"><div><strong id="agentCount">4</strong><span>已发现</span></div><div><strong id="boundCount">8</strong><span>已关联通道</span></div></div></section>
      <div class="toolbar"><div class="filters" role="group" aria-label="筛选 Agent"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="working">正在工作</button><button class="filter" data-filter="confirmable">可确认控制</button><button class="filter" data-filter="best">尽力控制</button><button class="filter" data-filter="unbound">有未绑定通道</button></div><select class="select" id="sort"><option value="attention">按需关注排序</option><option value="name">按名称排序</option></select></div>
      <section class="roster" id="roster"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const channels=[['key','按键'],['voice','语音'],['softPad','Soft Pad'],['camera','摄像头']];
    const agents=[
      {id:'claude',name:'Claude Confirmable',state:'working',project:'voice-pilot',cap:'confirmable',accept:'pending',mapping:'Claude 主工作流',mappingId:'map-claude-main',source:'官方会话证据',context:'正在整理首页 Agent 通道关联方案。',channels:{key:['bound','停止 · 1'],voice:['bound','停止 · 1'],softPad:['unbound','未绑定'],camera:['off','不支持']},actions:['停止','继续','聚焦']},
      {id:'codex',name:'Codex',state:'working',project:'OneTone',cap:'confirmable',accept:'pending',mapping:'Codex 默认工作流',mappingId:'map-codex-main',source:'App Server + native',context:'正在检查首页改造后的构建验证结果。',channels:{key:['bound','停止 · 1'],voice:['unbound','未绑定'],softPad:['bound','停止 · 1'],camera:['unbound','未绑定']},actions:['停止','继续','聚焦']},
      {id:'cursor',name:'Cursor',state:'working',project:'voice-pilot',cap:'best',accept:'na',mapping:'Cursor 热键映射',mappingId:'map-cursor-hotkey',source:'热键 · 无可靠后验',context:'发送停止后需要你自行确认窗口状态。',channels:{key:['bound','停止 · 1'],voice:['unbound','未绑定'],softPad:['bound','聚焦 · 1'],camera:['off','不可用']},actions:['停止（尽力）','聚焦']},
      {id:'unknown',name:'Other Agent',state:'idle',project:'—',cap:'unknown',accept:'na',mapping:'未关联 mapping',mappingId:'',source:'本机检测尚未接入',context:'已发现，但当前无法判断工作状态或控制方式。',channels:{key:['unbound','未绑定'],voice:['off','尚未接入'],softPad:['unbound','未绑定'],camera:['off','尚未接入']},actions:[]}
    ];
    let filter='all'; const roster=document.getElementById('roster');
    const labels={confirmable:['可确认控制','confirm'],best:['尽力控制','best'],unknown:['尚未接入','unknown'],unsupported:['不支持','unsupported']};
    function channelHtml(a){return channels.map(([id,label])=>{const [kind,text]=a.channels[id];return `<span class="channel ${kind}" title="${label}：${text}">${label} · ${text}</span>`}).join('')}
    function matches(a){if(filter==='all')return true;if(filter==='working')return a.state==='working';if(filter===a.cap)return true;if(filter==='unbound')return Object.values(a.channels).some(x=>x[0]==='unbound');return false}
    function card(a){const [cap,capClass]=labels[a.cap];const pending=a.accept==='pending'?'<span class="pending">待真实验证</span>':'';return `<article class="agent" data-id="${a.id}"><div class="agent-main"><div class="identity"><span class="dot ${a.state==='idle'?'idle':''}"></span><div><div class="name">${a.name}</div><div class="sub">${a.state==='working'?'正在工作':'状态未知'} · ${a.source}</div></div></div><div class="project"><b>${a.project}</b><span class="sub">${a.context}</span></div><div><div class="cap"><span class="badge ${capClass}">${cap}</span>${pending}</div><div class="channels">${channelHtml(a)}</div></div><div class="row-actions"><button class="primary" data-config="${a.id}">配置</button><button class="chevron" data-open="${a.id}" aria-label="展开详情">⌄</button></div></div><div class="details"><div class="detail-grid"><div class="context"><h3>当前上下文</h3><p><strong>关联 mapping</strong><br><span class="mapping">${a.mapping}</span>${a.mappingId?`<small>　${a.mappingId}</small>`:''}</p><p><strong>控制结果</strong><br>${cap==='尽力控制'?'已发送指令后需自行确认':'具备后验确认路径，但本轮仍待真实验收'}</p><p><strong>验收状态</strong><br>${a.accept==='pending'?'待真实验证':'不适用'}</p><button class="help" data-toast="已复制 ${a.mappingId||'未关联 mapping'}">查看 mapping</button></div><div class="routes"><h3>关联通道</h3>${channels.map(([id,label])=>{const [kind,text]=a.channels[id];const disabled=kind==='off'||!a.mappingId;return `<div class="route"><div class="route-top"><h4>${label}</h4><span class="channel ${kind}">${text}</span></div><p>${disabled?'当前没有可执行的通道入口':a.actions.length?`可用动作：${a.actions.join('、')}`:'暂无已接入动作'}</p>${disabled?'':`<button data-channel="${label}" data-agent="${a.id}">配置 ${label} →</button>`}</div>`}).join('')}</div></div></div></article>`}
    function enhanceCards(){roster.querySelectorAll('.agent').forEach(row=>{const a=agents.find(x=>x.id===row.dataset.id);const identity=row.querySelector('.identity > div');if(!a||!identity||identity.querySelector('.quick-actions'))return;});roster.querySelectorAll('.agent').forEach(row=>{const a=agents.find(x=>x.id===row.dataset.id);const identity=row.querySelector('.identity > div');if(!a||!identity)return;const old=identity.querySelector('.quick-actions');if(old)old.remove();const wrap=document.createElement('div');wrap.className='quick-actions';wrap.setAttribute('aria-label','常用操作');if(!a.actions.length){wrap.innerHTML='<button disabled>暂无可用操作</button>'}else{a.actions.slice(0,3).forEach(action=>{const b=document.createElement('button');b.textContent=action;b.dataset.action=action;b.dataset.agent=a.id;if(a.cap==='best')b.className='best-action';wrap.appendChild(b)})}identity.appendChild(wrap)})}
    function render(){const list=agents.filter(matches);if(!list.length){roster.innerHTML='<div class="empty">没有符合当前筛选的 Agent。<br>可以切换筛选查看未绑定或尚未接入的通道。</div>';return}roster.innerHTML=list.map(card).join('');enhanceCards()}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
    document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===f));render();return}const action=e.target.closest('[data-action]');if(action){const a=agents.find(x=>x.id===action.dataset.agent);toast(`${a.name} · ${action.dataset.action}${a.cap==='best'?'（发送后请自行确认）':'（原型演示）'}`);return}const open=e.target.closest('[data-open]');if(open){const row=document.querySelector(`[data-id="${open.dataset.open}"]`);row.classList.toggle('open');open.textContent=row.classList.contains('open')?'⌃':'⌄';return}const config=e.target.closest('[data-config]');if(config){const a=agents.find(x=>x.id===config.dataset.config);toast(a.mappingId?`将打开 ${a.mapping} 的通道配置（${a.mappingId}）`:'该 Agent 尚未关联 mapping，无法配置');return}const ch=e.target.closest('[data-channel]');if(ch){const a=agents.find(x=>x.id===ch.dataset.agent);toast(`导航至 ${ch.dataset.channel} · mappingId=${a.mappingId}`);return}const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast)});
    document.getElementById('sort').addEventListener('change',e=>toast(e.target.value==='name'?'已按名称排序（原型演示）':'已按需关注排序')); render();
  </script>
</body>
</html>
