<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneTone · 人、机器与数据</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#202826}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(25,119,104,.25);outline-offset:2px}#stage{min-height:100vh}.toast{position:fixed;right:20px;bottom:76px;z-index:99;background:#1d2926;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transform:translateY(6px);transition:opacity .18s ease-out,transform .18s ease-out;pointer-events:none}.toast.show{opacity:1;transform:none}

    /* Variant 1: shared desk */
    .desk{min-height:100vh;background:#e6e9e5;padding:28px}.desk-shell{max-width:1120px;margin:auto;display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px}.desk-side{padding:9px 4px;display:flex;flex-direction:column;min-height:calc(100vh - 56px)}.desk-brand{font-weight:800;font-size:17px}.desk-side nav{display:grid;gap:5px;margin-top:42px}.desk-side nav button{border:0;background:transparent;text-align:left;padding:9px;border-radius:8px;color:#707a76}.desk-side nav button.on{background:rgba(255,255,255,.65);color:#1f2926;font-weight:700}.desk-tip{margin-top:auto;color:#828d89;font-size:12px}.desk-paper{position:relative;background:#fffefa;min-height:760px;padding:38px 42px 80px;border-radius:4px 20px 20px 4px;box-shadow:0 24px 65px rgba(27,43,38,.13)}.desk-paper:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#197768}.desk-title-row{display:flex;justify-content:space-between;gap:18px}.desk-title-row small{color:#78827f}.desk h1{font-size:38px;line-height:1.16;letter-spacing:-.04em;margin:10px 0 0;max-width:650px}.edit-goal{border:0;background:transparent;color:#197768;font-weight:700;white-space:nowrap}.desk-columns{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:46px}.desk-section h2{font-size:13px;color:#74807c;margin:0 0 13px}.tool-list{display:flex;flex-wrap:wrap;gap:8px}.tool{border:1px solid #dbe1de;background:#fff;border-radius:10px;padding:9px 12px;color:#3f504b;font-weight:700}.tool.primary{background:#1f2b28;color:#fff;border-color:#1f2b28}.material{padding:11px 0;border-bottom:1px solid #e3e7e4}.material b{display:block}.material span{color:#7a8581;font-size:12px}.desk-log{margin-top:42px;border-top:1px solid #dce2df;padding-top:18px}.desk-log h2{font-size:13px;color:#74807c}.event{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:8px 0}.event time{color:#8c9692;font-size:12px}.event span{color:#465551}.desk-compose{display:flex;gap:8px;margin-top:30px}.desk-compose input{flex:1;min-width:0;border:1px solid #d8dfdc;border-radius:10px;padding:11px 12px}.desk-compose button{border:0;border-radius:10px;background:#197768;color:#fff;padding:0 16px;font-weight:750}

    /* Variant 2: notebook */
    .book{min-height:100vh;background:#dfe6eb;padding:34px 26px 90px}.book-top{max-width:1080px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center}.book-brand{font-weight:820}.book-top span{color:#65747e;font-size:12px}.notebook{max-width:1080px;min-height:720px;margin:auto;background:#fff;display:grid;grid-template-columns:1fr 1fr;border-radius:6px;box-shadow:0 24px 70px rgba(25,43,54,.15);overflow:hidden}.page{padding:44px 48px;position:relative}.page.left{background:repeating-linear-gradient(#fff 0,#fff 31px,#e8ecee 32px)}.page.left:after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:#d7dddf;box-shadow:7px 0 18px rgba(26,42,50,.08)}.page.right{background:#fbfcfc}.page-label{font-size:12px;color:#75838a;margin-bottom:12px}.hand-goal{font-family:"KaiTi","STKaiti",serif;font-size:31px;line-height:1.45;margin:0;min-height:90px}.book-edit{margin-top:18px;border:0;background:transparent;color:#2b6f92;padding:0;font-weight:700}.note-block{margin-top:44px}.note-block h2,.trace h2{font-size:13px;margin:0 0 12px;color:#718087}.note-input{width:100%;min-height:110px;border:0;background:transparent;resize:none;line-height:32px;outline:0;font-family:"KaiTi","STKaiti",serif;font-size:18px}.trace-row{position:relative;padding:0 0 24px 28px}.trace-row:before{content:"";position:absolute;left:5px;top:6px;width:8px;height:8px;border-radius:50%;background:#2a7580}.trace-row:after{content:"";position:absolute;left:8px;top:19px;bottom:2px;width:1px;background:#ced9da}.trace-row:last-child:after{display:none}.trace-row b{display:block}.trace-row p{margin:3px 0;color:#738087;font-size:13px}.trace-row button{border:0;background:transparent;color:#286e91;padding:4px 0;font-size:12px;font-weight:700}.book-tools{margin-top:34px;padding-top:18px;border-top:1px solid #dce3e4;display:flex;gap:8px;flex-wrap:wrap}.book-tools button{border:1px solid #d7e0e2;background:#fff;border-radius:8px;padding:8px 10px;color:#42575e}

    /* Variant 3: assembly board */
    .board{min-height:100vh;background:#222a2b;color:#edf1ef;padding:30px 28px 95px}.board-head{max-width:1160px;margin:auto;display:flex;justify-content:space-between;align-items:flex-end}.board-head h1{font-size:27px;margin:0}.board-head p{color:#aeb9b6;margin:5px 0 0}.board-head button{border:1px solid #4e5b5b;background:transparent;color:#dce4e1;border-radius:9px;padding:8px 11px}.board-grid{max-width:1160px;margin:24px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.bin{background:#2b3435;border:1px solid #3d4848;border-radius:14px;min-height:450px;padding:16px}.bin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.bin-head h2{font-size:14px;margin:0}.bin-head span{font-size:11px;color:#99a7a4}.piece{background:#f3f5f2;color:#25302d;border-radius:10px;padding:13px;margin-bottom:9px;box-shadow:0 4px 10px rgba(0,0,0,.12)}.piece strong{display:block}.piece small{display:block;color:#697773;margin-top:3px}.piece.action{background:#dcefe8}.piece.fact{background:#e5edf2}.piece.user{background:#fff1ca}.piece button{margin-top:10px;border:0;background:transparent;color:#176f61;padding:0;font-weight:750}.assembly{max-width:1160px;margin:13px auto 0;background:#f6f7f4;color:#202a27;border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.assembly-label{font-size:11px;color:#73807c}.assembly h2{margin:4px 0;font-size:20px}.assembly p{margin:0;color:#6e7a76}.assembly-actions{display:flex;gap:8px}.assembly-actions button{border:1px solid #d6ddda;background:#fff;border-radius:9px;padding:9px 12px;font-weight:700}.assembly-actions button:first-child{background:#1e2b27;color:#fff;border-color:#1e2b27}

    /* Picker: copied from prototype skill spec */
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    @media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.toast{transition:none}}
    @media(max-width:760px){.desk{padding:14px}.desk-shell{grid-template-columns:1fr}.desk-side{min-height:auto;flex-direction:row}.desk-side nav{display:none}.desk-tip{margin:0 0 0 auto}.desk-paper{padding:28px 23px 75px;min-height:760px}.desk-columns{grid-template-columns:1fr;gap:26px}.notebook{grid-template-columns:1fr}.page{padding:32px 27px}.page.left:after{right:auto;left:0;top:auto;bottom:0;width:100%;height:1px}.board{padding:24px 14px 95px}.board-grid{grid-template-columns:1fr}.bin{min-height:auto}.assembly{grid-template-columns:1fr}.assembly-actions{flex-wrap:wrap}.proto-picker-item{padding:0 9px;font-size:12px}}
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">共创桌面</button>
    <button class="proto-picker-item">工作簿</button>
    <button class="proto-picker-item">拼装台</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const desk=()=>`<main class="desk"><div class="desk-shell"><aside class="desk-side"><div class="desk-brand">一声 OneTone</div><nav><button class="on">现在</button><button>过去做过的</button><button>设置</button></nav><div class="desk-tip">Ctrl + Space 说话</div></aside><article class="desk-paper"><div class="desk-title-row"><div><small>我想做</small><h1>让首页更简单，也更容易控制 Agent</h1></div><button class="edit-goal" data-act="修改目标">修改</button></div><div class="desk-columns"><section class="desk-section"><h2>手边可用</h2><div class="tool-list"><button class="tool primary" data-act="向 Codex 提问">问 Codex</button><button class="tool" data-act="开始语音输入">说话</button><button class="tool" data-act="继续 Claude 会话">继续 Claude</button><button class="tool" data-act="打开 Soft Pad">Soft Pad</button></div></section><section class="desk-section"><h2>桌面上的材料</h2><div class="material"><b>voice-pilot</b><span>当前项目 · 来自前台窗口</span></div><div class="material"><b>4 个文件发生变化</b><span>来源：本地工作区</span></div><div class="material"><b>类型检查命令已结束</b><span>退出码 0 · 14:32</span></div></section></div><section class="desk-log"><h2>刚刚发生</h2><div class="event"><time>14:35</time><span>Codex 会话出现新活动</span></div><div class="event"><time>14:32</time><span>类型检查命令结束，退出码为 0</span></div><div class="event"><time>14:28</time><span>首页相关文件发生变化</span></div></section><div class="desk-compose"><input aria-label="写下下一步" placeholder="写下下一步，或按住快捷键说……"><button data-act="记录下一步">记下来</button></div></article></div></main>`;
    const book=()=>`<main class="book"><header class="book-top"><div class="book-brand">OneTone 工作簿</div><span>人写意图，机器与数据留下痕迹</span></header><article class="notebook"><section class="page left"><div class="page-label">我的这一页</div><p class="hand-goal">让首页更简单，也更容易控制 Agent。</p><button class="book-edit" data-act="修改我的目标">修改这句话</button><div class="note-block"><h2>我想记住</h2><textarea class="note-input" aria-label="工作笔记" placeholder="写下判断、疑问或下一步……"></textarea></div><div class="book-tools"><button data-act="开始说话">说话</button><button data-act="打开 Soft Pad">Soft Pad</button><button data-act="暂停当前 Agent">暂停 Agent</button></div></section><section class="page right"><div class="page-label">机器和数据的这一页</div><div class="trace"><h2>今天的记录</h2><div class="trace-row"><b>Codex 有新活动</b><p>没有可靠标题 · 刚刚</p><button data-act="打开 Codex 会话">打开会话</button></div><div class="trace-row"><b>4 个文件发生变化</b><p>来自 voice-pilot 工作区 · 14:32</p><button data-act="查看文件变化">查看变化</button></div><div class="trace-row"><b>类型检查命令结束</b><p>退出码 0 · 14:30</p><button data-act="查看命令记录">查看记录</button></div><div class="trace-row"><b>Claude 会话可以继续</b><p>最近活动于 13:58</p><button data-act="继续 Claude 会话">继续</button></div></div></section></article></main>`;
    const board=()=>`<main class="board"><header class="board-head"><div><h1>一起把东西做出来</h1><p>把人的意图、机器的动作和数据的事实放到同一张台面。</p></div><button data-act="清空本次拼装">清空</button></header><section class="board-grid"><div class="bin"><div class="bin-head"><h2>人</h2><span>定义和判断</span></div><article class="piece user"><strong>我的目标</strong><small>让首页更简单，也更容易控制 Agent</small><button data-act="修改目标">修改</button></article><article class="piece user"><strong>我的决定</strong><small>还没有确认这些变化是否合适</small><button data-act="写下判断">写下判断</button></article></div><div class="bin"><div class="bin-head"><h2>机器</h2><span>提供动作</span></div><article class="piece action"><strong>Codex</strong><small>有新活动，可以打开或暂停</small><button data-act="打开 Codex">打开</button></article><article class="piece action"><strong>语音与按键</strong><small>可以输入要求或控制当前 Agent</small><button data-act="开始说话">开始说话</button></article><article class="piece action"><strong>Soft Pad</strong><small>可以用于确认、暂停和继续</small><button data-act="打开 Soft Pad">打开</button></article></div><div class="bin"><div class="bin-head"><h2>数据</h2><span>只记录事实</span></div><article class="piece fact"><strong>当前项目</strong><small>voice-pilot · 来自前台窗口</small></article><article class="piece fact"><strong>文件变化</strong><small>4 个文件 · 14:32</small></article><article class="piece fact"><strong>命令记录</strong><small>类型检查结束 · 退出码 0</small></article></div></section><section class="assembly"><div><span class="assembly-label">这次要怎么组合？</span><h2>用 Codex 查看文件变化，由我判断是否继续</h2><p>这是用户选择的组合，不是系统推断出的计划。</p></div><div class="assembly-actions"><button data-act="执行这次组合">按这个做</button><button data-act="调整组合">换个组合</button></div></section></main>`;
    const variants=[desk,book,board];

    const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
    document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
    const toast=document.getElementById('toast');let timer;document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;toast.textContent=el.dataset.act;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1700)});
  </script>
</body>
</html>
