<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone · 规范工作流 UI 方向</title>
  <style>
    :root{--bg:#e9ecea;--paper:#fbfbf8;--paper2:#f3f4f0;--ink:#17231f;--ink2:#3e4b46;--muted:#65706c;--line:#d8ddda;--line2:#c5ccc8;--teal:#176d63;--teal2:#dcece7;--teal3:#b9d9d1;--amber:#895817;--amber2:#f6ead8;--red:#94443a;--shadow:0 22px 60px rgba(26,40,35,.13)}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:2px}#stage{min-height:100vh;padding:16px 16px 78px}.app{width:min(1220px,100%);height:min(800px,calc(100vh - 94px));min-height:650px;margin:auto;overflow:hidden;border:1px solid rgba(23,35,31,.09);border-radius:22px;background:var(--paper);box-shadow:var(--shadow);animation:rise .22s cubic-bezier(.16,1,.3,1)}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    .bar{height:61px;padding:0 23px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;font-weight:820}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:var(--ink);color:#bee4dc;font-size:11px}.spacer{flex:1}.bar-btn{min-height:34px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink2);font-weight:700}.bar-btn:hover{background:var(--paper2)}.avatar{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--teal2);color:var(--teal);font-size:11px;font-weight:800}
    .primary{min-height:41px;padding:9px 16px;border:1px solid var(--teal);border-radius:10px;background:var(--teal);color:#fff;font-weight:800;box-shadow:0 4px 12px rgba(23,109,99,.16)}.primary:hover{background:#10584f}.secondary{min-height:38px;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--ink);font-weight:730}.secondary:hover{background:var(--paper2)}.text-btn{border:0;background:transparent;color:var(--teal);font-weight:750}.label{color:var(--muted);font-size:12px;font-weight:700}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font-size:12px;font-weight:700}.chip.on{border-color:var(--teal3);background:var(--teal2);color:var(--teal)}.tag{display:inline-flex;padding:3px 7px;border-radius:999px;background:var(--teal2);color:var(--teal);font-size:10px;font-weight:800}.tag.warn{background:var(--amber2);color:var(--amber)}
    /* Canvas */
    .canvas-main{height:calc(100% - 61px);overflow:auto}.canvas-wrap{width:min(820px,calc(100% - 36px));margin:auto;padding:50px 0 42px}.canvas-head{text-align:center;margin-bottom:25px}.canvas-head p{margin:0 0 7px;color:var(--muted);font-weight:700;font-size:12px}.canvas-head h1{margin:0;font-size:42px;line-height:1.14;letter-spacing:-.045em}.canvas-head .lead{max-width:570px;margin:12px auto 0;color:var(--ink2);font-size:15px;font-weight:400}.workflow-strip{display:flex;justify-content:center;gap:6px;margin-bottom:13px;flex-wrap:wrap}.workflow-strip button{min-height:34px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font-weight:700}.workflow-strip button.on{border-color:var(--teal);background:var(--teal2);color:var(--teal)}.composer{overflow:hidden;border:1px solid var(--line2);border-radius:16px;background:#fff;box-shadow:0 12px 34px rgba(24,38,33,.08)}.composer textarea{width:100%;height:138px;padding:18px 20px;border:0;resize:none;color:var(--ink);font-size:16px;line-height:1.65}.composer textarea::placeholder{color:#838e89}.attach-row{padding:10px 12px;display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);background:#fdfdfb}.attach-row .label{margin:0 4px}.attach{min-height:32px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);font-size:12px;font-weight:700}.attach:hover{background:var(--teal2);color:var(--teal)}.canvas-foot{margin-top:13px;display:flex;align-items:center;gap:10px}.canvas-foot p{flex:1;margin:0;color:var(--muted);font-size:12px}.smart-question{display:none;margin-top:18px;padding:18px;border:1px solid #e3c899;border-radius:14px;background:#fffaf2;animation:rise .2s ease-out}.smart-question.show{display:block}.smart-question header{display:flex;align-items:center;gap:8px;margin-bottom:10px}.smart-question h2{margin:0;font-size:15px}.smart-question p{margin:0 0 12px;color:var(--ink2)}.answer-row{display:flex;gap:7px;flex-wrap:wrap}.answer{padding:8px 11px;border:1px solid #dfc79f;border-radius:9px;background:#fff;color:#654617;font-weight:700}.answer:hover,.answer.on{border-color:var(--amber);background:var(--amber2)}.mini-result{display:none;margin-top:18px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#fff}.mini-result.show{display:block}.mini-result header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mini-result h2{margin:0;font-size:15px}.outline{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.outline div{padding:10px;border-radius:9px;background:var(--paper2)}.outline b{display:block;font-size:12px}.outline small{color:var(--muted)}
    /* Guide */
    .guide-shell{height:calc(100% - 61px);display:grid;grid-template-columns:minmax(330px,.78fr) minmax(0,1.22fr)}.guide-left{display:flex;flex-direction:column;padding:31px 34px;border-right:1px solid var(--line);background:#f7f7f4}.steps{display:flex;gap:6px;margin-bottom:34px}.step-dot{width:30px;height:5px;border-radius:99px;background:#d8ddda}.step-dot.done{background:#7baea4}.step-dot.now{background:var(--teal)}.guide-kicker{margin:0 0 8px;color:var(--teal);font-size:12px;font-weight:800}.guide-left h1{margin:0;font-size:28px;line-height:1.22;letter-spacing:-.03em}.guide-help{margin:10px 0 22px;color:var(--muted)}.guide-options{display:grid;gap:8px}.guide-option{padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink2);text-align:left;font-weight:720}.guide-option b{display:block;color:var(--ink)}.guide-option span{display:block;margin-top:2px;color:var(--muted);font-size:12px;font-weight:400}.guide-option:hover,.guide-option.on{border-color:var(--teal);background:var(--teal2)}.guide-nav{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:20px}.guide-nav .text-btn{margin-right:auto}.guide-right{min-width:0;overflow:auto;padding:30px 38px;background:#fff}.doc-top{display:flex;align-items:flex-start;gap:14px;padding-bottom:19px;border-bottom:1px solid var(--line)}.doc-top div{flex:1}.doc-top p{margin:0 0 6px;color:var(--muted);font-size:12px}.doc-top h2{margin:0;font-size:22px}.doc-status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.doc-status i{width:7px;height:7px;border-radius:50%;background:#6aa080}.doc-section{padding:17px 0;border-bottom:1px solid var(--line)}.doc-section h3{margin:0 0 7px;font-size:13px}.doc-section p,.doc-section li{margin-top:0;color:var(--ink2)}.doc-section ul{margin-bottom:0;padding-left:20px}.placeholder{display:flex;align-items:center;gap:8px;padding:10px;border:1px dashed #dabd8a;border-radius:8px;background:#fffaf2;color:#775325;font-size:12px}.guide-send{display:flex;align-items:center;gap:9px;margin-top:19px}.guide-send span{flex:1;color:var(--muted);font-size:12px}
    /* Document */
    .document-shell{height:calc(100% - 61px);display:grid;grid-template-columns:250px minmax(0,1fr)}.doc-rail{padding:23px 16px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--paper2)}.rail-title{margin:0 8px 13px;color:var(--muted);font-size:11px;font-weight:800}.rail-item{width:100%;padding:10px;border:0;border-radius:9px;background:transparent;color:var(--ink2);text-align:left}.rail-item.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,27,.05)}.rail-item b{display:block}.rail-item small{color:var(--muted)}.quality{margin-top:auto;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.quality-head{display:flex;justify-content:space-between;font-size:12px}.quality-bar{height:5px;margin:9px 0;border-radius:99px;background:#e2e6e3;overflow:hidden}.quality-bar i{display:block;width:78%;height:100%;background:var(--teal)}.quality p{margin:0;color:var(--muted);font-size:11px}.document-main{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.document-head{padding:18px 27px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.document-head div{flex:1}.document-head input{width:100%;padding:0;border:0;background:transparent;color:var(--ink);font-size:20px;font-weight:820}.document-head p{margin:2px 0 0;color:var(--muted);font-size:11px}.document-body{min-height:0;overflow:auto;padding:25px 32px}.editable-section{max-width:760px;margin:0 auto 12px;padding:16px 18px;border:1px solid transparent;border-radius:12px}.editable-section:hover{border-color:var(--line);background:#fff}.editable-section.missing{border-color:#e6c895;background:#fffaf2}.editable-head{display:flex;align-items:center;gap:8px}.editable-head h2{margin:0;font-size:14px}.editable-head button{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px}.editable-section p{margin:8px 0 0;color:var(--ink2)}.editable-section ul{margin:8px 0 0;padding-left:20px;color:var(--ink2)}.prompt-dock{padding:12px 18px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);background:#fff}.prompt-box{min-width:0;flex:1;display:flex;align-items:center;border:1px solid var(--line2);border-radius:11px;background:#fdfdfb}.prompt-box input{min-width:0;flex:1;padding:10px 12px;border:0;background:transparent}.prompt-box button{margin-right:5px;border:0;background:transparent;color:var(--teal);font-weight:800}.dock-menu{position:absolute;bottom:78px;right:185px;width:260px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 16px 40px rgba(20,32,28,.16);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .16s ease-out,transform .16s ease-out}.dock-menu.show{opacity:1;transform:none;pointer-events:auto}.dock-menu button{width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;text-align:left}.dock-menu button:hover{background:var(--paper2)}
    .toast{position:fixed;top:16px;left:50%;z-index:2147483646;padding:8px 13px;transform:translate(-50%,-7px);border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .16s ease-out,transform .16s ease-out}.toast.show{opacity:1;transform:translate(-50%,0)}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    @media(max-width:820px){#stage{padding:0 0 70px}.app{height:auto;min-height:760px;border-radius:0}.canvas-wrap{padding-top:38px}.canvas-head h1{font-size:34px}.attach-row{overflow:auto}.attach-row .label{display:none}.attach{white-space:nowrap}.outline{grid-template-columns:1fr 1fr}.guide-shell{height:auto;grid-template-columns:1fr}.guide-left{min-height:570px;border-right:0;border-bottom:1px solid var(--line);padding:25px 20px}.guide-right{padding:25px 20px}.document-shell{height:auto;grid-template-columns:1fr}.doc-rail{display:none}.document-main{min-height:730px}.document-body{padding:18px 12px}.document-head{padding:15px}.prompt-dock{position:sticky;bottom:0;padding:9px}.prompt-dock>.secondary{display:none}.dock-menu{right:12px;bottom:68px}.proto-picker{max-width:calc(100% - 14px);overflow:auto}.proto-picker-item{white-space:nowrap}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
  </style>
</head>
<body>
  <div id="stage"></div><div class="toast" id="toast" role="status"></div>
  <nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">自由画布</button><button class="proto-picker-item">逐问向导</button><button class="proto-picker-item">文档工作台</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
  <script>
    const topbar=()=>`<header class="bar"><div class="brand"><span class="mark">OT</span>OneTone</div><div class="spacer"></div><button class="bar-btn" data-act="history">历史方案</button><span class="avatar">你</span></header>`;
    const canvas=()=>`<div class="app">${topbar()}<main class="canvas-main"><div class="canvas-wrap"><header class="canvas-head"><p>把想法变成 Agent 能完成的方案</p><h1>今天想推进什么？</h1><p class="lead">可以直接说，也可以放入截图、文件或代码。系统只会追问真正影响结果的内容。</p></header><div class="workflow-strip" role="group" aria-label="工作意图"><button class="on">做新东西</button><button>修改功能</button><button>修复问题</button><button>验收结果</button><button>长期规范</button></div><section class="composer"><textarea id="canvasInput" aria-label="描述你的想法" placeholder="例如：重新设计首页，让新用户快速开始，常规用户能继续上次工作……">重新设计首页，让新用户快速开始，常规用户能继续上次工作。</textarea><div class="attach-row"><span class="label">加入内容</span><button class="attach" data-act="attach">粘贴文字</button><button class="attach" data-act="attach">添加图片</button><button class="attach" data-act="attach">添加文件</button><button class="attach" data-act="attach">添加网址</button><button class="attach" data-act="attach">导入目录</button></div></section><div class="canvas-foot"><p>已识别：修改现有产品 · 中等任务 · 可能跨多个会话</p><button class="primary" id="canvasBuild">整理成方案</button></div><section class="smart-question" id="smartQuestion"><header><span class="tag warn">还差 1 项</span><h2>这次改版需要保留现有导航结构吗？</h2></header><p>这个决定会影响改动范围。其他信息已从你导入的内容中得到。</p><div class="answer-row"><button class="answer" data-answer>保留，只调整首页</button><button class="answer" data-answer>可以一起调整</button><button class="answer" data-answer>暂时不确定</button></div></section><section class="mini-result" id="miniResult"><header><h2>方案已经整理好</h2><button class="text-btn" data-act="open-doc">打开 Markdown</button></header><div class="outline"><div><b>目标</b><small>首页更快上手</small></div><div><b>范围</b><small>首页，不改导航</small></div><div><b>任务</b><small>拆成 4 个小步骤</small></div><div><b>验收</b><small>包含桌面和移动端</small></div></div></section></div></main></div>`;
    const guide=()=>`<div class="app">${topbar()}<main class="guide-shell"><section class="guide-left"><div class="steps"><i class="step-dot done"></i><i class="step-dot now"></i><i class="step-dot"></i><i class="step-dot"></i></div><p class="guide-kicker">第 2 个问题，共 3 个</p><h1 id="guideQuestion">第一版最重要的结果是什么？</h1><p class="guide-help" id="guideHelp">只选一个。后续能力可以放进下一轮，不会丢失。</p><div class="guide-options" id="guideOptions"><button class="guide-option on"><b>用户能快速生成第一份方案</b><span>优先验证从输入到发送的完整链路</span></button><button class="guide-option"><b>支持完整项目规范</b><span>一次生成多份长期维护文档</span></button><button class="guide-option"><b>先把界面做漂亮</b><span>只验证视觉与交互方向</span></button></div><div class="guide-nav"><button class="text-btn" data-act="skip">暂时不确定</button><button class="secondary" id="guideBack">上一步</button><button class="primary" id="guideNext">下一步</button></div></section><section class="guide-right"><article><header class="doc-top"><div><p>实时生成 · 修改功能</p><h2>首页方案工作流</h2></div><span class="doc-status"><i></i>已自动保存</span></header><section class="doc-section"><h3>目标</h3><p>让用户把模糊想法和已有材料整理成 Agent 可以直接执行的完整方案。</p></section><section class="doc-section"><h3>本轮范围</h3><ul><li>首页输入与材料导入</li><li id="guideChoice">优先完成从输入到发送的完整链路</li></ul></section><section class="doc-section"><h3>明确不做</h3><p>不展示工程配置，不要求用户理解文档文件名。</p></section><section class="doc-section"><h3>验收标准</h3><div class="placeholder" id="guideMissing"><span class="tag warn">待补充</span>完成后怎样判断用户真正成功？</div></section><div class="guide-send"><span>回答完成后可直接编辑 Markdown</span><button class="primary" data-act="send">发送给 Agent</button></div></article></section></main></div>`;
    const documentDesk=()=>`<div class="app">${topbar()}<main class="document-shell"><aside class="doc-rail"><p class="rail-title">方案结构</p><button class="rail-item on"><b>目标与场景</b><small>已从输入自动整理</small></button><button class="rail-item"><b>本轮范围</b><small>3 项必做</small></button><button class="rail-item"><b>明确不做</b><small>2 项边界</small></button><button class="rail-item"><b>工作方式</b><small>4 条规则</small></button><button class="rail-item"><b>小任务</b><small>4 个步骤</small></button><button class="rail-item"><b>验收标准</b><small>还差 1 项</small></button><div class="quality"><div class="quality-head"><b>方案完整度</b><span>78%</span></div><div class="quality-bar"><i></i></div><p>补充一个验收条件即可发送。</p></div></aside><section class="document-main"><header class="document-head"><div><input value="首页方案工作流" aria-label="方案标题"><p>修改功能 · 已自动保存 · 2 份材料</p></div><button class="secondary" data-act="history">历史版本</button><button class="primary" data-act="send">发送给 Agent</button></header><div class="document-body"><section class="editable-section"><div class="editable-head"><span class="tag">已整理</span><h2>目标与场景</h2><button>编辑</button></div><p>新手第一次打开时能快速生成方案；常规用户可以继续已有方案并发送给 Agent。</p></section><section class="editable-section"><div class="editable-head"><h2>本轮范围</h2><button>编辑</button></div><ul><li>一个主要输入框，支持导入任意内容</li><li>按工作意图自动组合文档结构</li><li>只追问真正影响实现的关键问题</li></ul></section><section class="editable-section"><div class="editable-head"><h2>工作方式</h2><button>调整规则</button></div><p>一次只完成一个小任务；修改前保存可恢复版本；完成后运行验证并报告实际结果。</p></section><section class="editable-section missing"><div class="editable-head"><span class="tag warn">需要你确认</span><h2>验收标准</h2></div><p>第一份方案应该在多长时间内完成？</p><div class="answer-row" style="margin-top:11px"><button class="answer" data-doc-answer>1 分钟内</button><button class="answer" data-doc-answer>3 分钟内</button><button class="answer" data-doc-answer>不限定时间</button></div></section></div><footer class="prompt-dock"><div class="prompt-box"><input id="docPrompt" placeholder="继续补充方案，或描述要修改的内容……"><button data-act="apply">应用</button></div><button class="secondary" id="docTools">加入内容</button><div class="dock-menu" id="dockMenu"><button data-act="add">添加图片或截图</button><button data-act="add">添加文件或目录</button><button data-act="add">添加网页链接</button></div></footer></section></main></div>`;
    const variants=[canvas,guide,documentDesk];
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1500)}
    function wire(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.act==='send'?'完整方案已准备发送':b.dataset.act==='history'?'已打开历史方案':b.dataset.act==='attach'||b.dataset.act==='add'?'已加入示例材料':'原型交互已触发')));document.querySelectorAll('.workflow-strip button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.workflow-strip button').forEach(x=>x.classList.toggle('on',x===b))});const build=document.getElementById('canvasBuild');if(build)build.onclick=()=>document.getElementById('smartQuestion').classList.add('show');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('miniResult').classList.add('show')});document.querySelectorAll('.guide-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.guide-option').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('guideChoice').textContent=b.querySelector('b').textContent});const next=document.getElementById('guideNext');if(next)next.onclick=()=>{document.getElementById('guideQuestion').textContent='完成后，怎样算真正可用？';document.getElementById('guideHelp').textContent='选一个最容易观察和验证的结果。';document.getElementById('guideOptions').innerHTML='<button class="guide-option on"><b>能生成、编辑并发送完整方案</b><span>验证核心闭环</span></button><button class="guide-option"><b>Agent 能完成并返回结果</b><span>包含执行环节</span></button>';document.getElementById('guideMissing').innerHTML='<span class="tag">已补充</span>用户能生成、编辑并发送完整方案';wireGuideOptions()};wireGuideOptions();const tools=document.getElementById('docTools');if(tools)tools.onclick=()=>document.getElementById('dockMenu').classList.toggle('show');document.querySelectorAll('[data-doc-answer]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-doc-answer]').forEach(x=>x.classList.toggle('on',x===b));b.closest('.editable-section').classList.remove('missing');toast('验收标准已补充')})}
    function wireGuideOptions(){document.querySelectorAll('.guide-option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.guide-option').forEach(x=>x.classList.toggle('on',x===b));const target=document.getElementById('guideChoice');if(target)target.textContent=b.querySelector('b').textContent})}
    const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wire()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
