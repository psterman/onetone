<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone 材料生成器</title>
  <style>
    :root{--bg:#edf0ed;--panel:#f8f9f7;--paper:#fffefa;--ink:#18201e;--muted:#6c7671;--line:#d6dcd8;--blue:#276b8c;--blue-soft:#e6f2f7;--green:#287663;--green-soft:#e4f2ec;--amber:#a5661c;--amber-soft:#fff1dd;--red:#a44840;--shadow:0 22px 65px #1c2c2520}
    *{box-sizing:border-box}body{margin:0;height:100vh;min-width:1040px;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #276b8c32;outline-offset:2px}
    .top{height:64px;padding:0 22px;display:flex;align-items:center;gap:17px;background:#ffffffed;border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:760;letter-spacing:-.4px}.brand span{font-weight:450;color:var(--muted)}.project{padding-left:17px;border-left:1px solid var(--line);color:var(--muted)}.project b{color:var(--ink);margin-left:6px}.local{margin-left:auto;font-size:12px;color:var(--green)}.local::before{content:"";display:inline-block;width:7px;height:7px;background:#429579;border-radius:50%;margin-right:7px}.deliver{border:0;background:var(--ink);color:white;padding:10px 15px;border-radius:10px;font-weight:650}
    .layout{height:calc(100vh - 64px);display:grid;grid-template-columns:310px 1fr}.collector{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.collector-head{padding:20px 18px 12px}.collector-head h2{font-size:16px;margin:0}.collector-head p{color:var(--muted);margin:4px 0 0;font-size:12px}
    .system-actions{padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.sys-btn{height:55px;border:1px solid var(--line);background:white;border-radius:11px;text-align:left;padding:8px 10px}.sys-btn:hover{border-color:#94b6a9}.sys-btn b{display:block;font-size:12px}.sys-btn small{color:var(--muted);font-size:11px}.sys-btn i{font-style:normal;color:var(--green);float:right}
    .paste-zone{margin:12px 18px 4px;border:1px dashed #9fafa7;background:#fff;border-radius:12px;padding:12px}.paste-zone textarea{width:100%;height:54px;border:0;resize:none;outline:0;background:transparent}.paste-zone footer{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.paste-zone button{border:0;background:var(--ink);color:white;border-radius:7px;padding:5px 9px;font-size:11px}
    .inbox-head{padding:13px 18px 8px;display:flex;align-items:center}.inbox-head b{font-size:13px}.count{margin-left:6px;background:#e2e7e4;border-radius:9px;padding:1px 6px;font-size:11px}.inbox-head button{margin-left:auto;border:0;background:transparent;color:var(--blue);font-size:12px}.inbox{padding:0 12px 130px;overflow:auto}.material{border:1px solid var(--line);background:white;border-radius:11px;padding:10px;margin:7px 0}.material-top{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center}.material-icon{width:30px;height:30px;background:#edf1ef;border-radius:8px;display:grid;place-items:center;color:var(--muted)}.material b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.material small{color:var(--muted);display:block;font-size:11px}.type{font-size:10px;border-radius:6px;padding:3px 5px;background:var(--blue-soft);color:#285f79}.type.warn{background:var(--amber-soft);color:var(--amber)}.roles{display:flex;gap:4px;margin-top:9px;padding-top:8px;border-top:1px solid #e7ebe8}.roles button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:4px 2px;font-size:10px}.roles button:hover,.roles button.active{background:var(--green-soft);color:var(--green)}
    .generate-bar{position:absolute;left:0;right:0;bottom:0;padding:13px 18px 17px;background:linear-gradient(#f8f9f700,#f8f9f7 22%);padding-top:36px}.generate{width:100%;border:0;border-radius:11px;background:var(--ink);color:white;padding:12px;font-weight:680}.generate-meta{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}.collector{position:relative}
    .canvas{overflow:auto;padding:28px 34px 90px}.canvas-inner{max-width:880px;margin:auto}.canvas-head{height:44px;display:flex;align-items:center}.canvas-head h1{font-size:16px;margin:0}.doc-state{margin-left:8px;color:var(--muted);font-size:11px}.view-tabs{margin-left:auto;display:flex;background:#e1e6e2;padding:3px;border-radius:9px}.view-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px}.view-tabs .active{background:white;color:var(--ink);box-shadow:0 1px 4px #00000015}
    .empty{height:560px;border:1px dashed #b7c2bc;border-radius:17px;background:#ffffff42;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty-icon{width:65px;height:65px;border-radius:19px;background:white;border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 15px;font-size:25px;box-shadow:0 8px 25px #263a3113}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}.empty p{margin:0;max-width:380px}.empty button{margin-top:18px;border:1px solid var(--line);background:white;padding:9px 12px;border-radius:9px}
    .document{display:none;background:var(--paper);border:1px solid #cfd6d2;box-shadow:var(--shadow);border-radius:6px;min-height:730px;padding:50px 64px}.document.show{display:block}.doc-title{font-size:29px;font-weight:760;letter-spacing:-.7px;margin:0 0 7px}.doc-meta{color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:25px}.doc-section{margin:25px 0}.doc-section h2{font-size:17px;margin:0 0 10px}.doc-section p{margin:0}.component{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 12px;margin:8px 0;display:grid;grid-template-columns:35px 1fr auto;gap:10px;align-items:center}.component-icon{width:35px;height:35px;background:#eef2ef;border-radius:9px;display:grid;place-items:center}.component b{display:block;font-size:13px}.component small{color:var(--muted);display:block;margin-top:2px}.ability{font-size:11px;color:var(--green);background:var(--green-soft);padding:4px 7px;border-radius:6px}.ability.manual{color:var(--amber);background:var(--amber-soft)}.unclassified{border-left:3px solid #d5a45f;background:#fffaf1}.assign{display:flex;gap:4px;margin-top:7px}.assign button{border:1px solid var(--line);background:white;border-radius:6px;font-size:10px;padding:3px 6px}.doc-list{margin:0;padding-left:20px}.doc-list li{margin:6px 0}.markdown{display:none;background:#f9faf8;border:1px solid var(--line);border-radius:8px;padding:30px;min-height:650px;white-space:pre-wrap;font:13px/1.7 Consolas,monospace}.markdown.show{display:block}
    .scrim{position:fixed;inset:0;z-index:30;background:#16201c5a;opacity:0;pointer-events:none;transition:.2s}.scrim.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:40;right:0;top:0;bottom:0;width:520px;background:#fafbf9;box-shadow:-25px 0 70px #17201d30;transform:translateX(105%);transition:.3s;display:flex;flex-direction:column}.sheet.open{transform:translateX(0)}.sheet-head{padding:23px 25px 18px;border-bottom:1px solid var(--line);display:flex}.sheet-head h2{margin:0;font-size:21px}.sheet-head p{margin:3px 0 0;color:var(--muted)}.close{margin-left:auto;width:34px;height:34px;border:1px solid var(--line);background:white;border-radius:50%}.sheet-body{padding:20px 25px;overflow:auto;flex:1}.destination{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.destination button{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 5px}.destination .active{background:var(--ink);color:white;border-color:var(--ink)}.transfer{margin-top:20px}.transfer-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.transfer-row small{display:block;color:var(--muted)}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.sheet-foot{padding:16px 25px;background:white;border-top:1px solid var(--line)}.warning{padding:9px;background:var(--amber-soft);color:#815218;border-radius:8px;font-size:12px;margin-bottom:10px}.final-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.final-actions button{border:1px solid var(--line);background:white;border-radius:10px;padding:11px;font-weight:650}.final-actions .primary{background:var(--ink);color:white;border-color:var(--ink)}.receipt{display:none;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--muted)}.receipt.show{display:block}.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,12px);opacity:0;background:var(--ink);color:white;padding:10px 14px;border-radius:9px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1120px){.layout{grid-template-columns:285px 1fr}.document{padding-inline:43px}.sheet{width:480px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">OneTone <span>材料生成器</span></div><div class="project">当前项目 <b>voice-pilot</b></div><div class="local">本地处理 · 不使用大模型</div><button class="deliver" id="openDelivery">交付工作说明</button></header>
  <main class="layout">
    <aside class="collector">
      <div class="collector-head"><h2>收集材料</h2><p>选择、粘贴或拖入，系统只识别客观类型。</p></div>
      <div class="system-actions">
        <button class="sys-btn" id="folderButton"><i>●</i><b>打开文件夹</b><small>系统目录选择器</small></button>
        <button class="sys-btn" id="fileButton"><i>●</i><b>选择文件</b><small>支持多选</small></button>
        <button class="sys-btn" id="clipboardButton"><i>●</i><b>读取剪贴板</b><small>文字、网址、路径</small></button>
        <button class="sys-btn" data-action="capture"><i>○</i><b>截取屏幕</b><small>需要系统授权</small></button>
      </div>
      <input id="folderInput" type="file" webkitdirectory multiple hidden><input id="fileInput" type="file" multiple hidden>
      <div class="paste-zone"><textarea id="pasteInput" placeholder="粘贴文字、网址、路径或图片"></textarea><footer><span>Ctrl + V · 保留原始内容</span><button id="recognizePaste">识别内容</button></footer></div>
      <div class="inbox-head"><b>刚刚收到</b><span class="count" id="materialCount">5</span><button id="clearUnused">清除未使用</button></div>
      <div class="inbox" id="inbox"></div>
      <div class="generate-bar"><button class="generate" id="generateButton">按材料生成工作说明</button><div class="generate-meta" id="generateMeta">4 项已分类 · 1 项未归类</div></div>
    </aside>
    <section class="canvas"><div class="canvas-inner">
      <div class="canvas-head"><h1>工作说明</h1><span class="doc-state" id="docState">尚未生成</span><div class="view-tabs"><button class="active" data-view="visual">可视化</button><button data-view="markdown">Markdown</button></div></div>
      <div class="empty" id="emptyState"><div><div class="empty-icon">≡</div><b>材料准备好后生成文档</b><p>系统按类型和你确认的用途整理，不猜测文字含义。</p><button id="emptyGenerate">使用当前 5 项材料生成</button></div></div>
      <article class="document" id="documentView"></article><pre class="markdown" id="markdownView"></pre>
    </div></section>
  </main>
  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="deliverySheet" aria-hidden="true"><div class="sheet-head"><div><h2>交付工作说明</h2><p>交付给 Agent 或复制到剪贴板，并确认实际能带走什么。</p></div><button class="close" id="closeDelivery">×</button></div><div class="sheet-body">
    <div class="destination"><button class="active" data-target="Codex">Codex</button><button data-target="Cursor">Cursor</button><button data-target="Claude">Claude</button><button data-target="剪贴板">剪贴板</button></div>
    <div class="transfer" id="transferList"></div><div class="receipt" id="receipt"><b>交接动作已准备。</b><br>发送状态未知：OneTone 无法确认 Agent 中是否点击了发送。</div>
  </div><div class="sheet-foot"><div class="warning" id="deliveryWarning">图片需要手动上传；网页只传递网址。</div><div class="final-actions"><button id="copyButton">复制到剪贴板</button><button class="primary" id="agentButton">复制说明并打开 Codex</button></div></div></aside>
  <div class="toast" id="toast" role="status"></div>
  <script>
    let materials=[
      {id:1,type:'folder',name:'voice-pilot',detail:'E:\\voice-pilot',role:'background',source:'系统文件夹',transfer:'yes'},
      {id:2,type:'image',name:'current-home.png',detail:'1920 × 1080 · 剪贴板图片',role:'background',source:'剪贴板',transfer:'manual'},
      {id:3,type:'url',name:'Gemini 首页参考',detail:'https://example.com/reference',role:'background',source:'粘贴内容',transfer:'manual'},
      {id:4,type:'text',name:'首页不要代替 Agent 操作',detail:'普通文字 · 保留原文',role:'detail',source:'剪贴板',transfer:'yes'},
      {id:5,type:'text',name:'先画出来看看，保持简单',detail:'普通文字 · 含义未判断',role:'unclassified',source:'剪贴板',transfer:'yes'}
    ];
    const icons={folder:'⌂',file:'⌘',image:'▧',url:'↗',text:'¶',markdown:'MD',code:'{}'};const labels={folder:'文件夹',file:'文件',image:'图片',url:'网址',text:'文字',markdown:'Markdown',code:'代码'};let generated=false,currentTarget='Codex',toastTimer;
    function classifyText(value){const text=value.trim();if(!text)return[];return text.split(/\n+/).filter(Boolean).map((line,index)=>{const s=line.trim();let type='text';if(/^https?:\/\//i.test(s))type='url';else if(/^[a-zA-Z]:\\/.test(s)||/^\.?\.?\//.test(s))type=/\.[a-z0-9]{1,8}$/i.test(s)?'file':'folder';else if(/^#{1,6}\s|^[-*]\s/.test(s))type='markdown';else if(/[{};]\s*$/.test(s))type='code';return{id:Date.now()+index,type,name:s.length>34?s.slice(0,34)+'…':s,detail:type==='text'?'普通文字 · 含义未判断':s,role:type==='text'?'unclassified':'background',source:'粘贴内容',transfer:type==='image'?'manual':'yes'}})}
    function classifyFile(file,index){const ext=(file.name.split('.').pop()||'').toLowerCase();let type=file.type.startsWith('image/')?'image':['md','mdx'].includes(ext)?'markdown':['js','ts','tsx','jsx','rs','py','css','html'].includes(ext)?'code':'file';return{id:Date.now()+index,type,name:file.name,detail:`${Math.max(1,Math.round(file.size/1024))} KB · 本地文件`,role:'background',source:'系统文件选择器',transfer:type==='image'?'manual':'yes'}}
    function renderInbox(){const box=document.getElementById('inbox');box.innerHTML=materials.map(m=>`<div class="material"><div class="material-top"><span class="material-icon">${icons[m.type]||'?'}</span><span><b>${escapeHtml(m.name)}</b><small>${escapeHtml(m.detail)}</small></span><span class="type ${m.role==='unclassified'?'warn':''}">${labels[m.type]}</span></div><div class="roles" data-id="${m.id}">${['goal','background','detail','plan','unclassified'].map(r=>`<button class="${m.role===r?'active':''}" data-role="${r}">${{goal:'目标',background:'背景',detail:'细节',plan:'计划',unclassified:'未归类'}[r]}</button>`).join('')}</div></div>`).join('');document.getElementById('materialCount').textContent=materials.length;updateMeta();box.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>{const id=Number(b.parentElement.dataset.id);materials.find(m=>m.id===id).role=b.dataset.role;renderInbox()})}
    function updateMeta(){const known=materials.filter(m=>m.role!=='unclassified').length;document.getElementById('generateMeta').textContent=`${known} 项已分类 · ${materials.length-known} 项未归类`}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function component(m){const ability=m.type==='url'?'<span class="ability manual">只传网址</span>':m.transfer==='manual'?'<span class="ability manual">需要手动上传</span>':'<span class="ability">可传递</span>';return`<div class="component ${m.role==='unclassified'?'unclassified':''}"><span class="component-icon">${icons[m.type]}</span><span><b>${escapeHtml(m.name)}</b><small>${escapeHtml(m.detail)} · 来源：${m.source}</small>${m.role==='unclassified'?'<span class="assign"><button>目标</button><button>背景</button><button>细节</button><button>计划</button></span>':''}</span>${ability}</div>`}
    function renderMarkdown(){const groups=Object.groupBy?Object.groupBy(materials,m=>m.role):materials.reduce((a,m)=>((a[m.role]??=[]).push(m),a),{});const section=(role,title)=>`## ${title}\n\n${(groups[role]||[]).map(m=>m.type==='folder'||m.type==='file'?`- \`${m.detail}\``:m.type==='image'?`- ![${m.name}](./attachments/${m.name})`:m.type==='url'?`- [${m.name}](${m.detail})`:`- ${m.name}`).join('\n')||'_尚未提供_'}\n`;return`# OneTone 首页工作说明\n\n${section('goal','目标')}\n${section('background','背景')}\n${section('detail','细节')}\n${section('plan','计划')}\n${section('unclassified','未归类记录')}`}
    function generateBrief(){generated=true;document.getElementById('emptyState').style.display='none';const doc=document.getElementById('documentView');const groups=materials.reduce((a,m)=>((a[m.role]??=[]).push(m),a),{});const section=(role,title)=>`<section class="doc-section"><h2>${title}</h2>${(groups[role]||[]).length?(groups[role]||[]).map(component).join(''):`<p class="hint">尚未提供</p>`}</section>`;doc.innerHTML=`<h1 class="doc-title">OneTone 首页工作说明</h1><div class="doc-meta">按 ${materials.length} 项材料生成 · 类型由本地规则识别 · 用途由用户确认</div>${section('goal','目标')}${section('background','背景')}${section('detail','细节')}${section('plan','计划')}${section('unclassified','未归类记录')}`;doc.classList.add('show');document.getElementById('markdownView').textContent=renderMarkdown();document.getElementById('docState').textContent='刚刚生成 · 尚未发送';showToast('工作说明已生成')}
    function openDelivery(){if(!generated)generateBrief();document.getElementById('deliverySheet').classList.add('open');document.getElementById('deliverySheet').setAttribute('aria-hidden','false');document.getElementById('scrim').classList.add('show');renderTransfer()}
    function closeDelivery(){document.getElementById('deliverySheet').classList.remove('open');document.getElementById('deliverySheet').setAttribute('aria-hidden','true');document.getElementById('scrim').classList.remove('show')}
    function renderTransfer(){const isClipboard=currentTarget==='剪贴板';document.getElementById('transferList').innerHTML=`<div class="transfer-row"><span class="green">✓</span><span><b>Markdown 正文</b><small>完整工作说明</small></span><span>可复制</span></div><div class="transfer-row"><span class="green">✓</span><span><b>项目目录</b><small>E:\\voice-pilot</small></span><span>${isClipboard?'复制路径':'可以打开'}</span></div><div class="transfer-row"><span class="amber">○</span><span><b>参考图片</b><small>current-home.png</small></span><span>${isClipboard?'复制文件名':'需要手动上传'}</span></div><div class="transfer-row"><span class="amber">○</span><span><b>参考网址</b><small>未读取网页正文</small></span><span>只传网址</span></div>`;document.getElementById('agentButton').textContent=isClipboard?'复制完整工作说明':`复制说明并打开 ${currentTarget}`;document.getElementById('copyButton').style.display=isClipboard?'none':'block'}
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}
    document.getElementById('folderButton').onclick=()=>document.getElementById('folderInput').click();document.getElementById('fileButton').onclick=()=>document.getElementById('fileInput').click();document.getElementById('folderInput').onchange=e=>{const files=[...e.target.files];if(files.length)materials.push({id:Date.now(),type:'folder',name:files[0].webkitRelativePath.split('/')[0],detail:'本地文件夹 · '+files.length+' 个文件',role:'background',source:'系统文件夹选择器',transfer:'yes'});renderInbox()};document.getElementById('fileInput').onchange=e=>{materials.push(...[...e.target.files].map(classifyFile));renderInbox()};
    document.getElementById('recognizePaste').onclick=()=>{const input=document.getElementById('pasteInput');const found=classifyText(input.value);if(found.length){materials.push(...found);input.value='';renderInbox();showToast(`识别出 ${found.length} 项材料`)}else showToast('请先粘贴内容')};document.getElementById('pasteInput').addEventListener('paste',e=>{const files=[...e.clipboardData.files];if(files.length){e.preventDefault();materials.push(...files.map(classifyFile));renderInbox();showToast(`收到 ${files.length} 个文件`)}});document.getElementById('clipboardButton').onclick=async()=>{try{const text=await navigator.clipboard.readText();document.getElementById('pasteInput').value=text;showToast('剪贴板内容已读取')}catch{document.getElementById('pasteInput').focus();showToast('请按 Ctrl + V 粘贴')}};
    document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>showToast('该系统能力需要桌面端授权'));document.getElementById('clearUnused').onclick=()=>{materials=materials.filter(m=>m.role!=='unclassified');renderInbox()};document.getElementById('generateButton').onclick=generateBrief;document.getElementById('emptyGenerate').onclick=generateBrief;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='markdown'){document.getElementById('documentView').classList.remove('show');document.getElementById('emptyState').style.display='none';document.getElementById('markdownView').classList.add('show')}else{document.getElementById('markdownView').classList.remove('show');if(generated)document.getElementById('documentView').classList.add('show');else document.getElementById('emptyState').style.display='grid'}});
    document.getElementById('openDelivery').onclick=openDelivery;document.getElementById('closeDelivery').onclick=closeDelivery;document.getElementById('scrim').onclick=closeDelivery;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDelivery()});document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-target]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentTarget=b.dataset.target;renderTransfer()});document.getElementById('copyButton').onclick=()=>{navigator.clipboard?.writeText(renderMarkdown()).catch(()=>{});showToast('Markdown 已复制到剪贴板')};document.getElementById('agentButton').onclick=()=>{navigator.clipboard?.writeText(renderMarkdown()).catch(()=>{});document.getElementById('receipt').classList.add('show');showToast(currentTarget==='剪贴板'?'完整工作说明已复制':`说明已复制，准备打开 ${currentTarget}`)};renderInbox();
  </script>
</body>
</html>
