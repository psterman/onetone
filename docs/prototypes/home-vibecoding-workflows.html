<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone · Vibe Coding 首页工作流</title>
  <style>
    :root{--bg:#e9eceb;--paper:#fbfbf8;--rail:#f2f3f0;--ink:#182420;--ink2:#3f4d48;--muted:#6b7772;--line:#d9dedb;--teal:#176d63;--teal2:#dcece7;--amber:#9a641c;--amber2:#f7ead5;--red:#9a4339;--red2:#f6e3df;--blue:#315f87;--shadow:0 22px 60px rgba(24,36,32,.13)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
    #stage{min-height:100%;padding:20px 20px 78px}.app{width:min(1240px,100%);height:min(820px,calc(100vh - 98px));min-height:650px;margin:auto;display:grid;grid-template-columns:210px minmax(0,1fr);overflow:hidden;border:1px solid rgba(24,36,32,.1);border-radius:20px;background:var(--paper);box-shadow:var(--shadow);animation:enter .24s cubic-bezier(.16,1,.3,1)}
    @keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.rail{display:flex;flex-direction:column;padding:20px 13px 14px;background:var(--rail);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 20px;font-weight:800}.mark{width:27px;height:27px;display:grid;place-items:center;border-radius:8px;background:var(--ink);color:#bce3db;font-size:10px}.nav{display:grid;gap:3px}.nav button{min-height:39px;padding:8px 10px;border:0;border-radius:9px;background:transparent;color:var(--ink2);text-align:left;font-weight:650}.nav button.on{background:var(--teal2);color:#105b54}.rail-note{margin:auto 8px 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.main{min-width:0;min-height:0;display:flex;flex-direction:column}.top{height:58px;flex:none;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--ink)}.live{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.5s ease-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
    .body{min-height:0;overflow:auto;padding:26px 30px 34px}.eyebrow{margin:0 0 8px;color:var(--muted);font-size:12px;font-weight:700}.title{margin:0;font-size:30px;line-height:1.18;letter-spacing:-.035em}.sub{margin:8px 0 0;color:var(--ink2);max-width:62ch}.btn{min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-weight:700}.btn:hover{background:#f4f7f5}.btn.primary{border-color:var(--teal);background:var(--teal);color:#fff}.btn.warn{border-color:var(--amber);background:var(--amber);color:#fff}.btn.danger{border-color:var(--red);background:var(--red);color:#fff}.btn.text{border-color:transparent;background:transparent;color:var(--teal)}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid var(--line);border-radius:14px;background:#fff}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:11px}.section-head h2{margin:0;font-size:15px}.section-head span{color:var(--muted);font-size:12px}.status{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:var(--teal2);color:#105b54;font-size:11px;font-weight:750}.status.wait{background:var(--amber2);color:#7b4d12}.status.fail{background:var(--red2);color:var(--red)}.status.run{background:#e3edf6;color:var(--blue)}
    .statebar{position:fixed;z-index:100;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(250,250,248,.93);box-shadow:0 7px 24px rgba(20,30,27,.14);backdrop-filter:blur(12px)}.statebar span{padding:0 7px;color:var(--muted);font-size:11px}.statebar button{height:28px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px}.statebar button[aria-pressed=true]{background:var(--ink);color:#fff}
    /* Dispatch: queue-first */
    .dispatch{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.8fr);gap:18px}.focus{padding:22px;background:linear-gradient(145deg,#183c37,#215d54);color:#fff;min-height:226px}.focus[data-tone=wait]{background:linear-gradient(145deg,#5e421c,#8b5c22)}.focus[data-tone=fail]{background:linear-gradient(145deg,#632e29,#92443b)}.focus .eyebrow,.focus .sub{color:rgba(255,255,255,.72)}.focus .title{font-size:34px;max-width:17ch}.focus .actions{margin-top:22px}.focus .btn.primary{background:#fff;border-color:#fff;color:#173c37}.focus .btn.text{color:#fff}.focus-meta{margin-top:21px;display:flex;gap:14px;flex-wrap:wrap;color:rgba(255,255,255,.68);font-size:12px}.queue{padding:18px}.queue h2{margin:0 0 12px;font-size:15px}.queue-item{width:100%;padding:12px 0;display:flex;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;text-align:left}.queue-item:first-of-type{border-top:0}.queue-item b{display:block;font-size:13px}.queue-item small{color:var(--muted)}.queue-item .status{margin-left:auto}.projects{grid-column:1/-1;margin-top:4px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.project{padding:15px}.project-top{display:flex;justify-content:space-between;gap:8px}.project h3{margin:0;font-size:14px}.project p{margin:8px 0 14px;color:var(--muted);font-size:12px}.project .actions{justify-content:space-between;align-items:center}.project .link{border:0;background:none;color:var(--teal);font-weight:700}
    /* Project desk: project-first */
    .desk-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.desk-head .actions{padding-top:5px}.phase{margin:24px 0 18px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.phase div{padding-top:9px;border-top:3px solid var(--line);color:var(--muted);font-size:11px}.phase div.done{border-color:#70a49b;color:var(--ink2)}.phase div.now{border-color:var(--teal);color:var(--teal);font-weight:800}.workspace{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.75fr);gap:14px}.work-main,.agent-panel{padding:18px}.task-title{display:flex;justify-content:space-between;gap:12px}.task-title h2{margin:0;font-size:17px}.task-copy{margin:10px 0 17px;color:var(--ink2)}.checklist{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:flex-start;padding:10px;border-radius:9px;background:#f5f7f5}.check i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--teal2);color:var(--teal);font-style:normal;font-size:11px;font-weight:800}.check small{display:block;color:var(--muted)}.agent-panel h2{margin:0 0 14px;font-size:15px}.agent-line{padding:11px 0;border-top:1px solid var(--line)}.agent-line:first-of-type{border-top:0}.agent-line b{display:block}.agent-line small{color:var(--muted)}.review-band{margin-top:14px;padding:15px 17px;display:flex;align-items:center;gap:14px;background:var(--amber2);border-color:#ead1aa}.review-band div{flex:1}.review-band b{display:block}.review-band small{color:#76552c}
    /* Growth: capability progression */
    .welcome{max-width:860px;margin:2px auto 0}.welcome-head{text-align:center;padding:12px 0 24px}.welcome-head .title{font-size:38px}.launch-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}.launch{padding:21px;text-align:left}.launch.featured{background:#173e38;color:#fff;border-color:#173e38}.launch h2{margin:5px 0 6px;font-size:18px}.launch p{margin:0 0 20px;color:var(--muted)}.launch.featured p{color:rgba(255,255,255,.7)}.cap-row{margin-top:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cap{padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.cap b{display:block}.cap small{color:var(--muted)}.growth-projects{margin-top:18px}.grow-row{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.grow-row b{display:block}.grow-row small{color:var(--muted)}.lock{opacity:.45}.level{margin-top:20px;padding:12px 14px;display:flex;gap:10px;align-items:center;background:#eef5f2;border-radius:10px;color:var(--ink2);font-size:12px}.level b{color:var(--teal)}
    .toast{position:fixed;top:52px;left:50%;z-index:200;transform:translate(-50%,-8px);padding:8px 13px;border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .16s ease-out,transform .16s ease-out}.toast.show{opacity:1;transform:translate(-50%,0)}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
    @media(max-width:850px){#stage{padding:56px 10px 72px}.statebar{top:9px;width:calc(100% - 20px);overflow:auto;justify-content:flex-start}.statebar span{display:none}.app{height:auto;min-height:720px;grid-template-columns:1fr}.rail{display:none}.body{padding:20px 16px}.dispatch,.workspace,.launch-grid{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr}.phase{overflow:auto}.phase div{min-width:100px}.cap-row{grid-template-columns:1fr 1fr}.top{padding:0 16px}.proto-picker{max-width:calc(100% - 16px);overflow:auto}.proto-picker-item{white-space:nowrap}}
  </style>
</head>
<body>
  <div class="statebar" role="toolbar" aria-label="工作流情境"><span>情境</span><button data-state="first">首次进入</button><button data-state="resume">继续开发</button><button data-state="running">Agent 执行</button><button data-state="review" aria-pressed="true">待验收</button><button data-state="failed">失败修复</button></div>
  <div id="stage"></div><div class="toast" id="toast" role="status"></div>
  <nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">实时指挥台</button><button class="proto-picker-item">项目作业台</button><button class="proto-picker-item">递进工作台</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
  <script>
    const data={
      first:{label:'首次进入',title:'从一个真实项目开始',sub:'导入仓库或从想法创建项目，OneTone 会帮你建立第一条可验收任务。',action:'导入现有项目',tone:'',project:'还没有项目',status:'准备开始'},
      resume:{label:'继续开发',title:'继续完成首页实时状态层',sub:'上次停在验收状态映射。上下文、修改记录和下一步已经准备好。',action:'继续上次工作',tone:'',project:'voice-pilot',status:'12 分钟前'},
      running:{label:'Agent 执行中',title:'Agent 正在实现验收模式',sub:'已完成 4/6 项，正在运行首页 smoke test。当前不需要你介入。',action:'查看实时进度',tone:'',project:'voice-pilot',status:'运行 8 分钟'},
      review:{label:'等待你验收',title:'首页工作流原型已经完成',sub:'视觉检查和 12 项 smoke test 已通过。请先看实际效果，再决定通过或返工。',action:'开始验收',tone:'wait',project:'voice-pilot',status:'等待 6 分钟'},
      failed:{label:'执行失败',title:'首页测试在窄窗口失败',sub:'没有修改生产数据。Agent 已定位到项目卡片溢出，可以查看证据并继续修复。',action:'查看并修复',tone:'fail',project:'voice-pilot',status:'刚刚'}
    };
    let state='review';
    const shell=content=>`<div class="app"><aside class="rail"><div class="brand"><span class="mark">OT</span>OneTone</div><nav class="nav"><button class="on">现在</button><button>项目</button><button>Agent</button><button>验收</button></nav><p class="rail-note">按住 Ctrl + Space 说话<br>2 个 hooks 正在监听</p></aside><main class="main"><header class="top"><span class="crumb"><b>现在</b> · 项目工作台</span><span class="live"><i class="pulse"></i>实时状态已连接</span></header><div class="body">${content}</div></main></div>`;
    const status=s=>`<span class="status ${s==='review'?'wait':s==='failed'?'fail':s==='running'?'run':''}">${data[s].label}</span>`;
    function dispatch(){const d=data[state];return shell(`<div class="dispatch"><section class="card focus" data-tone="${d.tone}"><p class="eyebrow">最高优先级 · ${d.project}</p><h1 class="title">${d.title}</h1><p class="sub">${d.sub}</p><div class="actions"><button class="btn primary" data-do="${d.action}">${d.action}</button><button class="btn text" data-do="查看判断依据">查看判断依据</button></div><div class="focus-meta"><span>${d.status}</span><span>来源：Agent + Git + 测试 hook</span></div></section><aside class="card queue"><h2>跨项目待处理</h2><button class="queue-item" data-do="切换到 shop-console"><span><b>shop-console</b><small>PR 等待确认</small></span>${status('review')}</button><button class="queue-item" data-do="切换到 notes-app"><span><b>notes-app</b><small>Agent 正在重构编辑器</small></span>${status('running')}</button><button class="queue-item" data-do="切换到 landing"><span><b>landing</b><small>预览构建失败</small></span>${status('failed')}</button></aside><section class="projects"><div class="section-head"><h2>最近项目</h2><span>按实时性与需要介入程度排序</span></div><div class="project-grid">${project('voice-pilot','首页工作流','review')}${project('shop-console','结算页优化','resume')}${project('notes-app','编辑器重构','running')}</div></section></div>`)}
    function project(name,task,s){return `<article class="card project"><div class="project-top"><h3>${name}</h3>${status(s)}</div><p>${task} · ${s==='running'?'Agent 正在工作':'最近有更新'}</p><div class="actions"><button class="link" data-do="打开 ${name}">打开项目</button><span class="crumb">${s==='review'?'6 分钟前':'今天'}</span></div></article>`}
    function desk(){const d=data[state];let phase=state==='review'?3:state==='failed'?3:state==='running'?2:state==='resume'?1:0;return shell(`<div class="desk-head"><div><p class="eyebrow">voice-pilot · 当前项目</p><h1 class="title">${d.title}</h1><p class="sub">${d.sub}</p></div><div class="actions"><button class="btn" data-do="发起新任务">新任务</button><button class="btn primary ${d.tone==='wait'?'warn':d.tone==='fail'?'danger':''}" data-do="${d.action}">${d.action}</button></div></div><div class="phase">${['定义','规划','实现','验收','交付'].map((x,i)=>`<div class="${i<phase?'done':i===phase?'now':''}">${i+1}. ${x}</div>`).join('')}</div><div class="workspace"><section class="card work-main"><div class="task-title"><h2>重构首页工作流</h2>${status(state)}</div><p class="task-copy">让首次用户快速成功，让常规开发从项目状态直接继续，并把验收变成完整工作流。</p><div class="checklist"><div class="check"><i>✓</i><span><b>项目上下文已恢复</b><small>PRODUCT.md、最近提交、首页状态模型</small></span></div><div class="check"><i>✓</i><span><b>Agent 修改已隔离</b><small>独立工作区，无生产代码冲突</small></span></div><div class="check"><i>${state==='failed'?'!':'✓'}</i><span><b>自动验证</b><small>${state==='failed'?'窄窗口检查失败 1 项':'12 项检查已通过'}</small></span></div></div></section><aside class="card agent-panel"><h2>Agent 与 hooks</h2><div class="agent-line"><b>Codex ${state==='running'?'正在执行':'等待指令'}</b><small>${state==='running'?'正在运行 smoke test':'最后更新于 6 分钟前'}</small></div><div class="agent-line"><b>Git 状态 hook</b><small>检测到 3 个原型文件</small></div><div class="agent-line"><b>测试 hook</b><small>${state==='failed'?'1 项失败':'全部通过'}</small></div><button class="btn text" data-do="查看 Agent 详情">查看完整活动</button></aside></div>${state==='review'||state==='failed'?`<section class="card review-band"><div><b>${state==='review'?'结果已准备好，请验收':'发现问题，需要修复'}</b><small>${state==='review'?'先看运行效果，再看 diff 与测试证据':'Agent 已提供失败位置和修复建议'}</small></div><button class="btn ${state==='review'?'warn':'danger'}" data-do="${d.action}">${d.action}</button></section>`:''}`)}
    function growth(){const first=state==='first';const d=data[state];return shell(`<div class="welcome"><header class="welcome-head"><p class="eyebrow">${first?'第一次使用 OneTone':'欢迎回来 · 3 个活跃项目'}</p><h1 class="title">${first?'开始完成第一个真实成果':d.title}</h1><p class="sub" style="margin-inline:auto">${first?'不用先学习怎么写 Prompt。选一个起点，OneTone 会带你完成创建、开发与验收。':d.sub}</p></header>${first?`<div class="launch-grid"><button class="card launch featured" data-do="导入现有项目"><span class="status">推荐</span><h2>导入已有项目</h2><p>选择本地仓库，读取现有结构并生成第一条建议任务。</p><span class="btn primary">选择文件夹</span></button><button class="card launch" data-do="创建新项目"><h2>从一个想法开始</h2><p>描述想做的产品，由 Agent 帮你建立项目、计划和验收目标。</p><span class="btn">创建项目</span></button></div>`:`<section class="growth-projects"><div class="section-head"><h2>你的项目</h2><span>需要处理的项目在最前</span></div><div class="grow-row"><span><b>voice-pilot</b><small>首页工作流</small></span>${status(state)}<button class="btn primary ${d.tone==='wait'?'warn':d.tone==='fail'?'danger':''}" data-do="${d.action}">${d.action}</button></div><div class="grow-row"><span><b>shop-console</b><small>结算页优化</small></span>${status('resume')}<button class="btn" data-do="继续项目">继续</button></div></section>`}<div class="cap-row"><button class="cap" data-do="新建项目"><b>新建项目</b><small>从想法建立工作区</small></button><button class="cap" data-do="交给 Agent"><b>交给 Agent</b><small>目标和材料都可见</small></button><button class="cap ${first?'lock':''}" data-do="运行验收"><b>运行验收</b><small>预览、测试与 diff</small></button><button class="cap ${first?'lock':''}" data-do="配置自动化"><b>自动化</b><small>hooks 与并行任务</small></button></div><div class="level"><b>${first?'当前：入门模式':'当前：项目模式'}</b><span>${first?'完成第一次验收后，会逐步出现项目恢复、hooks 和并行 Agent。':'能力随使用深度出现，不把专业控制一次塞给新用户。'}</span></div></div>`)}
    const variants=[dispatch,desk,growth];const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function wire(){stage.querySelectorAll('[data-do]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.do+' · 原型演示')))}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wire()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);j===i?el.setAttribute('aria-current','true'):el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.querySelectorAll('[data-state]').forEach(b=>b.addEventListener('click',()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));mount(current)}));
    document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
    function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1500)}
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
