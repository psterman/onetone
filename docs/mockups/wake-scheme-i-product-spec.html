<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 开启 · 产品视觉规范 · 统一口令池</title>
  <!-- 产品 CSS（与 src/index.html 同序） -->
  <link rel="stylesheet" href="../../src/css/app.css" />
  <link rel="stylesheet" href="../../src/css/keys-workflow.css" />
  <link rel="stylesheet" href="../../src/css/flow-desk.css" />
  <link rel="stylesheet" href="../../src/css/voice-workflow.css" />
  <link rel="stylesheet" href="../../src/css/voice-page-shell.css" />
  <link rel="stylesheet" href="../../src/css/typography.css" />
  <link rel="stylesheet" href="wake-scheme-i-product-spec.css" />
</head>
<body class="mockup-body">

<div class="app mockup-app is-settings">
  <div class="settings-panel-wrap mockup-frame">
    <p class="mockup-note">01 开启 · 产品视觉规范 mockup。样式来自 <code>src/css/</code>（与正式版同序加载）；IA 增量见 <code>wake-scheme-i-product-spec.css</code>。请从仓库根目录起静态服务，或直接打开本文件。</p>

    <section id="settingsPanelVoiceWake" class="settings-panel voice-page voice-page-v2 voice-page-desk" aria-label="语音听写设置">

      <!-- 顶栏（产品 page-status-bar） -->
      <div class="page-status-bar voice-page-status-bar">
        <div class="page-status-bar-main voice-scheme-status-main">
          <div class="keys-scheme-summary-title-row voice-scheme-summary-title-row">
            <span class="voice-status-brand-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </span>
            <span class="keys-scheme-summary-name voice-scheme-summary-name">语音听写</span>
            <span class="keys-scheme-summary-pill voice-scheme-summary-pill">默认 · 已激活</span>
          </div>
        </div>
        <div class="voice-status-center-cluster">
          <div class="voice-summary-engine-switch voice-recognize-source-grid" role="group" aria-label="语音模式">
            <button type="button" class="voice-recognize-source-btn is-active">自动</button>
            <button type="button" class="voice-recognize-source-btn">省电</button>
            <button type="button" class="voice-recognize-source-btn">增强</button>
          </div>
        </div>
        <div class="page-status-bar-actions voice-scheme-status-actions">
          <button type="button" class="page-status-btn is-primary">保存到正在编辑的习惯</button>
          <button type="button" class="toggle-switch keys-summary-enable page-status-toggle" role="switch" aria-checked="true" aria-label="语音开关"></button>
          <button type="button" class="page-status-btn">+ 新建</button>
        </div>
      </div>

      <div class="voice-page-body">
        <div class="voice-page-main">
          <div class="voice-page-layout">

            <!-- 流程节点（产品 flow-nodes） -->
            <div class="keys-workflow-pipeline voice-workflow-pipeline">
              <section class="flow-nodes" aria-label="语音流程导航">
                <div class="flow-nodes-track" aria-hidden="true">
                  <svg class="flow-nodes-svg" viewBox="0 0 1000 8" fill="none" preserveAspectRatio="none">
                    <path class="flow-nodes-path-base" d="M 0,4 Q 250,-5 500,4 T 1000,4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <path class="flow-nodes-path" d="M 0,4 Q 250,-5 500,4 T 1000,4" stroke="url(#voiceFlowGradMock)" stroke-width="3" stroke-linecap="round"/>
                    <defs>
                      <linearGradient id="voiceFlowGradMock" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(79, 172, 254, 0.85)" />
                        <stop offset="50%" stop-color="rgba(42, 156, 196, 0.95)" />
                        <stop offset="100%" stop-color="rgba(245, 158, 11, 0.85)" />
                      </linearGradient>
                    </defs>
                  </svg>
                </div>
                <div class="flow-nodes-grid">
                  <div class="flow-node">
                    <span class="flow-node-tag">01 / 开启</span>
                    <button type="button" class="flow-node-btn is-active" aria-current="step">
                      <svg class="flow-node-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                    </button>
                    <h3 class="flow-node-title">怎么开启打字？</h3>
                  </div>
                  <div class="flow-node">
                    <span class="flow-node-tag">02 / 结束</span>
                    <button type="button" class="flow-node-btn">
                      <svg class="flow-node-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    </button>
                    <h3 class="flow-node-title">说错了想结束？</h3>
                  </div>
                  <div class="flow-node">
                    <span class="flow-node-tag">03 / 发送</span>
                    <button type="button" class="flow-node-btn">
                      <svg class="flow-node-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                    <h3 class="flow-node-title">说完怎么发出去？</h3>
                  </div>
                </div>
              </section>
            </div>

            <!-- Desk 主栏 · 01 开启 -->
            <div class="flow-desk-panel">
              <div class="voice-flow-step keys-workflow-col voice-wake-root is-active-step" id="voiceSettingsWakeCard">
                <div class="keys-step-body">

                  <div class="voice-wake-flat-layout voice-phrase-panel voice-wake-phrase-panel">
                    <header class="voice-wake-toolbar">
                      <div class="voice-phrase-kind-tabs voice-wake-kind-tabs" role="tablist" aria-label="说完话要做什么">
                        <button type="button" class="voice-phrase-kind-tab is-on" role="tab" aria-selected="true">开始输入</button>
                        <button type="button" class="voice-phrase-kind-tab" role="tab" aria-selected="false">打开应用</button>
                      </div>
                    </header>

                    <div class="voice-phrase-kind-pane voice-wake-text-pane" role="tabpanel">

                      <!-- 统一口令池（合并 hero + alias） -->
                      <section class="voice-wake-section">
                        <h4 class="voice-wake-section-title">开启口令</h4>

                        <div class="voice-wake-pool-card voice-wake-alias-card">
                          <div class="voice-wake-pool-intro">
                            <div class="voice-wake-hero-meta">
                              <button type="button" class="voice-wake-status-badge is-off">语音未启用</button>
                            </div>
                            <p class="voice-wake-pool-desc">说出下面<strong>任意一句</strong>，即可开始听写。</p>
                          </div>

                          <div class="voice-phrase-tags voice-wake-active-tags voice-wake-alias-list" id="phrasePool" role="list" aria-label="开启口令列表">
                            <span class="voice-phrase-tag is-active is-default" role="listitem">
                              <button type="button" class="voice-phrase-tag-btn" tabindex="-1">开始听写</button>
                              <span class="voice-wake-primary-badge voice-wake-tag-default-badge">默认 · 响应最快</span>
                            </span>
                            <span class="voice-phrase-tag is-active" role="listitem">
                              <button type="button" class="voice-phrase-tag-btn" tabindex="-1">打开听写</button>
                              <button type="button" class="voice-phrase-tag-del" aria-label="删除打开听写" onclick="removePhrase(this)">×</button>
                            </span>
                            <span class="voice-phrase-tag is-active" role="listitem">
                              <button type="button" class="voice-phrase-tag-btn" tabindex="-1">语音输入</button>
                              <button type="button" class="voice-phrase-tag-del" aria-label="删除语音输入" onclick="removePhrase(this)">×</button>
                            </span>
                            <span class="voice-phrase-tag is-active" role="listitem">
                              <button type="button" class="voice-phrase-tag-btn" tabindex="-1">开启输入</button>
                              <button type="button" class="voice-phrase-tag-del" aria-label="删除开启输入" onclick="removePhrase(this)">×</button>
                            </span>
                          </div>

                          <!-- 产品内联添加（非 dialog） -->
                          <div class="voice-phrase-add-row voice-wake-add-row voice-wake-alias-add">
                            <div class="voice-wake-input-wrap">
                              <input type="text" class="voice-phrase-custom-input" id="phraseInput" autocomplete="off" spellcheck="false" maxlength="20" placeholder="例如：嘿，电脑" aria-label="自定义开启口令" />
                              <span class="voice-wake-input-count" id="phraseCount" aria-hidden="true">0/20</span>
                            </div>
                            <button type="button" class="voice-phrase-custom-add voice-wake-add-btn" onclick="addPhrase()">+ 添加</button>
                          </div>

                          <div class="voice-wake-test-row">
                            <button type="button" class="voice-wake-sandbox-btn">
                              <svg class="voice-wake-sandbox-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                              <span class="voice-wake-sandbox-label">真机测试口令</span>
                            </button>
                            <div class="voice-wake-test-feedback" aria-live="polite">模拟说出池内任意一句</div>
                          </div>

                          <p class="voice-wake-alias-hint">带「默认」标记的口令在自动模式下响应最快；其余口令效果相同。新增会同步到未单独覆盖的习惯。</p>
                        </div>
                      </section>

                    </div>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  (function(){
    var input=document.getElementById('phraseInput');
    var count=document.getElementById('phraseCount');
    if(input&&count){
      input.addEventListener('input',function(){
        count.textContent=String(input.value.length)+'/20';
      });
    }
  })();
  function removePhrase(btn){
    var pool=document.getElementById('phrasePool');
    if(pool.querySelectorAll('.voice-phrase-tag.is-active:not(.is-default)').length<=1){
      alert('至少保留一句开启口令'); return;
    }
    btn.closest('.voice-phrase-tag').remove();
  }
  function addPhrase(){
    var input=document.getElementById('phraseInput');
    var v=String(input&&input.value||'').trim();
    if(!v) return;
    var pool=document.getElementById('phrasePool');
    var tag=document.createElement('span');
    tag.className='voice-phrase-tag is-active';
    tag.setAttribute('role','listitem');
    tag.innerHTML=
      '<button type="button" class="voice-phrase-tag-btn" tabindex="-1"></button>'+
      '<button type="button" class="voice-phrase-tag-del" aria-label="删除" onclick="removePhrase(this)">×</button>';
    tag.querySelector('.voice-phrase-tag-btn').textContent=v;
    tag.querySelector('.voice-phrase-tag-del').setAttribute('aria-label','删除'+v);
    pool.appendChild(tag);
    input.value='';
    document.getElementById('phraseCount').textContent='0/20';
  }
</script>
</body>
</html>
