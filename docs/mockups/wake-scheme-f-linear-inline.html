<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案 F · Linear 属性行（无遮挡）原型</title>
  <style>
    :root{
      --bg:#eef1f5; --surface:#fff; --line:#e3e7ee; --line-soft:#f4f6f9;
      --text:#151922; --muted:#6b7384; --primary:#3b82f6; --primary-soft:#eaf2ff;
      --ok:#10b981; --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text);
      font:13px/1.45 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .top{
      position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid var(--line);
      padding:14px 18px;
    }
    .top h1{margin:0 0 4px; font-size:16px}
    .top p{margin:0; color:var(--muted); font-size:12px; max-width:820px}
    .wrap{padding:16px 18px 50px}
    .grid{display:grid; grid-template-columns:1fr; gap:16px; max-width:880px; margin:0 auto}
    .panel{
      background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
      box-shadow:0 6px 24px rgba(15,23,42,.06);
    }
    .rail{
      display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line);
      background:#fff;
    }
    .pill{
      font-size:10px; font-weight:700; padding:5px 9px; border-radius:9px; background:var(--line-soft);
      color:#7a879a; flex:0 0 auto;
    }
    .pill.on{background:var(--primary-soft); color:var(--primary)}

    .body{padding:14px 16px 18px; background:#f8fafc}

    .hero{
      border:1px solid var(--line); border-radius:12px; background:#fff; padding:14px 16px;
      margin-bottom:14px;
    }
    .meta{display:flex; align-items:center; gap:8px}
    .status{font-size:11px; padding:2px 8px; border-radius:999px; background:#fff7e6; color:#b7730a; font-weight:600}
    .fast{margin-left:auto; font-size:11px; color:#8a95a8; font-weight:600}
    .phrase{font-size:22px; font-weight:700; margin:10px 0 4px}
    .desc{margin:0; color:var(--muted)}
    .test{margin-top:12px; padding-top:10px; border-top:1px solid var(--line-soft); display:flex; gap:10px; align-items:center}
    .btn{
      border:0; background:var(--primary-soft); color:var(--primary);
      padding:7px 12px; border-radius:10px; font-weight:700; cursor:pointer;
      font-family:inherit;
    }
    .hint{color:#8a95a8; font-size:12px}

    .groupLabel{
      margin:10px 2px 8px; font-size:11px; letter-spacing:.05em; color:#8a95a8; text-transform:uppercase; font-weight:800;
    }

    .row{
      display:grid; grid-template-columns:92px 1fr; gap:10px; align-items:start;
      padding:12px 12px; border:1px solid var(--line-soft); border-radius:12px; background:#fff;
      margin-bottom:10px;
    }
    .key{color:#98a3b5; font-weight:800; font-size:11px; padding-top:3px}
    .val{min-width:0}

    .chips{display:flex; flex-wrap:wrap; gap:6px}
    .chip{
      border:1px solid #dbeafe; background:var(--primary-soft); color:var(--primary);
      border-radius:999px; padding:5px 10px; font-weight:700; font-size:11px;
      display:inline-flex; align-items:center; gap:8px;
    }
    .chip .x{
      width:16px; height:16px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:rgba(59,130,246,.12); color:var(--primary);
      font-size:12px; font-weight:900; cursor:pointer; line-height:1;
    }
    .addInline{
      display:flex; gap:8px; align-items:center; margin-top:10px;
    }
    .addInline input{
      flex:1;
      border:1px solid var(--line); border-radius:10px; padding:8px 10px; outline:none;
      font-family:inherit;
    }

    .kbd{
      display:inline-flex; gap:8px; align-items:center; flex-wrap:wrap;
      color:#6b7384;
    }
    kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:11px; padding:3px 8px; border-radius:10px; background:#f1f5f9; border:1px solid var(--line);
      color:#4b5563;
    }
    .inlineEditBtn{
      border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 10px;
      cursor:pointer; font-weight:800; color:#5a6476;
      font-family:inherit;
    }

    .footerNote{
      margin-top:14px; padding:12px 12px; border:1px dashed #d7dee9; background:#f9fbff; color:var(--muted);
      border-radius:12px; font-size:12px;
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>方案 F · Linear 属性行（无遮挡）</h1>
    <p>把“别名”和“输入目标”改成属性行内联可见/可编辑，不使用 popover/sheet，消除遮挡与对照成本。</p>
  </div>

  <div class="wrap">
    <div class="grid">
      <div class="panel">
        <div class="rail">
          <span class="pill on">01 开启</span>
          <span class="pill">02 结束</span>
          <span class="pill">03 发送</span>
        </div>

        <div class="body">
          <div class="hero">
            <div class="meta">
              <span class="status">语音未启用</span>
              <span class="fast">响应最快</span>
            </div>
            <div class="phrase">「开始听写」</div>
            <p class="desc">说出此口令后开始听写</p>
            <div class="test">
              <button class="btn" type="button" id="btnTest">试试口令</button>
              <span class="hint" id="hintTest">点击后可在真实实现里触发识别状态机。</span>
            </div>
          </div>

          <div class="groupLabel">口令配置（行内编辑）</div>

          <div class="row">
            <div class="key">别名</div>
            <div class="val">
              <div class="chips" id="aliasChips" role="listbox" aria-label="已启用的唤醒短语"></div>
              <div class="addInline">
                <input id="aliasInput" type="text" maxlength="20" placeholder="例如：嘿，电脑" autocomplete="off" />
                <button class="btn" type="button" id="btnAliasAdd">+ 添加</button>
              </div>
              <div class="footerNote">这里的“添加/删除”完全在行内完成，无需打开遮挡层。</div>
            </div>
          </div>

          <div class="row">
            <div class="key">输入目标</div>
            <div class="val">
              <div class="kbd">
                <kbd id="targetKbd">右 Alt</kbd>
                <span>触发后切换到听写状态</span>
              </div>
              <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <button class="inlineEditBtn" type="button" id="btnTargetEdit">改成别的快捷键（mock）</button>
                <span class="hint">真实实现：继续复用现有 `setSettingsPanel('keys')`。</span>
              </div>
              <div class="footerNote">输入目标不必遮挡主页面；编辑路径仍可落到按键页。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      aliases: ["开始听写","打开听写","语音输入","开启输入","开始输入"]
    };

    const chips = document.getElementById('aliasChips');
    const aliasInput = document.getElementById('aliasInput');
    const btnAliasAdd = document.getElementById('btnAliasAdd');

    function renderAliases(){
      chips.innerHTML = '';
      state.aliases.forEach((a, idx)=>{
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.setAttribute('role','option');
        chip.textContent = a;

        const x = document.createElement('span');
        x.className = 'x';
        x.textContent = '×';
        x.title = '删除';
        x.onclick = ()=>{
          state.aliases.splice(idx,1);
          renderAliases();
        };

        chip.appendChild(x);
        chips.appendChild(chip);
      });
    }

    btnAliasAdd.onclick = ()=>{
      const v = String(aliasInput.value||'').trim();
      if(!v) return;
      if(v.length > 20) return;
      state.aliases.push(v);
      aliasInput.value = '';
      renderAliases();
    };

    aliasInput.addEventListener('keydown',(e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        btnAliasAdd.click();
      }
    });

    document.getElementById('btnTest').onclick = ()=>{
      document.getElementById('hintTest').textContent = 'mock：这里会进入 试试口令 → 聆听 → 识别 的状态机。';
      setTimeout(()=>{ document.getElementById('hintTest').textContent = '点击后可在真实实现里触发识别状态机。'; }, 1800);
    };

    document.getElementById('btnTargetEdit').onclick = ()=>{
      // mock-only: rotate shortcut value
      const el = document.getElementById('targetKbd');
      const cur = el.textContent;
      const next = cur === '右 Alt' ? 'Ctrl + Win' : '右 Alt';
      el.textContent = next;
    };

    renderAliases();
  </script>
</body>
</html>
