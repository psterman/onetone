<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自定义快捷键</title>
<style>
:root{--bg:#f7f9fb;--card:#fff;--line:#d9e2eb;--text:#142333;--muted:#718294;--blue:#168dcc;--blue2:#eaf7ff;--orange:#ff9c3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.page{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:28px 0 54px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em}.top h1{margin:4px 0 5px;font-size:28px}.top p{margin:0;color:var(--muted)}button{font:inherit;cursor:pointer}.save{border:1px solid #a9d8ef;background:#e8f6fd;color:#0876ac;border-radius:9px;padding:9px 15px}.surface{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.target{display:flex;align-items:center;gap:15px;padding:20px 22px;border-bottom:1px solid var(--line)}.keycap{display:grid;place-items:center;width:58px;height:48px;border:1px solid #7dc7e9;border-bottom-width:3px;border-radius:11px;background:#f0fbff;font-size:17px;font-weight:800}.target h2{margin:0;font-size:18px}.target p{margin:3px 0 0;color:var(--muted)}.types{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);overflow:auto}.type{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;color:#4b5d6d}.type:hover,.type.active{color:#0876ac;border-color:#8ccbea;background:var(--blue2)}.type.active{font-weight:700}.list{padding:18px}.list-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.list-head h3{margin:0;font-size:16px}.list-head span{font-size:12px;color:var(--muted)}.action{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}.action-head{display:flex;align-items:center;gap:12px;padding:14px 15px}.drag{color:#a2afbb;letter-spacing:-3px;font-size:18px}.icon{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#eef7fb;color:var(--blue);font-weight:800}.action-main{flex:1}.action-title{font-weight:700}.action-sub{font-size:12px;color:var(--muted);margin-top:2px}.chip{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#0876ac;background:#edf8fd;border:1px solid #b8e0f2;border-radius:6px;padding:5px 8px}.more{border:0;background:transparent;color:#8293a2;font-size:20px;padding:4px 7px}.action.voice{border-color:#8bcceb;box-shadow:0 0 0 3px #effaff}.voice .icon{background:#e9f8ff}.voice-config{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px 15px 73px}.field{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fbfcfd}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.field strong{font-size:13px}.field.wide{grid-column:1/-1}.status{display:inline-flex;align-items:center;gap:6px;color:#19865b;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#2db979}.add{width:100%;border:1px dashed #a9c9d8;background:#f8fcfe;color:#1381b5;border-radius:11px;padding:12px;margin-top:4px}.footer{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.footer a{color:var(--blue);text-decoration:none}@media(max-width:650px){.top{display:block}.save{margin-top:15px}.voice-config{grid-template-columns:1fr;padding-left:59px}.field.wide{grid-column:auto}.chip{display:none}}
</style>
</head>
<body><main class="page">
<header class="top"><div><div class="eyebrow">ONETONE · 设置</div><h1>自定义快捷键</h1><p>把按键、文本、延迟和语音输入法组合成一条动作链。</p></div><button class="save" onclick="this.textContent='已保存';setTimeout(()=>this.textContent='保存设置',1200)">保存设置</button></header>
<section class="surface">
<div class="target"><div class="keycap">S1</div><div><h2>侧键 1</h2><p>按下后按顺序执行下方动作</p></div></div>
<nav class="types" aria-label="添加动作"><button class="type active">＋ 按键</button><button class="type">文本</button><button class="type">延迟</button><button class="type">文件</button><button class="type">文件夹</button><button class="type">网址</button><button class="type">语音输入法</button></nav>
<div class="list"><div class="list-head"><h3>动作列表</h3><span>共 3 个动作 · 可拖动排序</span></div>
<article class="action"><div class="action-head"><span class="drag">⋮⋮</span><span class="icon">⌨</span><div class="action-main"><div class="action-title">按键</div><div class="action-sub">执行自定义快捷键</div></div><span class="chip">Ctrl + K</span><button class="more">⋯</button></div></article>
<article class="action voice"><div class="action-head"><span class="drag">⋮⋮</span><span class="icon">声</span><div class="action-main"><div class="action-title">语音输入法 <span class="status"><i class="dot"></i>已配置</span></div><div class="action-sub">激活输入法，听写后按设定方式发送</div></div><span class="chip">右 Alt</span><button class="more">⋯</button></div><div class="voice-config"><div class="field"><label>输入法</label><strong>系统语音输入法</strong></div><div class="field"><label>识别键</label><strong>右 Alt</strong></div><div class="field"><label>说完后</label><strong>自动发送 · 等待 3 秒</strong></div><div class="field"><label>聚焦策略</label><strong>自己点进框</strong></div><div class="field wide"><label>兼容设置</label><strong>识别键未设置 · 录制快捷键不会改变它</strong></div></div></article>
<article class="action"><div class="action-head"><span class="drag">⋮⋮</span><span class="icon">⏱</span><div class="action-main"><div class="action-title">延迟</div><div class="action-sub">等待动作完成后继续</div></div><span class="chip">3 秒</span><button class="more">⋯</button></div></article>
<button class="add">＋ 添加动作</button></div>
<div class="footer"><span>提示：语音输入法是动作链中的一种特殊动作，原有配置会完整保留。</span><a href="#">恢复默认</a></div>
</section></main></body></html>
