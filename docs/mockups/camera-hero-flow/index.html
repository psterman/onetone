<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>摄像头 Hero 规划</title>
  <style>
    body{
      margin:0;
      padding:28px;
      font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      background:#f7f9fb;
      color:#17202a;
    }
    main{max-width:1280px;margin:0 auto;display:grid;gap:28px}
    h1{font-size:28px;margin:0}
    p{margin:6px 0 0;color:#64748b}
    .primary-link{
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:0 16px;
      border-radius:12px;
      background:#2b9c90;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      margin-top:16px;
    }
    .note{
      padding:18px;
      border:1px solid #d7dee8;
      border-radius:16px;
      background:#fff;
    }
    .note ul{margin:8px 0 0;padding-left:1.2em;color:#334155;line-height:1.55}
    figure{margin:0;display:grid;gap:10px}
    figcaption{font-weight:700;font-size:18px}
    img{
      display:block;
      width:100%;
      height:auto;
      border:1px solid #d7dee8;
      border-radius:16px;
      background:#fff;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>摄像头 Hero 规划</h1>
      <p>主路径两步；第三步「高级确认（可选）」Pro 仅用 badge，不进主标题。</p>
      <a class="primary-link" href="camera-hero-tabs.html">打开交互式 Hero 规划</a>
    </header>
    <section class="note">
      <strong>定稿（2026-07）：</strong>
      <ul>
        <li><b>01 摄像头看到什么</b>：总开关 + 离席/摇头/长眨 + 即将推出折叠 + 去高级确认。不含校准 / 九宫格。</li>
        <li><b>02 识别后做什么</b>：只绑结果。</li>
        <li><b>03 高级确认（可选）</b>：单列阅读线——安全规则横幅 → 粗三区 → 本机校准 → 9 宫格折叠 → 设备折叠 → Windows Hello 未来。</li>
        <li>校准 / 九宫格 DOM 与打开逻辑均在 Pro；不回跳 Trigger。</li>
      </ul>
    </section>
    <figure>
      <figcaption>图 1：摄像头看到什么（视觉触发）</figcaption>
      <img src="01-visual-trigger.svg" alt="视觉触发页面规划图">
    </figure>
    <figure>
      <figcaption>图 2：识别后做什么（执行动作）</figcaption>
      <img src="02-execution-action.svg" alt="执行动作页面规划图">
    </figure>
    <figure>
      <figcaption>图 3：高级确认（可选）单列阅读线</figcaption>
      <img src="03-gaze-management.svg" alt="高级确认规划图">
    </figure>
    <figure>
      <figcaption>图 4：历史视线标签整理（参考）</figcaption>
      <img src="04-gaze-tab-cleanup.svg" alt="视线管理标签页整理规划图">
    </figure>
  </main>
</body>
</html>
