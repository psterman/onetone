<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>摄像头 Hero 规划</title>
  <style>
    body{
      margin:0;
      padding:28px;
      font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      background:#f7f9fb;
      color:#17202a;
    }
    main{max-width:1280px;margin:0 auto;display:grid;gap:28px}
    h1{font-size:28px;margin:0}
    p{margin:6px 0 0;color:#64748b}
    .primary-link{
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:0 16px;
      border-radius:12px;
      background:#2b9c90;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      margin-top:16px;
    }
    .note{
      padding:18px;
      border:1px solid #d7dee8;
      border-radius:16px;
      background:#fff;
    }
    figure{margin:0;display:grid;gap:10px}
    figcaption{font-weight:700;font-size:18px}
    img{
      display:block;
      width:100%;
      height:auto;
      border:1px solid #d7dee8;
      border-radius:16px;
      background:#fff;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>摄像头 Hero 规划</h1>
      <p>产品能力仍是三段，默认 UI 为两主流程节点 +「看屏幕哪里确认」高级折叠。</p>
      <a class="primary-link" href="camera-hero-tabs.html">打开交互式 Hero 规划</a>
    </header>
    <section class="note">
      <strong>现行方向：</strong>
      <p>主流程：摄像头看到什么 → 识别后做什么。第三段「看屏幕哪里确认（可选）」默认折叠，避免小白以为要学三套。</p>
    </section>
    <figure>
      <figcaption>图 1：摄像头看到什么（视觉触发）</figcaption>
      <img src="01-visual-trigger.svg" alt="视觉触发页面规划图">
    </figure>
    <figure>
      <figcaption>图 2：识别后做什么（执行动作）</figcaption>
      <img src="02-execution-action.svg" alt="执行动作页面规划图">
    </figure>
    <figure>
      <figcaption>图 3：看屏幕哪里确认（高级折叠，非默认同级标签）</figcaption>
      <img src="03-gaze-management.svg" alt="视线确认高级区规划图">
    </figure>
    <figure>
      <figcaption>图 4：视线管理标签页整理</figcaption>
      <img src="04-gaze-tab-cleanup.svg" alt="视线管理标签页整理规划图">
    </figure>
  </main>
</body>
</html>
