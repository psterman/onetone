<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>01 开启 · 统一口令池 · Lucide</title>
  <style>
    :root{
      --primary:#2a9cc4;
      --primary-fg:#fff;
      --primary-soft:#e6f7fc;
      --primary-border:rgba(42,156,196,.35);
      --bg:#edf2f8;
      --card:#fff;
      --muted:#5a7086;
      --text:#152238;
      --border:rgba(26,45,74,.12);
      --border-strong:rgba(26,45,74,.18);
      --warn-bg:rgba(249,115,22,.10);
      --warn-fg:#c2410c;
      --radius:12px;
      --radius-sm:8px;
      --radius-lg:16px;
      --shadow:0 1px 3px rgba(26,45,74,.06),0 4px 16px rgba(26,45,74,.04);
      --icon:16px;
      --icon-sm:14px;
      --icon-lg:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;
      font:13px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 0%,rgba(42,156,196,.08),transparent 42%),
        var(--bg);
      -webkit-font-smoothing:antialiased;
    }

    /* Lucide SVG 基类 */
    .icon{display:block;flex-shrink:0}
    .icon--sm{width:var(--icon-sm);height:var(--icon-sm)}
    .icon--md{width:var(--icon-md,16px);height:var(--icon-md,16px)}
    .icon--lg{width:var(--icon-lg);height:var(--icon-lg)}

    .frame{max-width:440px;margin:28px auto;padding:0 16px 48px}
    .frame-note{margin:0 0 16px;font-size:12px;color:var(--muted);line-height:1.5}

    .panel{
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--card);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel-head{
      padding:12px 16px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#fafcfd,#f6fafc);
    }
    .panel-head h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
    .panel-body{padding:14px 16px 16px;display:grid;gap:12px}

    /* Tabs */
    .tabs{
      display:inline-flex;padding:3px;gap:2px;margin-left:auto;
      border:1px solid var(--border);border-radius:var(--radius-sm);
      background:#f8fafc;
    }
    .tab{
      height:28px;padding:0 12px;border:none;border-radius:6px;
      background:transparent;color:var(--muted);
      font:inherit;font-size:11px;font-weight:600;cursor:pointer;
      transition:background .15s,color .15s,box-shadow .15s;
    }
    .tab.is-on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(26,45,74,.08)}
    .pane-head{display:flex;justify-content:flex-end}

    /* Card */
    .pool-card{
      display:grid;gap:14px;padding:18px;
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      background:var(--card);
      box-shadow:var(--shadow);
    }

    .badge-status{
      display:inline-flex;align-items:center;gap:6px;
      height:26px;padding:0 10px;
      border-radius:999px;border:1px solid rgba(249,115,22,.25);
      background:var(--warn-bg);color:var(--warn-fg);
      font:inherit;font-size:11px;font-weight:600;cursor:pointer;
    }

    .pool-head{display:grid;gap:4px}
    .pool-title{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
    .pool-desc{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
    .pool-desc strong{color:var(--text);font-weight:600}

    /* Lucide chips — 描线图标 + 细边框 */
    .chip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

    .chip{
      display:inline-flex;align-items:center;gap:6px;
      max-width:100%;height:32px;padding:0 4px 0 10px;
      border-radius:var(--radius-sm);
      border:1px solid var(--border);
      background:#fafbfc;
      transition:border-color .15s,background .15s,box-shadow .15s;
    }
    .chip:hover{border-color:var(--border-strong)}

    .chip.is-default{
      padding-right:8px;
      border-color:var(--primary-border);
      background:var(--primary-soft);
      box-shadow:0 0 0 1px rgba(42,156,196,.08);
    }
    .chip.is-default .chip-text{color:#0d4a62;font-weight:600}
    .chip.is-default .chip-icon{color:var(--primary)}

    .chip-icon{display:flex;align-items:center;justify-content:center;color:var(--muted)}
    .chip-text{font-size:12px;font-weight:500;white-space:nowrap;color:var(--text)}

    .chip-tag{
      margin-left:2px;padding:2px 6px;border-radius:4px;
      font-size:10px;font-weight:600;white-space:nowrap;
      color:var(--primary);background:rgba(42,156,196,.12);
      border:1px solid rgba(42,156,196,.15);
    }

    .chip-remove{
      display:flex;align-items:center;justify-content:center;
      width:24px;height:24px;margin-right:2px;
      border:none;border-radius:6px;background:transparent;
      color:var(--muted);cursor:pointer;
      transition:background .12s,color .12s;
    }
    .chip-remove:hover{background:rgba(220,38,38,.08);color:#dc2626}

    .chip-add{
      padding:0 10px 0 8px;gap:5px;
      border-style:dashed;border-color:rgba(26,45,74,.22);
      background:transparent;cursor:pointer;
      color:var(--muted);font:inherit;font-size:12px;font-weight:600;
    }
    .chip-add .chip-icon{color:var(--primary)}
    .chip-add:hover{
      border-color:var(--primary-border);
      background:var(--primary-soft);color:#0d4a62;
    }

    .divider{height:1px;margin:0;border:none;background:var(--border)}

    .test-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

    /* Lucide 按钮 — outline + default */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:7px;
      height:36px;padding:0 14px;
      border-radius:var(--radius-sm);
      font:inherit;font-size:13px;font-weight:600;
      cursor:pointer;white-space:nowrap;
      transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
    }
    .btn-outline{
      border:1px solid var(--border);
      background:var(--card);color:var(--text);
    }
    .btn-outline:hover{
      border-color:var(--primary-border);
      background:var(--primary-soft);color:#0d4a62;
    }
    .btn-primary{
      border:1px solid var(--primary);
      background:var(--primary);color:var(--primary-fg);
      box-shadow:0 1px 2px rgba(42,156,196,.25);
    }
    .btn-primary:hover{background:#248fb5;border-color:#248fb5}
    .btn-ghost{
      border:none;background:transparent;color:var(--muted);
    }
    .btn-ghost:hover{background:#f1f5f9;color:var(--text)}

    .test-hint{font-size:12px;color:var(--muted)}

    .callout{
      display:flex;gap:10px;padding:10px 12px;
      border-radius:var(--radius-sm);
      border:1px solid var(--border);
      background:#f8fafc;
    }
    .callout-icon{color:var(--primary);margin-top:1px}
    .callout p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}

    /* Dialog */
    .scrim{
      position:fixed;inset:0;background:rgba(21,34,56,.35);
      display:none;align-items:center;justify-content:center;
      z-index:50;padding:20px;
    }
    .scrim.open{display:flex}
    .modal{
      width:min(380px,100%);padding:20px;
      border:1px solid var(--border);border-radius:var(--radius-lg);
      background:var(--card);box-shadow:0 12px 40px rgba(26,45,74,.14);
    }
    .modal-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
    .modal-head-icon{
      display:flex;align-items:center;justify-content:center;
      width:36px;height:36px;border-radius:var(--radius-sm);
      background:var(--primary-soft);color:var(--primary);flex-shrink:0;
    }
    .modal-head-text h3{margin:0 0 2px;font-size:15px;font-weight:600}
    .modal-head-text p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
    .input{
      width:100%;height:40px;padding:0 12px;
      border:1px solid var(--border);border-radius:var(--radius-sm);
      background:#fff;font:inherit;font-size:13px;color:var(--text);
      transition:border-color .15s,box-shadow .15s;
    }
    .input:focus{
      outline:none;border-color:var(--primary);
      box-shadow:0 0 0 3px rgba(42,156,196,.15);
    }
    .input-hint{margin:6px 0 0;font-size:11px;color:var(--muted)}
    .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  </style>
</head>
<body>

<!-- Lucide inline SVGs: stroke 2, round caps -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="ico-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="ico-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
  <symbol id="ico-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></symbol>
  <symbol id="ico-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="ico-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
  <symbol id="ico-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></symbol>
</svg>

<div class="frame">
  <p class="frame-note">01 开启 · Lucide 描线图标 + 产品主题色。统一口令池，与 Material 版同 IA，视觉更轻。</p>

  <article class="panel">
    <header class="panel-head">
      <h2>怎么开启打字？</h2>
    </header>
    <div class="panel-body">

      <div class="pane-head">
        <div class="tabs" role="tablist">
          <button type="button" class="tab is-on" role="tab">开始输入</button>
          <button type="button" class="tab" role="tab">打开应用</button>
        </div>
      </div>

      <section class="pool-card" aria-labelledby="poolTitle">
        <button type="button" class="badge-status">
          <svg class="icon icon--sm"><use href="#ico-alert"/></svg>
          语音未启用
        </button>

        <div class="pool-head">
          <h3 class="pool-title" id="poolTitle">开启口令</h3>
          <p class="pool-desc">说出下面<strong>任意一句</strong>，即可开始听写。</p>
        </div>

        <div class="chip-row" id="phrasePool" role="list">
          <span class="chip is-default" role="listitem">
            <span class="chip-icon"><svg class="icon icon--md"><use href="#ico-star"/></svg></span>
            <span class="chip-text">开始听写</span>
            <span class="chip-tag">默认 · 响应最快</span>
          </span>

          <span class="chip" role="listitem">
            <span class="chip-text" style="padding-left:4px">打开听写</span>
            <button type="button" class="chip-remove" aria-label="删除打开听写" onclick="removePhrase(this)">
              <svg class="icon icon--sm"><use href="#ico-x"/></svg>
            </button>
          </span>
          <span class="chip" role="listitem">
            <span class="chip-text" style="padding-left:4px">语音输入</span>
            <button type="button" class="chip-remove" aria-label="删除语音输入" onclick="removePhrase(this)">
              <svg class="icon icon--sm"><use href="#ico-x"/></svg>
            </button>
          </span>
          <span class="chip" role="listitem">
            <span class="chip-text" style="padding-left:4px">开启输入</span>
            <button type="button" class="chip-remove" aria-label="删除开启输入" onclick="removePhrase(this)">
              <svg class="icon icon--sm"><use href="#ico-x"/></svg>
            </button>
          </span>

          <button type="button" class="chip chip-add" onclick="openDialog()">
            <span class="chip-icon"><svg class="icon icon--md"><use href="#ico-plus"/></svg></span>
            添加
          </button>
        </div>

        <hr class="divider" />

        <div class="test-row">
          <button type="button" class="btn btn-outline">
            <svg class="icon icon--md"><use href="#ico-mic"/></svg>
            真机测试口令
          </button>
          <span class="test-hint">模拟说出池内任意一句</span>
        </div>

        <div class="callout">
          <svg class="icon icon--md callout-icon"><use href="#ico-info"/></svg>
          <p>带「默认」标记的口令在自动模式下响应最快；其余口令效果相同。新增会同步到未单独覆盖的习惯。</p>
        </div>
      </section>

    </div>
  </article>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-icon"><svg class="icon icon--lg"><use href="#ico-sparkles"/></svg></div>
      <div class="modal-head-text">
        <h3 id="dlgTitle">添加开启口令</h3>
        <p>说出即可开始听写，与池内其他口令效果相同</p>
      </div>
    </div>
    <input class="input" id="phraseInput" maxlength="20" placeholder="输入一句你更好记的话" autocomplete="off" />
    <p class="input-hint">例如：嘿电脑、帮我打字、开听写</p>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" onclick="closeDialog()">取消</button>
      <button type="button" class="btn btn-primary" onclick="addPhrase()">
        <svg class="icon icon--sm"><use href="#ico-plus"/></svg>
        添加
      </button>
    </div>
  </div>
</div>

<script>
  function openDialog(){
    document.getElementById('scrim').classList.add('open');
    var i=document.getElementById('phraseInput');
    i.value='';
    setTimeout(function(){i.focus();},0);
  }
  function closeDialog(){ document.getElementById('scrim').classList.remove('open'); }
  function removePhrase(btn){
    var pool=document.getElementById('phrasePool');
    if(pool.querySelectorAll('.chip:not(.is-default):not(.chip-add)').length<=1){
      alert('至少保留一句开启口令'); return;
    }
    btn.closest('.chip').remove();
  }
  function addPhrase(){
    var v=String(document.getElementById('phraseInput').value||'').trim();
    if(!v) return;
    var pool=document.getElementById('phrasePool');
    var addBtn=pool.querySelector('.chip-add');
    var tag=document.createElement('span');
    tag.className='chip';
    tag.setAttribute('role','listitem');
    tag.innerHTML=
      '<span class="chip-text" style="padding-left:4px"></span>'+
      '<button type="button" class="chip-remove" aria-label="删除" onclick="removePhrase(this)">'+
      '<svg class="icon icon--sm"><use href="#ico-x"/></svg></button>';
    tag.querySelector('.chip-text').textContent=v;
    tag.querySelector('.chip-remove').setAttribute('aria-label','删除'+v);
    pool.insertBefore(tag, addBtn);
    closeDialog();
  }
  document.getElementById('scrim').addEventListener('click',function(e){ if(e.target===this) closeDialog(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') closeDialog();
    if(e.key==='Enter' && document.getElementById('scrim').classList.contains('open')) addPhrase();
  });
</script>
</body>
</html>
