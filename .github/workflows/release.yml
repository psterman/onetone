name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build and publish updater assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          tagName: v__VERSION__
          releaseName: "OneTone v__VERSION__"
          releaseBody: |
            ## OneTone v__VERSION__

            **Requirements:** Windows 10/11 x64

            **First run:** Complete the welcome guide and map your hardware key to your voice-input shortcut.

            **SmartScreen:** If Windows blocks the installer, click **More info** → **Run anyway** (unsigned binary).

            **Config:** `%APPDATA%\onetone\config\settings.json` — updates replace the app only, not your settings.

            Supports in-app auto-update via GitHub Releases.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
