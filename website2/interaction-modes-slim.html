<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneTone · 交互方式</title>
  <style>
    :root{--bg:#0b0d12;--panel:#121620;--panel2:#171c28;--line:#2b3342;--text:#f5f7fb;--muted:#8e98aa;--accent:#7cf2c2;--blue:#8fb4ff;--orange:#ffbd73}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 80% 0%,#1c3040 0,#0b0d12 38%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;min-height:100vh}
    button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(1160px,calc(100% - 40px));margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#07110f;display:grid;place-items:center;font-weight:900}.sub{color:var(--muted);font-size:12px;font-weight:500;margin-left:4px}.nav{display:flex;gap:8px}.nav button{background:none;border:0;padding:9px 12px;color:var(--muted);border-radius:9px}.nav button.active,.nav button:hover{color:var(--text);background:#202735}.status{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:12px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent)}
    main{padding:64px 0 88px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.hero{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:42px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.05;letter-spacing:-.05em;margin:12px 0 16px;max-width:650px}.hero p{color:var(--muted);font-size:16px;max-width:560px;margin:0}.hero-note{width:230px;color:var(--muted);font-size:12px;border-left:1px solid var(--line);padding-left:18px}.hero-note strong{display:block;color:var(--text);font-size:14px;margin-bottom:7px}
    .workspace{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:linear-gradient(145deg,rgba(24,30,43,.95),rgba(15,19,28,.94));border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.2)}.panel-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:22px}.panel h2{font-size:17px;margin:0 0 5px}.panel-head p{margin:0;color:var(--muted);font-size:12px}.gear{background:#202735;border:1px solid #384153;border-radius:9px;padding:9px 11px;color:var(--muted)}
    .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{min-height:148px;text-align:left;background:#151b27;border:1px solid #2d3545;border-radius:15px;padding:16px;transition:.2s}.mode:hover{transform:translateY(-2px);border-color:#596780}.mode.active{background:linear-gradient(160deg,rgba(124,242,194,.16),#151b27 62%);border-color:var(--accent);box-shadow:0 0 0 1px rgba(124,242,194,.15),0 12px 35px rgba(124,242,194,.08)}.icon{font-size:24px;margin-bottom:22px}.mode strong{display:block;font-size:15px}.mode span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.mode .tag{display:inline-block;color:var(--accent);font-size:10px;margin-top:14px;background:rgba(124,242,194,.1);padding:3px 6px;border-radius:5px}
    .softpad{height:100%;display:flex;flex-direction:column}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:auto}.key{height:57px;border:1px solid #394356;background:#202735;border-radius:12px;display:grid;place-items:center;color:#dce4f1;font-size:13px}.key.big{grid-column:span 2}.key.accent{background:rgba(143,180,255,.16);border-color:#6e91d1;color:var(--blue)}.key.green{background:rgba(124,242,194,.14);border-color:#55b793;color:var(--accent)}.pad-label{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:0 0 14px}.pad-label b{color:var(--text);font-weight:600}
    .footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.pill{padding:6px 9px;border:1px solid #354052;border-radius:99px}.shortcut{color:var(--orange)}
    .toast{position:fixed;right:24px;bottom:24px;background:#eafcf5;color:#12251e;border-radius:13px;padding:13px 16px;box-shadow:0 16px 40px #0008;transform:translateY(20px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}
    @media(max-width:800px){.nav{display:none}.hero,.workspace{display:block}.hero-note{margin-top:26px}.panel{margin-top:16px}.modes{grid-template-columns:1fr}.mode{min-height:0}.softpad{min-height:350px}}
  </style>
</head>
<body>
  <header class="top shell"><div class="brand"><span class="mark">1</span>OneTone <span class="sub">交互工作台</span></div><nav class="nav"><button class="active">工作台</button><button>历史</button><button>设置</button></nav><div class="status"><i class="dot"></i>通道已连接</div></header>
  <main class="shell">
    <section class="hero"><div><div class="eyebrow">One place to act</div><h1>选择你最顺手的<br>交互方式。</h1><p>按键、语音与 Softpad 现在都属于同一个工作台。通道细节交给系统处理，你只需要选择怎么发出指令。</p></div><div class="hero-note"><strong>菜单已精简</strong>“通道”不再占用一级导航。连接状态保留在右上角，配置入口统一收进设置。</div></section>
    <section class="workspace">
      <div class="panel"><div class="panel-head"><div><h2>交互方式</h2><p>选择当前最适合你的输入方式</p></div><button class="gear" aria-label="打开设置">⚙</button></div><div class="modes">
        <button class="mode active" data-mode="按键"><div class="icon">⌨</div><strong>按键</strong><span>快速、确定、无需打断当前工作</span><em class="tag">当前使用</em></button>
        <button class="mode" data-mode="语音"><div class="icon">◉</div><strong>语音</strong><span>自然说出指令，适合连续操作</span></button>
        <button class="mode" data-mode="Softpad"><div class="icon">▦</div><strong>Softpad</strong><span>把常用动作放到触手可及的位置</span></button>
      </div><div class="footer-row"><span>当前动作：发送到活动窗口</span><span class="pill shortcut">Ctrl + Enter</span></div></div>
      <div class="panel softpad"><div class="panel-head"><div><h2>Softpad</h2><p>常用动作预览</p></div><span class="pill">4 个动作</span></div><div class="pad-label"><span>我的工作台</span><b>已同步</b></div><div class="pad"><button class="key accent">撤销</button><button class="key">新建</button><button class="key green">发送</button><button class="key">暂停</button><button class="key big">语音输入</button><button class="key">清空</button><button class="key">更多</button></div></div>
    </section>
  </main>
  <div class="toast" id="toast">已切换交互方式</div>
  <script>
    const toast=document.querySelector('#toast'); document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mode').forEach(x=>{x.classList.remove('active');x.querySelector('.tag')?.remove()});btn.classList.add('active');const tag=document.createElement('em');tag.className='tag';tag.textContent='当前使用';btn.append(tag);toast.textContent=`已切换到${btn.dataset.mode}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}));
  </script>
</body>
</html>
