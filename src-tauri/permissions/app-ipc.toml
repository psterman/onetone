# Bundles all autogenerated allow-cmd-* permissions for the main window.
[[set]]
identifier = "app-ipc"
description = "Allow all application IPC commands"
permissions = [
  "allow-cmd-ready",
  "allow-cmd-save",
  "allow-cmd-start-recording",
  "allow-cmd-stop-recording",
  "allow-cmd-pause",
  "allow-cmd-resume",
  "allow-cmd-request-runtime",
  "allow-cmd-process-usage",
  "allow-cmd-capture-source",
  "allow-cmd-frontend-keydown",
  "allow-cmd-physical-trigger",
  "allow-cmd-test-send",
  "allow-cmd-mapping-toggle",
  "allow-cmd-mapping-delete",
  "allow-cmd-mapping-duplicate",
  "allow-cmd-mapping-reorder",
  "allow-cmd-mapping-set-group",
  "allow-cmd-mapping-set-source-key",
  "allow-cmd-mapping-conflicts",
  "allow-cmd-reload-latest",
  "allow-cmd-window-minimize",
  "allow-cmd-window-close",
  "allow-cmd-sync-theme-backdrop",
  "allow-cmd-tray-menu-ready",
  "allow-cmd-tray-action",
  "allow-cmd-tray-menu-present",
  "allow-cmd-autostart-get",
  "allow-cmd-autostart-set",
  "allow-cmd-mic-list",
