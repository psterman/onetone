  "allow-cmd-voice-sapi-set-phrases",
  "allow-cmd-voice-sapi-set-min-confidence",
  "allow-cmd-voice-sapi-test-send",
  "allow-cmd-voice-vosk-status",
  "allow-cmd-voice-vosk-set-enabled",
  "allow-cmd-voice-vosk-set-phrases",
  "allow-cmd-voice-vosk-set-model-preset",
  "allow-cmd-voice-vosk-set-model-path",
  "allow-cmd-voice-vosk-test-send",
  "allow-cmd-voice-end-status",
  "allow-cmd-voice-end-set-enabled",
  "allow-cmd-voice-end-set-auto-send",
  "allow-cmd-voice-end-set-commit-delay",
  "allow-cmd-voice-end-set-phrases",
  "allow-cmd-voice-end-test-stop",
  "allow-cmd-voice-end-test-commit",
