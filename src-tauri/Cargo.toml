[workspace]
members = ["crates/onetone-logic"]
resolver = "2"

[package]
name = "onetone"
version = "1.0.0"
edition = "2021"

[lib]
# Unit tests in lib modules crash on Windows (STATUS_ENTRYPOINT_NOT_FOUND) when the Tauri
# test harness loads the full native stack. Pure-logic tests live in tests/ instead.
test = false

[features]
default = ["vosk-engine"]
# Offline Vosk wake word (native libvosk). Disabled in `cargo test` via .cargo/config.toml alias.
vosk-engine = ["dep:vosk"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
enigo = "0.2"
notify = { version = "6", features = ["macos_kqueue"] }
directories = "5"
parking_lot = "0.12"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6"
image = "0.25"
cpal = "0.15"
crossbeam-channel = "0.5"
onetone-logic = { path = "crates/onetone-logic" }

[target.'cfg(windows)'.dependencies]
vosk = { version = "0.3.1", optional = true }
winapi = { version = "0.3", features = ["winuser", "libloaderapi", "minwindef", "synchapi", "processthreadsapi", "psapi", "xinput", "shellapi"] }
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Speech",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_Foundation",
  "Win32_System_Variant",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
image = "0.25"
