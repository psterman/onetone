<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · Agent 工作记录（嵌在现有 Agent 页）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%233a4580'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="../../src/css/codex-micro-pad.css" />
  <link rel="stylesheet" href="../../src/css/codex-micro-pad-skins.css" />
  <link rel="stylesheet" href="../../src/css/soft-pad-hub.css" />
</head>
<body class="review">
  <aside class="chrome" id="chrome" aria-label="原型审阅工具">
    <div>
      <h1>Agent 工作记录</h1>
      <p class="blurb">把 Agent 当成<strong>帮手</strong>：先告诉你「你现在可以」做什么，再列「最近帮过」。不用懂会话、探针这些词。</p>
    </div>

    <div class="chrome-section">
      <p class="chrome-label">工作记录权重</p>
      <div class="variant-bar" id="variantBar" aria-label="原型变体"></div>
    </div>

    <div class="chrome-section">
      <p class="chrome-label">数据状态</p>
      <div class="mode-bar" id="modeBar" aria-label="数据状态"></div>
    </div>

    <div class="chrome-section chrome-body">
      <p class="chrome-label">框架约束</p>
      <ul class="chrome-notes">
        <li>小白话术：它现在 / 要你吗 / 顺不顺 / 做到哪</li>
        <li>首屏一件事：「你现在可以」+ 一个按钮</li>
        <li>「最近帮过」短列表；帮手键盘默认折叠</li>
        <li>用量不造假，详细进「数据」</li>
      </ul>
    </div>

    <div class="chrome-section chrome-body">
      <label class="chk"><input type="checkbox" id="listeningToggle" /> 模拟正在倾听</label>
      <label class="chk"><input type="checkbox" id="emptyToggle" /> 空记录态</label>
      <label class="chk"><input type="checkbox" id="livePadToggle" /> 加载真 Soft Pad（livePad）</label>
      <label class="chk"><input type="checkbox" id="liveSnapToggle" /> 实况快照（cmd_agent_home_snapshot）</label>
    </div>

    <div class="chrome-actions chrome-body">
      <a id="canvasOnlyLink" href="?variant=timeline&amp;mode=quiet&amp;canvas=1" target="_blank" rel="noopener">单独打开画布</a>
      <button type="button" id="toggleChrome" aria-pressed="false">收起说明</button>
    </div>
  </aside>

  <div class="viewport">
    <div class="frame-wrap">
      <p class="frame-label">
        Agent 页画布（含全局侧栏）
        <span class="size" id="frameSizeLabel">980 × 720</span>
        <span class="hint" id="frameSizeHint">· 真尺寸</span>
      </p>
      <div class="frame" id="productFrame" role="region" aria-label="OneTone Agent 页 980×720">
        <div id="stage" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../src/js/features/agent/agent-home-pulse.js"></script>
  <script src="./shared.js"></script>
  <script src="./soft-pad-glance-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
