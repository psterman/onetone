<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 会话工作台</title>
  <style>
    :root{--bg:#e8ebe8;--paper:#faf9f5;--panel:#fffefa;--soft:#f1f3ef;--ink:#1b2a3e;--muted:#718094;--faint:#a5aeb8;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--blue-soft:#edf2f8;--amber:#a36525;--amber-soft:#fff0dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:292px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .history{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.history-head{padding:25px 20px 17px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:23px;color:var(--teal);font-size:14px;font-weight:850}.brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.history-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.history-title h1{margin:0;font-size:19px;letter-spacing:-.03em}.history-title button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{display:flex;align-items:center;gap:8px;margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.session-list{min-height:0;overflow:auto;padding:0 10px 18px}.group-label{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.session{display:block;width:100%;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.session:hover{background:#fff}.session.active{border-color:var(--teal-line);background:#fffefa;box-shadow:0 2px 6px rgba(30,50,55,.04)}.session-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}.session-title{overflow:hidden;color:var(--ink);font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.session-time{color:var(--faint);font-size:10px;white-space:nowrap}.session-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.session-meta i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.session-meta i.warn{background:var(--amber)}.history-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.history-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 38px 23px;background:var(--paper)}.content{width:100%;height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:12px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-size:10px;font-weight:800}.system{border:0;background:transparent;color:var(--muted);font-size:10px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:38px 0 24px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.intro h2{margin:0 0 9px;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-.05em}.intro p{max-width:590px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.listen{padding:10px 14px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;white-space:nowrap}.listen:hover{background:#07645f}
    .conversation{min-height:0;flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px}.thread{min-height:0;overflow:auto;padding:3px 4px 6px 0}.turn{display:grid;grid-template-columns:74px minmax(0,1fr);gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.turn:last-child{border-bottom:0}.turn-label{padding-top:3px;color:var(--faint);font-size:10px}.turn-body{min-width:0}.turn-body strong{display:block;margin-bottom:6px;font-size:13px}.turn-body p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.turn-body p.quote{color:var(--ink);font-size:14px;line-height:1.55}.result{margin-top:10px;padding:12px 13px;border:1px solid #d6e2ee;border-radius:9px;background:var(--blue-soft)}.result-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:#587399;font-size:10px;font-weight:850}.result p{color:#5e6d84}.result button{margin-top:9px;padding:0;border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}
    .work-footer{display:grid;gap:10px}.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.channel{min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff}.channel-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}.channel-icon{display:grid;place-items:center;width:21px;height:21px;border-radius:6px;background:var(--teal-soft);color:var(--teal);font-size:11px}.channel strong{font-size:11px}.channel small{display:block;overflow:hidden;color:var(--muted);font-size:9px;text-overflow:ellipsis;white-space:nowrap}.channel.ready .channel-icon{background:var(--teal-soft)}.channel.wait .channel-icon{background:var(--amber-soft);color:var(--amber)}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--teal-line);border-radius:9px;background:#f3faf7}.actions-copy{color:var(--muted);font-size:10px}.actions-copy strong{color:var(--ink);font-size:11px}.action-buttons{display:flex;gap:7px}.action-buttons button{padding:8px 10px;border-radius:7px;font-size:10px}.action-buttons .main-action{border:0;background:var(--teal);color:#fff;font-weight:800}.action-buttons .sub-action{border:1px solid var(--teal-line);background:#fff;color:var(--teal)}.trail{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:9px}.trail span{display:inline-flex;align-items:center;gap:5px}.trail i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.trail b{color:var(--ink)}.trail-arrow{color:var(--faint)}.trail button{margin-left:auto;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}
    .live-dock{position:fixed;left:50%;bottom:24px;z-index:10;width:min(630px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 14px 38px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live-dock.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:7px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:10px;color:var(--ink);font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:10px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:11;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1000px){main{padding:21px 25px}.window{grid-template-columns:260px minmax(0,1fr)}.channels{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.intro{display:block;margin-top:27px}.listen{margin-top:15px}.top-actions{display:none}.turn{grid-template-columns:52px minmax(0,1fr)}.channel small{font-size:8px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const sessions=[
      {group:'正在进行',title:'首页 · AI 工作现场',time:'现在',meta:'Cursor · voice-pilot',status:'active',intent:'把首页做成 AI 辅助工作现场',result:'已形成中央工作核心方案，等待你确认下一步。'},
      {group:'今天',title:'重新规划首页',time:'14:32',meta:'Cursor · voice-pilot',status:'ready',intent:'不要展示通道，要让四个通道共同工作',result:'已生成 4 个原型并进入重绘。'},
      {group:'今天',title:'整理首页架构',time:'13:58',meta:'Cursor · voice-pilot',status:'ready',intent:'把历史记录放进 Agent 工作首页',result:'已确认 Agent 工作记录归属。'},
      {group:'昨天',title:'Soft Pad · Cursor 动作',time:'昨天',meta:'Cursor · 6 条动作',status:'ready',intent:'给常用 Agent 操作提供手边入口',result:'已记录确认、修改、继续和取消动作。'},
      {group:'更早',title:'第一次使用 OneTone',time:'周一',meta:'OneTone · 入门会话',status:'ready',intent:'试一次语音输入',result:'文字已送到当前输入位置。'}
    ];
    let selected=0;
    function history(){let last='';return `<aside class="history"><div class="history-head"><div class="brand"><span class="brand-mark">O</span>OneTone</div><div class="history-title"><h1>听见</h1><button data-action="新建会话">＋ 新会话</button></div><div class="search">⌕　搜索会话、项目或内容</div></div><div class="session-list">${sessions.map((s,i)=>{const group=s.group!==last;last=s.group;return `${group?`<div class="group-label">${s.group}</div>`:''}<button class="session ${i===selected?'active':''}" data-session="${i}"><div class="session-top"><span class="session-title">${s.title}</span><span class="session-time">${s.time}</span></div><div class="session-meta"><i class="${s.status==='warn'?'warn':''}"></i>${s.meta}</div></button>`}).join('')}</div><div class="history-foot"><strong>本地会话记录</strong><br>OneTone 实时记录 + Cursor 历史补全</div></aside>`}
    function channel(icon,title,detail,status='ready'){return `<div class="channel ${status}"><div class="channel-top"><span class="channel-icon">${icon}</span><strong>${title}</strong></div><small>${detail}</small></div>`}
    function main(){const s=sessions[selected];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>当前工作现场</strong><small>Cursor · voice-pilot · 首页</small></div></div><div class="top-actions"><span class="state">环境已确认</span><span>本地记录</span><button class="system" data-action="打开系统抽屉">系统</button></div></header><section class="intro"><div><p class="eyebrow">当前会话 · ${s.time}</p><h2>${s.title}</h2><p>这不是一条孤立的消息，而是一次可以继续的工作。OneTone 正在把你的输入、Cursor 会话和四个通道串在一起。</p></div><button class="listen" data-listen>开始倾听</button></section><div class="conversation"><div class="thread"><div class="turn"><div class="turn-label">你的意图</div><div class="turn-body"><p class="quote">“${s.intent}”</p></div></div><div class="turn"><div class="turn-label">OneTone</div><div class="turn-body"><strong>我已经结合当前项目理解这件事。</strong><p>目标：在 Cursor 的 voice-pilot 项目中继续当前首页工作。</p><div class="result"><div class="result-head"><span>Cursor Agent · 当前结果</span><span>可继续</span></div><p>${s.result}</p><button data-action="打开 Cursor 会话">打开 Cursor 会话 →</button></div></div></div><div class="turn"><div class="turn-label">下一步</div><div class="turn-body"><p>你可以继续发送、修改理解，或先查看判断依据。</p></div></div></div><div class="work-footer"><div class="channels">${channel('◎','看见','Cursor · voice-pilot · 首页')}${channel('⌁','听见','实时识别当前意图')}${channel('⌘','接管','Enter 确认 · Esc 取消','wait')}${channel('▦','动作','Soft Pad：继续 · 修改 · 依据')}</div><div class="actions"><div class="actions-copy"><strong>当前可执行</strong><br>继续这项工作，结果会回到本次会话</div><div class="action-buttons"><button class="sub-action" data-action="修改当前理解">修改理解</button><button class="sub-action" data-action="查看判断依据">查看依据</button><button class="main-action" data-action="继续发送">继续发送</button></div></div><div class="trail"><span><i></i>看见 <b>Cursor</b></span><span class="trail-arrow">→</span><span><i></i>听见 <b>重新规划首页</b></span><span class="trail-arrow">→</span><span><i></i>现在 <b>等待你的动作</b></span><button data-action="展开完整轨迹">展开完整轨迹</button></div></div></div></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=history()+main();win.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.session);mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：会话工作台已响应`)));win.querySelector('[data-listen]').addEventListener('click',listen)}function listen(){let dock=document.querySelector('.live-dock');if(!dock){dock=document.createElement('div');dock.className='live-dock';document.body.appendChild(dock)}dock.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · Cursor</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想继续完善首页的会话轨迹……<br><small>实时识别中 · 结束后会追加到当前会话</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：会话轨迹已更新`)}))}mount();
  </script>
</body>
</html>
