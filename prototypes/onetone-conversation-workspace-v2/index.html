<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 证据驱动会话首页</title>
  <style>
    :root{--bg:#e9ece9;--paper:#fbfaf7;--panel:#fffefa;--soft:#f1f3ef;--ink:#1b2a3e;--muted:#728094;--faint:#a6afb9;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--blue-soft:#edf2f8;--amber:#a36525;--amber-soft:#fff0dc;--red:#a84f4a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:292px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .history{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.history-head{padding:24px 20px 15px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:23px;color:var(--teal);font-size:14px;font-weight:850}.brand-mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.history-title{display:flex;justify-content:space-between;align-items:center}.history-title h1{margin:0;font-size:19px;letter-spacing:-.03em}.new-session{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{display:flex;align-items:center;gap:8px;margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.session-list{min-height:0;overflow:auto;padding:0 10px 15px}.group-label{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.session{display:block;width:100%;padding:11px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.session:hover{background:#fff}.session.active{border-color:var(--teal-line);background:#fffefa;box-shadow:0 2px 6px rgba(30,50,55,.04)}.session-top{display:flex;justify-content:space-between;gap:9px;margin-bottom:6px}.session-title{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.session-time{color:var(--faint);font-size:10px;white-space:nowrap}.session-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.session-meta i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.session-meta i.import{background:#7594bb}.session-source{margin-left:auto;color:var(--faint);font-size:9px}.history-foot{margin-top:auto;padding:13px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.history-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 40px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:970px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:12px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-size:10px;font-weight:800}.system{border:0;background:transparent;color:var(--muted);font-size:10px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:36px 0 23px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.intro h2{margin:0 0 9px;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-.05em}.intro p{max-width:630px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.listen{padding:10px 14px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-size:11px;font-weight:800;white-space:nowrap}.listen:hover{background:#07645f}
    .session-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.session-bar-main{display:flex;align-items:center;gap:9px;min-width:0}.session-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal);font-size:11px;font-weight:900}.session-bar strong{font-size:11px}.session-bar small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.session-bar-actions{display:flex;align-items:center;gap:10px;white-space:nowrap}.session-bar-actions span{color:var(--muted);font-size:9px}.session-bar-actions button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}
    .body{min-height:0;flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:13px;margin-top:13px}.thread{min-height:0;overflow:auto;padding-right:5px}.event{display:grid;grid-template-columns:80px minmax(0,1fr);gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event-label{padding-top:3px;color:var(--faint);font-size:10px}.source{display:inline-block;margin-top:7px;padding:3px 5px;border-radius:4px;background:#edf1ee;color:var(--muted);font-size:8px}.source.live{background:var(--teal-soft);color:var(--teal)}.source.import{background:#eaf0f8;color:#5d789e}.event-content{min-width:0}.event-content strong{display:block;margin-bottom:6px;font-size:13px}.event-content p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.quote{color:var(--ink)!important;font-size:14px!important}.evidence{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:9px}.evidence i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.evidence button{padding:0;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}.reply{margin-top:10px;padding:12px 13px;border:1px solid #d6e2ee;border-radius:9px;background:var(--blue-soft)}.reply-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;color:#587399;font-size:10px;font-weight:850}.reply-head .pending{color:var(--amber)}.reply p{color:#5e6d84}.reply-actions{display:flex;gap:9px;margin-top:9px}.reply-actions button{padding:0;border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}
    .action-zone{display:grid;gap:9px}.action-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 12px;border:1px solid var(--teal-line);border-radius:9px;background:#f3faf7}.action-copy{color:var(--muted);font-size:10px}.action-copy strong{display:block;margin-bottom:2px;color:var(--ink);font-size:11px}.actions{display:flex;gap:7px}.actions button{padding:8px 10px;border-radius:7px;font-size:10px}.actions .main{border:0;background:var(--teal);color:#fff;font-weight:800}.actions .sub{border:1px solid var(--teal-line);background:#fff;color:var(--teal)}.trace{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:9px}.trace span{display:inline-flex;align-items:center;gap:5px}.trace i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.trace b{color:var(--ink)}.trace .arrow{color:var(--faint)}.trace button{margin-left:auto;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}
    .evidence-drawer{position:fixed;right:24px;top:24px;z-index:20;width:min(370px,calc(100vw - 48px));padding:17px;border:1px solid var(--line);border-radius:12px;background:#fffefa;box-shadow:0 14px 40px rgba(30,45,50,.17);transform:translateX(18px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.evidence-drawer.show{transform:translateX(0);opacity:1;pointer-events:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.drawer-head strong{font-size:13px}.drawer-close{border:0;background:transparent;color:var(--muted);font-size:18px}.proof{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}.proof-dot{width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--teal)}.proof-dot.wait{background:var(--amber)}.proof strong{display:block;margin-bottom:3px;font-size:11px}.proof p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.proof small{display:block;margin-top:5px;color:var(--faint);font-size:9px}.drawer-note{margin-top:12px;padding:9px 10px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:9px;line-height:1.45}
    .live-dock{position:fixed;left:50%;bottom:24px;z-index:30;width:min(630px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 14px 38px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live-dock.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:7px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:10px;color:var(--ink);font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:10px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:31;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1000px){main{padding:21px 25px}.window{grid-template-columns:260px minmax(0,1fr)}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.intro{display:block;margin-top:27px}.listen{margin-top:15px}.top-actions{display:none}.event{grid-template-columns:55px minmax(0,1fr)}.action-bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.trace{align-items:flex-start;flex-wrap:wrap}.trace button{margin-left:0}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const sessions=[
      {group:'正在进行',title:'首页 · AI 工作现场',time:'现在',meta:'Cursor · voice-pilot',source:'OneTone + Cursor',kind:'live',intent:'把首页做成 AI 辅助工作现场',result:'已形成中央工作核心方案，等待你确认下一步。',status:'等待回执'},
      {group:'今天',title:'重新规划首页',time:'14:32',meta:'Cursor · voice-pilot',source:'Cursor 历史',kind:'import',intent:'不要展示通道，要让四个通道共同工作',result:'已生成 4 个原型并进入重绘。',status:'已导入'},
      {group:'今天',title:'整理首页架构',time:'13:58',meta:'Cursor · voice-pilot',source:'Cursor 历史',kind:'import',intent:'把历史记录放进 Agent 工作首页',result:'已确认 Agent 工作记录归属。',status:'已导入'},
      {group:'昨天',title:'Soft Pad · Cursor 动作',time:'昨天',meta:'Cursor · 6 条动作',source:'OneTone 事件',kind:'live',intent:'给常用 Agent 操作提供手边入口',result:'已记录确认、修改、继续和取消动作。',status:'已记录'},
      {group:'更早',title:'第一次使用 OneTone',time:'周一',meta:'OneTone · 入门会话',source:'OneTone 事件',kind:'live',intent:'试一次语音输入',result:'文字已送到当前输入位置。',status:'已记录'}
    ];
    let selected=0,acknowledged=false;
    function history(){let last='';return `<aside class="history"><div class="history-head"><div class="brand"><span class="brand-mark">O</span>OneTone</div><div class="history-title"><h1>听见</h1><button class="new-session" data-action="新建会话">＋ 新会话</button></div><div class="search">⌕　搜索会话、项目或内容</div></div><div class="session-list">${sessions.map((s,i)=>{const group=s.group!==last;last=s.group;return `${group?`<div class="group-label">${s.group}</div>`:''}<button class="session ${i===selected?'active':''}" data-session="${i}"><div class="session-top"><span class="session-title">${s.title}</span><span class="session-time">${s.time}</span></div><div class="session-meta"><i class="${s.kind==='import'?'import':''}"></i>${s.meta}<span class="session-source">${s.kind==='import'?'Cursor 历史':'OneTone'}</span></div></button>`}).join('')}</div><div class="history-foot"><strong>会话来源透明</strong><br>OneTone 实时记录 · Cursor 历史导入<br>没有回执的内容不会标记为已完成</div></aside>`}
    function eventData(s){return `<div class="event"><div class="event-label">${s.time}<span class="source live">OneTone 实时</span></div><div class="event-content"><strong>听见用户意图</strong><p class="quote">“${s.intent}”</p><div class="evidence"><i></i>来源：麦克风识别 · 当前项目已确认 <button data-action="查看输入来源">查看来源</button></div></div></div><div class="event"><div class="event-label">Cursor<br>历史<span class="source import">Cursor 导入</span></div><div class="event-content"><strong>Cursor 会话结果</strong><p>${s.result}</p><div class="reply"><div class="reply-head"><span>Agent 回执状态</span><span class="${acknowledged?'':'pending'}">${acknowledged?'已收到回执':s.status}</span></div><p>${acknowledged?'Cursor 已返回本次会话的结果，可以继续下一步。':'当前只有历史记录或执行意图，尚未收到新的 Cursor 回执。'}</p><div class="reply-actions"><button data-action="打开 Cursor 会话">打开 Cursor 会话 →</button><button data-action="查看完整对话">查看完整对话</button></div></div></div></div><div class="event"><div class="event-label">当前</div><div class="event-content"><strong>${acknowledged?'下一步已生成':'下一步需要真实回执'}</strong><p>${acknowledged?'可以继续发送新的指令，或把本次结果保存为工作节点。':'不要把“已交给 Cursor”显示成完成；等待 Cursor 返回后再更新轨迹。'}</p></div></div>`}
    function main(){const s=sessions[selected];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>当前工作现场</strong><small>Cursor · voice-pilot · 首页</small></div></div><div class="top-actions"><span class="state">${acknowledged?'回执已确认':'等待回执'}</span><span>本地记录</span><button class="system" data-action="打开系统抽屉">系统</button></div></header><section class="intro"><div><p class="eyebrow">会话轨迹 · ${s.time}</p><h2>${s.title}</h2><p>这里显示真实来源、当前状态和下一步动作。历史导入不会伪装成实时回执。</p></div><button class="listen" data-listen>开始倾听</button></section><div class="session-bar"><div class="session-bar-main"><span class="session-mark">↗</span><div><strong>${s.meta}</strong><small>${s.source} · 会话 ID：local-${selected+1} · 最近更新 ${s.time}</small></div></div><div class="session-bar-actions"><span>${s.kind==='import'?'历史导入':'实时捕获'}</span><button data-action="复制会话路径">复制路径</button></div></div><div class="body"><div class="thread">${eventData(s)}</div><div class="action-zone"><div class="action-bar"><div class="action-copy"><strong>${acknowledged?'当前可执行动作':'当前没有可确认的完成结果'}</strong>${acknowledged?'继续这项工作，动作会写回当前会话。':'可以查看来源、打开 Cursor，或等待真实回执。'}</div><div class="actions"><button class="sub" data-action="查看判断依据">查看依据</button><button class="sub" data-action="打开 Cursor 会话">打开 Cursor</button>${acknowledged?'<button class="main" data-action="继续发送">继续发送</button>':'<button class="main" data-action="等待 Cursor 回执">等待回执</button>'}</div></div><div class="trace"><span><i></i>OneTone 捕获</span><span class="arrow">→</span><span><i></i>意图已识别</span><span class="arrow">→</span><span><i class="${acknowledged?'':'warn'}"></i>${acknowledged?'Cursor 回执已收到':'Cursor 回执待确认'}</span><button data-evidence>展开判断依据</button></div></div></div></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=history()+main();win.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.session);acknowledged=false;mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.action;if(action==='等待 Cursor 回执'){acknowledged=true;mount();notice('已收到模拟 Cursor 回执：现在可以继续')}else notice(`${action}：会话工作台已响应`)}));win.querySelector('[data-listen]').addEventListener('click',listen);win.querySelector('[data-evidence]').addEventListener('click',openEvidence)}function openEvidence(){let d=document.querySelector('.evidence-drawer');if(!d){d=document.createElement('aside');d.className='evidence-drawer';d.innerHTML='<div class="drawer-head"><strong>这条轨迹的判断依据</strong><button class="drawer-close">×</button></div><div class="proof"><i class="proof-dot"></i><div><strong>当前工作目标</strong><p>Cursor 前台窗口 · voice-pilot 项目 · 首页</p><small>来源：当前环境快照 · 已确认</small></div></div><div class="proof"><i class="proof-dot"></i><div><strong>用户意图</strong><p>“把首页做成 AI 辅助工作现场”</p><small>来源：OneTone 麦克风实时转写 · 刚刚</small></div></div><div class="proof"><i class="proof-dot wait"></i><div><strong>Cursor 回执</strong><p>尚未从当前执行中收到新的回执</p><small>来源：Cursor 历史导入 / 实时回执待确认</small></div></div><div class="drawer-note">页面只显示已经有来源的数据。没有回执，就不会把动作标记为完成。</div>';document.body.appendChild(d);d.querySelector('.drawer-close').addEventListener('click',()=>d.classList.remove('show'))}d.classList.add('show')}
    function listen(){let dock=document.querySelector('.live-dock');if(!dock){dock=document.createElement('div');dock.className='live-dock';document.body.appendChild(dock)}dock.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · Cursor</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想继续完善首页的会话轨迹……<br><small>实时识别中 · 结束后会追加到当前会话</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：会话轨迹已更新`)}))}mount();
  </script>
</body>
</html>
