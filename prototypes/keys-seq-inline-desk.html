<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>动作序列 · 行内编辑（无弹窗）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@450;550;650;750&family=IBM+Plex+Mono:wght@500;650&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #13202c;
      --muted: #5a6b7c;
      --faint: #8494a6;
      --line: #d5dee8;
      --paper: #fff;
      --wash: #f1f6f9;
      --rail: #eef3f7;
      --bg: #e4ebf1;
      --cyan: #2a9cc4;
      --cyan-ink: #0f5f7a;
      --cyan-soft: #e4f2f9;
      --cyan-bd: #9bc6da;
      --danger: #b42318;
      --font: "IBM Plex Sans", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(520px 220px at 8% -6%, rgba(42,156,196,0.12), transparent 55%),
        var(--bg);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    .bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
      padding: 10px 16px;
      background: #13202c; color: #c5d0de;
      font-size: 12.5px;
    }
    .bar strong { color: #fff; }
    .bar a { color: #7dd3fc; font-weight: 650; text-decoration: none; }

    .shell {
      width: min(720px, 100%);
      margin: 20px auto 48px;
      padding: 0 14px;
      display: grid;
      gap: 14px;
    }

    .note {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }
    .note b { color: var(--ink); font-weight: 650; }

    /* —— desk —— */
    .desk {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: 0 14px 32px rgba(19,32,44,0.07);
      overflow: hidden;
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      min-height: 460px;
    }
    .match {
      background: var(--rail);
      border-right: 1px solid var(--line);
      padding: 12px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .match h3 {
      margin: 0 0 4px;
      font-size: 12px; font-weight: 750;
      letter-spacing: -0.02em;
    }
    .match-item {
      text-align: left;
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--paper);
      padding: 9px 10px;
      font: inherit; cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(42,156,196,0.35);
    }
    .match-item strong { display: block; font-size: 12.5px; font-weight: 650; }
    .match-item span {
      display: block; margin-top: 2px;
      font-family: var(--mono); font-size: 11px; color: var(--cyan-ink); font-weight: 650;
    }

    .detail {
      display: flex; flex-direction: column;
      min-width: 0; padding: 14px 16px 12px; gap: 10px;
    }
    .detail-h h2 {
      margin: 0;
      font-size: 15px; font-weight: 750;
      letter-spacing: -0.03em;
    }
    .detail-h p {
      margin: 3px 0 0;
      font-size: 12px; color: var(--muted); line-height: 1.4;
    }

    .launch {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--wash);
    }
    .launch .lab { font-size: 12px; font-weight: 650; color: var(--muted); }
    .launch .val {
      flex: 1;
      font-family: var(--mono); font-size: 13px; font-weight: 650;
      color: var(--cyan-ink);
    }
    .launch .val.is-empty { color: var(--faint); font-weight: 550; }
    .launch button {
      border: 1px solid var(--cyan-bd);
      background: var(--cyan-soft);
      color: var(--cyan-ink);
      border-radius: 8px;
      padding: 5px 11px;
      font: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    .launch button:hover { filter: brightness(0.98); }

    /* sequence list = the editor */
    .seq {
      flex: 1;
      display: flex; flex-direction: column; gap: 6px;
      min-height: 0;
    }
    .seq-row {
      display: grid;
      grid-template-columns: 28px 52px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 8px 8px 6px;
      border-radius: 12px;
      background: var(--wash);
      animation: rowIn 180ms var(--ease) both;
    }
    .seq-row.is-listen {
      background: var(--cyan-soft);
      box-shadow: inset 0 0 0 1px var(--cyan-bd);
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .seq-row .n {
      width: 24px; height: 24px;
      border-radius: 7px;
      background: var(--paper);
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      color: var(--cyan-ink);
    }
    .kind {
      font-size: 11px; font-weight: 750;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .body { min-width: 0; }

    /* inline key */
    .key-chip {
      display: inline-flex; align-items: center; gap: 6px;
      max-width: 100%;
      border: 1px dashed transparent;
      background: var(--paper);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: var(--mono); font-size: 12.5px; font-weight: 650;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 140ms var(--ease), background 140ms var(--ease);
    }
    .key-chip:hover { border-color: var(--cyan-bd); }
    .key-chip.is-empty {
      color: var(--faint);
      border-color: var(--line);
      border-style: dashed;
      font-family: var(--font); font-weight: 550;
    }
    .key-chip.is-listen {
      border-color: var(--cyan);
      border-style: solid;
      color: var(--cyan-ink);
      background: #fff;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(42,156,196,0.25); }
      50% { box-shadow: 0 0 0 4px rgba(42,156,196,0.08); }
    }

    /* inline text */
    .text-in {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 7px 10px;
      font: inherit; font-size: 13px;
      color: var(--ink);
      resize: none;
      min-height: 36px;
      line-height: 1.35;
    }
    .text-in:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(42,156,196,0.15);
    }

    /* inline delay pills */
    .delay-pills {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .delay-pills button {
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      padding: 4px 9px;
      font: inherit; font-size: 11.5px; font-weight: 650;
      color: var(--ink); cursor: pointer;
    }
    .delay-pills button.is-on {
      border-color: var(--cyan-bd);
      background: var(--cyan-soft);
      color: var(--cyan-ink);
    }
    .delay-custom {
      width: 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      padding: 4px 6px;
      font-family: var(--mono); font-size: 12px; font-weight: 650;
      color: var(--ink);
    }
    .delay-custom:focus {
      outline: none;
      border-color: var(--cyan);
    }
    .delay-unit { font-size: 11px; color: var(--faint); font-weight: 650; }

    .ops {
      display: flex; gap: 2px;
    }
    .ops button {
      width: 26px; height: 26px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: var(--faint);
      font: inherit; font-size: 11px;
      cursor: pointer;
    }
    .ops button:hover { background: rgba(19,32,44,0.06); color: var(--ink); }
    .ops button.del:hover { background: rgba(180,35,24,0.1); color: var(--danger); }

    .seq-empty {
      padding: 18px 14px;
      border-radius: 12px;
      background: var(--wash);
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .seq-empty b { color: var(--ink); }

    /* quiet add strip — not giant tiles */
    .add-strip {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }
    .add-strip button {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px dashed var(--line);
      background: transparent;
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit; font-size: 12px; font-weight: 650;
      color: var(--cyan-ink);
      cursor: pointer;
      transition: background 140ms var(--ease), border-color 140ms var(--ease);
    }
    .add-strip button:hover {
      background: var(--cyan-soft);
      border-style: solid;
      border-color: var(--cyan-bd);
    }
    .add-strip button:active { transform: scale(0.97); }
    .add-strip .plus {
      font-family: var(--mono); font-weight: 700; opacity: 0.7;
    }

    .hint {
      margin: 0;
      font-size: 11.5px; color: var(--faint);
    }

    @media (max-width: 640px) {
      .desk { grid-template-columns: 1fr; }
      .match { border-right: 0; border-bottom: 1px solid var(--line); }
      .seq-row {
        grid-template-columns: 24px 44px minmax(0, 1fr);
        grid-template-rows: auto auto;
      }
      .ops { grid-column: 1 / -1; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <strong>原型</strong>
    <span>动作序列 · 行内编辑 · 无弹窗</span>
    <a href="keys-custom-key-desk.html">上一版桌面</a>
  </div>

  <div class="shell">
    <div class="note">
      <b>规划：</b>按键 / 文本 / 延迟直接出现在列表行里改，不再弹窗。
      点「+ 按键」立刻插入一行并进入听键；文本行自带输入框；延迟行自带毫秒 pills。
      下方只留安静的 + 条，不当大瓷砖按钮。
    </div>

    <section class="desk" aria-label="我录的键">
      <aside class="match">
        <h3>按键匹配</h3>
        <button type="button" class="match-item">
          <strong>自定义键 1</strong>
          <span>启动 · Ctrl</span>
        </button>
      </aside>

      <div class="detail">
        <div class="detail-h">
          <h2>动作序列</h2>
          <p>步骤就是编辑器。点行内控件直接改，Esc 取消听键。</p>
        </div>

        <div class="launch">
          <span class="lab">启动键</span>
          <span class="val" id="launchVal">Ctrl</span>
          <button type="button" id="btnLaunch">重录</button>
        </div>

        <div class="seq" id="seq" role="list" aria-label="步骤列表"></div>

        <div class="add-strip" role="group" aria-label="添加步骤">
          <button type="button" data-add="key"><span class="plus">+</span> 按键</button>
          <button type="button" data-add="text"><span class="plus">+</span> 文本</button>
          <button type="button" data-add="delay"><span class="plus">+</span> 延迟</button>
        </div>
        <p class="hint">按键 = 当场按下组合键 · 不打开键盘目录</p>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var DELAYS = [100, 200, 500, 1000];
      var steps = [
        { type: "key", value: "Ctrl+Enter" },
        { type: "text", value: "你好" },
        { type: "delay", ms: 200 }
      ];
      var listenIdx = -1;
      var seqEl = document.getElementById("seq");

      function esc(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/"/g, "&quot;");
      }

      function render() {
        if (!steps.length) {
          seqEl.innerHTML =
            '<div class="seq-empty"><b>还没有步骤。</b> 用下方 + 按键 / 文本 / 延迟，直接插进行里改。</div>';
          return;
        }
        seqEl.innerHTML = steps
          .map(function (s, i) {
            var listen = listenIdx === i;
            var body = "";
            if (s.type === "key") {
              var empty = !s.value;
              body =
                '<button type="button" class="key-chip' +
                (empty ? " is-empty" : "") +
                (listen ? " is-listen" : "") +
                '" data-rec="' +
                i +
                '">' +
                (listen
                  ? "按下组合键…"
                  : empty
                    ? "点此录制按键"
                    : esc(s.value)) +
                "</button>";
            } else if (s.type === "text") {
              body =
                '<textarea class="text-in" rows="1" data-text="' +
                i +
                '" placeholder="注入的文字">' +
                esc(s.value) +
                "</textarea>";
            } else {
              var pills = DELAYS.map(function (ms) {
                return (
                  '<button type="button" data-delay-set="' +
                  i +
                  '" data-ms="' +
                  ms +
                  '"' +
                  (s.ms === ms ? ' class="is-on"' : "") +
                  ">" +
                  (ms >= 1000 ? ms / 1000 + "s" : ms + "ms") +
                  "</button>"
                );
              }).join("");
              body =
                '<div class="delay-pills">' +
                pills +
                '<input class="delay-custom" type="number" min="1" step="50" value="' +
                esc(s.ms) +
                '" data-delay-custom="' +
                i +
                '" aria-label="自定义毫秒" />' +
                '<span class="delay-unit">ms</span></div>';
            }
            var kind =
              s.type === "key" ? "按键" : s.type === "text" ? "文本" : "延迟";
            return (
              '<div class="seq-row' +
              (listen ? " is-listen" : "") +
              '" role="listitem" data-idx="' +
              i +
              '">' +
              '<span class="n">' +
              (i + 1) +
              "</span>" +
              '<span class="kind">' +
              kind +
              "</span>" +
              '<div class="body">' +
              body +
              "</div>" +
              '<div class="ops">' +
              '<button type="button" data-up="' +
              i +
              '" aria-label="上移">▲</button>' +
              '<button type="button" data-down="' +
              i +
              '" aria-label="下移">▼</button>' +
              '<button type="button" class="del" data-del="' +
              i +
              '" aria-label="删除">×</button>' +
              "</div></div>"
            );
          })
          .join("");

        seqEl.querySelectorAll(".text-in").forEach(function (ta) {
          ta.addEventListener("input", function () {
            var i = Number(ta.getAttribute("data-text"));
            steps[i].value = ta.value;
            ta.style.height = "auto";
            ta.style.height = Math.min(120, ta.scrollHeight) + "px";
          });
          ta.style.height = "auto";
          ta.style.height = Math.min(120, ta.scrollHeight) + "px";
        });
      }

      function stopListen() {
        listenIdx = -1;
        document.removeEventListener("keydown", onListenKey, true);
      }

      function onListenKey(ev) {
        if (ev.key === "Escape") {
          ev.preventDefault();
          stopListen();
          render();
          return;
        }
        var isMod =
          ev.key === "Control" ||
          ev.key === "Shift" ||
          ev.key === "Alt" ||
          ev.key === "Meta";
        if (isMod) {
          ev.preventDefault();
          return;
        }
        ev.preventDefault();
        ev.stopPropagation();
        var p = [];
        if (ev.ctrlKey) p.push("Ctrl");
        if (ev.altKey) p.push("Alt");
        if (ev.shiftKey) p.push("Shift");
        if (ev.metaKey) p.push("Win");
        var main = ev.key === " " ? "Space" : ev.key;
        if (main.length === 1) main = main.toUpperCase();
        p.push(main);
        if (listenIdx >= 0 && steps[listenIdx]) {
          steps[listenIdx].value = p.join("+");
        }
        stopListen();
        render();
      }

      function startListen(i) {
        stopListen();
        listenIdx = i;
        render();
        document.addEventListener("keydown", onListenKey, true);
      }

      seqEl.addEventListener("click", function (ev) {
        var t = ev.target;
        var rec = t.closest && t.closest("[data-rec]");
        if (rec) {
          startListen(Number(rec.getAttribute("data-rec")));
          return;
        }
        var set = t.closest && t.closest("[data-delay-set]");
        if (set) {
          var i = Number(set.getAttribute("data-delay-set"));
          steps[i].ms = Number(set.getAttribute("data-ms"));
          render();
          return;
        }
        var up = t.closest && t.closest("[data-up]");
        if (up) {
          var ui = Number(up.getAttribute("data-up"));
          if (ui > 0) {
            var tmp = steps[ui - 1];
            steps[ui - 1] = steps[ui];
            steps[ui] = tmp;
            render();
          }
          return;
        }
        var down = t.closest && t.closest("[data-down]");
        if (down) {
          var di = Number(down.getAttribute("data-down"));
          if (di < steps.length - 1) {
            var tmp2 = steps[di + 1];
            steps[di + 1] = steps[di];
            steps[di] = tmp2;
            render();
          }
          return;
        }
        var del = t.closest && t.closest("[data-del]");
        if (del) {
          steps.splice(Number(del.getAttribute("data-del")), 1);
          stopListen();
          render();
        }
      });

      seqEl.addEventListener("change", function (ev) {
        var el = ev.target;
        if (el && el.getAttribute("data-delay-custom") != null) {
          var i = Number(el.getAttribute("data-delay-custom"));
          var n = parseInt(el.value, 10);
          if (n > 0) {
            steps[i].ms = n;
            render();
          }
        }
      });

      document.querySelectorAll("[data-add]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var kind = btn.getAttribute("data-add");
          if (kind === "key") {
            steps.push({ type: "key", value: "" });
            render();
            startListen(steps.length - 1);
          } else if (kind === "text") {
            steps.push({ type: "text", value: "" });
            render();
            var ta = seqEl.querySelector(
              '[data-text="' + (steps.length - 1) + '"]'
            );
            if (ta) ta.focus();
          } else if (kind === "delay") {
            steps.push({ type: "delay", ms: 200 });
            render();
          }
        });
      });

      document.getElementById("btnLaunch").addEventListener("click", function () {
        var prev = listenIdx;
        stopListen();
        listenIdx = -2;
        var val = document.getElementById("launchVal");
        val.textContent = "按下启动键…";
        val.classList.add("is-empty");
        function onLaunch(ev) {
          if (ev.key === "Escape") {
            document.removeEventListener("keydown", onLaunch, true);
            val.textContent = "Ctrl";
            val.classList.remove("is-empty");
            return;
          }
          var isMod =
            ev.key === "Control" ||
            ev.key === "Shift" ||
            ev.key === "Alt" ||
            ev.key === "Meta";
          if (isMod) {
            ev.preventDefault();
            return;
          }
          ev.preventDefault();
          var p = [];
          if (ev.ctrlKey) p.push("Ctrl");
          if (ev.altKey) p.push("Alt");
          if (ev.shiftKey) p.push("Shift");
          if (ev.metaKey) p.push("Win");
          var main = ev.key === " " ? "Space" : ev.key;
          if (main.length === 1) main = main.toUpperCase();
          p.push(main);
          val.textContent = p.join("+");
          val.classList.remove("is-empty");
          document.removeEventListener("keydown", onLaunch, true);
          listenIdx = prev;
        }
        document.addEventListener("keydown", onLaunch, true);
      });

      render();
    })();
  </script>
</body>
</html>
