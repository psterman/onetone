<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone 核心能力首页原型</title>
  <style>
    :root{--bg:#f3f6f4;--paper:#fff;--ink:#16211d;--muted:#64716b;--line:#d8e0dc;--green:#167b63;--green2:#62a78d;--soft:#e8f2ee;--red:#c45145;--redsoft:#fff0ed;--amber:#b57918;--ambersoft:#fff6e5;--blue:#557f9c;--shadow:0 18px 50px rgba(18,24,21,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Microsoft YaHei",sans-serif}button{font:inherit}.top{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbfcfb}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}.brand b{display:block;font-size:14px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.top-state{font-size:10px;color:var(--green)}#stage{min-height:calc(100dvh - 64px)}.view{max-width:1120px;margin:auto;padding:42px 28px 105px}.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:25px}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--green);font-weight:700}.head h1{margin:7px 0 0;font-size:31px;letter-spacing:-1.2px}.head p{max-width:410px;margin:0;color:var(--muted);font-size:11px;line-height:1.7}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--redsoft);color:var(--red);font-size:9px;font-weight:700}.tag.ok{background:var(--soft);color:var(--green)}.button{height:38px;border:1px solid #cbd6d1;border-radius:9px;background:#fff;padding:0 16px;color:var(--ink);font-size:11px;cursor:pointer}.button.primary{border-color:var(--green);background:var(--green);color:#fff}.button.danger{border-color:var(--red);background:var(--red);color:#fff}
    .loop{padding:25px}.loop-summary{display:flex;justify-content:space-between;align-items:center}.loop-summary strong{font-size:13px}.loop-summary span{font-size:10px;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(6,1fr);margin:34px 0 25px}.step{text-align:center;position:relative}.step:not(:last-child):after{content:"";position:absolute;left:58%;top:20px;width:84%;height:1px;background:#b8d3c8}.step.block:not(:last-child):after{background:linear-gradient(90deg,var(--red),#d8dfdc)}.step i{position:relative;z-index:1;width:41px;height:41px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid #9bc9b7;color:var(--green);font-style:normal;font-weight:700}.step.block i{background:var(--redsoft);border-color:#e0a29a;color:var(--red)}.step.wait i{background:#f4f5f4;border-color:#d7ddda;color:#929c97}.step b{display:block;margin-top:9px;font-size:11px}.step small{display:block;margin-top:3px;color:var(--muted);font-size:8px}.repair{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:18px;border-radius:13px;background:var(--redsoft)}.repair h2{font-size:14px;margin:8px 0 5px}.repair p{margin:0;color:#765d57;font-size:10px}.evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.evidence div{padding:12px;border-radius:10px;background:#f6f8f6}.evidence b{display:block;font-size:10px}.evidence span{font-size:8px;color:var(--muted)}
    .converge{display:grid;grid-template-columns:310px 1fr;gap:16px}.channels{padding:21px}.channels h2,.action-core h2{font-size:13px;margin:0 0 15px}.channel{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf0ee}.channel:last-child{border:0}.ch-icon{width:35px;height:35px;border-radius:10px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-size:10px;font-weight:700}.channel b{display:block;font-size:10px}.channel small{font-size:8px;color:var(--muted)}.channel em{font-style:normal;font-size:8px;color:var(--green)}.channel.optional em{color:var(--amber)}.action-core{padding:25px;position:relative;overflow:hidden}.flow{display:grid;grid-template-columns:1fr 68px 1fr;align-items:center;min-height:290px}.inputs,.outputs{display:grid;gap:8px}.flow-card{padding:12px;border-radius:10px;background:#f5f7f5;font-size:10px}.flow-arrow{text-align:center;color:var(--green);font-size:24px}.core{width:170px;height:170px;margin:auto;border-radius:50%;display:grid;place-content:center;text-align:center;background:var(--ink);color:#fff;box-shadow:0 0 0 13px var(--soft)}.core small{font-size:8px;color:#a9b8b1;letter-spacing:.1em}.core strong{font-size:19px;margin:6px 0}.core span{font-size:9px;color:#c2ccc7}.slot{margin-top:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}.slot b{font-size:11px}.slot span{font-size:9px;color:var(--muted)}
    .task-layout{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.task{padding:28px}.task-top{display:flex;justify-content:space-between}.task h2{font-size:26px;margin:25px 0 9px;letter-spacing:-.7px}.task>p{max-width:610px;margin:0;color:var(--muted);font-size:11px;line-height:1.75}.readiness{display:flex;align-items:center;gap:13px;margin:28px 0;padding:15px;border-radius:12px;background:var(--redsoft)}.readiness i{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--red);font-style:normal;font-weight:700}.readiness b{display:block;font-size:11px}.readiness span{font-size:9px;color:#765d57}.task-actions{display:flex;gap:8px}.side{padding:20px}.side h3{font-size:12px;margin:0 0 14px}.mini{padding:12px 0;border-bottom:1px solid #edf0ee}.mini:last-child{border:0}.mini-head{display:flex;justify-content:space-between}.mini b{font-size:10px}.mini span{font-size:8px;color:var(--green)}.mini p{margin:4px 0 0;color:var(--muted);font-size:8px}.now-proof{margin-top:17px;padding:12px;border-radius:10px;background:var(--soft);font-size:9px;color:#326453;line-height:1.6}
    .toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;background:var(--ink);color:#fff;border-radius:9px;font-size:10px;opacity:0;transform:translateY(8px);transition:180ms ease-out;z-index:20}.toast.show{opacity:1;transform:none}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}@media(max-width:800px){.top{padding:0 17px}.view{padding:30px 16px 100px}.head{display:block}.head p{margin-top:10px}.steps{grid-template-columns:repeat(3,1fr);row-gap:22px}.step:nth-child(3):after{display:none}.repair,.converge,.task-layout{grid-template-columns:1fr}.evidence{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow-arrow{transform:rotate(90deg)}.proto-picker-item{font-size:10px;padding:0 8px}}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight,.toast{transition:none}}
  </style>
</head>
<body><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone</b><small>自然交互中间层</small></div></div><div class="top-state">本机运行 · 数据留在本地</div></header><main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">六段闭环</button><button class="proto-picker-item">四通道汇流</button><button class="proto-picker-item">当前任务</button></nav><div class="toast" role="status" aria-live="polite"></div>
  <script>
    const head=(title,copy)=>`<div class="head"><div><div class="eyebrow">ONETONE CORE</div><h1>${title}</h1></div><p>${copy}</p></div>`;
    const variants=[
      ()=>`<section class="view">${head('起跑线还差最后一个环节','以真实闭环检验 OneTone，而不是统计安装了多少工具。每个环节都能解释、修复和重新验证。')}<article class="panel loop"><div class="loop-summary"><strong>核心能力闭环</strong><span>2 项通过 · 1 项阻塞 · 3 项等待验证</span></div><div class="steps"><div class="step"><i>✓</i><b>触发</b><small>语音与按键正常</small></div><div class="step"><i>✓</i><b>理解</b><small>意图匹配正确</small></div><div class="step block"><i>!</i><b>瞄准</b><small>输入框未确认</small></div><div class="step wait"><i>·</i><b>执行</b><small>等待瞄准</small></div><div class="step wait"><i>·</i><b>反馈</b><small>尚未验证</small></div><div class="step wait"><i>·</i><b>恢复</b><small>尚未验证</small></div></div><div class="repair"><div><span class="tag">必须修复</span><h2>确认 Codex 输入区域</h2><p>完成后将自动运行测试写入、撤销、Agent 状态返回与恢复点保存。</p></div><button class="button danger" data-act="repair">带我完成</button></div><div class="evidence"><div><b>安全保护正常</b><span>找不到输入框时拒绝写入</span></div><div><b>不会修改项目</b><span>测试文字会自动撤销</span></div><div><b>留下验证证据</b><span>记录应用、时间与闭环结果</span></div></div></article></section>`,
      ()=>`<section class="view">${head('四种触发，一组能力','语音、按键、Soft Pad 和摄像头不是四套功能，而是进入同一能力槽位的不同入口。')}<div class="converge"><aside class="panel channels"><h2>触发通道</h2><div class="channel"><span class="ch-icon">声</span><div><b>语音</b><small>口令识别稳定</small></div><em>就绪</em></div><div class="channel"><span class="ch-icon">键</span><div><b>按键</b><small>实体键响应正常</small></div><em>就绪</em></div><div class="channel"><span class="ch-icon">Pad</span><div><b>Soft Pad</b><small>能力卡连接正常</small></div><em>就绪</em></div><div class="channel optional"><span class="ch-icon">视</span><div><b>摄像头</b><small>摇头取消尚未校准</small></div><em>可增强</em></div></aside><article class="panel action-core"><h2>统一能力核心</h2><div class="flow"><div class="inputs"><div class="flow-card">说“发送”</div><div class="flow-card">按鼠标侧键</div><div class="flow-card">点击能力卡</div></div><div class="flow-arrow">→</div><div class="core"><small>SLOT ID</small><strong>发送</strong><span>瞄准 · 执行 · 反馈</span></div></div><div class="slot"><div><b>当前缺失：输入瞄准</b><span>会影响所有触发通道的安全写入</span></div><button class="button primary" data-act="align">修复一次，全部复用</button></div></article></div></section>`,
      ()=>`<section class="view">${head('继续完成首页循环设计','任务优先的首页。系统检测退到背后，只有真正阻塞当前动作时才进入用户视线。')}<div class="task-layout"><article class="panel task"><div class="task-top"><span class="tag ok">当前工作</span><span class="tag">尚未达到起跑标准</span></div><h2>从上次的原型选择继续</h2><p>OneTone 已恢复相关窗口、最近文件与对话位置。开始前还需要确认 Codex 输入区域，预计 20 秒。</p><div class="readiness"><i>!</i><div><b>为什么现在不能直接开始？</b><span>语音已经听懂，但系统无法确认文字会写入正确位置，因此主动停止。</span></div></div><div class="task-actions"><button class="button danger" data-act="guide">完成最后一步</button><button class="button" data-act="detail">查看核心闭环</button></div></article><aside class="panel side"><h3>OneTone 核心状态</h3><div class="mini"><div class="mini-head"><b>自然触发</b><span>就绪</span></div><p>语音、按键、Soft Pad</p></div><div class="mini"><div class="mini-head"><b>意图理解</b><span>就绪</span></div><p>当前场景匹配正确</p></div><div class="mini"><div class="mini-head"><b>安全瞄准</b><span style="color:var(--red)">需处理</span></div><p>Codex 输入框尚未确认</p></div><div class="now-proof">修复后将进行一次完整热身赛，确认执行、反馈和恢复全部可用。</div></aside></div></section>`
    ];
    const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item')];let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function bind(){stage.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>say({repair:'已进入输入瞄准带路测试',align:'修复结果将同步给四个触发通道',guide:'请打开 Codex，并点击一次输入区域',detail:'将展开六段核心能力闭环'}[b.dataset.act]))}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bind()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i);j===i?e.setAttribute('aria-current','true'):e.removeAttribute('aria-current')});moveHighlight();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i)}items.forEach((e,i)=>e.onclick=()=>setActive(i));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length)});let timer;function say(s){const t=document.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1800)}setActive((parseInt(new URLSearchParams(location.search).get('v'))||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body></html>
