<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OneTone · Agent 并行验证首页</title>
  <style>
    :root{--bg:#f3f6f4;--paper:#fff;--ink:#15211c;--muted:#62706a;--line:#d8e0dc;--green:#137b61;--green2:#64aa8d;--soft:#e8f3ee;--amber:#af7416;--ambersoft:#fff5e2;--red:#c45145;--redsoft:#fff0ed;--blue:#5c819e;--shadow:0 18px 55px rgba(18,24,21,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Microsoft YaHei",sans-serif}button{font:inherit}.top{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fbfcfb}.brand{display:flex;align-items:center;gap:10px}.mark{width:34px;height:34px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}.brand b{display:block;font-size:14px}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.privacy{font-size:10px;color:var(--green)}#stage{min-height:calc(100dvh - 64px)}.view{max-width:1120px;margin:auto;padding:35px 28px 108px}.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:20px}.head h1{margin:5px 0 0;font-size:29px;letter-spacing:-1.1px}.eyebrow{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.14em}.head p{max-width:430px;margin:0;color:var(--muted);font-size:10px;line-height:1.65}.panel{border:1px solid var(--line);border-radius:17px;background:var(--paper);box-shadow:var(--shadow)}.button{height:36px;padding:0 14px;border:1px solid #cbd6d1;border-radius:9px;background:#fff;color:var(--ink);font-size:10px;cursor:pointer}.button.primary{background:var(--green);border-color:var(--green);color:#fff}.state{font-size:8px;color:var(--green)}.state.checking{color:var(--blue)}.state.optional{color:var(--amber)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:5px}.pulse{animation:pulse 1.2s ease-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.82)}}
    .radar{padding:20px;display:grid;grid-template-columns:1fr 260px;gap:16px}.hub-stage{position:relative;min-height:490px;border-radius:14px;background:radial-gradient(circle at center,#f8fbf9 0 29%,#edf3ef 30% 30.5%,transparent 31% 47%,#e4ece8 47.5% 48%,transparent 48.5%);overflow:hidden}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:170px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 0 0 12px #e7f1ed}.hub small{font-size:8px;color:#aab8b1;letter-spacing:.1em}.hub strong{font-size:20px;margin:6px 0}.hub span{font-size:9px;color:#c9d2ce}.spoke{position:absolute;width:150px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 8px 25px rgba(20,30,25,.06);cursor:pointer}.spoke:after{content:"";position:absolute;background:#9cc8b7}.spoke h3{font-size:11px;margin:0 0 4px}.spoke p{font-size:8px;color:var(--muted);margin:0}.spoke .state{position:absolute;right:10px;top:11px}.voice{left:50%;top:23px;transform:translateX(-50%)}.voice:after{width:1px;height:44px;left:50%;top:100%}.keys{left:25px;top:50%;transform:translateY(-50%)}.keys:after{height:1px;width:58px;left:100%;top:50%}.pad{right:25px;top:50%;transform:translateY(-50%)}.pad:after{height:1px;width:58px;right:100%;top:50%}.camera{left:50%;bottom:23px;transform:translateX(-50%)}.camera:after{width:1px;height:44px;left:50%;bottom:100%}.sidecheck{padding:18px}.sidecheck h2{font-size:12px;margin:0 0 13px}.shared{padding:11px 0;border-bottom:1px solid #edf0ee}.shared:last-of-type{border:0}.shared-head{display:flex;justify-content:space-between}.shared b{font-size:9px}.shared p{margin:4px 0 0;color:var(--muted);font-size:8px}.summary{margin-top:15px;padding:13px;border-radius:11px;background:var(--soft)}.summary strong{font-size:11px}.summary p{margin:4px 0 0;color:#386655;font-size:8px;line-height:1.55}.sidecheck .button{width:100%;margin-top:12px}
    .quadrants{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:500px}.quad{padding:22px;position:relative;display:flex;flex-direction:column}.quad h2{font-size:14px;margin:0}.quad p{color:var(--muted);font-size:9px;margin:6px 0 0}.quad .big{font-size:24px;margin:auto 0 8px;font-weight:650}.quad footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0ee;padding-top:12px}.quad footer span{font-size:8px;color:var(--muted)}.centerbadge{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:155px;height:155px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 0 0 9px var(--bg)}.centerbadge small{font-size:8px;color:#aab8b1}.centerbadge strong{font-size:18px;margin:6px 0}.centerbadge span{font-size:8px;color:#c7d1cc}.quad.optional-card{background:#fffdf9}.quad.optional-card .big{color:var(--amber)}
    .cockpit{display:grid;grid-template-columns:1fr 320px;gap:15px}.agent{padding:24px;min-height:500px}.agent-head{display:flex;justify-content:space-between}.agent-name{display:flex;align-items:center;gap:10px}.agent-icon{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px}.agent-name b{display:block;font-size:12px}.agent-name span{display:block;font-size:8px;color:var(--muted);margin-top:3px}.live{display:flex;align-items:center;color:var(--green);font-size:9px}.activity{margin:32px 0 24px}.activity small{color:var(--muted);font-size:8px}.activity h2{font-size:27px;margin:7px 0}.activity p{color:var(--muted);font-size:10px;line-height:1.7;max-width:570px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.control{padding:14px;border:1px solid var(--line);border-radius:11px;background:#f7f9f7;cursor:pointer}.control b{display:block;font-size:10px}.control span{font-size:8px;color:var(--muted)}.proof{margin-top:22px;padding:13px;border-radius:11px;background:var(--soft);font-size:9px;color:#376554}.channelrail{padding:18px}.channelrail h2{font-size:12px;margin:0 0 12px}.railitem{padding:13px 0;border-bottom:1px solid #edf0ee}.railitem:last-of-type{border:0}.railhead{display:flex;justify-content:space-between}.railitem b{font-size:10px}.railitem p{font-size:8px;color:var(--muted);margin:4px 0}.mini-actions{display:flex;gap:6px}.mini-actions button{border:0;border-radius:7px;background:#f1f4f2;padding:6px 8px;font-size:8px;color:var(--muted)}.channelrail>.button{width:100%;margin-top:15px}
    .toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;background:var(--ink);color:#fff;border-radius:9px;font-size:10px;opacity:0;transform:translateY(8px);transition:180ms ease-out;z-index:20}.toast.show{opacity:1;transform:none}.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}@media(max-width:800px){.top{padding:0 16px}.view{padding:28px 15px 100px}.head{display:block}.head p{margin-top:8px}.radar,.cockpit{grid-template-columns:1fr}.hub-stage{min-height:450px}.spoke{width:125px}.quadrants{grid-template-columns:1fr}.centerbadge{position:relative;left:auto;top:auto;transform:none;margin:-4px auto}.proto-picker-item{padding:0 8px;font-size:10px}.controls{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}.proto-picker[data-ready] .proto-picker-highlight,.toast{transition:none}}
  </style>
</head>
<body><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone</b><small>Agent 管理起跑线</small></div></div><div class="privacy">并行验证 · 不执行真实操作</div></header><main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">中心辐射</button><button class="proto-picker-item">四象限</button><button class="proto-picker-item">运行舱</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav><div class="toast" role="status" aria-live="polite"></div>
  <script>
    const head=(title,copy)=>`<div class="head"><div><div class="eyebrow">PARALLEL AGENT CHECK</div><h1>${title}</h1></div><p>${copy}</p></div>`;
    const state=(kind='checking')=>`<span class="state ${kind}"><i class="dot ${kind==='checking'?'pulse':''}"></i>${kind==='checking'?'验证中':kind==='optional'?'可增强':'可管理'}</span>`;
    const variants=[
      ()=>`<section class="view">${head('正在验证 4 个 Agent 管理通道','四个通道同时检查自己的管理闭环。任何一个通道失败，都不会阻止其他通道进入 Agent 管理。')}<div class="panel radar"><div class="hub-stage"><div class="spoke voice" data-channel="语音"><h3>语音</h3><p>口令 → Codex → 状态返回</p>${state()}</div><div class="spoke keys" data-channel="按键"><h3>按键</h3><p>实体键 → Codex → 状态返回</p>${state()}</div><div class="spoke pad" data-channel="Soft Pad"><h3>Soft Pad</h3><p>能力卡 → Codex → 状态返回</p>${state()}</div><div class="spoke camera" data-channel="摄像头"><h3>摄像头</h3><p>手势 → Codex → 状态返回</p>${state()}</div><div class="hub"><small>ACTIVE AGENT</small><strong>Codex</strong><span class="hub-result">正在建立管理连接</span></div></div><aside class="sidecheck"><h2>共享能力</h2><div class="shared"><div class="shared-head"><b>Agent 识别</b>${state()}</div><p>已发现当前 Codex 会话</p></div><div class="shared"><div class="shared-head"><b>状态回传</b>${state()}</div><p>等待工作、暂停与完成信号</p></div><div class="shared"><div class="shared-head"><b>安全确认</b>${state()}</div><p>高风险动作需要第二通道</p></div><div class="summary"><strong class="summary-title">正在检测</strong><p class="summary-copy">验证不会发送消息或修改项目。</p></div><button class="button" data-rerun>重新验证</button></aside></div></section>`,
      ()=>`<section class="view">${head('哪些通道现在可以管理 Codex？','四个入口等权展示。用户进入任何已就绪通道，都能直接看到并管理当前 Agent。')}<div class="quadrants"><article class="panel quad"><div><h2>语音</h2><p>说“暂停”“继续”“确认”</p></div><div class="big q-result">验证中</div><footer><span>Agent 状态等待返回</span>${state()}</footer></article><article class="panel quad"><div><h2>按键</h2><p>实体键与组合键</p></div><div class="big q-result">验证中</div><footer><span>Agent 状态等待返回</span>${state()}</footer></article><div class="centerbadge"><small>ACTIVE AGENT</small><strong>Codex</strong><span class="center-result">0 / 4 通道就绪</span></div><article class="panel quad"><div><h2>Soft Pad</h2><p>可见、可点的管理能力</p></div><div class="big q-result">验证中</div><footer><span>Agent 状态等待返回</span>${state()}</footer></article><article class="panel quad optional-card"><div><h2>摄像头</h2><p>摇头取消、离席暂停</p></div><div class="big q-result">验证中</div><footer><span>校准不影响其他通道</span>${state()}</footer></article></div></section>`,
      ()=>`<section class="view">${head('Codex 正在工作','当前 Agent 是首页主角。四通道验证结束后，立即成为暂停、继续、确认和取消的控制入口。')}<div class="cockpit"><article class="panel agent"><div class="agent-head"><div class="agent-name"><span class="agent-icon">Cx</span><div><b>Codex · voice-pilot</b><span>正在构建首页原型</span></div></div><div class="live"><i class="dot pulse"></i>工作中</div></div><div class="activity"><small>当前状态</small><h2>等待本轮输出</h2><p>OneTone 正在并行确认每个通道能否读取状态并执行管理动作。验证过程不会中断当前 Agent。</p></div><div class="controls"><button class="control" data-control="暂停"><b>暂停</b><span>等待安全节点</span></button><button class="control" data-control="继续"><b>继续</b><span>恢复当前任务</span></button><button class="control" data-control="取消"><b>取消</b><span>需要再次确认</span></button></div><div class="proof cockpit-proof">正在验证共享反馈与恢复能力…</div></article><aside class="panel channelrail"><h2>管理通道</h2><div class="railitem"><div class="railhead"><b>语音</b>${state()}</div><p>暂停 · 继续 · 确认 · 取消</p></div><div class="railitem"><div class="railhead"><b>按键</b>${state()}</div><p>暂停 · 继续 · 确认 · 取消</p></div><div class="railitem"><div class="railhead"><b>Soft Pad</b>${state()}</div><p>暂停 · 继续 · 确认 · 取消</p></div><div class="railitem"><div class="railhead"><b>摄像头</b>${state()}</div><p>摇头取消 · 离席暂停</p></div><button class="button" data-rerun>重新验证所有通道</button></aside></div></section>`
    ];
    const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0,timers=[];
    function clearTimers(){timers.forEach(clearTimeout);timers=[]}function schedule(fn,ms){timers.push(setTimeout(fn,ms))}function finishChecks(){const states=[...stage.querySelectorAll('.state')];states.forEach((s,i)=>schedule(()=>{s.className='state ok';s.innerHTML='<i class="dot"></i>可管理'},350+i*130));schedule(()=>{if(current===0){const camera=stage.querySelector('.camera .state');camera.className='state optional';camera.innerHTML='<i class="dot"></i>可增强'}if(current===1){const last=states.at(-1);last.className='state optional';last.innerHTML='<i class="dot"></i>可增强'}stage.querySelectorAll('.spoke p').forEach((p,i)=>p.textContent=i===3?'手势可选增强，不影响其他通道':'已验证 Agent 管理闭环');stage.querySelector('.hub-result')&&(stage.querySelector('.hub-result').textContent='3 个通道可以管理');stage.querySelector('.summary-title')&&(stage.querySelector('.summary-title').textContent='3 个通道可以管理 Codex');stage.querySelector('.summary-copy')&&(stage.querySelector('.summary-copy').textContent='语音、按键和 Soft Pad 已就绪；摄像头可稍后增强。');stage.querySelectorAll('.q-result').forEach((e,i)=>e.textContent=i===3?'可增强':'可管理');stage.querySelector('.center-result')&&(stage.querySelector('.center-result').textContent='3 / 4 通道就绪');stage.querySelector('.cockpit-proof')&&(stage.querySelector('.cockpit-proof').textContent='验证完成：4 个通道均可读取 Agent 状态，反馈与恢复正常。')},1500)}
    function bind(){stage.querySelectorAll('[data-rerun]').forEach(b=>b.onclick=()=>mount(current));stage.querySelectorAll('[data-channel]').forEach(e=>e.onclick=()=>say(`${e.dataset.channel}通道：打开 Agent 管理能力`));stage.querySelectorAll('[data-control]').forEach(e=>e.onclick=()=>say(`将通过已验证通道执行“${e.dataset.control}”`));finishChecks()}
    function moveHighlight(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}function mount(i){clearTimers();stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bind()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i);j===i?e.setAttribute('aria-current','true'):e.removeAttribute('aria-current')});moveHighlight();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i)}items.forEach((e,i)=>e.onclick=()=>setActive(i));replay.onclick=()=>mount(current);window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});let toastTimer;function say(s){const t=document.querySelector('.toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1700)}setActive((parseInt(new URLSearchParams(location.search).get('v'))||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body></html>
