<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 首页四维原型</title>
  <style>
    :root{--paper:#fbfaf7;--nav:#f0f2f2;--ink:#19263a;--muted:#758195;--quiet:#aab3bf;--line:#e8e7e2;--teal:#087f77;--teal-dark:#05635d;--teal-soft:#e1f2ee;--blue-soft:#edf2fa;--amber:#a76622;--amber-soft:#fff1df;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-width:780px;min-height:100vh;background:#e1e5e6;color:var(--ink)}button{font:inherit}.app{width:100%;min-height:100vh;padding:20px}.product{width:100%;max-width:1400px;min-height:calc(100vh - 40px);margin:0 auto;overflow:hidden;border:1px solid #d4d8da;border-radius:16px;background:var(--paper);box-shadow:0 18px 52px rgba(35,44,55,.08)}.product>div{width:100%;min-width:0;min-height:calc(100vh - 40px);display:grid;grid-template-columns:216px minmax(0,1fr)}
    .sidebar{display:flex;flex-direction:column;padding:25px 14px;background:var(--nav);border-right:1px solid #dfe2e2}.brand{padding:0 12px 34px;color:var(--teal);font-size:15px;font-weight:850;letter-spacing:.05em}.nav-label{padding:0 12px 9px;color:#a0a8b1;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#647184;text-align:left;cursor:pointer}.nav button:hover{background:rgba(255,255,255,.65);color:var(--ink)}.nav button.active{background:var(--paper);color:var(--ink);font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#aab4bf}.nav button.active .dot{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}.nav-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid #dcdfdf;color:var(--muted);font-size:11px;line-height:1.6}.nav-foot strong{display:block;color:var(--ink);font-size:12px}
    main{min-width:0;padding:48px clamp(32px,7vw,112px) 35px}.content{width:100%;max-width:900px;margin:0 auto}.eyebrow{margin:0 0 12px;color:var(--teal);font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.context{color:var(--muted);font-size:12px}.context strong{color:var(--ink)}h1{margin:0 0 14px;font-size:clamp(30px,4.2vw,54px);line-height:1.1;letter-spacing:-.055em}h2{margin:0;font-size:15px}p{line-height:1.65}.muted{color:var(--muted)}.primary{padding:13px 18px;border:0;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(8,127,119,.16)}.primary:hover{background:var(--teal-dark)}.secondary{padding:10px 14px;border:1px solid #d6dedc;border-radius:8px;background:transparent;color:var(--teal-dark);font-weight:750;cursor:pointer}.secondary:hover{background:var(--teal-soft)}.text-btn{padding:0;border:0;background:transparent;color:var(--teal);font-size:12px;font-weight:800;cursor:pointer}.text-btn:hover{text-decoration:underline}
    .topline{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.topline p{max-width:590px;margin:0;color:var(--muted);font-size:15px}.rule{height:1px;margin:32px 0 0;background:var(--line)}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px}.section{padding-top:28px}.activity{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:53px 13px minmax(0,1fr) auto;align-items:start;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.row time{padding-top:2px;color:var(--quiet);font-size:11px}.track{position:relative;display:flex;justify-content:center;min-height:34px}.track:before{content:"";position:absolute;top:10px;bottom:-25px;width:1px;background:#d6e5e2}.row:last-child .track:before{display:none}.node{position:relative;z-index:1;width:9px;height:9px;margin-top:3px;border:2px solid var(--paper);border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px #a6d2cd}.node.warn{background:var(--amber);box-shadow:0 0 0 1px #e7bf8d}.row strong{display:block;margin-bottom:4px;font-size:14px}.row p{margin:0;color:var(--muted);font-size:12px}.row .text-btn{align-self:center}
    .prompt{margin-top:30px;padding:24px;border:1px solid #d5e8e3;border-radius:13px;background:linear-gradient(135deg,#fbfffd,#f1f9f6)}.prompt label{display:block;margin-bottom:11px;color:var(--teal-dark);font-size:13px;font-weight:850}.prompt-field{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;border:1px dashed #a9cec7;border-radius:10px;background:#fff;color:#a0aab6;cursor:text}.prompt-field span{font-size:15px}.prompt-field .mic{margin-left:auto;color:var(--teal);font-size:20px}.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.examples button{padding:7px 10px;border:1px solid #d7e4e0;border-radius:999px;background:#fff;color:var(--muted);font-size:11px;cursor:pointer}.examples button:hover{color:var(--teal);border-color:#a9cec7}
    .after-prompt{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:25px;color:var(--muted);font-size:12px}.after-prompt strong{color:var(--ink)}
    .result-list{display:grid;gap:0;margin-top:25px;border-top:1px solid var(--line)}.result{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}.result time{color:var(--quiet);font-size:11px}.result h3{margin:0 0 5px;font-size:16px}.result p{margin:0;color:var(--muted);font-size:12px}.result-status{color:var(--teal);font-size:12px;font-weight:800}.result-status.warn{color:var(--amber)}
    .context-band{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:28px;padding:18px 20px;border:1px solid #e0e2e3;border-radius:11px;background:#fff}.context-band .mark{display:flex;align-items:center;gap:11px}.check{display:grid;place-items:center;width:31px;height:31px;border-radius:10px;background:var(--teal-soft);color:var(--teal);font-weight:900}.context-band strong{font-size:14px}.context-band p{margin:3px 0 0;color:var(--muted);font-size:12px}.context-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}
    .guide{display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:start;margin-top:37px}.guide h1{max-width:530px}.guide-copy{max-width:500px;color:var(--muted);font-size:15px}.steps{display:grid;gap:0;margin-top:29px;border-top:1px solid var(--line)}.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:13px;padding:16px 0;border-bottom:1px solid var(--line)}.step-num{display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:850}.step strong{display:block;margin-bottom:4px;font-size:13px}.step p{margin:0;color:var(--muted);font-size:12px}.first-action{padding:22px;border:1px solid #d5e8e3;border-radius:13px;background:#f5fbf8}.first-action h2{margin-bottom:8px}.first-action p{margin:0 0 18px;color:var(--muted);font-size:13px}.small-record{margin-top:35px;padding-top:22px;border-top:1px solid var(--line)}.small-record p{margin:8px 0 0;color:var(--muted);font-size:12px}
    .footer-status{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:54px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.signals{display:flex;gap:15px;flex-wrap:wrap}.signals span{display:inline-flex;align-items:center;gap:6px}.signals i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.signals i.warn{background:var(--amber)}
    .live{position:fixed;left:50%;bottom:24px;z-index:4;width:min(680px,calc(100vw - 48px));padding:15px 17px;border:1px solid #b8d8d1;border-radius:13px;background:rgba(250,255,253,.97);box-shadow:0 14px 38px rgba(24,67,61,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-label{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:12px;font-weight:850}.pulse{width:8px;height:8px;border-radius:50%;background:#ec755e;box-shadow:0 0 0 5px #fde6df}.close{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.transcript{margin-bottom:12px;font-size:15px;line-height:1.5}.transcript small{color:var(--muted);font-size:11px}.live-actions{display:flex;gap:8px}.live-actions button{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:12px;cursor:pointer}.live-actions button:first-child{color:var(--teal);font-weight:750}.hotkey{margin:9px 0 0;color:var(--quiet);font-size:11px}
    .toast{position:fixed;left:50%;bottom:24px;z-index:5;padding:9px 13px;border:1px solid #cbdad7;border-radius:8px;background:rgba(255,253,250,.98);color:var(--teal);font-size:12px;box-shadow:0 8px 24px rgba(30,40,50,.13);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    .picker{position:fixed;bottom:24px;left:50%;z-index:10;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24);font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transform:translateX(-50%);user-select:none}.picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.picker[data-ready] .picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.picker button{position:relative;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);cursor:pointer}.picker button:hover{color:rgba(255,255,255,.9)}.picker button.active{color:#fff}.picker .divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.picker .replay{padding:0 10px;font-size:14px}
    @media(max-width:980px){body{min-width:0}.app{padding:0}.product{min-height:100vh;border-radius:0}.product>div{min-height:100vh;grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:21px 9px}.brand{padding:0 9px 30px;font-size:0}.brand:after{content:"O";font-size:18px}.nav-label,.nav button span,.nav-foot{display:none}.nav button{justify-content:center;padding:12px 0}main{padding:42px 34px 30px}.guide{grid-template-columns:1fr;gap:25px}}
    @media(max-width:660px){.topline{display:block}.topline .primary{margin-top:20px}.row{grid-template-columns:42px 12px minmax(0,1fr)}.row .text-btn{display:none}.result{grid-template-columns:54px minmax(0,1fr)}.result-status{display:none}.context-band{align-items:flex-start;flex-direction:column}.footer-status{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app"><div class="product" id="product"></div></div>
  <nav class="picker" id="picker" aria-label="首页维度切换"><span class="picker-highlight" aria-hidden="true"></span><button class="active" aria-current="true">A · 需求</button><button>B · 结果</button><button>C · 环境</button><button>D · 新手</button><span class="divider" aria-hidden="true"></span><button class="replay" aria-label="重新播放">↻</button></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const nav = ['首页','Agent','我的习惯','按键设置','虚拟键盘','语音设置','摄像头','数据'];
    const records = [
      ['14:32','整理首页架构','已交给 Cursor · voice-pilot','继续 →','ok'],
      ['13:58','一段语音输入已完成','已转换为文字，并保留在最近工作','查看 →','ok'],
      ['11:20','快捷键存在冲突','开始倾听可能被其他应用占用','处理 →','warn']
    ];
    function sidebar(){return `<aside class="sidebar"><div class="brand">一声 OneTone</div><div class="nav-label">工作区</div><nav class="nav">${nav.map((item,i)=>`<button class="${i===0?'active':''}" data-nav="${item}"><i class="dot"></i><span>${item}</span></button>`).join('')}</nav><div class="nav-foot"><strong>本地工作状态</strong>已准备好 · 最近同步刚刚完成</div></aside>`}
    function timeline(){return `<div class="activity">${records.map(r=>`<article class="row"><time>${r[0]}</time><div class="track"><i class="node ${r[4]==='warn'?'warn':''}"></i></div><div><strong>${r[1]}</strong><p>${r[2]}</p></div><button class="text-btn ${r[4]==='warn'?'warn':''}" data-action="${r[3].replace(' →','')}">${r[3]}</button></article>`).join('')}</div>`}
    function footer(){return `<footer class="footer-status"><div class="signals"><span><i></i>当前环境已确认</span><span><i></i>最近记录已保存</span><span><i class="warn"></i>1 项需要注意</span></div><button class="text-btn" data-action="查看状态详情">查看状态详情</button></footer>`}
    function shell(body, cls=''){return `<div class="${cls}">${sidebar()}<main><div class="content">${body}</div></main></div>`}
    function variantA(){return shell(`<header class="topline"><div><p class="eyebrow">OneTone · 工作台</p><h1>你现在想完成什么？</h1><p>告诉我一件事，OneTone 会结合当前环境，把它交给正在使用的应用。</p></div><button class="primary" data-listen>说出你的想法</button></header><div class="prompt"><label>从一句话开始</label><div class="prompt-field" data-action="打开输入"><span>例如：帮我整理这段内容</span><span class="mic">⌁</span></div><div class="examples"><button data-action="继续上次工作">继续上次工作</button><button data-action="整理一段内容">整理一段内容</button><button data-action="把这句话发给 Cursor">把这句话发给 Cursor</button></div></div><div class="after-prompt"><span>当前工作环境：<strong>Cursor · voice-pilot</strong></span><button class="text-btn" data-action="确认工作环境">更换</button></div><section class="section"><div class="section-head"><h2>最近完成了什么</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div>${timeline()}</section>${footer()}`,'variant-a')}
    function variantB(){return shell(`<header><p class="eyebrow">OneTone · 工作记录</p><h1>最近发生了什么？</h1><p class="muted" style="max-width:590px;margin:0;font-size:15px">每次输入和完成的工作都会留下清楚的结果。你可以从上次停下的地方继续。</p></header><section class="section"><div class="section-head"><h2>最近工作</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div><div class="result-list"><article class="result"><time>刚刚<br>14:32</time><div><h3>整理首页架构</h3><p>已将内容交给 Cursor · voice-pilot</p></div><span class="result-status">已完成</span></article><article class="result"><time>今天<br>13:58</time><div><h3>一段语音输入</h3><p>已经转换为文字，并保留在最近工作</p></div><span class="result-status">已保存</span></article><article class="result"><time>今天<br>11:20</time><div><h3>快捷键存在冲突</h3><p>开始倾听可能被其他应用占用</p></div><span class="result-status warn">需处理</span></article></div></section><div class="context-band"><div class="mark"><span class="check">✓</span><div><strong>当前工作环境已确认</strong><p>Cursor · voice-pilot</p></div></div><div class="context-actions"><button class="text-btn" data-action="更换工作环境">更换</button><button class="primary" data-listen>开始倾听</button></div></div>${footer()}`,'variant-b')}
    function variantC(){return shell(`<p class="eyebrow">OneTone · 当前工作</p><div class="context-band" style="margin-top:18px"><div class="mark"><span class="check">✓</span><div><strong>你正在 Cursor 的 voice-pilot 项目中工作</strong><p>OneTone 会把新的输入交给这里</p></div></div><button class="text-btn" data-action="确认其他项目">更换</button></div><header style="margin-top:52px"><h1>想继续刚才的工作，还是开始一件新的事？</h1><p class="muted" style="max-width:590px;margin:0;font-size:15px">不用选择输入方式，直接告诉 OneTone 你想完成的事情。</p><div style="display:flex;gap:10px;align-items:center;margin-top:23px"><button class="primary" data-listen>说出你的想法</button><button class="secondary" data-action="继续整理首页架构">继续上次工作</button></div></header><section class="section" style="margin-top:45px"><div class="section-head"><h2>最近工作</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div>${timeline()}</section>${footer()}`,'variant-c')}
    function variantD(){return shell(`<div class="guide"><div><p class="eyebrow">OneTone · 第一次使用</p><h1>从你想做的事开始。</h1><p class="guide-copy">你不需要先学习语音、按键或 Agent。告诉 OneTone 你想完成什么，它会在当前工作环境中帮你完成，并把结果记录下来。</p><div class="steps"><div class="step"><span class="step-num">1</span><div><strong>说出你想完成的事</strong><p>用自然的话描述目标，不需要记命令。</p></div></div><div class="step"><span class="step-num">2</span><div><strong>确认它将交给谁</strong><p>OneTone 会根据当前应用和项目给出清晰确认。</p></div></div><div class="step"><span class="step-num">3</span><div><strong>下次回来继续</strong><p>每次完成的工作都会留下可恢复的记录。</p></div></div></div></div><div><div class="first-action"><h2>先试一件小事</h2><p>例如：把“你好，OneTone”发给当前应用。</p><button class="primary" data-listen>说出第一句话</button></div><div class="small-record"><h2>最近工作</h2><p>你还没有新的记录。完成第一件事后，它会出现在这里。</p></div></div></div>${footer()}`,'variant-d')}
    const variants=[variantA,variantB,variantC,variantD];const product=document.getElementById('product');const picker=document.getElementById('picker');const pickerItems=[...picker.querySelectorAll('button:not(.replay)')];const highlight=picker.querySelector('.picker-highlight');const toast=document.getElementById('toast');let current=0,timer;
    function move(){const el=pickerItems[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function mount(i){product.innerHTML=variants[i]();product.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{product.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.nav!=='首页')notice(`打开${b.dataset.nav}：保持在全局导航内`)}));product.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：原型交互已触发`)));product.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',startListening))}
    function startListening(){let dock=document.querySelector('.live');if(!dock){dock=document.createElement('div');dock.className='live';document.body.appendChild(dock)}dock.innerHTML='<div class="live-top"><span class="live-label"><i class="pulse"></i>正在倾听 · Cursor</span><button class="close" data-live="关闭">×</button></div><div class="transcript">我想把首页做得更轻一点……<br><small>实时识别中 · 结束后会进入最近工作</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：倾听已结束`)}))}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;pickerItems.forEach((b,j)=>{b.classList.toggle('active',j===i);if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});move();const url=new URL(location);url.searchParams.set('v',String.fromCharCode(65+i));history.replaceState(null,'',url);mount(i)}
    pickerItems.forEach((b,i)=>b.addEventListener('click',()=>setActive(i)));picker.querySelector('.replay').addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const key=e.key.toUpperCase();if(key>='A'&&key<='D')setActive(key.charCodeAt(0)-65);else if(e.key==='ArrowRight')setActive((current+1)%4);else if(e.key==='ArrowLeft')setActive((current+3)%4);else if(key==='R')mount(current)});const param=new URLSearchParams(location.search).get('v');setActive(param&&/^[A-D]$/.test(param)?param.charCodeAt(0)-65:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
