<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone 首页能力总览</title><style>
:root{--bg:#eef2ef;--paper:#fff;--ink:#18221d;--muted:#708078;--line:#dce5df;--green:#198466;--mint:#e4f3ec;--lime:#d9f06d;--amber:#d38b2e;--amberbg:#fff5e1;--shadow:0 18px 55px #17312614}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Microsoft YaHei",sans-serif}.top{height:66px;background:#fbfcfb;border-bottom:1px solid var(--line);padding:0 31px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.mark{width:33px;height:33px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.context{font-size:10px;color:var(--muted)}.view{max-width:1120px;margin:auto;padding:35px 28px 110px}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:700;color:var(--green)}h1{font-size:31px;letter-spacing:-1.3px;margin:8px 0 5px}p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.head p{max-width:380px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}button{font:inherit;cursor:pointer}.primary{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:11px}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:11px}.tag{font-size:10px;border-radius:999px;padding:5px 8px;background:var(--mint);color:var(--green)}.tag.amber{background:var(--amberbg);color:#a66b1d}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{padding:22px}.card h2{font-size:14px;margin:0 0 16px}.status{display:flex;align-items:center;gap:14px;padding-bottom:19px;border-bottom:1px solid #edf1ee}.ring{width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--green) 0 78%,#e7eee9 78%);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.ring b{position:relative;z-index:1;font-size:19px}.status strong{display:block;font-size:16px;margin-bottom:4px}.status p{font-size:10px}.ability-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.ability{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;justify-content:space-between;gap:7px;align-items:start}.ability b{font-size:11px;display:block}.ability small{display:block;color:var(--muted);font-size:9px;margin-top:5px;line-height:1.45}.ability .ok{color:var(--green);font-size:13px}.ability.next{background:#fffaf0;border-color:#f0d39a}.benefit{background:var(--ink);color:#fff}.benefit p{color:#b7c8bf}.benefit h2{margin-bottom:6px}.benefit-main{font-size:26px;letter-spacing:-.8px;margin:23px 0 7px}.flow{display:flex;gap:6px;align-items:center;margin:19px 0 22px;flex-wrap:wrap}.flow span{font-size:10px;padding:8px 10px;border-radius:8px;background:#2b3c34;color:#d4e6dc}.flow i{font-style:normal;color:#84a998}.benefit .primary{background:var(--lime);color:var(--ink)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.section-title h3{font-size:12px;margin:0}.section-title span{font-size:10px;color:var(--muted)}.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.channel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px}.channel .icon{font-size:20px;margin-bottom:12px}.channel b{font-size:11px}.channel p{font-size:9px;margin-top:5px;line-height:1.5}.channel.ready{border-color:#9dcab9;background:#f7fcf9}.channel.next{background:#fffaf0;border-color:#f0d39a}.appbar{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:13px}.appbar strong{font-size:11px}.appbar small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.actions{display:flex;gap:7px}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 14px;border-radius:9px;font-size:10px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}.map{padding:27px}.map-head{display:flex;justify-content:space-between;align-items:start}.map-head h2{font-size:17px;margin:0 0 5px}.map-canvas{height:410px;margin-top:19px;position:relative;background:radial-gradient(circle at center,#f3faf5 0 22%,transparent 22.5%),linear-gradient(135deg,#f8faf8,#edf4ef);border-radius:16px;overflow:hidden}.map-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:145px;height:145px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 0 0 13px #dfeee5}.map-core b{font-size:18px;font-weight:500}.map-core small{font-size:9px;color:#bdd6c9;margin-top:6px}.orbitline{position:absolute;inset:21% 12%;border:1px dashed #b7c9bd;border-radius:50%}.node{position:absolute;min-width:118px;padding:12px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 16px #1731260b}.node b{font-size:10px}.node small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.node.ready{border-color:#9dcab9;background:#f8fcf9}.node.next{background:#fffaf0;border-color:#efcf8e}.node.a{top:28px;left:50%;transform:translateX(-50%)}.node.b{right:27px;top:50%;transform:translateY(-50%)}.node.c{bottom:28px;left:50%;transform:translateX(-50%)}.node.d{left:27px;top:50%;transform:translateY(-50%)}.map-foot{display:flex;gap:9px;align-items:center;margin-top:17px}.map-foot p{flex:1}.scene{padding:0;overflow:hidden}.scene-top{padding:24px 25px;background:var(--ink);color:#fff}.scene-top p{color:#b8c8bf}.scene-top h2{font-size:22px;margin:7px 0}.scene-body{padding:22px}.scene-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #edf1ee}.scene-row:last-child{border:0}.scene-row b{font-size:11px}.scene-row small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.switch{width:35px;height:20px;border-radius:20px;background:var(--green);position:relative}.switch:after{content:"";width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;right:2px;top:2px}.scene-footer{padding:15px 22px;background:#f7faf7;display:flex;justify-content:space-between;align-items:center}.scene-footer small{font-size:9px;color:var(--muted)}.proto-picker{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;background:#121714dd;border-radius:999px;z-index:9}.proto-picker button{border:0;background:transparent;color:#ffffff90;border-radius:999px;padding:7px 12px;font-size:10px}.proto-picker button[data-active]{background:#ffffff20;color:#fff}@media(max-width:780px){.top{padding:0 17px}.context{display:none}.view{padding:26px 15px 100px}.head{display:block}.head p{margin-top:10px}.grid{grid-template-columns:1fr}.channels{grid-template-columns:1fr 1fr}.ability-list{grid-template-columns:1fr}.map-canvas{height:500px}.node.a{top:22px}.node.c{bottom:22px}.node.b{right:8px}.node.d{left:8px}}
</style></head><body><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone</b><small>能力总览 · 当前可用</small></div></div><span class="context">当前应用：Codex　·　全局方案</span></header><main id="stage"></main><nav class="proto-picker"><button data-active>总览掌控</button><button>能力地图</button><button>当前收益</button></nav><div id="toast" class="toast"></div><script>
const views=[()=>`<section class="view"><div class="head"><div><div class="eyebrow">ONE TONE HOME</div><h1>今天，你想让 OneTone 帮你少做什么？</h1></div><p>首页先告诉你已经拥有的能力，再把最值得获取的一项放到眼前。技术配置只在需要时出现。</p></div><div class="grid"><section class="panel card"><div class="status"><div class="ring"><b>78%</b></div><div><strong>基础能力已通畅</strong><p>按键、输入框定位、语音输入已可用<br>还有 2 项能力值得继续探索</p></div><span class="tag">可直接使用</span></div><div class="ability-list"><div class="ability"><div><b>一键语音输入</b><small>按习惯键，直接在当前输入框说话</small></div><span class="ok">✓</span></div><div class="ability"><div><b>文本安全保留</b><small>默认不自动发送，随时可以撤回</small></div><span class="ok">✓</span></div><div class="ability next"><div><b>SoftPad Agent</b><small>从输入升级到编辑、改写和执行</small></div><span class="tag amber">值得获取</span></div><div class="ability next"><div><b>摄像头手势</b><small>检测到摄像头后可探索手势控制</small></div><span class="tag amber">待探索</span></div></div></section><section class="panel card benefit"><h2>现在获取一个明显变化</h2><p>从“能输入”升级为“能让 Agent 完成任务”</p><div class="benefit-main">让 SoftPad 接住你的意图</div><p>你只要确认一次，OneTone 会保留当前习惯并带你试跑。</p><div class="flow"><span>按键</span><i>→</i><span>语音</span><i>→</i><span>SoftPad</span><i>→</i><span>Agent</span></div><button class="primary" data-act="get">一键获取 SoftPad 能力</button></section></div><div class="section-title"><h3>四条能力通道</h3><span>每条通道都通向 Agent 控制</span></div><div class="channels"><div class="channel ready"><div class="icon">⌨</div><b>按键通道</b><p>已连接 · 你的习惯键可以启动语音</p></div><div class="channel ready"><div class="icon">◉</div><b>语音通道</b><p>已连接 · 使用你选择的输入法</p></div><div class="channel next"><div class="icon">▣</div><b>SoftPad</b><p>可获取 · 编辑、整理、执行 Agent 任务</p></div><div class="channel next"><div class="icon">◌</div><b>摄像头</b><p>有设备后探索 · 手势控制</p></div></div><div class="appbar"><div><strong>当前情景：全局方案</strong><small>还没有为 Codex 单独配置，继续使用全局习惯</small></div><div class="actions"><button class="secondary" data-act="scene">查看情景</button><button class="primary" data-act="test">立即试跑</button></div></div></section>`,()=>`<section class="view"><div class="head"><div><div class="eyebrow">ABILITY MAP</div><h1>你的 Agent 控制能力地图</h1></div><p>不是配置清单，而是一张可以逐步点亮的地图。中心是 Agent，外围是你可以掌控它的不同入口。</p></div><div class="panel map"><div class="map-head"><div><h2>全局能力进度</h2><p>已点亮 2 条通道 · 还有 3 条值得探索</p></div><span class="tag">基础阶段</span></div><div class="map-canvas"><div class="orbitline"></div><div class="map-core"><b>Agent</b><small>等待你的下一条意图</small></div><div class="node ready a"><b>按键启动</b><small>已获得 · 一按即说</small></div><div class="node next b"><b>SoftPad 编辑</b><small>下一步 · 让 Agent 动手</small></div><div class="node next c"><b>应用情景</b><small>可配置 · 自动切换习惯</small></div><div class="node ready d"><b>语音输入</b><small>已获得 · 文本安全保留</small></div></div><div class="map-foot"><p>从右侧最靠近你的能力开始，完成一次真实任务后会自动点亮。</p><button class="primary" data-act="get">点亮 SoftPad</button><button class="secondary" data-act="later">先试用已有能力</button></div></div><div class="section-title"><h3>探索提示</h3><span>按你的硬件和习惯推荐</span></div><div class="channels"><div class="channel ready"><div class="icon">✓</div><b>马上可用</b><p>按键 + 语音输入已经可以在真实应用试跑</p></div><div class="channel next"><div class="icon">→</div><b>下一步最值</b><p>SoftPad 会把“输入”变成“让 Agent 做事”</p></div><div class="channel"><div class="icon">＋</div><b>应用情景</b><p>为常用应用增加两个输入位置</p></div><div class="channel"><div class="icon">?</div><b>以后探索</b><p>摄像头、外部设备和更多 Agent</p></div></div></section>`,()=>`<section class="view"><div class="head"><div><div class="eyebrow">YOUR NEXT WIN</div><h1>先看结果，再决定要不要配置</h1></div><p>首页直接呈现一次真实使用场景。用户完成后，再把能力沉淀成全局或应用方案。</p></div><div class="panel scene"><div class="scene-top"><div class="eyebrow" style="color:#9dcab9">CURRENT SCENE · CODEX</div><h2>让 Agent 帮你整理这段代码</h2><p>你现在只需要按一次习惯键，说出“整理这段代码”。</p><div class="flow"><span>按键</span><i>→</i><span>说话</span><i>→</i><span>定位当前输入框</span><i>→</i><span>Agent 执行</span></div><button class="primary" data-act="try">立即试一次</button></div><div class="scene-body"><div class="scene-row"><div><b>一键启动语音</b><small>保留你已经使用的语音输入法和结束习惯</small></div><span class="tag">已可用</span></div><div class="scene-row"><div><b>真实输入框定位</b><small>当前 Codex 输入框 · 上次位置可复用</small></div><span class="tag">已可用</span></div><div class="scene-row"><div><b>SoftPad Agent 接管</b><small>让语音不只是输入，而是触发编辑和执行</small></div><span class="switch"></span></div><div class="scene-row"><div><b>发送与撤回策略</b><small>默认保留文本，高风险动作二次确认</small></div><span class="switch"></span></div></div><div class="scene-footer"><small>配置会先应用于当前情景；全局方案仍保持不变</small><button class="secondary" data-act="configure">配置当前应用</button></div></div><div class="section-title"><h3>你还可以获得</h3><span>不影响当前工作流</span></div><div class="channels"><div class="channel next"><div class="icon">▣</div><b>SoftPad 编辑</b><p>一句话改写、整理、生成下一步动作</p></div><div class="channel"><div class="icon">⌘</div><b>结束方式</b><p>保留、确认发送或自动发送，由你决定</p></div><div class="channel"><div class="icon">↗</div><b>应用情景</b><p>切换窗口时自动加载对应习惯</p></div><div class="channel"><div class="icon">↶</div><b>安全回退</b><p>打断、撤回和恢复始终可用</p></div></div></section>`];const stage=document.getElementById('stage'),items=[...document.querySelectorAll('.proto-picker button')];let current=0;function say(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function bind(){stage.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{b.disabled=true;const old=b.textContent;b.textContent='正在准备…';setTimeout(()=>{b.disabled=false;b.textContent=old;say(b.dataset.act==='get'?'SoftPad 能力已加入下一步：现在可以试跑一次':b.dataset.act==='try'?'试跑完成：Agent 已接住你的意图':'已保留当前方案，随时可以继续探索')},600)})}function mount(i){current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i)});stage.innerHTML=views[i]();bind()}items.forEach((e,i)=>e.onclick=()=>mount(i));document.addEventListener('keydown',e=>{if(e.key>=1&&e.key<=3)mount(+e.key-1);if(e.key==='ArrowRight')mount((current+1)%3);if(e.key==='ArrowLeft')mount((current+2)%3)});mount(Math.max(0,Math.min(2,(parseInt(new URLSearchParams(location.search).get('v')||'1',10)-1))));</script></body></html>
