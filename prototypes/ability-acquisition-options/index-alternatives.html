<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone 轻量首页视图</title><style>body{margin:0;background:#f1f4f1;color:#17231c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid #dce5df;display:flex;align-items:center;justify-content:space-between;padding:0 34px}.brand{display:flex;gap:10px;align-items:center}.mark{background:#17231c;color:white;width:32px;height:32px;border-radius:10px;display:grid;place-items:center}.brand small,.muted{font-size:10px;color:#718078}.wrap{max-width:980px;margin:auto;padding:42px 28px 110px}.eyebrow{font-size:10px;color:#168365;letter-spacing:.15em;font-weight:700}h1{font-size:31px;letter-spacing:-1px;margin:8px 0}h2{font-size:18px;margin:0 0 7px}p{font-size:11px;line-height:1.7;color:#718078;margin:0}.head{margin-bottom:23px}.panel{background:white;border:1px solid #dce5df;border-radius:19px;box-shadow:0 18px 50px #17312612}.hero{padding:32px}.hero h2{font-size:25px;margin:18px 0 7px}.big{font-size:42px;letter-spacing:-2px;margin:23px 0 4px}.cta{display:flex;gap:8px;margin-top:25px}.primary,.secondary{padding:11px 15px;border-radius:9px;font-size:11px;cursor:pointer}.primary{background:#17231c;color:white;border:0}.secondary{background:white;border:1px solid #dce5df;color:#17231c}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}.card{padding:16px;border:1px solid #dce5df;border-radius:13px;background:#fff}.card b{font-size:11px}.card p{font-size:9px;margin-top:6px}.card.next{background:#fff8e9;border-color:#efcf92}.pill{display:inline-block;font-size:9px;background:#e4f3ec;color:#168365;border-radius:99px;padding:5px 8px;margin-top:10px}.tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.task{padding:23px;border-radius:16px;background:#fff;border:1px solid #dce5df;min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.task.dark{background:#17231c;color:#fff}.task.dark p{color:#b6c9be}.task b{font-size:15px}.task small{font-size:9px;color:#168365}.task .primary{align-self:start;background:#d9f06d;color:#17231c}.scene-list{display:grid;grid-template-columns:190px 1fr;min-height:420px;overflow:hidden}.scenes{background:#f6f9f6;padding:18px;border-right:1px solid #dce5df}.scene{padding:12px;border-radius:10px;margin-bottom:6px;cursor:pointer}.scene.active{background:#17231c;color:#fff}.scene strong{font-size:11px}.scene small{display:block;font-size:9px;color:#718078;margin-top:5px}.scene.active small{color:#aec4b6}.scene-main{padding:27px}.scene-main h2{font-size:23px;margin:17px 0 5px}.row{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:1px solid #edf1ee}.row b{font-size:11px}.row span{font-size:10px;color:#168365}.toast{position:fixed;right:20px;bottom:20px;padding:11px 14px;background:#17231c;color:white;border-radius:9px;font-size:10px;opacity:0}.toast.show{opacity:1}.picker{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#17231c;padding:4px;border-radius:99px}.picker button{border:0;background:transparent;color:#ffffff90;border-radius:99px;padding:7px 12px;font-size:10px}.picker button.active{background:#ffffff22;color:white}@media(max-width:720px){.wrap{padding:27px 15px 100px}.cards,.tasks{grid-template-columns:1fr}.scene-list{grid-template-columns:1fr}.scenes{border-right:0;border-bottom:1px solid #dce5df;display:flex;gap:5px;overflow:auto}.scene{min-width:110px}.top{padding:0 17px}.top .muted{display:none}}
</style><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone</b><small>轻量首页视图</small></div></div><span class="muted">Codex · 全局方案</span></header><main id="app"></main><nav class="picker"><button class="active">今日可用</button><button>任务卡片</button><button>情景切换</button></nav><div id="toast" class="toast"></div><script>const V=[()=>`<div class="wrap"><div class="head"><div class="eyebrow">TODAY'S ABILITY</div><h1>今天，先让它帮你完成一件事</h1><p>不看配置，不看系统状态。首页只把现在马上能用的能力放在眼前。</p></div><section class="panel hero"><span class="pill">已准备好</span><h2>按一次，说出你想做的事</h2><div class="big">少 3 次操作</div><p>OneTone 会使用你的习惯键、当前输入框和语音输入法，把内容安全保留在编辑区。</p><div class="cta"><button class="primary" data-a="try">立即试一次</button><button class="secondary" data-a="more">看看还能做什么</button></div></section><div class="cards"><div class="card"><b>✓ 一键语音输入</b><p>当前可用，已保留你的输入习惯。</p></div><div class="card"><b>✓ 输入框定位</b><p>Codex 上次位置已记住。</p></div><div class="card next"><b>→ SoftPad Agent</b><p>下一步，把语音变成 Agent 动作。</p><span class="pill" style="background:#fff0ce;color:#a36b1d">值得获取</span></div></div></div>`,()=>`<div class="wrap"><div class="head"><div class="eyebrow">TASK FIRST</div><h1>你想让 OneTone 帮你完成什么？</h1><p>能力不再单独展示，而是直接放进任务里。完成任务的同时，能力会自动建立。</p></div><div class="tasks"><section class="task dark"><div><small>推荐 · 现在就能用</small><h2>把想法说进当前输入框</h2><p>按习惯键，说话，文本保留。适合快速记录、提问和写作。</p></div><button class="primary" data-a="try">开始一次</button></section><section class="task"><div><small>下一步能力</small><h2>让 Agent 帮我整理</h2><p>获得 SoftPad 后，可以用语音触发改写、归纳和下一步动作。</p></div><button class="secondary" data-a="get">获取 SoftPad</button></section><section class="task"><div><small>情景能力</small><h2>切换应用自动换习惯</h2><p>为不同应用保留输入位置、结束方式和 Agent 命令。</p></div><button class="secondary" data-a="scene">配置一个应用</button></section><section class="task"><div><small>探索能力</small><h2>试试摄像头和手势</h2><p>检测到硬件后再推荐，不影响当前语音工作流。</p></div><button class="secondary" data-a="later">稍后探索</button></section></div></div>`,()=>`<div class="wrap"><div class="head"><div class="eyebrow">SCENE SWITCHER</div><h1>进入应用，能力自动跟着你走</h1><p>默认使用全局方案。只有你主动配置过的应用，才会加载独立情景。</p></div><section class="panel scene-list"><aside class="scenes"><div class="scene active"><strong>Codex</strong><small>当前应用</small></div><div class="scene"><strong>浏览器</strong><small>未单独配置</small></div><div class="scene"><strong>全局方案</strong><small>默认习惯</small></div><button class="secondary" style="margin-top:12px;width:100%" data-a="add">添加应用</button></aside><div class="scene-main"><span class="pill">当前已加载</span><h2>Codex 情景</h2><p>使用全局习惯 · 还没有覆盖设置</p><div class="row"><div><b>启动方式</b><small class="muted">习惯键 + 语音输入</small></div><span>已通畅</span></div><div class="row"><div><b>输入位置</b><small class="muted">记住上次成功位置，可保留两个</small></div><span>已通畅</span></div><div class="row"><div><b>结束方式</b><small class="muted">默认保留文本，发送前二次确认</small></div><span>安全</span></div><div class="cta"><button class="primary" data-a="try">在当前应用试跑</button><button class="secondary" data-a="config">自定义 Codex</button></div></div></section></div>`];let cur=0,app=document.getElementById('app'),buttons=[...document.querySelectorAll('.picker button')];function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1600)}function mount(i){cur=i;buttons.forEach((b,j)=>b.classList.toggle('active',i===j));app.innerHTML=V[i]();app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>toast({try:'试跑完成：OneTone 已接住你的意图',get:'SoftPad 已加入下一步能力',scene:'应用情景入口已准备好',later:'已保留，随时可以回来探索',add:'请先打开一个应用再添加',config:'当前应用的自定义设置已打开',more:'你还可以探索 SoftPad、应用情景和手势控制'}[b.dataset.a]))}buttons.forEach((b,i)=>b.onclick=()=>mount(i));document.addEventListener('keydown',e=>{if(e.key>=1&&e.key<=3)mount(+e.key-1)});mount(0)</script></html>
