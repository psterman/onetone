<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 来源明确的首页</title>
  <style>
    :root{--bg:#e9ece9;--paper:#fbfaf7;--panel:#fffefa;--soft:#f1f3f0;--ink:#1b2a3e;--muted:#718094;--faint:#a6afb9;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--blue:#5d789e;--blue-soft:#edf2f8;--amber:#a36525;--amber-soft:#fff0dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:310px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .index{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.index-head{padding:24px 20px 15px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:23px;color:var(--teal);font-size:14px;font-weight:850}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.index-title{display:flex;justify-content:space-between;align-items:center}.index-title h1{margin:0;font-size:19px}.index-title button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.source-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.legend{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:9px}.legend i{width:6px;height:6px;border-radius:50%}.legend .one{background:var(--teal)}.legend .cursor{background:var(--blue)}.legend .partial{background:var(--amber)}.list{min-height:0;overflow:auto;padding:0 10px 15px}.group{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.entry{display:block;width:100%;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.entry:hover{background:#fff}.entry.active{border-color:var(--teal-line);background:#fffefa}.entry-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.entry-title{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.entry-time{color:var(--faint);font-size:10px;white-space:nowrap}.entry-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.entry-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}.entry-dot.cursor{background:var(--blue)}.entry-dot.partial{background:var(--amber)}.entry-source{margin-left:auto;color:var(--faint);font-size:9px}.index-foot{margin-top:auto;padding:13px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.index-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 40px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:970px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:12px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-size:10px;font-weight:800}.top-actions button{border:0;background:transparent;color:var(--muted);font-size:10px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:36px 0 21px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.intro h2{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-.05em}.intro p{max-width:650px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.refresh{padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}.refresh:hover{background:var(--teal-soft)}
    .session-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.session-main{display:flex;align-items:center;gap:9px;min-width:0}.session-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal);font-size:11px;font-weight:900}.session-main strong{font-size:11px}.session-main small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.session-side{color:var(--muted);font-size:9px;white-space:nowrap}
    .body{min-height:0;flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:13px;margin-top:13px}.evidence-flow{min-height:0;overflow:auto;padding-right:5px}.source-block{padding:15px 0;border-bottom:1px solid var(--line)}.source-block:last-child{border-bottom:0}.source-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:11px}.source-name{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:850}.source-name i{width:7px;height:7px;border-radius:50%;background:var(--teal)}.source-name i.cursor{background:var(--blue)}.source-head span{color:var(--muted);font-size:9px}.source-note{margin:0 0 11px;color:var(--muted);font-size:10px}.event-line{display:grid;grid-template-columns:70px 10px minmax(0,1fr);gap:12px;align-items:start}.event-line+ .event-line{margin-top:12px}.event-time{padding-top:2px;color:var(--muted);font-size:10px}.event-time strong{display:block;color:var(--ink);font-size:11px}.event-rail{position:relative;display:flex;justify-content:center;min-height:28px}.event-rail:before{content:"";position:absolute;top:8px;bottom:-18px;width:1px;background:#d6e5e1}.event-line:last-child .event-rail:before{display:none}.event-dot{position:relative;z-index:1;width:8px;height:8px;margin-top:3px;border:2px solid var(--paper);border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px #a7d2cc}.event-dot.cursor{background:var(--blue);box-shadow:0 0 0 1px #bccbe0}.event-text strong{display:block;margin-bottom:4px;font-size:12px}.event-text p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.event-text .quote{color:var(--ink);font-size:13px}.tag{display:inline-block;margin-top:6px;padding:3px 5px;border-radius:4px;background:var(--teal-soft);color:var(--teal);font-size:8px}.tag.cursor{background:var(--blue-soft);color:var(--blue)}.tag.partial{background:var(--amber-soft);color:var(--amber)}
    .action-zone{display:grid;gap:9px}.action-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 12px;border:1px solid var(--teal-line);border-radius:9px;background:#f3faf7}.action-copy{color:var(--muted);font-size:10px}.action-copy strong{display:block;margin-bottom:2px;color:var(--ink);font-size:11px}.actions{display:flex;gap:7px}.actions button{padding:8px 10px;border-radius:7px;font-size:10px}.sub{border:1px solid var(--teal-line);background:#fff;color:var(--teal)}.main{border:0;background:var(--teal);color:#fff;font-weight:800}.trace{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:9px}.trace span{display:inline-flex;align-items:center;gap:5px}.trace i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.trace i.partial{background:var(--amber)}.trace b{color:var(--ink)}.trace .arrow{color:var(--faint)}.trace button{margin-left:auto;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}
    .drawer{position:fixed;right:24px;top:24px;z-index:20;width:min(380px,calc(100vw - 48px));padding:17px;border:1px solid var(--line);border-radius:12px;background:#fffefa;box-shadow:0 14px 40px rgba(30,45,50,.17);transform:translateX(18px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.drawer.show{transform:translateX(0);opacity:1}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-head strong{font-size:13px}.drawer-close{border:0;background:transparent;color:var(--muted);font-size:18px}.basis{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}.basis-dot{width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--teal)}.basis-dot.cursor{background:var(--blue)}.basis-dot.partial{background:var(--amber)}.basis strong{display:block;margin-bottom:3px;font-size:11px}.basis p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.basis small{display:block;margin-top:5px;color:var(--faint);font-size:9px}.drawer-note{margin-top:11px;padding:9px 10px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:9px;line-height:1.45}
    .toast{position:fixed;left:50%;bottom:24px;z-index:30;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1000px){main{padding:21px 25px}.window{grid-template-columns:270px minmax(0,1fr)}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.intro{display:block;margin-top:27px}.refresh{margin-top:15px}.top-actions{display:none}.event-line{grid-template-columns:56px 10px minmax(0,1fr)}.action-bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.trace{align-items:flex-start;flex-wrap:wrap}.trace button{margin-left:0}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const sessions=[
      {group:'正在进行',title:'首页 · AI 工作现场',time:'现在',kind:'one',meta:'Cursor · voice-pilot',one:'当前会话 · OneTone 实时',cursor:'Cursor 历史索引'},
      {group:'今天',title:'重新规划首页',time:'14:32',kind:'cursor',meta:'Cursor · voice-pilot',one:'无 OneTone 实时记录',cursor:'Cursor 历史索引'},
      {group:'今天',title:'整理首页架构',time:'13:58',kind:'cursor',meta:'Cursor · voice-pilot',one:'无 OneTone 实时记录',cursor:'Cursor 历史索引'},
      {group:'昨天',title:'Soft Pad · Cursor 动作',time:'昨天',kind:'one',meta:'Cursor · 6 条动作',one:'OneTone 事件记录',cursor:'无 Cursor 回执'},
      {group:'更早',title:'第一次使用 OneTone',time:'周一',kind:'partial',meta:'OneTone · 入门会话',one:'部分 OneTone 事件',cursor:'未找到 Cursor 记录'}
    ];
    let selected=0,showCursorReply=false;
    function index(){let last='';return `<aside class="index"><div class="index-head"><div class="brand"><span class="mark">O</span>OneTone</div><div class="index-title"><h1>会话索引</h1><button data-action="新建会话">＋ 新会话</button></div><div class="search">⌕　搜索会话、项目或内容</div><div class="source-legend"><span class="legend"><i class="one"></i>OneTone 实时</span><span class="legend"><i class="cursor"></i>Cursor 历史</span><span class="legend"><i class="partial"></i>部分记录</span></div></div><div class="list">${sessions.map((s,i)=>{const group=s.group!==last;last=s.group;return `${group?`<div class="group">${s.group}</div>`:''}<button class="entry ${i===selected?'active':''}" data-entry="${i}"><div class="entry-top"><span class="entry-title">${s.title}</span><span class="entry-time">${s.time}</span></div><div class="entry-meta"><i class="entry-dot ${s.kind}"></i>${s.meta}<span class="entry-source">${s.kind==='cursor'?'Cursor 历史':s.kind==='partial'?'部分记录':'OneTone'}</span></div></button>`}).join('')}</div><div class="index-foot"><strong>这里是会话索引，不是精准时间线</strong><br>时间和来源会明确标注，不把导入数据伪装成实时事件。</div></aside>`}
    function block(s){return `<section class="source-block"><div class="source-head"><div class="source-name"><i class="${s.kind==='cursor'?'cursor':''}"></i>${s.kind==='cursor'?'Cursor 历史补全':'OneTone 精确事件'}</div><span>${s.kind==='cursor'?'来源时间 / 约略':'捕获时间 / 精确'}</span></div><p class="source-note">${s.kind==='cursor'?'只确认会话索引和最近更新时间，不推断每条消息的精确发生顺序。':'由 OneTone 自己捕获，时间用于真实事件轨迹。'}</p>${s.kind!=='cursor'?`<div class="event-line"><div class="event-time"><strong>${s.time}</strong>刚刚</div><div class="event-rail"><i class="event-dot"></i></div><div class="event-text"><strong>捕获用户意图</strong><p class="quote">“把首页做成 AI 辅助工作现场”</p><span class="tag">麦克风 · 精确时间</span></div></div><div class="event-line"><div class="event-time"><strong>随后</strong>OneTone</div><div class="event-rail"><i class="event-dot"></i></div><div class="event-text"><strong>确认当前目标</strong><p>Cursor · voice-pilot · 首页</p><span class="tag">环境快照 · 已确认</span></div></div>`:`<div class="event-line"><div class="event-time"><strong>${s.time}</strong>来源时间</div><div class="event-rail"><i class="event-dot cursor"></i></div><div class="event-text"><strong>发现 Cursor 会话索引</strong><p>会话存在，标题和最近更新时间可读取；正文和逐条消息时间需要单独来源。</p><span class="tag cursor">state.vscdb · 历史导入</span></div></div>`}</section>`}
    function main(){const s=sessions[selected];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>当前工作现场</strong><small>Cursor · voice-pilot · 首页</small></div></div><div class="top-actions"><span class="state">来源已标注</span><span>本地数据</span><button data-action="打开系统抽屉">系统</button></div></header><section class="intro"><div><p class="eyebrow">${s.time} · 来源明确</p><h2>${s.title}</h2><p>当前会话只显示能被来源支持的内容。OneTone 的实时事件和 Cursor 的历史索引不会混成一条假时间线。</p></div><button class="refresh" data-refresh>重新读取 Cursor 历史</button></section><div class="session-bar"><div class="session-main"><span class="session-mark">↗</span><div><strong>${s.meta}</strong><small>${s.one} · ${s.cursor}</small></div></div><span class="session-side">会话索引 · local-${selected+1}</span></div><div class="body"><div class="evidence-flow">${block(s)}${s.kind!=='cursor'?`<section class="source-block"><div class="source-head"><div class="source-name"><i class="cursor"></i>Cursor 实时回执</div><span>${showCursorReply?'已收到 / 已确认':'未获得 / 不显示完成'}</span></div><p class="source-note">Cursor 未提供实时回执时，这一段保持等待，不把历史索引当作本次执行结果。</p>${showCursorReply?`<div class="event-line"><div class="event-time"><strong>现在</strong>回执时间</div><div class="event-rail"><i class="event-dot cursor"></i></div><div class="event-text"><strong>Cursor 返回当前结果</strong><p>已收到本次任务的执行回执，可以继续写入会话。</p><span class="tag cursor">实时回执 · 已确认</span></div></div>`:`<div class="event-line"><div class="event-time"><strong>等待中</strong>不确定</div><div class="event-rail"><i class="event-dot" style="background:var(--amber)"></i></div><div class="event-text"><strong>等待 Cursor 回执</strong><p>目前只能打开 Cursor 会话或查看判断依据。</p><span class="tag partial">没有回执 · 不标记完成</span></div></div>`}</section>`:''}</div><div class="action-zone"><div class="action-bar"><div class="action-copy"><strong>${showCursorReply?'当前可以继续':'当前没有“已完成”依据'}</strong>${showCursorReply?'Cursor 已返回回执，继续发送动作已开放。':'可以查看来源、重新读取历史或打开 Cursor。'}</div><div class="actions"><button class="sub" data-evidence>查看依据</button><button class="sub" data-action="打开 Cursor 会话">打开 Cursor</button>${showCursorReply?'<button class="main" data-action="继续发送">继续发送</button>':'<button class="main" data-refresh>重新读取</button>'}</div></div><div class="trace"><span><i></i>OneTone 精确事件</span><span class="arrow">→</span><span><i class="partial"></i>Cursor 历史索引</span><span class="arrow">→</span><span><i class="${showCursorReply?'':'partial'}"></i>${showCursorReply?'回执已确认':'回执未获得'}</span><button data-evidence>展开依据</button></div></div></div></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=index()+main();win.querySelectorAll('[data-entry]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.entry);showCursorReply=false;mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：原型交互已触发`)));win.querySelectorAll('[data-refresh]').forEach(b=>b.addEventListener('click',()=>{showCursorReply=true;mount();notice('原型模拟：收到 Cursor 回执后才开放继续发送')}));win.querySelectorAll('[data-evidence]').forEach(b=>b.addEventListener('click',openDrawer))}function openDrawer(){let d=document.querySelector('.drawer');if(!d){d=document.createElement('aside');d.className='drawer';d.innerHTML='<div class="drawer-head"><strong>来源与时间依据</strong><button class="drawer-close">×</button></div><div class="basis"><i class="basis-dot"></i><div><strong>OneTone 实时事件</strong><p>麦克风、按键和 Soft Pad 由 OneTone 捕获，使用本机事件时间。</p><small>精确 · source=onetone</small></div></div><div class="basis"><i class="basis-dot cursor"></i><div><strong>Cursor 历史索引</strong><p>会话标题、ID、创建或更新时间来自本地历史数据库。</p><small>来源时间 · source=cursor-db</small></div></div><div class="basis"><i class="basis-dot partial"></i><div><strong>实时 Cursor 回执</strong><p>当前尚未获得，因此不把 Cursor 历史标记成“本次已完成”。</p><small>等待 · source=cursor-receipt</small></div></div><div class="drawer-note">这条页面轨迹由不同来源拼接，但不会删除来源差异，也不会把推断当成事实。</div>';document.body.appendChild(d);d.querySelector('.drawer-close').addEventListener('click',()=>d.classList.remove('show'))}d.classList.add('show')}mount();
  </script>
</body>
</html>
