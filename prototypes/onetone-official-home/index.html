<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 软件首页原型</title>
  <style>
    :root {
      --paper: #f6f4ef;
      --panel: #fffdfa;
      --ink: #17253a;
      --muted: #68758a;
      --faint: #a8b0bc;
      --line: #e7e5df;
      --teal: #0a837b;
      --teal-dark: #06645f;
      --teal-soft: #dff2ee;
      --blue-soft: #e8eef8;
      --amber: #b56621;
      --amber-soft: #fff0dd;
      --danger: #a44943;
      --nav: #eef0f3;
      --shadow: 0 18px 50px rgba(35, 43, 58, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #dfe3e6; color: var(--ink); }
    button { font: inherit; }
    .app { width: 100%; min-height: 100vh; display: block; padding: 20px; }
    .window { width: 100%; max-width: 1440px; min-height: calc(100vh - 40px); margin: 0 auto; overflow: hidden; background: var(--paper); border: 1px solid #cfd4d9; border-radius: 18px; box-shadow: var(--shadow); }
    .window > div { width: 100%; min-width: 0; min-height: 100%; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
    .sidebar { display: flex; flex-direction: column; padding: 24px 14px; background: var(--nav); border-right: 1px solid #d9dde1; }
    .brand { padding: 0 12px 26px; font-size: 15px; font-weight: 800; letter-spacing: .05em; color: var(--teal-dark); }
    .nav-label { padding: 0 12px 8px; color: #969eaa; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 9px; background: transparent; color: #526075; text-align: left; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out, transform 160ms ease-out; }
    .nav button:hover { background: rgba(255,255,255,.64); color: var(--ink); }
    .nav button:active { transform: scale(.985); }
    .nav button.active { background: #fffdfa; color: var(--ink); font-weight: 750; box-shadow: 0 1px 0 rgba(20,30,40,.04); }
    .nav .dot { width: 8px; height: 8px; border-radius: 50%; background: #9da7b4; }
    .nav button.active .dot { background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
    .sidebar-foot { margin-top: auto; padding: 15px 12px 0; border-top: 1px solid #d9dde1; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .sidebar-foot strong { color: var(--ink); }
    main { width: 100%; min-width: 0; padding: 36px 48px 42px; background: var(--paper); }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; min-width: 0; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 8px; color: var(--teal-dark); font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 680px; margin-bottom: 10px; font-size: clamp(28px, 3.2vw, 42px); line-height: 1.1; letter-spacing: -.045em; }
    .lead { max-width: 620px; margin-bottom: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .top-actions { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .icon-btn, .quiet-btn { padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,253,250,.72); color: var(--muted); cursor: pointer; }
    .icon-btn:hover, .quiet-btn:hover { border-color: #c5d5d5; color: var(--teal-dark); }
    .primary { padding: 12px 17px; border: 0; border-radius: 9px; background: var(--teal); color: #fff; font-weight: 800; cursor: pointer; box-shadow: 0 7px 16px rgba(10,131,123,.18); transition: transform 160ms ease-out, background 160ms ease-out; }
    .primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
    .primary:active { transform: translateY(1px); }
    .primary[aria-pressed="true"] { background: var(--danger); }
    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24), 0 2px 6px rgba(0,0,0,.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; user-select: none; }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255,255,255,.12); will-change: transform; }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(.23,1,.32,1), width 250ms cubic-bezier(.23,1,.32,1); }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
    .proto-picker-item:hover { color: rgba(255,255,255,.85); }
    .proto-picker-item:active { transform: scale(.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255,255,255,.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .8fr); gap: 22px; }
    .section { min-width: 0; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .section-head h2 { margin-bottom: 0; font-size: 14px; letter-spacing: .01em; }
    .section-head a { color: var(--teal-dark); font-size: 12px; font-weight: 750; text-decoration: none; cursor: pointer; }
    .section-head a:hover { text-decoration: underline; }
    .status-panel { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 15px; padding: 20px; border: 1px solid #cfe5df; border-radius: 13px; background: linear-gradient(135deg, #f9fffc, #eef8f5); }
    .status-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--teal-soft); color: var(--teal-dark); font-size: 20px; }
    .status-panel h3 { margin-bottom: 5px; font-size: 16px; }
    .status-panel p { margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .status-value { color: var(--teal-dark); font-size: 12px; font-weight: 800; white-space: nowrap; }
    .channels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .channel { padding: 13px 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,253,250,.75); cursor: pointer; transition: border-color 160ms ease-out, transform 160ms ease-out; }
    .channel:hover { border-color: #b9d5d2; transform: translateY(-1px); }
    .channel-top { display: flex; justify-content: space-between; align-items: center; gap: 5px; margin-bottom: 9px; }
    .channel-name { font-size: 12px; font-weight: 800; }
    .signal { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
    .signal.amber { background: var(--amber); }
    .channel small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice { display: flex; justify-content: space-between; gap: 14px; padding: 14px 15px; border: 1px solid #f0d7bb; border-radius: 11px; background: var(--amber-soft); }
    .notice strong { display: block; margin-bottom: 4px; color: #7d491e; font-size: 13px; }
    .notice p { margin-bottom: 0; color: #8a6849; font-size: 12px; line-height: 1.45; }
    .notice button { align-self: center; border: 0; background: transparent; color: #8a4e1b; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer; }
    .activity { overflow: hidden; border-top: 1px solid var(--line); }
    .event { display: grid; grid-template-columns: 50px 13px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 15px 2px; border-bottom: 1px solid var(--line); }
    .event time { padding-top: 2px; color: var(--faint); font-size: 11px; }
    .event-line { position: relative; display: flex; justify-content: center; min-height: 30px; }
    .event-line::before { content: ""; position: absolute; top: 10px; bottom: -20px; width: 1px; background: #d9e6e3; }
    .event:last-child .event-line::before { display: none; }
    .event-dot { position: relative; z-index: 1; width: 9px; height: 9px; margin-top: 3px; border: 2px solid var(--paper); border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #a5d3cd; }
    .event-dot.blue { background: #6285b9; box-shadow: 0 0 0 1px #bed0e7; }
    .event-dot.amber { background: var(--amber); box-shadow: 0 0 0 1px #efc89f; }
    .event strong { display: block; margin-bottom: 4px; font-size: 13px; line-height: 1.4; }
    .event p { margin-bottom: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .event-action { align-self: center; padding: 5px 0; border: 0; background: transparent; color: var(--teal-dark); font-size: 12px; font-weight: 750; cursor: pointer; }
    .side-stack { display: grid; align-content: start; gap: 22px; }
    .resume { padding: 19px; border: 1px solid #d8e0ed; border-radius: 13px; background: var(--blue-soft); }
    .resume .kicker { margin-bottom: 9px; color: #607ba4; font-size: 11px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .resume h3 { margin-bottom: 7px; font-size: 17px; line-height: 1.25; }
    .resume p { margin-bottom: 15px; color: #63718a; font-size: 13px; line-height: 1.55; }
    .resume-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: #77849a; font-size: 11px; }
    .resume-meta button { padding: 7px 10px; border: 1px solid #b7c9e1; border-radius: 7px; background: rgba(255,255,255,.62); color: #4e6995; font-size: 12px; font-weight: 800; cursor: pointer; }
    .quick { padding-top: 18px; border-top: 1px solid var(--line); }
    .quick-list { display: grid; gap: 7px; }
    .quick-list button { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .quick-list button:hover { color: var(--teal-dark); }
    .quick-list span { color: var(--muted); font-size: 12px; }
    .quick-list em { color: var(--faint); font-size: 11px; font-style: normal; }
    .live-dock { position: fixed; right: 28px; bottom: 28px; width: min(390px, calc(100vw - 56px)); padding: 17px; border: 1px solid #b8d8d1; border-radius: 15px; background: rgba(250,255,253,.96); box-shadow: 0 14px 40px rgba(24,67,61,.18); transform: translateY(16px); opacity: 0; pointer-events: none; transition: transform 180ms ease-out, opacity 180ms ease-out; }
    .live-dock.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .live-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 11px; }
    .live-label { display: flex; align-items: center; gap: 8px; color: var(--teal-dark); font-size: 12px; font-weight: 850; }
    .live-pulse { width: 8px; height: 8px; border-radius: 50%; background: #ef7a5e; box-shadow: 0 0 0 5px #fde5dd; }
    .live-copy { min-height: 42px; margin-bottom: 12px; color: var(--ink); font-size: 15px; line-height: 1.5; }
    .live-copy span { color: var(--muted); font-size: 12px; }
    .live-actions { display: flex; gap: 8px; }
    .live-actions button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--muted); font-size: 12px; cursor: pointer; }
    .live-actions button:first-child { border-color: #bbd9d4; color: var(--teal-dark); font-weight: 750; }
    .live-hotkey { margin: 11px 0 0; color: var(--faint); font-size: 11px; }
    .variant-editorial main { padding-top: 48px; }
    .variant-editorial .topline { margin-bottom: 42px; }
    .variant-editorial h1 { max-width: 580px; font-size: clamp(35px, 4.5vw, 58px); }
    .variant-editorial .workspace { grid-template-columns: minmax(0, 1fr) 300px; gap: 42px; }
    .variant-editorial .status-panel { padding: 24px; border: 0; border-left: 3px solid var(--teal); border-radius: 0; background: transparent; }
    .variant-editorial .channels { grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1px solid var(--line); }
    .variant-editorial .channel { padding: 14px 8px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
    .variant-editorial .activity { margin-top: 28px; }
    .variant-editorial .resume { background: transparent; border: 0; border-top: 3px solid var(--ink); border-radius: 0; padding: 17px 0; }
    .variant-quick main { padding: 30px 38px 42px; }
    .variant-quick .topline { align-items: center; margin-bottom: 22px; }
    .variant-quick h1 { font-size: 30px; }
    .variant-quick .lead { font-size: 14px; }
    .variant-quick .workspace { grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; }
    .variant-quick .status-panel { grid-template-columns: auto 1fr; padding: 15px; }
    .variant-quick .status-value { grid-column: 2; }
    .variant-quick .channels { grid-template-columns: repeat(2, 1fr); }
    .variant-quick .event { grid-template-columns: 45px 13px minmax(0,1fr) auto; padding: 12px 0; }
    .variant-quick .event p { display: none; }
    .variant-quick .side-stack { gap: 16px; }
    .variant-quick .resume { padding: 15px; }
    .variant-quick .quick { padding-top: 14px; }
    .toast { position: fixed; left: 28px; bottom: 28px; padding: 10px 13px; border: 1px solid #ccd9d7; border-radius: 8px; background: rgba(255,253,250,.96); color: var(--teal-dark); font-size: 12px; box-shadow: 0 9px 25px rgba(30,40,50,.12); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity 160ms ease-out, transform 160ms ease-out; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
    @media (max-width: 900px) { .app { padding: 0; } .window { border-radius: 0; } .window > div { grid-template-columns: 72px minmax(0,1fr); } .sidebar { padding: 20px 9px; } .brand { padding: 0 9px 25px; font-size: 0; } .brand::after { content: "O"; font-size: 18px; } .nav-label, .nav button span:not(.dot), .sidebar-foot { display: none; } .nav button { justify-content: center; padding: 12px 0; } main, .variant-quick main { padding: 28px 24px 100px; } .workspace, .variant-editorial .workspace, .variant-quick .workspace { grid-template-columns: 1fr; } .topline { display: block; } .top-actions { margin-top: 18px; } .side-stack { grid-row: auto; } }
    @media (max-width: 560px) { .channels { grid-template-columns: repeat(2, 1fr); } .status-panel { grid-template-columns: auto 1fr; } .status-value { grid-column: 2; } .top-actions .quiet-btn { display: none; } .event { grid-template-columns: 38px 10px minmax(0,1fr); } .event-action { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="window" id="window"></div>
  </div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">工作台</button>
    <button class="proto-picker-item">今日活动</button>
    <button class="proto-picker-item">快速开始</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const events = [
      { time: '14:32', type: 'teal', title: 'Agent 在 Cursor 中完成了一次输入', desc: '将“整理首页架构”发送到当前项目 voice-pilot。', action: '查看记录' },
      { time: '13:58', type: 'blue', title: '语音输入已转发到 Cursor', desc: '识别到 18 秒语音，未修改原文。', action: '查看文本' },
      { time: '11:20', type: 'amber', title: '检测到一次快捷键冲突', desc: 'Ctrl+Shift+D 与其他应用的全局快捷键重叠。', action: '处理' }
    ];

    const navItems = [
      ['home', '首页'], ['agent', 'Agent'], ['habit', '我的习惯'], ['key', '按键设置'], ['pad', '虚拟键盘'], ['voice', '语音设置'], ['camera', '摄像头'], ['data', '数据']
    ];

    function navHtml() {
      return `<aside class="sidebar" aria-label="OneTone 主导航">
        <div class="brand">一声 OneTone</div>
        <div class="nav-label">工作区</div>
        <nav class="nav">${navItems.map(([key, label], i) => `<button class="${i === 0 ? 'active' : ''}" data-nav="${key}"><i class="dot"></i><span>${label}</span></button>`).join('')}</nav>
        <div class="sidebar-foot"><strong>本地工作状态</strong><br>已准备好 · 最近同步刚刚完成</div>
      </aside>`;
    }

    function eventHtml() {
      return events.map(item => `<article class="event">
        <time>${item.time}</time><div class="event-line"><i class="event-dot ${item.type === 'blue' ? 'blue' : item.type === 'amber' ? 'amber' : ''}"></i></div>
        <div><strong>${item.title}</strong><p>${item.desc}</p></div><button class="event-action" data-action="${item.action}">${item.action} →</button>
      </article>`).join('');
    }

    function renderVariant(index) {
      const cls = index === 1 ? 'variant-editorial' : index === 2 ? 'variant-quick' : '';
      const headline = index === 1 ? '今天，OneTone 帮你保持在工作流里。' : index === 2 ? '准备好，开始工作。' : 'OneTone 已准备好。';
      const lead = index === 1 ? '你的输入、项目和跨通道动作会在这里留下清晰的痕迹。需要时，继续上一次工作。' : index === 2 ? '语音、按键、虚拟键盘和 Agent 都在当前工作环境中。' : '当前环境可以接收输入，也能把它交给你正在使用的应用。';
      return `<div class="${cls}">${navHtml()}<main>
        <header class="topline"><div><p class="eyebrow">OneTone · 工作台</p><h1>${headline}</h1><p class="lead">${lead}</p></div><div class="top-actions"><button class="quiet-btn" data-action="搜索功能">⌕ 搜索</button><button class="primary" id="listenBtn" aria-pressed="false">开始倾听</button></div></header>
        <div class="workspace">
          <div class="section">
            <div class="section-head"><h2>当前状态</h2><a data-action="查看完整状态">查看完整状态</a></div>
            <div class="status-panel"><div class="status-mark">✓</div><div><h3>可以开始工作</h3><p>麦克风、按键和当前工作环境都已连接。</p></div><div class="status-value">运行正常</div></div>
            <div class="channels">
              <button class="channel" data-action="打开语音设置"><div class="channel-top"><span class="channel-name">语音</span><i class="signal"></i></div><small>可识别 · Ctrl+Shift+D</small></button>
              <button class="channel" data-action="打开按键设置"><div class="channel-top"><span class="channel-name">按键</span><i class="signal amber"></i></div><small>1 个冲突待处理</small></button>
              <button class="channel" data-action="打开虚拟键盘"><div class="channel-top"><span class="channel-name">虚拟键盘</span><i class="signal"></i></div><small>已连接</small></button>
              <button class="channel" data-action="打开 Agent"><div class="channel-top"><span class="channel-name">Agent</span><i class="signal"></i></div><small>Cursor · voice-pilot</small></button>
            </div>

            <div class="section-head" style="margin-top:30px"><h2>最近活动</h2><a data-action="查看全部活动">查看全部</a></div>
            <div class="activity">${eventHtml()}</div>
          </div>
          <aside class="side-stack">
            <div class="section"><div class="section-head"><h2>继续工作</h2><a data-action="打开 Agent 记录">查看记录</a></div>
              <div class="resume"><p class="kicker">最近的工作</p><h3>voice-pilot · 首页架构</h3><p>上次停在 Agent 工作记录首页的边界确认。你可以从这里继续。</p><div class="resume-meta"><span>今天 14:32 · Cursor</span><button data-action="继续这项工作">继续 →</button></div></div>
            </div>
            <div class="section"><div class="section-head"><h2>需要处理</h2><a data-action="查看所有提醒">查看全部</a></div>
              <div class="notice"><div><strong>快捷键存在冲突</strong><p>开始倾听的快捷键可能被其他应用占用。</p></div><button data-action="处理快捷键冲突">处理</button></div>
            </div>
            <div class="quick"><div class="section-head"><h2>快速操作</h2></div><div class="quick-list">
              <button data-action="开始新的 Agent 工作"><span>开始新的 Agent 工作</span><em>↗</em></button>
              <button data-action="查看完整数据"><span>查看完整数据与记录</span><em>↗</em></button>
              <button data-action="打开设置"><span>打开 OneTone 设置</span><em>⌘,</em></button>
            </div></div>
          </aside>
        </div>
      </main></div>`;
    }

    const windowEl = document.getElementById('window');
    const toast = document.getElementById('toast');
    const picker = document.querySelector('.proto-picker');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const highlight = picker.querySelector('.proto-picker-highlight');
    let current = 0;
    let toastTimer;

    function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1900); }
    function mount(index) {
      windowEl.innerHTML = renderVariant(index);
      windowEl.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => showToast(`${button.dataset.action}：原型交互已触发`)));
      windowEl.querySelectorAll('[data-nav]').forEach(button => button.addEventListener('click', () => {
        windowEl.querySelectorAll('[data-nav]').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        if (button.dataset.nav !== 'home') showToast(`打开${button.textContent.trim()}：保留在全局导航内`);
      }));
      const listen = windowEl.querySelector('#listenBtn');
      listen.addEventListener('click', () => {
        const active = listen.getAttribute('aria-pressed') === 'true';
        listen.setAttribute('aria-pressed', String(!active));
        listen.textContent = active ? '开始倾听' : '倾听中 · 结束';
        let dock = document.querySelector('.live-dock');
        if (!dock) { dock = document.createElement('div'); dock.className = 'live-dock'; document.body.appendChild(dock); }
        dock.innerHTML = `<div class="live-head"><span class="live-label"><i class="live-pulse"></i>正在倾听 · Cursor</span><button class="icon-btn" data-close-live>×</button></div><div class="live-copy">我想把软件首页做成真正的工作台……<br><span>实时识别中 · 本次文字将在结束后进入活动记录</span></div><div class="live-actions"><button data-live="pause">暂停</button><button data-live="finish">结束并查看</button><button data-live="cancel">取消</button></div><p class="live-hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>`;
        dock.classList.toggle('show', !active);
        dock.querySelectorAll('[data-live], [data-close-live]').forEach(item => item.addEventListener('click', () => { dock.classList.remove('show'); listen.setAttribute('aria-pressed', 'false'); listen.textContent = '开始倾听'; showToast(`${item.dataset.live === 'finish' ? '已生成一条活动记录' : '已结束倾听'}`); }));
      });
    }
    function setActive(index) { if (index < 0 || index >= items.length) return; current = index; items.forEach((item, i) => { item.toggleAttribute('data-active', i === index); if (i === index) item.setAttribute('aria-current', 'true'); else item.removeAttribute('aria-current'); }); moveHighlight(); const url = new URL(location); url.searchParams.set('v', index + 1); history.replaceState(null, '', url); mount(index); }
    items.forEach((item, i) => item.addEventListener('click', () => setActive(i)));
    picker.querySelector('.proto-picker-replay').addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', e => { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return; const n = parseInt(e.key, 10); if (n >= 1 && n <= items.length) setActive(n - 1); else if (e.key === 'ArrowRight') setActive((current + 1) % items.length); else if (e.key === 'ArrowLeft') setActive((current - 1 + items.length) % items.length); else if (e.key === 'r' || e.key === 'R') mount(current); });
    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
