<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 时间可信度原型</title>
  <style>
    :root{--bg:#e9ece9;--paper:#fbfaf7;--panel:#fffefa;--soft:#f1f3f0;--ink:#1b2a3e;--muted:#718094;--faint:#a6afb9;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--blue:#5b789f;--blue-soft:#edf2f8;--amber:#a36525;--amber-soft:#fff0dc;--gray:#8b949d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:310px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .history{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.history-head{padding:24px 20px 15px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:23px;color:var(--teal);font-size:14px;font-weight:850}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.history-title{display:flex;justify-content:space-between;align-items:center}.history-title h1{margin:0;font-size:19px}.history-title button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.precision-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.legend{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:9px}.legend i{width:6px;height:6px;border-radius:50%}.legend .exact{background:var(--teal)}.legend .source{background:var(--blue)}.legend .rough{background:var(--amber)}.legend .unknown{background:#b7bdc2}.session-list{min-height:0;overflow:auto;padding:0 10px 15px}.group{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.session{display:block;width:100%;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.session:hover{background:#fff}.session.active{border-color:var(--teal-line);background:#fffefa}.session-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.session-title{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.session-time{color:var(--faint);font-size:10px}.session-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.precision-dot{width:6px;height:6px;border-radius:50%}.precision-dot.exact{background:var(--teal)}.precision-dot.source{background:var(--blue)}.precision-dot.rough{background:var(--amber)}.precision-dot.unknown{background:#b7bdc2}.session-precision{margin-left:auto;color:var(--faint);font-size:9px}.history-foot{margin-top:auto;padding:13px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.history-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 40px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:960px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:12px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-size:10px;font-weight:800}.top-actions button{border:0;background:transparent;color:var(--muted);font-size:10px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:36px 0 20px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.intro h2{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-.05em}.intro p{max-width:630px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.sync{padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}.sync:hover{background:var(--teal-soft)}
    .session-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.session-bar-main{display:flex;align-items:center;gap:9px;min-width:0}.session-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal);font-size:11px;font-weight:900}.session-bar strong{font-size:11px}.session-bar small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.session-bar-side{color:var(--muted);font-size:9px;white-space:nowrap}
    .timeline{min-height:0;flex:1;overflow:auto;margin-top:13px;padding-right:5px}.event{display:grid;grid-template-columns:95px 13px minmax(0,1fr);gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}.event-time{padding-top:3px;color:var(--muted);font-size:11px;line-height:1.45}.event-time strong{display:block;color:var(--ink);font-size:12px}.time-kind{display:block;margin-top:5px;color:var(--faint);font-size:9px}.line{position:relative;display:flex;justify-content:center}.line:before{content:"";position:absolute;top:10px;bottom:-28px;width:1px;background:#d4e4e0}.event:last-child .line:before{display:none}.event-dot{position:relative;z-index:1;width:9px;height:9px;margin-top:3px;border:2px solid var(--paper);border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px #a6d2cd}.event-dot.source{background:var(--blue);box-shadow:0 0 0 1px #b9c9dc}.event-dot.rough{background:var(--amber);box-shadow:0 0 0 1px #e3c08f}.event-dot.unknown{background:#aeb6bd;box-shadow:0 0 0 1px #d1d5d7}.event-content strong{display:block;margin-bottom:6px;font-size:13px}.event-content p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.event-content .quote{color:var(--ink);font-size:14px}.proof-row{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:9px}.proof-row i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.proof-row .rough{background:var(--amber)}.proof-row button{padding:0;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}.event-card{margin-top:10px;padding:11px 12px;border:1px solid #d6e2ee;border-radius:9px;background:var(--blue-soft)}.event-card-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;color:#587399;font-size:10px;font-weight:850}.event-card-head .pending{color:var(--amber)}.event-card p{color:#5e6d84}.event-card button{margin-top:8px;padding:0;border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}
    .bottom{display:grid;gap:9px;margin-top:11px}.action-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 12px;border:1px solid var(--teal-line);border-radius:9px;background:#f3faf7}.action-copy{color:var(--muted);font-size:10px}.action-copy strong{display:block;margin-bottom:2px;color:var(--ink);font-size:11px}.actions{display:flex;gap:7px}.actions button{padding:8px 10px;border-radius:7px;font-size:10px}.sub{border:1px solid var(--teal-line);background:#fff;color:var(--teal)}.main{border:0;background:var(--teal);color:#fff;font-weight:800}.trace{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:9px}.trace span{display:inline-flex;align-items:center;gap:5px}.trace i{width:5px;height:5px;border-radius:50%;background:var(--teal)}.trace i.rough{background:var(--amber)}.trace b{color:var(--ink)}.trace .arrow{color:var(--faint)}.trace button{margin-left:auto;border:0;background:transparent;color:var(--teal);font-size:9px;font-weight:800}
    .drawer{position:fixed;right:24px;top:24px;z-index:20;width:min(380px,calc(100vw - 48px));padding:17px;border:1px solid var(--line);border-radius:12px;background:#fffefa;box-shadow:0 14px 40px rgba(30,45,50,.17);transform:translateX(18px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.drawer.show{transform:translateX(0);opacity:1;pointer-events:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-head strong{font-size:13px}.drawer-close{border:0;background:transparent;color:var(--muted);font-size:18px}.basis{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}.basis-dot{width:6px;height:6px;margin-top:5px;border-radius:50%;background:var(--teal)}.basis-dot.rough{background:var(--amber)}.basis strong{display:block;margin-bottom:3px;font-size:11px}.basis p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.basis small{display:block;margin-top:5px;color:var(--faint);font-size:9px}.drawer-note{margin-top:11px;padding:9px 10px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:9px;line-height:1.45}
    .live{position:fixed;left:50%;bottom:24px;z-index:30;width:min(620px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 14px 38px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live.show{transform:translate(-50%,0);opacity:1}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:7px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.live-close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:10px;font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:10px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:31;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1000px){main{padding:21px 25px}.window{grid-template-columns:270px minmax(0,1fr)}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.intro{display:block;margin-top:27px}.sync{margin-top:15px}.top-actions{display:none}.event{grid-template-columns:58px minmax(0,1fr)}.action-bar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.trace{align-items:flex-start;flex-wrap:wrap}.trace button{margin-left:0}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const sessions=[
      {group:'正在进行',title:'首页 · AI 工作现场',time:'现在',precision:'exact',meta:'Cursor · voice-pilot',source:'OneTone 实时',intent:'把首页做成 AI 辅助工作现场',reply:'尚未收到新的 Cursor 回执。',status:'等待回执'},
      {group:'今天',title:'重新规划首页',time:'14:32',precision:'source',meta:'Cursor · voice-pilot',source:'Cursor 历史',intent:'不要展示通道，要让四个通道共同工作',reply:'从 Cursor 历史数据库导入，具体消息时间未确认。',status:'约略'},
      {group:'今天',title:'整理首页架构',time:'13:58',precision:'source',meta:'Cursor · voice-pilot',source:'Cursor 历史',intent:'把历史记录放进 Agent 工作首页',reply:'已导入会话索引，未获得 OneTone 实时发送回执。',status:'约略'},
      {group:'昨天',title:'Soft Pad · Cursor 动作',time:'昨天',precision:'exact',meta:'Cursor · 6 条动作',source:'OneTone 事件',intent:'给常用 Agent 操作提供手边入口',reply:'OneTone 记录了 6 条动作和精确发生时间。',status:'已确认'},
      {group:'更早',title:'第一次使用 OneTone',time:'周一',precision:'unknown',meta:'OneTone · 入门会话',source:'部分记录',intent:'试一次语音输入',reply:'只找到会话索引，事件时间没有保留。',status:'未知'}
    ];
    let selected=0,synced=false;
    const precisionLabel={exact:'精确',source:'来源时间',rough:'约略',unknown:'未知'};
    function history(){let last='';return `<aside class="history"><div class="history-head"><div class="brand"><span class="mark">O</span>OneTone</div><div class="history-title"><h1>会话轨迹</h1><button data-action="新建会话">＋ 新会话</button></div><div class="search">⌕　搜索会话、项目或内容</div><div class="precision-legend"><span class="legend"><i class="exact"></i>精确</span><span class="legend"><i class="source"></i>来源时间</span><span class="legend"><i class="rough"></i>约略</span><span class="legend"><i class="unknown"></i>未知</span></div></div><div class="session-list">${sessions.map((s,i)=>{const group=s.group!==last;last=s.group;return `${group?`<div class="group">${s.group}</div>`:''}<button class="session ${i===selected?'active':''}" data-session="${i}"><div class="session-top"><span class="session-title">${s.title}</span><span class="session-time">${s.time}</span></div><div class="session-meta"><i class="precision-dot ${s.precision}"></i>${s.meta}<span class="session-precision">${precisionLabel[s.precision]}</span></div></button>`}).join('')}</div><div class="history-foot"><strong>时间不会被伪装成精确</strong><br>OneTone 事件使用捕获时间；Cursor 历史显示来源时间。</div></aside>`}
    function event(s){const imported=s.precision==='source'||s.precision==='unknown';return `<div class="event"><div class="event-time"><strong>${s.time}</strong><span class="time-kind">${precisionLabel[s.precision]}</span></div><div class="line"><i class="event-dot ${s.precision}"></i></div><div class="event-content"><strong>${imported?'Cursor 会话索引':'OneTone 实时事件'}</strong><p class="quote">“${s.intent}”</p><div class="proof-row"><i class="${s.precision==='rough'||s.precision==='unknown'?'rough':''}"></i>来源：${s.source} · 时间：${s.precision==='exact'?'OneTone 捕获时间':'Cursor 数据库记录'} <button data-evidence>查看判断依据</button></div></div></div><div class="event"><div class="event-time"><strong>现在</strong><span class="time-kind">当前状态</span></div><div class="line"><i class="event-dot ${synced?'exact':'rough'}"></i></div><div class="event-content"><strong>Cursor 回执</strong><p>${synced?'已收到本次动作的实时回执，轨迹可以继续。':s.reply}</p><div class="event-card"><div class="event-card-head"><span>回执状态</span><span class="${synced?'':'pending'}">${synced?'已确认':'待确认'}</span></div><p>${synced?'Cursor 已返回结果，下面的继续发送动作已经开放。':'只有会话索引，没有新的实时回执；不会标记为已完成。'}</p><button data-action="打开 Cursor 会话">打开 Cursor 会话 →</button></div></div></div>`}
    function main(){const s=sessions[selected];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>当前工作现场</strong><small>Cursor · voice-pilot · 首页</small></div></div><div class="top-actions"><span class="state">${synced?'回执已确认':'时间链部分确认'}</span><span>本地记录</span><button data-action="打开系统抽屉">系统</button></div></header><section class="intro"><div><p class="eyebrow">会话轨迹 · ${s.time}</p><h2>${s.title}</h2><p>这条时间线只显示有来源的事件，并明确区分精确时间、来源时间和未知时间。</p></div><button class="sync" data-sync>重新读取 Cursor 历史</button></section><div class="session-bar"><div class="session-bar-main"><span class="session-mark">↗</span><div><strong>${s.meta}</strong><small>${s.source} · 会话 ID：local-${selected+1} · ${precisionLabel[s.precision]}</small></div></div><span class="session-bar-side">OneTone 实时事件 + Cursor 历史导入</span></div><div class="timeline">${event(s)}</div><div class="bottom"><div class="action-bar"><div class="action-copy"><strong>${synced?'当前可以继续':'当前没有可确认的完成结果'}</strong>${synced?'Cursor 回执已到达，继续动作现在有依据。':'可查看来源或打开 Cursor；不要把历史导入当作实时完成。'}</div><div class="actions"><button class="sub" data-evidence>查看依据</button><button class="sub" data-action="打开 Cursor 会话">打开 Cursor</button>${synced?'<button class="main" data-action="继续发送">继续发送</button>':'<button class="main" data-sync>等待回执</button>'}</div></div><div class="trace"><span><i></i>OneTone 捕获</span><span class="arrow">→</span><span><i></i>来源已标记</span><span class="arrow">→</span><span><i class="${synced?'':'rough'}"></i>${synced?'回执已确认':'回执待确认'}</span><button data-evidence>展开判断依据</button></div></div></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=history()+main();win.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.session);synced=false;mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：原型交互已触发`)));win.querySelectorAll('[data-sync]').forEach(b=>b.addEventListener('click',()=>{synced=true;mount();notice('已模拟收到 Cursor 回执：时间链现在可以继续')}));win.querySelectorAll('[data-evidence]').forEach(b=>b.addEventListener('click',openDrawer))}function openDrawer(){let d=document.querySelector('.drawer');if(!d){d=document.createElement('aside');d.className='drawer';d.innerHTML='<div class="drawer-head"><strong>时间与来源依据</strong><button class="drawer-close">×</button></div><div class="basis"><i class="basis-dot"></i><div><strong>OneTone 捕获</strong><p>麦克风、按键和 Soft Pad 事件使用本机捕获时间。</p><small>可信度：精确 · source=onetone</small></div></div><div class="basis"><i class="basis-dot"></i><div><strong>当前环境</strong><p>Cursor · voice-pilot · 首页来自当前前台环境快照。</p><small>可信度：已确认 · source=context</small></div></div><div class="basis"><i class="basis-dot rough"></i><div><strong>Cursor 历史</strong><p>从本地历史数据库导入会话索引；不推断每条消息的精确发生时间。</p><small>可信度：来源时间 / 约略 · source=cursor-db</small></div></div><div class="drawer-note">没有回执的动作不会显示为已完成。读取失败、字段缺失或时间不明确时，页面保留不确定性。</div>';document.body.appendChild(d);d.querySelector('.drawer-close').addEventListener('click',()=>d.classList.remove('show'))}d.classList.add('show')}
    mount();
  </script>
</body>
</html>
