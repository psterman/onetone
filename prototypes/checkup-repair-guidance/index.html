<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OneTone · 修复引导三版原型</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f4;--surface:#fff;--ink:#17221e;--muted:#626f69;--line:#d9dfdc;--green:#16836a;--green-soft:#e8f2ee;--amber:#ad710f;--amber-soft:#fff7e7;--red:#b94f43;--red-soft:#fff0ed;--blue:#537f9e;--shadow:0 18px 55px rgba(20,24,22,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit}.shell{min-height:100dvh}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:#fbfcfb}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #9fbdb3;border-radius:11px;color:#08765d;font-weight:700}.brand b{font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.top-meta{font-size:10px;color:var(--muted)}#stage{min-height:calc(100dvh - 64px)}.view{max-width:1120px;margin:auto;padding:44px 28px 110px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:.13em;color:var(--red);font-weight:700}.intro h1{margin:7px 0 0;font-size:30px;letter-spacing:-1.2px}.intro p{margin:0;max-width:390px;color:var(--muted);font-size:11px;line-height:1.65}.panel{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}.button{height:38px;padding:0 16px;border:1px solid #cbd6d1;border-radius:9px;background:#fff;font-size:11px;cursor:pointer}.button.primary{border-color:var(--green);background:var(--green);color:#fff}.button.danger{border-color:var(--red);background:var(--red);color:#fff}.button.quiet{border-color:transparent;background:transparent;color:var(--muted)}.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--red-soft);color:var(--red);font-size:9px;font-weight:650}.tag.amber{background:var(--amber-soft);color:var(--amber)}.tag.green{background:var(--green-soft);color:var(--green)}
    .guide{display:grid;grid-template-columns:1fr 330px;gap:16px}.guide-main{padding:26px 28px}.step-count{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}.progress{height:4px;margin-top:10px;background:#edf0ed;border-radius:5px;overflow:hidden}.progress i{display:block;width:33%;height:100%;background:var(--green);border-radius:inherit}.problem{padding:30px 0 24px}.problem h2{margin:12px 0 10px;font-size:25px;letter-spacing:-.7px}.problem p{margin:0;max-width:570px;color:var(--muted);font-size:12px;line-height:1.75}.impact{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:0 0 25px}.impact div{padding:13px;border-radius:11px;background:#f6f8f6}.impact strong{display:block;font-size:11px}.impact span{display:block;margin-top:4px;color:var(--muted);font-size:9px}.guide-actions{display:flex;gap:8px}.guide-side{padding:21px}.guide-side h3{font-size:13px;margin:0 0 16px}.fact{padding:12px 0;border-top:1px solid #edf0ee}.fact:first-of-type{border-top:0}.fact small{display:block;color:var(--muted);font-size:9px}.fact strong{display:block;margin-top:4px;font-size:11px}.proof{margin-top:18px;padding:13px;border-radius:11px;background:var(--green-soft);color:#2e6554;font-size:10px;line-height:1.6}
    .chain-card{padding:26px}.chain{display:grid;grid-template-columns:repeat(6,1fr);align-items:start;margin:30px 0}.node{position:relative;text-align:center}.node:not(:last-child):after{content:"";position:absolute;top:18px;left:58%;width:84%;height:1px;background:#cfd8d3}.node.fail:not(:last-child):after{background:linear-gradient(90deg,var(--red),#cfd8d3)}.node i{position:relative;z-index:1;display:grid;place-items:center;width:37px;height:37px;margin:auto;border-radius:50%;background:var(--green-soft);border:1px solid #9fcbbb;color:var(--green);font-style:normal;font-size:12px}.node.fail i{background:var(--red-soft);border-color:#e1a69f;color:var(--red)}.node.wait i{background:#f4f5f3;border-color:#d8ddda;color:#98a19d}.node b{display:block;margin-top:9px;font-size:10px}.node span{font-size:8px;color:var(--muted)}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:13px}.explain,.repair{padding:19px;border-radius:13px;background:#f7f8f6}.explain h3,.repair h3{margin:0 0 9px;font-size:13px}.explain p,.repair p{margin:0;color:var(--muted);font-size:10px;line-height:1.7}.repair{background:var(--red-soft)}.repair .button{margin-top:15px}.evidence{display:flex;align-items:center;gap:8px;margin-top:18px;color:var(--muted);font-size:9px}.evidence i{width:7px;height:7px;border-radius:50%;background:var(--red)}
    .triage{display:grid;grid-template-columns:1.2fr .9fr .9fr;gap:13px}.column{padding:19px;min-height:440px}.column-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #edf0ee}.column-head h2{margin:0;font-size:13px}.column-head span{font-size:10px;color:var(--muted)}.issue{margin-top:12px;padding:15px;border:1px solid #e6eae7;border-radius:12px;background:#fbfcfb}.issue.critical{border-color:#edc4be;background:#fffafa}.issue h3{margin:9px 0 6px;font-size:12px}.issue p{margin:0;color:var(--muted);font-size:9px;line-height:1.6}.issue-meta{display:flex;gap:11px;margin:12px 0;color:var(--muted);font-size:8px}.issue .button{width:100%}.empty{display:grid;place-items:center;height:160px;color:#9aa39e;font-size:10px;text-align:center}.capability{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0ee}.capability:last-child{border-bottom:0}.cap-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:8px;background:var(--amber-soft);color:var(--amber);font-size:10px;font-weight:700}.capability strong{display:block;font-size:10px}.capability span{font-size:8px;color:var(--muted)}
    .toast{position:fixed;right:22px;bottom:22px;padding:11px 14px;border-radius:9px;background:#17221e;color:#fff;font-size:10px;opacity:0;transform:translateY(10px);transition:opacity 180ms ease-out,transform 180ms ease-out;z-index:20}.toast.show{opacity:1;transform:none}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}
    @media(max-width:800px){.top{padding:0 18px}.top-meta{display:none}.view{padding:30px 17px 100px}.intro{display:block}.intro p{margin-top:10px}.guide{grid-template-columns:1fr}.impact,.breakdown,.triage{grid-template-columns:1fr}.chain{grid-template-columns:repeat(3,1fr);row-gap:24px}.node:nth-child(3):after{display:none}.column{min-height:0}.proto-picker{max-width:calc(100vw - 20px)}.proto-picker-item{padding:0 9px;font-size:11px}}
    @media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight,.toast{transition:none}}
  </style>
</head>
<body>
  <div class="shell"><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone 启动体检</b><small>找到问题，也带你完成修复</small></div></div><div class="top-meta">上次检测：刚刚 · 检测记录</div></header><main id="stage"></main></div>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">单步带路</button>
    <button class="proto-picker-item">链路断点</button>
    <button class="proto-picker-item">分层清单</button>
  </nav>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    const intro=(title,desc)=>`<div class="intro"><div><div class="eyebrow">STARTING LINE CHECK</div><h1>${title}</h1></div><p>${desc}</p></div>`;
    const variants=[
      ()=>`<section class="view">${intro('先解决唯一的阻塞问题','适合首次使用。OneTone 不展示完整故障清单，只带用户完成当前最关键的一步。')}<div class="guide"><article class="panel guide-main"><div class="step-count"><span>起跑线修复 · 第 1 / 3 步</span><span>约 20 秒</span></div><div class="progress"><i></i></div><div class="problem"><span class="tag">必须修复</span><h2>确认 Codex 的输入框</h2><p>OneTone 已经能听懂你的指令，但还不知道文字应该安全写入哪里。完成一次定位后，语音、按键和 Soft Pad 都可以复用这个结果。</p></div><div class="impact"><div><strong>现在能做</strong><span>识别语音与快捷操作</span></div><div><strong>暂时不能</strong><span>向 Codex 安全写入文字</span></div><div><strong>完成以后</strong><span>自动对焦并继续输入</span></div></div><div class="guide-actions"><button class="button danger" data-demo="guide">带我完成</button><button class="button quiet" data-demo="later">稍后处理</button></div></article><aside class="panel guide-side"><h3>修复前你应该知道</h3><div class="fact"><small>OneTone 将会</small><strong>提示你点击一次 Codex 输入区域</strong></div><div class="fact"><small>不会执行</small><strong>不会发送消息或修改项目</strong></div><div class="fact"><small>验证方式</small><strong>写入测试文字，再自动撤销</strong></div><div class="proof">修复后会保存验证证据：应用、时间、成功步骤与恢复方式。</div></aside></div></section>`,
      ()=>`<section class="view">${intro('问题发生在“定位”环节','适合希望理解系统的人。完整链路保持可见，断点和后续影响一眼可见。')}<article class="panel chain-card"><span class="tag">1 个阻塞问题</span><div class="chain"><div class="node"><i>✓</i><b>触发</b><span>语音稳定</span></div><div class="node"><i>✓</i><b>理解</b><span>意图已匹配</span></div><div class="node fail"><i>!</i><b>定位</b><span>输入框未知</span></div><div class="node wait"><i>·</i><b>执行</b><span>等待定位</span></div><div class="node wait"><i>·</i><b>反馈</b><span>尚未验证</span></div><div class="node wait"><i>·</i><b>恢复</b><span>尚未验证</span></div></div><div class="breakdown"><section class="explain"><h3>发生了什么</h3><p>口令“发送”已经被正确识别。为了避免把文字写进错误窗口，OneTone 在找不到可信输入区域时主动停止。</p><div class="evidence"><i></i>安全保护正常工作 · 没有写入任何内容</div></section><section class="repair"><h3>恢复这条链路</h3><p>打开 Codex 并点击一次输入区域。OneTone 会完成测试写入、撤销和反馈验证。</p><button class="button danger" data-demo="repair">修复定位环节</button></section></div></article></section>`,
      ()=>`<section class="view">${intro('1 项必须修复，3 项可以增强','适合熟悉 OneTone 的用户。问题按影响分层，可批量浏览但不会混淆优先级。')}<div class="triage"><section class="panel column"><div class="column-head"><h2>必须修复</h2><span>1 项</span></div><article class="issue critical"><span class="tag">阻止安全写入</span><h3>Codex 输入框尚未确认</h3><p>语音可以识别，但当前无法安全写入目标应用。</p><div class="issue-meta"><span>约 20 秒</span><span>不会修改项目</span></div><button class="button danger" data-demo="fix">带我完成</button></article></section><section class="panel column"><div class="column-head"><h2>建议增强</h2><span>1 项</span></div><article class="issue"><span class="tag amber">不影响当前使用</span><h3>GitHub 尚未建立恢复点</h3><p>连接后可以记录环境变化，并在设置异常时恢复。</p><div class="issue-meta"><span>约 1 分钟</span><span>需要确认仓库</span></div><button class="button" data-demo="connect">了解增强收益</button></article></section><section class="panel column"><div class="column-head"><h2>可选能力</h2><span>2 项</span></div><div class="capability"><span class="cap-icon">Cam</span><div><strong>摄像头手势</strong><span>摇头取消、离席暂停</span></div></div><div class="capability"><span class="cap-icon">Py</span><div><strong>Python 环境</strong><span>仅在 Skill 需要时安装</span></div></div><div class="empty">这些能力不会影响<br>当前起跑标准</div></section></div></section>`
    ];
    const stage=document.getElementById('stage');const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bindDemo()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
    document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
    let toastTimer;function bindDemo(){stage.querySelectorAll('[data-demo]').forEach(button=>button.addEventListener('click',()=>{const messages={guide:'已进入带路模式：请切换到 Codex',later:'已保留问题，下次启动时继续提醒',repair:'正在打开输入框定位测试',fix:'已进入带路模式：不会自动发送内容',connect:'GitHub 可提供版本记录与设置恢复点'};const toast=document.querySelector('.toast');toast.textContent=messages[button.dataset.demo];toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1900)}))}
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
