<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F · 统一卡板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="cards.css" />
  <style>
    .filters {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .filter {
      appearance: none; border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px;
      font-weight: 650; color: var(--muted); cursor: pointer;
    }
    .filter.is-on {
      background: var(--accent); border-color: transparent; color: #fff;
    }
    .board-h {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }
    .board-h h2 { margin: 0; font-size: 13px; font-weight: 700; }
    .board-h span { font-size: 11px; color: var(--faint); }
  </style>
</head>
<body>
  <p class="back"><a href="index.html">← 卡片原型</a> · F · 一张板子 · 全局拖拽排序 · 标签分类</p>
  <div class="app">
    <nav class="rail">
      <div class="sec">意图</div>
      <button type="button">听写方式<span>IME</span></button>
      <button type="button">一词注入<span>写模板</span></button>
      <button type="button" class="is-on">口头命令<span>可喊</span></button>
      <button type="button">屏幕按钮<span>Pad</span></button>
    </nav>
    <main class="main">
      <header class="head">
        <div>
          <h1>口头命令</h1>
          <p>全部可喊命令在一块板上 · 拖动改顺序 · 标签区分来源</p>
        </div>
        <div class="head-acts">
          <span class="pill">Cursor</span>
          <button type="button" class="btn primary" id="openAdd">+ 添加</button>
        </div>
      </header>

      <div class="arm">
        <span class="chip ok">收听 · Soft Pad 麦键</span>
        <span class="chip muted">触发键 · 未录</span>
      </div>

      <div class="board-h">
        <h2>可喊列表 <span id="count"></span></h2>
        <div class="filters" id="filters">
          <button type="button" class="filter is-on" data-f="all">全部</button>
          <button type="button" class="filter" data-f="core">核心</button>
          <button type="button" class="filter" data-f="soft">Soft</button>
          <button type="button" class="filter" data-f="prompt">注入</button>
          <button type="button" class="filter" data-f="bind">绑定</button>
        </div>
      </div>

      <div class="cards" id="board"></div>
      <p class="hint" style="margin:0;font-size:12px;color:var(--faint)">筛选只影响显示；排序在「全部」下拖最清楚。顺序可表示优先级（冲突时先匹配靠前的）。</p>
    </main>
  </div>

  <div class="overlay" id="addOverlay" hidden>
    <div class="modal">
      <div class="modal-h">
        <strong>添加命令</strong>
        <button type="button" class="btn tiny" data-close>关闭</button>
      </div>
      <div class="modal-body" id="addBody"></div>
    </div>
  </div>

  <script src="cards-data.js"></script>
  <script>
    (function () {
      var D = window.ORAL_CARDS;
      var filter = 'all';
      var board = document.getElementById('board');

      function render() {
        var rows = D.items.filter(function (x) {
          return filter === 'all' || x.cat === filter;
        });
        document.getElementById('count').textContent = '· ' + rows.length;
        board.innerHTML = rows.map(function (item) {
          return D.cardHtml(item, { canRemove: item.cat !== 'core', drag: filter === 'all' });
        }).join('');
        if (filter === 'all') D.enableDrag(board, 'global');
      }

      D.onChange = render;
      D.wireKeys(board);
      board.addEventListener('click', function (e) {
        var rm = e.target.closest('[data-remove]');
        if (!rm) return;
        D.remove(rm.getAttribute('data-remove'));
        render();
      });
      document.getElementById('filters').addEventListener('click', function (e) {
        var b = e.target.closest('[data-f]');
        if (!b) return;
        filter = b.getAttribute('data-f');
        document.querySelectorAll('.filter').forEach(function (el) {
          el.classList.toggle('is-on', el === b);
        });
        render();
      });

      document.getElementById('openAdd').onclick = function () {
        var body = document.getElementById('addBody');
        body.innerHTML = D.pool.length
          ? D.pool.map(function (p) {
              return '<button type="button" class="add-opt" data-add="' + p.id + '"><div><strong>' +
                p.name + '</strong><small>' + p.desc + '</small></div></button>';
            }).join('')
          : '<p style="text-align:center;color:var(--muted)">没有更多</p>';
        document.getElementById('addOverlay').hidden = false;
      };
      document.getElementById('addBody').addEventListener('click', function (e) {
        var b = e.target.closest('[data-add]');
        if (!b) return;
        D.addFromPool(b.getAttribute('data-add'));
        document.getElementById('addOverlay').hidden = true;
        render();
      });
      document.querySelector('[data-close]').onclick = function () {
        document.getElementById('addOverlay').hidden = true;
      };
      render();
    })();
  </script>
</body>
</html>
