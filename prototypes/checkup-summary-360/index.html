<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone 启动体检 · 结果汇总</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#17221e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable",sans-serif}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid #dce2df;background:#fbfcfb}.brand{display:flex;align-items:center;gap:11px}.mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid #9fbdb3;border-radius:11px;color:#08765d}.brand b{font-size:14px}.brand small{display:block;color:#7a8580;font-size:10px;margin-top:2px}.top-right{display:flex;gap:18px;align-items:center;color:#73807b;font-size:10px}.view{max-width:1040px;margin:auto;padding:43px 28px 104px;text-align:center}.eyebrow{color:#85908b;font-size:11px}.hero h1{margin:8px 0 9px;font-size:31px;letter-spacing:-1.3px}.hero p{max-width:520px;margin:0 auto;color:#6f7b76;font-size:12px;line-height:1.7}.health-ring{position:relative;display:grid;place-items:center;width:174px;height:174px;margin:28px auto 19px;border:1px solid #78b5a2;border-radius:50%;background:#fff;box-shadow:0 0 0 12px #e5efeb,0 18px 45px #236d5514}.health-ring:before{content:"";position:absolute;inset:12px;border:1px dashed #bed3ca;border-radius:50%}.health-ring strong{display:block;font-size:21px}.health-ring span{display:block;margin-top:6px;color:#25816a;font-size:10px}.health-ring.warn{border-color:#d09a4b;box-shadow:0 0 0 12px #f8ead5,0 18px 45px #8c5c1514}.health-ring.warn:before{border-color:#e8c98d}.health-ring.warn span{color:#a86b12}.health-ring.block{border-color:#cb695b;box-shadow:0 0 0 12px #f7e2df,0 18px 45px #90423814}.health-ring.block:before{border-color:#e6aaa1}.health-ring.block span{color:#a44339}.actions{display:flex;justify-content:center;gap:9px;margin:0 auto 33px}.btn{height:38px;padding:0 18px;border:1px solid #cdd8d3;border-radius:9px;background:#fff;color:#355049;font-size:11px}.btn.primary{border-color:#16836a;background:#16836a;color:#fff;box-shadow:0 5px 14px #16836a2b}.btn.warn{border-color:#ae700d;background:#ae700d;color:#fff}.btn.danger{border-color:#b75245;background:#b75245;color:#fff}.details{display:grid;grid-template-columns:1.45fr .8fr;gap:13px;text-align:left}.panel{padding:17px;border:1px solid #d9dfdc;border-radius:14px;background:#fff}.panel h2{margin:0 0 13px;font-size:13px}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.check{min-height:84px;padding:11px 9px;border-radius:10px;background:#f5f8f6}.check b{display:block;margin-top:10px;font-size:10px}.check small{display:block;margin-top:4px;color:#82908c;font-size:8px}.check i{font-style:normal;font-size:15px;color:#218268}.check.warn{background:#fff8eb}.check.warn i,.check.warn b{color:#a6690d}.check.fail{background:#fff0ee}.check.fail i,.check.fail b{color:#ab493e}.stats{display:grid;gap:10px}.stat{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;border-radius:9px;background:#f5f8f6;color:#71807a;font-size:9px}.stat strong{color:#1d755e;font-size:13px}.stat.warn strong{color:#a6690d}.impact{margin-top:12px;padding:12px;border-left:3px solid #c17d16;background:#fff8eb;color:#866533;font-size:9px;line-height:1.55}.impact b{display:block;color:#98600c;font-size:10px;margin-bottom:4px}.picker{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:999px;background:#17201dda;box-shadow:0 8px 26px #0003;backdrop-filter:blur(10px)}.picker button{height:29px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:#95a09b;font-size:10px}.picker button.active{background:#ffffff20;color:#fff}.toast{position:fixed;right:22px;bottom:22px;padding:10px 13px;border-radius:8px;background:#17221e;color:#fff;font-size:10px;opacity:0;transform:translateY(9px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:760px){.view{padding-left:18px;padding-right:18px}.details{grid-template-columns:1fr}.checks{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><header class="top"><div class="brand"><span class="mark">一</span><div><b>OneTone 启动体检</b><small>检测系统是否已经准备好</small></div></div><div class="top-right"><span>上次检测：刚刚</span><span>检测记录</span></div></header><main id="stage"></main><nav class="picker" aria-label="体检结果状态"><button class="active">全部正常</button><button>可以使用，但有补强项</button><button>存在阻塞问题</button></nav><div class="toast" role="status"></div><script>
const data=[{eyebrow:'体检完成',title:'OneTone 可以正常使用',desc:'语音、按键、Soft Pad 和输入框定位均已准备好。现在就可以开始工作。',ring:'全部通过',sub:'4 项核心检查已通过',action:'立即开始',kind:'ok',checks:[['✓','语音','可完成操作','ok'],['✓','按键','可完成操作','ok'],['✓','Soft Pad','可完成操作','ok'],['✓','摄像头','可选增强','ok']],stats:[['核心通道','4 / 4'],['可用组合','7 种'],['需要处理','0 项']]},{eyebrow:'体检完成',title:'可以使用，但还有 1 项补强',desc:'核心能力已经就绪。摄像头未校准，不影响当前使用，但暂时无法提供视觉辅助。',ring:'可以使用',sub:'3 条通道就绪 · 1 项可补强',action:'补齐摄像头能力',kind:'warn',checks:[['✓','语音','可完成操作','ok'],['✓','按键','可完成操作','ok'],['✓','Soft Pad','可完成操作','ok'],['!','摄像头','未校准','warn']],stats:[['核心通道','3 / 4'],['可用组合','7 种'],['可补强','1 项']]},{eyebrow:'需要处理',title:'还有 1 个问题阻止使用',desc:'输入框定位尚未完成，语音可以识别，但无法安全写入当前应用。',ring:'需要修复',sub:'1 个阻塞问题 · 其余能力正常',action:'立即修复',kind:'block',checks:[['✓','语音','输入稳定','ok'],['✓','按键','响应正常','ok'],['✓','Soft Pad','连接正常','ok'],['!','输入框定位','未校准','fail']],stats:[['核心通道','3 / 4'],['可用组合','0 种'],['必须处理','1 项']]}];
const stage=document.getElementById('stage'),buttons=[...document.querySelectorAll('.picker button')],toast=document.querySelector('.toast');let current=0,t;function mount(i){current=i;const d=data[i];stage.innerHTML=`<section class="view"><div class="hero"><div class="eyebrow">${d.eyebrow}</div><h1>${d.title}</h1><p>${d.desc}</p><div class="health-ring ${d.kind==='ok'?'':d.kind}"><div><strong>${d.ring}</strong><span>${d.sub}</span></div></div><div class="actions"><button class="btn primary ${d.kind==='warn'?'warn':''} ${d.kind==='block'?'danger':''}" data-action="primary">${d.action}</button><button class="btn" data-action="details">查看检测详情</button></div></div><div class="details"><section class="panel"><h2>通道状态</h2><div class="checks">${d.checks.map(c=>`<article class="check ${c[3]}"><i>${c[0]}</i><b>${c[1]}</b><small>${c[2]}</small></article>`).join('')}</div></section><aside class="panel"><h2>汇总结果</h2><div class="stats">${d.stats.map(s=>`<div class="stat ${d.kind==='warn'&&s[0]==='可补强'?'warn':''}"><span>${s[0]}</span><strong>${s[1]}</strong></div>`).join('')}</div>${d.kind!=='ok'?'<div class="impact"><b>现在可以怎么做？</b>'+ (d.kind==='warn'?'校准摄像头后，将新增眨眼唤醒、视线选择和摇头取消。':'先框选当前应用的输入区域，再点击一个具体落点。完成后才能安全写入。')+'</div>':''}</aside></div></section>`;buttons.forEach((b,j)=>b.classList.toggle('active',j===i));stage.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{say(el.dataset.action==='primary'?(d.kind==='ok'?'已准备开始工作':d.kind==='warn'?'打开摄像头校准':'打开输入框定位修复'): '这里会展开所有探针结果')})}function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),1700)}buttons.forEach((b,i)=>b.onclick=()=>mount(i));mount(Math.max(0,Math.min(2,(+(new URLSearchParams(location.search).get('v')||1)-1))));
</script></body></html>
