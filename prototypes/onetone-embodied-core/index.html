<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 中央工作核心</title>
  <style>
    :root{--bg:#e8ebe8;--paper:#f8f7f3;--surface:#fffefa;--ink:#1b2a3e;--muted:#6d7c8e;--faint:#a4adb7;--line:#dedfdb;--teal:#0b8178;--teal-soft:#e2f1ed;--teal-line:#b7d8d1;--amber:#a56726;--amber-soft:#fff0dc;--blue-soft:#edf2f8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.product{width:100%;max-width:1400px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;overflow:hidden;border:1px solid #cfd5d3;border-radius:16px;background:var(--paper);box-shadow:0 16px 46px rgba(40,53,59,.08)}.product>div{width:100%;height:100%;display:grid;grid-template-columns:68px minmax(0,1fr)}
    .rail{display:flex;flex-direction:column;align-items:center;padding:20px 10px;background:#eef0ed;border-right:1px solid var(--line)}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--teal-soft);color:var(--teal);font-weight:900}.rail-tools{display:grid;gap:10px;margin-top:42px}.rail button{display:grid;place-items:center;width:37px;height:37px;border:0;border-radius:10px;background:transparent;color:#8b99a5;font-size:16px}.rail button.active,.rail button:hover{background:#fff;color:var(--teal);box-shadow:0 1px 4px rgba(40,53,59,.08)}.rail-bottom{margin-top:auto;display:grid;gap:8px}
    main{min-width:0;height:100%;padding:24px 32px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:1190px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:42px}.identity{display:flex;align-items:center;gap:10px}.identity-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.identity strong{display:block;font-size:13px}.identity small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.system{border:0;background:transparent;color:var(--muted);font-size:11px}.state{padding:7px 10px;border:1px solid var(--teal-line);border-radius:999px;background:#f0faf7;color:var(--teal);font-weight:800}
    .headline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:28px 0 17px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.headline h1{margin:0;font-size:clamp(25px,3.2vw,42px);line-height:1.08;letter-spacing:-.05em}.headline p{max-width:590px;margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.head-action{padding:10px 14px;border:0;border-radius:8px;background:var(--teal);color:white;font-size:12px;font-weight:800;white-space:nowrap}.head-action:hover{background:#07645f}
    .core{position:relative;display:grid;grid-template-columns:205px minmax(0,1fr) 205px;grid-template-rows:48px minmax(0,1fr) 90px;gap:10px;min-height:0;flex:1;padding:10px;border:1px solid #dfe2df;border-radius:15px;background:#f1f2ee}.edge{min-width:0;border:1px solid var(--line);border-radius:10px;background:rgba(255,254,250,.9)}.camera{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.edge-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.edge-label b{color:var(--ink);font-size:12px}.edge-icon{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:900}.edge-detail{color:var(--muted);font-size:11px}.edge-detail strong{color:var(--ink)}
    .mic{grid-column:1;grid-row:2;padding:16px}.mic .edge-label,.keys .edge-label{margin-bottom:17px}.mic-quote{padding:13px 11px;border-left:2px solid var(--teal);background:#f6fbf8;color:var(--ink);font-size:13px;line-height:1.55}.mic-status{display:flex;align-items:center;gap:7px;margin-top:15px;color:var(--teal);font-size:10px;font-weight:800}.pulse{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.mic-hint{margin-top:18px;color:var(--muted);font-size:10px;line-height:1.55}.keys{grid-column:3;grid-row:2;padding:16px}.key-stack{display:grid;gap:8px}.key{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:10px}.key kbd{padding:3px 5px;border:1px solid #d8dbd8;border-radius:4px;background:#f3f4f1;color:var(--ink);font-size:10px}.key.active{border-color:var(--teal-line);background:#f1faf7;color:var(--teal)}.key.active kbd{border-color:var(--teal-line);color:var(--teal)}.key-note{margin-top:18px;color:var(--muted);font-size:10px;line-height:1.55}
    .agent-core{position:relative;grid-column:2;grid-row:2;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:25px 30px;border:1px solid var(--teal-line);border-radius:13px;background:var(--surface);box-shadow:0 9px 23px rgba(36,76,75,.07)}.agent-core:before,.agent-core:after{content:"";position:absolute;left:-22px;right:-22px;height:1px;background:#c7ddd8;pointer-events:none}.agent-core:before{top:28%}.agent-core:after{bottom:28%}.core-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.core-top span{color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.core-top button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}.agent-core h2{max-width:560px;margin:0 0 10px;font-size:clamp(20px,2.4vw,32px);line-height:1.16;letter-spacing:-.04em}.core-explain{max-width:590px;margin:0;color:var(--muted);font-size:12px;line-height:1.6}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:21px}.route-item{padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fbfcfa}.route-item small{display:block;margin-bottom:5px;color:var(--faint);font-size:9px}.route-item strong{font-size:11px}.core-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.core-actions button{padding:8px 11px;border-radius:7px;font-size:11px}.confirm{border:0;background:var(--teal);color:white;font-weight:800}.edit{border:1px solid #cfdad7;background:white;color:var(--muted)}
    .softpad{grid-column:1/-1;grid-row:3;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px}.pad-title{display:flex;align-items:center;gap:8px;min-width:120px}.pad-title b{font-size:12px}.pad-title small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.pad-keys{display:grid;grid-template-columns:repeat(4,minmax(82px,1fr));gap:7px;flex:1}.pad-key{min-height:53px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--muted);text-align:left}.pad-key:hover,.pad-key.selected{border-color:var(--teal-line);background:#effaf7;color:var(--teal)}.pad-key kbd{display:block;margin-bottom:7px;color:var(--faint);font-size:9px}.pad-key strong{font-size:11px}.trace{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:9px 2px 0;color:var(--muted);font-size:10px}.trace-line{display:flex;align-items:center;gap:8px;min-width:0}.trace-line i{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:0 0 auto}.trace-line b{color:var(--ink);font-weight:750}.trace-arrow{color:var(--faint)}.trace button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}
    .live-dock{position:fixed;left:50%;bottom:24px;z-index:20;width:min(650px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 15px 40px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live-dock.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:11px;color:var(--ink);font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:11px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:21;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    .picker{position:fixed;bottom:24px;left:50%;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24);font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transform:translateX(-50%);user-select:none}.picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.picker[data-ready] .picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.picker button{position:relative;height:28px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);cursor:pointer}.picker button:hover{color:#fff}.picker button.active{color:#fff}.picker .divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.picker .replay{padding:0 10px;font-size:14px}
    .variant-listen .agent-core{border-color:#a8cfca}.variant-listen .mic{background:#fffefa}.variant-control .agent-core{background:#f4fbf8}.variant-trace .trace{padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fffefa}.variant-trace .agent-core{background:#fffefa}
    @media(max-width:1050px){main{padding:20px}.core{grid-template-columns:180px minmax(0,1fr) 180px}.pad-title{min-width:90px}.pad-keys{grid-template-columns:repeat(4,1fr)}}
    @media(max-width:900px){body{min-width:0}.app{padding:0}.product{height:100vh;min-height:660px;border-radius:0}.product>div{grid-template-columns:56px minmax(0,1fr)}.rail{padding:17px 8px}.rail button{width:34px;height:34px}.rail-tools{margin-top:35px}.main{padding:17px}.top-actions{display:none}.headline{display:block}.head-action{margin-top:14px}.core{grid-template-columns:1fr 1fr;grid-template-rows:42px minmax(0,1fr) 100px}.camera{grid-column:1/-1}.mic{grid-column:1;grid-row:2}.keys{grid-column:2;grid-row:2}.agent-core{position:absolute;left:18%;right:18%;top:26%;bottom:24%;z-index:2;padding:17px}.agent-core:before,.agent-core:after{display:none}.softpad{grid-column:1/-1;grid-row:3;display:block}.pad-title{margin-bottom:7px}.pad-keys{grid-template-columns:repeat(4,1fr)}.pad-key{min-height:40px}.pad-key kbd{margin-bottom:3px}.pad-key strong{font-size:10px}.trace{font-size:9px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app"><div class="product" id="product"></div></div>
  <nav class="picker" id="picker" aria-label="中央工作核心四个维度"><span class="picker-highlight" aria-hidden="true"></span><button class="active" aria-current="true">A · 任务核心</button><button>B · 感知链</button><button>C · 物理控制</button><button>D · 工作轨迹</button><span class="divider" aria-hidden="true"></span><button class="replay" aria-label="重新播放">↻</button></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const modes=['看见','听见','按键','Soft Pad'];
    function rail(){return `<aside class="rail"><div class="logo">O</div><div class="rail-tools">${modes.map((m,i)=>`<button class="${i===0?'active':''}" data-rail="${m}" title="${m}">${['◎','⌁','⌘','▦'][i]}</button>`).join('')}</div><div class="rail-bottom"><button data-action="打开系统抽屉">⋯</button><button data-action="查看帮助">?</button></div></aside>`}
    function topBar(){return `<header class="topbar"><div class="identity"><i class="identity-dot"></i><div><strong>OneTone · 当前工作现场</strong><small>Cursor · voice-pilot · 首页</small></div></div><div class="top-actions"><span class="state">环境已确认</span><span>刚刚同步</span><button class="system" data-action="打开系统抽屉">系统</button></div></header>`}
    function camera(){return `<div class="edge camera"><div class="edge-label"><span class="edge-icon">◎</span><span><b>看见</b> · 摄像头当前目标</span></div><div class="edge-detail">前台应用：<strong>Cursor</strong>　项目：<strong>voice-pilot</strong>　目标：<strong>首页</strong></div></div>`}
    function mic(){return `<div class="edge mic"><div class="edge-label"><span class="edge-icon">⌁</span><span><b>听见</b> · 麦克风意图</span></div><div class="mic-quote">“把首页做成 AI 辅助工作现场”</div><div class="mic-status"><i class="pulse"></i>实时识别中</div><p class="mic-hint">文字会直接进入中央工作核心，结束后成为本次工作轨迹。</p></div>`}
    function keys(){return `<div class="edge keys"><div class="edge-label"><span class="edge-icon">⌘</span><span><b>接管</b> · 按键控制</span></div><div class="key-stack"><div class="key active"><span>确认执行</span><kbd>Enter</kbd></div><div class="key"><span>修改理解</span><kbd>Back</kbd></div><div class="key"><span>查看依据</span><kbd>F2</kbd></div><div class="key"><span>取消当前动作</span><kbd>Esc</kbd></div></div><p class="key-note">按键和 Soft Pad 是同一组动作的两种入口。</p></div>`}
    function core(){return `<section class="agent-core"><div class="core-top"><span>中央工作核心 · Agent 理解</span><button data-action="查看判断依据">查看依据</button></div><h2>把首页做成 AI 辅助工作现场</h2><p class="core-explain">我结合当前看见的项目和刚才听到的意图，准备先整理工作现场，再等待你确认是否交给 Cursor Agent 执行。</p><div class="route"><div class="route-item"><small>当前目标</small><strong>首页架构</strong></div><div class="route-item"><small>准备交给</small><strong>Cursor Agent</strong></div><div class="route-item"><small>下一步</small><strong>等待确认</strong></div></div><div class="core-actions"><button class="edit" data-action="修改理解">修改理解</button><button class="confirm" data-action="确认执行">确认执行</button></div></section>`}
    function pad(){return `<div class="edge softpad"><div class="pad-title"><span class="edge-icon">▦</span><div><b>Soft Pad</b><small>当前上下文动作</small></div></div><div class="pad-keys"><button class="pad-key selected" data-action="确认执行"><kbd>↵ Enter</kbd><strong>确认执行</strong></button><button class="pad-key" data-action="修改理解"><kbd>⌫ Back</kbd><strong>修改理解</strong></button><button class="pad-key" data-action="查看判断依据"><kbd>F2</kbd><strong>查看依据</strong></button><button class="pad-key" data-action="取消当前动作"><kbd>Esc</kbd><strong>取消</strong></button></div></div>`}
    function trace(){return `<div class="trace"><div class="trace-line"><i></i><span>看见 <b>Cursor · voice-pilot</b></span><span class="trace-arrow">→</span><span>听见 <b>重新规划首页</b></span><span class="trace-arrow">→</span><span>现在 <b>等待确认</b></span></div><button data-action="展开工作轨迹">展开轨迹</button></div>`}
    function liveButton(){return `<button class="head-action" data-listen>开始倾听</button>`}
    function shell(body,cls){return `<div class="${cls}">${rail()}<main><div class="content">${topBar()}${body}</div></main></div>`}
    function A(){return shell(`<div class="headline"><div><p class="eyebrow">任务核心</p><h1>OneTone 正在和你一起工作。</h1><p>四个通道都围绕同一个任务协作：看见目标、听见意图、理解计划，再由你确认行动。</p></div>${liveButton()}</div><div class="core">${camera()}${mic()}${core()}${keys()}${pad()}</div>${trace()}`,'variant-core')}
    function B(){return shell(`<div class="headline"><div><p class="eyebrow">感知链</p><h1>看见、听见、理解，然后行动。</h1><p>每一步都连接到中央工作核心，你能看到 AI 如何从现场得到结论。</p></div>${liveButton()}</div><div class="core">${camera()}${mic()}<section class="agent-core"><div class="core-top"><span>感知链 · 当前进度</span><button data-action="查看判断依据">查看依据</button></div><div class="route" style="margin-top:0"><div class="route-item"><small>01 · 摄像头</small><strong>已定位项目</strong></div><div class="route-item"><small>02 · 麦克风</small><strong>已识别意图</strong></div><div class="route-item"><small>03 · Agent</small><strong>正在规划</strong></div></div><p class="core-explain" style="margin-top:18px">当前已知道你正在 Cursor 的 voice-pilot 首页中工作，准备将“重新规划首页”交给 Cursor Agent。</p><div class="core-actions"><button class="edit" data-action="修改理解">修改理解</button><button class="confirm" data-action="确认执行">确认执行</button></div></section>${keys()}${pad()}</div>${trace()}`,'variant-pipeline')}
    function C(){return shell(`<div class="headline"><div><p class="eyebrow">物理控制</p><h1>AI 的下一步，就在你手边。</h1><p>用声音表达，用摄像头定位，用按键和 Soft Pad 在关键时刻接管。</p></div>${liveButton()}</div><div class="core">${camera()}${mic()}<section class="agent-core"><div class="core-top"><span>当前动作 · 等待接管</span><button data-action="查看判断依据">查看依据</button></div><h2>确认后，交给 Cursor Agent 执行。</h2><p class="core-explain">当前理解：重新规划 voice-pilot 首页，让摄像头、麦克风、按键和 Soft Pad 协同工作。</p><div class="core-actions"><button class="edit" data-action="修改理解">修改理解</button><button class="confirm" data-action="确认执行">确认执行</button></div></section>${keys()}${pad()}</div>${trace()}`,'variant-control')}
    function D(){return shell(`<div class="headline"><div><p class="eyebrow">工作轨迹</p><h1>每一步，都留在当前工作现场。</h1><p>回来时不需要重新解释：你看见了什么、说了什么、Agent 理解了什么，以及下一步等什么。</p></div>${liveButton()}</div><div class="core">${camera()}${mic()}<section class="agent-core"><div class="core-top"><span>当前轨迹 · 现在</span><button data-action="查看完整轨迹">查看完整轨迹</button></div><div class="route" style="margin-top:0"><div class="route-item"><small>刚才</small><strong>看见 Cursor 项目</strong></div><div class="route-item"><small>随后</small><strong>听见重新规划首页</strong></div><div class="route-item"><small>现在</small><strong>等待你的确认</strong></div></div><p class="core-explain" style="margin-top:18px">这条轨迹会在确认执行后继续向右延伸，成为下一次回来时的工作起点。</p><div class="core-actions"><button class="edit" data-action="修改理解">修改理解</button><button class="confirm" data-action="确认执行">确认执行</button></div></section>${keys()}${pad()}</div>${trace()}`,'variant-trace')}
    const variants=[A,B,C,D],product=document.getElementById('product'),picker=document.getElementById('picker'),items=[...picker.querySelectorAll('button:not(.replay)')],highlight=picker.querySelector('.picker-highlight'),toast=document.getElementById('toast');let current=0,timer;
    function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function move(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}
    function mount(i){product.innerHTML=variants[i]();product.querySelectorAll('[data-rail]').forEach(b=>b.addEventListener('click',()=>{product.querySelectorAll('[data-rail]').forEach(x=>x.classList.remove('active'));b.classList.add('active');notice(`切换${b.dataset.rail}：仍在同一个中央工作核心中`)}));product.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：中央工作核心已响应`)));product.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',listen))}
    function listen(){let dock=document.querySelector('.live-dock');if(!dock){dock=document.createElement('div');dock.className='live-dock';document.body.appendChild(dock)}dock.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · Cursor</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想把首页做成更完整的 AI 工作现场……<br><small>实时识别中 · 摄像头保留当前项目，结束后进入工作轨迹</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：工作核心已更新`)}))}
    function active(i){if(i<0||i>=4)return;current=i;items.forEach((b,j)=>{b.classList.toggle('active',j===i);if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});move();const u=new URL(location);u.searchParams.set('v',String.fromCharCode(65+i));history.replaceState(null,'',u);mount(i)}items.forEach((b,i)=>b.addEventListener('click',()=>active(i)));picker.querySelector('.replay').addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();if(k>='A'&&k<='D')active(k.charCodeAt(0)-65);else if(e.key==='ArrowRight')active((current+1)%4);else if(e.key==='ArrowLeft')active((current+3)%4);else if(k==='R')mount(current)});const p=new URLSearchParams(location.search).get('v');active(p&&/^[A-D]$/.test(p)?p.charCodeAt(0)-65:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
