<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneTone · 融合方案 A–G</title>
<style>
  :root {
    --bg: #e6ebe7;
    --paper: #f6f8f5;
    --ink: #12231e;
    --ink2: #3c514a;
    --muted: #687c74;
    --line: rgba(18, 35, 30, 0.1);
    --teal: #0f6e62;
    --teal-deep: #0a5249;
    --teal-soft: #d6eee8;
    --warn: #8a4b12;
    --ok: #1a7a4c;
    --shadow: 0 18px 44px rgba(18, 35, 30, 0.08);
    --font: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    --display: "Segoe UI Semibold", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    --frame-w: 640px;
    --frame-h: 720px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 14px/1.5 var(--font);
    color: var(--ink);
    background:
      radial-gradient(ellipse 55% 40% at 12% 0%, #d7e6df, transparent 60%),
      radial-gradient(ellipse 45% 35% at 95% 100%, #dde5db, transparent 55%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button, textarea, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  .page {
    width: min(1160px, 100%);
    margin: 0 auto;
    padding: 16px 12px 36px;
    display: grid;
    grid-template-columns: 268px var(--frame-w);
    gap: 16px;
    justify-content: center;
    align-items: start;
  }
  @media (max-width: 940px) {
    .page { grid-template-columns: 1fr; }
    .frame { width: min(100%, var(--frame-w)); margin: 0 auto; }
  }

  .chrome {
    background: color-mix(in srgb, var(--paper) 94%, white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 8px 22px rgba(18, 35, 30, 0.05);
    position: sticky;
    top: 12px;
  }
  .chrome h1 { margin: 0 0 4px; font: 650 15px/1.3 var(--display); letter-spacing: -.02em; }
  .chrome .lead { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
  .tabs { display: flex; flex-direction: column; gap: 5px; }
  .tabs button {
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 11px;
    padding: 9px 10px;
    color: var(--ink2);
  }
  .tabs button[aria-selected="true"] {
    background: var(--teal-soft);
    border-color: color-mix(in srgb, var(--teal) 30%, transparent);
    color: var(--teal-deep);
  }
  .tabs .code {
    display: inline-grid;
    place-items: center;
    width: 20px; height: 20px;
    border-radius: 6px;
    background: rgba(15, 110, 98, .12);
    color: var(--teal-deep);
    font-size: 11px;
    font-weight: 800;
    margin-right: 7px;
  }
  .tabs button[aria-selected="true"] .code { background: var(--teal); color: #f4fffb; }
  .tabs .name { font-weight: 700; font-size: 13px; }
  .tabs small { display: block; margin: 3px 0 0 27px; color: var(--muted); font-size: 11px; font-weight: 400; }
  .meta {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--ink2);
  }
  .meta b { color: var(--teal-deep); }
  .meta p { margin: 0 0 8px; }
  .hint { color: var(--muted); font-size: 11px; }

  .frame {
    width: var(--frame-w);
    height: var(--frame-h);
    background: linear-gradient(165deg, #fbfcfa, var(--paper) 45%, #eef3ef);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .frame::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 160px;
    background: radial-gradient(ellipse 70% 100% at 50% -20%, rgba(15,110,98,.08), transparent 70%);
    pointer-events: none;
  }
  .top {
    position: relative; z-index: 1;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 18px 6px;
  }
  .brand { display: flex; gap: 8px; align-items: center; font-weight: 750; letter-spacing: -.03em; }
  .mark {
    width: 25px; height: 25px; border-radius: 8px;
    border: 1.5px solid var(--teal); color: var(--teal);
    display: grid; place-items: center; font-size: 12px;
  }
  .ctx { font-size: 12px; color: var(--muted); }
  .ctx b { color: var(--ink2); font-weight: 600; }
  .stage {
    position: relative; z-index: 1;
    flex: 1; min-height: 0;
    padding: 6px 20px 16px;
    overflow: auto;
  }
  .toast {
    position: absolute; left: 50%; bottom: 14px;
    transform: translateX(-50%) translateY(10px);
    background: var(--ink); color: #f4faf8;
    padding: 8px 13px; border-radius: 999px;
    font-size: 12px; font-weight: 650; opacity: 0;
    pointer-events: none; transition: .2s ease; z-index: 6; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; }
  .headline { margin: 0; font: 650 26px/1.18 var(--display); letter-spacing: -.035em; }
  .sub { margin: 8px 0 0; color: var(--ink2); font-size: 14px; max-width: 34em; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .btn {
    border: 0; border-radius: 11px; padding: 10px 14px;
    background: var(--teal); color: #f4fffb; font-weight: 700;
    box-shadow: 0 8px 18px rgba(15,110,98,.2);
  }
  .btn.alt { background: transparent; color: var(--ink2); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
  .btn.ghost { background: #fff; color: var(--ink2); border: 1px solid var(--line); box-shadow: none; }
  .panel {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.7);
    border-radius: 14px;
    padding: 12px;
  }
  .ask textarea, .composer input, .c-composer textarea {
    width: 100%; border: 0; resize: none; background: transparent;
    color: var(--ink); outline: none; padding: 2px 0 6px;
  }
  .ask-row, .composer-row {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .ask-row select, .chip-select {
    border: 1px solid var(--line); background: var(--paper);
    border-radius: 8px; padding: 5px 8px; color: var(--ink2); font-size: 12px;
  }
  .send {
    border: 0; border-radius: 9px; padding: 8px 12px;
    background: var(--ink); color: #f5faf8; font-weight: 700; font-size: 12px;
  }
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .ch {
    border: 1px solid var(--line); background: rgba(255,255,255,.55);
    border-radius: 12px; padding: 9px 8px; text-align: left; min-height: 68px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .ch .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .ch.off .dot { background: #a7b5af; }
  .ch.warn .dot { background: var(--warn); }
  .ch .n { font-size: 12px; font-weight: 750; }
  .ch .m { font-size: 11px; color: var(--muted); }
  details.fold > summary {
    list-style: none; cursor: pointer; font-weight: 650; color: var(--ink2);
    display: flex; justify-content: space-between; padding: 2px 0 8px; font-size: 13px;
  }
  details.fold > summary::-webkit-details-marker { display: none; }
  .muted { color: var(--muted); }
  .rise { animation: rise .42s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* B startline */
  .got { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .got .item {
    border: 1px solid var(--line); background: rgba(255,255,255,.65);
    border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 650;
  }
  .got .item small { display: block; margin-top: 4px; font-weight: 400; color: var(--muted); font-size: 11px; }
  .next-card {
    margin-top: 12px; border: 1px solid color-mix(in srgb, var(--teal) 28%, var(--line));
    background: linear-gradient(160deg, #fff, var(--teal-soft));
    border-radius: 14px; padding: 14px;
  }
  .routes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .routes .item {
    border: 1px solid var(--line); background: rgba(255,255,255,.55);
    border-radius: 12px; padding: 12px; text-align: left;
  }
  .routes .item b { display: block; font-size: 13px; margin-bottom: 4px; }
  .routes .item span { font-size: 11px; color: var(--muted); }

  /* C intent */
  .c-center { margin-top: 8vh; text-align: center; }
  .c-center .headline { font-size: 30px; }
  .c-composer {
    margin: 22px auto 0; max-width: 520px; text-align: left;
    border: 1px solid var(--line); background: #fff; border-radius: 16px;
    padding: 14px; box-shadow: 0 14px 36px rgba(18,35,30,.07);
  }
  .c-suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
  .pill {
    border: 1px solid var(--line); background: rgba(255,255,255,.7);
    border-radius: 999px; padding: 6px 11px; font-size: 12px; color: var(--ink2);
  }
  .c-channels { display: flex; justify-content: center; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  .c-channels .chip {
    border: 1px solid var(--line); background: rgba(255,255,255,.55);
    border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--ink2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .c-channels .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .c-channels .off .dot { background: #a7b5af; }

  /* D softpad */
  .d-stage { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; align-items: center; margin-top: 12px; }
  .d-pad {
    aspect-ratio: 1; border-radius: 22px;
    border: 1px solid color-mix(in srgb, var(--teal) 28%, var(--line));
    background: linear-gradient(160deg, #12352f, #0f6e62 55%, #1a8f7d);
    color: #e8fff8; padding: 14px;
    box-shadow: 0 18px 40px rgba(15,110,98,.28);
    display: grid; grid-template-rows: auto 1fr auto;
  }
  .d-pad .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: center; }
  .d-pad .key {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px; padding: 10px 4px; text-align: center; font-size: 11px; font-weight: 650;
  }
  .d-orbit {
    border: 1px solid var(--line); background: rgba(255,255,255,.6);
    border-radius: 14px; padding: 12px; min-height: 88px;
  }
  .d-orbit h4 { margin: 0 0 4px; font-size: 13px; }
  .d-orbit p { margin: 0; font-size: 12px; color: var(--muted); }

  /* E resume */
  .e-card {
    margin-top: 10px; border: 1px solid var(--line); background: #fff;
    border-radius: 16px; padding: 16px; box-shadow: 0 10px 28px rgba(18,35,30,.05);
  }
  .e-steps { margin: 12px 0 0; padding: 0; list-style: none; }
  .e-steps li {
    display: grid; grid-template-columns: 16px 1fr; gap: 8px;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .e-steps .mark-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--teal); }
  .e-steps .done { background: #a7b5af; }

  /* F agent */
  .f-band { display: grid; grid-template-columns: 1.1fr .9fr; gap: 10px; margin-top: 8px; }
  .f-signal {
    border: 1px solid var(--line); background: rgba(255,255,255,.65);
    border-radius: 14px; padding: 12px;
  }
  .f-signal .k { font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .04em; }
  .f-signal .v { margin-top: 4px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .f-signal .s { margin-top: 4px; font-size: 12px; color: var(--ink2); }
  .f-timeline .row {
    display: grid; grid-template-columns: 54px 1fr; gap: 8px;
    padding: 8px 0; border-top: 1px solid var(--line); font-size: 12px;
  }
  .f-timeline .t { color: var(--muted); }

  .situations { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .situations.show { display: block; }
  .situations .label {
    font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .situations .row { display: flex; flex-wrap: wrap; gap: 5px; }
  .situations button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 10px; font-size: 11px; color: var(--ink2);
  }
  .situations button[aria-pressed="true"] {
    background: var(--ink); color: #f4faf8; border-color: transparent;
  }
  .recipe {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0;
  }
  .recipe span {
    font-size: 11px; border-radius: 999px; padding: 4px 8px;
    background: var(--teal-soft); color: var(--teal-deep); font-weight: 650;
  }
  .tabs button.rec .code { background: var(--ink); color: #f4fffb; }
  .tabs button.rec[aria-selected="true"] {
    background: #e8f2ef;
    border-color: color-mix(in srgb, var(--ink) 18%, transparent);
  }

  .scorebox {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .scorebox .label {
    font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .score-row {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
    font-size: 11px;
    color: var(--ink2);
  }
  .score-row .stars { display: flex; gap: 3px; }
  .score-row .stars button {
    width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff;
    color: var(--muted); font-size: 11px; padding: 0; font-weight: 700;
  }
  .score-row .stars button[aria-pressed="true"] {
    background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 35%, transparent);
    color: var(--teal-deep);
  }
  .scorebox textarea {
    width: 100%;
    min-height: 52px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    background: #fff;
    color: var(--ink);
    resize: vertical;
    margin-top: 4px;
  }
  .score-sum {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.45;
  }
  .score-sum b { color: var(--ink2); font-weight: 700; }
  .priority {
    margin-top: 8px;
    font-size: 11px;
    color: var(--ink2);
    line-height: 1.5;
    padding: 8px 9px;
    background: rgba(255,255,255,.65);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .priority ol { margin: 4px 0 0; padding-left: 18px; }

  .launch-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 14px 0 12px;
  }
  .launch-bar .ch { min-height: 78px; }
  .launch-bar .ch.primary-ch {
    border-color: color-mix(in srgb, var(--teal) 35%, var(--line));
    background: linear-gradient(160deg, #fff, var(--teal-soft));
  }
  .extra-link {
    border: 0; background: transparent; color: var(--muted);
    font-size: 12px; padding: 4px 0; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .detect-banner {
    margin: 0 0 10px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--teal) 28%, var(--line));
    background: rgba(214, 238, 232, 0.55);
    font-size: 12px;
    color: var(--ink2);
  }
  .detect-banner b { color: var(--teal-deep); }
  .a-demos { display: none; margin-top: 8px; }
  .a-demos.show { display: block; }
  .a-demos .row { display: flex; flex-wrap: wrap; gap: 5px; }
  .a-demos button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 5px 10px; font-size: 11px; color: var(--ink2);
  }
  .a-demos button[aria-pressed="true"] {
    background: var(--teal-soft); border-color: color-mix(in srgb, var(--teal) 30%, transparent);
    color: var(--teal-deep); font-weight: 650;
  }
</style>
</head>
<body>
  <div class="page">
    <aside class="chrome">
      <h1>融合方案 A–G</h1>
      <p class="lead">A–F 比主轴；G 是第二轮推荐融合。规格：<code>docs/superpowers/specs/2026-10-04-home-fusion-g-design.md</code></p>
      <div class="tabs" role="tablist" aria-label="融合方案">
        <button type="button" role="tab" aria-selected="true" data-v="a"><span class="code">A</span><span class="name">编码启动页</span><small>当前工作 · 听写/按键 · 单提问</small></button>
        <button type="button" role="tab" aria-selected="false" data-v="b"><span class="code">B</span><span class="name">能力起跑线</span><small>先验证能说话 · 再探索通道</small></button>
        <button type="button" role="tab" aria-selected="false" data-v="c"><span class="code">C</span><span class="name">意图入口</span><small>一个问题打开一切</small></button>
        <button type="button" role="tab" aria-selected="false" data-v="d"><span class="code">D</span><span class="name">Soft Pad 中心</span><small>屏幕按钮作视觉锚点</small></button>
        <button type="button" role="tab" aria-selected="false" data-v="e"><span class="code">E</span><span class="name">继续上次</span><small>checkpoint 恢复优先</small></button>
        <button type="button" role="tab" aria-selected="false" data-v="f"><span class="code">F</span><span class="name">Agent 工作带</span><small>动态/帮你 + 单提问</small></button>
        <button type="button" role="tab" class="rec" aria-selected="false" data-v="g"><span class="code">G</span><span class="name">推荐融合</span><small>裁决：处理→修复→冷启动→继续→安静</small></button>
      </div>
      <div class="situations" id="situations">
        <div class="label">G 的情境</div>
        <div class="row" role="group" aria-label="情境">
          <button type="button" data-sit="cold" aria-pressed="true">冷启动</button>
          <button type="button" data-sit="resume" aria-pressed="false">可继续</button>
          <button type="button" data-sit="quiet" aria-pressed="false">安静</button>
          <button type="button" data-sit="attention" aria-pressed="false">要你处理</button>
          <button type="button" data-sit="repair" aria-pressed="false">需修复</button>
        </div>
      </div>
      <div class="a-demos" id="aDemos">
        <div class="label" style="font-size:10px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">A 演示开关</div>
        <div class="row" role="group" aria-label="A 演示">
          <button type="button" data-ademo="explore" aria-pressed="false">主动探索更多</button>
          <button type="button" data-ademo="softpad" aria-pressed="false">检测到 Soft Pad 场景</button>
          <button type="button" data-ademo="camera" aria-pressed="false">检测到摄像头场景</button>
        </div>
      </div>
      <div class="meta" id="meta"></div>
      <div class="priority" id="priority" hidden>
        <b>G 裁决顺序</b>（高优先先匹配）
        <ol>
          <li>要你处理</li>
          <li>需修复</li>
          <li>冷启动（未过起跑线）</li>
          <li>可继续（有 checkpoint）</li>
          <li>安静（默认）</li>
        </ol>
      </div>
      <div class="scorebox" id="scorebox">
        <div class="label">给当前方案打分（本地保存）</div>
        <div class="score-row"><span>小白易懂</span><div class="stars" data-dim="ease"></div></div>
        <div class="score-row"><span>发起效率</span><div class="stars" data-dim="start"></div></div>
        <div class="score-row"><span>OneTone味</span><div class="stars" data-dim="unique"></div></div>
        <textarea id="scoreNote" placeholder="备注：喜欢什么 / 丢掉什么…"></textarea>
        <div class="score-sum" id="scoreSum"></div>
      </div>
    </aside>

    <section class="frame" aria-label="首页预览">
      <header class="top">
        <div class="brand"><span class="mark">一</span>OneTone</div>
        <div class="ctx" id="ctx">当前 · <b>Cursor</b> · <b>voice-pilot</b></div>
      </header>
      <div class="stage" id="stage"></div>
      <div class="toast" id="toast" role="status"></div>
    </section>
  </div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var meta = document.getElementById('meta');
  var toast = document.getElementById('toast');
  var ctx = document.getElementById('ctx');
  var situations = document.getElementById('situations');
  var priority = document.getElementById('priority');

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(SCORE_KEY) || '{}') || {}; }
    catch (_) { return {}; }
  }
  function saveScores(all) {
    try { localStorage.setItem(SCORE_KEY, JSON.stringify(all)); } catch (_) {}
  }
  function getScore(v) {
    var all = loadScores();
    return all[v] || { ease: 0, start: 0, unique: 0, note: '' };
  }
  function setScore(v, patch) {
    var all = loadScores();
    all[v] = Object.assign({}, getScore(v), patch);
    saveScores(all);
    paintScores();
  }
  function buildStars() {
    document.querySelectorAll('.stars[data-dim]').forEach(function (row) {
      if (row.childElementCount) return;
      var dim = row.getAttribute('data-dim');
      for (var i = 1; i <= 5; i++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = String(i);
        b.setAttribute('data-val', String(i));
        b.addEventListener('click', function (val) {
          return function () {
            var patch = {};
            patch[dim] = val;
            setScore(current, patch);
          };
        }(i));
        row.appendChild(b);
      }
    });
  }
  function paintScores() {
    var s = getScore(current);
    document.querySelectorAll('.stars[data-dim]').forEach(function (row) {
      var dim = row.getAttribute('data-dim');
      var val = s[dim] || 0;
      row.querySelectorAll('button').forEach(function (b) {
        b.setAttribute('aria-pressed', Number(b.getAttribute('data-val')) <= val ? 'true' : 'false');
      });
    });
    if (document.activeElement !== scoreNote) scoreNote.value = s.note || '';
    var all = loadScores();
    var lines = ['a', 'b', 'c', 'd', 'e', 'f', 'g'].map(function (v) {
      var x = all[v];
      if (!x) return null;
      var tot = (x.ease || 0) + (x.start || 0) + (x.unique || 0);
      if (!tot) return null;
      return '<b>' + v.toUpperCase() + '</b> ' + tot + '/15';
    }).filter(Boolean);
    scoreSum.innerHTML = lines.length
      ? '汇总：' + lines.join(' · ')
      : '还没有评分。给 A–G 各打三项分，便于选型。';
  }

    if (opts.detectCam && !opts.explore) {

      if (showCam) html += ch('摄像头', opts.detectCam ? '可作确认通道' : '未开启', opts.detectCam ? '' : 'off');
      html += '</div>';
    } else {
      html += '<button type="button" class="extra-link" id="exploreMore">探索 Soft Pad / 摄像头…</button>';

      html += '<p class="muted" style="margin:6px 0 0;font-size:11px"><button type="button" class="extra-link" id="collapseExtra">收起额外通道</button></p>';

        '<h2 class="headline">Cursor 进行中 · 额度稍后</h2>' +
        '<div class="f-band">' +
        '<div class="f-signal"><div class="k">动态</div><div class="v">进行中</div><div class="s">正在整理融合方案对比</div></div>' +
        '<div class="f-signal"><div class="k">要不要你</div><div class="v">暂不需要</div><div class="s">无等待确认</div></div>' +
        '<div class="f-signal"><div class="k">顺不顺</div><div class="v">正常</div><div class="s">来源：前台 + session</div></div>' +
        '<div class="f-signal"><div class="k">做到哪</div><div class="v">下一步</div><div class="s">选出 A–F 主轴</div></div>' +
        '</div>' +
        '<div class="f-timeline panel" style="margin-top:10px">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:2px">帮过你</div>' +
        '<div class="row"><span class="t">07:52</span><span>纠正「四标签」= 四通道</span></div>' +
        '<div class="row"><span class="t">07:56</span><span>给出可融合骨架</span></div>' +
        '<div class="row"><span class="t">08:01</span><span>画出 A–F 对比原型</span></div>' +
        '</div>' +
        '<div style="height:10px"></div>' + askBlock('接着问 Cursor / Codex / Claude…') +
        '<div style="margin-top:10px">' + channelFold(false) + '</div></div>';
    },
    g: viewG
  };

  function setMeta(v) {
    var m = META[v];
    var extra = v === 'g'
      ? '<p><b>当前情境</b>：' + SIT_LABEL[sit] + '</p><p class="hint">按 1–7 / A–G 切方案；在 G 里点情境按钮</p>'
      : '<p class="hint">数字键 1–7 或 A–G · B/G 冷启动可点「检测起跑线」</p>';
    meta.innerHTML = '<p><b>主轴</b>：' + m[0] + '</p><p><b>适合</b>：' + m[1] + '</p><p><b>取舍</b>：' + m[2] + '</p>' + extra;
  }

  function syncSitButtons() {
    situations.querySelectorAll('button[data-sit]').forEach(function (btn) {
      btn.setAttribute('aria-pressed', btn.getAttribute('data-sit') === sit ? 'true' : 'false');
    });
  }

  function setView(v) {
    if (!views[v]) return;
    current = v;
    document.querySelectorAll('.tabs [role="tab"]').forEach(function (btn) {
      btn.setAttribute('aria-selected', btn.getAttribute('data-v') === v ? 'true' : 'false');
    });
    situations.classList.toggle('show', v === 'g');
    aDemos.classList.toggle('show', v === 'a' || (v === 'g' && sit === 'quiet'));
    priority.hidden = v !== 'g';
    syncSitButtons();
    syncADemoButtons();
    setMeta(v);
    paintScores();
    ctx.innerHTML = (v === 'b' || (v === 'g' && sit === 'cold'))
      ? '当前使用：<b>全局方案</b> · <b>Cursor</b> · <b>voice-pilot</b>'
      : '当前编码 · <b>Cursor</b> · <b>voice-pilot</b>';
    stage.innerHTML = views[v]();
    var q = '?v=' + v + (v === 'g' ? '&sit=' + sit : '');
    history.replaceState(null, '', q);
  }

  function syncADemoButtons() {
    aDemos.querySelectorAll('button[data-ademo]').forEach(function (btn) {
      var k = btn.getAttribute('data-ademo');
      var on = k === 'explore' ? exploreExtra : k === 'softpad' ? detectSoftPad : detectCamera;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  document.querySelectorAll('.tabs [role="tab"]').forEach(function (btn) {
    btn.addEventListener('click', function () { setView(btn.getAttribute('data-v')); });
  });

  situations.querySelectorAll('button[data-sit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      sit = btn.getAttribute('data-sit');
      setView('g');
    });
  });

  aDemos.querySelectorAll('button[data-ademo]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var k = btn.getAttribute('data-ademo');
      if (k === 'explore') exploreExtra = !exploreExtra;
      if (k === 'softpad') detectSoftPad = !detectSoftPad;
      if (k === 'camera') detectCamera = !detectCamera;
      setView(current);
    });
  });

  stage.addEventListener('click', function (e) {
    if (e.target.id === 'exploreMore') {
      exploreExtra = true;
      tip('已展开 Soft Pad / 摄像头');
      setView(current);
      return;
    }
    if (e.target.id === 'collapseExtra') {
      exploreExtra = false;
      tip('已收起额外通道');
      setView(current);
      return;
    }
    if (e.target.id === 'detectStart') {
      startlineDone = true;
      tip('检测完成：还可以更顺手');
      if (current === 'g') {
        sit = 'quiet';
        setView('g');
      } else {
        setView('b');
      }
      return;
    }
    if (e.target.id === 'resetStart') {
      startlineDone = false;
      tip('已重置起跑线');
      setView(current === 'g' ? 'g' : 'b');
      return;
    }
    var t = e.target.closest('[data-tip]');
    if (t) tip(t.getAttribute('data-tip'));
  });

  window.addEventListener('keydown', function (e) {
    if (e.target.matches('textarea, input, select')) return;
    var map = {
      Digit1: 'a', Digit2: 'b', Digit3: 'c', Digit4: 'd', Digit5: 'e', Digit6: 'f', Digit7: 'g',
      KeyA: 'a', KeyB: 'b', KeyC: 'c', KeyD: 'd', KeyE: 'e', KeyF: 'f', KeyG: 'g'
    };
    var v = map[e.code];
    if (v) { e.preventDefault(); setView(v); }
  });

  var params = new URLSearchParams(location.search);
  var init = (params.get('v') || 'g').toLowerCase();
  var initSit = (params.get('sit') || 'cold').toLowerCase();
  if (SIT_LABEL[initSit]) sit = initSit;
  if (!views[init]) init = 'g';
  setView(init);
})();
</script>
</body>
</html>
