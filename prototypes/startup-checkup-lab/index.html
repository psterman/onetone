<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneTone 启动体检页预览</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#132822;background:#edf2f0;--green:#07826c;--mint:#dff2eb;--amber:#d78a21;--violet:#6d64d8;--ink:#132822;--muted:#71817b}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;overflow:hidden}button{font:inherit;cursor:pointer}.shell{height:100vh;display:grid;grid-template-rows:52px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#fbfcfb;border-bottom:1px solid #d5ddda;z-index:5}.brand{display:flex;align-items:center;gap:10px}.brand i{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--green);color:#fff;font-style:normal;font-weight:800}.brand span{color:var(--muted);font-size:12px}.topbar>div:last-child{display:flex;gap:8px}.topbar button{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#66756f}.topbar button:hover{background:#edf2f0}.stage{min-height:0;overflow:auto}.page{min-height:calc(100vh - 52px);padding:32px 40px 104px}.page button:focus-visible{outline:3px solid #18a88c;outline-offset:3px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#e7eeeb;color:#18322b}.btn.primary{background:var(--green);color:#fff}.btn.ghost{background:transparent;border:1px solid #cbd6d2}.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#9ba7a2}.dot.ok{background:#12a783}.dot.warn{background:#e89a31}.dot.extra{background:#776bdf}.mini-status{font-size:12px;color:var(--muted)}.oktext{color:#087863}.warntext{color:#a76615}.notice{display:none;position:fixed;z-index:20;top:66px;left:50%;transform:translate(-50%,-8px);padding:10px 14px;border-radius:10px;background:#173c34;color:#fff;font-size:12px}.notice.show{display:block;animation:noticeIn 180ms ease-out forwards}@keyframes noticeIn{to{transform:translate(-50%,0)}}
/* 1 dashboard */.dashboard{background:#f4f7f6}.dash-head{display:flex;justify-content:space-between;align-items:end;max-width:1120px;margin:auto}.dash-head h1{margin:7px 0;font-size:34px;letter-spacing:-1px}.dash-head p{margin:0;color:var(--muted)}.dash-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1120px;margin:28px auto}.score-panel{display:grid;place-items:center;align-content:center;min-height:500px;border-radius:22px;background:#123d35;color:#fff}.score-ring{display:grid;place-items:center;width:190px;height:190px;border-radius:50%;background:conic-gradient(#4fe1b8 0 82%,#ffffff1a 82%);position:relative}.score-ring:after{content:"";position:absolute;inset:13px;border-radius:50%;background:#123d35}.score-ring strong,.score-ring span{position:relative;z-index:1}.score-ring strong{font-size:60px;line-height:1}.score-ring span{margin-top:62px;font-size:12px;color:#a9c5bc}.score-panel h2{margin:24px 0 7px}.score-panel p{margin:0 28px 24px;text-align:center;color:#abc0ba;font-size:13px}.score-panel .btn{background:#d7fff2;color:#0a4a3d;min-width:190px}.check-groups{display:grid;gap:13px}.check-group{padding:18px;border:1px solid #d5ddda;border-radius:17px;background:#fff}.group-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.group-title h2{margin:0;font-size:15px}.group-title span{font-size:11px;color:var(--muted)}.check-row{display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0ef}.check-row:first-of-type{border-top:0}.check-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--mint);color:var(--green);font-weight:800}.check-icon.warn{background:#fff1db;color:#b16b13}.check-icon.extra{background:#efedff;color:var(--violet)}.check-row b{display:block;font-size:13px}.check-row small{color:var(--muted)}.check-row button{border:0;background:transparent;color:#087662;font-size:12px}
/* 2 gate */.gate{background:#f7faf9}.gate-wrap{max-width:1000px;margin:auto}.gate-hero{text-align:center;padding-top:18px}.gate-symbol{display:grid;place-items:center;width:86px;height:86px;margin:auto;border-radius:28px;background:var(--mint);color:var(--green);font-size:38px;font-weight:900}.gate h1{font-size:42px;letter-spacing:-2px;margin:18px 0 6px}.gate-hero p{color:var(--muted)}.gate-actions{display:flex;justify-content:center;gap:10px;margin-top:22px}.gate-lanes{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-top:34px}.lane{border:1px solid #d5dfdb;border-radius:18px;background:#fff;overflow:hidden}.lane header{padding:18px;border-bottom:1px solid #e4e9e7}.lane header div{display:flex;align-items:center;justify-content:space-between}.lane h2{margin:0;font-size:16px}.lane header p{margin:6px 0 0;color:var(--muted);font-size:12px}.lane.core header{background:#eaf6f2}.lane.collab header{background:#fff7e8}.lane.extra header{background:#f1efff}.lane ul{list-style:none;margin:0;padding:8px 16px 14px}.lane li{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f0;font-size:13px}.lane li:last-child{border-bottom:0}.lane li small{color:var(--muted)}.lane-foot{margin-top:18px;padding:17px 20px;border-radius:15px;background:#eef3f1;display:flex;justify-content:space-between;align-items:center}.lane-foot div{display:grid;gap:4px}.lane-foot small{color:var(--muted)}
/* 3 path */.path{background:#0f1916;color:#eaf4f0}.path-head{display:flex;justify-content:space-between;align-items:start;max-width:1140px;margin:auto}.path-head h1{font-size:34px;margin:6px 0}.path-head p{color:#8ea49c}.path .btn.ghost{border-color:#3a4e47;color:#bfd0ca}.signal-map{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;max-width:1140px;margin:64px auto 0}.signal-map:before{content:"";position:absolute;left:7%;right:7%;top:70px;height:2px;background:#30443d}.signal-node{position:relative;z-index:1;display:grid;justify-items:center;text-align:center}.node-orb{display:grid;place-items:center;width:72px;height:72px;border:7px solid #0f1916;border-radius:50%;background:#1d2b27;box-shadow:0 0 0 2px #3a4e47;color:#82978f;font-size:24px}.signal-node.ok .node-orb{background:#164f42;box-shadow:0 0 0 2px #36c7a0;color:#72eccb}.signal-node.warn .node-orb{background:#503a1f;box-shadow:0 0 0 2px #e69a33;color:#ffc46f}.signal-node h2{font-size:14px;margin:17px 0 5px}.signal-node p{font-size:11px;color:#82978f;margin:0;line-height:1.5}.path-detail{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;max-width:960px;margin:60px auto 0}.path-console,.unlock-panel{border:1px solid #2d4039;border-radius:17px;background:#14211d;padding:20px}.path-console header{display:flex;justify-content:space-between}.path-console h2,.unlock-panel h2{font-size:15px;margin:0}.console-lines{display:grid;gap:8px;margin-top:17px;font:12px ui-monospace,Consolas,monospace;color:#8ea49c}.console-lines span:last-child{color:#f3b457}.unlock-panel ul{margin:14px 0 0;padding-left:20px;color:#9fb2ab;font-size:12px;line-height:1.9}.path-running .node-orb{animation:pulse 1s ease-out infinite}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 8px #3bd2a51c}}
/* 4 atlas */.atlas{background:#fafafa}.atlas-layout{display:grid;grid-template-columns:290px 1fr;max-width:1160px;margin:auto;min-height:610px;border:1px solid #dce2df;border-radius:22px;background:#fff;overflow:hidden}.atlas aside{padding:25px;background:#f3f5f4;border-right:1px solid #dce2df}.atlas aside h1{font-size:25px;margin:5px 0 9px}.atlas aside>p{font-size:13px;color:var(--muted);line-height:1.6}.legend{display:grid;gap:11px;margin:30px 0}.legend span{display:flex;align-items:center;gap:9px;font-size:12px}.legend i{width:12px;height:12px;border-radius:4px;background:var(--green)}.legend .pending{background:var(--amber)}.legend .preview{background:var(--violet)}.atlas aside .btn{width:100%;margin-top:8px}.atlas main{position:relative;overflow:hidden;padding:24px}.atlas main>header{display:flex;justify-content:space-between;align-items:center}.atlas main>header h2{margin:0;font-size:15px}.atlas main>header span{font-size:11px;color:var(--muted)}.map{position:relative;height:500px;margin-top:8px}.hub{position:absolute;left:42%;top:43%;display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:#143d35;color:#fff;box-shadow:0 0 0 18px #e7f3ef,0 20px 50px #153e3526;text-align:center}.hub b{font-size:20px}.hub small{color:#add0c5}.branch{position:absolute;display:grid;gap:4px;min-width:150px;padding:14px 16px;border-radius:14px;border:1px solid #d7e0dc;background:#fff;box-shadow:0 12px 30px #19382f12}.branch b{font-size:13px}.branch small{color:var(--muted)}.branch:after{content:"";position:absolute;width:70px;height:1px;background:#bdcbc6}.b1{left:5%;top:10%}.b1:after{right:-70px;top:50%;transform:rotate(24deg)}.b2{left:2%;bottom:12%}.b2:after{right:-70px;top:20%;transform:rotate(-25deg)}.b3{right:2%;top:8%}.b3:after{left:-70px;top:60%;transform:rotate(-22deg)}.b4{right:3%;bottom:12%;border-color:#c9c3fa;background:#f8f7ff}.b4:after{left:-70px;top:20%;transform:rotate(22deg);background:#9e95e8}.branch .cap-list{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.cap-list em{font-style:normal;font-size:10px;padding:4px 6px;border-radius:5px;background:#edf3f1;color:#3f5d54}.b4 .cap-list em{background:#ebe9ff;color:#5e55c5}.branch button{justify-self:start;border:0;background:transparent;padding:4px 0;color:#087763;font-size:11px}
/* picker exact */.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}@media(max-width:980px){.page{padding:24px 20px 96px}.dash-grid{grid-template-columns:280px 1fr}.gate-lanes{grid-template-columns:1fr}.signal-map{grid-template-columns:repeat(3,1fr);row-gap:40px}.signal-map:before{display:none}.atlas-layout{grid-template-columns:230px 1fr}.branch{min-width:130px}.hub{left:38%}}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.path-running .node-orb{animation:none}.notice.show{animation:none}}
</style>
</head>
<body>
<div class="shell"><header class="topbar"><div class="brand"><i>一</i><strong>OneTone 检测室</strong><span>启动体检预览</span></div><div><button data-action="capabilities">功能图谱</button><button data-action="settings">设置</button></div></header><main id="stage" class="stage"></main></div>
<div class="notice" role="status" aria-live="polite"></div>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">体检仪表</button><button class="proto-picker-item">合格闸门</button><button class="proto-picker-item">信号通路</button><button class="proto-picker-item">能力图谱</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
<script>
const rows={core:[['麦克风','已达标','声音采集正常'],['触发按键','已达标','鼠标侧键'],['目标应用','已达标','Cursor'],['输入框对准','已达标','写入方式：校准位置'],['安全写入','已达标','失败时主动停止']],collab:[['Agent','待补强','Cursor Hook 未连接'],['Soft Pad','已达标','状态灯可用']],extra:[['摄像头','待补强','不影响核心使用'],['视线校准','未开启','开启摄像头后可用']]};
const checkRows=(items,kind='ok')=>items.map((r,i)=>`<div class="check-row"><span class="check-icon ${r[1]==='已达标'?'':kind}">${r[1]==='已达标'?'✓':r[0]==='摄像头'?'◇':'!'}</span><div><b>${r[0]}</b><small>${r[2]}</small></div><button data-action="${r[0]==='输入框对准'?'calibrate':'detail'}">${r[0]==='输入框对准'?'校准位置':'查看'}</button></div>`).join('');
const variants=[
()=>`<section class="page dashboard"><div class="dash-head"><div><span class="tag"><i class="dot ok"></i>刚刚完成检测</span><h1>电脑已达到使用标准</h1><p>核心链路全部通过，还有 3 项能力可以补强。</p></div><button class="btn ghost" data-action="run-check">重新体检</button></div><div class="dash-grid"><aside class="score-panel"><div class="score-ring"><strong>可用</strong><span>核心 5 / 5</span></div><h2>可以开始使用</h2><p>摄像头和 Agent 未完全配置，不影响语音输入。</p><button class="btn" data-action="run-check">立即体检</button></aside><main class="check-groups"><section class="check-group"><div class="group-title"><h2>核心链路</h2><span class="oktext">5 项已达标</span></div>${checkRows(rows.core)}</section><section class="check-group"><div class="group-title"><h2>协作能力</h2><span class="warntext">1 项待补强</span></div>${checkRows(rows.collab,'warn')}</section><section class="check-group"><div class="group-title"><h2>增强能力</h2><span>不影响核心使用</span></div>${checkRows(rows.extra,'extra')}</section></main></div></section>`,
()=>`<section class="page gate"><div class="gate-wrap"><div class="gate-hero"><div class="gate-symbol">✓</div><h1>可以开始使用</h1><p>关键链路已达标。补齐下面两项，可以获得更完整的桌面协作体验。</p><div class="gate-actions"><button class="btn primary" data-action="run-check">再检查一次</button><button class="btn ghost" data-action="start">进入 OneTone</button></div></div><div class="gate-lanes"><section class="lane core"><header><div><h2>核心链路</h2><b class="oktext">已达标</b></div><p>决定语音输入能否真正完成</p></header><ul>${rows.core.map(r=>`<li><i class="dot ok"></i><span>${r[0]}</span><small>${r[2]}</small></li>`).join('')}</ul></section><section class="lane collab"><header><div><h2>协作能力</h2><b class="warntext">待补强</b></div><p>让 Agent 状态更清楚</p></header><ul>${rows.collab.map(r=>`<li><i class="dot ${r[1]==='已达标'?'ok':'warn'}"></i><span>${r[0]}</span><small>${r[1]}</small></li>`).join('')}<li><i class="dot warn"></i><span>连接 Cursor Hook</span><button class="btn" data-action="repair-agent">去补强</button></li></ul></section><section class="lane extra"><header><div><h2>增强能力</h2><b>可选</b></div><p>不影响核心使用</p></header><ul><li><i class="dot extra"></i><span>摄像头</span><small>未开启</small></li><li><i class="dot extra"></i><span>能力预告</span><small>离席保护 / 摇头取消</small></li><li><i class="dot extra"></i><span>视线校准</span><button class="btn" data-action="camera">了解功能</button></li></ul></section></div><div class="lane-foot"><div><b>输入框对准：已使用校准位置</b><small>Cursor · 落点 1 已记住 · 落点 2 未设置</small></div><button class="btn ghost" data-action="calibrate">校准位置</button></div></div></section>`,
()=>`<section class="page path"><div class="path-head"><div><span class="tag"><i class="dot ok"></i>端到端试运行</span><h1>从声音到输入框，一步步确认</h1><p>检测会在失败的位置停下，并告诉你如何修复。</p></div><button class="btn ghost" data-action="run-check">运行完整检测</button></div><div class="signal-map"><div class="signal-node ok"><div class="node-orb">◉</div><h2>麦克风</h2><p>听到声音<br>已达标</p></div><div class="signal-node ok"><div class="node-orb">⌁</div><h2>触发方式</h2><p>鼠标侧键<br>已达标</p></div><div class="signal-node ok"><div class="node-orb">C</div><h2>目标应用</h2><p>Cursor<br>已确认</p></div><div class="signal-node ok"><div class="node-orb">⌖</div><h2>输入框对准</h2><p>校准位置<br>落点 1</p></div><div class="signal-node ok"><div class="node-orb">T</div><h2>安全写入</h2><p>失败即停止<br>已达标</p></div><div class="signal-node warn"><div class="node-orb">A</div><h2>Agent</h2><p>Hook 未连接<br>待补强</p></div></div><div class="path-detail"><section class="path-console"><header><h2>检测记录</h2><span class="mini-status">核心链路通过</span></header><div class="console-lines"><span>✓ 麦克风有稳定输入</span><span>✓ 找到 Cursor 窗口</span><span>✓ 写入方式使用校准位置</span><span>✓ 落点 1 可用，落点 2 未设置</span><span>! Cursor Agent Hook 尚未连接</span></div></section><section class="unlock-panel"><h2>补强后可以获得</h2><ul><li>Agent 运行状态回传</li><li>需要确认时提醒你</li><li>Soft Pad Agent 状态灯</li></ul><button class="btn primary" data-action="calibrate">校准位置</button></section></div></section>`,
()=>`<section class="page atlas"><div class="atlas-layout"><aside><span class="tag"><i class="dot extra"></i>功能图谱</span><h1>你的 OneTone 能做什么</h1><p>绿色是已经具备的能力；黄色是配置后可用；蓝紫色是开启设备后可以补强的能力。</p><div class="legend"><span><i></i>已解锁 · 现在可用</span><span><i class="pending"></i>待配置 · 可以补强</span><span><i class="preview"></i>能力预告 · 需要设备</span></div><button class="btn primary" data-action="run-check">重新检测能力</button><button class="btn ghost" data-action="calibrate">校准位置</button></aside><main><header><h2>当前能力关系</h2><span>核心链路已达标</span></header><div class="map"><div class="hub"><b>OneTone</b><small>可以开始使用</small></div><article class="branch b1"><b>语音输入</b><small>麦克风与识别已就绪</small><div class="cap-list"><em>按住说话</em><em>结束词</em><em>取消词</em></div><button data-action="detail">查看能力</button></article><article class="branch b2"><b>精准写入</b><small>输入框对准已达标</small><div class="cap-list"><em>校准位置</em><em>安全写入</em><em>目标应用</em></div><button data-action="calibrate">校准位置</button></article><article class="branch b3"><b>Agent 协作</b><small class="warntext">Hook 待补强</small><div class="cap-list"><em>状态灯</em><em>等待提醒</em><em>运行反馈</em></div><button data-action="repair-agent">连接 Agent</button></article><article class="branch b4"><b>视觉增强</b><small>摄像头未开启 · 不影响核心使用</small><div class="cap-list"><em>离席保护</em><em>摇头取消</em><em>眨眼唤醒</em><em>视线辅助</em></div><button data-action="camera">查看能力预告</button></article></div></main></div></section>`];
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay'),notice=document.querySelector('.notice');let current=0,timer;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function wire(){stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.textContent.trim()))}
function mount(i=current){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wire()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);j===i?el.setAttribute('aria-current','true'):el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
function toast(text){notice.textContent=text;notice.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>notice.classList.remove('show'),1800)}
function act(id,label){if(id==='run-check'){stage.querySelector('.page')?.classList.add('path-running');toast('正在重新检查：麦克风 → 输入框 → Agent')}else if(id==='calibrate')toast('打开现有流程：写入方式 → 校准此位置 → 先圈住再点一下');else if(id==='camera')toast('能力预告：离席保护、摇头取消、眨眼唤醒、视线辅助');else if(id==='repair-agent')toast('前往 Agent Hook 连接向导');else toast(`${label} · 原型反馈`)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});document.querySelectorAll('.topbar [data-action]').forEach(b=>b.onclick=()=>b.dataset.action==='capabilities'?setActive(3):toast('设置入口 · 原型反馈'));setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body></html>
