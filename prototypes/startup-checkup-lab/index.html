ound:#0d251f;color:#59e1b8;font:10px ui-monospace,Consolas,monospace}.scanner{display:grid;place-items:center;position:relative;min-height:390px}.scope{position:relative;width:360px;height:360px;border:1px solid #234b40;border-radius:50%;background:radial-gradient(circle,#123b30 0 2px,transparent 3px),repeating-radial-gradient(circle,transparent 0 58px,#17362e 59px 60px)}.scope:before,.scope:after{content:"";position:absolute;background:#1d4439}.scope:before{left:50%;top:0;width:1px;height:100%}.scope:after{top:50%;left:0;width:100%;height:1px}.beam{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#55e3b52d,transparent 22%);transition:transform 1.2s linear}.scanning .beam{transform:rotate(360deg)}.scope-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;align-content:center;width:126px;height:126px;border-radius:50%;background:#0a1a16;border:1px solid #3c826d;box-shadow:0 0 45px #36d4a329}.scope-core strong{font-size:18px;color:#70edc7}.scope-core small{font:9px ui-monospace,Consolas,monospace;color:#5e887b;margin-top:4px}.blip{position:absolute;width:12px;height:12px;border:2px solid #5be8bc;border-radius:50%;box-shadow:0 0 12px #5be8bc}.p1{left:24%;top:30%}.p2{right:19%;top:38%}.p3{left:35%;bottom:18%}.cockpit-log{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.log{border:1px solid #1d3931;border-radius:8px;padding:11px;background:#0a1714}.log span{display:block;font:9px ui-monospace,Consolas,monospace;color:#58766d}.log b{font-size:11px;color:#b8cbc5}.cap-stack{display:grid;gap:9px}.cap-card{padding:13px;border:1px solid #223e36;border-radius:10px;background:#0b1a16}.cap-card header{display:flex;justify-content:space-between}.cap-card b{font-size:12px}.cap-card em{font:9px ui-monospace,Consolas,monospace;color:#776ce5;font-style:normal}.cap-card p{font-size:10px;color:#648078;line-height:1.5}.cap-card button{border:0;background:transparent;color:#53d8b1;font:10px ui-monos <body><div class="app"><main id="stage" class="stage" aria-label="核心能力已达标，扩展能力待补强"></main></div><div class="toast" role="status" aria-live="polite"></div>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">精密仪器</button><button class="proto-picker-item">空间计算</button><button class="proto-picker-item">高级消费</button><button class="proto-picker-item">未来控制舱</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
<script>
const icons={mic:'<svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>',key:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h2M7 14h10"/></svg>',target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',write:'<svg viewBox="0 0 24 24"><path d="M4 19h16M7 15l9-9 2 2-9 9-3 1z"/></svg>',agent:'<svg viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4H9l-4 3v-4a4 4 0 0 1-2-3v-2a4 4 0 0 1 4-4z"/><path d="M9 12h.01M15 12h.01"/></svg>',camera:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="3"/><path d="m17 10 4-2v8l-4-2z"/></svg>'};
const ico=n=>`<span class="ico">${icons[n]}</span>`;
const instrument=()=>`<section class="view instrument-shell"><div class="instrument-frame"><header class="instrument-bar"><div class="instrument-brand"><span class="brand-glyph">一</span><div><b>OneTone 检测室</b><div class="eyebrow muted">SYSTEM QUALIFICATION LAB</div></div></div><nav><button>检测记录</button><button>功能图谱</button><button>设置</button></nav></header><div class="instrument-body"><aside class="instrument-hero"><span class="eyebrow">启动体检 · 10:42</span><h1>核心系统<br>达到使用标准</h1><p>麦克风、触发、目标应用和输入框定位均通过验证。</p><div class="dial"><div class="dial-core"><strong>PASS</strong><small>核心 5 / 5</small></div></div><div class="action"><button class="primary press" data-action="run-check">重新检测</button><button class="press" data-action="start">进入工作</button></div></aside><main class="instrument-results"><div class="result-heading"><div><span class="eyebrow muted">MEASUREMENT RESULTS</span><h2>系统检测结果</h2></div><span>PROFILE / CURSOR / CODING</span></div><section class="measure-group"><div class="measure-title"><b>核心链路</b><span>全部已达标</span></div><div class="measure-list">${[['mic','麦克风','48 kHz · 输入稳定','PASS'],['key','触发按键','Mouse 4 · 响应 18 ms','PASS'],['target','目标应用','Cursor · voice-pilot','LOCK'],['write','输入框对准','写入方式：校准位置','POINT 1']].map(r=>`<div class="measure">${ico(r[0])}<div><b>${r[1]}</b><small>${r[2]}</small></div><span class="measure-value">${r[3]}</span><button data-action="${r[0]==='write'?'calibrate':'detail'}">${r[0]==='write'?'校准位置':'详情'}</button></div>`).join('')}</div></section><section class="measure-group"><div class="measure-title"><b>扩展系统</b><span>2 项可补强</span></div><div class="measure-list"><div class="measure">${ico('agent')}<div><b>Agent</b><small>Cursor Hook 尚未连接</small></div><span class="measure-value">OPTIONAL</span><button data-action="agent">连接</button></div><div class="measure">${ico('camera')}<div><b>摄像头</b><small>未开启 · 不影响核心使用</small></div><span class="measure-value">OFFLINE</span><button data-action="camera">预告</button></div></div></section><div class="instrument-note"><p><b>能力预告</b><span>开启摄像头后，可获得离席保护、摇头取消和视线辅助。</span></p><button data-action="camera">查看功能图谱</button></div></main></div></div></section>`;

const cockpit=()=>`<section class="view cockpit-shell"><header class="cockpit-header"><div class="cockpit-logo"><span class="brand-glyph">一</span>ONETONE / QUALIFICATION BAY</div><div class="telemetry"><span>PROFILE <b>CURSOR</b></span><span>CORE <b>5/5</b></span><span>STATUS <b>READY</b></span></div></header><div class="cockpit-grid"><aside class="cockpit-side"><h2>INPUT MODULES</h2>${[['mic','麦克风','48 kHz / stable','PASS'],['key','触发按键','Mouse 4 / 18 ms','PASS'],['target','目标应用','Cursor / locked','LOCK'],['write','输入框对准','calibrated / P1','PASS']].map(r=>`<div class="module">${ico(r[0])}<div><b>${r[1]}</b><small>${r[2]}</small></div><span>${r[3]}</span></div>`).join('')}<div class="risk-panel"><b>OPTIONAL MODULE</b><p>摄像头未开启，不影响核心使用。开启后将解锁视觉增强。</p></div></aside><main class="cockpit-main"><header><div><span class="eyebrow muted">END-TO-END SIGNAL SCAN</span><h1>系统链路已锁定</h1><p>MIC → TRIGGER → CURSOR → AIM → WRITE</p></div><button class="scan-button press" data-action="run-check">RUN FULL SCAN</button></header><div class="scanner"><div class="scope"><div class="beam"></div><i class="blip p1"></i><i class="blip p2"></i><i class="blip p3"></i><div class="scope-core"><strong>READY</strong><small>ALL CORE SYSTEMS</small></div></div></div><footer class="cockpit-log"><div class="log"><span>MIC INPUT</span><b>声音信号稳定</b></div><div class="log"><span>FOCUS AIM</span><b>校准位置 · 落点 1</b></div><div class="log"><span>SAFE WRITE</span><b>失败时主动停止</b></div></footer></main><aside class="cockpit-side right"><h2>CAPABILITY MODULES</h2><div class="cap-stack"><article class="cap-card"><header><b>Agent 协作</b><em>PENDING</em></header><p>连接 Hook 后解锁运行反馈、等待提醒和状态灯。</p><button data-action="agent">CONNECT MODULE</button></article><article class="cap-card"><header><b>视觉增强</b><em>PREVIEW</em></header><p>摄像头带来离席保护、摇头取消、眨眼唤醒和视线辅助。</p><button data-action="camera">VIEW CAPABILITY</button></article><article class="cap-card"><header><b>输入定位</b><em>ACTIVE</em></header><p>写入方式使用校准位置；可重新绘制输入区域。</p><button data-action="calibrate">校准位置</button></article></div></aside></div></section>`;
const variants=[instrument,spatial,consumer,cockpit],stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay'),toast=document.querySelector('.toast');let current=0,t;
function moveHighlight(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}function mount(i=current){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,b.textContent.trim()))})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((e,j)=>{e.toggleAttribute('data-active',j===i);j===i?e.setAttribute('aria-current','true'):e.removeAttribute('aria-current')});moveHighlight();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i)}function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),1900)}function act(id,label){if(id==='run-check'){stage.querySelector('.scope')?.classList.add('scanning');say('正在检测：麦克风 → 触发 → 目标 → 输入框对准 → 安全写入')}else if(id==='calibrate')say('打开写入方式：校准位置 · 先圈住，再点一下');else if(id==='camera')say('能力预告：离席保护、摇头取消、眨眼唤醒、视线辅助');else if(id==='agent')say('连接 Agent Hook 后可获得运行状态与等待提醒');else say(label+' · 原型反馈')}items.forEach((e,i)=>e.addEventListener('click',()=>setActive(i)));replay.onclick=()=>mount();window.onresize=moveHighlight;document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=4)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%4);else if(e.key==='ArrowLeft')setActive((current+3)%4);else if(e.key==='r'||e.key==='R')mount()});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script></body></html>
