<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 安静工作台</title>
  <style>
    :root {
      --paper: #fbfaf7;
      --nav: #f1f2f2;
      --ink: #1d2a3d;
      --muted: #778294;
      --quiet: #a5aeba;
      --line: #e9e8e3;
      --teal: #087f77;
      --teal-soft: #e2f3ef;
      --amber: #aa641f;
      --amber-soft: #fff1df;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 880px; min-height: 100vh; background: #e2e5e6; color: var(--ink); }
    button { font: inherit; }
    .app { width: 100%; min-height: 100vh; padding: 22px; }
    .window { width: 100%; max-width: 1360px; min-height: calc(100vh - 44px); margin: 0 auto; display: grid; grid-template-columns: 216px minmax(0, 1fr); overflow: hidden; border: 1px solid #d4d8da; border-radius: 16px; background: var(--paper); box-shadow: 0 16px 50px rgba(35,44,55,.08); }
    aside { min-width: 0; }
    .sidebar { display: flex; flex-direction: column; padding: 25px 14px; background: var(--nav); border-right: 1px solid #e0e2e3; }
    .brand { padding: 0 12px 34px; color: var(--teal); font-size: 15px; font-weight: 850; letter-spacing: .05em; }
    .nav-label { padding: 0 12px 9px; color: #a1a8b0; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 8px; background: transparent; color: #647184; text-align: left; cursor: pointer; transition: background 160ms ease-out, color 160ms ease-out; }
    .nav button:hover { background: rgba(255,255,255,.68); color: var(--ink); }
    .nav button.active { background: var(--paper); color: var(--ink); font-weight: 750; }
    .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: #aab4bf; }
    .nav button.active .nav-dot { background: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
    .nav-foot { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid #dcdfdf; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .nav-foot strong { display: block; color: var(--ink); font-size: 12px; }
    main { min-width: 0; padding: 58px clamp(42px, 8vw, 132px) 34px; }
    .content { width: 100%; max-width: 820px; margin: 0 auto; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; padding-bottom: 44px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 13px; color: var(--teal); font-size: 12px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 660px; margin: 0 0 12px; font-size: clamp(30px, 4vw, 48px); line-height: 1.1; letter-spacing: -.05em; }
    .intro p { max-width: 540px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .listen { flex: 0 0 auto; padding: 13px 18px; border: 0; border-radius: 9px; background: var(--teal); color: #fff; font-weight: 800; box-shadow: 0 8px 18px rgba(8,127,119,.16); cursor: pointer; transition: transform 160ms ease-out, background 160ms ease-out; }
    .listen:hover { background: #05665f; transform: translateY(-1px); }
    .listen:active { transform: translateY(1px); }
    .listen[aria-pressed="true"] { background: #a44d45; }
    .section { padding-top: 29px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 14px; }
    .section-head h2 { margin: 0; font-size: 15px; }
    .section-head button { padding: 0; border: 0; background: transparent; color: var(--teal); font-size: 12px; font-weight: 800; cursor: pointer; }
    .section-head button:hover { text-decoration: underline; }
    .activity { border-top: 1px solid var(--line); }
    .activity-row { display: grid; grid-template-columns: 54px 14px minmax(0, 1fr) auto; align-items: start; gap: 15px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .activity-row time { padding-top: 2px; color: var(--quiet); font-size: 11px; }
    .timeline { position: relative; display: flex; justify-content: center; min-height: 34px; }
    .timeline::before { content: ""; position: absolute; top: 10px; bottom: -28px; width: 1px; background: #d7e6e3; }
    .activity-row:last-child .timeline::before { display: none; }
    .timeline-dot { position: relative; z-index: 1; width: 9px; height: 9px; margin-top: 3px; border: 2px solid var(--paper); border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #a7d3ce; }
    .timeline-dot.warn { background: var(--amber); box-shadow: 0 0 0 1px #e9c18f; }
    .activity-row strong { display: block; margin-bottom: 5px; font-size: 14px; line-height: 1.45; }
    .activity-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .row-action { align-self: center; padding: 4px 0; border: 0; background: transparent; color: var(--teal); font-size: 12px; font-weight: 750; cursor: pointer; }
    .row-action.warn { color: var(--amber); }
    .empty-space { min-height: 70px; }
    .bottom-status { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 13px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .status-summary { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
    .status-summary span { display: inline-flex; align-items: center; gap: 6px; }
    .status-summary i { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
    .status-summary i.warn { background: var(--amber); }
    .status-link { border: 0; background: transparent; color: var(--teal); font-size: 11px; font-weight: 750; cursor: pointer; }
    .live-dock { position: fixed; left: 50%; bottom: 24px; z-index: 5; width: min(680px, calc(100vw - 48px)); padding: 15px 17px; border: 1px solid #b8d8d1; border-radius: 13px; background: rgba(250,255,253,.97); box-shadow: 0 14px 38px rgba(24,67,61,.18); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: transform 180ms ease-out, opacity 180ms ease-out; }
    .live-dock.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .live-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 9px; }
    .live-label { display: flex; align-items: center; gap: 8px; color: var(--teal); font-size: 12px; font-weight: 850; }
    .pulse { width: 8px; height: 8px; border-radius: 50%; background: #ec755e; box-shadow: 0 0 0 5px #fde6df; }
    .close-live { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
    .transcript { margin-bottom: 12px; color: var(--ink); font-size: 15px; line-height: 1.5; }
    .transcript small { color: var(--muted); font-size: 11px; }
    .live-actions { display: flex; gap: 8px; }
    .live-actions button { padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--muted); font-size: 12px; cursor: pointer; }
    .live-actions button:first-child { color: var(--teal); font-weight: 750; }
    .hotkey { margin: 9px 0 0; color: var(--quiet); font-size: 11px; }
    .toast { position: fixed; left: 50%; bottom: 25px; z-index: 6; padding: 9px 13px; border: 1px solid #cbdad7; border-radius: 8px; background: rgba(255,253,250,.98); color: var(--teal); font-size: 12px; box-shadow: 0 8px 24px rgba(30,40,50,.13); transform: translate(-50%, 10px); opacity: 0; pointer-events: none; transition: transform 160ms ease-out, opacity 160ms ease-out; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @media (max-width: 980px) { body { min-width: 0; } .app { padding: 0; } .window { min-height: 100vh; border-radius: 0; grid-template-columns: 72px minmax(0, 1fr); } .sidebar { padding: 21px 9px; } .brand { padding: 0 9px 30px; font-size: 0; } .brand::after { content: "O"; font-size: 18px; } .nav-label, .nav button span, .nav-foot { display: none; } .nav button { justify-content: center; padding: 12px 0; } main { padding: 46px 36px 30px; } }
    @media (max-width: 700px) { main { padding: 34px 24px 30px; } .intro { display: block; padding-bottom: 30px; } .listen { margin-top: 20px; } .activity-row { grid-template-columns: 42px 12px minmax(0, 1fr); gap: 10px; } .row-action { display: none; } .bottom-status { align-items: flex-start; flex-direction: column; gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="window">
      <aside class="sidebar" aria-label="OneTone 主导航">
        <div class="brand">一声 OneTone</div>
        <div class="nav-label">工作区</div>
        <nav class="nav">
          <button class="active" data-nav="首页"><i class="nav-dot"></i><span>首页</span></button>
          <button data-nav="Agent"><i class="nav-dot"></i><span>Agent</span></button>
          <button data-nav="我的习惯"><i class="nav-dot"></i><span>我的习惯</span></button>
          <button data-nav="按键设置"><i class="nav-dot"></i><span>按键设置</span></button>
          <button data-nav="虚拟键盘"><i class="nav-dot"></i><span>虚拟键盘</span></button>
          <button data-nav="语音设置"><i class="nav-dot"></i><span>语音设置</span></button>
          <button data-nav="摄像头"><i class="nav-dot"></i><span>摄像头</span></button>
          <button data-nav="数据"><i class="nav-dot"></i><span>数据</span></button>
        </nav>
        <div class="nav-foot"><strong>本地工作状态</strong>已准备好 · 最近同步刚刚完成</div>
      </aside>

      <main>
        <div class="content">
          <header class="intro">
            <div>
              <p class="eyebrow">OneTone · 工作台</p>
              <h1>现在可以开始工作。</h1>
              <p>语音、按键和当前工作环境都已准备好。需要时，OneTone 会把输入交给你正在使用的应用。</p>
            </div>
            <button class="listen" id="listen" aria-pressed="false">开始倾听</button>
          </header>

          <section class="section" aria-labelledby="activityTitle">
            <div class="section-head"><h2 id="activityTitle">最近工作</h2><button data-action="查看全部记录">查看全部</button></div>
            <div class="activity">
              <article class="activity-row"><time>14:32</time><div class="timeline"><i class="timeline-dot"></i></div><div><strong>整理首页架构</strong><p>已将输入发送到 Cursor · voice-pilot</p></div><button class="row-action" data-action="继续这项工作">继续 →</button></article>
              <article class="activity-row"><time>13:58</time><div class="timeline"><i class="timeline-dot"></i></div><div><strong>一段语音输入已完成</strong><p>识别为文字，并保留在最近记录中</p></div><button class="row-action" data-action="查看识别文字">查看 →</button></article>
              <article class="activity-row"><time>11:20</time><div class="timeline"><i class="timeline-dot warn"></i></div><div><strong>快捷键存在冲突</strong><p>开始倾听的快捷键可能被其他应用占用</p></div><button class="row-action warn" data-action="处理快捷键冲突">处理 →</button></article>
            </div>
          </section>

          <div class="empty-space" aria-hidden="true"></div>
          <footer class="bottom-status">
            <div class="status-summary"><span><i></i>语音已连接</span><span><i></i>Agent 可用</span><span><i class="warn"></i>1 项需要注意</span></div>
            <button class="status-link" data-action="查看状态详情">查看状态详情</button>
          </footer>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800); }
    document.querySelectorAll('[data-nav]').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('[data-nav]').forEach(item => item.classList.remove('active')); button.classList.add('active'); if (button.dataset.nav !== '首页') showToast(`打开${button.dataset.nav}：保持在全局导航内`); }));
    document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => showToast(`${button.dataset.action}：原型交互已触发`)));
    const listen = document.getElementById('listen');
    listen.addEventListener('click', () => {
      const active = listen.getAttribute('aria-pressed') === 'true';
      listen.setAttribute('aria-pressed', String(!active));
      listen.textContent = active ? '开始倾听' : '倾听中 · 结束';
      let dock = document.querySelector('.live-dock');
      if (!dock) { dock = document.createElement('div'); dock.className = 'live-dock'; document.body.appendChild(dock); }
      dock.innerHTML = `<div class="live-top"><span class="live-label"><i class="pulse"></i>正在倾听 · Cursor</span><button class="close-live" data-live="关闭">×</button></div><div class="transcript">我想把软件首页做得更轻一点……<br><small>实时识别中 · 结束后会进入最近工作</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>`;
      dock.classList.toggle('show', !active);
      dock.querySelectorAll('[data-live]').forEach(item => item.addEventListener('click', () => { dock.classList.remove('show'); listen.setAttribute('aria-pressed', 'false'); listen.textContent = '开始倾听'; showToast(`${item.dataset.live}：倾听已结束`); }));
    });
  </script>
</body>
</html>
