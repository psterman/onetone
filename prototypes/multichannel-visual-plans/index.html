<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone 多通道视觉方案</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18211e;background:#f1f3f1}button{font:inherit}.app{min-height:100vh}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #d7dcd9;background:#fafbf9}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:34px;height:34px;border:1px solid #a9bdb6;border-radius:11px;color:#08745b;font-weight:700}.brand b{font-size:14px}.brand small{display:block;margin-top:2px;color:#7b8581;font-size:10px}.summary{display:flex;align-items:center;gap:18px;color:#65716c;font-size:10px}.summary strong{color:#168067}.warning{display:flex;align-items:center;gap:7px;color:#96600e}.warning i{width:8px;height:8px;border-radius:50%;background:#c78219;box-shadow:0 0 0 4px #f6e6c9}.stage{min-height:calc(100vh - 64px)}.view{min-height:calc(100vh - 64px);padding:25px 32px 96px}.head{display:flex;align-items:end;justify-content:space-between;max-width:1180px;margin:auto}.head h1{margin:0;font-size:27px;letter-spacing:-1px}.head p{margin:7px 0 0;color:#707b77;font-size:11px}.head-note{padding:8px 11px;border:1px solid #d7dcd9;border-radius:9px;background:#fff;color:#65716d;font-size:9px}.surface{max-width:1180px;margin:22px auto 0;border:1px solid #d5dbd8;border-radius:18px;background:#fff;box-shadow:0 16px 45px #1b3b3010}.legend{display:flex;gap:17px;color:#79847f;font-size:9px}.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:3px;background:#27866d}.legend i.mix{background:#5372b8}.legend i.miss{background:#c78219}
/* lanes */.lane-surface{padding:18px 20px}.lane-columns,.lane{display:grid;grid-template-columns:126px repeat(5,1fr);align-items:center}.lane-columns{height:33px;color:#7d8783;font-size:9px;text-align:center}.lane{position:relative;min-height:82px;border-top:1px solid #e8ebe9}.lane-name{display:flex;align-items:center;gap:10px}.channel-icon{display:grid;place-items:center;width:32px;height:32px;border:1px solid #d4ddda;border-radius:10px;color:#217c66;background:#f8faf9}.lane-name b{font-size:11px}.lane-name small{display:block;margin-top:3px;color:#89918e;font-size:8px}.lane-cell{position:relative;z-index:2;display:grid;place-items:center}.dot{display:grid;place-items:center;width:27px;height:27px;border:1px solid #9bbeb4;border-radius:50%;background:#f7fffc;color:#217d66;font-size:10px}.dot.off{border-color:#dfe3e1;background:#fafbfa;color:#bbc1be}.dot.missing{border:1px dashed #c78219;background:#fff7e9;color:#aa6a0a;box-shadow:0 0 0 4px #fff,0 0 0 5px #edcf99}.lane.active:after{content:"";position:absolute;left:146px;right:7%;top:50%;height:2px;background:linear-gradient(90deg,#27866d 0 20%,#5372b8 20% 66%,#27866d 66%);opacity:.28}.lane-callout{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding:12px 14px;border-radius:11px;background:#f0f5f3}.recipe-line{display:flex;align-items:center;gap:8px;font-size:10px}.recipe-line span{padding:6px 8px;border-radius:7px;background:#fff}.recipe-line em{color:#71807a;font-style:normal}.lane-callout button,.repair-btn{height:32px;border:0;border-radius:8px;padding:0 13px;background:#a86609;color:#fff;font-size:10px}
/* field */.field-surface{position:relative;height:470px;overflow:hidden;background:#0b100f;border-color:#1c2a26;color:#e9f2ef}.field-grid{position:absolute;inset:0;background-image:linear-gradient(#fff0 39px,#ffffff08 40px),linear-gradient(90deg,#fff0 39px,#ffffff08 40px);background-size:40px 40px}.field-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:156px;height:156px;border:1px solid #5fc7ab;border-radius:50%;background:#101a17;box-shadow:0 0 0 14px #17312999,0 0 80px #3bd0a32b;text-align:center}.field-core b{font-size:17px}.field-core span{display:block;margin-top:6px;color:#70d7bb;font-size:9px}.field-node{position:absolute;display:grid;place-items:center;width:112px;height:112px;border:1px solid #34534b;border-radius:50%;background:#101715;color:#9ba9a4;text-align:center}.field-node b{display:block;color:#e0e9e6;font-size:11px}.field-node small{display:block;margin-top:5px;font-size:8px}.field-node.voice{left:11%;top:17%}.field-node.keys{right:11%;top:17%}.field-node.pad{left:14%;bottom:12%}.field-node.camera{right:14%;bottom:12%;border:1px dashed #c68a32;background:#211a0f}.field-node.camera b,.field-node.camera small{color:#e2b873}.field-link{position:absolute;height:2px;transform-origin:left;background:#3c6258}.field-link.active{background:#5ed3b4;box-shadow:0 0 13px #5ed3b4}.link-a{left:20%;top:29%;width:31%;transform:rotate(17deg)}.link-b{left:50%;top:50%;width:34%;transform:rotate(-31deg)}.link-c{left:24%;bottom:24%;width:30%;transform:rotate(-28deg)}.link-d{left:54%;top:54%;width:29%;transform:rotate(27deg);background:repeating-linear-gradient(90deg,#ad792c 0 7px,transparent 7px 12px)}.field-route{position:absolute;left:50%;top:17px;transform:translateX(-50%);padding:8px 12px;border:1px solid #ffffff17;border-radius:9px;background:#121918;color:#9faeaa;font-size:9px}.field-route b{color:#8ee7cf}.field-alert{position:absolute;right:18px;bottom:18px;width:205px;padding:11px;border-left:2px solid #c98520;background:#1e1a12;color:#baa98f;font-size:9px;line-height:1.5}.field-alert b{display:block;color:#e8c78f;font-size:10px}
/* matrix */.hybrid{display:grid;grid-template-columns:1.35fr .85fr;gap:15px;max-width:1180px;margin:22px auto 0}.matrix-panel,.composer{border:1px solid #d5dbd8;border-radius:16px;background:#fff}.matrix-panel{padding:17px}.matrix-head,.matrix-row{display:grid;grid-template-columns:120px repeat(4,1fr);align-items:center}.matrix-head{height:36px;color:#74807b;font-size:9px;text-align:center}.matrix-row{min-height:57px;border-top:1px solid #ebeeec}.matrix-row>b{font-size:10px}.cell{justify-self:center;min-width:55px;padding:6px 7px;border-radius:7px;background:#edf6f2;color:#277861;font-size:8px;text-align:center}.cell.no{background:#f5f6f5;color:#a0a8a4}.cell.miss{border:1px dashed #c8831c;background:#fff6e5;color:#a26407}.composer{padding:18px}.composer h2{margin:0;font-size:14px}.composer>p{margin:6px 0 17px;color:#76817d;font-size:9px}.recipe-tabs{display:flex;gap:5px}.recipe-tabs button{border:1px solid #dce1df;border-radius:7px;padding:6px 8px;background:#f7f9f8;color:#67736e;font-size:8px}.recipe-tabs button.active{border-color:#97bdb2;background:#eaf5f1;color:#176c57}.route{position:relative;margin-top:28px;padding-left:28px}.route:before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:#cbd8d3}.route-step{position:relative;margin-bottom:23px}.route-step:before{content:"";position:absolute;left:-21px;top:2px;width:11px;height:11px;border:3px solid #fff;border-radius:50%;background:#287f68;box-shadow:0 0 0 1px #8db8ac}.route-step b{font-size:10px}.route-step span{display:block;margin-top:4px;color:#7c8782;font-size:8px}.lost-combo{margin-top:8px;padding:11px;border:1px solid #e2bb7d;border-radius:10px;background:#fff8eb}.lost-combo b{color:#915b09;font-size:10px}.lost-combo p{margin:5px 0 9px;color:#8d744e;font-size:8px;line-height:1.45}
/* picker */.picker{position:fixed;bottom:22px;left:50%;z-index:20;display:flex;gap:2px;transform:translateX(-50%);padding:4px;border-radius:999px;background:#101312df;box-shadow:0 8px 30px #0004;backdrop-filter:blur(12px)}.picker button{height:29px;border:0;border-radius:999px;padding:0 13px;background:transparent;color:#909895;font-size:11px}.picker button.active{background:#ffffff1c;color:#fff}.toast{position:fixed;right:22px;bottom:22px;z-index:30;transform:translateY(15px);padding:10px 13px;border-radius:9px;background:#17231f;color:#fff;font-size:10px;opacity:0;transition:.2s}.toast.show{transform:none;opacity:1}@media(max-width:900px){.view{padding-left:18px;padding-right:18px}.hybrid{grid-template-columns:1fr}.composer{display:none}.field-node{width:92px;height:92px}.lane-columns,.lane{grid-template-columns:100px repeat(5,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><header class="topbar"><div class="brand"><span class="logo">一</span><div><b>OneTone 多通道检测室</b><small>视觉结构比较</small></div></div><div class="summary"><span><strong>3 条</strong> 可独立完成</span><span><strong>7 种</strong> 组合可用</span><span class="warning"><i></i>摄像头未校准</span></div></header><main id="stage" class="stage"></main></div><nav class="picker" aria-label="视觉方案"><button class="active">通道泳道</button><button>四象限通道场</button><button>矩阵＋单路编排</button></nav><div class="toast" role="status"></div>
<style>.link-b{left:55%;top:48%;width:28%;transform:rotate(-21deg)}.link-d{left:55%;top:54%;width:28%;transform:rotate(22deg)}</style>
<script>
const icon=(name)=>({voice:'◉',keys:'⌨',pad:'▦',camera:'⌾'})[name];
const title=(name,desc,note)=>`<section class="head"><div><h1>${name}</h1><p>${desc}</p></div><div class="head-note">${note}</div></section>`;
const lanes=()=>`<section class="view">${title('通道泳道','四条通道保持平行；行为角色有规律排列，实际组合按需点亮。','适合：完整检查与精确比较')}<div class="surface lane-surface"><div class="lane-columns"><span>通道</span><span>发起</span><span>输入</span><span>调整</span><span>确认</span><span>取消</span></div>${[['voice','语音','输入稳定',[1,1,1,1,1]],['keys','按键','响应 18 ms',[1,0,1,1,1]],['pad','Soft Pad','连接正常',[1,1,1,1,1]],['camera','摄像头','未校准',[0,0,0,0,1]]].map((r,i)=>`<div class="lane ${i===0?'active':''}"><div class="lane-name"><span class="channel-icon">${icon(r[0])}</span><div><b>${r[1]}</b><small>${r[2]}</small></div></div>${r[3].map((on,j)=>`<div class="lane-cell"><span class="dot ${i===3&&j===0?'missing':on?'':'off'}">${on?'✓':i===3&&j===0?'!':'—'}</span></div>`).join('')}</div>`).join('')}<div class="lane-callout"><div class="recipe-line"><b>当前组合</b><span>语音发起</span><em>→</em><span>Soft Pad 调整</span><em>→</em><span>按键确认</span></div><button data-action="calibrate-camera">校准摄像头</button></div></div><div class="head" style="margin-top:12px"><div class="legend"><span><i></i>可承担</span><span><i class="mix"></i>当前组合</span><span><i class="miss"></i>缺失</span></div></div></section>`;
const field=()=>`<section class="view">${title('四象限通道场','中央保持任务结果，四个通道按固定方位分布；一次只点亮一条组合。','适合：桌面控制中心与实时状态')}<div class="surface field-surface"><div class="field-grid"></div><div class="field-route">当前组合：<b>语音发起＋Soft Pad 调整＋按键确认</b></div><i class="field-link link-a active"></i><i class="field-link link-b active"></i><i class="field-link link-c active"></i><i class="field-link link-d"></i><button class="field-node voice" data-action="select-recipe"><span><b>语音</b><small>发起 · 输入</small></span></button><button class="field-node keys" data-action="select-recipe"><span><b>按键</b><small>确认 · 取消</small></span></button><button class="field-node pad" data-action="select-recipe"><span><b>Soft Pad</b><small>调整 · 执行</small></span></button><button class="field-node camera" data-action="calibrate-camera"><span><b>摄像头</b><small>未校准</small></span></button><div class="field-core"><div><b>写入完成</b><span>由 3 条通道协作</span></div></div><aside class="field-alert"><b>视觉通道暂未进入组合</b>校准后可以使用眨眼唤醒、视线选择和摇头取消。</aside></div></section>`;
const row=(name,cells)=>`<div class="matrix-row"><b>${name}</b>${cells.map(c=>`<span class="cell ${c==='—'?'no':c==='未校准'?'miss':''}">${c}</span>`).join('')}</div>`;
const hybrid=()=>`<section class="view">${title('矩阵＋单路编排','左侧稳定展示全部实际状态；右侧只解释当前选中的一种混排。','推荐：最清晰地兼顾总览与组合')}<div class="hybrid"><section class="matrix-panel"><div class="matrix-head"><span>行为能力</span><span>语音</span><span>按键</span><span>Soft Pad</span><span>摄像头</span></div>${row('发起',["可用","可用","可用","未校准"])}${row('输入',["可用","—","可用","—"])}${row('调整',["可用","可用","可用","—"])}${row('确认',["可用","可用","可用","未校准"])}${row('取消',["可用","可用","可用","可用"])}</section><aside class="composer"><h2>当前组合</h2><p>一次只展示一条真实可用的操作路径。</p><div class="recipe-tabs"><button class="active" data-action="select-recipe">精准写入</button><button data-action="select-recipe">快速确认</button><button data-action="select-recipe">免手操作</button></div><div class="route"><div class="route-step"><b>语音 · 发起并输入</b><span>麦克风输入稳定</span></div><div class="route-step"><b>Soft Pad · 精准调整</b><span>落点与参数可用</span></div><div class="route-step"><b>按键 · 确认写入</b><span>响应 18 ms</span></div></div><div class="lost-combo"><b>缺少 2 种视觉组合</b><p>摄像头未校准，免手唤醒和视线选择暂不可用。</p><button class="repair-btn" data-action="calibrate-camera">立即校准</button></div></aside></div></section>`;
const views=[lanes,field,hybrid],stage=document.getElementById('stage'),buttons=[...document.querySelectorAll('.picker button')],toast=document.querySelector('.toast');let current=0,t;
function mount(i=current){current=i;stage.innerHTML=views[i]();buttons.forEach((b,j)=>b.classList.toggle('active',i===j));stage.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action,el))}
function say(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(t);t=setTimeout(()=>toast.classList.remove('show'),1700)}function act(action,el){if(action==='calibrate-camera')say('打开摄像头校准：完成后将新增 2 种视觉组合');else{el.parentElement?.querySelectorAll('button').forEach(b=>b.classList.remove('active'));el.classList.add('active');say('已切换组合，仅显示这一条实际路径')}}buttons.forEach((b,i)=>b.onclick=()=>mount(i));const q=Math.max(0,Math.min(2,(+new URLSearchParams(location.search).get('v')||1)-1));mount(q);
</script></body></html>
