<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 首页闭环原型 v2</title>
  <style>
    :root{--paper:#fbfaf7;--nav:#f0f2f2;--ink:#18263b;--muted:#728096;--quiet:#a7b0bd;--line:#e7e6e1;--teal:#087f77;--teal-dark:#05635d;--teal-soft:#e1f2ee;--blue:#edf2fa;--amber:#a76521;--amber-soft:#fff1df;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:820px;background:#e1e5e6;color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.product{width:100%;max-width:1400px;min-height:calc(100vh - 40px);margin:0 auto;overflow:hidden;border:1px solid #d4d8da;border-radius:16px;background:var(--paper);box-shadow:0 18px 52px rgba(35,44,55,.08)}.product>div{width:100%;min-width:0;min-height:calc(100vh - 40px);display:grid;grid-template-columns:216px minmax(0,1fr)}
    .sidebar{display:flex;flex-direction:column;padding:25px 14px;background:var(--nav);border-right:1px solid #dfe2e2}.brand{padding:0 12px 34px;color:var(--teal);font-size:15px;font-weight:850;letter-spacing:.05em}.nav-label{padding:0 12px 9px;color:#a0a8b1;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:#647184;text-align:left}.nav button:hover{background:rgba(255,255,255,.65);color:var(--ink)}.nav button.active{background:var(--paper);color:var(--ink);font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#aab4bf}.nav button.active .dot{background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}.nav-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid #dcdfdf;color:var(--muted);font-size:11px;line-height:1.6}.nav-foot strong{display:block;color:var(--ink);font-size:12px}
    main{min-width:0;padding:43px clamp(30px,7vw,112px) 34px}.content{width:100%;max-width:930px;margin:0 auto}.eyebrow{margin:0 0 10px;color:var(--teal);font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.context-line{display:flex;align-items:center;gap:9px;margin:0;color:var(--muted);font-size:12px}.context-line strong{color:var(--ink)}.context-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}h1{margin:0 0 12px;font-size:clamp(30px,4vw,52px);line-height:1.1;letter-spacing:-.055em}h2{margin:0;font-size:15px}h3{margin:0;font-size:15px}p{line-height:1.6}.muted{color:var(--muted)}.primary{padding:12px 17px;border:0;border-radius:9px;background:var(--teal);color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(8,127,119,.15)}.primary:hover{background:var(--teal-dark)}.secondary{padding:10px 13px;border:1px solid #cfdedb;border-radius:8px;background:transparent;color:var(--teal-dark);font-weight:750}.secondary:hover{background:var(--teal-soft)}.text-btn{padding:0;border:0;background:transparent;color:var(--teal);font-size:12px;font-weight:800}.text-btn:hover{text-decoration:underline}.rule{height:1px;background:var(--line);margin:27px 0}.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}.head-row p{max-width:610px;margin:0;color:var(--muted);font-size:15px}
    .context-strip{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:14px 16px;border:1px solid #e0e2e2;border-radius:10px;background:#fff}.context-strip .left{display:flex;align-items:center;gap:10px}.check{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--teal-soft);color:var(--teal);font-weight:900}.context-strip strong{font-size:13px}.context-strip small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.context-actions{display:flex;align-items:center;gap:12px;white-space:nowrap}.context-actions button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}
    .prompt{margin-top:22px;padding:21px;border:1px solid #cfe5df;border-radius:13px;background:linear-gradient(135deg,#fbfffd,#f2f9f6)}.prompt-label{margin:0 0 10px;color:var(--teal-dark);font-size:13px;font-weight:850}.input{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 15px;border:1px dashed #a6cec6;border-radius:9px;background:#fff;color:#9aa6b4}.input span:last-child{margin-left:auto;color:var(--teal);font-size:20px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chips button{padding:6px 9px;border:1px solid #d5e4e0;border-radius:999px;background:#fff;color:var(--muted);font-size:11px}.chips button:hover{color:var(--teal);border-color:#a4cbc4}
    .preview{margin-top:20px;padding:18px;border:1px solid #d7e0ed;border-radius:12px;background:var(--blue)}.preview-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:13px}.preview-top span{color:#5573a0;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.preview p{margin:0 0 13px;color:#53627a;font-size:12px}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.route div{padding:10px;border:1px solid #d6e0ee;border-radius:8px;background:rgba(255,255,255,.56)}.route small{display:block;margin-bottom:4px;color:#8190a6;font-size:10px}.route strong{font-size:12px}.preview-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:14px}.preview-actions button{padding:8px 11px;border-radius:7px;font-size:12px}.preview-actions .confirm{border:0;background:var(--teal);color:#fff;font-weight:800}.preview-actions .edit{border:1px solid #c6d5e8;background:transparent;color:#58739d}
    .section{padding-top:27px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:15px;margin-bottom:13px}.activity{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:53px 13px minmax(0,1fr) auto;align-items:start;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}.row time{padding-top:2px;color:var(--quiet);font-size:11px}.track{position:relative;display:flex;justify-content:center;min-height:35px}.track:before{content:"";position:absolute;top:10px;bottom:-25px;width:1px;background:#d6e5e2}.row:last-child .track:before{display:none}.node{position:relative;z-index:1;width:9px;height:9px;margin-top:3px;border:2px solid var(--paper);border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px #a6d2cd}.node.warn{background:var(--amber);box-shadow:0 0 0 1px #e7bf8d}.row strong{display:block;margin-bottom:4px;font-size:13px}.row p{margin:0;color:var(--muted);font-size:12px}.row .text-btn{align-self:center}.warn{color:var(--amber)}
    .rich-record{display:grid;grid-template-columns:65px minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.rich-record time{color:var(--quiet);font-size:11px}.rich-record h3{margin-bottom:5px}.rich-record p{margin:0;color:var(--muted);font-size:12px}.record-meta{color:var(--teal);font-size:11px;font-weight:800}.record-meta.warn{color:var(--amber)}
    .work-state{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;margin-top:25px}.work-card{padding:20px;border:1px solid #d5e0ed;border-radius:12px;background:var(--blue)}.work-card .kicker{margin:0 0 9px;color:#617ba4;font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.work-card h3{font-size:19px;margin-bottom:8px}.work-card p{margin:0;color:#64738b;font-size:13px}.checkpoint{margin-top:15px;padding-top:14px;border-top:1px solid #d6e0ed}.checkpoint strong{display:block;margin-bottom:5px;font-size:12px}.checkpoint span{color:#64738b;font-size:12px}.next{padding:20px;border:1px solid #d5e8e3;border-radius:12px;background:#f4fbf8}.next h3{margin-bottom:8px}.next p{margin:0 0 17px;color:var(--muted);font-size:13px}.next-actions{display:flex;gap:8px}
    .guide{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:54px;align-items:start;margin-top:22px}.guide-copy{max-width:590px;color:var(--muted);font-size:15px}.guide-flow{display:grid;gap:0;margin-top:23px;border-top:1px solid var(--line)}.flow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.flow-num{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-size:12px;font-weight:850}.flow strong{display:block;margin-bottom:4px;font-size:13px}.flow p{margin:0;color:var(--muted);font-size:12px}.first-box{padding:20px;border:1px solid #cfe5df;border-radius:13px;background:#f4fbf8}.first-box h2{margin-bottom:8px}.first-box p{margin:0 0 17px;color:var(--muted);font-size:13px}.first-context{margin-top:14px;padding-top:13px;border-top:1px solid #d8e9e4;color:var(--muted);font-size:11px}.first-context strong{color:var(--ink)}
    .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:35px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.signals{display:flex;gap:15px;flex-wrap:wrap}.signals span{display:inline-flex;align-items:center;gap:6px}.signals i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.signals i.warn{background:var(--amber)}
    .live{position:fixed;left:50%;bottom:24px;z-index:5;width:min(680px,calc(100vw - 48px));padding:15px 17px;border:1px solid #b8d8d1;border-radius:13px;background:rgba(250,255,253,.97);box-shadow:0 14px 38px rgba(24,67,61,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-label{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:12px;font-weight:850}.pulse{width:8px;height:8px;border-radius:50%;background:#ec755e;box-shadow:0 0 0 5px #fde6df}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:12px;font-size:15px;line-height:1.5}.transcript small{color:var(--muted);font-size:11px}.live-actions{display:flex;gap:8px}.live-actions button{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:12px}.hotkey{margin:9px 0 0;color:var(--quiet);font-size:11px}.toast{position:fixed;left:50%;bottom:24px;z-index:6;padding:9px 13px;border:1px solid #cbdad7;border-radius:8px;background:#fffdfa;color:var(--teal);font-size:12px;box-shadow:0 8px 24px rgba(30,40,50,.13);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    .picker{position:fixed;bottom:24px;left:50%;z-index:10;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24);font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transform:translateX(-50%);user-select:none}.picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.picker[data-ready] .picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.picker button{position:relative;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);cursor:pointer}.picker button:hover{color:#fff}.picker button.active{color:#fff}.picker .divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.picker .replay{padding:0 10px;font-size:14px}
    @media(max-width:980px){body{min-width:0}.app{padding:0}.product{min-height:100vh;border-radius:0}.product>div{min-height:100vh;grid-template-columns:72px minmax(0,1fr)}.sidebar{padding:21px 9px}.brand{padding:0 9px 30px;font-size:0}.brand:after{content:"O";font-size:18px}.nav-label,.nav button span,.nav-foot{display:none}.nav button{justify-content:center;padding:12px 0}main{padding:37px 33px 30px}.guide{grid-template-columns:1fr;gap:25px}}
    @media(max-width:660px){.head-row{display:block}.head-row .primary{margin-top:20px}.row{grid-template-columns:42px 12px minmax(0,1fr)}.row .text-btn{display:none}.route,.work-state{grid-template-columns:1fr}.context-strip{align-items:flex-start;flex-direction:column}.foot{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app"><div class="product" id="product"></div></div>
  <nav class="picker" id="picker" aria-label="首页四个设计维度"><span class="picker-highlight" aria-hidden="true"></span><button class="active" aria-current="true">A · 需求方案</button><button>B · 完整记录</button><button>C · 当前工作</button><button>D · 起跑线</button><span class="divider" aria-hidden="true"></span><button class="replay" aria-label="重新播放">↻</button></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const nav=['首页','Agent','我的习惯','按键设置','虚拟键盘','语音设置','摄像头','数据'];
    const rows=[['14:32','整理首页架构','已交给 Cursor · voice-pilot','继续 →',''],['13:58','一段语音输入已完成','已转换为文字，并保留在最近工作','查看 →',''],['11:20','快捷键存在冲突','开始倾听可能被其他应用占用','处理 →','warn']];
    function side(){return `<aside class="sidebar"><div class="brand">一声 OneTone</div><div class="nav-label">工作区</div><nav class="nav">${nav.map((n,i)=>`<button class="${i===0?'active':''}" data-nav="${n}"><i class="dot"></i><span>${n}</span></button>`).join('')}</nav><div class="nav-foot"><strong>本地工作状态</strong>当前环境已确认 · 最近同步刚刚完成</div></aside>`}
    function timeline(){return `<div class="activity">${rows.map(r=>`<article class="row"><time>${r[0]}</time><div class="track"><i class="node ${r[4]}"></i></div><div><strong>${r[1]}</strong><p>${r[2]}</p></div><button class="text-btn ${r[4]}" data-action="${r[3].replace(' →','')}">${r[3]}</button></article>`).join('')}</div>`}
    function context(){return `<div class="context-strip"><div class="left"><span class="check">✓</span><div><strong>当前工作环境已确认</strong><small>Cursor · voice-pilot</small></div></div><div class="context-actions"><button data-action="更换工作环境">更换</button></div></div>`}
    function foot(){return `<footer class="foot"><div class="signals"><span><i></i>当前环境已确认</span><span><i></i>最近记录已保存</span><span><i class="warn"></i>1 项需要注意</span></div><button class="text-btn" data-action="查看状态详情">查看状态详情</button></footer>`}
    function shell(body,cls){return `<div class="${cls}">${side()}<main><div class="content">${body}</div></main></div>`}
    function commonPrompt(){return `<div class="prompt"><p class="prompt-label">告诉 OneTone 你想完成什么</p><div class="input" data-action="打开输入"><span>例如：帮我整理这段内容</span><span>⌁</span></div><div class="chips"><button data-action="继续上次工作">继续上次工作</button><button data-action="整理一段内容">整理一段内容</button><button data-action="把这句话发给 Cursor">把这句话发给 Cursor</button></div></div>`}
    function preview(){return `<div class="preview"><div class="preview-top"><span>执行前预览</span><button class="text-btn" data-action="修改需求">修改需求</button></div><p>我理解为：整理 voice-pilot 首页的视觉结构。</p><div class="route"><div><small>交给</small><strong>Cursor Agent</strong></div><div><small>目标</small><strong>当前项目</strong></div><div><small>记录</small><strong>保存为工作记录</strong></div></div><div class="preview-actions"><button class="edit" data-action="修改需求">修改需求</button><button class="confirm" data-action="确认并开始">确认并开始</button></div></div>`}
    function A(){return shell(`<div class="head-row"><div><p class="eyebrow">OneTone · 需求入口</p><h1>你现在想完成什么？</h1><p>不用选择输入方式，告诉 OneTone 一件事。它会先说明将交给谁、做什么，再开始执行。</p></div><button class="primary" data-listen>说出你的想法</button></div>${context()}${commonPrompt()}${preview()}<section class="section"><div class="section-head"><h2>最近工作</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div>${timeline()}</section>${foot()}`,'variant-a')}
    function B(){return shell(`<p class="eyebrow">OneTone · 完整工作记录</p><h1>回来时，你能接着做。</h1><p class="muted" style="max-width:650px;margin:0;font-size:15px">这里保留每项工作的输入、执行对象、结果和停点，不需要重新回忆刚才发生了什么。</p>${context()}<section class="section"><div class="section-head"><h2>最近工作</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div><div class="activity"><article class="rich-record"><time>刚刚<br>14:32</time><div><h3>整理首页架构</h3><p>输入：把软件首页重新规划成从用户需求开始</p><p>结果：生成四个原型，当前停在需求入口方案</p></div><span class="record-meta">可继续</span></article><article class="rich-record"><time>今天<br>13:58</time><div><h3>一段语音输入</h3><p>识别：将语音转换为文字，并发送给 Cursor</p><p>结果：已保存到最近工作</p></div><span class="record-meta">已完成</span></article><article class="rich-record"><time>今天<br>11:20</time><div><h3>快捷键存在冲突</h3><p>影响：开始倾听可能被其他应用占用</p><p>建议：处理后再继续使用</p></div><span class="record-meta warn">需处理</span></article></div></section><div class="preview" style="margin-top:27px"><div class="preview-top"><span>继续上次工作</span><button class="text-btn" data-action="查看判断依据">查看判断依据</button></div><p>上次停在：比较首页四个需求入口方案。</p><div class="preview-actions"><button class="confirm" data-action="继续这项工作">继续这项工作</button></div></div>${foot()}`,'variant-b')}
    function C(){return shell(`<p class="eyebrow">OneTone · 当前工作</p>${context()}<header style="margin-top:32px"><h1>你正在处理 voice-pilot 的首页架构。</h1><p class="muted" style="max-width:650px;margin:0;font-size:15px">OneTone 已经知道当前应用和项目，接下来可以直接从上次停下的地方继续。</p></header><div class="work-state"><div class="work-card"><p class="kicker">当前会话</p><h3>首页视觉重规划</h3><p>正在比较“需求入口、完整记录、当前工作、起跑线”四个首页维度。</p><div class="checkpoint"><strong>上次停在</strong><span>确认首页需要先呈现用户需求，再分配 Agent。</span></div></div><div class="next"><h3>下一步可以做什么？</h3><p>继续完善“输入需求 → Agent 预览 → 确认执行”的首页流程。</p><div class="next-actions"><button class="primary" data-action="继续当前工作">继续当前工作</button><button class="secondary" data-action="查看完整记录">查看记录</button></div></div></div><section class="section"><div class="section-head"><h2>最近工作</h2><button class="text-btn" data-action="查看全部记录">查看全部</button></div>${timeline()}</section>${foot()}`,'variant-c')}
    function D(){return shell(`<div class="guide"><div><p class="eyebrow">OneTone · 第一次行动</p><h1>现在就做一件小事。</h1><p class="guide-copy">你不需要先学习通道或 Agent。直接告诉 OneTone 你想完成什么，它会在执行前把计划说清楚。</p>${commonPrompt()}${preview()}</div><div><div class="first-box"><h2>你会看到什么？</h2><p>说完后，OneTone 会确认当前项目、执行对象和下一步动作。</p><button class="primary" data-listen>说出第一句话</button><div class="first-context">当前环境：<strong>Cursor · voice-pilot</strong></div></div><div class="small-record" style="margin-top:29px;padding-top:21px;border-top:1px solid var(--line)"><h2>完成后会留下记录</h2><p class="muted" style="font-size:12px">以后回来，你可以看到自己说了什么、做了什么、停在哪里。</p></div></div></div>${foot()}`,'variant-d')}
    const variants=[A,B,C,D],product=document.getElementById('product'),picker=document.getElementById('picker'),items=[...picker.querySelectorAll('button:not(.replay)')],highlight=picker.querySelector('.picker-highlight'),toast=document.getElementById('toast');let current=0,timer;
    function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function move(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}
    function mount(i){product.innerHTML=variants[i]();product.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{product.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.nav!=='首页')notice(`打开${b.dataset.nav}：保持在全局导航内`)}));product.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：原型交互已触发`)));product.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',listen))}
    function listen(){let dock=document.querySelector('.live');if(!dock){dock=document.createElement('div');dock.className='live';document.body.appendChild(dock)}dock.innerHTML='<div class="live-top"><span class="live-label"><i class="pulse"></i>正在倾听 · Cursor</span><button class="close" data-live="关闭">×</button></div><div class="transcript">我想把首页做得更轻一点……<br><small>实时识别中 · 结束后会进入最近工作</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：倾听已结束`)}))}
    function active(i){if(i<0||i>=4)return;current=i;items.forEach((b,j)=>{b.classList.toggle('active',j===i);if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});move();const u=new URL(location);u.searchParams.set('v',String.fromCharCode(65+i));history.replaceState(null,'',u);mount(i)}items.forEach((b,i)=>b.addEventListener('click',()=>active(i)));picker.querySelector('.replay').addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();if(k>='A'&&k<='D')active(k.charCodeAt(0)-65);else if(e.key==='ArrowRight')active((current+1)%4);else if(e.key==='ArrowLeft')active((current+3)%4);else if(k==='R')mount(current)});const p=new URLSearchParams(location.search).get('v');active(p&&/^[A-D]$/.test(p)?p.charCodeAt(0)-65:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
