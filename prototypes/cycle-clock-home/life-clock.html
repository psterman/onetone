<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OneTone · 生命时钟</title>
  <style>
    :root { color-scheme:light; --paper:#f1eee6; --ink:#20211e; --muted:#74766e; --line:#cbc8bc; --red:#d95e47; --blue:#456b72; --green:#809a69; }
    *{box-sizing:border-box} body{margin:0;min-height:100dvh;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:linear-gradient(110deg,#f4f1e9,#ebe8df)}
    button{font:inherit;color:inherit}.page{max-width:1440px;margin:auto;padding:25px clamp(22px,4vw,58px) 50px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{font-weight:700;letter-spacing:.08em}.top nav{display:flex;gap:8px}.top button{border:0;background:transparent;padding:8px 12px;color:var(--muted);cursor:pointer}.top button.active{color:var(--ink);border-bottom:1px solid var(--ink)}
    .hero{display:grid;grid-template-columns:minmax(330px,.72fr) minmax(540px,1.28fr);gap:clamp(32px,7vw,110px);align-items:center;min-height:calc(100dvh - 105px)}
    .copy .kicker{font-size:12px;letter-spacing:.18em;color:var(--red);margin:0 0 18px}.copy h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(44px,6vw,86px);font-weight:400;letter-spacing:-.06em;line-height:.96;margin:0 0 24px}.copy>p{color:var(--muted);font-size:15px;line-height:1.8;max-width:430px}.now{margin-top:34px;padding-top:19px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}.now span{font-size:12px;color:var(--muted)}.now strong{display:block;font-size:20px;margin-top:6px;font-weight:560}.now button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:50%;width:58px;height:58px;cursor:pointer}
    .cosmos{position:relative;min-height:650px;display:grid;place-items:center}.ring{position:absolute;border-radius:50%;border:1px solid var(--line)}.ring.outer{width:min(48vw,610px);aspect-ratio:1}.ring.mid{width:min(38vw,480px);aspect-ratio:1;border-style:dashed}.ring.inner{width:min(26vw,330px);aspect-ratio:1;background:#eeeae0;box-shadow:0 18px 65px #655f4c18}.ring::before{content:"";position:absolute;inset:-5px;border-radius:inherit;border-top:9px solid var(--red);transform:rotate(38deg)}.ring.mid::before{border-top-color:var(--blue);transform:rotate(158deg)}.ring.inner::before{border-top-color:var(--green);transform:rotate(278deg)}
    .core{position:relative;z-index:3;text-align:center;width:180px}.core small{display:block;color:var(--muted);font-size:11px;letter-spacing:.12em}.core strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:34px;font-weight:400;margin:9px 0}.core p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.node{position:absolute;z-index:4;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 13px;box-shadow:0 9px 30px #49443410}.node b{display:block;font-size:12px}.node span{font-size:11px;color:var(--muted)}.n1{top:8%;left:45%}.n2{right:0;top:42%}.n3{bottom:8%;left:43%}.n4{left:2%;top:43%}
    .legend{position:absolute;left:7%;bottom:4%;display:grid;gap:9px;font-size:11px;color:var(--muted)}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:16px;height:3px;background:var(--red)}.legend div:nth-child(2) i{background:var(--blue)}.legend div:nth-child(3) i{background:var(--green)}
    @media(max-width:950px){.hero{grid-template-columns:1fr;padding-top:50px}.cosmos{min-height:560px}.ring.outer{width:min(88vw,540px)}.ring.mid{width:min(70vw,430px)}.ring.inner{width:min(48vw,300px)}.node.n2{right:2%}.copy h1{max-width:700px}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><div class="brand">一声 · ONETONE</div><nav><button class="active">生命时钟</button><button>此刻</button><button>年轮</button><button>归档</button></nav></header>
    <main class="hero">
      <section class="copy">
        <p class="kicker">EVERYTHING RETURNS</p>
        <h1>万物归宗，<br>此刻有迹。</h1>
        <p>生命不是一条无限延长的时间线，而是一组彼此嵌套的周期。每个行动都从某处出发，在变化中留下轨迹，再回到一个更清楚的起点。</p>
        <div class="now"><div><span>你现在所在的位置</span><strong>构建期 · 第二回合 · 第 19 天</strong></div><button id="enter" aria-label="进入当前周期">进入</button></div>
      </section>
      <section class="cosmos" aria-label="生命周期同心时钟">
        <div class="ring outer"></div><div class="ring mid"></div><div class="ring inner"></div>
        <div class="core"><small>THE PRESENT</small><strong>此刻</strong><p>唯一能够行动的<br>真实起跑线</p></div>
        <div class="node n1"><b>生长</b><span>学习 · 扩张 · 相遇</span></div>
        <div class="node n2"><b>创造</b><span>投入 · 成形 · 交付</span></div>
        <div class="node n3"><b>归藏</b><span>回顾 · 休息 · 沉淀</span></div>
        <div class="node n4"><b>再启</b><span>选择 · 对齐 · 出发</span></div>
        <div class="legend"><div><i></i>人生阶段 · 年</div><div><i></i>主题回合 · 月</div><div><i></i>行动周期 · 日</div></div>
      </section>
    </main>
  </div>
  <script>document.querySelector('#enter').addEventListener('click',()=>document.querySelector('.core p').innerHTML='今天只做一件事<br>完成首页双原型');</script>
</body>
</html>
