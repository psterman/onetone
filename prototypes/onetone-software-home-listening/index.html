<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · 软件首页 · 听见</title>
  <style>
    :root{--bg:#e9ece9;--paper:#fbfaf7;--panel:#fffefa;--soft:#f1f3f0;--ink:#1b2a3e;--muted:#718094;--faint:#a6afb9;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--amber:#a36525;--amber-soft:#fff0dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:294px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .listen-panel{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.listen-head{padding:24px 20px 15px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:24px;color:var(--teal);font-size:14px;font-weight:850}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.listen-title{display:flex;justify-content:space-between;align-items:center}.listen-title h1{margin:0;font-size:20px;letter-spacing:-.03em}.listen-title button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{display:flex;align-items:center;gap:8px;margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.listen-list{min-height:0;overflow:auto;padding:0 10px 15px}.day{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.record{display:block;width:100%;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.record:hover{background:#fff}.record.active{border-color:var(--teal-line);background:#fffefa;box-shadow:0 2px 6px rgba(30,50,55,.04)}.record-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.record-title{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.record-time{color:var(--faint);font-size:10px;white-space:nowrap}.record-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.record-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}.record-dot.done{background:#7792b5}.record-dot.warn{background:var(--amber)}.listen-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.listen-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 48px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:930px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:13px;color:var(--muted);font-size:10px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-weight:800}.top-actions button{border:0;background:transparent;color:var(--muted);font-size:10px}.hero{margin-top:76px}.eyebrow{margin:0 0 10px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.hero h2{max-width:690px;margin:0 0 12px;font-size:clamp(30px,4vw,52px);line-height:1.08;letter-spacing:-.06em}.hero p{max-width:630px;margin:0;color:var(--muted);font-size:14px;line-height:1.65}.input-zone{margin-top:28px;padding:20px;border:1px solid var(--teal-line);border-radius:13px;background:linear-gradient(135deg,#f8fffc,#f1f8f5)}.input-label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--teal-dark,#05635d);font-size:12px;font-weight:850}.input-label span{color:var(--muted);font-size:10px;font-weight:500}.input-box{display:flex;align-items:center;gap:11px;min-height:59px;padding:0 15px;border:1px dashed #a6cec6;border-radius:9px;background:#fff;color:#97a4b2;font-size:14px}.input-box .mic{margin-left:auto;color:var(--teal);font-size:20px}.examples{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.examples button{padding:6px 9px;border:1px solid #d5e4e0;border-radius:999px;background:#fff;color:var(--muted);font-size:10px}.examples button:hover{color:var(--teal);border-color:#a4cbc4}
    .current{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;margin-top:25px}.recent{padding-top:1px}.section-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px}.section-label strong{font-size:13px}.section-label button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}.recent-line{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.recent-line .dot{width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}.recent-line strong{display:block;margin-bottom:4px;font-size:12px}.recent-line p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.recent-line button{margin-left:auto;padding:0;border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}.ready{padding:15px;border:1px solid var(--line);border-radius:10px;background:#fff}.ready-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ready-head i{width:7px;height:7px;border-radius:50%;background:var(--teal)}.ready-head strong{font-size:12px}.ready p{margin:0;color:var(--muted);font-size:10px;line-height:1.55}.ready button{margin-top:9px;padding:0;border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}
    .bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.signals{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.signals span{display:inline-flex;align-items:center;gap:5px}.signals i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.signals i.warn{background:var(--amber)}.bottom button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}.live{position:fixed;left:50%;bottom:24px;z-index:20;width:min(630px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 14px 38px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live.show{transform:translate(-50%,0);opacity:1}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:7px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:10px;font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:10px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:21;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1050px){main{padding:25px 32px}.current{grid-template-columns:1fr 205px}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.hero{margin-top:42px}.top-actions{display:none}.current{display:block}.ready{margin-top:18px}.bottom{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const records=[
      {group:'今天',title:'整理首页的交互流程',time:'14:32',meta:'已完成一次输入',kind:'done',text:'已把语音内容送到当前使用的应用。'},
      {group:'今天',title:'回复一段文字',time:'13:58',meta:'保留在当前输入框',kind:'done',text:'文字已识别，等待你决定是否发送。'},
      {group:'昨天',title:'继续首页设计',time:'昨天',meta:'上次停在这里',kind:'warn',text:'可以继续上一件工作。'},
      {group:'更早',title:'第一次使用 OneTone',time:'周一',meta:'语音输入',kind:'done',text:'完成了一次从说话到输入的体验。'}
    ];
    let selected=0;
    function panel(){let last='';return `<aside class="listen-panel"><div class="listen-head"><div class="brand"><span class="mark">O</span>OneTone</div><div class="listen-title"><h1>听见</h1><button data-action="新建输入">＋ 新输入</button></div><div class="search">⌕　搜索最近输入</div></div><div class="listen-list">${records.map((r,i)=>{const group=r.group!==last;last=r.group;return `${group?`<div class="day">${r.group}</div>`:''}<button class="record ${i===selected?'active':''}" data-record="${i}"><div class="record-top"><span class="record-title">${r.title}</span><span class="record-time">${r.time}</span></div><div class="record-meta"><i class="record-dot ${r.kind}"></i>${r.meta}</div></button>`}).join('')}</div><div class="listen-foot"><strong>听见是 OneTone 的记忆入口</strong><br>这里保存你通过 OneTone 完成过的输入和工作节点。</div></aside>`}
    function main(){const r=records[selected];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>OneTone · 当前工作现场</strong><small>当前应用：Cursor · voice-pilot</small></div></div><div class="top-actions"><span class="state">输入已准备好</span><span>本地记录</span><button data-action="打开系统设置">系统</button></div></header><section class="hero"><p class="eyebrow">软件首页</p><h2>现在，你想做什么？</h2><p>直接说出一件事。OneTone 会把它送到你正在使用的应用，并把这次输入留在左侧“听见”里。</p><div class="input-zone"><div class="input-label">说出或输入一件事 <span>不需要先选择通道</span></div><div class="input-box" data-listen><span>例如：帮我整理这段内容</span><span class="mic">⌁</span></div><div class="examples"><button data-action="继续上次工作">继续上次工作</button><button data-action="整理一段内容">整理一段内容</button><button data-action="把这句话发给当前应用">把这句话发给当前应用</button></div></div></section><div class="current"><section class="recent"><div class="section-label"><strong>最近一次输入</strong><button data-action="查看完整记录">查看完整记录</button></div><div class="recent-line"><i class="dot"></i><div><strong>${r.title}</strong><p>${r.text}</p></div><button data-action="继续这件事">继续 →</button></div></section><aside class="ready"><div class="ready-head"><i></i><strong>可以开始</strong></div><p>当前窗口已识别，输入方式已准备好。你只需要表达想做的事。</p><button data-action="查看准备依据">查看依据 →</button></aside></div><footer class="bottom"><div class="signals"><span><i></i>当前窗口已识别</span><span><i></i>麦克风可用</span><span><i></i>按键与 Soft Pad 可用</span></div><button data-action="查看输入记录">查看输入记录 →</button></footer></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=panel()+main();win.querySelectorAll('[data-record]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.record);mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：首页操作已触发`)));win.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',listen))}function listen(){let d=document.querySelector('.live');if(!d){d=document.createElement('div');d.className='live';document.body.appendChild(d)}d.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · 当前应用</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想继续完善首页的会话轨迹……<br><small>实时识别中 · 结束后会保存到左侧“听见”</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';d.classList.add('show');d.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{d.classList.remove('show');notice(`${b.dataset.live}：输入记录已更新`)}))}mount();
  </script>
</body>
</html>
