<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone workflow pattern comparison</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8eff1;background:#101417}*{box-sizing:border-box}body{margin:0}.screen{min-height:100dvh;padding:24px 5vw 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#809198;font-size:13px}.brand{color:#eef5f6;font-weight:700;display:flex;gap:8px;align-items:center}.mark{width:24px;height:24px;border:1px solid #5ac9d8;border-radius:8px;display:grid;place-items:center;color:#5ac9d8}.content{max-width:1000px;margin:7vh auto 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#62bdc9}.title{font-size:clamp(32px,5vw,62px);letter-spacing:-.05em;line-height:1.05;margin:14px 0}.desc{color:#93a2a8;max-width:600px;font-size:16px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:34px}.panel{background:#171f24;border:1px solid #2a3a40;border-radius:16px;padding:20px}.panel h3{font-size:14px;margin:0 0 16px}.line{height:1px;background:#2a383e;margin:15px 0}.muted{color:#829197;font-size:13px}.accent{color:#67cad5}.item{display:flex;gap:10px;align-items:start;margin:15px 0;font-size:14px}.dot{width:8px;height:8px;background:#5ac9d8;border-radius:50%;margin-top:6px;flex:0 0 auto}.button{border:0;border-radius:8px;background:#5ac9d8;color:#091316;padding:10px 14px;font-weight:700;cursor:pointer}.alt{background:#26373d;color:#d5e4e7}.actions{display:flex;gap:8px;flex-wrap:wrap}.chat{margin-top:18px}.bubble{padding:12px 14px;border-radius:12px;line-height:1.55;margin:12px 0;font-size:14px}.user{background:#233239;margin-left:16%}.agent{border:1px solid #30464c;background:#17262b}.step{border-left:2px solid #56c7d5;padding:6px 0 6px 13px;margin:12px 0}.step b{display:block;font-size:13px}.step span{font-size:12px;color:#94a5a9}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.flow .step{border:1px solid #31464c;border-left:0;border-radius:10px;padding:12px}.flow .step.active{border-color:#5ac9d8;background:#1b3035}.terminal{font:12px/1.7 ui-monospace,monospace;color:#9bb2b5;background:#0c1113;border-radius:10px;padding:14px;min-height:150px}.terminal .ok{color:#68d198}.diff{font:12px/1.7 ui-monospace,monospace}.add{color:#6fd39c}.del{color:#dc8888}.canvas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0}.node{border:1px solid #38525a;border-radius:10px;padding:13px;background:#1a282d;font-size:13px}.node.active{border-color:#68d1dc;box-shadow:0 0 0 3px #57c9d31c}.arrow{color:#698187}.picker{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:#090b0cdd;padding:5px;border-radius:99px;box-shadow:0 8px 30px #0008}.picker button{border:0;border-radius:99px;background:transparent;color:#98a1a5;padding:9px 13px;cursor:pointer}.picker button.active{background:#334149;color:#fff}@media(max-width:720px){.content{margin-top:40px}.grid{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.user{margin-left:0}}
</style></head><body><main id="root"></main><nav class="picker"><button class="active">A 项目会话</button><button>B 任务流程</button><button>C 运行监督</button><button>D 计划画布</button></nav><script>
const root=document.getElementById('root'),buttons=[...document.querySelectorAll('.picker button')];function base(label,title,desc,body){return `<section class="screen"><header class="top"><div class="brand"><span class="mark">一</span>OneTone</div><span>OneTone / ${label}</span></header><div class="content"><div class="eyebrow">${label}</div><h1 class="title">${title}</h1><p class="desc">${desc}</p>${body}</div></section>`}const views=[()=>base('A 项目会话','从项目开始，而不是从空白开始。','恢复当前项目、最近会话和上下文，然后继续和 Agent 一起工作。',`<div class="grid"><div class="panel"><h3>当前会话</h3><div class="chat"><div class="bubble user">我想让首页更适合 Vibe Coding 用户。</div><div class="bubble agent">我已经读取当前项目和最近工作。你上次完成了用户定位，接下来可以先比较首页工作流。<div class="actions"><button class="button">继续这次工作</button><button class="button alt">查看上下文</button></div></div></div></div><div class="panel"><h3>当前项目</h3><p><strong>OneTone Website</strong></p><p class="muted">main · 最近修改 8 个文件</p><div class="line"></div><p class="muted">最近会话</p><p class="accent">重构软件首页</p><p class="muted">Agent 上下文整理</p></div></div>`),()=>base('B 任务流程','先选要推进的事，再让 Agent 动手。','把模糊目标变成一组可调整的工作步骤，适合首次开始或方向不清时。',`<div class="panel"><h3>当前目标：让首页更适合 Vibe Coding</h3><div class="step"><b>理解用户工作流</b><span>从 GitHub 项目和现有产品中归纳模式</span></div><div class="step"><b>比较首页原型</b><span>选择对话、任务、监督或计划作为主入口</span></div><div class="step"><b>接入现有能力</b><span>关联 Agent、工作历史、语音与项目上下文</span></div><div class="actions"><button class="button">开始第 1 步</button><button class="button alt">调整流程</button></div></div>`),()=>base('C 运行监督','Agent 动手时，你始终知道发生了什么。','适合执行阶段：看工具调用、文件变化、测试结果，并在关键节点介入。',`<div class="grid"><div class="panel"><h3><span class="accent">● 正在执行</span>　重构首页信息架构</h3><div class="terminal"><div class="ok">✓ 读取项目上下文</div><div class="ok">✓ 分析 5 个 GitHub 工作流</div><div>▸ 生成首页状态模型</div><div>  等待用户确认下一步…</div></div></div><div class="panel"><h3>最近动作</h3><div class="item"><i class="dot"></i><span>读取 <b>src/index.html</b></span></div><div class="item"><i class="dot"></i><span>创建工作流分析文档</span></div><div class="item"><i class="dot"></i><span>等待确认：是否继续画原型</span></div></div></div>`),()=>base('D 计划画布','复杂任务，先把路径看清楚。','用可视化计划表达依赖、验证点和可回退节点，适合较大的功能开发。',`<div class="panel"><h3>首页重构计划</h3><div class="canvas"><div class="node active">理解工作流</div><span class="arrow">→</span><div class="node">定义会话结构</div><span class="arrow">→</span><div class="node">接入项目上下文</div><span class="arrow">→</span><div class="node">预览与测试</div></div><div class="diff"><div class="add">+ 已完成：用户需求归纳</div><div class="add">+ 已完成：GitHub 方案研究</div><div>· 当前：选择首页入口模型</div></div><div class="actions"><button class="button">从当前节点继续</button><button class="button alt">编辑计划</button></div></div>`)];function set(i){buttons.forEach((b,j)=>b.classList.toggle('active',i===j));root.innerHTML=views[i]();history.replaceState(null,'',`?v=${i+1}`)}buttons.forEach((b,i)=>b.onclick=()=>set(i));set((parseInt(new URLSearchParams(location.search).get('v'))||1)-1);
</script></body></html>
