<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>OneTone · Agent 工作流首页</title>
  <style>
    :root{--bg:#e9ece9;--paper:#fbfaf7;--panel:#fffefa;--soft:#f1f3f0;--ink:#1b2a3e;--muted:#718094;--faint:#a6afb9;--line:#e1e2dd;--teal:#087f77;--teal-soft:#e1f2ee;--teal-line:#b8d8d1;--blue:#5d789e;--blue-soft:#edf2f8;--amber:#a36525;--amber-soft:#fff0dc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:900px;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.window{width:100%;max-width:1420px;height:calc(100vh - 40px);min-height:720px;margin:0 auto;display:grid;grid-template-columns:292px minmax(0,1fr);overflow:hidden;border:1px solid #d0d6d2;border-radius:16px;background:var(--paper);box-shadow:0 16px 48px rgba(39,53,58,.08)}
    .listen-panel{display:flex;flex-direction:column;min-width:0;background:#f1f3f0;border-right:1px solid var(--line)}.listen-head{padding:24px 20px 15px}.brand{display:flex;align-items:center;gap:9px;margin-bottom:23px;color:var(--teal);font-size:14px;font-weight:850}.mark{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--teal-soft);font-weight:900}.listen-title{display:flex;justify-content:space-between;align-items:center}.listen-title h1{margin:0;font-size:20px}.listen-title button{border:0;background:transparent;color:var(--teal);font-size:11px;font-weight:800}.search{margin-top:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--faint);font-size:11px}.listen-list{min-height:0;overflow:auto;padding:0 10px 15px}.day{padding:13px 10px 7px;color:var(--faint);font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.record{display:block;width:100%;padding:12px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}.record:hover{background:#fff}.record.active{border-color:var(--teal-line);background:#fffefa;box-shadow:0 2px 6px rgba(30,50,55,.04)}.record-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.record-title{overflow:hidden;font-size:12px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.record-time{color:var(--faint);font-size:10px}.record-meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.record-dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}.record-dot.done{background:#7792b5}.record-dot.warn{background:var(--amber)}.listen-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.55}.listen-foot strong{color:var(--ink)}
    main{min-width:0;height:100%;padding:25px 40px 22px;background:var(--paper)}.content{width:100%;height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px}.context{display:flex;align-items:center;gap:9px}.context-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px var(--teal-soft)}.context strong{display:block;font-size:13px}.context small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.top-actions{display:flex;align-items:center;gap:13px;color:var(--muted);font-size:10px}.state{padding:6px 9px;border:1px solid var(--teal-line);border-radius:999px;background:#f1faf7;color:var(--teal);font-weight:800}.top-actions button{border:0;background:transparent;color:var(--muted);font-size:10px}.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:35px 0 20px}.eyebrow{margin:0 0 8px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.intro h2{margin:0 0 8px;font-size:clamp(24px,3vw,38px);line-height:1.1;letter-spacing:-.05em}.intro p{max-width:640px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.input-btn{padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fff;color:var(--teal);font-size:10px;font-weight:800;white-space:nowrap}
    .target-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#fff}.target-main{display:flex;align-items:center;gap:9px}.target-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--teal-soft);color:var(--teal);font-size:11px;font-weight:900}.target-main strong{font-size:11px}.target-main small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.target-actions{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:9px}.target-actions button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}
    .flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:21px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.flow-step{position:relative;padding:12px 9px;border:0;background:transparent;color:var(--muted);text-align:left}.flow-step:not(:last-child):after{content:"→";position:absolute;right:-4px;top:15px;color:var(--faint);font-size:12px}.flow-step.active{color:var(--teal);font-weight:800}.flow-step.done{color:var(--ink)}.flow-step .num{display:block;margin-bottom:5px;color:var(--faint);font-size:9px;font-weight:800}.flow-step.active .num{color:var(--teal)}.flow-step strong{display:block;font-size:11px}.flow-step small{display:block;margin-top:3px;font-size:9px;color:inherit;font-weight:400}
    .stage{min-height:0;flex:1;overflow:auto;padding:2px 4px 2px 0}.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}.stage-head h3{margin:0;font-size:16px}.stage-head span{color:var(--muted);font-size:10px}.stage-copy{max-width:700px;margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.6}.stage-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}.panel{padding:15px;border:1px solid var(--line);border-radius:10px;background:#fff}.panel h4{margin:0 0 11px;font-size:12px}.panel p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.status-list{display:grid;gap:0}.status-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.status-row strong{color:var(--ink);font-size:11px}.status-ok{color:var(--teal);font-weight:800}.status-wait{color:var(--amber);font-weight:800}.primary{padding:9px 12px;border:0;border-radius:7px;background:var(--teal);color:#fff;font-size:10px;font-weight:800}.secondary{padding:8px 11px;border:1px solid var(--teal-line);border-radius:7px;background:#fff;color:var(--teal);font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.quote{padding:14px;border-left:2px solid var(--teal);background:#f5fbf8;color:var(--ink);font-size:14px;line-height:1.55}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.route-item{padding:10px;border:1px solid #d6e2ee;border-radius:8px;background:var(--blue-soft)}.route-item small{display:block;margin-bottom:4px;color:#8192aa;font-size:9px}.route-item strong{font-size:11px}.summary{padding:16px;border:1px solid #d6e2ee;border-radius:10px;background:var(--blue-soft)}.summary h4{color:#587399}.summary p{color:#5e6d84}.summary ul{margin:10px 0 0;padding-left:17px;color:#5e6d84;font-size:11px;line-height:1.7}.history-lines{display:grid;gap:0}.history-line{display:grid;grid-template-columns:55px 10px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}.history-line time{color:var(--faint);font-size:10px}.history-line i{width:7px;height:7px;margin-top:3px;border-radius:50%;background:var(--teal)}.history-line strong{display:block;margin-bottom:3px;font-size:11px}.history-line p{margin:0;color:var(--muted);font-size:10px}.channel-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.channel-line i{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--teal-soft);color:var(--teal);font-size:11px}.channel-line strong{color:var(--ink);font-size:11px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:15px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.bottom button{border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:800}.live{position:fixed;left:50%;bottom:24px;z-index:20;width:min(630px,calc(100vw - 48px));padding:14px 16px;border:1px solid var(--teal-line);border-radius:12px;background:rgba(255,254,250,.98);box-shadow:0 14px 38px rgba(30,46,50,.18);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live.show{transform:translate(-50%,0);opacity:1}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.live-head strong{display:flex;align-items:center;gap:7px;color:var(--teal);font-size:11px}.live-head i{width:7px;height:7px;border-radius:50%;background:#df7c69;box-shadow:0 0 0 4px #fae7e0}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:10px;font-size:14px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:7px}.live-actions button{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted);font-size:10px}.live-actions button:first-child{border-color:var(--teal-line);color:var(--teal);font-weight:750}.hotkey{margin:8px 0 0;color:var(--faint);font-size:10px}.toast{position:fixed;left:50%;bottom:24px;z-index:21;padding:9px 12px;border:1px solid var(--teal-line);border-radius:8px;background:#fffefa;color:var(--teal);font-size:11px;box-shadow:0 8px 24px rgba(30,40,50,.12);transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 160ms ease-out,opacity 160ms ease-out}.toast.show{transform:translate(-50%,0);opacity:1}
    @media(max-width:1050px){main{padding:25px 28px}.stage-grid{grid-template-columns:1fr 210px}}@media(max-width:820px){body{min-width:0}.app{padding:0}.window{height:100vh;min-height:650px;border-radius:0;grid-template-columns:230px minmax(0,1fr)}.intro{display:block;margin-top:27px}.input-btn{margin-top:15px}.top-actions{display:none}.flow-step small{display:none}.stage-grid{grid-template-columns:1fr}.bottom{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="app"><div class="window" id="window"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const records=[['今天','整理首页的交互流程','14:32','已完成一次输入','done'],['今天','回复一段文字','13:58','保留在当前输入框','done'],['昨天','继续首页设计','昨天','上次停在这里','warn'],['更早','第一次使用 OneTone','周一','语音输入','done']];let selected=0,stage='enter';
    const stages={
      enter:{label:'进入',sub:'找到当前工作',title:'进入当前工作会话',copy:'OneTone 已识别你正在使用的应用和项目。进入后，首页会围绕这项工作提供输入、读取和继续动作。',body:()=>`<div class="stage-grid"><div class="panel"><h4>当前工作目标</h4><div class="status-list"><div class="status-row"><strong>前台应用</strong><span class="status-ok">Cursor · 已确认</span></div><div class="status-row"><strong>项目</strong><span class="status-ok">voice-pilot · 已确认</span></div><div class="status-row"><strong>当前会话</strong><span class="status-wait">尚未进入</span></div></div><div class="actions"><button class="primary" data-action="进入当前会话">进入当前会话</button><button class="secondary" data-action="更换工作目标">更换目标</button></div></div><div class="panel"><h4>进入后可以做什么</h4><p>在当前项目中继续输入、读取已有工作、生成摘要，并把结果保存为新的工作记录。</p></div></div>`},
      link:{label:'联动',sub:'接入四个通道',title:'让 OneTone 和当前工作连起来',copy:'四个通道不是四个页面，而是同一件事的不同输入和控制方式。这里显示它们当前是否真的可以参与工作。',body:()=>`<div class="stage-grid"><div class="panel"><h4>当前联动</h4><div class="channel-line"><i>◎</i><div><strong>摄像头</strong><br>识别 Cursor · voice-pilot · 首页</div><span class="status-ok">已确认</span></div><div class="channel-line"><i>⌁</i><div><strong>麦克风</strong><br>输入会写入当前工作记录</div><span class="status-ok">可用</span></div><div class="channel-line"><i>⌘</i><div><strong>按键</strong><br>确认、取消和接管当前动作</div><span class="status-ok">可用</span></div><div class="channel-line"><i>▦</i><div><strong>Soft Pad</strong><br>显示当前上下文动作</div><span class="status-wait">待绑定</span></div><div class="actions"><button class="primary" data-action="开始联动">开始联动</button><button class="secondary" data-action="查看联动依据">查看依据</button></div></div><div class="panel"><h4>联动后的结果</h4><p>你只需要表达目标。OneTone 负责把输入、确认动作和工作记录送到当前会话。</p></div></div>`},
      read:{label:'读取',sub:'理解当前工作',title:'读取已有工作上下文',copy:'读取不是把所有数据塞到首页，而是找到继续工作所需的内容，并标明每一条内容来自哪里。',body:()=>`<div class="stage-grid"><div class="panel"><h4>已读取到</h4><div class="status-list"><div class="status-row"><strong>当前项目</strong><span class="status-ok">voice-pilot · 环境来源</span></div><div class="status-row"><strong>最近输入</strong><span class="status-ok">OneTone · 精确</span></div><div class="status-row"><strong>Cursor 会话索引</strong><span class="status-wait">历史导入 · 约略</span></div><div class="status-row"><strong>完整对话正文</strong><span class="status-wait">尚未获取</span></div></div><div class="actions"><button class="primary" data-action="重新读取上下文">重新读取</button><button class="secondary" data-action="查看数据来源">查看来源</button></div></div><div class="panel"><h4>读取边界</h4><p>只有有来源的数据才进入总结。Cursor 历史索引不会被当作实时回执。</p></div></div>`},
      summarize:{label:'总结',sub:'形成可继续摘要',title:'把这次工作整理成摘要',copy:'摘要服务于下一次回来继续，不是泛泛的 AI 总结。它需要告诉你做了什么、停在哪里、下一步是什么。',body:()=>`<div class="stage-grid"><div class="summary"><h4>当前工作摘要</h4><p>你正在重新规划 OneTone 软件首页，让“听见”记录和 Agent 工作流能够在同一入口中联动。</p><ul><li>已确认：左侧保留听见记录</li><li>已完成：绘制多个首页原型</li><li>当前停点：进入、联动、读取、总结、汇总的首页结构</li></ul><div class="actions"><button class="primary" data-action="生成工作摘要">生成摘要</button><button class="secondary" data-action="修改摘要范围">修改范围</button></div></div><div class="panel"><h4>摘要来源</h4><p>来源于 OneTone 输入记录、当前项目环境和已确认的工作节点。</p></div></div>`},
      aggregate:{label:'汇总',sub:'留下工作节点',title:'把结果留在 OneTone 里',copy:'汇总不是复制完整聊天，而是保存用户下次真正需要的工作节点和可继续动作。',body:()=>`<div class="stage-grid"><div class="panel"><h4>最近工作节点</h4><div class="history-lines"><div class="history-line"><time>14:32</time><i></i><div><strong>整理首页交互流程</strong><p>已完成一次输入 · OneTone 精确记录</p></div></div><div class="history-line"><time>13:58</time><i></i><div><strong>回复一段文字</strong><p>保留在当前输入框 · 可继续</p></div></div><div class="history-line"><time>昨天</time><i></i><div><strong>继续首页设计</strong><p>上次停在这里 · 需要确认来源</p></div></div></div><div class="actions"><button class="primary" data-action="保存当前工作节点">保存当前节点</button><button class="secondary" data-action="查看完整记录">查看完整记录</button></div></div><div class="panel"><h4>下一次回来</h4><p>OneTone 会从这个节点继续，而不是要求你重新解释已经完成的工作。</p></div></div>`}
    };
    function side(){let last='';return `<aside class="listen-panel"><div class="listen-head"><div class="brand"><span class="mark">O</span>OneTone</div><div class="listen-title"><h1>听见</h1><button data-action="新建输入">＋ 新输入</button></div><div class="search">⌕　搜索最近输入</div></div><div class="listen-list">${records.map((r,i)=>{const group=r[0]!==last;last=r[0];return `${group?`<div class="day">${r[0]}</div>`:''}<button class="record ${i===selected?'active':''}" data-record="${i}"><div class="record-top"><span class="record-title">${r[1]}</span><span class="record-time">${r[2]}</span></div><div class="record-meta"><i class="record-dot ${r[4]}"></i>${r[3]}</div></button>`}).join('')}</div><div class="listen-foot"><strong>听见是 OneTone 的记忆入口</strong><br>输入、工作节点和下一步都会从这里回来。</div></aside>`}
    function main(){const s=stages[stage];return `<main><div class="content"><header class="topbar"><div class="context"><i class="context-dot"></i><div><strong>OneTone · 当前工作现场</strong><small>当前应用：Cursor · voice-pilot</small></div></div><div class="top-actions"><span class="state">工作流可用</span><span>本地记录</span><button data-action="打开系统设置">系统</button></div></header><section class="intro"><div><p class="eyebrow">软件首页 · Agent 工作流</p><h2>从听见，到继续工作。</h2><p>OneTone 把当前应用、四个输入通道、Agent 工作和历史记录放进同一条工作流。你只需选择当前要进入的步骤。</p></div><button class="input-btn" data-listen>开始倾听</button></section><div class="target-bar"><div class="target-main"><span class="target-mark">↗</span><div><strong>当前工作目标：Cursor · voice-pilot</strong><small>首页 · 已识别当前窗口</small></div></div><div class="target-actions"><span>本次工作已记录</span><button data-action="更换当前目标">更换</button></div></div><nav class="flow" aria-label="Agent 工作流">${Object.entries(stages).map(([key,v],i)=>`<button class="flow-step ${key===stage?'active':''} ${i<Object.keys(stages).indexOf(stage)?'done':''}" data-stage="${key}"><span class="num">0${i+1}</span><strong>${v.label}</strong><small>${v.sub}</small></button>`).join('')}</nav><section class="stage"><div class="stage-head"><h3>${s.title}</h3><span>当前步骤：${s.label}</span></div><p class="stage-copy">${s.copy}</p>${s.body()}</section><footer class="bottom"><span>最近输入：<strong>${records[selected][1]}</strong> · 左侧“听见”已保存</span><button data-action="查看完整工作记录">查看完整工作记录 →</button></footer></div></main>`}
    const win=document.getElementById('window'),toast=document.getElementById('toast');let timer;function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function mount(){win.innerHTML=side()+main();win.querySelectorAll('[data-record]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.record);mount()}));win.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{stage=b.dataset.stage;mount()}));win.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：工作流已响应`)));win.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',listen))}function listen(){let d=document.querySelector('.live');if(!d){d=document.createElement('div');d.className='live';document.body.appendChild(d)}d.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · 当前应用</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想继续完善首页的 Agent 工作流……<br><small>实时识别中 · 结束后会写入左侧“听见”并进入当前步骤</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';d.classList.add('show');d.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{d.classList.remove('show');notice(`${b.dataset.live}：已回到工作流`)}))}mount();
  </script>
</body>
</html>
