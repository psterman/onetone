<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>OneTone · 工作现场四维原型</title>
  <style>
    :root{--bg:#10191e;--panel:#15242a;--panel2:#1b2e34;--line:#2a4147;--ink:#eef8f5;--muted:#9ab0b1;--quiet:#6d8588;--teal:#49d2bd;--teal-dark:#177e75;--teal-soft:#1d4949;--amber:#e6ae68;--amber-soft:#493923;--rose:#ed877e;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-width:860px;background:#dce1e1;color:var(--ink)}button{font:inherit;cursor:pointer}.app{width:100%;min-height:100vh;padding:20px}.product{width:100%;max-width:1440px;min-height:calc(100vh - 40px);margin:0 auto;overflow:hidden;border:1px solid #24353a;border-radius:17px;background:var(--bg);box-shadow:0 18px 55px rgba(0,0,0,.22)}.scene{width:100%;min-height:calc(100vh - 40px);display:grid;grid-template-columns:74px minmax(0,1fr)}
    .product>.variant-scene,.product>.variant-pipeline,.product>.variant-control,.product>.variant-trace{width:100%;min-height:calc(100vh - 40px);display:grid!important;grid-template-columns:74px minmax(0,1fr)!important}.rail{display:flex;flex-direction:column;align-items:center;padding:22px 11px;background:#0d1519;border-right:1px solid #213238}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;background:var(--teal-soft);color:var(--teal);font-weight:900;letter-spacing:-.08em}.rail-tools{display:grid;gap:10px;margin-top:48px}.rail-btn{position:relative;display:grid;place-items:center;width:39px;height:39px;border:1px solid transparent;border-radius:11px;background:transparent;color:var(--quiet);font-size:17px}.rail-btn:hover,.rail-btn.active{border-color:#2c5a5b;background:#17363a;color:var(--teal)}.rail-btn.active:after{content:"";position:absolute;right:-12px;width:3px;height:20px;border-radius:4px;background:var(--teal)}.rail-bottom{margin-top:auto;display:grid;gap:10px}.rail-bottom button{width:39px;height:34px;border:0;background:transparent;color:var(--quiet);font-size:15px}.rail-bottom button:hover{color:var(--ink)}
    main{min-width:0;padding:28px 42px 30px;background:radial-gradient(circle at 68% 22%,rgba(34,93,93,.19),transparent 34%),var(--bg)}.content{width:100%;max-width:1160px;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.identity{display:flex;align-items:center;gap:12px}.identity-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 6px rgba(73,210,189,.12)}.identity strong{font-size:14px}.identity span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.top-state{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px}.state-pill{padding:6px 9px;border:1px solid #305250;border-radius:999px;background:#142e30;color:var(--teal);font-weight:800}.eyebrow{margin:0 0 11px;color:var(--teal);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.hero{max-width:780px}.hero h1{margin:0 0 13px;font-size:clamp(32px,4.2vw,58px);line-height:1.06;letter-spacing:-.06em}.hero p{max-width:680px;margin:0;color:var(--muted);font-size:15px;line-height:1.65}.live-input{display:flex;align-items:center;gap:13px;margin-top:24px;min-height:64px;padding:0 18px;border:1px solid #3d706d;border-radius:13px;background:rgba(24,53,55,.9);color:#c7d8d6}.live-input .quote{font-size:15px}.live-input .recording{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--teal);font-size:11px;font-weight:800}.recording i{width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 5px rgba(237,135,126,.13)}
    .workspace{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(290px,.82fr);gap:20px;margin-top:27px}.surface{min-width:0;padding:21px;border:1px solid var(--line);border-radius:15px;background:rgba(21,36,42,.86)}.surface-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.surface-head h2{margin:0;font-size:14px}.surface-head span{color:var(--quiet);font-size:11px}.scene-view{position:relative;min-height:230px;overflow:hidden;border:1px solid #345257;border-radius:12px;background:linear-gradient(135deg,#20373b,#132328)}.scene-view:before{content:"";position:absolute;inset:20px 22px;border:1px solid rgba(128,201,193,.18);border-radius:9px;background:linear-gradient(125deg,transparent 0 48%,rgba(78,170,158,.07) 48% 49%,transparent 49% 100%)}.scene-window{position:absolute;left:12%;top:20%;width:62%;height:61%;padding:14px;border:1px solid rgba(151,218,208,.35);border-radius:8px;background:rgba(10,22,27,.57);box-shadow:0 16px 30px rgba(0,0,0,.2)}.scene-window .bar{display:flex;gap:5px;margin-bottom:14px}.scene-window .bar i{width:5px;height:5px;border-radius:50%;background:#d36e68}.scene-lines{display:grid;gap:8px}.scene-lines span{display:block;width:72%;height:5px;border-radius:4px;background:#47676a}.scene-lines span:nth-child(2){width:48%;background:#306861}.scene-lines span:nth-child(3){width:80%}.target{position:absolute;right:13%;bottom:16%;padding:9px 11px;border:1px solid var(--teal);border-radius:9px;background:rgba(19,60,60,.92);color:var(--teal);font-size:11px;font-weight:800}.target:before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--teal)}.scene-caption{display:flex;justify-content:space-between;gap:10px;margin-top:11px;color:var(--muted);font-size:11px}.scene-caption strong{color:var(--ink)}
    .sense-list{display:grid;gap:10px}.sense{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(42,65,71,.7)}.sense:last-child{border-bottom:0}.sense-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#203b3d;color:var(--teal);font-size:14px}.sense strong{display:block;font-size:12px}.sense small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.sense-status{color:var(--teal);font-size:10px;font-weight:800}.sense-status.wait{color:var(--amber)}
    .understand{padding:18px;border:1px solid #3d5c63;border-radius:12px;background:linear-gradient(135deg,#1b3339,#17272d)}.understand .label{margin:0 0 10px;color:var(--teal);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.understand h3{margin:0 0 8px;font-size:18px}.understand p{margin:0;color:#adc1c1;font-size:12px;line-height:1.55}.route{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}.route div{padding:9px;border:1px solid #345158;border-radius:8px;background:rgba(7,20,24,.33)}.route small{display:block;margin-bottom:4px;color:var(--quiet);font-size:9px}.route strong{font-size:11px}.action-row{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.primary{padding:10px 13px;border:0;border-radius:8px;background:var(--teal);color:#08211e;font-size:12px;font-weight:850}.primary:hover{background:#78e1d0}.secondary{padding:9px 12px;border:1px solid #406267;border-radius:8px;background:transparent;color:#c2d2d0;font-size:12px}.secondary:hover{background:#203a3e}
    .softpad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pad-key{min-height:53px;padding:8px;border:1px solid #315055;border-radius:9px;background:#152d32;color:#b9ceca;text-align:left}.pad-key:hover,.pad-key.selected{border-color:var(--teal);background:#1b4849;color:var(--teal)}.pad-key kbd{display:block;margin-bottom:7px;color:var(--quiet);font-size:10px}.pad-key strong{font-size:11px}.trace{display:grid;gap:0}.trace-row{display:grid;grid-template-columns:53px 13px minmax(0,1fr);gap:11px;padding:12px 0;border-bottom:1px solid rgba(42,65,71,.75)}.trace-row time{color:var(--quiet);font-size:10px}.trace-line{position:relative;display:flex;justify-content:center}.trace-line:before{content:"";position:absolute;top:9px;bottom:-22px;width:1px;background:#315055}.trace-row:last-child .trace-line:before{display:none}.trace-dot{position:relative;z-index:1;width:8px;height:8px;margin-top:2px;border:2px solid var(--bg);border-radius:50%;background:var(--teal);box-shadow:0 0 0 1px #69b9af}.trace-dot.amber{background:var(--amber);box-shadow:0 0 0 1px #d9ad73}.trace-row strong{display:block;margin-bottom:3px;font-size:11px}.trace-row p{margin:0;color:var(--muted);font-size:10px;line-height:1.45}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:23px;color:var(--quiet);font-size:10px}.footer span{display:inline-flex;align-items:center;gap:6px;margin-right:13px}.footer i{width:6px;height:6px;border-radius:50%;background:var(--teal)}.footer i.warn{background:var(--amber)}.footer button{border:0;background:transparent;color:var(--teal);font-size:10px}
    .live-dock{position:fixed;left:50%;bottom:24px;z-index:20;width:min(720px,calc(100vw - 48px));padding:16px 18px;border:1px solid #3f7770;border-radius:14px;background:rgba(19,42,45,.97);box-shadow:0 16px 42px rgba(0,0,0,.4);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 180ms ease-out,opacity 180ms ease-out}.live-dock.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.live-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.live-head strong{display:flex;align-items:center;gap:8px;color:var(--teal);font-size:12px}.live-head i{width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 5px rgba(237,135,126,.12)}.close{border:0;background:transparent;color:var(--muted);font-size:18px}.transcript{margin-bottom:12px;color:#e7f4f1;font-size:15px;line-height:1.5}.transcript small{color:var(--muted);font-size:10px}.live-actions{display:flex;gap:8px}.live-actions button{padding:7px 11px;border:1px solid #365b60;border-radius:7px;background:#173138;color:#bcd0cd;font-size:11px}.live-actions button:first-child{border-color:#3c8077;color:var(--teal)}.hotkey{margin:9px 0 0;color:var(--quiet);font-size:10px}
    .picker{position:fixed;bottom:24px;left:50%;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.84);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24);font:13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transform:translateX(-50%);user-select:none}.picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.picker[data-ready] .picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.picker button{position:relative;height:28px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.53);cursor:pointer}.picker button:hover{color:#fff}.picker button.active{color:#fff}.picker .divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.picker .replay{padding:0 10px;font-size:14px}
    .variant-pipeline main{padding-top:30px}.variant-pipeline .workspace{grid-template-columns:1fr}.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:23px}.pipe{position:relative;padding:15px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.pipe:not(:last-child):after{content:"→";position:absolute;right:-14px;top:42%;z-index:2;color:var(--teal);font-size:15px}.pipe .num{display:block;margin-bottom:18px;color:var(--teal);font-size:10px;font-weight:850}.pipe strong{display:block;margin-bottom:5px;font-size:13px}.pipe p{margin:0;color:var(--muted);font-size:11px}.variant-pipeline .understand{margin-top:21px}.variant-control .workspace{grid-template-columns:minmax(0,1fr) 370px}.variant-control .hero h1{font-size:clamp(30px,3.7vw,50px)}.variant-control .softpad{margin-top:14px}.variant-trace .workspace{grid-template-columns:minmax(0,1fr) 360px}.variant-trace .scene-view{min-height:205px}.variant-trace .trace{margin-top:0}.variant-trace .understand{margin-top:20px}
    @media(max-width:1050px){.workspace,.variant-control .workspace,.variant-trace .workspace{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(2,1fr)}.pipe:not(:last-child):after{display:none}}
    @media(max-width:900px){body{min-width:0}.app{padding:0}.product{min-height:100vh;border-radius:0}.scene{min-height:100vh;grid-template-columns:60px minmax(0,1fr)}main{padding:24px 24px 35px}.rail{padding:18px 8px}.rail-btn{width:35px;height:35px}.rail-btn.active:after{right:-9px}.topbar{margin-bottom:26px}.top-state{display:none}.route{grid-template-columns:1fr}.softpad{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app"><div class="product" id="product"></div></div>
  <nav class="picker" id="picker" aria-label="工作现场四个维度"><span class="picker-highlight" aria-hidden="true"></span><button class="active" aria-current="true">A · 现场</button><button>B · 感知链</button><button>C · 物理控制</button><button>D · 连续轨迹</button><span class="divider" aria-hidden="true"></span><button class="replay" aria-label="重新播放">↻</button></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const nav=['现场','感知','动作','轨迹'];
    function rail(){return `<aside class="rail"><div class="mark">O</div><div class="rail-tools">${nav.map((n,i)=>`<button class="rail-btn ${i===0?'active':''}" data-rail="${n}" title="${n}">${['◉','⌁','⌘','↗'][i]}</button>`).join('')}</div><div class="rail-bottom"><button data-action="打开系统抽屉">⋯</button><button data-action="查看帮助">?</button></div></aside>`}
    function topBar(){return `<header class="topbar"><div class="identity"><i class="identity-dot"></i><div><strong>OneTone · 当前工作现场</strong><span>Cursor · voice-pilot</span></div></div><div class="top-state"><span class="state-pill">环境已确认</span><span>刚刚同步</span></div></header>`}
    function scene(){return `<div class="surface"><div class="surface-head"><h2>我看见的工作现场</h2><span>摄像头 · 当前窗口</span></div><div class="scene-view"><div class="scene-window"><div class="bar"><i></i><i></i><i></i></div><div class="scene-lines"><span></span><span></span><span></span></div></div><div class="target">voice-pilot · 首页</div></div><div class="scene-caption"><span>前台应用：<strong>Cursor</strong></span><span>目标已定位</span></div></div>`}
    function senses(){return `<div class="surface"><div class="surface-head"><h2>当前工作感知</h2><span>正在协作</span></div><div class="sense-list"><div class="sense"><span class="sense-icon">⌁</span><div><strong>麦克风听见</strong><small>“把首页做成 AI 工作现场”</small></div><span class="sense-status">实时</span></div><div class="sense"><span class="sense-icon">⌘</span><div><strong>按键等待</strong><small>确认后执行 · Esc 取消</small></div><span class="sense-status wait">等待</span></div><div class="sense"><span class="sense-icon">▦</span><div><strong>Soft Pad 可用动作</strong><small>确认 · 修改 · 查看依据</small></div><span class="sense-status">就绪</span></div><div class="sense"><span class="sense-icon">◎</span><div><strong>Agent 正在理解</strong><small>Cursor Agent · voice-pilot</small></div><span class="sense-status">工作中</span></div></div></div>`}
    function understanding(){return `<div class="understand"><p class="label">OneTone 正在理解</p><h3>把首页做成 AI 辅助工作现场</h3><p>我会结合当前看到的项目、听到的意图和你的确认动作，先整理工作现场，再等待你决定是否执行。</p><div class="route"><div><small>当前目标</small><strong>首页架构</strong></div><div><small>交给</small><strong>Cursor Agent</strong></div><div><small>下一步</small><strong>等待确认</strong></div></div><div class="action-row"><button class="secondary" data-action="修改理解">修改理解</button><button class="primary" data-action="确认执行">确认执行</button></div></div>`}
    function pad(){return `<div class="surface"><div class="surface-head"><h2>手边的动作</h2><span>Soft Pad · 当前上下文</span></div><div class="softpad"><button class="pad-key selected" data-action="确认执行"><kbd>↵ Enter</kbd><strong>确认执行</strong></button><button class="pad-key" data-action="修改理解"><kbd>⌫ Back</kbd><strong>修改理解</strong></button><button class="pad-key" data-action="查看依据"><kbd>F2</kbd><strong>查看依据</strong></button><button class="pad-key" data-action="取消当前动作"><kbd>Esc</kbd><strong>取消</strong></button></div></div>`}
    function trace(){return `<div class="surface"><div class="surface-head"><h2>刚才发生了什么</h2><span>工作轨迹</span></div><div class="trace"><div class="trace-row"><time>刚刚</time><div class="trace-line"><i class="trace-dot"></i></div><div><strong>看见 Cursor 的 voice-pilot 项目</strong><p>目标：当前首页文件</p></div></div><div class="trace-row"><time>刚刚</time><div class="trace-line"><i class="trace-dot"></i></div><div><strong>听见：重新规划首页</strong><p>意图：让四个通道共同参与</p></div></div><div class="trace-row"><time>现在</time><div class="trace-line"><i class="trace-dot amber"></i></div><div><strong>等待你的确认</strong><p>确认后交给 Cursor Agent 执行</p></div></div></div></div>`}
    function footer(){return `<footer class="footer"><div><span><i></i>摄像头已定位</span><span><i></i>麦克风实时</span><span><i></i>按键与 Soft Pad 就绪</span></div><button data-action="打开系统抽屉">系统抽屉</button></footer>`}
    function shell(body,cls){return `<div class="${cls}">${rail()}<main><div class="content">${topBar()}${body}</div></main></div>`}
    function A(){return shell(`<section class="hero"><p class="eyebrow">工作现场</p><h1>OneTone 正在和你一起工作。</h1><p>你不需要选择通道。摄像头看见当前项目，麦克风听见你的意图，按键和 Soft Pad 让你在关键时刻确认。</p><div class="live-input"><span class="quote">“把首页做成 AI 辅助工作现场”</span><span class="recording"><i></i>正在倾听</span></div></section><div class="workspace">${scene()}<div>${understanding()}${senses()}</div></div>${footer()}`,'variant-scene')}
    function B(){return shell(`<section class="hero"><p class="eyebrow">感知 → 理解 → 行动</p><h1>每一步都在同一个现场里发生。</h1><p>OneTone 把看见、听见、确认和执行连接起来。你能看见 AI 为什么这样理解，也能随时接管。</p></section><div class="pipeline"><div class="pipe"><span class="num">01 · 看见</span><strong>当前项目</strong><p>Cursor · voice-pilot · 首页</p></div><div class="pipe"><span class="num">02 · 听见</span><strong>用户意图</strong><p>重新规划 AI 工作现场</p></div><div class="pipe"><span class="num">03 · 理解</span><strong>Cursor Agent</strong><p>整理现场和执行方案</p></div><div class="pipe"><span class="num">04 · 行动</span><strong>等待确认</strong><p>按键或 Soft Pad 确认</p></div></div><div class="workspace">${understanding()}${scene()}</div>${footer()}`,'variant-pipeline')}
    function C(){return shell(`<section class="hero"><p class="eyebrow">物理控制</p><h1>把 AI 放到手边，而不是藏在页面里。</h1><p>你的视线、声音、按键和 Soft Pad 是一个连续的控制面。当前动作只显示真正有用的几个选择。</p><div class="live-input"><span class="quote">正在等待：确认“整理首页架构”</span><span class="recording"><i></i>按键可接管</span></div></section><div class="workspace">${scene()}<div>${pad()}${understanding()}</div></div><div class="surface" style="margin-top:20px">${pad()}</div>${footer()}`,'variant-control')}
    function D(){return shell(`<section class="hero"><p class="eyebrow">连续轨迹</p><h1>你和 OneTone 的工作不会断在页面之间。</h1><p>每次看见、听见、确认和完成都会成为现场的一部分。回来时，直接从上次停下的位置继续。</p></section><div class="workspace">${scene()}${trace()}</div><div style="margin-top:20px">${understanding()}</div><div style="margin-top:20px">${pad()}</div>${footer()}`,'variant-trace')}
    const variants=[A,B,C,D],product=document.getElementById('product'),picker=document.getElementById('picker'),items=[...picker.querySelectorAll('button:not(.replay)')],highlight=picker.querySelector('.picker-highlight'),toast=document.getElementById('toast');let current=0,timer;
    function notice(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}function move(){const e=items[current];highlight.style.width=e.offsetWidth+'px';highlight.style.transform=`translateX(${e.offsetLeft}px)`}
    function mount(i){product.innerHTML=variants[i]();product.querySelectorAll('[data-rail]').forEach(b=>b.addEventListener('click',()=>{product.querySelectorAll('[data-rail]').forEach(x=>x.classList.remove('active'));b.classList.add('active');notice(`切换${b.dataset.rail}视图：保留在当前工作现场`)}));product.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>notice(`${b.dataset.action}：工作现场已响应`)));product.querySelectorAll('[data-listen]').forEach(b=>b.addEventListener('click',listen))}
    function listen(){let dock=document.querySelector('.live-dock');if(!dock){dock=document.createElement('div');dock.className='live-dock';document.body.appendChild(dock)}dock.innerHTML='<div class="live-head"><strong><i></i>正在倾听 · Cursor</strong><button class="close" data-live="关闭">×</button></div><div class="transcript">我想把首页做成更完整的 AI 工作现场……<br><small>实时识别中 · 摄像头正在保留当前项目上下文</small></div><div class="live-actions"><button data-live="暂停">暂停</button><button data-live="结束并查看">结束并查看</button><button data-live="取消">取消</button></div><p class="hotkey">快捷键：Ctrl+Shift+D（来自当前设置）</p>';dock.classList.add('show');dock.querySelectorAll('[data-live]').forEach(b=>b.addEventListener('click',()=>{dock.classList.remove('show');notice(`${b.dataset.live}：现场已更新`)}))}
    function active(i){if(i<0||i>=4)return;current=i;items.forEach((b,j)=>{b.classList.toggle('active',j===i);if(j===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});move();const u=new URL(location);u.searchParams.set('v',String.fromCharCode(65+i));history.replaceState(null,'',u);mount(i)}items.forEach((b,i)=>b.addEventListener('click',()=>active(i)));picker.querySelector('.replay').addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toUpperCase();if(k>='A'&&k<='D')active(k.charCodeAt(0)-65);else if(e.key==='ArrowRight')active((current+1)%4);else if(e.key==='ArrowLeft')active((current+3)%4);else if(k==='R')mount(current)});const p=new URLSearchParams(location.search).get('v');active(p&&/^[A-D]$/.test(p)?p.charCodeAt(0)-65:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
