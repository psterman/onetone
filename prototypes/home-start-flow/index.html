<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneTone Home Start Flow Prototypes</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8edf2;background:#0d1114;line-height:1.5;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#0d1114}.stage{min-height:100dvh}.proto{min-height:100dvh;padding:28px 5vw 120px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;color:#81909a;font-size:13px}.brand{display:flex;gap:9px;align-items:center;color:#e9f0f3;font-weight:650}.mark{width:24px;height:24px;border:1px solid #4cc4d7;border-radius:8px;display:grid;place-items:center;color:#4cc4d7;font-size:12px}.muted{color:#81909a}.main{width:min(860px,100%);margin:auto}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#71909b;margin:0 0 14px}.h1{font-size:clamp(32px,5vw,60px);line-height:1.05;letter-spacing:-.045em;margin:0 0 18px;font-weight:650}.lead{color:#9eabb1;font-size:17px;max-width:540px;margin:0}.input{width:100%;border:1px solid #2a3940;border-radius:16px;background:#131b20;color:#eef4f5;padding:20px 22px;font:inherit;outline:0;transition:border-color .2s ease,box-shadow .2s ease}.input:focus{border-color:#55c7d8;box-shadow:0 0 0 4px #55c7d81c}.button{border:0;border-radius:11px;padding:12px 17px;background:#55c7d8;color:#071114;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s ease,background .18s ease}.button:hover{transform:translateY(-1px);background:#73d5e2}.button.secondary{background:#1b282d;color:#d8e6e9}.button.secondary:hover{background:#26383e}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #2b3d43;border-radius:999px;padding:8px 12px;background:transparent;color:#9fb1b7;cursor:pointer}.chip:hover{color:#e4f3f5;border-color:#4b7982}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fade{animation:fade .35s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .quiet .main{max-width:720px}.quiet .prompt{margin-top:38px;display:grid;gap:14px}.quiet .hint{font-size:13px;color:#718087}.quiet .recent{margin-top:54px;border-top:1px solid #233137;padding-top:20px;display:flex;justify-content:space-between;gap:20px;align-items:start}.quiet .recent strong{display:block;color:#dce8eb;margin:4px 0}.quiet .next{color:#55c7d8;font-size:13px;white-space:nowrap}
    .guide{background:#f2f5f1;color:#1e2c2d}.guide .top{color:#718080}.guide .brand{color:#1e2c2d}.guide .mark{color:#197d84;border-color:#197d84}.guide .main{max-width:900px}.guide .h1{max-width:700px}.guide .lead{color:#617174}.guide .prompt{margin-top:34px;background:#fff;border:1px solid #d6e0dc;border-radius:20px;padding:24px;box-shadow:0 18px 50px #35504b12}.guide .input{background:#f8faf8;border-color:#d8e2de;color:#1e2c2d}.guide .chip{color:#557071;border-color:#c9d8d3}.guide .flow{display:grid;grid-template-columns:1fr 32px 1fr 32px 1fr;align-items:center;margin-top:24px}.guide .step{background:#fff;border:1px solid #d7e2dd;border-radius:14px;padding:16px;min-height:118px}.guide .step b{display:block;font-size:13px;margin-bottom:8px}.guide .step span{font-size:13px;color:#6d7e7d}.guide .arrow{text-align:center;color:#82a19e}.guide .actions{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.guide .button{background:#1e777c;color:#fff}.guide .status{font-size:13px;color:#718080}.guide .status b{color:#1e777c}
    .continue{background:#11151a}.continue .main{max-width:1020px}.continue .workspace{margin-top:34px;display:grid;grid-template-columns:1.35fr .8fr;gap:16px}.continue .hero-card,.continue .side-card{border:1px solid #29343d;border-radius:18px;background:#171d23}.continue .hero-card{padding:30px}.continue .project{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:40px}.continue .project h2{font-size:22px;margin:4px 0}.continue .project p{margin:0;color:#87959d;font-size:13px}.continue .task{border-top:1px solid #2a353c;padding-top:22px}.continue .task-label{color:#62c8d6;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.continue .task h3{font-size:25px;letter-spacing:-.025em;margin:9px 0}.continue .task p{color:#97a4aa;margin:0 0 20px}.continue .side-card{padding:22px}.continue .side-card h3{font-size:14px;margin:0 0 18px}.continue .history{display:grid;gap:17px}.continue .history-item{display:flex;gap:11px;font-size:13px;color:#9ba8ad}.continue .dot{width:7px;height:7px;background:#55c7d8;border-radius:50%;margin-top:7px;flex:0 0 auto}.continue .new{margin-top:16px;width:100%}.continue .prompt-row{margin-top:16px;display:flex;gap:10px}.continue .prompt-row .input{padding:12px 14px;font-size:14px}
    @media(max-width:700px){.proto{padding:20px 20px 110px}.guide .flow,.continue .workspace{grid-template-columns:1fr}.guide .arrow{transform:rotate(90deg);padding:8px}.continue .project{align-items:start;flex-direction:column;margin-bottom:28px}.continue .prompt-row{flex-direction:column}.quiet .recent{display:block}.quiet .next{display:block;margin-top:10px}}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}.fade{animation:none}}
  </style>
</head>
<body>
  <main id="stage" class="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Quiet</button>
    <button class="proto-picker-item">Guide</button>
    <button class="proto-picker-item">Continue</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')],replay=picker.querySelector('.proto-picker-replay');let current=0;
    const shell=(cls,content)=>`<section class="proto ${cls}"><header class="top"><div class="brand"><span class="mark">一</span>OneTone</div><span>让想法开始工作</span></header><div class="main">${content}</div></section>`;
    const variants=[()=>shell('quiet fade',`<p class="eyebrow">开始一个工作流</p><h1 class="h1">先把想法说出来。</h1><p class="lead">不用先想清楚全部细节。告诉我你想做什么，我帮你找到下一步。</p><div class="prompt"><input class="input" placeholder="例如：我想做一个更清晰的首页" autofocus><div class="row"><button class="button" onclick="this.closest('.prompt').querySelector('.hint').textContent='已准备好，下一步会先帮你拆解目标。'">开始整理</button><span class="hint">按 Enter 也可以开始</span></div><div class="chips"><button class="chip">继续上次工作</button><button class="chip">从一个空项目开始</button></div></div><div class="recent"><div><span class="muted">上次停在这里</span><strong>重新整理 OneTone 首页</strong><span class="muted">已经完成：目标与入口梳理</span></div><span class="next">继续 →</span></div>`),()=>shell('guide fade',`<p class="eyebrow">把模糊想法变成下一步</p><h1 class="h1">你只需要说出想做的事。</h1><p class="lead">OneTone 会先帮你整理方向，再一起开始，而不是把你丢进一堆设置里。</p><div class="prompt"><input class="input" placeholder="例如：我想做一个更有层次的登录页"><div class="chips"><button class="chip">做一个页面</button><button class="chip">修一个问题</button><button class="chip">继续一个功能</button></div><div class="flow"><div class="step"><b>01 说出目标</b><span>用你习惯的方式描述，不需要专业术语。</span></div><div class="arrow">→</div><div class="step"><b>02 理清思路</b><span>把目标拆成几个可以马上行动的小步骤。</span></div><div class="arrow">→</div><div class="step"><b>03 开始工作</b><span>从第一步开始，随时可以调整方向。</span></div></div><div class="actions"><span class="status">当前还没有开始的工作流</span><button class="button">开始整理</button></div></div>`),()=>shell('continue fade',`<p class="eyebrow">继续你的工作</p><h1 class="h1">不用重新解释一遍。</h1><p class="lead">OneTone 记得你正在做什么，帮你从上次停下的地方继续。</p><div class="workspace"><div class="hero-card"><div class="project"><div><span class="muted">当前项目</span><h2>OneTone Website</h2><p>E:\\voice-pilot · main</p></div><span class="muted">刚刚</span></div><div class="task"><span class="task-label">下一步建议</span><h3>把首页收敛成一个简约的工作入口</h3><p>已经完成首页目标梳理，接下来可以比较三个启动流程原型。</p><div class="row"><button class="button">继续这个任务</button><button class="button secondary">换个方向</button></div></div></div><aside class="side-card"><h3>最近发生</h3><div class="history"><div class="history-item"><i class="dot"></i><span>完成：定义首页核心目标</span></div><div class="history-item"><i class="dot"></i><span>暂停：Agent 首页工作历史</span></div><div class="history-item"><i class="dot"></i><span>等待：选择下一步原型方向</span></div></div><div class="prompt-row"><input class="input" placeholder="想做点别的？"><button class="button">开始</button></div></aside></div>` )];
    function move(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]()})}function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);j===i?el.setAttribute('aria-current','true'):el.removeAttribute('aria-current')});move();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i)}items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay.addEventListener('click',()=>mount(current));window.addEventListener('resize',move);document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
