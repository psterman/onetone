<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>取消听写 · 紧凑行列表原型</title>
<style>
:root{
  --bg:#edf2f8;--surface:#fff;--surface-soft:#f0f7fb;--line:rgba(26,45,74,.10);
  --on:#152238;--on-mute:#5a7086;--primary:#2a9cc4;--primary-strong:#1f8fb8;--primary-soft:#e6f7fc;
  --font:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:13px;line-height:1.45;background:var(--bg);color:var(--on)}
.page{max-width:560px;margin:0 auto;padding:28px 16px 64px}
h1{margin:0 0 4px;font-size:16px;font-weight:800}
.lede{margin:0 0 18px;font-size:12px;color:var(--on-mute)}
.frame{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 14px 12px;box-shadow:0 6px 20px rgba(26,45,74,.05);
}
.finish-title{margin:0 0 10px;font-size:13px;font-weight:800}
.segs{display:flex;gap:0;padding:4px;border-radius:12px;border:1px solid var(--line);background:var(--surface-soft);margin-bottom:10px}
.seg{
  flex:1;min-height:44px;border:none;border-radius:8px;background:transparent;
  font:inherit;font-size:12px;font-weight:600;color:var(--on-mute);cursor:pointer;
}
.seg.is-on{background:var(--surface);color:var(--on);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.delay{display:flex;gap:6px;margin-bottom:14px}
.delay button{
  flex:1;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);
  font:inherit;font-size:12px;font-weight:700;color:var(--on-mute);cursor:pointer;
}
.delay button.is-on{border-color:var(--primary);background:var(--surface);color:var(--primary-strong)}

/* ── compact cancel rows ── */
.cancel{
  border-top:1px solid var(--line);padding-top:12px;margin-top:2px;
}
.cancel-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;
}
.cancel-title{margin:0;font-size:12px;font-weight:800}
.cancel-or{margin:0;font-size:11px;color:var(--on-mute);white-space:nowrap}
.cancel.is-key-gated .row[data-ch="key"]{opacity:.45;pointer-events:none}
.gate{
  display:none;margin:0 0 8px;padding:6px 8px;border-radius:8px;
  background:#fff8eb;border:1px solid #f1dfb8;font-size:11px;color:#7a5a18;
}
.cancel.is-key-gated .gate{display:block}

.list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{
  display:grid;grid-template-columns:22px 72px 1fr;gap:8px;align-items:center;
  padding:9px 10px;background:var(--surface);border-bottom:1px solid var(--line);
  min-height:44px;
}
.row:last-child{border-bottom:0}
.row.is-on{background:color-mix(in srgb,var(--primary) 4%,#fff)}
.row input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;margin:0}
.row-name{font-size:12px;font-weight:800;color:var(--on);white-space:nowrap}
.row-ctrl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0;justify-content:flex-end}
.chip{
  appearance:none;border:1px solid var(--line);background:var(--surface-soft);
  border-radius:7px;padding:3px 8px;min-height:26px;font:inherit;font-size:11px;font-weight:700;
  color:var(--on-mute);cursor:pointer;line-height:1.2;
}
.chip.is-on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-strong)}
.chip.is-soft{cursor:default;font-weight:600}
.chip.is-link{border-style:dashed;background:transparent;color:var(--primary-strong)}
.row-ctrl .muted{font-size:11px;color:var(--on-mute)}
.warn{width:100%;margin:2px 0 0;font-size:10px;color:#b45309;text-align:right;display:none}
.warn.is-show{display:block}

.sum{
  margin:8px 0 0;font-size:11px;font-weight:700;color:var(--on-mute);
}
.sum b{color:var(--on);font-weight:800}

.note{margin:16px 0 0;font-size:11px;color:var(--on-mute);line-height:1.5}
.note code{font-size:10px;background:var(--surface);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="page">
  <h1>取消听写 · 紧凑行</h1>
  <p class="lede">相对三张大卡：一行一路，去掉重复 Esc 说明。多选 OR，一眼看齐。</p>

  <div class="frame">
    <p class="finish-title">② 说完后</p>
    <div class="segs" id="finishSegs">
      <button type="button" class="seg is-on" data-fm="confirm">结束后自动发送</button>
      <button type="button" class="seg" data-fm="manual">只结束不发送</button>
    </div>
    <div class="delay" id="delayRow">
      <button type="button" data-d="1">1s</button>
      <button type="button" class="is-on" data-d="2">2s</button>
      <button type="button" data-d="3">3s</button>
      <button type="button" data-d="c">自定义</button>
    </div>

    <section class="cancel" id="cancel">
      <div class="cancel-head">
        <p class="cancel-title">取消听写</p>
        <p class="cancel-or">任一触发 → Esc</p>
      </div>
      <p class="gate" id="gate">非自动发送时：启动键窗口不可用；取消词 / 摄像头仍可开。</p>

      <div class="list">
        <div class="row is-on" data-ch="key">
          <input type="checkbox" id="ckKey" checked aria-label="启动键"/>
          <span class="row-name">启动键</span>
          <div class="row-ctrl" id="ctrlKey">
            <button type="button" class="chip" data-win="500">0.5s</button>
            <button type="button" class="chip is-on" data-win="1200">1.2s</button>
            <button type="button" class="chip" data-win="2000">2s</button>
            <button type="button" class="chip" data-win="c">自定义</button>
          </div>
        </div>

        <div class="row" data-ch="phrase">
          <input type="checkbox" id="ckPhrase" aria-label="取消词"/>
          <span class="row-name">取消词</span>
          <div class="row-ctrl" id="ctrlPhrase">
            <span class="muted">关</span>
          </div>
        </div>

        <div class="row" data-ch="camera">
          <input type="checkbox" id="ckCam" aria-label="摄像头"/>
          <span class="row-name">摄像头</span>
          <div class="row-ctrl" id="ctrlCam">
            <span class="muted">关</span>
          </div>
        </div>
      </div>

      <p class="sum" id="sum">已开 <b>启动键</b></p>
    </section>
  </div>

  <p class="note">
    打开：<code>design-mock/keys-cancel-compact-rows.html</code><br/>
    相对旧版删掉：行内 hint、卡片边框、底部「任一触发即取消」重复句（OR 已放在标题右侧）。
  </p>
</div>

<script>
(function(){
  var st={finish:'confirm', key:true, phrase:false, cam:false, win:1200, gestures:['shakeHead']};
  var G=[
    {id:'shakeHead',l:'摇头'},{id:'openPalm',l:'五指张开'},{id:'deliberateBlink',l:'故意闭眼'},
    {id:'wave',l:'挥手'},{id:'fist',l:'握拳'},{id:'okHand',l:'OK'}
  ];
  var PH=['取消输入','不要了','撤掉'];

  function sync(){
    var keyGated=st.finish!=='confirm';
    document.getElementById('cancel').classList.toggle('is-key-gated', keyGated);
    document.getElementById('delayRow').hidden=keyGated;

    document.getElementById('ckKey').checked=st.key;
    document.getElementById('ckPhrase').checked=st.phrase;
    document.getElementById('ckCam').checked=st.cam;

    document.querySelectorAll('.row').forEach(function(r){
      var ch=r.getAttribute('data-ch');
      var on=ch==='key'?st.key:(ch==='phrase'?st.phrase:st.cam);
      r.classList.toggle('is-on', on && !(ch==='key'&&keyGated));
    });

    // key chips
    var ck=document.getElementById('ctrlKey');
    if(st.key){
      ck.innerHTML=
        '<button type="button" class="chip'+(st.win===500?' is-on':'')+'" data-win="500">0.5s</button>'+
        '<button type="button" class="chip'+(st.win===1200?' is-on':'')+'" data-win="1200">1.2s</button>'+
        '<button type="button" class="chip'+(st.win===2000?' is-on':'')+'" data-win="2000">2s</button>'+
        '<button type="button" class="chip" data-win="c">自定义</button>';
    }else ck.innerHTML='<span class="muted">关</span>';

    // phrase
    var cp=document.getElementById('ctrlPhrase');
    if(st.phrase){
      cp.innerHTML=PH.map(function(p){ return '<span class="chip is-soft">'+p+'</span>'; }).join('')+
        '<button type="button" class="chip is-link" id="btnEdit">编辑</button>';
    }else cp.innerHTML='<span class="muted">关</span>';

    // camera
    var cc=document.getElementById('ctrlCam');
    if(st.cam){
      cc.innerHTML=G.map(function(g){
        var on=st.gestures.indexOf(g.id)>=0;
        return '<button type="button" class="chip'+(on?' is-on':'')+'" data-g="'+g.id+'">'+g.l+'</button>';
      }).join('')+'<span class="warn'+(st.gestures.length?'':' is-show')+'" id="gWarn">请选手势</span>';
    }else cc.innerHTML='<span class="muted">关</span>';

    var parts=[];
    if(st.key&&!keyGated) parts.push('启动键');
    if(st.phrase) parts.push('取消词');
    if(st.cam&&st.gestures.length) parts.push('摄像头');
    var sum=document.getElementById('sum');
    sum.innerHTML=parts.length?('已开 <b>'+parts.join(' · ')+'</b>'):'未开启取消通道';
  }

  document.getElementById('finishSegs').onclick=function(e){
    var b=e.target.closest('[data-fm]'); if(!b) return;
    st.finish=b.getAttribute('data-fm');
    document.querySelectorAll('#finishSegs .seg').forEach(function(x){ x.classList.toggle('is-on', x===b); });
    sync();
  };
  document.getElementById('ckKey').onchange=function(e){ st.key=e.target.checked; sync(); };
  document.getElementById('ckPhrase').onchange=function(e){ st.phrase=e.target.checked; sync(); };
  document.getElementById('ckCam').onchange=function(e){
    st.cam=e.target.checked;
    if(st.cam&&!st.gestures.length) st.gestures=['shakeHead'];
    sync();
  };
  document.getElementById('cancel').onclick=function(e){
    var w=e.target.closest('[data-win]');
    if(w){
      var v=w.getAttribute('data-win');
      if(v==='c'){ alert('原型：自定义 intervalMs'); return; }
      st.win=Number(v); st.key=true; sync(); return;
    }
    var g=e.target.closest('[data-g]');
    if(g){
      var id=g.getAttribute('data-g');
      var i=st.gestures.indexOf(id);
      if(i>=0) st.gestures.splice(i,1); else st.gestures.push(id);
      st.cam=true; sync(); return;
    }
    if(e.target.id==='btnEdit'||e.target.closest('#btnEdit')) alert('原型：跳转语音页取消词');
  };

  sync();
})();
</script>
</body>
</html>
