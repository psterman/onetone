<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>快速入门 — 语音激活 / 结束双栏 Preview</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --primary: #2a9cc4;
      --primary-strong: #1f8fb8;
      --primary-soft: #e6f7fc;
      --indigo: #1a2d4a;
      --on-surface: #152238;
      --on-surface-muted: #5a7086;
      --outline-variant: rgba(26,45,74,.10);
      --surface-high: #f7fafc;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--on-surface);
      background: linear-gradient(180deg, #eaf3f8 0%, #f5fafc 100%);
      display: flex; justify-content: center; padding: 36px 20px;
    }
    .card {
      width: min(960px, 100%); background: #fff; border-radius: 28px;
      border: 1px solid var(--outline-variant); padding: 28px 32px 24px;
      box-shadow: 0 14px 34px rgba(26,45,74,.07);
    }
    .badge {
      display: inline-flex; padding: 6px 12px; border-radius: 999px;
      background: var(--primary-soft); color: var(--primary-strong);
      font-size: 12px; font-weight: 800; margin-bottom: 6px;
    }
    .title { margin: 0 0 6px; font-size: 24px; font-weight: 900; color: var(--indigo); }
    .desc { margin: 0 0 18px; max-width: 540px; font-size: 13px; line-height: 1.55; color: var(--on-surface-muted); }
    .panels {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px;
    }
    .panel {
      position: relative; border: 1.5px solid var(--outline-variant); border-radius: 18px;
      padding: 18px 16px; background: var(--surface-high); text-align: left; cursor: pointer;
      transition: filter .25s var(--ease), opacity .25s var(--ease), border-color .2s, box-shadow .2s, transform .15s;
    }
    .panel.is-active {
      border-color: var(--primary); background: var(--primary-soft);
      box-shadow: 0 0 0 3px rgba(42,156,196,.14);
    }
    .panel.is-dim {
      filter: grayscale(1); opacity: .48;
    }
    .panel.is-dim .wave span { animation-play-state: paused !important; }
    .panel.is-locked { cursor: not-allowed; }
    .panel.is-done::after {
      content: "已完成"; position: absolute; top: 10px; right: 10px;
      padding: 2px 8px; border-radius: 999px; background: rgba(34,197,94,.12);
      color: #16a34a; font-size: 10px; font-weight: 800;
    }
    .wave {
      display: flex; align-items: flex-end; justify-content: center; gap: 6px;
      height: 52px; margin: 0 0 12px; padding: 10px; border-radius: 12px; background: #fff;
    }
    .wave span {
      display: block; width: 9px; border-radius: 999px; background: var(--primary);
      height: 14px; animation: bars 1.1s ease-in-out infinite;
    }
    .wave span:nth-child(2) { animation-delay: .15s; }
    .wave span:nth-child(3) { animation-delay: .3s; }
    .wave span:nth-child(4) { animation-delay: .45s; }
    .wave--end span { background: #22c55e; }
    .panel b { display: block; margin-bottom: 4px; font-size: 15px; color: var(--indigo); }
    .panel p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--on-surface-muted); }
    .demo {
      border: 1px dashed var(--outline-variant); border-radius: 18px; padding: 16px;
      background: var(--surface-high); min-height: 140px;
    }
    .demo h4 { margin: 0 0 8px; font-size: 13px; color: var(--primary-strong); }
    .demo .bubble {
      display: inline-block; padding: 10px 12px; border-radius: 12px;
      background: #fff; border: 1px solid var(--outline-variant); font-weight: 700; font-size: 14px;
    }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: #1a2d4a; color: #fff; padding: 10px 16px; border-radius: 12px;
      font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    @keyframes bars {
      0%, 100% { height: 12px; opacity: .55; }
      50% { height: 30px; opacity: 1; }
    }
    @media (max-width: 720px) {
      .panels { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">语音测试</div>
    <h1 class="title">先激活，再说结束</h1>
    <p class="desc">点左侧开始练激活；完成后再点右侧练结束。一次只练一个。</p>
    <div class="panels" id="panels">
      <button type="button" class="panel is-active" data-id="wake" id="panelWake">
        <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <b>语音激活</b>
        <p>说出激活词，开始听写</p>
      </button>
      <button type="button" class="panel is-dim is-locked" data-id="end" id="panelEnd">
        <div class="wave wave--end" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <b>语音结束</b>
        <p>听写开始后结束，不自动发送</p>
      </button>
    </div>
    <div class="demo" id="demo">
      <h4 id="demoTitle">语音激活</h4>
      <div class="bubble" id="demoBubble">先说激活词开始听写</div>
    </div>
  </div>
  <div class="toast" id="toast">请先完成左侧「语音激活」</div>
  <script>
    var wakeDone = false;
    var active = 'wake';
    var wake = document.getElementById('panelWake');
    var end = document.getElementById('panelEnd');
    var toast = document.getElementById('toast');
    var toastTimer = 0;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    }
    function render() {
      wake.classList.toggle('is-active', active === 'wake');
      wake.classList.toggle('is-dim', active !== 'wake');
      wake.classList.toggle('is-done', wakeDone);
      end.classList.toggle('is-active', active === 'end');
      end.classList.toggle('is-dim', active !== 'end');
      end.classList.toggle('is-locked', !wakeDone);
      end.classList.toggle('is-done', active === 'end' && false);
      document.getElementById('demoTitle').textContent = active === 'wake' ? '语音激活' : '语音结束';
      document.getElementById('demoBubble').textContent = active === 'wake'
        ? '先说激活词开始听写'
        : '听写中 · 可说结束词停听写';
    }
    wake.onclick = function () {
      active = 'wake';
      render();
    };
    end.onclick = function () {
      if (!wakeDone) {
        showToast('请先完成左侧「语音激活」');
        return;
      }
      active = 'end';
      render();
    };
    // Demo: double-click left to mark wake done (simulates practice complete)
    wake.ondblclick = function () {
      wakeDone = true;
      active = 'end';
      render();
      showToast('激活已完成，开始练结束');
    };
    render();
  </script>
</body>
</html>
