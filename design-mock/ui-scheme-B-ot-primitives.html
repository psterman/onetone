<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>方案 B · ot-primitives 原语层</title>
  <style>
    /* 拟 src/css/ot-primitives.css — legacy + tray 共用 */
    :root {
      --ot-p-primary: #2a9cc4;
      --ot-p-primary-soft: #e6f7fc;
      --ot-p-primary-deep: #1e87ad;
      --ot-p-surface: #fff;
      --ot-p-surface-2: #f8fafc;
      --ot-p-on: #152238;
      --ot-p-muted: #5a7086;
      --ot-p-outline: rgba(26,45,74,.1);
      --ot-p-green: #2e7d4f;
      --ot-p-green-soft: rgba(46,125,79,.1);
      --ot-p-blue: #00a3ff;
      --ot-p-blue-soft: rgba(0,163,255,.1);
      --ot-p-radius: 12px;
      --ot-p-radius-sm: 8px;
      --ot-p-shadow: 0 10px 28px rgba(26,45,74,.16);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: #e8edf3; font-family: "Segoe UI","PingFang SC",sans-serif; font-size: 13px; color: var(--ot-p-on); }
    .banner { font-size: 11px; color: var(--ot-p-muted); margin-bottom: 12px; line-height: 1.5; max-width: 316px; margin-left: auto; margin-right: auto; }
    .banner b { color: var(--ot-p-primary-deep); }
    .banner a { color: var(--ot-p-primary-deep); }
    .banner code { font-size: 10px; background: #fff; padding: 1px 4px; border-radius: 3px; }

    .ot-tray {
      width: 316px; margin: 0 auto; background: var(--ot-p-surface);
      border: 1px solid var(--ot-p-outline); border-radius: var(--ot-p-radius);
      box-shadow: var(--ot-p-shadow); padding: 5px;
    }

    .ot-hero {
      margin: 4px; padding: 11px 12px; border-radius: 10px;
      background: linear-gradient(135deg, #fff, var(--ot-p-blue-soft));
      border: 1px solid var(--ot-p-outline); display: flex; align-items: center; gap: 10px;
    }
    .ot-hero__title { font-size: 14.5px; font-weight: 800; }
    .ot-hero__act {
      padding: 8px 11px; border: none; border-radius: var(--ot-p-radius-sm);
      background: linear-gradient(135deg, var(--ot-p-primary), var(--ot-p-primary-deep));
      color: #fff; font-size: 10.5px; font-weight: 700; cursor: pointer; font: inherit;
    }

    .ot-sec-head {
      font-size: 10px; font-weight: 700; color: var(--ot-p-muted);
      padding: 7px 12px 3px; letter-spacing: .04em;
    }

    .ot-ch-row {
      display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px; margin: 0 4px;
      border-radius: var(--ot-p-radius-sm); border: 1px solid transparent;
    }
    .ot-ch-row:hover { background: var(--ot-p-primary-soft); }
    .ot-ch-row__icon {
      width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      background: var(--ot-p-blue-soft); flex-shrink: 0; font-size: 12px;
    }
    .ot-ch-row__body { flex: 1; min-width: 0; }
    .ot-ch-row__title { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ot-ch-row__scene { font-size: 10px; color: var(--ot-p-muted); margin-top: 2px; }
    .ot-ch-row__sw { margin-top: 6px; }

    .ot-pill {
      font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 4px;
      background: var(--ot-p-green-soft); color: var(--ot-p-green);
    }
    .ot-pill--wait { background: var(--ot-p-blue-soft); color: #0e7490; }

    .ot-switch {
      width: 34px; height: 18px; border-radius: 10px; border: none; padding: 0;
      background: var(--ot-p-primary); position: relative; cursor: pointer;
    }
    .ot-switch::after {
      content: ''; position: absolute; top: 2px; left: 18px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; transition: left .15s;
      box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .ot-switch--off { background: #8a98a8; }
    .ot-switch--off::after { left: 2px; }

    .ot-sw-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 4px 6px; background: var(--ot-p-surface-2); border: 1px solid var(--ot-p-outline);
      border-radius: 6px; font-size: 10.5px;
    }
    .ot-sw-row__hint { font-size: 9px; color: #8a98a8; display: block; margin-top: 1px; }

    .ot-tabs { display: flex; gap: 4px; margin: 8px 6px 4px; }
    .ot-tab {
      flex: 1; padding: 7px 4px; font-size: 11px; font-weight: 600; text-align: center;
      border: 1px solid var(--ot-p-outline); border-radius: 6px; background: var(--ot-p-surface-2);
      cursor: pointer; color: var(--ot-p-muted);
    }
    .ot-tab--on { background: var(--ot-p-primary-soft); border-color: rgba(42,156,196,.35); color: var(--ot-p-primary-deep); }

    .ot-note {
      margin: 8px 6px 4px; padding: 8px; font-size: 10px; color: var(--ot-p-muted);
      background: var(--ot-p-surface-2); border-radius: 6px; line-height: 1.45;
      border: 1px dashed var(--ot-p-outline);
    }
    .class-tag { font-family: ui-monospace, Consolas, monospace; font-size: 9px; color: var(--ot-p-primary-deep); }
  </style>
</head>
<body>
  <p class="banner"><b>方案 B</b> · <code>ot-primitives.css</code> 统一类名 · tray + Face3 共用 · <a href="ui-unify-abcd-compare.html">← 对比</a></p>

  <div class="ot-tray">
    <div class="ot-hero">
      <div style="flex:1">
        <div class="ot-hero__title">正在听</div>
        <div style="margin-top:5px;display:flex;gap:4px">
          <span class="ot-pill ot-pill--wait">语音</span>
          <span class="ot-pill">按键</span>
        </div>
      </div>
      <button type="button" class="ot-hero__act">先停一下</button>
    </div>

    <div class="ot-sec-head">各功能状态 <span class="class-tag">.ot-sec-head</span></div>

    <div class="ot-ch-row">
      <span class="ot-ch-row__icon">🎤</span>
      <div class="ot-ch-row__body">
        <div class="ot-ch-row__title">语音 <span class="ot-pill ot-pill--wait">等着</span></div>
        <div class="ot-ch-row__scene">说「开始输入」就能用</div>
        <div class="ot-ch-row__sw">
          <div class="ot-sw-row">
            <span>说结束词就停<span class="ot-sw-row__hint">例如：就这样</span></span>
            <button type="button" class="ot-switch" data-sw></button>
          </div>
        </div>
      </div>
    </div>

    <div class="ot-ch-row">
      <span class="ot-ch-row__icon">⌨</span>
      <div class="ot-ch-row__body">
        <div class="ot-ch-row__title">按键 <span class="ot-pill">用着</span></div>
        <div class="ot-ch-row__scene">按 F13 启动 · 按住不放</div>
        <div class="ot-ch-row__sw">
          <div class="ot-sw-row">
            <span>使用这个场景<span class="ot-sw-row__hint">关了就按了也没反应</span></span>
            <button type="button" class="ot-switch" data-sw></button>
          </div>
        </div>
      </div>
    </div>

    <div class="ot-tabs">
      <button type="button" class="ot-tab ot-tab--on">语音</button>
      <button type="button" class="ot-tab">按键</button>
      <button type="button" class="ot-tab">小键盘</button>
      <button type="button" class="ot-tab">摄像头</button>
    </div>

    <div class="ot-note">
      <span class="class-tag">.ot-switch</span> <span class="class-tag">.ot-pill</span> <span class="class-tag">.ot-ch-row</span> 一处定义，
      <code>tray-menu.html</code> 与 Face3 预览同 markup → WYSIWYG。图标仍可与 C 方案叠加。
    </div>
  </div>

  <script>
    document.querySelectorAll('[data-sw]').forEach(function (b) {
      b.addEventListener('click', function () { b.classList.toggle('ot-switch--off'); });
    });
  </script>
</body>
</html>
