<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero · 能力卡片（展开式）</title>
  <link rel="stylesheet" href="../src/css/ot-switch.css" />
  <style>
    :root {
      --on:#152238; --muted:#5a7086; --line:rgba(26,45,74,.1);
      --font:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
      --accent:#6366f1; --tint:rgba(99,102,241,.08); --bg:#eef3f7; --ok:#10b981; --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:16px;font-family:var(--font);background:#d4dde6;color:var(--on)}
    .row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1480px;margin:0 auto 14px}
    @media(max-width:1200px){.row{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.row{grid-template-columns:1fr}}

    .app{border-radius:14px;border:1px solid var(--line);background:var(--bg);overflow:hidden;box-shadow:0 6px 18px rgba(26,45,74,.07)}
    .hero{padding:10px 12px 12px;text-align:center}

    .scene{display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.75);font-size:9px;font-weight:700;margin-bottom:8px}
    .scene i{width:16px;height:16px;border-radius:4px;background:#1a1a2e;display:grid;place-items:center;font-style:normal;color:#fff;font-size:8px;font-weight:800}

    .head{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px}
    .orb{width:52px;height:52px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 35%,transparent);background:radial-gradient(circle at 35% 28%,#fff,var(--tint));color:var(--accent-deep);display:grid;place-items:center}
    .orb svg{width:22px;height:22px}
    .orb.keys{color:#0284c7;border-color:rgba(14,165,233,.35);background:radial-gradient(circle at 35% 28%,#fff,rgba(14,165,233,.08))}
    .orb.pad{color:#7c3aed;border-color:rgba(168,85,247,.35);background:radial-gradient(circle at 35% 28%,#fff,rgba(168,85,247,.08))}
    .orb.cam{color:#15803d;border-color:rgba(34,197,94,.35);background:radial-gradient(circle at 35% 28%,#fff,rgba(34,197,94,.08))}
    .ch-name{font-size:11px;font-weight:800}

    .rt{margin-bottom:10px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;text-align:left;font-size:9px}
    .rt .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
    .rt strong{font-size:10px;flex:1}
    .rt.warn .dot{background:var(--warn)}
    .ot-switch--sm{width:26px;height:15px}
    .ot-switch--sm::after{width:11px;height:11px}
    .ot-switch--sm.is-on::after{transform:translateX(11px)}

    .caps{display:flex;flex-direction:column;gap:6px;text-align:left}
    .cap{border-radius:11px;border:1px solid var(--line);background:#fff;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
    .cap:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
    .cap.is-open{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:0 4px 14px rgba(99,102,241,.1)}
    .cap-hd{display:flex;align-items:center;gap:8px;padding:8px 10px}
    .cap-num{width:18px;height:18px;border-radius:50%;flex-shrink:0;background:var(--tint);color:var(--accent-deep);font-size:8px;font-weight:800;display:grid;place-items:center}
    .cap.is-open .cap-num{background:var(--accent);color:#fff}
    .cap-title{flex:1;min-width:0;font-size:10px;font-weight:800}
    .cap-sum{font-size:8px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
    .cap-st{font-size:7px;font-weight:800;padding:2px 6px;border-radius:999px;flex-shrink:0}
    .cap-st.on{background:rgba(16,185,129,.12);color:var(--ok)}
    .cap-st.off{background:rgba(90,112,134,.1);color:var(--muted)}
    .cap-chev{color:var(--muted);font-size:12px;transition:transform .2s;flex-shrink:0}
    .cap.is-open .cap-chev{transform:rotate(90deg)}
    .cap-bd{display:none;padding:0 10px 10px;border-top:1px solid var(--line);margin-top:0}
    .cap.is-open .cap-bd{display:block}
    .cap-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:9px;border-bottom:1px solid var(--line)}
    .cap-row:last-child{border-bottom:0}
    .cap-row span{color:var(--muted);font-weight:600}
  .key-cap{display:inline-block;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f1f5f9);font-size:9px;font-weight:800}

    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:8px 10px 10px;border-top:1px solid var(--line);background:rgba(255,255,255,.35)}
    .card{padding:5px;border-radius:9px;border:1px solid var(--line);background:#f8fafc;text-align:left}
    .card.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:#fff;box-shadow:0 0 0 2px rgba(99,102,241,.1)}
    .card-t{font-size:8px;font-weight:800}
  </style>
</head>
<body>
  <div class="row" id="r1"></div>
  <div class="row" id="r2"></div>
  <script>
    var I={voice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>',keys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>',softPad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>'};
    var DATA={
      voice:{cls:'',name:'说话',rt:{t:'按 AutoTrigger 说话',w:0},caps:[{n:'开始输入',s:'说「开始输入」',on:1,d:[['触发','口令'],['状态','已开启']]},{n:'发送',s:'说「发送」',on:1,d:[['触发','口令']]},{n:'取消',s:'说「取消」',on:1,d:[['触发','口令']]}]},
      keys:{cls:'keys',name:'按键',rt:null,caps:[{n:'输入到目标',s:'按住 音量减',on:1,d:[['按键','音量减'],['目标','右 Alt']]},{n:'备用发送',s:'Ctrl+Enter',on:1,d:[['按键','Ctrl+Enter']]}]},
      softPad:{cls:'pad',name:'屏幕',rt:{t:'正在确认当前控制',w:0},caps:[{n:'确认 Agent',s:'屏幕按钮',on:1,d:[['按钮','确认']]},{n:'拒绝',s:'未配置',on:0,d:[['按钮','—']]}]},
      camera:{cls:'cam',name:'摄像头',rt:{t:'已配置 · 未运行',w:1},caps:[{n:'举手确认',s:'手势 OK',on:1,d:[['手势','举手'],['绑定','agent.approve']]},{n:'离席暂停',s:'检测离席',on:1,d:[['事件','离席'],['动作','暂停语音']]}]}
    };
    var CH=['voice','keys','softPad','camera'];
    var TIT={voice:'说话触发',keys:'按键触发',softPad:'屏幕按钮',camera:'摄像头确认'};

    function capHtml(c,i,open){
      var d=c.d.map(function(r){return '<div class="cap-row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>';}).join('');
      return '<div class="cap'+(open?' is-open':'')+'" data-cap><div class="cap-hd"><span class="cap-num">'+(i+1)+'</span><span class="cap-title">'+c.n+'</span><span class="cap-sum">'+c.s+'</span><span class="cap-st '+(c.on?'on':'off')+'">'+(c.on?'开':'关')+'</span><span class="cap-chev">›</span></div><div class="cap-bd">'+d+'</div></div>';
    }
    function app(mode,openIdx){
      var d=DATA[mode];
      var caps=d.caps.map(function(c,i){return capHtml(c,i,i===openIdx);}).join('');
      var rt=d.rt?'<div class="rt'+(d.rt.w?' warn':'')+'"><span class="dot"></span><strong>'+d.rt.t+'</strong><span class="ot-switch ot-switch--sm'+(d.rt.w?'':' is-on')+'"></span></div>':'';
      var cards=CH.map(function(m){return '<div class="card'+(m===mode?' on':'')+'"><div class="card-t">'+TIT[m]+'</div></div>';}).join('');
      return '<div class="app"><div class="hero"><div class="scene"><i>C</i> Cursor</div><div class="head"><div class="orb '+d.cls+'">'+I[mode]+'</div><span class="ch-name">'+d.name+'</span></div>'+rt+'<div class="caps">'+caps+'</div></div><div class="cards">'+cards+'</div></div>';
    }
    document.getElementById('r1').innerHTML=CH.map(function(m){return app(m,-1);}).join('');
    document.getElementById('r2').innerHTML=CH.map(function(m,i){return app(m,0);}).join('');
    document.querySelectorAll('[data-cap]').forEach(function(el){
      el.addEventListener('click',function(e){
        e.stopPropagation();
        var p=el.closest('.caps');
        var was=el.classList.contains('is-open');
        p.querySelectorAll('.cap').forEach(function(c){c.classList.remove('is-open');});
        if(!was)el.classList.add('is-open');
      });
    });
  </script>
</body>
</html>
