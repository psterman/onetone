<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>先激活，再说结束 — 麦克风开关动画 Preview v6</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --primary: #2a9cc4;
      --primary-strong: #1f8fb8;
      --primary-soft: #e6f7fc;
      --indigo: #1a2d4a;
      --on-surface: #152238;
      --on-surface-muted: #5a7086;
      --surface-high: rgba(255,255,255,.97);
      --surface-soft: #f0f7fb;
      --outline-variant: rgba(26,45,74,.10);
      --shadow-card: 0 14px 34px rgba(26,45,74,.07);
      --htv-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --bounce:   cubic-bezier(.34, 1.56, .64, 1);
      --soft:     cubic-bezier(.4, 0, .2, 1);
      --cycle: 5s;
      --offset: 2.5s;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--on-surface);
      background: linear-gradient(180deg, #eaf3f8 0%, #f5fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
    }
    .stage {
      width: min(960px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
    }
    h1.title {
      margin: 6px 0 4px;
      font-size: 24px;
      font-weight: 800;
      color: var(--indigo);
      letter-spacing: -.01em;
    }
    p.desc {
      margin: 0 0 4px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--on-surface-muted);
      max-width: 640px;
      text-align: center;
    }
    .cards {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 8px 0;
    }

    /* === Card === */
    .card {
      position: relative;
      background: var(--surface-high);
      border: 1.5px solid var(--outline-variant);
      border-radius: 24px;
      padding: 22px 22px 18px;
      min-height: 280px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card.is-wake  { --accent: var(--primary); }
    .card.is-end   { --accent: var(--primary); }

    /* Head */
    .card__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card__title { font-size: 15px; font-weight: 800; color: var(--indigo); }
    .card__status {
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 999px;
      background: var(--surface-soft); color: var(--on-surface-muted);
      letter-spacing: .02em;
      transition: all .3s var(--soft);
    }
    .card__status::before {
      content: ""; display: inline-block;
      width: 5px; height: 5px; border-radius: 50%;
      background: currentColor; margin-right: 5px; vertical-align: middle;
    }
    .card.is-listening .card__status,
    .card.is-recognizing .card__status {
      background: var(--primary-soft); color: var(--primary-strong);
    }
    .card.is-listening .card__status::before,
    .card.is-recognizing .card__status::before {
      animation: dotPulse 1s ease-in-out infinite;
    }
    .card.is-recognizing .card__status::before { animation-duration: .5s; }
    .card.is-active .card__status {
      background: var(--primary); color: #fff;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.7); }
    }

    /* Stage */
    .card__stage {
      position: relative;
      flex: 1;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* 麦克风 + 容器（不再用大光晕） */
    .card__mic-wrap {
      position: relative;
      width: 84px; height: 84px;
      display: flex; align-items: center; justify-content: center;
    }
    /* 极淡背景圆 — 只在 listening/recognizing/active 时显示，颜色是 accent 12% */
    .card__mic-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      transition: opacity .3s var(--soft);
    }
    .card.is-listening .card__mic-ring,
    .card.is-recognizing .card__mic-ring,
    .card.is-active .card__mic-ring {
      opacity: .12;
    }
    /* 内圈填充 — listening 时淡 cyan，active 时实心 cyan */
    .card__mic-inner {
      position: relative;
      z-index: 2;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #fff;
      border: 1.5px solid var(--outline-variant);
      display: flex; align-items: center; justify-content: center;
      transition: background .35s var(--soft), border-color .35s var(--soft), transform .4s var(--bounce);
    }
    /* ===== 左卡：关 → 开 ===== */
    .card.is-wake.is-listening .card__mic-inner { border-color: var(--accent); }
    .card.is-wake.is-recognizing .card__mic-inner { border-color: var(--accent); }
    .card.is-wake.is-active .card__mic-inner {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.05);
    }
    /* ===== 右卡：默认（听写中）= 工作中 = 开 ===== */
    .card.is-end .card__mic-ring { opacity: .12; }
    .card.is-end .card__mic-inner {
      background: var(--accent);
      border-color: var(--accent);
    }
    .card.is-end .mic-body, .card.is-end .mic-arc,
    .card.is-end .mic-stem, .card.is-end .mic-base {
      stroke: #fff;
    }
    /* 右卡：listening / recognizing / active = 关闭中 / 已结束 = 关 */
    .card.is-end.is-listening .card__mic-ring,
    .card.is-end.is-recognizing .card__mic-ring,
    .card.is-end.is-active .card__mic-ring { opacity: 0; }
    .card.is-end.is-listening .card__mic-inner,
    .card.is-end.is-recognizing .card__mic-inner,
    .card.is-end.is-active .card__mic-inner {
      background: #fff;
      border-color: var(--outline-variant);
      transform: scale(1);
    }
    .card.is-end.is-listening .mic-body, .card.is-end.is-listening .mic-arc,
    .card.is-end.is-listening .mic-stem, .card.is-end.is-listening .mic-base,
    .card.is-end.is-recognizing .mic-body, .card.is-end.is-recognizing .mic-arc,
    .card.is-end.is-recognizing .mic-stem, .card.is-end.is-recognizing .mic-base,
    .card.is-end.is-active .mic-body, .card.is-end.is-active .mic-arc,
    .card.is-end.is-active .mic-stem, .card.is-end.is-active .mic-base {
      stroke: var(--on-surface-muted);
    }
    /* 按下→弹起（仅 listening/recognizing 一帧） */
    .card.is-listening .card__mic-inner,
    .card.is-recognizing .card__mic-inner {
      animation: micPress .45s var(--bounce);
    }
    .card.is-active .card__mic-inner { animation: none; }
    @keyframes micPress {
      0%   { transform: scale(1); }
      30%  { transform: scale(.92); }
      65%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* mic parts */
    .card__mic-inner svg { display: block; }
    .mic-body, .mic-arc, .mic-stem, .mic-base {
      stroke: var(--on-surface-muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
      transition: stroke .35s var(--soft);
    }
    .card.is-listening .mic-body,
    .card.is-listening .mic-arc,
    .card.is-listening .mic-stem,
    .card.is-listening .mic-base,
    .card.is-recognizing .mic-body,
    .card.is-recognizing .mic-arc,
    .card.is-recognizing .mic-stem,
    .card.is-recognizing .mic-base {
      stroke: var(--accent);
    }
    .card.is-wake.is-listening .mic-body, .card.is-wake.is-listening .mic-arc,
    .card.is-wake.is-listening .mic-stem, .card.is-wake.is-listening .mic-base,
    .card.is-wake.is-recognizing .mic-body, .card.is-wake.is-recognizing .mic-arc,
    .card.is-wake.is-recognizing .mic-stem, .card.is-wake.is-recognizing .mic-base {
      stroke: var(--accent);
    }
    .card.is-wake.is-active .mic-body,
    .card.is-wake.is-active .mic-arc,
    .card.is-wake.is-active .mic-stem,
    .card.is-wake.is-active .mic-base {
      stroke: #fff;
    }

    /* 波形柱 — 单边 4 根，靠近 mic */
    .card__bars {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 56px;
    }
    .card__bar {
      display: block;
      width: 4px;
      height: 0;
      border-radius: 999px;
      background: var(--accent);
      opacity: 0;
    }
    .card__bar { animation: barStage var(--cycle) var(--soft) infinite; }
    .card.is-wake  .card__bar { animation-delay: 0s; }
    .card.is-end   .card__bar { animation-delay: var(--offset); }
    .card__bar:nth-child(1) { animation-delay: 0s; }
    .card.is-end .card__bar:nth-child(1) { animation-delay: var(--offset); }
    .card__bar:nth-child(2) { animation-delay: -.08s; }
    .card.is-end .card__bar:nth-child(2) { animation-delay: calc(var(--offset) - .08s); }
    .card__bar:nth-child(3) { animation-delay: -.16s; }
    .card.is-end .card__bar:nth-child(3) { animation-delay: calc(var(--offset) - .16s); }
    .card__bar:nth-child(4) { animation-delay: -.24s; }
    .card.is-end .card__bar:nth-child(4) { animation-delay: calc(var(--offset) - .24s); }

    @keyframes barStage {
      0%, 6%   { height: 0;   opacity: 0; }
      10%      { height: 32px; opacity: 1; }
      14%      { height: 16px; opacity: 1; }
      18%      { height: 28px; opacity: 1; }
      22%      { height: 12px; opacity: 1; }
      26%      { height: 10px; opacity: .7; }
      30%      { height: 18px; opacity: .85; }
      34%      { height: 10px; opacity: .7; }
      38%      { height: 16px; opacity: .85; }
      44%, 76% { height: 14px; opacity: .55; }
      80%      { height: 0; opacity: 0; }
      100%     { height: 0; opacity: 0; }
    }

    .card__desc {
      font-size: 12px;
      color: var(--on-surface-muted);
      line-height: 1.5;
      text-align: center;
      max-width: 280px;
      margin: 0 auto;
      transition: color .3s var(--soft);
    }
    .card.is-active .card__desc { color: var(--primary-strong); font-weight: 600; }

    .legend {
      margin-top: 4px;
      padding: 8px 12px;
      background: var(--surface-soft);
      border-radius: 12px;
      font-size: 11px;
      color: var(--on-surface-muted);
      line-height: 1.55;
      text-align: center;
      max-width: 720px;
    }
    .legend strong { color: var(--primary-strong); }
    .legend code {
      background: #fff;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
      font-size: 10px;
      color: var(--primary-strong);
    }

    @media (prefers-reduced-motion: reduce) {
      .card__mic-inner, .card__bar, .card__mic-ring { animation: none !important; }
      .card__bar { opacity: 1; height: 18px; }
      .card.is-active .card__mic-ring { opacity: .12; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <span class="badge">语音测试</span>
    <h1 class="title">先激活，再说结束</h1>
    <p class="desc">点左侧开始练激活；完成后再点右侧练结束。一次只练一个。可在语音设置里自行修改唤醒词和结束词。</p>

    <div class="cards">
      <!-- 左卡：开始（关 → 开） -->
      <div class="card is-wake" id="cardWake" data-card="wake">
        <div class="card__head">
          <div class="card__title">语音激活</div>
          <div class="card__status" data-status>未激活</div>
        </div>
        <div class="card__stage">
          <div class="card__bars">
            <span class="card__bar"></span>
            <span class="card__bar"></span>
            <span class="card__bar"></span>
            <span class="card__bar"></span>
          </div>
          <div class="card__mic-wrap">
            <span class="card__mic-ring"></span>
            <div class="card__mic-inner" data-mic>
              <svg viewBox="0 0 24 24" width="28" height="28">
                <rect class="mic-body" x="9" y="2" width="6" height="12" rx="3"/>
                <path class="mic-arc" d="M5 11a7 7 0 0 0 14 0"/>
                <line class="mic-stem" x1="12" y1="18" x2="12" y2="22"/>
                <line class="mic-base" x1="8" y1="22" x2="16" y2="22"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="card__desc">说出激活词，麦克风打开开始听写</div>
      </div>

      <!-- 右卡：结束（开 → 关） -->
      <div class="card is-end" id="cardEnd" data-card="end">
        <div class="card__head">
          <div class="card__title">语音结束</div>
          <div class="card__status" data-status>听写中</div>
        </div>
        <div class="card__stage">
          <div class="card__bars">
            <span class="card__bar"></span>
            <span class="card__bar"></span>
            <span class="card__bar"></span>
            <span class="card__bar"></span>
          </div>
          <div class="card__mic-wrap">
            <span class="card__mic-ring"></span>
            <div class="card__mic-inner" data-mic>
              <svg viewBox="0 0 24 24" width="28" height="28">
                <rect class="mic-body" x="9" y="2" width="6" height="12" rx="3"/>
                <path class="mic-arc" d="M5 11a7 7 0 0 0 14 0"/>
                <line class="mic-stem" x1="12" y1="18" x2="12" y2="22"/>
                <line class="mic-base" x1="8" y1="22" x2="16" y2="22"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="card__desc">说结束词，麦克风关闭停止听写</div>
      </div>
    </div>

    <p class="legend">
      <strong>左卡</strong>：<code>关</code> → 按下 → <code>开</code>：mic 圆从灰描边 → cyan 实心，柱从 0 弹起<br>
      <strong>右卡</strong>：<code>开</code> → 按下 → <code>关</code>：mic 圆从 cyan 实心 → 灰描边，柱从高归 0<br>
      单色 <code>#2a9cc4</code>，无渐变光晕。开关心智：mic 圆"按亮/按灭"。
    </p>
  </div>

  <script>
    (function(){
      'use strict';
      var cards = [
        { el: document.getElementById('cardWake'), offset: 0,
          pending: '未激活', listening: '打开中…', recognizing: '识别中…', success: '已激活',
          mode: 'open' },
        { el: document.getElementById('cardEnd'),  offset: 2.5,
          pending: '听写中', listening: '关闭中…', recognizing: '识别中…', success: '已结束',
          mode: 'close' }
      ];
      cards.forEach(function(c){
        c.statusEl = c.el.querySelector('[data-status]');
        c.statusEl.textContent = c.pending;
      });
      var CYCLE = 5;

      function setState(c, state, text){
        c.el.classList.remove('is-active', 'is-listening', 'is-recognizing');
        if (state === 'listening')   c.el.classList.add('is-listening');
        if (state === 'recognizing') c.el.classList.add('is-recognizing');
        if (state === 'active')      c.el.classList.add('is-active');
        c.statusEl.textContent = text;
      }

      function tick(){
        var t = Date.now() / 1000;
        cards.forEach(function(c){
          var p = (t + c.offset) % CYCLE;
          if (c.mode === 'open') {
            if (p < 0.4)      setState(c, 'pending', c.pending);
            else if (p < 0.9)  setState(c, 'listening', c.listening);
            else if (p < 1.3)  setState(c, 'recognizing', c.recognizing);
            else if (p < 4.8) {
              if (!c.el.classList.contains('is-active')) setState(c, 'active', c.success);
            } else {
              if (c.el.classList.contains('is-active')) setState(c, 'pending', c.pending);
            }
          } else {
            if (p < 1.8) {
              setState(c, 'pending', c.pending);
            } else if (p < 2.3) {
              setState(c, 'listening', c.listening);
            } else if (p < 2.8) {
              setState(c, 'recognizing', c.recognizing);
            } else {
              if (!c.el.classList.contains('is-active')) setState(c, 'active', c.success);
            }
          }
        });
        requestAnimationFrame(tick);
      }

      cards.forEach(function(c){
        c.el.addEventListener('click', function(){
          setState(c, 'active', c.success);
        });
      });

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
