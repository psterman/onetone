<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hero 状态动效 · 四通道 + 摄像头 A/B</title>
  <style>
    :root {
      --on:#1c1c1e; --muted:#8e8e93; --line:rgba(0,0,0,.08);
      --font:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
      --card:#fff; --bg:#f2f2f7;
      --voice:#007aff; --keys:#2a9cc4; --pad:#7c5cbf; --cam:#34a853;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--on);padding:16px}
    .page{max-width:1440px;margin:0 auto}
    h1{font-size:14px;font-weight:600;margin-bottom:4px}
    .sub{font-size:11px;color:var(--muted);margin-bottom:10px}
    .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .toolbar button{font:inherit;font-size:10px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
    .toolbar button.primary{background:var(--voice);color:#fff;border-color:var(--voice)}

    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}

    .panel{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04);display:flex;flex-direction:column;min-height:360px}
    .panel-hd{padding:12px 14px 0;display:flex;justify-content:space-between;gap:8px}
    .panel-hd b{font-size:12px;font-weight:600;display:block}
    .token{font-size:9px;color:var(--muted);margin-top:2px;font-family:ui-monospace,monospace}
    .state-btn{font:inherit;font-size:9px;font-weight:600;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:#fafafa;cursor:pointer}

    .hero{flex:1;padding:6px 16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .ctx{font-size:10px;color:var(--muted);margin-bottom:10px}
    .ctx em{font-style:normal;font-weight:600;color:var(--on)}
    .focus{font-size:16px;font-weight:600;letter-spacing:-.02em;margin-top:10px;transition:color .25s var(--ease),transform .25s var(--ease)}
    .focus.live{color:var(--accent,var(--voice))}
    .focus.bump{animation:focusBump .35s var(--ease)}
    @keyframes focusBump{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
    .hint{font-size:11px;color:var(--muted);margin-top:5px}

    .orb{width:60px;height:60px;border-radius:50%;border:1px solid rgba(0,122,255,.2);
      background:linear-gradient(160deg,#f8f9ff,#eef3ff);color:var(--voice);display:grid;place-items:center;position:relative;transition:box-shadow .3s}
    .orb svg{width:24px;height:24px}
    .orb.live{box-shadow:0 0 0 8px rgba(0,122,255,.12)}
    .orb.live::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(0,122,255,.35);animation:orbRing 1.6s ease-out infinite}
    .orb.live::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:rgba(0,122,255,.08);animation:orbBreath 1.6s ease-in-out infinite}
    @keyframes orbRing{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
    @keyframes orbBreath{0%,100%{opacity:.5}50%{opacity:1}}

    .pair{display:flex;align-items:center;justify-content:center;gap:8px}
    .cap{padding:9px 11px;border-radius:9px;background:linear-gradient(180deg,#fff,#f0f2f5);
      border:1px solid rgba(0,0,0,.08);font-size:10px;font-weight:700;transition:transform .2s var(--ease),box-shadow .2s}
    .cap.press{transform:translateY(3px) scale(.96);box-shadow:0 0 0 4px rgba(42,156,196,.2);border-color:var(--keys);color:var(--keys);animation:keyPress .4s var(--ease)}
    @keyframes keyPress{0%{transform:translateY(0)}50%{transform:translateY(4px) scale(.94)}100%{transform:translateY(3px) scale(.96)}}
    .cap.arr{color:var(--muted);background:none;border:none;box-shadow:none;font-size:12px}

    .pad-face{display:flex;gap:5px;justify-content:center}
    .pad-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fafafa;font-size:8px;font-weight:700;color:var(--muted);display:grid;place-items:center;transition:transform .2s,background .2s}
    .pad-btn.on{background:rgba(124,92,191,.12);border-color:rgba(124,92,191,.4);color:var(--pad)}
    .pad-btn.pulse{animation:padPulse .6s var(--ease)}
    @keyframes padPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .agent-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);margin:6px auto 0;transition:background .2s}
    .agent-dot.live{background:var(--pad);box-shadow:0 0 0 0 rgba(124,92,191,.4);animation:dotPing 1.4s ease-out infinite}
    @keyframes dotPing{0%{box-shadow:0 0 0 0 rgba(124,92,191,.45)}70%{box-shadow:0 0 0 8px rgba(124,92,191,0)}100%{box-shadow:0 0 0 0 rgba(124,92,191,0)}}

    .ring{width:60px;height:60px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:border-color .3s,box-shadow .3s}
    .ring svg{width:22px;height:22px;transition:color .3s}
    .ring.run{border-color:rgba(52,168,83,.5);color:var(--cam);box-shadow:0 0 16px rgba(52,168,83,.15)}
    .ring.run.live::before{content:'';position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid rgba(52,168,83,.3);animation:orbRing 2s ease-out infinite}

    .flow{width:100%;max-width:260px;margin-top:18px;position:relative;padding-top:4px}
    .flow-path{position:absolute;left:10%;right:10%;top:17px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
    .flow-path i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .55s var(--ease);position:relative}
    .flow-path i::after{content:'';position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7));opacity:0}
    .flow.is-live .flow-path i::after{opacity:1;animation:shimmer 1.2s ease-in-out infinite}
    @keyframes shimmer{0%,100%{transform:translateX(-8px);opacity:.3}50%{transform:translateX(8px);opacity:1}}
    .flow-nodes{display:flex;justify-content:space-between;position:relative;z-index:1}
    .fn{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;border:none;background:none;cursor:pointer;font:inherit;padding:0;color:inherit}
    .fn.sel .fn-ico{box-shadow:0 0 0 3px rgba(0,122,255,.2);transform:scale(1.1)}
    .fn-ico{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;
      display:grid;place-items:center;color:var(--muted);transition:all .35s var(--ease)}
    .fn-ico svg{width:14px;height:14px}
    .fn.done .fn-ico{border-color:rgba(52,168,83,.5);color:#248a3d;background:rgba(52,168,83,.08);transform:scale(1)}
    .fn.on .fn-ico{border-color:var(--accent);color:var(--accent);background:rgba(0,122,255,.08);transform:scale(1.08)}
    .fn.on.is-live .fn-ico{animation:nodeGlow 1.4s ease-in-out infinite}
    @keyframes nodeGlow{0%,100%{box-shadow:0 0 0 0 rgba(0,122,255,.25)}50%{box-shadow:0 0 0 8px rgba(0,122,255,.08)}}
    .fn.pop .fn-ico{animation:nodePop .4s var(--ease)}
    @keyframes nodePop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1.08)}}
    .fn b{font-size:8px;font-weight:600;color:var(--muted);transition:color .2s}
    .fn.on b,.fn.done b{color:var(--on)}
    .fn s{font-size:7px;color:var(--muted);text-decoration:none}

    .panel.voice{--accent:var(--voice)}
    .panel.keys{--accent:var(--keys)}
    .panel.pad{--accent:var(--pad)}

    .cam-badges{display:flex;gap:6px;justify-content:center;margin-top:12px}
    .badge{font-size:9px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fafafa;color:var(--muted);transition:all .3s var(--ease)}
    .badge.run{background:rgba(52,168,83,.12);border-color:rgba(52,168,83,.35);color:var(--cam)}
    .badge.pres.present{background:rgba(0,122,255,.1);border-color:rgba(0,122,255,.25);color:var(--voice)}
    .chips{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
    .chip{font-size:8px;font-weight:600;padding:4px 8px;border-radius:8px;background:#f5f5f7;border:1px solid var(--line);transition:all .2s}
    .chip.flash{animation:chipFlash .7s ease 2}
    @keyframes chipFlash{0%,100%{background:#f5f5f7;transform:scale(1)}25%{background:rgba(52,168,83,.35);border-color:var(--cam);transform:scale(1.08)}50%{background:rgba(52,168,83,.2)}}
    .chip,.badge.btn-chip{border:none;font:inherit;cursor:pointer}
    .chip.sel,.badge.btn-chip.sel{box-shadow:0 0 0 2px rgba(0,122,255,.25)}

    .detail{width:100%;max-width:240px;display:grid;grid-template-rows:0fr;margin-top:0;opacity:0;overflow:hidden;border-radius:10px;border:1px solid transparent;background:#fafafa;text-align:left;font-size:9px;transition:grid-template-rows .38s var(--ease),opacity .28s var(--ease),margin-top .38s var(--ease),border-color .22s,padding .38s var(--ease);padding:0 10px}
    .detail.is-open{grid-template-rows:1fr;margin-top:10px;opacity:1;border-color:var(--line);padding:8px 10px}
    .detail-in{overflow:hidden;min-height:0;transform:translateY(-8px);opacity:0;transition:transform .32s var(--ease),opacity .26s var(--ease)}
    .detail.is-open .detail-in{transform:translateY(0);opacity:1}
    .detail-row{display:flex;gap:6px;margin-top:4px}.detail-row:first-child{margin-top:0}
    .detail-lbl{font-weight:600;color:var(--muted);min-width:2.2em}

    .cam-bad .flow{opacity:.35;margin-top:12px}
    .cam-bad-lbl{font-size:8px;color:var(--muted);margin-top:8px}
    .ch{display:flex;border-top:1px solid var(--line);padding:6px}
    .ch span{flex:1;text-align:center;font-size:8px;font-weight:600;color:var(--muted);padding:6px}
    .ch span.on{background:rgba(0,0,0,.04);color:var(--on);border-radius:7px}

    .cam-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .cam-wrap .lbl{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:6px}
    .cam-wrap.rec .lbl::after{content:' · 推荐';color:var(--cam)}
    .motion-hint{font-size:10px;color:var(--muted);margin-top:14px;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid var(--line)}

    @media (prefers-reduced-motion:reduce){
      .orb.live::before,.orb.live::after,.ring.run.live::before,.fn.on.is-live .fn-ico,.agent-dot.live,.flow.is-live .flow-path i::after{animation:none!important}
      .flow-path i,.fn-ico,.focus,.badge,.chip{transition:none!important}
      .chip.flash{animation:none!important;background:rgba(52,168,83,.2)!important}
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Hero 状态动效</h1>
    <p class="sub">点节点/徽章展开详情（有动画）· 点「切换状态」看路径填充 + live 脉冲</p>
    <div class="toolbar">
      <button type="button" class="primary" id="btnDemo">▶ 自动演示全部通道</button>
      <button type="button" id="btnStop">停止</button>
    </div>
    <div class="grid" id="main"></div>
    <h1 style="margin-top:4px;font-size:14px">摄像头 A / B</h1>
    <div class="cam-row" id="camAb"></div>
    <p class="motion-hint" id="motionHint"></p>
  </div>
  <script>
    var CH=['voice','keys','softPad','camera'];
    var NAMES={voice:'说话',keys:'按键',softPad:'屏幕',camera:'摄像'};
    var IDX={voice:2,keys:0,softPad:0,camera:0};
    var RULES=['OK→确认','离席→暂停','摇头→拒绝'];
    var VOICE=[
      {token:'idle',focus:'按 AutoTrigger 说话',live:0,path:0,nodes:[{l:'开启',s:'AutoTrigger',st:''},{l:'听写',s:'—',st:''},{l:'发送',s:'—',st:''}]},
      {token:'listening',focus:'等待唤醒词',live:1,path:33,nodes:[{l:'开启',s:'AutoTrigger',st:'done'},{l:'听写',s:'等待',st:'on',live:1},{l:'发送',s:'—',st:''}]},
      {token:'dictating',focus:'正在听写…',live:1,path:66,nodes:[{l:'开启',s:'✓',st:'done'},{l:'听写',s:'进行中',st:'on',live:1},{l:'发送',s:'—',st:''}]},
      {token:'ready',focus:'说「发送」结束',live:0,path:100,nodes:[{l:'开启',s:'✓',st:'done'},{l:'听写',s:'✓',st:'done'},{l:'发送',s:'口令',st:'on'}]}
    ];
    var KEYS=[
      {token:'idle',focus:'按住 音量减',press:0,path:0,nodes:[{l:'触发',s:'音量减',st:''},{l:'输出',s:'右 Alt',st:''}]},
      {token:'triggered',focus:'按住 音量减',press:1,path:50,nodes:[{l:'触发',s:'音量减',st:'on',live:1},{l:'输出',s:'右 Alt',st:''}]},
      {token:'ready',focus:'输出到 右 Alt',press:0,path:100,nodes:[{l:'触发',s:'✓',st:'done'},{l:'输出',s:'右 Alt',st:'done'}]}
    ];
    var PAD=[
      {token:'idle',focus:'屏幕按钮待命',agent:0,path:0,nodes:[{l:'屏幕',s:'3 键',st:''},{l:'Agent',s:'Codex',st:''}]},
      {token:'triggered',focus:'正在确认 Agent',agent:1,path:50,nodes:[{l:'屏幕',s:'已点',st:'done'},{l:'Agent',s:'Codex',st:'on',live:1}]},
      {token:'ready',focus:'操作已完成',agent:0,path:100,nodes:[{l:'屏幕',s:'✓',st:'done'},{l:'Agent',s:'✓',st:'done'}]}
    ];
    var CAM=[
      {token:'idle',focus:'待命',run:0,presence:'空闲',flash:-1},
      {token:'ready',focus:'监控中',run:1,presence:'在座',flash:-1},
      {token:'triggered',focus:'举手确认',run:1,presence:'在座',flash:0}
    ];
    var MAP={voice:VOICE,keys:KEYS,softPad:PAD,camera:CAM};
    var demoTimer=null;
    var EXPANDED={};
    var DETAILS={
      voice:['用唤醒词进入聆听','采集语音写入前台','说口令结束听写'],
      keys:['按住触发键','向应用输出目标键'],
      softPad:['点击屏幕按钮','向 Agent 发指令'],
      camera:['后台识别姿态','检测在座/离席','OK 手势→确认','离席→暂停']
    };

    function shell(id){
      var ch=CH.map(function(c){return '<span class="'+(c===id?'on':'')+'">'+NAMES[c]+'</span>';}).join('');
      return '<div class="panel '+id+'" data-id="'+id+'">'
        +'<div class="panel-hd"><div><b>'+NAMES[id]+'</b><div class="token" data-token>—</div></div>'
        +'<button type="button" class="state-btn" data-cycle="'+id+'">切换状态</button></div>'
        +'<div class="hero">'
        +'<div class="ctx"><em>Cursor</em></div>'
        +'<div data-vis></div>'
        +'<div class="focus" data-focus>—</div>'
        +'<div class="hint" data-hint></div>'
        +'<div data-logic></div>'
        +'<div class="detail" data-detail><div class="detail-in" data-detail-in></div></div>'
        +'</div><div class="ch">'+ch+'</div></div>';
    }

    function detailHtml(fn,logic,data){
      return '<div class="detail-row"><span class="detail-lbl">功能</span><span>'+fn+'</span></div>'
        +'<div class="detail-row"><span class="detail-lbl">逻辑</span><span>'+logic+'</span></div>'
        +(data?'<div class="detail-row"><span class="detail-lbl">数据</span><span>'+data+'</span></div>':'');
    }

    function paintDetail(panelId,nodeId){
      var panel=document.querySelector('[data-id="'+panelId+'"]');
      if(!panel)return;
      var box=panel.querySelector('[data-detail]');
      var inner=panel.querySelector('[data-detail-in]');
      if(!box||!inner)return;
      if(!nodeId){
        box.classList.remove('is-open');
        setTimeout(function(){if(!box.classList.contains('is-open'))inner.innerHTML='';},380);
        return;
      }
      var tips=DETAILS[panelId]||[];
      var idx=parseInt(nodeId,10);
      if(panelId==='camera'&&nodeId.indexOf('chip-')===0){
        idx=parseInt(nodeId.slice(5),10)+2;
      }else if(panelId==='camera'&&nodeId==='badge-0'){idx=0;}
      else if(panelId==='camera'&&nodeId==='badge-1'){idx=1;}
      var fn=tips[idx]||'节点说明';
      var html=detailHtml(fn,'点击展开示例 · '+panelId,'—');
      if(box.classList.contains('is-open')){
        inner.innerHTML=html;
      }else{
        inner.innerHTML=html;
        requestAnimationFrame(function(){requestAnimationFrame(function(){box.classList.add('is-open');});});
      }
      panel.querySelectorAll('[data-node-id]').forEach(function(n){
        n.classList.toggle('sel',n.getAttribute('data-node-id')===nodeId);
      });
    }

    function flowEl(nodes,live,panelId){
      var ns=nodes.map(function(n,i){
        var c='fn'+(n.st?' '+n.st:'')+(n.live?' on is-live':'')+(EXPANDED[panelId]===String(i)?' sel':'');
        return '<button type="button" class="'+c+'" data-node-id="'+i+'"><div class="fn-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/></svg></div><b>'+n.l+'</b><s>'+n.s+'</s></button>';
      }).join('');
      return '<div class="flow'+(live?' is-live':'')+'"><div class="flow-path"><i data-bar></i></div><div class="flow-nodes">'+ns+'</div></div>';
    }

    function applyPanel(id,animate){
      var el=document.querySelector('[data-id="'+id+'"]');
      if(!el)return;
      var st=MAP[id][IDX[id]];
      el.querySelector('[data-token]').textContent='token: '+st.token;
      var focus=el.querySelector('[data-focus]');
      focus.textContent=st.focus;
      focus.className='focus'+(st.live||st.press||st.agent||st.run?' live':'')+(animate?' bump':'');
      var vis=el.querySelector('[data-vis]');
      var logic=el.querySelector('[data-logic]');
      var hint=el.querySelector('[data-hint]');
      if(id==='voice'){
        vis.innerHTML='<div class="orb'+(st.live?' live':'')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></div>';
        logic.innerHTML=flowEl(st.nodes,st.live,id);
        hint.textContent='L2 路径填充 · L1 Orb 呼吸环 · 点节点展开';
      }else if(id==='keys'){
        vis.innerHTML='<div class="pair"><div class="cap'+(st.press?' press':'')+'">音量减</div><span class="cap arr">→</span><div class="cap">右 Alt</div></div>';
        logic.innerHTML=flowEl(st.nodes,st.press,id);
        hint.textContent='L2 路径 · L1 键帽按下 · 点节点展开';
      }else if(id==='softPad'){
        vis.innerHTML='<div class="pad-face"><div class="pad-btn'+(st.agent?' on pulse':' on')+'">确认</div><div class="pad-btn">拒绝</div><div class="pad-btn">暂停</div></div><div class="agent-dot'+(st.agent?' live':'')+'"></div>';
        logic.innerHTML=flowEl(st.nodes,st.agent,id);
        hint.textContent='L2 路径 · L1 Agent 点 ping · 点节点展开';
      }else{
        vis.innerHTML='<div class="ring'+(st.run?' run'+(st.run?' live':''):'')+'" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>';
        var p=st.presence==='在座'?'present':'';
        logic.innerHTML='<div class="cam-badges"><button type="button" class="badge btn-chip'+(st.run?' run':'')+(EXPANDED[id]==='badge-0'?' sel':'')+'" data-node-id="badge-0">'+(st.run?'运行中':'未运行')+'</button><button type="button" class="badge btn-chip pres '+p+(EXPANDED[id]==='badge-1'?' sel':'')+'" data-node-id="badge-1">'+st.presence+'</button></div><div class="chips">'
          +RULES.slice(0,2).map(function(r,i){return '<button type="button" class="chip'+(st.flash===i?' flash':'')+(EXPANDED[id]==='chip-'+i?' sel':'')+'" data-node-id="chip-'+i+'">'+r+'</button>';}).join('')
          +'<span class="chip">+'+(RULES.length-2)+'</span></div>';
        hint.textContent='徽章 + 标签 · 点徽章/chip 展开';
      }
      paintDetail(id,EXPANDED[id]||'');
      if(id!=='camera'){
        var bar=el.querySelector('[data-bar]');
        if(bar&&animate){
          var target=st.path+'%';
          bar.style.transition='none';
          bar.style.width='0%';
          void bar.offsetWidth;
          bar.style.transition='';
          requestAnimationFrame(function(){bar.style.width=target;});
          st.nodes.forEach(function(n,i){
            if(n.st==='on'){
              var fn=el.querySelector('.fn[data-node-id="'+i+'"]');
              if(fn){fn.classList.add('pop');setTimeout(function(){fn.classList.remove('pop');},400);}
            }
          });
        }else if(bar){bar.style.width=st.path+'%';}
      }
      if(animate)setTimeout(function(){focus.classList.remove('bump');},350);
    }

    function camAb(){
      var st=CAM[IDX.camera];
      document.getElementById('camAb').innerHTML=
        '<div class="cam-wrap rec"><div class="lbl">Cam-A</div>'
        +'<div class="panel cam" style="min-height:240px"><div class="panel-hd"><b>徽章+标签</b><button class="state-btn" data-cycle="camera">切换</button></div>'
        +'<div class="hero"><div class="ring'+(st.run?' run live':'')+'" style="position:relative;margin:0 auto;width:60px;height:60px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>'
        +'<div class="focus'+(st.run?' live':'')+'" style="margin-top:10px">'+st.focus+'</div>'
        +'<div class="cam-badges"><span class="badge'+(st.run?' run':'')+'">'+(st.run?'运行中':'未运行')+'</span><span class="badge pres present">'+st.presence+'</span></div>'
        +'<div class="chips">'+RULES.slice(0,2).map(function(r,i){return '<span class="chip'+(st.flash===i?' flash':'')+'">'+r+'</span>';}).join('')+'</div></div></div></div>'
        +'<div class="cam-wrap"><div class="lbl">Cam-B · 不推荐</div>'
        +'<div class="panel cam cam-bad" style="min-height:240px"><div class="panel-hd"><b>线性流</b></div>'
        +'<div class="hero"><div class="ring" style="margin:0 auto;width:60px;height:60px;display:grid;place-items:center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>'
        +flowEl([{l:'识别',s:'姿态',st:''},{l:'动作',s:'规则',st:''}],0)+'<p class="cam-bad-lbl">多规则并行</p></div></div></div>';
      document.querySelector('#camAb [data-cycle]')?.addEventListener('click',function(){cycle('camera');});
    }

    function cycle(id){
      IDX[id]=(IDX[id]+1)%MAP[id].length;
      applyPanel(id,true);
      if(id==='camera'){
        camAb();
        if(CAM[IDX.camera].token==='triggered'){
          setTimeout(function(){IDX.camera=(IDX.camera+1)%CAM.length;applyPanel('camera',true);camAb();},1200);
        }
      }
    }

    function init(){
      document.getElementById('main').innerHTML=CH.map(shell).join('');
      CH.forEach(function(id){applyPanel(id,false);});
      CH.forEach(function(id){
        var bar=document.querySelector('[data-id="'+id+'"] [data-bar]');
        if(bar)setTimeout(function(){bar.style.width=MAP[id][IDX[id]].path+'%';},80+CH.indexOf(id)*120);
      });
      camAb();
      document.querySelectorAll('[data-cycle]').forEach(function(b){
        b.onclick=function(){cycle(b.getAttribute('data-cycle'));};
      });
      document.getElementById('main').addEventListener('click',function(e){
        var btn=e.target.closest&&e.target.closest('[data-node-id]');
        if(!btn)return;
        var panel=btn.closest('[data-id]');
        if(!panel)return;
        var pid=panel.getAttribute('data-id');
        var nid=btn.getAttribute('data-node-id');
        EXPANDED[pid]=EXPANDED[pid]===nid?'':nid;
        paintDetail(pid,EXPANDED[pid]||'');
        panel.querySelectorAll('[data-node-id]').forEach(function(n){
          n.classList.toggle('sel',n.getAttribute('data-node-id')===EXPANDED[pid]);
        });
      });
      var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
      document.getElementById('motionHint').textContent=rm?'系统已开启减少动效 — 动画已禁用':'动效已开启：路径填充 · live 脉冲 · 点节点展开详情（有动画）';
      document.getElementById('btnDemo').onclick=startDemo;
      document.getElementById('btnStop').onclick=stopDemo;
    }

    function startDemo(){
      stopDemo();
      var step=0;
      demoTimer=setInterval(function(){
        var id=CH[step%4];
        cycle(id);
        step++;
      },1400);
    }
    function stopDemo(){if(demoTimer){clearInterval(demoTimer);demoTimer=null;}}

    init();
  </script>
</body>
</html>
