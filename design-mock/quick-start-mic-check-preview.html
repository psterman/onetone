<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>麦克风检测 — 重新设计动画</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --primary: #2a9cc4;
      --primary-strong: #1f8fb8;
      --primary-soft: #e6f7fc;
      --primary-soft-2: #d3eef6;
      --indigo: #1a2d4a;
      --on-surface: #152238;
      --on-surface-muted: #5a7086;
      --surface-soft: #f0f7fb;
      --outline: rgba(26,45,74,.12);
      --radius-card: 20px;
      --radius-inner: 16px;

      /* Apple spring */
      --apple-spring-damp: 0.82;
      --apple-spring-resp: 0.38;
      --htv-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --bounce: cubic-bezier(.34, 1.56, .64, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--on-surface);
      background: linear-gradient(180deg, #eaf3f8 0%, #f5fafc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .stage {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* === Mic card === */
    .mic-card {
      width: 100%;
      background: linear-gradient(180deg, #f6fbfd 0%, #eaf4f8 100%);
      border: 1px solid var(--outline);
      border-radius: var(--radius-card);
      padding: 32px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 4px 12px rgba(26,45,74,.04);
      position: relative;
      overflow: hidden;
    }

    /* === Mic icon + side sound waves === */
    .mic-stage {
      position: relative;
      width: 96px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 中心 mic（呼吸 scale） */
    .mic {
      position: relative;
      z-index: 2;
      color: var(--primary);
      transform-origin: center bottom;
      animation: micBreath 2.4s var(--htv-ease) infinite;
    }
    .mic svg { display: block; }
    @keyframes micBreath {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    /* 左侧声波弧 — 3 个 SVG path，从 mic 向外扩张 */
    .wave {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--primary);
    }
    .wave.left { left: 0; }
    .wave.right { right: 0; transform: translateY(-50%) scaleX(-1); }

    .wave path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0;
      transform-origin: center;
      animation: wavePulse 2.4s var(--htv-ease) infinite;
    }
    .wave.left path:nth-child(1) { animation-delay: 0s; }
    .wave.left path:nth-child(2) { animation-delay: .4s; }
    .wave.left path:nth-child(3) { animation-delay: .8s; }
    .wave.right path:nth-child(1) { animation-delay: 1.2s; }
    .wave.right path:nth-child(2) { animation-delay: 1.6s; }
    .wave.right path:nth-child(3) { animation-delay: 2.0s; }

    @keyframes wavePulse {
      0%   { opacity: 0; transform: scale(.5); }
      20%  { opacity: .8; }
      100% { opacity: 0; transform: scale(1.4); }
    }

    /* === Audio level bars === */
    .level {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 28px;
    }
    .level__bar {
      width: 4px;
      background: var(--primary);
      border-radius: 4px;
      transform-origin: center bottom;
      animation: levelBounce 1.1s var(--bounce) infinite;
    }
    .level__bar:nth-child(1) { height: 8px;  animation-delay: .0s; }
    .level__bar:nth-child(2) { height: 14px; animation-delay: .08s; }
    .level__bar:nth-child(3) { height: 22px; animation-delay: .16s; }
    .level__bar:nth-child(4) { height: 28px; animation-delay: .24s; }
    .level__bar:nth-child(5) { height: 22px; animation-delay: .32s; }
    .level__bar:nth-child(6) { height: 14px; animation-delay: .40s; }
    .level__bar:nth-child(7) { height: 8px;  animation-delay: .48s; }

    @keyframes levelBounce {
      0%, 100% { transform: scaleY(.4); }
      50%      { transform: scaleY(1.15); }
    }

    /* === Label === */
    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-strong);
      letter-spacing: .02em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .label__dots {
      display: inline-flex;
      gap: 2px;
    }
    .label__dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: dotBlink 1.4s var(--htv-ease) infinite;
    }
    .label__dots i:nth-child(2) { animation-delay: .2s; }
    .label__dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes dotBlink {
      0%, 80%, 100% { opacity: .3; transform: scale(.8); }
      40%           { opacity: 1;  transform: scale(1); }
    }

    /* === Stagger entrance === */
    .rise {
      animation: rise .55s var(--htv-ease) both;
    }
    .rise.s1 { animation-delay: 0s; }
    .rise.s2 { animation-delay: .1s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* === Variants for comparison === */
    .variants {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      margin-top: 24px;
    }
    .variant {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .variant__label {
      font-size: 10px;
      color: var(--on-surface-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .variant__card {
      width: 100%;
      aspect-ratio: 1.4;
      background: linear-gradient(180deg, #f6fbfd 0%, #eaf4f8 100%);
      border: 1px solid var(--outline);
      border-radius: var(--radius-card);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ----- V1: 仅脉冲点（旧版风格，参考） ----- */
    .v1-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: simplePulse 1.4s var(--htv-ease) infinite;
    }
    @keyframes simplePulse {
      0%, 100% { transform: scale(1); opacity: .6; }
      50%      { transform: scale(1.6); opacity: 1; }
    }
    .v1-line {
      width: 24px;
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
      margin-top: 10px;
      opacity: .35;
    }

    /* ----- V3: 简化版（仅 5 个电平条 + 中心 mic） ----- */
    .v3-stage {
      position: relative;
      width: 60px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .v3-mic {
      color: var(--primary);
      transform-origin: center bottom;
      animation: micBreath 2.4s var(--htv-ease) infinite;
    }
    .v3-level {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }
    .v3-level i {
      width: 3px;
      background: var(--primary);
      border-radius: 2px;
      transform-origin: center bottom;
      animation: levelBounce 1.1s var(--bounce) infinite;
    }
    .v3-level i:nth-child(1) { height: 6px;  animation-delay: .0s; }
    .v3-level i:nth-child(2) { height: 12px; animation-delay: .1s; }
    .v3-level i:nth-child(3) { height: 18px; animation-delay: .2s; }
    .v3-level i:nth-child(4) { height: 12px; animation-delay: .3s; }
    .v3-level i:nth-child(5) { height: 6px;  animation-delay: .4s; }

    /* ====== reduced motion ====== */
    @media (prefers-reduced-motion: reduce) {
      .rise, .mic, .v3-mic, .level__bar, .v3-level i, .v1-dot, .wave path, .label__dots i {
        animation: none !important;
      }
      .level__bar:nth-child(1), .level__bar:nth-child(7) { height: 8px; }
      .level__bar:nth-child(2), .level__bar:nth-child(6) { height: 14px; }
      .level__bar:nth-child(3), .level__bar:nth-child(5) { height: 22px; }
      .level__bar:nth-child(4) { height: 28px; }
    }
  </style>
</head>
<body>
  <div class="stage">

    <div class="mic-card rise s1">
      <!-- 主舞台：mic + 两侧声波 -->
      <div class="mic-stage">
        <!-- 左侧声波（3 个弧） -->
        <svg class="wave left" width="36" height="60" viewBox="0 0 36 60" aria-hidden="true">
          <path d="M30 18 Q14 30 30 42"/>
          <path d="M22 12 Q-2 30 22 48"/>
          <path d="M14 6 Q-18 30 14 54"/>
        </svg>
        <!-- 中心 mic -->
        <div class="mic" id="mic">
          <svg width="36" height="48" viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="3" width="8" height="14" rx="4"/>
            <path d="M4 14a8 8 0 0 0 16 0"/>
            <line x1="12" y1="22" x2="12" y2="28"/>
            <line x1="8" y1="28" x2="16" y2="28"/>
          </svg>
        </div>
        <!-- 右侧声波（mirror） -->
        <svg class="wave right" width="36" height="60" viewBox="0 0 36 60" aria-hidden="true">
          <path d="M30 18 Q14 30 30 42"/>
          <path d="M22 12 Q-2 30 22 48"/>
          <path d="M14 6 Q-18 30 14 54"/>
        </svg>
      </div>

      <!-- 电平条 -->
      <div class="level" aria-hidden="true">
        <span class="level__bar"></span>
        <span class="level__bar"></span>
        <span class="level__bar"></span>
        <span class="level__bar"></span>
        <span class="level__bar"></span>
        <span class="level__bar"></span>
        <span class="level__bar"></span>
      </div>

      <!-- 标签 -->
      <div class="label rise s2">正在检测麦克风<span class="label__dots"><i></i><i></i><i></i></span></div>
    </div>

    <!-- 对比小样：3 个变体 -->
    <div class="variants rise s2">
      <!-- V1 旧版 -->
      <div class="variant">
        <div class="variant__card">
          <div style="display:flex;flex-direction:column;align-items:center">
            <svg width="28" height="36" viewBox="0 0 24 32" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="3" width="8" height="14" rx="4"/>
              <path d="M4 14a8 8 0 0 0 16 0"/>
              <line x1="12" y1="22" x2="12" y2="28"/>
            </svg>
            <div class="v1-dot" style="margin-top:8px"></div>
            <div class="v1-line"></div>
          </div>
        </div>
        <div class="variant__label">V1 · 旧版</div>
      </div>
      <!-- V3 简化版 -->
      <div class="variant">
        <div class="variant__card">
          <div class="v3-stage">
            <svg class="v3-mic" width="22" height="30" viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="3" width="8" height="14" rx="4"/>
              <path d="M4 14a8 8 0 0 0 16 0"/>
              <line x1="12" y1="22" x2="12" y2="28"/>
              <line x1="8" y1="28" x2="16" y2="28"/>
            </svg>
            <div class="v3-level"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
        <div class="variant__label">V3 · 简化</div>
      </div>
      <!-- V4 完整版（推荐） -->
      <div class="variant">
        <div class="variant__card">
          <div class="mic-stage" style="width:80px;height:60px">
            <svg class="wave left" width="28" height="48" viewBox="0 0 36 60" aria-hidden="true">
              <path d="M30 18 Q14 30 30 42"/>
              <path d="M22 12 Q-2 30 22 48"/>
              <path d="M14 6 Q-18 30 14 54"/>
            </svg>
            <div class="mic">
              <svg width="26" height="36" viewBox="0 0 24 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="3" width="8" height="14" rx="4"/>
                <path d="M4 14a8 8 0 0 0 16 0"/>
                <line x1="12" y1="22" x2="12" y2="28"/>
                <line x1="8" y1="28" x2="16" y2="28"/>
              </svg>
            </div>
            <svg class="wave right" width="28" height="48" viewBox="0 0 36 60" aria-hidden="true">
              <path d="M30 18 Q14 30 30 42"/>
              <path d="M22 12 Q-2 30 22 48"/>
              <path d="M14 6 Q-18 30 14 54"/>
            </svg>
          </div>
          <div class="level" style="position:absolute;bottom:12px">
            <span class="level__bar"></span>
            <span class="level__bar"></span>
            <span class="level__bar"></span>
            <span class="level__bar"></span>
            <span class="level__bar"></span>
          </div>
        </div>
        <div class="variant__label">V4 · 完整</div>
      </div>
    </div>
  </div>
</body>
</html>
