<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字键盘 - 极简商务风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #111827;
            letter-spacing: -0.2px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.8125rem;
            margin-bottom: 24px;
        }

        .keyboard-wrapper {
            display: inline-block;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 48px);
            gap: 6px;
        }

        .key {
            width: 48px;
            height: 48px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            user-select: none;
        }

        .key:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .key:active {
            transform: scale(0.98);
            background: #e5e7eb;
        }

        .key-number {
            font-size: 1rem;
            font-weight: 500;
            color: #111827;
            line-height: 1.2;
        }

        .key-label {
            font-size: 0.5625rem;
            color: #6b7280;
            margin-top: 1px;
            text-align: center;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* 特殊键样式 */
        .key-tall {
            grid-row: span 2;
            height: 102px;
        }

        .key-wide {
            grid-column: span 2;
            width: 102px;
        }

        /* 功能区域 - 极简商务配色 */
        .key-agent {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .key-agent .key-number {
            color: #374151;
            font-weight: 600;
        }

        .key-agent .key-label {
            color: #6b7280;
        }

        .key-agent:hover {
            background: #f3f4f6;
        }

        .key-action {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .key-action .key-number {
            color: #374151;
            font-weight: 600;
        }

        .key-action .key-label {
            color: #6b7280;
        }

        .key-action:hover {
            background: #f3f4f6;
        }

        .key-basic {
            background: #f9fafb;
            border-color: #d1d5db;
        }

        .key-basic .key-number {
            color: #374151;
            font-weight: 600;
        }

        .key-basic .key-label {
            color: #6b7280;
        }

        .key-basic:hover {
            background: #f3f4f6;
        }

        .key-control {
            background: #ffffff;
            border-color: #e5e7eb;
        }

        .key-control .key-number {
            color: #4b5563;
            font-weight: 500;
        }

        .key-control .key-label {
            color: #9ca3af;
        }

        .key-control:hover {
            background: #f9fafb;
        }

        /* 图例 */
        .legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #6b7280;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid #e5e7eb;
        }

        .legend-agent .legend-color {
            background: #f9fafb;
        }

        .legend-action .legend-color {
            background: #f9fafb;
        }

        .legend-basic .legend-color {
            background: #f9fafb;
        }

        .legend-control .legend-color {
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数字键盘</h1>
        <p class="subtitle">极简商务风格</p>

        <div class="keyboard-wrapper">
            <div class="keypad">
                <!-- 第一行 -->
                <div class="key key-control">
                    <span class="key-number">/</span>
                    <span class="key-label">命令菜单</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">*</span>
                    <span class="key-label">快速创建</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">-</span>
                    <span class="key-label">删除</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">←</span>
                    <span class="key-label">取消</span>
                </div>

                <!-- 第二行 - Agent区 -->
                <div class="key key-agent">
                    <span class="key-number">7</span>
                    <span class="key-label">Agent切换</span>
                </div>
                <div class="key key-agent">
                    <span class="key-number">8</span>
                    <span class="key-label">Claude模型</span>
                </div>
                <div class="key key-agent">
                    <span class="key-number">9</span>
                    <span class="key-label">Codex模式</span>
                </div>
                <div class="key key-control key-tall">
                    <span class="key-number">+</span>
                    <span class="key-label">快捷聊天</span>
                </div>

                <!-- 第三行 - 快捷操作区 -->
                <div class="key key-action">
                    <span class="key-number">4</span>
                    <span class="key-label">快速执行</span>
                </div>
                <div class="key key-action">
                    <span class="key-number">5</span>
                    <span class="key-label">收藏夹</span>
                </div>
                <div class="key key-action">
                    <span class="key-number">6</span>
                    <span class="key-label">应用切换</span>
                </div>

                <!-- 第四行 - 基础功能区 -->
                <div class="key key-basic">
                    <span class="key-number">1</span>
                    <span class="key-label">上下文</span>
                </div>
                <div class="key key-basic">
                    <span class="key-number">2</span>
                    <span class="key-label">撤销/重做</span>
                </div>
                <div class="key key-basic">
                    <span class="key-number">3</span>
                    <span class="key-label">快速搜索</span>
                </div>
                <div class="key key-control key-tall">
                    <span class="key-number">Ent</span>
                    <span class="key-label">确认执行</span>
                </div>

                <!-- 第五行 -->
                <div class="key key-control key-wide">
                    <span class="key-number">0</span>
                    <span class="key-label">语音输入</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">.</span>
                    <span class="key-label">设置</span>
                </div>
            </div>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <div class="legend-item legend-agent">
                <div class="legend-color"></div>
                <span>Agent/模型</span>
            </div>
            <div class="legend-item legend-action">
                <div class="legend-color"></div>
                <span>快捷操作</span>
            </div>
            <div class="legend-item legend-basic">
                <div class="legend-color"></div>
                <span>基础功能</span>
            </div>
            <div class="legend-item legend-control">
                <div class="legend-color"></div>
                <span>输入控制</span>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function() {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 80);
            });
        });
    </script>
</body>
</html>
