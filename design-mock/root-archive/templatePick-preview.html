<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>voice-pilot · 真实弹窗预览 · 选择按键方式 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --primary:#2a9cc4;
  --indigo:#1a2d4a;
  --key-soft:#2a9cc4;
  --surface-high:rgba(255,255,255,.97);
  --on-surface-muted:#5a7086;
  --outline-variant:rgba(26,45,74,.10);
  --dur-fast:140ms;
  --dur-med:220ms;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',system-ui,-apple-system,'PingFang SC',sans-serif;
  background:linear-gradient(180deg,#eef5f9,#f7f9fb);
  min-height:100vh;color:var(--indigo);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:700;
  border:1px solid var(--outline-variant);background:#fff;color:var(--indigo);
  cursor:pointer;transition:all var(--dur-fast);font-family:inherit;
}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(42,156,196,.32)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(42,156,196,.42)}
.btn.secondary:hover{background:#f4f7f9}

/* 弹窗 */
.template-pick-overlay{position:fixed;inset:0;z-index:810;background:rgba(237,245,250,.88);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:1;pointer-events:auto}
.template-pick-modal{width:min(980px,96vw);background:rgba(255,255,255,.96);border:1px solid var(--outline-variant);border-radius:28px;box-shadow:0 24px 60px rgba(26,45,74,.14);padding:22px 22px 18px}
.template-pick-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.template-pick-title{margin:0;font-size:18px;font-weight:900;color:var(--indigo);line-height:1.3;flex:1}
.template-pick-desc{margin:0 0 14px;font-size:13px;line-height:1.65;color:var(--on-surface-muted)}
.template-pick-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;margin-bottom:16px}
.template-pick-card{border:1px solid var(--outline-variant);border-radius:22px;padding:16px 14px 14px;background:var(--surface-high);text-align:left;cursor:pointer;transition:border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);min-width:0;font-family:inherit;color:inherit}
.template-pick-card:hover{border-color:rgba(42,156,196,.35);transform:translateY(-1px)}
.template-pick-card.is-selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(42,156,196,.12)}
.template-pick-card b{display:block;font-size:14px;font-weight:900;color:var(--indigo);margin-bottom:6px}
.template-pick-card .template-pick-desc{font-size:12px;line-height:1.5;color:var(--on-surface-muted);margin:0}
.template-pick-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.template-pick-actions .btn{min-width:140px}
.welcome-close{background:transparent;border:none;color:var(--on-surface-muted);font-size:22px;line-height:1;cursor:pointer;padding:0 6px;font-family:inherit}

/* ================================================================
   3 张卡动画 · 完全不同的视觉节奏
   ================================================================ */
.template-pick-card-anim{
  height:118px;display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;position:relative;overflow:hidden;border-radius:14px;
  background:linear-gradient(180deg,#FAFAFC,#F4F4F6);
}
.template-pick-card.is-selected .template-pick-card-anim{background:linear-gradient(180deg,#F0F9FC,#E6F4F9)}
.tp-demo{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.tp-key{width:54px;height:54px;background:#fff;border:2px solid #1c1c1e;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;font-weight:700;color:#1c1c1e;box-shadow:0 3px 0 #1c1c1e;position:relative;flex-shrink:0}

/* ========== 卡1 · 按住说话 ==========
   键：按住 → 长时间不动（占周期72%）→ 松开
   进度条：从0%到100%在按住期间填满
   波形：按住期间一直跳动
   特征：键明显"沉下去 + 不动 + 进度条在走" */
.template-pick-card-anim--hold .tp-key{animation:holdKeyIdle 3.2s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--hold .tp-key{animation:holdKey 2.4s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--hold .tp-key::before{content:"";position:absolute;inset:-7px;border:2px solid var(--primary);border-radius:13px;opacity:0;animation:holdHalo 2.4s ease-in-out infinite;pointer-events:none}
@keyframes holdKeyIdle{
  0%,100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  5%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FFD9D6;color:#FF3B30;border-color:#FF3B30}
  72%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  80%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes holdKey{
  0%,100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  5%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  72%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  80%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes holdHalo{0%,5%{opacity:0;transform:scale(.8)}8%{opacity:.8;transform:scale(1)}72%{opacity:.8;transform:scale(1)}80%{opacity:0;transform:scale(1.1)}100%{opacity:0}}
.tp-wave-hold{display:flex;gap:2.5px;align-items:center;height:16px}
.tp-wave-hold .b{width:2.5px;background:#D8D8DC;border-radius:2px}
.tp-wave-hold .b:nth-child(1){height:30%;animation:tpWaveIdle 1.6s ease-in-out infinite 0s}
.tp-wave-hold .b:nth-child(2){height:60%;animation:tpWaveIdle 1.6s ease-in-out infinite .08s}
.tp-wave-hold .b:nth-child(3){height:90%;animation:tpWaveIdle 1.6s ease-in-out infinite .16s}
.tp-wave-hold .b:nth-child(4){height:70%;animation:tpWaveIdle 1.6s ease-in-out infinite .24s}
.tp-wave-hold .b:nth-child(5){height:45%;animation:tpWaveIdle 1.6s ease-in-out infinite .32s}
.tp-wave-hold .b:nth-child(6){height:80%;animation:tpWaveIdle 1.6s ease-in-out infinite .4s}
.tp-wave-hold .b:nth-child(7){height:55%;animation:tpWaveIdle 1.6s ease-in-out infinite .48s}
.tp-wave-hold .b:nth-child(8){height:30%;animation:tpWaveIdle 1.6s ease-in-out infinite .56s}
.template-pick-card.is-selected .tp-wave-hold .b{background:var(--primary);animation:tpWaveBar 1.1s ease-in-out infinite}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(1){animation-delay:0s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(2){animation-delay:.08s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(3){animation-delay:.16s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(4){animation-delay:.24s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(5){animation-delay:.32s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(6){animation-delay:.4s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(7){animation-delay:.48s}
.template-pick-card.is-selected .tp-wave-hold .b:nth-child(8){animation-delay:.56s}
@keyframes tpWaveIdle{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(.6)}}
@keyframes tpWaveBar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
/* 进度条 */
.tp-hold-bar{position:absolute;bottom:8px;left:12px;right:12px;height:5px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden}
.tp-hold-bar-fill{height:100%;background:linear-gradient(90deg,#FF3B30,var(--primary));border-radius:3px;width:0%;animation:holdBarFill 3.2s ease-in-out infinite}
.template-pick-card.is-selected .tp-hold-bar-fill{animation:holdBarFill 2.4s ease-in-out infinite}
@keyframes holdBarFill{0%,4%{width:0%}5%{width:4%}72%{width:98%}80%{width:100%}86%,100%{width:0%}}
/* 顶部按住中文字 */
.tp-hold-label{position:absolute;top:7px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;color:#a1a1a6;letter-spacing:.05em;animation:holdLabelFade 3.2s ease-in-out infinite}
.template-pick-card.is-selected .tp-hold-label{animation:holdLabelFade 2.4s ease-in-out infinite;color:var(--primary)}
@keyframes holdLabelFade{0%,3%{opacity:0}5%,72%{opacity:1}80%,100%{opacity:0}}

/* ========== 卡2 · 单击开始/结束 ==========
   键：快速按一下（6%）→ 立即弹回 → 等着
   波形：出现 → 快速淡出（表示"说完了"）
   特征：键只动了1次，且迅速恢复 → 一眼就知道是"单击"，不是长按 */
.template-pick-card-anim--tap .tp-key{animation:tapKeyIdle 2.8s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--tap .tp-key{animation:tapKey 2s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--tap .tp-key::before{content:"";position:absolute;inset:-7px;border:2px solid var(--primary);border-radius:13px;opacity:0;animation:tapHalo 2s ease-in-out infinite;pointer-events:none}
@keyframes tapKeyIdle{
  0%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  8%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  14%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes tapKey{
  0%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  6%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  12%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes tapHalo{0%,4%{opacity:0;transform:scale(.8)}6%{opacity:.8;transform:scale(1)}14%{opacity:0;transform:scale(1.1)}100%{opacity:0}}
/* 波形：按完出现 → 淡出 */
.tp-tap-wave{display:flex;gap:3px;align-items:center;height:16px}
.tp-tap-wave .b{width:2.5px;background:#D8D8DC;border-radius:2px}
.tp-tap-wave .b:nth-child(1){animation:tapWaveHide 2.8s ease-in-out infinite 0s}
.tp-tap-wave .b:nth-child(2){animation:tapWaveHide 2.8s ease-in-out infinite .07s}
.tp-tap-wave .b:nth-child(3){animation:tapWaveHide 2.8s ease-in-out infinite .14s}
.tp-tap-wave .b:nth-child(4){animation:tapWaveHide 2.8s ease-in-out infinite .21s}
.tp-tap-wave .b:nth-child(5){animation:tapWaveHide 2.8s ease-in-out infinite .28s}
.template-pick-card.is-selected .tp-tap-wave .b{background:var(--primary)}
.template-pick-card.is-selected .tp-tap-wave .b:nth-child(1){animation:tapWaveFlash 2s ease-in-out infinite 0s}
.template-pick-card.is-selected .tp-tap-wave .b:nth-child(2){animation:tapWaveFlash 2s ease-in-out infinite .07s}
.template-pick-card.is-selected .tp-tap-wave .b:nth-child(3){animation:tapWaveFlash 2s ease-in-out infinite .14s}
.template-pick-card.is-selected .tp-tap-wave .b:nth-child(4){animation:tapWaveFlash 2s ease-in-out infinite .21s}
.template-pick-card.is-selected .tp-tap-wave .b:nth-child(5){animation:tapWaveFlash 2s ease-in-out infinite .28s}
@keyframes tapWaveHide{0%,8%{transform:scaleY(.2);opacity:0}14%{transform:scaleY(1);opacity:.4}28%,100%{transform:scaleY(.2);opacity:0}}
@keyframes tapWaveFlash{0%,8%{transform:scaleY(.2);opacity:0}12%{transform:scaleY(1);opacity:1}30%,100%{transform:scaleY(.2);opacity:0}}
.tp-tap-label{position:absolute;top:7px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;color:#a1a1a6;letter-spacing:.05em}

/* ========== 卡3 · 双击开始/结束 ==========
   键：第1次按下（3→8%）→弹回（8→11%）→停顿（11→24%）→第2次按下（24→29%）→弹回
   ×2 数字：两次按键时都闪红
   特征：两次按键之间有明显停顿，×2 提示"按了两次" */
.template-pick-card-anim--double .tp-key{animation:doubleKeyIdle 2.8s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--double .tp-key{animation:doubleKey 2s ease-in-out infinite}
.template-pick-card.is-selected .template-pick-card-anim--double .tp-key::before{content:"";position:absolute;inset:-7px;border:2px solid var(--primary);border-radius:13px;opacity:0;animation:doubleHalo 2s ease-in-out infinite;pointer-events:none}
@keyframes doubleKeyIdle{
  0%,100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  4%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FFD9D6;color:#FF3B30;border-color:#FF3B30}
  9%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  23%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FFD9D6;color:#FF3B30;border-color:#FF3B30}
  28%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes doubleKey{
  0%,100%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  3%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  8%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
  24%{transform:translateY(3px);box-shadow:0 0 0 #1c1c1e;background:#FF3B30;color:#fff;border-color:#FF3B30}
  29%{transform:translateY(0);box-shadow:0 3px 0 #1c1c1e;background:#fff;color:#1c1c1e;border-color:#1c1c1e}
}
@keyframes doubleHalo{0%,2%{opacity:0;transform:scale(.8)}3%{opacity:.9;transform:scale(1)}8%{opacity:0;transform:scale(1.1)}23%{opacity:0;transform:scale(.8)}24%{opacity:.9;transform:scale(1)}29%{opacity:0;transform:scale(1.1)}100%{opacity:0}}
.tp-double-count{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#D8D8DC;font-weight:700;letter-spacing:.05em;animation:doubleCountIdle 2.8s ease-in-out infinite}
.template-pick-card.is-selected .tp-double-count{color:#a1a1a6;animation:doubleCount 2s ease-in-out infinite}
@keyframes doubleCountIdle{0%,100%{color:#D8D8DC}4%,9%{color:#FF3B30}23%,28%{color:#FF3B30}}
@keyframes doubleCount{0%,100%{color:#a1a1a6}3%,8%{color:#FF3B30;text-shadow:0 0 8px rgba(255,59,48,.5)}24%,29%{color:#FF3B30;text-shadow:0 0 8px rgba(255,59,48,.5)}}
.tp-double-hint{position:absolute;top:7px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;color:#a1a1a6;letter-spacing:.05em}
</style>
</head>
<body>

<div class="template-pick-overlay">
  <div class="template-pick-modal" role="dialog" aria-modal="true">
    <div class="template-pick-head">
      <h3 class="template-pick-title">选择按键方式</h3>
      <button type="button" class="welcome-close" aria-label="关闭">×</button>
    </div>
    <p class="template-pick-desc">选一个最顺手的说话方式 · 之后随时能改 · 对所有程序生效</p>

    <div class="template-pick-grid">
      <!-- 卡1：按住说话 -->
      <button type="button" class="template-pick-card" onclick="select(this)">
        <div class="template-pick-card-anim template-pick-card-anim--hold" aria-hidden="true">
          <div class="tp-demo">
            <div class="tp-hold-label">按住中</div>
            <div class="tp-key">Alt</div>
            <div class="tp-wave-hold">
              <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
              <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
            </div>
            <div class="tp-hold-bar"><div class="tp-hold-bar-fill"></div></div>
          </div>
        </div>
        <b>按住说话</b>
        <span class="template-pick-desc">按住 Alt 不放开始 · 松开发送</span>
      </button>

      <!-- 卡2：单击开始/结束 -->
      <button type="button" class="template-pick-card is-selected" onclick="select(this)">
        <div class="template-pick-card-anim template-pick-card-anim--tap" aria-hidden="true">
          <div class="tp-demo">
            <div class="tp-tap-label">单击一下 Alt</div>
            <div class="tp-key">Alt</div>
            <div class="tp-tap-wave">
              <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
            </div>
          </div>
        </div>
        <b>按一下开始/结束</b>
        <span class="template-pick-desc">按一次 Alt 开始 · 再按一次结束</span>
      </button>

      <!-- 卡3：双击开始/结束 -->
      <button type="button" class="template-pick-card" onclick="select(this)">
        <div class="template-pick-card-anim template-pick-card-anim--double" aria-hidden="true">
          <div class="tp-demo">
            <div class="tp-double-hint">快速连按 Alt 两次</div>
            <div class="tp-key">Alt</div>
            <div class="tp-double-count">×2</div>
          </div>
        </div>
        <b>双击开始/结束</b>
        <span class="template-pick-desc">快速连按 Alt 两次开始 · 再连按两次结束</span>
      </button>
    </div>

    <div class="template-pick-actions">
      <button type="button" class="btn secondary">取消</button>
      <button type="button" class="btn primary">存为习惯（全局方案）</button>
    </div>
  </div>
</div>

<script>
function select(btn){
  btn.closest('.template-pick-grid').querySelectorAll('.template-pick-card').forEach(function(c){
    c.classList.remove('is-selected');
  });
  btn.classList.add('is-selected');
}
</script>
</body>
</html>
