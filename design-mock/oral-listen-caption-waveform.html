<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>口头收听底栏 · 波形图标预览</title>
  <style>
    :root {
      --sky: #0284c7;
      --sky-soft: rgba(14, 165, 233, 0.45);
      --ink: #0c4a6e;
      --muted: #0369a1;
      --chip-bg: rgba(14, 165, 233, 0.1);
      --chip-bd: rgba(14, 165, 233, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 420px at 50% 20%, rgba(14, 165, 233, 0.16), transparent 60%),
        #e8eef4;
      color: #0f172a;
      padding: 32px 16px;
    }
    .stage {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      color: #334155;
      letter-spacing: 0.02em;
    }
    .hint {
      margin: 0;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    /* —— Soft Pad oral caption (planned) —— */
    .overlay-key-caption {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 14px;
      background: #fff;
      border: 1.5px solid rgba(14, 165, 233, 0.7);
      box-shadow:
        0 2px 12px rgba(14, 165, 233, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      color: var(--ink);
    }

    /* ① 波形状态胶囊（替代「口头收听中」文字） */
    .overlay-key-caption__badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 28px;
      height: 22px;
      padding: 0 5px;
      border-radius: 999px;
      color: #fff;
      background: var(--sky);
      box-shadow: 0 0 12px var(--sky-soft);
      animation: oral-listen-badge-pulse 1.2s ease-in-out infinite;
    }
    .overlay-key-caption__wave {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 12px;
    }
    .overlay-key-caption__wave i {
      display: block;
      width: 2px;
      border-radius: 999px;
      background: currentColor;
      transform-origin: center;
      animation: oral-wave 1s ease-in-out infinite;
    }
    .overlay-key-caption__wave i:nth-child(1) { height: 4px;  animation-delay: 0s; }
    .overlay-key-caption__wave i:nth-child(2) { height: 9px;  animation-delay: 0.12s; }
    .overlay-key-caption__wave i:nth-child(3) { height: 12px; animation-delay: 0.24s; }
    .overlay-key-caption__wave i:nth-child(4) { height: 7px;  animation-delay: 0.36s; }
    .overlay-key-caption__wave i:nth-child(5) { height: 5px;  animation-delay: 0.48s; }

    @keyframes oral-wave {
      0%, 100% { transform: scaleY(0.45); opacity: 0.75; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    @keyframes oral-listen-badge-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    /* ② 识别文本主行 */
    .overlay-key-caption__name {
      color: var(--ink);
      font-weight: 750;
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      white-space: normal;
    }
    .overlay-key-caption__name:empty { display: none; }
    .overlay-key-caption__name.is-live {
      color: var(--ink);
    }
    .overlay-key-caption__name.is-waiting {
      color: #64748b;
      font-weight: 600;
      font-size: 12px;
    }

    /* ③ 命令 chips */
    .overlay-key-caption__cmds {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      width: 100%;
    }
    .oral-cmd-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--chip-bd);
      background: var(--chip-bg);
      color: var(--ink);
      font-size: 11px;
      font-weight: 650;
      background-clip: padding-box;
    }
    .oral-cmd-chip b { font-weight: 750; }
    .oral-cmd-chip.is-cancel {
      border-color: rgba(248, 113, 113, 0.45);
      background: rgba(254, 226, 226, 0.65);
      color: #9f1239;
    }

    /* ④ Esc 提示 */
    .overlay-key-caption__chord {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-align: center;
      line-height: 1.35;
      white-space: normal;
    }

    /* demo toggles */
    .demos {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>口头收听底栏 · 波形图标</h1>
    <p class="hint">徽章不再显示「口头收听中」· 用波形表示收听状态 · 中间主行显示识别文本</p>

    <div class="demos">
      <div>
        <p class="label">A · 刚开口 / 尚无识别</p>
        <!-- 规划 markup：徽章 = 波形；name 空则折叠 -->
        <div class="overlay-key-caption is-oral-arm-caption is-oral-cmds is-active" aria-live="polite">
          <span class="overlay-key-caption__badge" data-cap-badge aria-label="口头收听中">
            <span class="overlay-key-caption__wave" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
          </span>
          <span class="overlay-key-caption__name" data-cap-name></span>
          <span class="overlay-key-caption__cmds" data-cap-cmds>
            <span class="oral-cmd-chip"><b>说话</b></span>
            <span class="oral-cmd-chip"><b>发送</b></span>
            <span class="oral-cmd-chip"><b>继续</b></span>
            <span class="oral-cmd-chip"><b>新会话</b></span>
            <span class="oral-cmd-chip is-cancel"><b>取消</b></span>
          </span>
          <span class="overlay-key-caption__chord" data-cap-chord>
            Esc / 说「取消」「退出」→ 退出收听 · 发送→右侧框+Enter
          </span>
        </div>
      </div>

      <div>
        <p class="label">B · 正在识别（live）</p>
        <div class="overlay-key-caption is-oral-arm-caption is-oral-cmds is-active" aria-live="polite">
          <span class="overlay-key-caption__badge" data-cap-badge aria-label="口头收听中">
            <span class="overlay-key-caption__wave" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
          </span>
          <span class="overlay-key-caption__name is-live" data-cap-name>继续</span>
          <span class="overlay-key-caption__cmds" data-cap-cmds>
            <span class="oral-cmd-chip"><b>说话</b></span>
            <span class="oral-cmd-chip"><b>发送</b></span>
            <span class="oral-cmd-chip"><b>继续</b></span>
            <span class="oral-cmd-chip"><b>新会话</b></span>
            <span class="oral-cmd-chip is-cancel"><b>取消</b></span>
          </span>
          <span class="overlay-key-caption__chord" data-cap-chord>
            Esc / 说「取消」「退出」→ 退出收听 · 发送→右侧框+Enter
          </span>
        </div>
      </div>

      <div>
        <p class="label">C · 较长 partial</p>
        <div class="overlay-key-caption is-oral-arm-caption is-oral-cmds is-active" aria-live="polite">
          <span class="overlay-key-caption__badge" data-cap-badge aria-label="口头收听中">
            <span class="overlay-key-caption__wave" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
          </span>
          <span class="overlay-key-caption__name is-live" data-cap-name>请帮我发送这条消息</span>
          <span class="overlay-key-caption__cmds" data-cap-cmds>
            <span class="oral-cmd-chip"><b>说话</b></span>
            <span class="oral-cmd-chip"><b>发送</b></span>
            <span class="oral-cmd-chip"><b>继续</b></span>
            <span class="oral-cmd-chip"><b>新会话</b></span>
            <span class="oral-cmd-chip is-cancel"><b>取消</b></span>
          </span>
          <span class="overlay-key-caption__chord" data-cap-chord>
            Esc / 说「取消」「退出」→ 退出收听 · 发送→右侧框+Enter
          </span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
