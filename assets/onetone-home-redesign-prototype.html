<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneTone 首页改版原型 · v2（保留四通道切换）</title>
  <style>
    :root {
      --primary: #5ec8e8;
      --primary-strong: #3eb8dc;
      --primary-soft: rgba(94, 200, 232, 0.14);
      --surface: rgba(22, 30, 44, 0.94);
      --surface-high: rgba(28, 38, 54, 0.97);
      --surface-soft: rgba(94, 200, 232, 0.08);
      --on-surface: #e8f0f8;
      --on-surface-muted: #9aa8b8;
      --outline: rgba(94, 200, 232, 0.24);
      --outline-variant: rgba(148, 163, 184, 0.22);
      --radius-row: 16px;
      --radius-pill: 999px;
      --dur-fast: 160ms;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --subtab-r: 8px;
      --subtab-gap: 4px;
      --subtab-active-bg: color-mix(in srgb, var(--primary) 10%, transparent);
      --subtab-active-border: color-mix(in srgb, var(--primary) 40%, transparent);
      --subtab-off-opacity: 0.48;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      color-scheme: dark;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      background: #0a0c10;
      color: var(--on-surface);
      -webkit-font-smoothing: antialiased;
    }

    .proto-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(10, 12, 16, 0.92);
      border-bottom: 1px solid var(--outline-variant);
      font-size: 12px;
      backdrop-filter: blur(12px);
    }

    .proto-banner strong { color: var(--primary); font-weight: 700; }

    .proto-banner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .proto-btn {
      appearance: none;
      border: 1px solid var(--outline-variant);
      background: var(--surface-high);
      color: var(--on-surface);
      border-radius: 8px;
      padding: 4px 10px;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }

    .proto-btn:hover { border-color: var(--primary); }
    .proto-btn.is-on {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: 40px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--outline-variant);
      background: color-mix(in srgb, var(--surface-high) 88%, transparent);
    }

    .header-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--outline-variant);
      background: var(--surface-high);
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface);
    }

    .header-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .shell {
      display: flex;
      flex: 1;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(42, 156, 196, 0.06), transparent 55%),
        #0a0c10;
    }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px 10px;
      border-right: 1px solid var(--outline-variant);
      background: color-mix(in srgb, var(--surface-high) 92%, transparent);
      backdrop-filter: blur(12px);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 14px;
      border-bottom: 1px solid var(--outline-variant);
      margin-bottom: 4px;
    }

    .sidebar-brand img {
      width: 32px;
      height: 32px;
      border-radius: 10px;
    }

    .sidebar-brand-name {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .sidebar-brand-sub {
      font-size: 9px;
      font-weight: 600;
      color: var(--on-surface-muted);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 10px;
      margin-bottom: 8px;
      border-radius: 12px;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      font-size: 12px;
      color: var(--on-surface-muted);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--on-surface-muted);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }

    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    .nav-item.is-active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .nav-item.is-muted {
      opacity: 0.45;
      font-size: 12px;
    }

    .nav-section {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--on-surface-muted);
      padding: 10px 12px 4px;
      opacity: 0.7;
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 8px;
    }

    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 20px 24px 32px;
    }

    .habit-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .habit-title {
      font-size: 13px;
      font-weight: 800;
      margin: 0 0 4px;
    }

    .habit-sub {
      margin: 0;
      font-size: 11px;
      color: var(--on-surface-muted);
      max-width: 480px;
    }

    .habit-manage {
      appearance: none;
      border: 1px solid var(--outline-variant);
      background: transparent;
      color: var(--on-surface-muted);
      border-radius: 8px;
      padding: 6px 12px;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .habit-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .habit-pill {
      appearance: none;
      border: 1px solid var(--outline-variant);
      background: var(--surface-high);
      color: var(--on-surface-muted);
      border-radius: var(--radius-pill);
      padding: 6px 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease);
    }

    .habit-pill.is-active {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .hero-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .channel-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--subtab-gap);
      margin-bottom: 20px;
    }

    .channel-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 52px;
      padding: 8px 4px;
      border: 1px solid var(--outline-variant);
      border-radius: var(--subtab-r);
      background: var(--surface-high);
      color: var(--on-surface-muted);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--dur-fast) var(--ease);
    }

    .channel-tab svg { width: 18px; height: 18px; }

    .channel-tab:hover {
      border-color: color-mix(in srgb, var(--primary) 35%, var(--outline-variant));
      color: var(--on-surface);
    }

    .channel-tab.is-active {
      color: var(--primary);
      background: var(--subtab-active-bg);
      border-color: var(--subtab-active-border);
      font-weight: 800;
    }

    .channel-tab.is-off {
      opacity: var(--subtab-off-opacity);
      filter: grayscale(0.55);
    }

    .channel-tab.is-off.is-active {
      opacity: 1;
      filter: none;
    }

    .hero-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 48px;
      opacity: 0.5;
    }

    .wave span {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--primary);
      animation: wave 1.2s ease-in-out infinite;
      animation-delay: calc(var(--i) * 0.08s);
      height: calc(4px + var(--h) * 2px);
    }

    .hero-wrap.is-idle .wave { opacity: 0.25; }
    .hero-wrap.is-idle .wave span { animation: none; height: 8px; }

    .hero-wrap.is-dictating .wave { opacity: 0.9; }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    .orb-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      flex-shrink: 0;
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--primary) 30%, transparent);
      animation: pulse-ring 2.4s ease-in-out infinite;
    }

    .hero-wrap.is-dictating .orb-ring {
      animation: pulse-ring-fast 1s ease-in-out infinite;
      border-color: var(--primary);
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 0.3; }
    }

    @keyframes pulse-ring-fast {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.12); opacity: 0.4; }
    }

    .orb {
      position: absolute;
      inset: 12px;
      border: none;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7ed4ef, var(--primary-strong) 55%, #1a6d8a);
      box-shadow: 0 0 40px rgba(94, 200, 232, 0.35), inset 0 2px 8px rgba(255,255,255,0.2);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease);
    }

    .orb:hover { transform: scale(1.04); }
    .orb:active { transform: scale(0.98); }
    .orb svg { width: 36px; height: 36px; }

    .hero-status {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--on-surface-muted);
      margin: 0 0 14px;
    }

    .hero-status strong { color: var(--on-surface); font-weight: 800; }

    .hero-cta-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .cta-primary {
      appearance: none;
      border: none;
      border-radius: var(--radius-pill);
      padding: 10px 24px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(180deg, var(--primary), var(--primary-strong));
      color: #0b1220;
      box-shadow: 0 8px 24px rgba(94, 200, 232, 0.25);
      transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }

    .cta-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(94, 200, 232, 0.35);
    }

    .cta-secondary {
      appearance: none;
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-pill);
      padding: 10px 18px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: var(--on-surface-muted);
    }

    .mic-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .mic-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--outline-variant);
      background: var(--surface-high);
      color: var(--on-surface-muted);
      font-weight: 600;
    }

    .mic-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
    }

    .detail-panel {
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-row);
      background: color-mix(in srgb, var(--surface-high) 90%, transparent);
      padding: 16px 18px;
      animation: fade-in 0.2s var(--ease);
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .detail-title {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-title svg { width: 16px; height: 16px; color: var(--primary); }

    .detail-edit {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .detail-edit:hover { background: var(--primary-soft); }

    .detail-rows {
      display: grid;
      gap: 8px;
      margin: 0 0 12px;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .detail-row dt {
      margin: 0;
      color: var(--on-surface-muted);
      font-weight: 600;
      flex-shrink: 0;
    }

    .detail-row dd {
      margin: 0;
      font-weight: 700;
      text-align: right;
      color: var(--on-surface);
    }

    .detail-row dd.is-empty { color: var(--on-surface-muted); font-weight: 600; }

    .detail-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .detail-link:hover { text-decoration: underline; }

    .proto-note {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px dashed color-mix(in srgb, var(--primary) 40%, var(--outline-variant));
      background: rgba(94, 200, 232, 0.05);
      font-size: 11px;
      color: var(--on-surface-muted);
      line-height: 1.5;
    }

    .proto-note strong { color: var(--primary); }

    @media (prefers-reduced-motion: reduce) {
      .wave span, .orb-ring { animation: none !important; }
      .detail-panel { animation: none; }
    }

    @media (max-width: 800px) {
      .sidebar { display: none; }
      .channel-tabs { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="proto-banner">
    <span><strong>原型 v2</strong> · 保留四通道 tab 切换 · 合并 showcase + how-to 为单一详情区</span>
    <div class="proto-banner-actions">
      <button type="button" class="proto-btn is-on" data-app-state="ready">就绪</button>
      <button type="button" class="proto-btn" data-app-state="first-run">首跑</button>
      <button type="button" class="proto-btn" data-app-state="dictating">听写中</button>
    </div>
  </div>

  <div class="app">
    <header class="app-header">
      <button type="button" class="header-chip" title="当前目标应用">
        <span>◎</span> Cursor <span style="opacity:0.5">▾</span>
      </button>
      <span class="header-chip"><span class="dot"></span> 麦克风可用</span>
      <button type="button" class="header-chip" aria-label="设置">⚙ 设置</button>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <img src="../src/icon-dark.png" alt="" onerror="this.style.background='var(--primary)';this.removeAttribute('src')" />
          <div>
            <div class="sidebar-brand-name">一声 OneTone</div>
            <div class="sidebar-brand-sub">言出即行，万象成形</div>
          </div>
        </div>
        <div class="search">🔍 搜索功能或设置… <span style="margin-left:auto;opacity:0.5">Ctrl K</span></div>
        <div class="nav-section">主面板</div>
        <button type="button" class="nav-item is-active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          首页
        </button>
        <button type="button" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          快速入门
        </button>
        <button type="button" class="nav-item is-muted" id="navMore">▾ 更多设置（首跑时折叠）</button>
        <div class="sidebar-foot">
          <button type="button" class="nav-item is-muted">快速入门</button>
        </div>
      </aside>

      <main class="main">
        <div class="habit-head">
          <div>
            <h2 class="habit-title">当前习惯</h2>
            <p class="habit-sub">切换习惯时，各通道配置一起跟着变；开关请在托盘菜单调整。</p>
          </div>
          <button type="button" class="habit-manage">管理</button>
        </div>

        <div class="habit-pills">
          <button type="button" class="habit-pill is-active">编程</button>
          <button type="button" class="habit-pill">写作</button>
          <button type="button" class="habit-pill">聊天</button>
        </div>

        <div class="hero-wrap is-idle" id="heroWrap">
          <div class="channel-tabs" role="tablist" aria-label="四通道切换">
            <button type="button" class="channel-tab is-active" role="tab" aria-selected="true" data-channel="voice">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
              说话
            </button>
            <button type="button" class="channel-tab" role="tab" aria-selected="false" data-channel="keys">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
              按键
            </button>
            <button type="button" class="channel-tab is-off" role="tab" aria-selected="false" data-channel="softPad">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h.01M12 7h.01M16 7h.01"/></svg>
              屏幕按钮
            </button>
            <button type="button" class="channel-tab is-off" role="tab" aria-selected="false" data-channel="camera">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              摄像头
            </button>
          </div>

          <div class="hero-stage">
            <div class="wave" id="waveLeft" aria-hidden="true"></div>
            <div class="orb-wrap">
              <div class="orb-ring" aria-hidden="true"></div>
              <button type="button" class="orb" id="orb" aria-label="听写状态"></button>
            </div>
            <div class="wave" id="waveRight" aria-hidden="true"></div>
          </div>

          <p class="hero-status" id="heroStatus"></p>

          <div class="hero-cta-row" id="ctaRow"></div>

          <div class="mic-row" id="micRow"></div>

          <section class="detail-panel" id="detailPanel" aria-live="polite"></section>

          <p class="proto-note">
            <strong>交互说明：</strong>点上方四通道 tab → orb 图标与状态文案联动 → 下方只显示<strong>当前通道</strong>一张详情卡（替代现有 showcase 双栏 + how-to 四卡重复）。首跑时侧栏收敛为「首页 / 快速入门 / 更多设置」。
          </p>
        </div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var ICONS = {
        voice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>',
        keys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>',
        softPad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01M8 15h8"/></svg>',
        camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>'
      };

      var CHANNELS = {
        voice: {
          title: '说话通道',
          statusReady: '待命 · 唤醒词：<strong>嘿 Cursor</strong>',
          statusFirst: '未配置 · 先设置唤醒词或麦克风',
          statusDictating: '听写中 · <strong>正在写入 Cursor</strong>',
          ctaReady: '开始听写',
          ctaFirst: '配置语音',
          ctaDictating: '说完了',
          mic: true,
          rows: [
            { label: '唤醒词', value: '嘿 Cursor' },
            { label: '麦克风', value: 'Realtek Audio' },
            { label: '说完后', value: '自动发送' }
          ],
          link: '打开语音设置 →'
        },
        keys: {
          title: '按键通道',
          statusReady: '就绪 · <strong>F9</strong> → Ctrl+Shift+Space',
          statusFirst: '未配置 · 先绑定触发键',
          statusDictating: '按键触发中 · <strong>F9 按住</strong>',
          ctaReady: '测试按键',
          ctaFirst: '配置触发键',
          ctaDictating: '说完了',
          mic: false,
          rows: [
            { label: '触发键', value: 'F9（单击）' },
            { label: '目标输入法', value: 'Ctrl+Shift+Space' },
            { label: '说完后', value: '自动发送' }
          ],
          link: '打开按键设置 →'
        },
        softPad: {
          title: '屏幕按钮通道',
          statusReady: '已配置 · 3 个动作槽',
          statusFirst: '未配置',
          statusDictating: 'SoftPad 激活中',
          ctaReady: '打开 SoftPad',
          ctaFirst: '配置 SoftPad',
          ctaDictating: '关闭',
          mic: false,
          off: true,
          rows: [
            { label: '状态', value: '未配置', empty: true },
            { label: '动作槽', value: '—', empty: true },
            { label: '托盘显示', value: '关闭', empty: true }
          ],
          link: '打开虚拟键盘设置 →'
        },
        camera: {
          title: '摄像头通道',
          statusReady: '运行中 · 摇头 → 取消',
          statusFirst: '未启用',
          statusDictating: '摄像头监听中',
          ctaReady: '打开 Camera Pro',
          ctaFirst: '启用摄像头',
          ctaDictating: '暂停',
          mic: false,
          off: true,
          rows: [
            { label: '状态', value: '未启用', empty: true },
            { label: '摇头', value: '—', empty: true },
            { label: '闭眼', value: '—', empty: true }
          ],
          link: '打开摄像头设置 →'
        }
      };

      var state = { channel: 'voice', appState: 'ready' };

      function waveHtml() {
        var hs = [1, 1.5, 2, 3, 4, 6, 9, 12, 9, 6, 4, 3, 2, 1.5, 1];
        return hs.map(function (h, i) {
          return '<span style="--h:' + h + ';--i:' + i + '"></span>';
        }).join('');
      }

      document.getElementById('waveLeft').innerHTML = waveHtml();
      document.getElementById('waveRight').innerHTML = waveHtml();

      function render() {
        var ch = CHANNELS[state.channel];
        var hero = document.getElementById('heroWrap');
        var isFirst = state.appState === 'first-run';
        var isDict = state.appState === 'dictating';

        hero.classList.toggle('is-idle', !isDict);
        hero.classList.toggle('is-dictating', isDict);

        document.getElementById('orb').innerHTML = ICONS[state.channel];
        document.getElementById('orb').setAttribute('aria-label', ch.title + ' · 点击操作');

        var statusKey = isDict ? 'statusDictating' : (isFirst ? 'statusFirst' : 'statusReady');
        document.getElementById('heroStatus').innerHTML = ch[statusKey];

        var ctaKey = isDict ? 'ctaDictating' : (isFirst ? 'ctaFirst' : 'ctaReady');
        var ctaHtml = '<button type="button" class="cta-primary" id="ctaPrimary">' + ch[ctaKey] + '</button>';
        if (isDict) {
          ctaHtml += '<button type="button" class="cta-secondary">取消，不要了</button>';
        }
        document.getElementById('ctaRow').innerHTML = ctaHtml;

        var micRow = document.getElementById('micRow');
        if (ch.mic && state.channel === 'voice' && !isFirst) {
          micRow.innerHTML = '<span class="mic-chip"><span class="dot"></span> 麦克风可用</span><span class="mic-chip">Vosk</span>';
          micRow.hidden = false;
        } else {
          micRow.innerHTML = '';
          micRow.hidden = true;
        }

        document.getElementById('detailPanel').innerHTML =
          '<div class="detail-head">' +
            '<h3 class="detail-title">' + ICONS[state.channel] + ' ' + ch.title + '</h3>' +
            '<button type="button" class="detail-edit">编辑</button>' +
          '</div>' +
          '<dl class="detail-rows">' +
            ch.rows.map(function (r) {
              return '<div class="detail-row"><dt>' + r.label + '</dt><dd' + (r.empty ? ' class="is-empty"' : '') + '>' + r.value + '</dd></div>';
            }).join('') +
          '</dl>' +
          '<a href="#" class="detail-link" onclick="return false">' + ch.link + '</a>';

        document.querySelectorAll('.channel-tab').forEach(function (tab) {
          var id = tab.getAttribute('data-channel');
          var active = id === state.channel;
          tab.classList.toggle('is-active', active);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });

        document.getElementById('sidebar').querySelector('.nav-item.is-muted#navMore').hidden = !isFirst;
        document.querySelector('.app-header .header-chip:last-child').hidden = isFirst;
      }

      document.querySelectorAll('.channel-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          state.channel = tab.getAttribute('data-channel');
          render();
        });
      });

      document.querySelectorAll('[data-app-state]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.appState = btn.getAttribute('data-app-state');
          document.querySelectorAll('[data-app-state]').forEach(function (b) {
            b.classList.toggle('is-on', b === btn);
          });
          render();
        });
      });

      render();
    })();
  </script>
</body>
</html>
