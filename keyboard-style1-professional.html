<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字键盘 - 专业简洁风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.875rem;
            margin-bottom: 32px;
        }

        .keyboard-wrapper {
            display: inline-block;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 64px);
            gap: 10px;
        }

        .key {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border: 1px solid #475569;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .key:hover {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            border-color: #64748b;
        }

        .key:active {
            transform: scale(0.96);
        }

        .key-number {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.2;
        }

        .key-label {
            font-size: 0.625rem;
            color: #94a3b8;
            margin-top: 2px;
            text-align: center;
            line-height: 1.2;
        }

        /* 特殊键样式 */
        .key-tall {
            grid-row: span 2;
            height: 138px;
        }

        .key-wide {
            grid-column: span 2;
            width: 138px;
        }

        /* 功能区域 - 专业配色 */
        .key-agent {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: #6366f1;
        }

        .key-agent .key-number {
            color: #818cf8;
        }

        .key-agent .key-label {
            color: #a5b4fc;
        }

        .key-agent:hover {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-color: #818cf8;
        }

        .key-action {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: #06b6d4;
        }

        .key-action .key-number {
            color: #22d3ee;
        }

        .key-action .key-label {
            color: #67e8f9;
        }

        .key-action:hover {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-color: #22d3ee;
        }

        .key-basic {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: #f59e0b;
        }

        .key-basic .key-number {
            color: #fbbf24;
        }

        .key-basic .key-label {
            color: #fcd34d;
        }

        .key-basic:hover {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-color: #fbbf24;
        }

        .key-control {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-color: #64748b;
        }

        .key-control .key-number {
            color: #cbd5e1;
        }

        .key-control .key-label {
            color: #94a3b8;
        }

        .key-control:hover {
            background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
            border-color: #94a3b8;
        }

        /* 图例 */
        .legend {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .legend-agent .legend-color {
            border-color: #6366f1;
        }

        .legend-action .legend-color {
            border-color: #06b6d4;
        }

        .legend-basic .legend-color {
            border-color: #f59e0b;
        }

        .legend-control .legend-color {
            border-color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>数字键盘</h1>
        <p class="subtitle">专业简洁风格</p>

        <div class="keyboard-wrapper">
            <div class="keypad">
                <!-- 第一行 -->
                <div class="key key-control">
                    <span class="key-number">/</span>
                    <span class="key-label">命令菜单</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">*</span>
                    <span class="key-label">快速创建</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">-</span>
                    <span class="key-label">删除</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">←</span>
                    <span class="key-label">取消</span>
                </div>

                <!-- 第二行 - Agent区 -->
                <div class="key key-agent">
                    <span class="key-number">7</span>
                    <span class="key-label">Agent切换</span>
                </div>
                <div class="key key-agent">
                    <span class="key-number">8</span>
                    <span class="key-label">Claude模型</span>
                </div>
                <div class="key key-agent">
                    <span class="key-number">9</span>
                    <span class="key-label">Codex模式</span>
                </div>
                <div class="key key-control key-tall">
                    <span class="key-number">+</span>
                    <span class="key-label">快捷聊天</span>
                </div>

                <!-- 第三行 - 快捷操作区 -->
                <div class="key key-action">
                    <span class="key-number">4</span>
                    <span class="key-label">快速执行</span>
                </div>
                <div class="key key-action">
                    <span class="key-number">5</span>
                    <span class="key-label">收藏夹</span>
                </div>
                <div class="key key-action">
                    <span class="key-number">6</span>
                    <span class="key-label">应用切换</span>
                </div>

                <!-- 第四行 - 基础功能区 -->
                <div class="key key-basic">
                    <span class="key-number">1</span>
                    <span class="key-label">上下文</span>
                </div>
                <div class="key key-basic">
                    <span class="key-number">2</span>
                    <span class="key-label">撤销/重做</span>
                </div>
                <div class="key key-basic">
                    <span class="key-number">3</span>
                    <span class="key-label">快速搜索</span>
                </div>
                <div class="key key-control key-tall">
                    <span class="key-number">Ent</span>
                    <span class="key-label">确认执行</span>
                </div>

                <!-- 第五行 -->
                <div class="key key-control key-wide">
                    <span class="key-number">0</span>
                    <span class="key-label">语音输入</span>
                </div>
                <div class="key key-control">
                    <span class="key-number">.</span>
                    <span class="key-label">设置</span>
                </div>
            </div>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <div class="legend-item legend-agent">
                <div class="legend-color"></div>
                <span>Agent/模型</span>
            </div>
            <div class="legend-item legend-action">
                <div class="legend-color"></div>
                <span>快捷操作</span>
            </div>
            <div class="legend-item legend-basic">
                <div class="legend-color"></div>
                <span>基础功能</span>
            </div>
            <div class="legend-item legend-control">
                <div class="legend-color"></div>
                <span>输入控制</span>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.key').forEach(key => {
            key.addEventListener('click', function() {
                this.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });
    </script>
</body>
</html>
