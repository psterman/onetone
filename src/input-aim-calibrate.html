<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>粗圈校准</title>
  <style>
    /*
      Window chrome is transparent; body MUST paint non-zero alpha on every pixel.
      Fully transparent pixels are click-through on Windows layered WebView2.
    */
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      background:rgba(8,16,24,.42)!important;
      font-family:system-ui,"Segoe UI","Microsoft YaHei UI",sans-serif;
      cursor:crosshair;user-select:none;touch-action:none
    }
    /* Docked to the active monitor (Rust injects layout) — never virtual-desktop center. */
    #hint{
      position:fixed;left:50%;top:28px;transform:translateX(-50%);z-index:3;
      background:rgba(255,255,255,.96);color:#12181f;font-size:15px;font-weight:650;
      padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);
      pointer-events:none;max-width:min(520px,92%);text-align:center
    }
    /* Dock beside the marquee so the next click is where the eye already is. */
    #hint.is-near{
      left:0;top:0;
      max-width:min(420px,90vw);
      transform:translate(-50%,-100%)
    }
    #hint.is-near.is-below{transform:translate(-50%,0)}
    #mq{
      position:fixed;border:2px solid #5ad0f5;background:rgba(90,208,245,.18);
      display:none;z-index:1;pointer-events:none;box-sizing:border-box
    }
    #pin{
      position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
      border:2px solid #fff;background:#1aa3d1;display:none;z-index:2;pointer-events:none;
      box-shadow:0 0 0 3px rgba(26,163,209,.35)
    }
    #bar{
      position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:3;display:flex;gap:10px
    }
    #bar.is-near{
      left:0;bottom:auto;top:0;transform:translateX(-50%)
    }
    button{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:13px;font-weight:650;cursor:pointer}
    #cancel{background:#fff;color:#12181f}
    #cancel kbd{
      display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
      background:#e8eef3;font:600 11px/1.4 ui-monospace,Consolas,monospace;color:#334
    }
  </style>
</head>
<body>
  <div id="hint">第一步：按住拖动，圈住聊天输入框（可略大） · Esc 取消</div>
  <div id="mq"></div>
  <div id="pin"></div>
  <div id="bar"><button type="button" id="cancel">取消 <kbd>Esc</kbd></button></div>
  <script>
    (function () {
      function getInvoke() {
        if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === 'function') {
          return function (cmd, args) { return window.__TAURI_INTERNALS__.invoke(cmd, args); };
        }
        if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === 'function') {
          return function (cmd, args) { return window.__TAURI__.core.invoke(cmd, args); };
        }
        return null;
      }
      var invoke = getInvoke();
      var hint = document.getElementById('hint');
      var mq = document.getElementById('mq');
      var pin = document.getElementById('pin');
      var bar = document.getElementById('bar');
      var cancelBtn = document.getElementById('cancel');
      var phase = 'draw';
      var dragging = false;
      var x0 = 0, y0 = 0;
      var box = null;
      var nearBox = false;

      function call(cmd, args) {
        if (!invoke) return Promise.reject(new Error('no_invoke'));
        return invoke(cmd, args || {});
      }

      function clamp(n, lo, hi) {
        return Math.min(Math.max(n, lo), hi);
      }

      /** Active monitor client rect inside the virtual-desktop overlay. */
      function activeMonitorClient() {
        var desk = window.__OT_AIM_DESK__;
        var act = window.__OT_AIM_ACTIVE__;
        var vw = Math.max(window.innerWidth || 1, 1);
        var vh = Math.max(window.innerHeight || 1, 1);
        if (!desk || !act || !desk.w || !desk.h) {
          return { l: 0, t: 0, r: vw, b: vh, w: vw, h: vh };
        }
        var ml = ((act.x - desk.x) / desk.w) * vw;
        var mt = ((act.y - desk.y) / desk.h) * vh;
        var mw = (act.w / desk.w) * vw;
        var mh = (act.h / desk.h) * vh;
        return { l: ml, t: mt, r: ml + mw, b: mt + mh, w: mw, h: mh };
      }

      /** Dock tip + Esc to the active monitor — never the gap between screens. */
      function placeChromeOnActiveMonitor() {
        if (nearBox && box) {
          placeChromeNearBox(box);
          return;
        }
        var m = activeMonitorClient();
        var pad = 28;
        var cx = m.l + m.w / 2;
        hint.classList.remove('is-near', 'is-below');
        hint.style.left = Math.round(cx) + 'px';
        hint.style.top = Math.round(m.t + pad) + 'px';
        hint.style.transform = 'translateX(-50%)';
        bar.classList.remove('is-near');
        bar.style.left = Math.round(cx) + 'px';
        bar.style.top = '';
        bar.style.bottom = '';
        bar.style.transform = 'translateX(-50%)';
        // Bottom of active monitor in client space.
        bar.style.top = Math.round(m.b - 56) + 'px';
        bar.style.bottom = 'auto';
      }
      window.__OT_AIM_PLACE_CHROME__ = placeChromeOnActiveMonitor;

      /** Put tip + cancel next to the marquee (eye stays on the box). */
      function placeChromeNearBox(b) {
        if (!b) {
          nearBox = false;
          placeChromeOnActiveMonitor();
          return;
        }
        nearBox = true;
        var mid = (b.l + b.r) / 2;
        var m = activeMonitorClient();
        mid = clamp(mid, m.l + 48, m.r - 48);
        var preferAbove = b.t - m.t >= 64;
        hint.classList.add('is-near');
        hint.classList.toggle('is-below', !preferAbove);
        hint.style.left = Math.round(mid) + 'px';
        hint.style.top = Math.round(preferAbove ? b.t - 10 : b.b + 10) + 'px';
        hint.style.transform = preferAbove ? 'translate(-50%,-100%)' : 'translate(-50%,0)';

        bar.classList.add('is-near');
        bar.style.left = Math.round(mid) + 'px';
        bar.style.bottom = 'auto';
        var barTop = preferAbove ? b.b + 12 : Math.max(m.t + 12, b.t - 52);
        bar.style.top = Math.round(clamp(barTop, m.t + 12, m.b - 56)) + 'px';
        bar.style.transform = 'translateX(-50%)';
      }

      function setHint(msg, useNear) {
        hint.textContent = msg;
        if (useNear && box) placeChromeNearBox(box);
        else {
          nearBox = false;
          placeChromeOnActiveMonitor();
        }
      }

      function cancel() {
        call('cmd_input_aim_calibrate_cancel', {}).finally(function () {
          try { window.close(); } catch (_) {}
        });
      }
      cancelBtn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        cancel();
      };
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          cancel();
        }
      });

      function onDown(e) {
        if (e.button !== 0) return;
        if (e.target === cancelBtn || (cancelBtn.contains && cancelBtn.contains(e.target))) return;
        e.preventDefault();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}

        if (phase === 'refine') {
          if (!box) return;
          if (e.clientX < box.l || e.clientX > box.r || e.clientY < box.t || e.clientY > box.b) {
            setHint('请点在蓝框内部 · Esc 取消', true);
            return;
          }
          pin.style.display = 'block';
          pin.style.left = e.clientX + 'px';
          pin.style.top = e.clientY + 'px';
          setHint('已记下，正在保存…', true);
          call('cmd_input_aim_calibrate_commit', {
            screenX: Math.round(e.screenX),
            screenY: Math.round(e.screenY)
          }).then(function () {
            setHint('已保存', true);
            setTimeout(function () { try { window.close(); } catch (_) {} }, 350);
          }).catch(function (err) {
            setHint('保存失败：' + (err && err.message ? err.message : String(err || '')) + ' · Esc 取消', true);
          });
          return;
        }

        dragging = true;
        x0 = e.clientX;
        y0 = e.clientY;
        mq.style.display = 'block';
        mq.style.left = x0 + 'px';
        mq.style.top = y0 + 'px';
        mq.style.width = '0px';
        mq.style.height = '0px';
        setHint('拖动中…松开完成粗圈 · Esc 取消', false);
      }

      function onMove(e) {
        if (!dragging) return;
        var l = Math.min(x0, e.clientX), t = Math.min(y0, e.clientY);
        mq.style.left = l + 'px';
        mq.style.top = t + 'px';
        mq.style.width = Math.abs(e.clientX - x0) + 'px';
        mq.style.height = Math.abs(e.clientY - y0) + 'px';
      }

      function onUp(e) {
        if (!dragging) return;
        dragging = false;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        var l = Math.min(x0, e.clientX), t = Math.min(y0, e.clientY);
        var r = Math.max(x0, e.clientX), b = Math.max(y0, e.clientY);
        if (r - l < 12 || b - t < 12) {
          box = null;
          setHint('圈太小，请再拖大一点 · Esc 取消', false);
          mq.style.display = 'none';
          return;
        }
        box = { l: l, t: t, r: r, b: b };
        phase = 'refine';
        setHint('第二步：在蓝框内点一下精确位置 · Esc 取消', true);
      }

      // Attach to documentElement so the whole screen hits, including near edges.
      var root = document.documentElement;
      root.addEventListener('pointerdown', onDown);
      root.addEventListener('pointermove', onMove);
      root.addEventListener('pointerup', onUp);
      root.addEventListener('pointercancel', onUp);

      placeChromeOnActiveMonitor();
      window.addEventListener('resize', placeChromeOnActiveMonitor);

      if (!invoke) setHint('校准层未接到 IPC，请从应用内打开 · Esc 取消', false);
    })();
  </script>
</body>
</html>
