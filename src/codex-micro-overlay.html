<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Micro</title>
  <link rel="stylesheet" href="css/codex-micro-overlay.css" />
  <script src="js/features/agent/usage-format.js"></script>
</head>
<body>
  <div class="root">
    <div class="wrap" id="wrap">
      <div class="overlay-mini" id="overlayMini">
        <div class="overlay-mini__agents" id="miniAgents" role="list" aria-label="Agent 状态">
          <span class="overlay-mini__agent" role="listitem" data-agent="codex" data-status="idle" aria-label="Codex：空闲">
            <img src="icons/app-target/codex.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="claude" data-status="idle" aria-label="Claude：空闲">
            <img src="icons/app-target/claude.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="cursor" data-status="idle" aria-label="Cursor：空闲">
            <img src="icons/app-target/cursor.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
        </div>
        <span class="overlay-mini__usage" id="miniUsagePill" hidden aria-live="polite"></span>
        <button type="button" class="overlay-mini__btn overlay-mini__btn--expand" data-act="expand" title="展开" aria-label="展开浮窗">
          <span class="overlay-mini__switch" aria-hidden="true">
            <span class="overlay-mini__switch-track"></span>
            <span class="overlay-mini__switch-thumb"></span>
          </span>
        </button>
        <button type="button" class="overlay-mini__btn" data-act="close" title="关闭" aria-label="关闭">×</button>
      </div>

      <div class="overlay-full" id="overlayFull">
        <header class="overlay-chrome">
          <button type="button" class="overlay-chrome__btn" data-act="minimize" title="最小化" aria-label="最小化">—</button>
          <button type="button" class="overlay-chrome__btn overlay-chrome__btn--close" data-act="close" title="关闭" aria-label="关闭">×</button>
        </header>
        <div class="overlay-body" id="overlayBody">
          <div class="overlay-pad-stack">
            <div class="micro-hw micro-hw--sm">
              <span class="micro-hw__aura" aria-hidden="true"></span>
              <div class="micro-hw__face">
                <div class="soft-pad-agent-bar" id="padAgentBar" role="toolbar" aria-label="Agent">
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="codex" data-status="idle" aria-pressed="false" aria-label="Codex" title="Codex">
                    <img src="icons/app-target/codex.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="claude" data-status="idle" aria-pressed="false" aria-label="Claude" title="Claude">
                    <img src="icons/app-target/claude.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="cursor" data-status="idle" aria-pressed="false" aria-label="Cursor" title="Cursor">
                    <img src="icons/app-target/cursor.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                </div>
                <div class="micro-hw__grid" id="grid"></div>
                <div class="status-chip" id="statusChip" data-status="idle" aria-hidden="true"></div>
              </div>
            </div>
            <div class="overlay-key-caption" id="overlayKeyCaption" aria-live="polite">
              <span class="overlay-key-caption__name" data-cap-name>悬停按键查看名称</span>
              <span class="overlay-key-caption__chord" data-cap-chord></span>
            </div>
            <button type="button" class="overlay-nav-cta" id="overlayNavCta" hidden>
              <span class="overlay-nav-cta__label" data-nav-cta-label>AG 当前为动作键</span>
              <span class="overlay-nav-cta__action" data-nav-cta-action>启用 4 个会话导航灯</span>
            </button>
            <details class="overlay-light-gate" id="overlayLightGate" hidden>
              <summary class="overlay-light-gate__sum">
                <span data-gate-sum>灯路诊断</span>
                <span class="overlay-light-gate__fail" data-gate-fail hidden></span>
              </summary>
              <ol class="overlay-light-gate__list" id="overlayLightGateList"></ol>
              <p class="overlay-light-gate__hint" data-gate-hint></p>
            </details>
          </div>
        </div>
        <div class="overlay-app-meta" id="overlayAppMeta" hidden aria-live="polite">
          <div class="overlay-app-meta__row" id="overlayAppMetaRow"></div>
          <div class="overlay-app-meta__task" id="overlayAppMetaTask" hidden></div>
        </div>
        <div class="overlay-toast" id="overlayToast" aria-live="polite"></div>
      </div>
    </div>
  </div>

    var layoutColumns=5;

      if(padMode==='numpad') return LAYOUT_NUMPAD;
      return navKeysEnabled ? LAYOUT : LAYOUT_NO_NAV;
    }

    function isNumpadKeyId(id){
      return /^NP/.test(String(id||''));
    }

      cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-8 5.5 5.5 0 00-10.7 1.5A3.5 3.5 0 007 18z"/></svg>',

      power:'<svg viewBox="0 0 24 24"><path d="M12 2v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>',

    };

    var STATUS_LABEL={idle:'',running:'执行中',listening:'听写中',done:'完成',failed:'失败'};
    var REASON_HINT={
      not_foreground:'请切换到 Codex 桌面版窗口',
      unbound:'此键未启用或未绑定快捷键',
      no_profile:'Codex 应用场景未配置',
      hold_failed:'无法启动听写（请确认 Codex 已打开）',
      invalid_key:'无效按键',
      invalid_phase:'无效操作',
      numpad_mode:'请先打开模式开关 · 切换到虚拟键盘模式'
    };
    var boundKeys={};
    var PAD_SKINS=['default','glass-light','hybrid-pro','vibe-light','vibe-dark'];
    function normalizeOverlaySkin(raw){
      var s=String(raw||'').trim().toLowerCase();
      if(s==='vibe-dark') return 'vibe-light';
      if(s==='glass-light'||s==='hybrid-pro'||s==='vibe-light'||s==='default') return s;
      return 'default';
    }
    function syncOverlayTheme(){
      try{
        var th=localStorage.getItem('vp_theme');
        document.documentElement.setAttribute('data-theme', th==='dark'?'dark':'light');
      }catch(_){
        document.documentElement.setAttribute('data-theme','light');
      }
    }
    var wrap=document.getElementById('wrap');
    var grid=document.getElementById('grid');
    var overlayToast=document.getElementById('overlayToast');
    var miniAgents=document.getElementById('miniAgents');
    var padAgentBar=document.getElementById('padAgentBar');
    var miniUsagePill=document.getElementById('miniUsagePill');
    var statusChip=document.getElementById('statusChip');
    var overlayAppMeta=document.getElementById('overlayAppMeta');
    var overlayAppMetaRow=document.getElementById('overlayAppMetaRow');
    var overlayAppMetaTask=document.getElementById('overlayAppMetaTask');
    var overlayNavCta=document.getElementById('overlayNavCta');
    var overlayLightGate=document.getElementById('overlayLightGate');
    var overlayLightGateList=document.getElementById('overlayLightGateList');
    var navCtaBusy=false;
    var navCtaArmedUntil=0;
    var activePtr='';
    /** ACT10 hold-to-talk: block grid rebuild while pressed (innerHTML breaks pointer capture). */
    var holdLockId='';
    var holdSuppressCancel=false;
    var holdUiReleased=false;
    var lastGridSig='';
    /** Drop stacked non-hold taps while inject is in flight (avoids WebView2 假死). */
    var tapFireBusy=false;
    /** Ignore stacked pad-mode clicks / emit rebuilds while a toggle is in flight (假死). */
    var padModeToggleBusy=false;
    var padModeSuppressEmitUntil=0;
    var localPadStatus='idle';
    var localStatusMicro='';
    var localStatusTimer=null;
    var localMinimized=false;
    var backendPadStatus='idle';
    var STATUS_MS={running:800,done:600,failed:1200};
    var enhanceOn=false;
    var padEnabled=true;
    var padMode='codex';
    var focusedUsageAgent='';
    var usageFocusPinned=false;
    try{
      var savedFocus=localStorage.getItem('onetoneFocusedUsageAgent');
      if(savedFocus==='codex'||savedFocus==='claude'||savedFocus==='cursor') focusedUsageAgent=savedFocus;
      usageFocusPinned=localStorage.getItem('onetoneUsageFocusPinned')==='1';
    }catch(_){}
    try{
      var savedMode=localStorage.getItem('onetoneSoftPadMode');
      if(savedMode==='numpad'||savedMode==='codex'){
        padMode=savedMode;
        padEnabled=savedMode==='codex';
      }
    }catch(_){}

    function persistUsageFocus(kind, pinned){
      focusedUsageAgent=kind;
      if(pinned) usageFocusPinned=true;
      try{
        localStorage.setItem('onetoneFocusedUsageAgent', kind);
        localStorage.setItem('onetoneUsageFocusPinned', usageFocusPinned?'1':'0');
      }catch(_){}
    }

    function persistPadMode(){
      try{ localStorage.setItem('onetoneSoftPadMode', padMode); }catch(_){}
    }
    var joyArrowsLive=false;
    var joyContextHint='';
    var requireNumLockOff=false;
    var numLockBlocking=false;
    var dragging=false;
    var overlayHoldInstalled=false;
    var toastTimer=null;
    var lastNumpadToastAt=0;
    var DEFAULT_FOOT='';

    function isNavKeyId(id){
      return /^NAV_/.test(String(id||''));
    }

    function navIconHtml(cellId, iconId){
      if(ICON[iconId]) return ICON[iconId];
      if(cellId==='NAV_UP') return ICON.navUp;
      if(cellId==='NAV_DOWN') return ICON.navDown;
      if(cellId==='NAV_LEFT') return ICON.navLeft;
      if(cellId==='NAV_RIGHT') return ICON.navRight;
      return ICON.empty;
    }

    function toast(msg){
      if(!overlayToast||!msg) return;
      overlayToast.textContent=msg;
      overlayToast.classList.add('is-show');
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){
        overlayToast.classList.remove('is-show');
      },1800);
    }

    function recommendedNavSlotsForAgent(agent){
      agent=String(agent||'').toLowerCase();
      if(agent==='claude') return ['AG00','AG01','AG02','AG03'];
      if(agent==='codex') return ['AG00','AG01'];
      return [];
    }

    function applyNavCta(s){
      if(!overlayNavCta) return;
      var mid=String(s&&(s.navCtaMappingId||s.nav_cta_mapping_id)||'').trim();
      var agent=String(s&&(s.navCtaAgent||s.nav_cta_agent)||'').toLowerCase();
      var slots=Array.isArray(s&&s.navCtaSlots)?s.navCtaSlots
        :(Array.isArray(s&&s.nav_cta_slots)?s.nav_cta_slots:[]);
      // Fallback for older snapshots: current applied mapping only.
      if(!mid||!slots.length){
        var purpose=String(s&&(s.purpose)||'shortcuts').toLowerCase()==='sessions'?'sessions':'shortcuts';
        agent=String(s&&(s.appliedAgent||s.applied_agent)||'').toLowerCase();
        mid=String(s&&(s.mappingId||s.mapping_id)||'').trim();
        var navSlots=Array.isArray(s&&s.navigationSlots)?s.navigationSlots
          :(Array.isArray(s&&s.navigation_slots)?s.navigation_slots:[]);
        slots=recommendedNavSlotsForAgent(agent);
        if(!(purpose==='shortcuts'&&mid&&slots.length&&!navSlots.length&&(agent==='claude'||agent==='codex'))){
          overlayNavCta.hidden=true;
          navCtaArmedUntil=0;
          overlayNavCta.classList.remove('is-armed');
          return;
        }
      }
      overlayNavCta.hidden=false;
      var label=overlayNavCta.querySelector('[data-nav-cta-label]');
      var action=overlayNavCta.querySelector('[data-nav-cta-action]');
      var armed=Date.now()<navCtaArmedUntil;
      overlayNavCta.classList.toggle('is-armed', armed);
      if(label){
        label.textContent=armed
          ?('将占用 '+slots.join('/'))
          :'AG 当前为动作键';
      }
      if(action){
        if(armed){
          action.textContent='再次点击确认启用';
        }else{
          action.textContent=agent==='codex'
            ?('启用 '+slots.length+' 个线程导航灯')
            :('启用 '+slots.length+' 个会话导航灯');
        }
      }
      overlayNavCta.setAttribute('data-mapping-id', mid);
      overlayNavCta.setAttribute('data-agent', agent);
      overlayNavCta.setAttribute('data-slots', slots.join(','));
      overlayNavCta.disabled=!!navCtaBusy;
    }

    var GATE_FIX={
      hook:'等 Claude Hook 上报状态（执行中/等待输入）',
      applied:'点顶栏 Claude 图标，或把 Soft Pad Applied 切到 Claude',
      purpose:'点上方「启用会话导航灯」两下确认',
      nav_slots:'点上方 CTA，或到 Soft Pad 设置里开会话导航',
      lanes:'在终端里开 Claude 会话（SessionStart）',
      projected:'先满足 Applied=Claude + sessions + 导航槽',
      status_host:'状态宿主键无亮灯时检查 Hook 与 Applied'
    };

    function applyLightGate(s){
      if(!overlayLightGate||!overlayLightGateList) return;
      var gates=Array.isArray(s&&s.agLightGates)?s.agLightGates
        :(Array.isArray(s&&s.ag_light_gates)?s.ag_light_gates:[]);
      var claudeLive=String(s&&(s.appAgent||s.app_agent)||'').toLowerCase()==='claude'
        || String(s&&(s.appLastSource||s.app_last_source)||'').indexOf('claude')>=0;
      var ctaVisible=overlayNavCta&&!overlayNavCta.hidden;
      if(!gates.length&&!claudeLive&&!ctaVisible){
        overlayLightGate.hidden=true;
        return;
      }
      // Fallback when older binary has no agLightGates — derive from snapshot.
      if(!gates.length){
        var purpose=String(s&&s.purpose||'shortcuts').toLowerCase();
        var applied=String(s&&(s.appliedAgent||s.applied_agent)||'').toLowerCase();
        var navSlots=Array.isArray(s&&s.navigationSlots)?s.navigationSlots
          :(Array.isArray(s&&s.navigation_slots)?s.navigation_slots:[]);
        var cells=Array.isArray(s&&s.cells)?s.cells:[];
        var laneCells=cells.filter(function(c){ return String(c.laneId||c.lane_id||'').trim(); });
        var status=String(s&&(s.appStatus||s.app_status)||'');
        gates=[
          {id:'hook',ok:claudeLive&&status&&status!=='idle',label:'Claude Hook 有状态',detail:status||'—'},
          {id:'applied',ok:applied==='claude',label:'Applied Soft Pad = Claude',detail:applied?('当前 Applied='+applied):'无 Applied'},
          {id:'purpose',ok:purpose==='sessions',label:'purpose = sessions',detail:'purpose='+purpose},
          {id:'nav_slots',ok:navSlots.length>0,label:'导航槽 AG00–03',detail:navSlots.length?navSlots.join(','):'[]'},
          {id:'projected',ok:laneCells.length>0,label:'AG 格子已投影会话',detail:laneCells.length?laneCells.map(function(c){return c.microKeyId||c.micro_key_id;}).join(','):'无'}
        ];
      }
      var fail=gates.filter(function(g){ return !g.ok; });
      var sum=overlayLightGate.querySelector('[data-gate-sum]');
      var failEl=overlayLightGate.querySelector('[data-gate-fail]');
      var hint=overlayLightGate.querySelector('[data-gate-hint]');
      overlayLightGate.hidden=false;
      if(fail.length){
        // Keep collapsed by default — forcing open used to clip the Soft Pad in the fixed window.
        if(sum) sum.textContent='灯路诊断 · 堵塞在第 '+(gates.findIndex(function(g){return !g.ok;})+1)+' 步';
        if(failEl){
          failEl.hidden=false;
          failEl.textContent=fail.length+' 项未过';
        }
        if(hint){
          var first=fail[0];
          hint.textContent='下一步：'+(GATE_FIX[first.id]||first.detail||first.label);
        }
      }else{
        if(sum) sum.textContent='灯路诊断 · 全部通过';
        if(failEl){ failEl.hidden=true; failEl.textContent=''; }
        if(hint) hint.textContent='AG 会话灯 / 状态单灯应可亮；若仍暗，重启浮窗后再看';
      }
      overlayLightGateList.innerHTML=gates.map(function(g){
        var ok=!!g.ok;
        return '<li class="overlay-light-gate__row'+(ok?' is-ok':' is-fail')+'" data-gate="'+String(g.id||'')+'">'
          +'<span class="overlay-light-gate__mark" aria-hidden="true">'+(ok?'✓':'✗')+'</span>'
          +'<span class="overlay-light-gate__label">'+escHtml(g.label||g.id||'')+'</span>'
          +'<span class="overlay-light-gate__detail">'+escHtml(g.detail||'')+'</span>'
          +'</li>';
      }).join('');
    }

    function invokeErrText(err){
      if(!err) return 'unknown';
      if(typeof err==='string') return err;
      if(err.message) return String(err.message);
      try{ return JSON.stringify(err); }catch(_){ return String(err); }
    }

    function enableNavFromOverlay(){
      if(!overlayNavCta||overlayNavCta.hidden||navCtaBusy) return;
      var mid=overlayNavCta.getAttribute('data-mapping-id')||'';
      var agent=overlayNavCta.getAttribute('data-agent')||'';
      var slots=(overlayNavCta.getAttribute('data-slots')||'').split(',').filter(Boolean);
      if(!mid||!slots.length) return;
      // Overlay webview has no reliable native confirm — two-tap arm/confirm instead.
      if(Date.now()>=navCtaArmedUntil){
        navCtaArmedUntil=Date.now()+8000;
        applyNavCta(lastSnap||{});
        toast('再次点击确认：将占用 '+slots.join(', '));
        return;
      }
      navCtaArmedUntil=0;
      navCtaBusy=true;
      overlayNavCta.disabled=true;
      Promise.resolve(invoke('cmd_soft_pad_set_purpose',{mappingId:mid,purpose:'sessions'}))
        .then(function(){
          return invoke('cmd_soft_pad_set_navigation_slots',{mappingId:mid,slots:slots});
        })
        .then(function(){
          toast(agent==='codex'?'已启用线程导航灯':'已启用会话导航灯');
          return invoke('cmd_codex_micro_overlay_get_state',{});
        })
        .then(function(s){ if(s) render(s); })
        .catch(function(err){
          toast('启用失败：'+invokeErrText(err));
        })
        .then(function(){
          navCtaBusy=false;
          if(overlayNavCta) overlayNavCta.disabled=false;
        });
    }

    function toastNumpadMode(){
      var now=Date.now();
      if(now-lastNumpadToastAt<2200) return;
      lastNumpadToastAt=now;
      toast(REASON_HINT.numpad_mode);
    }

    function ensureOverlayHoldPointerUp(){
      if(overlayHoldInstalled) return;
      overlayHoldInstalled=true;
      function endOverlayPtr(e){
        if(!activePtr) return;
        // Focus/SendInput blips emit pointercancel — ignoring keeps press visual until real up.
        if(e && e.type==='pointercancel') return;
        if(holdSuppressCancel && e && e.type==='pointercancel') return;
        var id=activePtr;
        activePtr='';
        if(id==='ACT10') holdSuppressCancel=false;
        if(id==='ACT10') holdUiReleased=true;
        if(id==='ACT10'){
          releaseKeyVisual(id);
        } else {
          // Brief linger so quick taps still show press flash.
          var el=grid&&grid.querySelector('[data-micro-key="'+id+'"]');
          setTimeout(function(){
            if(activePtr===id) return;
            releaseKeyVisual(id);
            applyLocalStatusDom();
          }, 120);
          if(el){ /* keep is-pressed until linger */ }
        }
        applyLocalStatusDom();
        fire(id,'up');
      }
      window.addEventListener('pointerup',endOverlayPtr,true);
      window.addEventListener('mouseup',endOverlayPtr,true);
      // pointercancel ignored — see comment above.
    }

    function cellMap(cells){
      var map={};
      (cells||[]).forEach(function(c){ if(c&&c.microKeyId) map[c.microKeyId]=c; });
      return map;
    }

    function escHtml(s){
      return String(s==null?'':s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function statusSourceLabel(source){
      var s=String(source||'').trim();
      if(s==='native'||s==='native_micro') return 'Native Micro';
      if(s==='codex_hook') return 'Codex Hook';
      if(s==='claude_hook') return 'Claude Hook';
      if(s==='codex_app') return 'Codex App';
      if(s==='claude_app') return 'Claude App';
      if(s==='inferred') return 'Inferred';
      if(s==='fallback') return 'Fallback';
      return s||'Fallback';
    }

    function lightStatusLabel(status){
      var st=String(status||'idle').trim();
      if(st==='listening') return '听写中';
      if(st==='needs_input') return '等待输入';
      if(st==='running') return '执行中';
      if(st==='done') return '完成';
      if(st==='failed') return '失败';
      return '空闲';
    }

    /** Claude when rate-limit/OTel absent — prefer live agent / pad state over barren copy. */
    function claudeFallbackCaption(row, snap, detail){
      row=row||{};
      var st=String(row.state||'').trim();
      if(st&&st!=='idle') return lightStatusLabel(st);
      var appSt=String(snap&&(snap.appStatus||snap.app_status)||'').trim();
      var appAgent=String(snap&&(snap.appAgent||snap.app_agent)||'').trim().toLowerCase();
      if(appAgent==='claude'&&appSt&&appSt!=='idle') return lightStatusLabel(appSt);
      var msg=String(snap&&(snap.appMessage||snap.app_message)||'').trim();
      if(appAgent==='claude'&&msg) return msg;
      var model=String(row.model||'').trim();
      if(model) return detail?('模型 '+model+' · 额度未同步'):('模型 '+model);
      return detail?'额度未同步（可装 Hook / statusline）':'额度未同步';
    }

    function agentLabel(kind){
      if(kind==='claude') return 'Claude';
      if(kind==='cursor') return 'Cursor';
      return 'Codex';
    }

    function compactNumber(value){
      var n=Number(value);
      if(!Number.isFinite(n)||n<0) return '';
      if(n>=1000000) return (n/1000000).toFixed(n>=10000000?0:1).replace(/\.0$/,'')+'M';
      if(n>=1000) return (n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'k';
      return String(Math.round(n));
    }

    function usageValue(usage,camel,snake){
      if(!usage) return null;
      return usage[camel]!=null?usage[camel]:usage[snake];
    }

    var usageFmt=window.OneToneUsageFormat||{};
    function formatResetCountdown(resetsAt){
      return usageFmt.formatResetCountdown?usageFmt.formatResetCountdown(resetsAt):'';
    }
    function primaryResetAt(usage){
      return usageFmt.primaryResetAt?usageFmt.primaryResetAt(usage):null;
    }

    function windowLabel(w,withReset){
      return usageFmt.windowQuotaLabel
        ? usageFmt.windowQuotaLabel(w, !!withReset)
        : '';
    }

    function freshnessLabel(usage,healthRows){
      var ts=Number(usage&&(usage.lastSuccessAt!=null?usage.lastSuccessAt:usage.last_success_at))||0;
      if(!ts&&Array.isArray(healthRows)){
        healthRows.forEach(function(h){
          if(h&&h.capability==='usage') ts=Number(h.lastSuccessAt||h.last_success_at)||ts;
        });
      }
      if(!ts) return '';
      var age=Date.now()-ts;
      if(age<60_000) return '刚刚';
      if(age<3600_000) return Math.floor(age/60_000)+'分钟前';
      return Math.floor(age/3600_000)+'小时前';
    }

    /** Claude OTel session/$ — shown when statusLine windows are absent. */
    function claudeOtelBits(usage,detail){
      usage=usage||{};
      var bits=[];
      var sess=usageValue(usage,'sessionTokens','session_tokens');
      var aux=usageValue(usage,'auxiliaryTokens','auxiliary_tokens');
      var cost=usageValue(usage,'estimatedCostUsd','estimated_cost_usd');
      if(sess!=null) bits.push((detail?'本会话 ':'')+compactNumber(sess));
      if(detail&&aux!=null) bits.push('子任务 '+compactNumber(aux));
      if(cost!=null){
        var c=Number(cost);
        bits.push((detail?'估算 ':'')+'$'+(isFinite(c)?(Math.round(c*1e4)/1e4):cost));
      }
      return bits;
    }

    function usageSummary(kind,usage,detail,row,snap){
      usage=usage||{};
      var status=String(usage.status||'unavailable');
      if(kind==='cursor') return detail?'用量暂无官方接口':'用量 --';
      if(status==='disabled') return detail?'用量已关闭':'已关闭';
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      var bits=[];
      if(kind==='codex'||kind==='claude'){
        windows.slice(0,2).forEach(function(w){
          // Each window shows its own reset (do not share primary countdown with 7d).
          var lab=windowLabel(w,true);
          if(lab) bits.push(lab);
        });
        if(windows.length>2) bits.push('另 '+(windows.length-2)+' 项');
        if(!bits.length){
          if(kind==='claude'){
            var otel=claudeOtelBits(usage,detail);
            if(otel.length) bits=otel;
            else return claudeFallbackCaption(row,snap,!!detail);
          } else {
            var remaining=usageValue(usage,'remainingPercent','remaining_percent');
            if(remaining!=null){
              var base='窗口余 '+Math.round(Number(remaining))+'%';
              if(detail){
                var cd=formatResetCountdown(usageValue(usage,'resetsAt','resets_at'));
                if(cd) base+=' · '+cd+'重置';
              }
              bits.push(base);
            }
          }
        }
        if(kind==='codex'){
          var lifetime=usageValue(usage,'lifetimeTokens','lifetime_tokens');
          if(detail&&lifetime!=null) bits.push('累计 '+compactNumber(lifetime));
        }
      }
      if(status==='stale'){
        if(bits.length) return bits.join(detail?' · ':' / ')+(detail?' · 数据陈旧':' · 陈旧');
        return detail?(friendlyUsageMessage(usage.message)||'数据陈旧，保留上次值'):'数据陈旧';
      }
      if(status==='waiting'){
        if(bits.length) return bits.join(detail?' · ':' / ');
        return detail?(friendlyUsageMessage(usage.message)||'正在同步额度'):'同步中';
      }
      if(status!=='ready'){
        if(bits.length) return bits.join(detail?' · ':' / ');
        var message=friendlyUsageMessage(usage.message);
        return detail?(message||'用量数据未连接'):'未连接';
      }
      return bits.length?bits.join(detail?' · ':' / '):(detail?'用量数据未返回':'--');
    }

    function friendlyUsageMessage(msg){
      var s=String(msg||'').trim();
      if(!s) return '';
      var lower=s.toLowerCase();
      if(lower.indexOf('timed out')>=0||lower.indexOf('timeout')>=0) return '同步超时，稍后重试';
      if(lower.indexOf('token usage profile')>=0) return '同步超时，稍后重试';
      return s;
    }

    function healthCap(healthRows,cap){
      if(!Array.isArray(healthRows)) return null;
      for(var i=0;i<healthRows.length;i++){
        if(healthRows[i]&&String(healthRows[i].capability||'')===cap) return healthRows[i];
      }
      return null;
    }

    /** Usage-rail badge: usage channel only (never lifecycle aggregate). */
    function usageRailBadge(kind,usage,healthRows){
      usage=usage||{};
      var u=healthCap(healthRows,'usage');
      var state=String(u&&u.state||'');
      var status=String(usage.status||'unavailable');
      var hasWindows=Array.isArray(usage.windows)&&usage.windows.some(function(w){
        return w&&(w.remainingPercent!=null||w.remaining_percent!=null);
      });
      var hasRem=usageValue(usage,'remainingPercent','remaining_percent')!=null||hasWindows;
      if(kind==='cursor'){
        return { label:'用量暂无接口', state:'unsupported' };
      }
      var hasOtel=kind==='claude'&&(
        usageValue(usage,'sessionTokens','session_tokens')!=null||
        usageValue(usage,'estimatedCostUsd','estimated_cost_usd')!=null
      );
      if(kind==='claude'&&!hasRem&&!hasOtel){
        return { label:'用量暂无接口', state:'unsupported' };
      }
      // Codex + Claude with windows or OTel
      if(status==='ready'||state==='live'||((hasRem||hasOtel)&&status!=='stale'&&status!=='waiting')){
        return { label:'正常', state:'live' };
      }
      if(status==='stale'||state==='stale') return { label:'数据陈旧', state:'stale' };
      if(status==='waiting'||state==='configured_waiting') return { label:'同步中', state:'configured_waiting' };
      if(status==='disabled'||state==='disabled') return { label:'已关闭', state:'disabled' };
      if(state==='error'&&!hasRem&&!hasOtel) return { label:'出错', state:'error' };
      if(hasRem||hasOtel) return { label:'正常', state:'live' };
      return { label:'同步中', state:'configured_waiting' };
    }

    function miniUsageAbbrev(kind){
      if(kind==='codex') return 'C';
      if(kind==='claude') return 'Cl';
      if(kind==='cursor') return 'Cu';
      return String(kind||'?').slice(0,1).toUpperCase();
    }

    function isRenderableUsage(kind,usage){
      usage=usage||{};
      var status=String(usage.status||'');
      if(kind==='cursor') return false;
      if(status==='disabled'||status==='unavailable') return false;
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      for(var i=0;i<windows.length;i++){
        var w=windows[i];
        if(!w) continue;
        var rem=w.remainingPercent!=null?w.remainingPercent:w.remaining_percent;
        if(rem==null) continue;
        var n=Number(rem);
        if(Number.isFinite(n)&&n>=0&&n<=100) return true;
      }
      var remScalar=usageValue(usage,'remainingPercent','remaining_percent');
      if(remScalar!=null){
        var sn=Number(remScalar);
        if(Number.isFinite(sn)&&sn>=0&&sn<=100) return true;
      }
      return false;
    }

    function miniUsageText(kind,usage){
      usage=usage||{};
      if(!isRenderableUsage(kind,usage)) return '';
      var rem=usageValue(usage,'remainingPercent','remaining_percent');
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      var pw=windows.find(function(w){ return String(w.kind||'')==='primary'; })||windows[0];
      if(rem==null&&pw) rem=pw.remainingPercent!=null?pw.remainingPercent:pw.remaining_percent;
      if(rem==null) return '';
      var cd=formatResetCountdown(primaryResetAt(usage));
      return miniUsageAbbrev(kind)+' '+Math.round(Number(rem))+'%'+(cd?' · '+cd:'');
    }

    /** One visible pill: pinned focus → app_agent → renderable-first (never Cursor without quota). */
    function pickMiniUsageKind(s){
      var rows=Array.isArray(s&&s.agents)?s.agents:[];
      var byKind={};
      rows.forEach(function(row){
        var kind=String(row&&row.kind||'').trim();
        if(kind) byKind[kind]=row;
      });
      function hasRenderable(kind){
        return isRenderableUsage(kind,(byKind[kind]||{}).usage||{});
      }
      if(usageFocusPinned&&focusedUsageAgent&&hasRenderable(focusedUsageAgent)) return focusedUsageAgent;
      var app=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
      if(app&&hasRenderable(app)) return app;
      var active=['needs_input','running'];
      for(var i=0;i<rows.length;i++){
        var st=String(rows[i]&&rows[i].state||'').trim();
        var k=String(rows[i]&&rows[i].kind||'').trim();
        if(active.indexOf(st)>=0&&hasRenderable(k)) return k;
      }
      if(hasRenderable('codex')) return 'codex';
      if(hasRenderable('claude')) return 'claude';
      for(var n=0;n<rows.length;n++){
        var kk=String(rows[n]&&rows[n].kind||'').trim();
        if(kk&&kk!=='cursor'&&hasRenderable(kk)) return kk;
      }
      return '';
    }

    function resolveUsageFocus(s){
      if(usageFocusPinned&&(focusedUsageAgent==='codex'||focusedUsageAgent==='claude'||focusedUsageAgent==='cursor')){
        return focusedUsageAgent;
      }
      var app=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
      if(app==='codex'||app==='claude'||app==='cursor') return app;
      var auto=pickMiniUsageKind(s);
      if(auto) return auto;
      return focusedUsageAgent||'codex';
    }

    function usageLineBits(kind,usage,row,snap){
      usage=usage||{};
      var lines=[];
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      windows.slice(0,2).forEach(function(w){
        var lab=windowLabel(w,true);
        if(lab) lines.push(lab);
      });
      if(!lines.length&&kind==='claude'){
        claudeOtelBits(usage,true).forEach(function(b){ lines.push(b); });
      }
      if(!lines.length&&kind==='codex'){
        var remaining=usageValue(usage,'remainingPercent','remaining_percent');
        if(remaining!=null){
          var base='窗口余 '+Math.round(Number(remaining))+'%';
          var cd=formatResetCountdown(usageValue(usage,'resetsAt','resets_at'));
          lines.push(cd?base+' · '+cd+'重置':base);
        }
      }
      if(!lines.length){
        if(kind==='cursor') lines.push('用量暂无官方接口');
        else if(kind==='claude') lines.push(claudeFallbackCaption(row,snap,true));
        else lines.push('用量 --');
      }
      return lines;
    }

    function usageCaptionText(kind,usage,row,snap){
      var lines=usageLineBits(kind,usage||{},row,snap);
      return lines.length?lines[0]:'';
    }

    function applyMiniUsagePill(s){
      if(!miniUsagePill) return;
      var kind=pickMiniUsageKind(s);
      var rows=Array.isArray(s&&s.agents)?s.agents:[];
      var row=rows.find(function(r){ return String(r&&r.kind||'')===kind; })||{};
      var text=kind?miniUsageText(kind,row.usage||{}):'';
      if(!text){
        miniUsagePill.hidden=true;
        miniUsagePill.textContent='';
        miniUsagePill.removeAttribute('title');
        miniUsagePill.removeAttribute('data-agent');
        return;
      }
      miniUsagePill.hidden=false;
      miniUsagePill.textContent=text;
      miniUsagePill.setAttribute('data-agent', kind);
      miniUsagePill.title=agentLabel(kind)+' · '+usageSummary(kind,row.usage||{},true,row,s);
    }

    var usageCaptionIdle='';
    var keyHoverActive=false;

    function applyUsageCaptionIdle(s){
      var focus=resolveUsageFocus(s);
      var rows=Array.isArray(s&&s.agents)?s.agents:[];
      var row=rows.find(function(r){ return String(r&&r.kind||'')===focus; })||{};
      var usage=row.usage||{};
      var badge=usageRailBadge(focus,usage,row.health);
      var cap=usageCaptionText(focus,usage,row,s);
      usageCaptionIdle=cap
        ?(agentLabel(focus)+' · '+cap)
        :(agentLabel(focus)+' · '+badge.label);
      if(!keyHoverActive) setKeyCaption('', '');
    }

    function applyAgentChipEl(el,s,byKind,focus){
      if(!el) return;
      var kind=String(el.getAttribute('data-agent')||'');
      var row=byKind[kind]||{};
      var state=String(row.state||'idle').trim().toLowerCase()||'idle';
      var activeState=(state==='running'||state==='needs_input'||state==='done'||state==='failed'||state==='error');
      // Fallback: when usage rail/model rows lag behind, derive Claude chip state
      // from app-state / hook source so the lamp still reflects live CLI progress.
      if(kind==='claude'&&!activeState){
        var appAgent=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
        var appStatus=String(s&&(s.appStatus||s.app_status)||'').trim().toLowerCase();
        var appSrc=String(s&&(s.appLastSource||s.app_last_source)||'').trim().toLowerCase();
        var waitingHint=String(s&&(s.claudeWaitingHint||s.claude_waiting_hint)||'').trim();
        var claudeLiveSrc=(appSrc==='claude_hook'||appSrc==='claude_app');
        if((appAgent==='claude'||claudeLiveSrc)&&(appStatus==='running'||appStatus==='needs_input'||appStatus==='done'||appStatus==='failed')){
          state=appStatus;
        }else if(waitingHint){
          state='needs_input';
        }
      }
      var model=String(row.model||'').trim();
      var confidence=String(row.modelConfidence||row.model_confidence||'').trim();
      var usage=row.usage||{};
      var label=agentLabel(kind)+'：'+lightStatusLabel(state);
      var line2='';
      if(model){
        line2=model;
        if(kind==='claude'&&confidence==='low') line2+='（会话开始值）';
        else if(kind==='cursor'&&model==='Auto') line2+='（自动路由）';
      } else {
        line2='模型 --';
      }
      if(kind!=='claude'||isRenderableUsage(kind,usage)||claudeOtelBits(usage,false).length){
        var usageShort=usageSummary(kind,usage,false,row,s);
        if(usageShort) line2+=' · '+usageShort;
      }
      var hasClaudeData=kind==='claude'&&(isRenderableUsage(kind,usage)||claudeOtelBits(usage,false).length);
      var fresh=kind==='claude'&&!hasClaudeData?'':freshnessLabel(usage,row.health);
      var src=String(usage.source||'');
      if(kind==='cursor') src=src||'Cursor Hook';
      if(kind==='claude'&&!hasClaudeData) src='—';
      var line3=(src||'—')+(fresh?' · '+fresh:'');
      if((kind!=='claude'||hasClaudeData)&&String(usage.status||'')==='stale') line3='数据陈旧'+(fresh?' · 上次成功 '+fresh:'');

      el.setAttribute('aria-pressed', kind===focus?'true':'false');

    function formatAgeMs(ageMs){
      var n=Number(ageMs)||0;
      if(n<=0) return '';
      if(n<1000) return '刚刚';
      if(n<60_000) return Math.floor(n/1000)+'s 前';
      if(n<3600_000) return Math.floor(n/60_000)+'m 前';
      return Math.floor(n/3600_000)+'h 前';
    }

    function shortId(id){

    function applyAppMetaChip(s){
      if(!overlayAppMeta) return;
      var lastSrc=String(s&&(s.appLastSource||s.app_last_source)||'').trim();
      var lastEv=String(s&&(s.appLastEvent||s.app_last_event)||'').trim();
      var enabled=!!(s&&(s.appStateEnabled||s.app_state_enabled));
      var confidence=String(s&&(s.appConfidence||s.app_confidence)||'').trim();
      var ageMs=Number(s&&(s.appAgeMs!=null?s.appAgeMs:s.app_age_ms))||0;
      var msg=String(s&&(s.appMessage||s.app_message)||'').trim();
      var taskId=String(s&&(s.appTaskId||s.app_task_id)||'').trim();
      var sessionId=String(s&&(s.appSessionId||s.app_session_id)||'').trim();
      var waitingHint=String(s&&(s.claudeWaitingHint||s.claude_waiting_hint)||'').trim();
      // Snapshot-only: never re-derive light from lastEvent on the FE.
      var light=String(s&&(s.appStatus||s.app_status)||'').trim()||'idle';
      // Quiet idle: hide unless Claude waiting hint (copy-only; no lamp color).
      if(!enabled || (!lastEv && !lastSrc && !waitingHint) || (light==='idle' && !waitingHint)){
        overlayAppMeta.hidden=true;
        if(overlayAppMetaRow) overlayAppMetaRow.textContent='';
        if(overlayAppMetaTask){
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
        overlayAppMeta.removeAttribute('title');
        overlayAppMeta.removeAttribute('data-light');
        wrap.classList.remove('is-pass-through');
        return;
      }
      if(light==='idle' && waitingHint){
        overlayAppMeta.hidden=false;
        if(overlayAppMetaRow) overlayAppMetaRow.textContent=waitingHint;
        else overlayAppMeta.textContent=waitingHint;
        if(overlayAppMetaTask){
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
        overlayAppMeta.setAttribute('title', waitingHint);
        overlayAppMeta.removeAttribute('data-light');
        wrap.classList.remove('is-pass-through');
        return;
      }
      var bits=[lightStatusLabel(light)];
      if(lastSrc) bits.push(statusSourceLabel(lastSrc));
      var agent=String(s&&(s.appAgent||s.app_agent)||'').trim();
      if(agent==='claude'||agent==='codex'){
        var agentLbl=agent==='claude'?'Claude':'Codex';
        if(bits.indexOf(agentLbl)<0 && bits.indexOf(agentLbl+' Hook')<0 && bits.indexOf(agentLbl+' App')<0){
          // Prefer source label (already agent-aware); only add agent when source is generic.
          if(lastSrc!=='codex_hook'&&lastSrc!=='claude_hook'&&lastSrc!=='codex_app'&&lastSrc!=='claude_app'){
            bits.push(agentLbl);
          }
        }
      }
      var age=formatAgeMs(ageMs);
      if(age) bits.push(age);
      if(confidence==='low') bits.push('推断');
      if(overlayAppMetaRow) overlayAppMetaRow.textContent=bits.join(' · ');
      else overlayAppMeta.textContent=bits.join(' · ');

      var taskBits=[];
      if(msg) taskBits.push(msg);
      if(waitingHint && light!=='idle') taskBits.push(waitingHint);
      var tid=shortId(taskId);
      var sid=shortId(sessionId);
      if(tid) taskBits.push('任务 '+tid);
      if(sid) taskBits.push('会话 '+sid);
      if(overlayAppMetaTask){
        if(taskBits.length){
          overlayAppMetaTask.textContent=taskBits.join(' · ');
          overlayAppMetaTask.hidden=false;
        } else {
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
      }

      var tipParts=[lightStatusLabel(light), statusSourceLabel(lastSrc)||lastSrc];
      if(age) tipParts.push(age);
      if(confidence) tipParts.push('置信度 '+confidence);
      if(msg) tipParts.push(msg);
      if(taskId) tipParts.push('任务 '+taskId);
      if(sessionId) tipParts.push('会话 '+sessionId);
      if(lastEv) tipParts.push('事件 '+lastEv);
      overlayAppMeta.title=tipParts.filter(Boolean).join(' · ');
      overlayAppMeta.hidden=false;
      overlayAppMeta.setAttribute('data-source', lastSrc||'');
      overlayAppMeta.setAttribute('data-light', light);
      overlayAppMeta.setAttribute('data-confidence', confidence||'');
      overlayAppMeta.setAttribute('data-enabled', '1');
      wrap.classList.toggle('is-pass-through', light==='needs_input' && enabled);
      if(statusChip){
        statusChip.setAttribute('data-status', light);
        statusChip.setAttribute('data-light', light);
      }
    }

    function bindKeyCaption(){
      if(!grid || grid.__capBound) return;
      grid.__capBound=true;
      grid.addEventListener('pointerover',function(e){
        var el=e.target&&e.target.closest&&e.target.closest('[data-micro-key]');
        if(!el || !grid.contains(el)) return;
        captionFromKeyEl(el);
      });
      grid.addEventListener('pointerout',function(e){
        var to=e.relatedTarget;
        if(to && grid.contains(to)) return;
        if(activePtr){
          var pressed=grid.querySelector('[data-micro-key="'+activePtr+'"]');
          if(pressed){ captionFromKeyEl(pressed); return; }
        }
        setKeyCaption('', '');
      });
      grid.addEventListener('focusin',function(e){
        var el=e.target&&e.target.closest&&e.target.closest('[data-micro-key]');
        if(el) captionFromKeyEl(el);
      });
      grid.addEventListener('focusout',function(e){
        var to=e.relatedTarget;
        if(to && grid.contains(to)) return;
        if(!activePtr) setKeyCaption('', '');
      });

    function setFootHint(text){
      if(text) toast(text);
    }

    function fire(id,phase){
      var isNav=isNavKeyId(id);
      return invoke('cmd_codex_micro_pad_fire',{microKeyId:id,phase:phase}).then(function(res){
        if(isNav) return res;
        if(!res) return res;
        var reason=String(res.reason||'');
        var slot=String(res.slotId||res.slot_id||'').trim();
        var slotHint=slot?(' · '+slot):'';
        if(reason==='hold_down'){
          holdLockId=id;
          holdSuppressCancel=true;
          holdUiReleased=false;
          setLocalStatus('listening', id);
          toast('听写中 · 松开结束'+slotHint);
        } else if(reason==='hold_up'){
          holdLockId='';
          holdSuppressCancel=false;
          holdUiReleased=false;
          setLocalStatus('done', id);
          toast('已完成'+slotHint);
        }
        else if(reason==='hold_busy'){
          setFootHint('听写进行中');
        }
        else if(reason==='numpad_mode'){
          // Trust backend snapshot — do not force local OFF while switch still paints ON.
          toastNumpadMode();
          lastGridSig='';
          pull();
        }
        else if(reason==='fired' || reason==='enhance_pulse' || reason==='healing' || reason==='numpad_pulse'){
          setLocalStatus('running', id);
          if(id==='ENC' && phase==='down') toast('召唤 Codex');
          else if(phase==='down') toast('已触发'+slotHint);
        }
        else if(!res.ok && phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
          setFootHint(REASON_HINT[reason]||DEFAULT_FOOT);
        }
        return res;
      }).catch(function(){
        if(phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
        }
        return null;
      });
    }

    function bindEnc(el){
      el.addEventListener('pointerdown',function(e){
        if(e.button!=null&&e.button!==0) return;
        e.preventDefault(); e.stopPropagation();
        el.classList.add('is-pressed','is-active');
      });
      function encUp(){ el.classList.remove('is-pressed','is-active'); }
      el.addEventListener('pointerup',encUp);
      el.addEventListener('pointerleave',encUp);
      el.addEventListener('pointercancel',encUp);
      el.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        el.classList.remove('is-pressed','is-active');
        if(padModeToggleBusy) return;
        padModeToggleBusy=true;
        // Optimistic mode paint — show 数字键/Codex before IPC returns.
        var optimistic=padMode==='codex'?'numpad':'codex';
        padMode=optimistic;
        padEnabled=optimistic==='codex';
        persistPadMode();
        applyLocalStatusDom();
        padModeSuppressEmitUntil=Date.now()+450;
        lastGridSig='';
        render(Object.assign({}, lastSnap, {
          visible:true,
          enabled:padEnabled,
          padMode:padMode,
          joyArrowsLive:!!lastSnap.joyArrowsLive
        }));
        toast(padMode==='codex'?'虚拟键盘模式':'数字键模式');
        invoke('cmd_codex_micro_overlay_toggle_pad_mode',{}).then(function(mode){
          var actual=String(mode||'')==='numpad'?'numpad':'codex';
          if(actual!==padMode){
            padMode=actual;
            padEnabled=actual==='codex';
            persistPadMode();
            lastGridSig='';
            render(Object.assign({}, lastSnap, {
              visible:true,
              enabled:padEnabled,
              padMode:padMode,
              joyArrowsLive:!!lastSnap.joyArrowsLive
            }));
          }
          if(padMode==='codex'){
            fire('ENC','down');
          }
        }).catch(function(err){
          var msg=String((err&&err.message)||err||'');
          padMode=padMode==='codex'?'numpad':'codex';
          padEnabled=padMode==='codex';
          persistPadMode();
          lastGridSig='';
          render(Object.assign({}, lastSnap, {
            visible:true,
            enabled:padEnabled,
            padMode:padMode
          }));
          if(msg.indexOf('no_mapping')>=0) toast('请先创建并启用 Codex 应用场景');
          else toast('无法切换模式');
        }).then(function(){
          setTimeout(function(){ padModeToggleBusy=false; }, 280);
        });
      });
    }

    function bindFire(){
      ensureOverlayHoldPointerUp();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        if(el.classList.contains('micro-hw__key--placeholder')) return;
        var id=el.getAttribute('data-micro-key');
        if(id==='JOY') return;
        if(id==='ENC'){ bindEnc(el); return; }
        el.addEventListener('pointerdown',function(e){
          if(e.button!=null&&e.button!==0) return;
          var numpadTap=isNumpadKeyId(id);
          if(!padEnabled && !numpadTap){
            // Still flash so user sees the key reacted, then toast.
            el.classList.add('is-pressed','is-active');
            setTimeout(function(){ el.classList.remove('is-pressed','is-active'); }, 120);
            toastNumpadMode();
            return;
          }
          // Non-hold keys: drop re-entrancy while a tap inject is in flight (rapid
          // ACT09/SEARCH storms previously wedged WebView2 after FG thrash).
          if(id!=='ACT10' && tapFireBusy){
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          activePtr=id;
          captionFromKeyEl(el);
          if(id==='ACT10'){
            holdLockId=id;
            holdSuppressCancel=true;
            holdUiReleased=false;
            setLocalStatus('listening', id);
          } else {
            tapFireBusy=true;
            setLocalStatus('running', id);
          }
          el.classList.add('is-pressed','is-active');
          el.setAttribute('data-run-status', id==='ACT10'?'listening':'running');
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
          fire(id,'down').then(function(){
            if(id==='ACT10') return;
            setTimeout(function(){ tapFireBusy=false; }, 220);
          }).catch(function(){
            if(id!=='ACT10') tapFireBusy=false;
          });
        });
        // ACT10 hold: release via window pointerup (ensureOverlayHoldPointerUp).
        // Also bind element pointerup so mic ends even if capture fails.
        el.addEventListener('pointerup',function(e){
          if(e.button!=null&&e.button!==0) return;
          if(activePtr!==id) return;
          if(id==='ACT10'){
            activePtr='';
            holdLockId='';
            holdSuppressCancel=false;
            holdUiReleased=true;
            el.classList.remove('is-pressed','is-active');
            fire(id,'up');
            return;
          }
          activePtr='';
          // Linger pressed look — instant feedback even on very short taps.
          setTimeout(function(){
            if(activePtr===id) return;
            el.classList.remove('is-pressed','is-active');
          }, 120);
          fire(id,'up');
        });
        el.addEventListener('pointercancel',function(){
          // Ignore — focus steal during chord inject must not wipe press visual.
        });
      });
    }

    function gridSignature(s,map,_active){
      // Structural identity only — ephemeral press/run/context/connection fields are
      // patched in place. Including connectionState/visible forced remount → 位移抖动.
      // keyRole must be structural: sessions heal flips AG to agentLane without always
      // changing uiIconId on a stale client cache.
      var parts=(s.cells||[]).map(function(c){
        if(!c||!c.microKeyId) return '';
        return c.microKeyId+':'+(c.bound?1:0)+':'+(c.uiIconId||'')+':'+(c.sourceKind||'')+':'+(c.keyRole||'action');
      });
      var mode=String(s.padMode||'')==='numpad'?'numpad':(s.enabled===false?'numpad':'codex');
      var navOn=s.showNavigationPad!==false && s.show_navigation_pad!==false
        && s.navKeysEnabled!==false && s.nav_keys_enabled!==false;
      var cols=Number(s.layoutColumns||s.layout_columns||0)|| (navOn?5:4);
      if(mode==='numpad') cols=4;
      var purpose=String(s.purpose||'shortcuts');
      var ag=String(s.agSurface||s.ag_surface||'');
      return [!!s.softwareEnhanceEnabled,mode,navOn?1:0,cols,purpose,ag,parts.join('|')].join(';');
    }

    function patchGridRunStates(map,active){
      if(!grid) return;
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var info=map[id]||{};
        var backendRun=String(info.runStatus||'idle');
        var src=String(info.statusSource||'inferred');
        var keyRole=String(info.keyRole||'action');
        var isNav=isNavKeyId(id);
        var isNp=isNumpadKeyId(id);
        // Session lanes / status host may lack chord binding but must stay lit.
        var bound=isNp||isNav||!!info.bound||keyRole==='agentLane';
        el.setAttribute('data-backend-run',backendRun);
        el.setAttribute('data-run-status',mergeRunStatus(id,backendRun));
        el.setAttribute('data-status-source',src);
        el.setAttribute('data-key-role',keyRole);
        el.classList.toggle('micro-hw__key--lane', keyRole==='agentLane');
        el.classList.toggle('is-bound', bound);
        el.classList.toggle('is-route-disabled', !bound && id!=='ENC');
        if(info.laneId) el.setAttribute('data-lane-id',String(info.laneId));
        else el.removeAttribute('data-lane-id');
        if(info.subagentCount) el.setAttribute('data-subagent-count',String(info.subagentCount));
        else el.removeAttribute('data-subagent-count');
        var rank=String(info.contextRank||'').trim();
        el.classList.toggle('is-context-emphasize',rank==='emphasize');
        el.classList.toggle('is-context-dim',rank==='dim');
        if(info.contextHint) el.setAttribute('data-context-hint',String(info.contextHint));
        else el.removeAttribute('data-context-hint');
        var pressed = (activePtr === id) || (!!active && active === id);
        el.classList.toggle('is-pressed',pressed);
        el.classList.toggle('is-active',pressed);
      });
    }

    function shouldDeferGridRebuild(){
      return !!holdLockId
        || !!activePtr
        || localPadStatus==='listening'
        || localPadStatus==='running'
        || localPadStatus==='done';
    }

    var lastSnap={};
    var APP_STATE_URL='http://127.0.0.1:8796/api/codex-app/state';

    function mergeAppLightIntoSnap(base, j){
      var st=j&&j.state?j.state:{};
      var out=Object.assign({}, base||{});
      out.appStateEnabled=!!(j&&j.appStateEnabled);
      out.appStatus=String(j&&j.appStatus||st.status||'').trim()||'idle';
      out.appLastEvent=String(st.lastEvent||st.event||'').trim();
      out.appLastSource=String(st.lastSource||st.source||'').trim();
      if(j&&j.softRgb&&j.softRgb.r!=null){
        out.rgb={r:j.softRgb.r,g:j.softRgb.g,b:j.softRgb.b};
      } else if(j&&j.appStateEnabled){
        // Lights on + idle/no softRgb: clear sticky vendor mint.
        out.rgb=null;
      }
      return out;
    }

    /** Bypass wedged Tauri IPC: poll Hook state over loopback HTTP for pad color. */
    function pullAppLightHttp(){
      fetch(APP_STATE_URL,{method:'GET',cache:'no-store'}).then(function(r){
        return r.ok?r.json():null;
      }).then(function(j){
        if(!j||!j.ok) return;
        lastSnap=mergeAppLightIntoSnap(lastSnap,j);
        applyPadLightGlow(lastSnap);
        applyAppMetaChip(lastSnap);
      }).catch(function(){});
    }

    function render(s){
      s=s||{};
      lastSnap=Object.assign({}, lastSnap, s);
      syncOverlayTheme();
      applyMiniAgentChips(s);
      applyMiniUsagePill(s);
      var padSkin=normalizeOverlaySkin(s.skin||s.padSkin);
      var rootEl=document.querySelector('.root');
      if(rootEl) rootEl.setAttribute('data-pad-skin', padSkin);
      wrap.setAttribute('data-pad-skin', padSkin);
      var purpose=String(s.purpose||'shortcuts').toLowerCase()==='sessions'?'sessions':'shortcuts';
      var agRaw=String(s.agSurface||'').toLowerCase();
      var agSurface=(agRaw==='mixed'||agRaw==='sessionlanes')?'mixed':'actions';
      var navSlots=Array.isArray(s.navigationSlots)?s.navigationSlots:(Array.isArray(s.navigation_slots)?s.navigation_slots:[]);
      var navOverflow=Number(s.navigationOverflow!=null?s.navigationOverflow:(s.navigation_overflow!=null?s.navigation_overflow:0))||0;
      var multiLights=!!s.multiAgentLights;
      if(rootEl){
        rootEl.setAttribute('data-purpose', purpose);
        rootEl.setAttribute('data-ag-surface', agSurface);
        rootEl.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
        rootEl.setAttribute('data-navigation-slots', navSlots.join(','));
        rootEl.setAttribute('data-navigation-overflow', String(navOverflow));
        if(s.appliedAgent) rootEl.setAttribute('data-applied-agent', String(s.appliedAgent));
      }
      wrap.setAttribute('data-purpose', purpose);
      wrap.setAttribute('data-ag-surface', agSurface);
      wrap.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
      wrap.setAttribute('data-navigation-slots', navSlots.join(','));
      wrap.setAttribute('data-navigation-overflow', String(navOverflow));
      applyNavCta(s);
      applyLightGate(s);
      var hw=wrap.querySelector('.micro-hw');
      if(hw){
        hw.setAttribute('data-pad-skin', padSkin);
        hw.setAttribute('data-purpose', purpose);
        hw.setAttribute('data-ag-surface', agSurface);
        hw.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
        hw.setAttribute('data-navigation-slots', navSlots.join(','));
        hw.setAttribute('data-navigation-overflow', String(navOverflow));
      }
      wrap.classList.toggle('is-visible',!!s.visible);
      // Always sync mode — previously returned early while hidden, so first show
      // still showed default Codex even when last mode was 数字键.
      if(s.enabled!=null || s.padMode!=null){
        if(s.enabled!=null) padEnabled=!!s.enabled;
        padMode=String(s.padMode||'')==='numpad'?'numpad':(padEnabled?'codex':'numpad');
        persistPadMode();
      }
      if(!s.visible){
        holdLockId='';
        applyAppMetaChip(s);
        applyLocalStatusDom();
        // Prefetch grid while hidden so show only toggles visibility.
        if(grid && !grid.children.length){
          var prefetch=Object.assign({}, s, { visible:true, _prefetch:1 });
          // Fall through by forcing a one-shot paint without is-visible.
          s=prefetch;
          wrap.classList.toggle('is-visible', false);
        } else {
          return;
        }
      }
      if(!s._prefetch){
        padEnabled=!!s.enabled;
        padMode=String(s.padMode||'')==='numpad'?'numpad':(padEnabled?'codex':'numpad');
        persistPadMode();
      }
      joyArrowsLive=!!s.joyArrowsLive && padMode==='codex';
      joyContextHint=String(s.joyContextHint||s.joy_context_hint||'').trim();
      requireNumLockOff=!!s.requireNumLockOff;
      numLockBlocking=!!s.numLockBlocking;
      navKeysEnabled=s.showNavigationPad!==false && s.show_navigation_pad!==false
        && s.navKeysEnabled!==false && s.nav_keys_enabled!==false;
      layoutColumns=Number(s.layoutColumns||s.layout_columns||0)||(navKeysEnabled?5:4);
      if(padMode==='numpad') layoutColumns=4;
      enhanceOn=!!s.softwareEnhanceEnabled;
      localMinimized=!!s.minimized;
      wrap.classList.toggle('is-no-nav', padMode==='codex' && !navKeysEnabled);
      var hwGrid=wrap.querySelector('.micro-hw__grid');
      if(hwGrid){
        hwGrid.classList.toggle('micro-hw__grid--no-nav', padMode==='codex' && !navKeysEnabled);
        hwGrid.classList.toggle('micro-hw__grid--numpad', padMode==='numpad');
      }
      applyPadLightGlow(s);
      applyAppMetaChip(s);
      var map=cellMap(s.cells);
      var active=String(s.activeMicroKeyId||'');
      backendPadStatus=String(s.padStatus||'idle');
      var snapMicro=String(s.statusMicroKeyId||'');
      if(backendPadStatus==='listening' || backendPadStatus==='running' || backendPadStatus==='done' || backendPadStatus==='failed'){
        if(localPadStatus!==backendPadStatus || localStatusMicro!==snapMicro){
          if(backendPadStatus==='listening'){
            clearLocalTimer();
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
            if(snapMicro) holdLockId=snapMicro;
          } else if(!localStatusTimer) {
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
          }
        }
      } else if((backendPadStatus==='done' || backendPadStatus==='idle') && snapMicro==='ACT10'){
        activePtr='';
        holdLockId='';
        holdSuppressCancel=false;
        holdUiReleased=false;
        releaseKeyVisual('ACT10');
        if(!localStatusTimer){
          localPadStatus=backendPadStatus;
          localStatusMicro=backendPadStatus==='idle' ? '' : snapMicro;
        }
      } else if(backendPadStatus==='idle' && !localStatusTimer && localPadStatus!=='listening' && localPadStatus!=='running' && !activePtr){
        localPadStatus='idle';
        localStatusMicro='';
        if(!holdSuppressCancel) holdLockId='';
      }
      var sig=gridSignature(s,map,active);
      if(shouldDeferGridRebuild()){
        (s.cells||[]).forEach(function(c){ if(c&&c.microKeyId) boundKeys[c.microKeyId]=!!c.bound; });
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      if(sig===lastGridSig){
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      lastGridSig=sig;
      boundKeys={};
      grid.innerHTML=activeLayout().map(function(cell){
        var info=map[cell.id]||{};
        var isNav=isNavKeyId(cell.id);
        var bound=!!info.bound;
        var isNp=cell.kind==='numpad';
        if(isNp || isNav) bound=true;
        boundKeys[cell.id]=bound;
        var iconId=info.uiIconId||cell.icon||'empty';
        var keyRole=String(info.keyRole||'action');
        var kind=String(info.sourceKind||'none');
        var backendRun=String(info.runStatus||'idle');
        var runSt=mergeRunStatus(cell.id, backendRun);
        var statusSrc=String(info.statusSource||'inferred');
        // agentLane has no chord — still show lamp (do not grey via is-route-disabled).
        if(keyRole==='agentLane') bound=true;
        var cls='micro-hw__key micro-hw__key--'+cell.kind + sourceClass(kind, cell.id);
        if(keyRole==='agentLane') cls+=' micro-hw__key--lane';
        if(cell.span===2) cls+=' micro-hw__key--span2';
        if(cell.rowSpan===2) cls+=' micro-hw__key--rowspan2';
        if(isNp || isNav || bound) cls+=' is-bound';
        else if(cell.id!=='ENC') cls+=' is-route-disabled';
        if(cell.id==='ENC'){
          cls+= padEnabled ? ' is-mode-on' : ' is-mode-off';
        }
        if(isNav && joyArrowsLive) cls+=' is-nav-live';
        if((active&&active===cell.id)||(activePtr&&activePtr===cell.id)) cls+=' is-pressed is-active';
        var ctxRank=String(info.contextRank||'').trim();
        if(ctxRank==='emphasize') cls+=' is-context-emphasize';
        else if(ctxRank==='dim') cls+=' is-context-dim';
        var ctxHint=String(info.contextHint||'').trim();
        var agAttr=cell.ag!=null ? ' data-ag="'+cell.ag+'"' : '';
        var style='grid-row:'+cell.row+(cell.rowSpan?' / span '+cell.rowSpan:'')
          +';grid-column:'+cell.col+(cell.span?' / span '+cell.span:'')+';';
        var tag=cell.kind==='placeholder'?'div':'button';
        var type=tag==='button'?' type="button"':'';
        var inner;
        if(cell.id==='ENC'){
          inner=encInnerHtml(padEnabled, iconId);
        } else if(isNp){
          inner='<span class="micro-hw__digit" aria-hidden="true">'+escHtml(cell.label||'')+'</span>';
        } else if(isNav){
          inner='<span class="micro-hw__icon">'+navIconHtml(cell.id, iconId)+'</span>';
        } else {
          inner='<span class="micro-hw__icon">'+(ICON[iconId]||ICON.empty)+'</span>';
        }
        var metaName='';
        var metaChord='';
        if(cell.id==='ENC'){
          metaName=padEnabled?'虚拟键盘模式':'数字键模式';
          metaChord=padEnabled?'ON':'OFF';
        } else if(isNp){
          metaName=String(cell.label||cell.id||'');
        } else if(isNav){
          metaName=({NAV_UP:'上',NAV_DOWN:'下',NAV_LEFT:'左',NAV_RIGHT:'右'})[cell.id]||cell.id;
          metaChord=joyArrowsLive?'方向键已接入':'';
        } else if(keyRole==='agentLane'){
          metaName=String(info.label||'').trim()||cell.id;
          metaChord=String(info.sub||'').trim()||'会话槽 · 灯=状态';
        } else {
          metaName=String(info.label||'').trim();
          metaChord=String(info.sub||'').trim();
        }
        var npAriaMap={'/':'除','*':'乘','-':'减','+':'加','.':'小数点','↵':'回车'};
        var aria=cell.id==='ENC'
          ? metaName
          : (isNav
            ? metaName
            : (isNp ? (npAriaMap[cell.label]||String(cell.label||cell.id)) : ([metaName, metaChord].filter(Boolean).join(' · ') || cell.id)));
        if(cell.ag!=null && statusSrc){
          aria+=(aria?' · ':'')+statusSourceLabel(statusSrc);
        }
        var actTitle='';
        if(isNav){
          if(joyContextHint) actTitle=joyContextHint;
          else if(joyArrowsLive) actTitle='主键盘方向键已接入';
        } else if(keyRole==='agentLane'){
          actTitle='会话槽：查看状态、聚焦终端或恢复线程；不保证打开 App 内侧栏对话';
        } else if(cell.id.indexOf('ACT')===0){
          if(ctxHint) actTitle=ctxHint;
          else if(cell.id==='ACT10') actTitle='按住说话';
        }
        var encAttrs=cell.id==='ENC'
          ? ' data-act="pad-mode" role="switch" aria-checked="'+(padEnabled?'true':'false')+'"'
          : '';
        return '<'+tag+type+encAttrs+' class="'+cls+'" data-micro-key="'+cell.id+'"'+agAttr
          +' data-key-role="'+escHtml(keyRole)+'"'
          +(info.laneId?' data-lane-id="'+escHtml(String(info.laneId))+'"':'')
          +(info.subagentCount?' data-subagent-count="'+escHtml(String(info.subagentCount))+'"':'')
          +' data-run-status="'+runSt+'" data-backend-run="'+backendRun+'" data-status-source="'+escHtml(statusSrc)+'" data-source-kind="'+kind+'"'
          +(ctxHint?' data-context-hint="'+escHtml(ctxHint)+'"':'')
          +(metaName?' data-cap-name="'+escHtml(metaName)+'"':'')
          +(metaChord?' data-cap-chord="'+escHtml(metaChord)+'"':'')
          +' style="'+style+'"'
          +' aria-label="'+escHtml(aria)+'"'
          +(cell.id==='ENC'?' title="'+escHtml(aria)+'"':(actTitle?' title="'+escHtml(actTitle)+'"':''))
          +(isNp?' title="'+escHtml(aria)+'"':'')
          +'>'+inner+'</'+tag+'>';
      }).join('');
      applyLocalStatusDom();
      bindFire();
      bindKeyCaption();
      setKeyCaption('', '');
    }

    function dismiss(){
      invoke('cmd_codex_micro_overlay_dismiss',{}).catch(function(){});
    }

    function isDragBlocked(target){
      return !!(target && target.closest && target.closest('[data-micro-key],[data-act],button,a,input,select,textarea'));
    }

    wrap.addEventListener('pointerdown',function(e){
      if(e.button!=null&&e.button!==0) return;
      if(isDragBlocked(e.target)) return;
      dragging=true;
      invoke('cmd_codex_micro_overlay_start_drag',{}).catch(function(){});
    });
    window.addEventListener('pointerup',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });
    window.addEventListener('pointercancel',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });

    document.querySelectorAll('[data-act="close"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        dismiss();
      });
    });

    document.querySelectorAll('[data-act="minimize"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:true}).catch(function(){});
      });
    });

    document.querySelectorAll('[data-act="expand"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:false}).catch(function(){});
      });
    });

    if(overlayNavCta){
      overlayNavCta.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        enableNavFromOverlay();
      });
    }

    function setUsageFocusFromUi(kind){
      kind=String(kind||'').trim();
      if(kind!=='codex'&&kind!=='claude'&&kind!=='cursor') return;
      persistUsageFocus(kind, true);
      var s=lastSnap||{};
      applyMiniAgentChips(s);
      applyMiniUsagePill(s);
      invoke('cmd_soft_pad_focus_agent',{kind:kind}).catch(function(){});
    }

    function bindAgentFocusClicks(root){
      if(!root||root.__agentFocusBound) return;
      root.__agentFocusBound=true;
      root.querySelectorAll('[data-agent]').forEach(function(el){
        el.setAttribute('tabindex','0');
        if(el.tagName!=='BUTTON') el.setAttribute('role','button');
        el.addEventListener('click',function(e){
          e.preventDefault();
          e.stopPropagation();
          setUsageFocusFromUi(el.getAttribute('data-agent'));
        });
        el.addEventListener('keydown',function(e){
          if(e.key==='Enter'||e.key===' '){
            e.preventDefault();
            setUsageFocusFromUi(el.getAttribute('data-agent'));
          }
        });
      });
    }
    bindAgentFocusClicks(miniAgents);
    bindAgentFocusClicks(padAgentBar);

    function bootstrapOverlayState(){
      // Seed chrome from last known mode immediately (before IPC).
      applyLocalStatusDom();
      pull();
      pullAppLightHttp();
    }
    if(listen){
      listen('codex_micro_overlay_state',function(ev){
        var s=ev&&ev.payload;
        if(!s) return;
        // After local pad-mode toggle, skip a redundant full grid rebuild from push_state.
        if(Date.now()<padModeSuppressEmitUntil){
          var incomingMode=String(s.padMode||'')==='numpad'?'numpad':(s.enabled===false?'numpad':'codex');
          if(incomingMode===padMode){
            lastSnap=Object.assign({}, lastSnap, s);
            padEnabled=!!s.enabled;
            joyArrowsLive=!!s.joyArrowsLive && padMode==='codex';
            joyContextHint=String(s.joyContextHint||s.joy_context_hint||'').trim();
            applyPadLightGlow(lastSnap);
            applyAppMetaChip(lastSnap);
            applyMiniAgentChips(lastSnap);
            applyLocalStatusDom();
            return;
          }
        }
        render(s);
      }).then(function(){
        bootstrapOverlayState();
      }).catch(function(){
        bootstrapOverlayState();
      });
    } else {
      bootstrapOverlayState();
    }
    function pull(){
      if(holdLockId||localPadStatus==='listening') return;
      invoke('cmd_codex_micro_overlay_get_state',{}).then(function(s){ render(s); }).catch(function(){});
    }
    setInterval(pull, 1500);
    setInterval(pullAppLightHttp, 500);
  </script>
</body>
</html>
