<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Micro</title>
  <link rel="stylesheet" href="css/codex-micro-overlay.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <script src="js/core/motion.js"></script>
  <script src="js/core/agent-status-edge.js"></script>
  <script src="js/features/agent/usage-format.js"></script>
  <script src="js/features/agent/soft-pad-agent-bar-rank.js"></script>
</head>
<body>
  <div class="root">
    <div class="wrap" id="wrap">
      <div class="overlay-mini" id="overlayMini">
        <div class="overlay-mini__agents" id="miniAgents" role="list" aria-label="Agent 状态">
          <span class="overlay-mini__agent" role="listitem" data-agent="codex" data-status="idle" aria-label="Codex：空闲">
            <img src="icons/app-target/codex.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="claude" data-status="idle" aria-label="Claude：空闲">
            <img src="icons/app-target/claude.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="cursor" data-status="idle" aria-label="Cursor：空闲">
            <img src="icons/app-target/cursor.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="copilotCli" data-status="idle" data-placeholder="1" aria-label="Copilot：占位" hidden>
            <img src="icons/app-target/copilot.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="gemini" data-status="idle" data-placeholder="1" aria-label="Gemini：占位" hidden>
            <img src="icons/app-target/gemini.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="minimax" data-status="idle" aria-label="MiniMax：空闲" hidden>
            <img src="icons/app-target/minimaxcode.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="workbuddy" data-status="idle" aria-label="WorkBuddy：空闲" hidden>
            <img src="icons/app-target/workbuddy.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="trae" data-status="idle" aria-label="Trae：空闲" hidden>
            <img src="icons/app-target/trae.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="qoder" data-status="idle" aria-label="Qoder：空闲" hidden>
            <img src="icons/app-target/qoder.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="cline" data-status="idle" data-placeholder="1" aria-label="Cline：占位" hidden>
            <img src="icons/app-target/cline.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="opencode" data-status="idle" data-placeholder="1" aria-label="OpenCode：占位" hidden>
            <img src="icons/app-target/opencode.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <span class="overlay-mini__agent" role="listitem" data-agent="aider" data-status="idle" data-placeholder="1" aria-label="Aider：占位" hidden>
            <img src="icons/app-target/aider.png" alt="" aria-hidden="true">
            <i class="overlay-mini__agent-dot" aria-hidden="true"></i>
          </span>
          <button type="button" class="overlay-mini__more" id="miniAgentMore" data-act="agent-more-mini" hidden title="展开查看更多 Agent" aria-label="更多 Agent">+0</button>
        </div>
        <span class="overlay-mini__usage-cluster">
          <span class="overlay-mini__usage" id="miniUsagePill" hidden aria-live="polite"></span>
          <span class="overlay-mini__fresh" id="miniUsageFresh" hidden aria-hidden="true">●</span>
          <div class="overlay-mini__quota-dd" id="miniQuotaDropdown" hidden role="menu" aria-label="Provider 用量"></div>
        </span>
        <button type="button" class="overlay-mini__btn overlay-mini__btn--expand" data-act="expand" title="展开 Soft Pad" aria-label="展开 Soft Pad">
          <svg class="overlay-mini__expand-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
              d="M2 4.5V2h2.5M8.5 2H11v2.5M11 8.5V11H8.5M4.5 11H2V8.5"/>
          </svg>
        </button>
        <button type="button" class="overlay-mini__btn" data-act="close" title="关闭" aria-label="关闭">×</button>
      </div>

      <div class="overlay-full" id="overlayFull">
        <header class="overlay-chrome">
          <button type="button" class="overlay-chrome__btn" data-act="minimize" title="最小化" aria-label="最小化">—</button>
          <button type="button" class="overlay-chrome__btn overlay-chrome__btn--close" data-act="close" title="关闭" aria-label="关闭">×</button>
        </header>
        <div class="overlay-body" id="overlayBody">
          <div class="overlay-pad-stack">
            <div class="micro-hw micro-hw--sm">
              <span class="micro-hw__aura" aria-hidden="true"></span>
              <div class="micro-hw__face">
                <div class="soft-pad-agent-bar" id="padAgentBar" role="toolbar" aria-label="Agent">
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="codex" data-status="idle" aria-pressed="false" aria-label="Codex" title="Codex">
                    <img src="icons/app-target/codex.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="claude" data-status="idle" aria-pressed="false" aria-label="Claude" title="Claude">
                    <img src="icons/app-target/claude.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="cursor" data-status="idle" aria-pressed="false" aria-label="Cursor" title="Cursor">
                    <img src="icons/app-target/cursor.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="copilotCli" data-status="idle" data-placeholder="1" aria-pressed="false" aria-label="Copilot" title="Copilot" hidden>
                    <img src="icons/app-target/copilot.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="gemini" data-status="idle" data-placeholder="1" aria-pressed="false" aria-label="Gemini" title="Gemini" hidden>
                    <img src="icons/app-target/gemini.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="minimax" data-status="idle" aria-pressed="false" aria-label="MiniMax" title="MiniMax" hidden>
                    <img src="icons/app-target/minimaxcode.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="workbuddy" data-status="idle" aria-pressed="false" aria-label="WorkBuddy" title="WorkBuddy" hidden>
                    <img src="icons/app-target/workbuddy.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="trae" data-status="idle" aria-pressed="false" aria-label="Trae" title="Trae" hidden>
                    <img src="icons/app-target/trae.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="qoder" data-status="idle" aria-pressed="false" aria-label="Qoder" title="Qoder" hidden>
                    <img src="icons/app-target/qoder.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="cline" data-status="idle" data-placeholder="1" aria-pressed="false" aria-label="Cline" title="Cline" hidden>
                    <img src="icons/app-target/cline.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="opencode" data-status="idle" data-placeholder="1" aria-pressed="false" aria-label="OpenCode" title="OpenCode" hidden>
                    <img src="icons/app-target/opencode.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__chip" data-agent="aider" data-status="idle" data-placeholder="1" aria-pressed="false" aria-label="Aider" title="Aider（仅完成）" hidden>
                    <img src="icons/app-target/aider.png" alt="" aria-hidden="true">
                    <i class="soft-pad-agent-bar__dot" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="soft-pad-agent-bar__more" id="padAgentBarMore" data-act="agent-more" hidden aria-expanded="false" title="更多 Agent" aria-label="更多 Agent">+0</button>
                  <div class="soft-pad-agent-bar__overflow" id="padAgentBarOverflow" hidden aria-hidden="true"></div>
                </div>
                <div class="micro-hw__grid" id="grid"></div>
                <div class="status-chip" id="statusChip" data-status="idle" aria-hidden="true"></div>
              </div>
            </div>
            <button type="button" class="overlay-key-caption is-clickable" id="overlayKeyCaption" aria-live="polite" data-act="usage-caption">
              <span class="overlay-key-caption__name" data-cap-name>悬停按键查看名称</span>
              <span class="overlay-key-caption__chord" data-cap-chord></span>
            </button>
            <div class="overlay-minimax-key" id="overlayMinimaxKey" hidden>
              <p class="overlay-minimax-key__hint">粘贴 MiniMax Coding Plan API Key（不是登录 JWT）</p>
              <input id="overlayMinimaxKeyInput" class="overlay-minimax-key__input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
              <div class="overlay-minimax-key__actions">
                <button type="button" class="overlay-minimax-key__btn is-primary" data-act="mm-key-save">保存并加载 5h</button>
                <button type="button" class="overlay-minimax-key__btn" data-act="mm-key-console">套餐详情</button>
                <button type="button" class="overlay-minimax-key__btn" data-act="mm-key-cancel">取消</button>
              </div>
              <p class="overlay-minimax-key__status" data-mm-key-status aria-live="polite"></p>
            </div>
            <button type="button" class="overlay-nav-cta" id="overlayNavCta" hidden>
              <span class="overlay-nav-cta__label" data-nav-cta-label>AG 当前为动作键</span>
              <span class="overlay-nav-cta__action" data-nav-cta-action>启用 4 个会话导航灯</span>
            </button>
            <div class="overlay-app-meta" id="overlayAppMeta" hidden aria-live="polite">
              <div class="overlay-app-meta__row" id="overlayAppMetaRow"></div>
              <div class="overlay-app-meta__task" id="overlayAppMetaTask" hidden></div>
            </div>
            <details class="overlay-light-gate" id="overlayLightGate" hidden>
              <summary class="overlay-light-gate__sum">
                <span data-gate-sum>灯路诊断</span>
                <span class="overlay-light-gate__fail" data-gate-fail hidden></span>
              </summary>
              <ol class="overlay-light-gate__list" id="overlayLightGateList"></ol>
              <p class="overlay-light-gate__hint" data-gate-hint></p>
            </details>
          </div>
        </div>
        <div class="overlay-toast" id="overlayToast" aria-live="polite"></div>
      </div>
      <!-- Tip lives on .wrap (not .overlay-full) so mini mode can show it; full tip also escapes display:none. -->
      <div class="overlay-agent-tip" id="overlayAgentTip" hidden aria-hidden="true">
        <div class="overlay-agent-tip__status" data-tip-status></div>
        <div class="overlay-agent-tip__model" data-tip-model hidden></div>
        <div class="overlay-agent-tip__intensity" data-tip-intensity hidden></div>
        <div class="overlay-agent-tip__foot" data-tip-foot></div>
      </div>
    </div>
  </div>
  <script>
    var invoke=window.__TAURI_INTERNALS__?function(cmd,args){return window.__TAURI_INTERNALS__.invoke(cmd,args);}:function(){return Promise.resolve();};
    var listen=window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen
      ?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__)
      :null;

    var LAYOUT=[
      {id:'ENC',kind:'control',row:1,col:2,icon:'power'},
      {id:'ACT06',kind:'command',row:1,col:3,icon:'fast'},
      {id:'ACT07',kind:'command',row:1,col:4,icon:'palette'},
      {id:'ACT08',kind:'command',row:1,col:5,icon:'reject'},
      {id:'NAV_UP',kind:'nav',row:2,col:1,icon:'navUp'},
      {id:'AG00',kind:'agent',row:2,col:2,ag:0,icon:'agent'},
      {id:'AG01',kind:'agent',row:2,col:3,ag:1,icon:'claude'},
      {id:'AG02',kind:'agent',row:2,col:4,ag:2,icon:'model'},
      {id:'PLUS',kind:'command',row:2,col:5,rowSpan:2,icon:'plus'},
      {id:'NAV_LEFT',kind:'nav',row:3,col:1,icon:'navLeft'},
      {id:'AG03',kind:'agent',row:3,col:2,ag:3,icon:'folder'},
      {id:'AG04',kind:'agent',row:3,col:3,ag:4,icon:'status'},
      {id:'AG05',kind:'agent',row:3,col:4,ag:5,icon:'cloud'},
      {id:'NAV_DOWN',kind:'nav',row:4,col:1,icon:'navDown'},
      {id:'ACT09',kind:'command',row:4,col:2,icon:'fork'},
      {id:'UNDO',kind:'command',row:4,col:3,icon:'undo'},
      {id:'SEARCH',kind:'command',row:4,col:4,icon:'search'},
      {id:'ACT12',kind:'command',row:4,col:5,rowSpan:2,icon:'send'},
      {id:'NAV_RIGHT',kind:'nav',row:5,col:1,icon:'navRight'},
      {id:'ACT10',kind:'command',row:5,col:2,span:2,icon:'mic'},
      {id:'DOT',kind:'command',row:5,col:4,icon:'dot'}
    ];

    /** Soft Pad without left NAV column (navKeysEnabled=false). */
    var LAYOUT_NO_NAV=[
      {id:'ENC',kind:'control',row:1,col:1,icon:'power'},
      {id:'ACT06',kind:'command',row:1,col:2,icon:'fast'},
      {id:'ACT07',kind:'command',row:1,col:3,icon:'palette'},
      {id:'ACT08',kind:'command',row:1,col:4,icon:'reject'},
      {id:'AG00',kind:'agent',row:2,col:1,ag:0,icon:'agent'},
      {id:'AG01',kind:'agent',row:2,col:2,ag:1,icon:'claude'},
      {id:'AG02',kind:'agent',row:2,col:3,ag:2,icon:'model'},
      {id:'PLUS',kind:'command',row:2,col:4,rowSpan:2,icon:'plus'},
      {id:'AG03',kind:'agent',row:3,col:1,ag:3,icon:'folder'},
      {id:'AG04',kind:'agent',row:3,col:2,ag:4,icon:'status'},
      {id:'AG05',kind:'agent',row:3,col:3,ag:5,icon:'cloud'},
      {id:'ACT09',kind:'command',row:4,col:1,icon:'fork'},
      {id:'UNDO',kind:'command',row:4,col:2,icon:'undo'},
      {id:'SEARCH',kind:'command',row:4,col:3,icon:'search'},
      {id:'ACT12',kind:'command',row:4,col:4,rowSpan:2,icon:'send'},
      {id:'ACT10',kind:'command',row:5,col:1,span:2,icon:'mic'},
      {id:'DOT',kind:'command',row:5,col:3,icon:'dot'}
    ];

    /** PC numpad layout (ENC replaces NumLock): / * - · 789+ · 456 · 123 Enter · 0 . */
    var LAYOUT_NUMPAD=[
      {id:'ENC',kind:'control',row:1,col:1,icon:'codex'},
      {id:'NP_DIV',kind:'numpad',row:1,col:2,label:'/'},
      {id:'NP_MUL',kind:'numpad',row:1,col:3,label:'*'},
      {id:'NP_SUB',kind:'numpad',row:1,col:4,label:'-'},
      {id:'NP7',kind:'numpad',row:2,col:1,label:'7'},
      {id:'NP8',kind:'numpad',row:2,col:2,label:'8'},
      {id:'NP9',kind:'numpad',row:2,col:3,label:'9'},
      {id:'NP_ADD',kind:'numpad',row:2,col:4,rowSpan:2,label:'+'},
      {id:'NP4',kind:'numpad',row:3,col:1,label:'4'},
      {id:'NP5',kind:'numpad',row:3,col:2,label:'5'},
      {id:'NP6',kind:'numpad',row:3,col:3,label:'6'},
      {id:'NP1',kind:'numpad',row:4,col:1,label:'1'},
      {id:'NP2',kind:'numpad',row:4,col:2,label:'2'},
      {id:'NP3',kind:'numpad',row:4,col:3,label:'3'},
      {id:'NP_ENTER',kind:'numpad',row:4,col:4,rowSpan:2,label:'↵'},
      {id:'NP0',kind:'numpad',row:5,col:1,span:2,label:'0'},
      {id:'NP_DOT',kind:'numpad',row:5,col:3,label:'.'}
    ];

    var navKeysEnabled=true;
    var layoutColumns=5;

    function activeLayout(){
      if(padMode==='numpad') return LAYOUT_NUMPAD;
      return navKeysEnabled ? LAYOUT : LAYOUT_NO_NAV;
    }

    function isNumpadKeyId(id){
      return /^NP/.test(String(id||''));
    }

    var ICON={
      fast:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 10-14h-7l0-6z"/></svg>',
      reject:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
      fork:'<svg viewBox="0 0 24 24"><path d="M7 4v8a4 4 0 004 4h2a4 4 0 004-4V4"/><path d="M17 4l3 3-3 3M7 4L4 7l3 3"/></svg>',
      mic:'<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
      send:'<svg viewBox="0 0 24 24"><path d="M4 12h12"/><path d="M12 6l6 6-6 6"/><path d="M20 7v10"/></svg>',
      codex:'<svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z"/></svg>',
      palette:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>',
      status:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
      plan:'<svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',
      review:'<svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
      folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
      cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-8 5.5 5.5 0 00-10.7 1.5A3.5 3.5 0 007 18z"/></svg>',
      agent:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/></svg>',
      lane:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8" fill="none" stroke-dasharray="2 3"/></svg>',
      claude:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.2L21 12l-6.8 2.8L12 21l-2.2-6.2L3 12l6.8-2.8z"/></svg>',
      model:'<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M8 7V5h8v2M8 17v2h8v-2"/><path d="M9 11h6M9 14h4"/></svg>',
      undo:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a5 5 0 010 10h-1"/></svg>',
      search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>',
      empty:'<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" stroke-dasharray="3 3"/></svg>',
      plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      dot:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>',
      power:'<svg viewBox="0 0 24 24"><path d="M12 2v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>',
      navUp:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>',
      navDown:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>',
      navLeft:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>',
      navRight:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8v-5H4V8h8V3z"/></svg>'
    };

    var STATUS_LABEL={idle:'',running:'执行中',listening:'听写中',done:'完成',failed:'失败'};
    var REASON_HINT={
      not_foreground:'请切换到 Codex 桌面版窗口',
      unbound:'此键未启用或未绑定快捷键',
      no_profile:'Codex 应用场景未配置',
      hold_failed:'无法启动听写（请确认 Codex 已打开）',

    function applyLightGate(s){
      if(!overlayLightGate||!overlayLightGateList) return;
      var gates=Array.isArray(s&&s.agLightGates)?s.agLightGates
        :(Array.isArray(s&&s.ag_light_gates)?s.ag_light_gates:[]);
      var claudeLive=String(s&&(s.appAgent||s.app_agent)||'').toLowerCase()==='claude'
        || String(s&&(s.appLastSource||s.app_last_source)||'').toLowerCase().indexOf('claude')>=0;
      var applied=String(s&&(s.appliedAgent||s.applied_agent)||'').toLowerCase();
      var ctaVisible=overlayNavCta&&!overlayNavCta.hidden;
      // Match Rust: Claude checklist only when Claude is live / Applied / CTA onboarding.
      if(!gates.length&&!claudeLive&&applied!=='claude'&&!ctaVisible){
        overlayLightGate.hidden=true;
        return;
      }
      // Fallback when older binary has no agLightGates — derive from snapshot.
      if(!gates.length){
        var purpose=String(s&&s.purpose||'shortcuts').toLowerCase();
        var navSlots=Array.isArray(s&&s.navigationSlots)?s.navigationSlots
          :(Array.isArray(s&&s.navigation_slots)?s.navigation_slots:[]);
        var cells=Array.isArray(s&&s.cells)?s.cells:[];
        var laneCells=cells.filter(function(c){ return String(c.laneId||c.lane_id||'').trim(); });
        var status=String(s&&(s.appStatus||s.app_status)||'').trim();
        var hookOk=claudeLive&&!!status&&status!=='idle';
        gates=[
          {id:'hook',ok:hookOk,label:'Claude Hook 有状态',detail:hookOk?(status||'—'):(claudeLive?'空闲':'未收到 Claude Hook（当前主状态可能来自其他 Agent）')},
          {id:'applied',ok:applied==='claude',label:'Applied Soft Pad = Claude',detail:applied?('当前 Applied='+applied):'无 Applied'},
          {id:'purpose',ok:purpose==='sessions',label:'purpose = sessions',detail:'purpose='+purpose},
          {id:'nav_slots',ok:navSlots.length>0,label:'导航槽 AG00–03',detail:navSlots.length?navSlots.join(','):'[]'},
          {id:'projected',ok:laneCells.length>0,label:'AG 格子已投影会话',detail:laneCells.length?laneCells.map(function(c){return c.microKeyId||c.micro_key_id;}).join(','):'无'}
        ];
      }
      var fail=gates.filter(function(g){ return !g.ok; });
      var bottleneck=pickLightGateFail(fail, s);
      var sum=overlayLightGate.querySelector('[data-gate-sum]');
      var failEl=overlayLightGate.querySelector('[data-gate-fail]');
      var hint=overlayLightGate.querySelector('[data-gate-hint]');
      overlayLightGate.hidden=false;
      if(fail.length){
        // Keep collapsed by default — forcing open used to clip the Soft Pad in the fixed window.
        var step=bottleneck?gates.findIndex(function(g){return g&&g.id===bottleneck.id;}):gates.findIndex(function(g){return !g.ok;});
        if(sum) sum.textContent='灯路诊断 · 堵塞在第 '+(step>=0?step+1:1)+' 步';

        if(hint) hint.textContent='AG 会话灯 / 状态单灯应可亮；若仍暗，重启浮窗后再看';

          setTimeout(function(){

            releaseKeyVisual(id);
            applyLocalStatusDom();

        }
        applyLocalStatusDom();
        fire(id,'up');

      window.addEventListener('mouseup',endOverlayPtr,true);

    function compactNumber(value){
      var n=Number(value);
      if(!Number.isFinite(n)||n<0) return '';
      if(n>=1000000) return (n/1000000).toFixed(n>=10000000?0:1).replace(/\.0$/,'')+'M';
      if(n>=1000) return (n/1000).toFixed(n>=100000?0:1).replace(/\.0$/,'')+'k';
      return String(Math.round(n));

        healthRows.forEach(function(h){

      if(!ts) return '';
      var age=Date.now()-ts;
      if(age<60_000) return '刚刚';
      if(age<3600_000) return Math.floor(age/60_000)+'分钟前';
      return Math.floor(age/3600_000)+'小时前';

    /** Claude OTel session/$ — auxiliary burn only (never remaining %). */
    function claudeOtelBits(usage,detail){
      usage=usage||{};
      var bits=[];
      var sess=usageValue(usage,'sessionTokens','session_tokens');
      var aux=usageValue(usage,'auxiliaryTokens','auxiliary_tokens');
      var cost=usageValue(usage,'estimatedCostUsd','estimated_cost_usd');
      if(sess!=null) bits.push((detail?'本会话消耗 ':'本会话 ')+compactNumber(sess));
      if(detail&&aux!=null) bits.push('子任务 '+compactNumber(aux));
      if(cost!=null){
        var c=Number(cost);
        bits.push((detail?'估算 ':'')+'$'+(isFinite(c)?(Math.round(c*1e4)/1e4):cost));
      }
      return bits;
    }

    function formatActiveDuration(ms){
      var totalMin=Math.max(0,Math.round(Number(ms)/60000));
      var h=Math.floor(totalMin/60);
      var m=totalMin%60;
      if(h>0) return h+'h '+m+'m';
      return m+'m';
    }

    function cursorActivityIntensityBits(usage){
      usage=usage||{};
      var turns=usageValue(usage,'localTodayRequests','local_today_requests');
      if(turns==null) return [];
      var n=Math.round(Number(turns));
      var bits=['今日 '+n+' 次对话'];
      var sess=usageValue(usage,'localTodaySessions','local_today_sessions');
      var activeMs=usageValue(usage,'localTodayActiveMs','local_today_active_ms');
      var yest=usageValue(usage,'localYesterdayRequests','local_yesterday_requests');
      if(sess!=null) bits.push(Math.round(Number(sess))+' 个会话');
      if(activeMs!=null&&Number(activeMs)>0) bits.push('活跃 '+formatActiveDuration(Number(activeMs)));
      if(yest!=null&&Number(yest)>0){
        var delta=Math.round(((Number(turns)-Number(yest))/Number(yest))*100);
        var arrow=delta>0?'↑':(delta<0?'↓':'');
        bits.push('较昨日对话 '+arrow+Math.abs(delta)+'%');
      }
      return bits;
    }

    function cursorActivityBits(usage,detail){
      usage=usage||{};
      var turns=usageValue(usage,'localTodayRequests','local_today_requests');
      if(turns==null) return [];
      var n=Math.round(Number(turns));
      if(!detail) return ['今日 '+n+' 次'];
      var bits=['Cursor 本地活动'].concat(cursorActivityIntensityBits(usage));
      bits.push('本地统计');
      bits.push('不代表官方额度');
      return bits;
    }

    function isCursorActivityUsage(usage){
      usage=usage||{};
      var status=String(usage.status||'');
      if(status!=='ready'&&status!=='stale'&&status!=='waiting') return false;
      if(String(usage.source||'')!=='cursor_local_activity'&&String(usage.confidence||'')!=='local_only') return false;
      return usageValue(usage,'localTodayRequests','local_today_requests')!=null;
    }

    /** User-facing usage source — never leak cursor_local_activity id. */
    function usageSourceLabel(kind,usage){
      if(kind==='cursor') return '本地统计';
      var src=String(usage&&usage.source||'').trim();
      return src||'—';
    }

    /**
     * Chip tip: status + short usage basics + action.
     * Full Soft Pad used to dump all quota on the bottom caption only and never
     * previewed the hovered agent there — tip felt empty.
     */
    function cursorChipTipText(row,usage,state){
      row=row||{};
      usage=usage||{};
      var lines=[];
      var label=agentLabel('cursor')+'：'+lightStatusLabel(state);
      lines.push(label);
      var fail=chipFailureHonestyLine(state);
      if(fail) lines.push(fail);
      var summary=usageSummary('cursor',usage,true,row,null);
      if(summary) lines.push(summary);
      lines.push(chipFocusActionLine('cursor'));
      var tip=lines.join('\n');
      return { tip: tip, aria: label+'，'+chipFocusActionLine('cursor'), lines: lines };
    }

    var overlayAgentTip=document.getElementById('overlayAgentTip');

    function hideAgentTip(){
      if(!overlayAgentTip) return;
      overlayAgentTip.classList.remove('is-show');
      overlayAgentTip.hidden=true;
      overlayAgentTip.setAttribute('aria-hidden','true');
    }

    function fillAgentTipLines(lines){
      if(!overlayAgentTip) return;
      lines=Array.isArray(lines)?lines.filter(Boolean):[];
      var statusEl=overlayAgentTip.querySelector('[data-tip-status]');
      var modelEl=overlayAgentTip.querySelector('[data-tip-model]');
      var intensityEl=overlayAgentTip.querySelector('[data-tip-intensity]');
      var footEl=overlayAgentTip.querySelector('[data-tip-foot]');
      if(statusEl) statusEl.textContent=lines[0]||'';
      if(lines.length<=2){
        if(modelEl){ modelEl.textContent=''; modelEl.hidden=true; }
        if(intensityEl){ intensityEl.textContent=''; intensityEl.hidden=true; }
        if(footEl) footEl.textContent=lines[1]||'';
        return;
      }
      if(lines.length===3){
        if(modelEl){ modelEl.textContent=''; modelEl.hidden=true; }
        if(intensityEl){
          intensityEl.textContent=lines[1]||'';
          intensityEl.hidden=!lines[1];
        }
        if(footEl) footEl.textContent=lines[2]||'';
        return;
      }
      if(modelEl){
        modelEl.textContent=lines[1]||'';
        modelEl.hidden=!lines[1];
      }
      if(intensityEl){
        var mid=lines.slice(2, lines.length-1).filter(Boolean);
        intensityEl.textContent=mid.join('\n');
        intensityEl.hidden=!mid.length;
      }
      if(footEl) footEl.textContent=lines[lines.length-1]||'';
    }

    /** Hover preview: swap chill / bottom caption to this agent. Never rank/reorder/jump. */
    function pinUsageFocusOnHover(kind){
      kind=String(kind||'').trim();
      if(!kind) return;
      if(hoverUsageKind===kind) return;
      hoverUsageKind=kind;
      applyMiniUsagePill(lastSnap||{});
      if(!localMinimized) applyUsageCaptionIdle(lastSnap||{});
    }

    function clearHoverUsagePreview(){
      if(!hoverUsageKind) return;
      hoverUsageKind='';
      applyMiniUsagePill(lastSnap||{});
      if(!localMinimized) applyUsageCaptionIdle(lastSnap||{});
    }

    function showAgentTip(anchor, lines){
      lines=Array.isArray(lines)?lines.filter(Boolean):[];
      if(!anchor||!lines.length) return;
      // Mini ~44px: no covering strip (flicker). Short native title only; chill shows usage.
      if(localMinimized){
        if(overlayAgentTip){
          overlayAgentTip.hidden=true;
          overlayAgentTip.classList.remove('is-show');
        }
        anchor.setAttribute('title', lines.join('\n'));
        return;
      }
      anchor.removeAttribute('title');
      if(!overlayAgentTip) return;
      fillAgentTipLines(lines);
      overlayAgentTip.hidden=false;
      overlayAgentTip.setAttribute('aria-hidden','false');
      overlayAgentTip.classList.remove('is-show');
      var rect=anchor.getBoundingClientRect();
      var tipW=overlayAgentTip.offsetWidth||200;
      var tipH=overlayAgentTip.offsetHeight||80;
      var left=rect.left+rect.width/2-tipW/2;
      left=Math.max(8, Math.min(left, window.innerWidth-tipW-8));
      var top=rect.bottom+6;
      if(top+tipH>window.innerHeight-8) top=Math.max(8, rect.top-tipH-6);
      overlayAgentTip.style.left=left+'px';
      overlayAgentTip.style.top=top+'px';
      requestAnimationFrame(function(){ overlayAgentTip.classList.add('is-show'); });
    }

    function bindAgentTipHover(el, lines){
      if(!el) return;
      el.__tipLines=lines||[];
      if(el.__tipBound) return;
      el.__tipBound=true;
      el.addEventListener('pointerenter',function(){
        var kind=String(el.getAttribute('data-agent')||'').trim();
        var isMiniChip=!!(el.classList&&el.classList.contains('overlay-mini__agent'));
        var isPadChip=!!(el.classList&&el.classList.contains('soft-pad-agent-bar__chip'));
        if(kind&&el.getAttribute('data-placeholder')!=='1'&&(isMiniChip||isPadChip)){
          pinUsageFocusOnHover(kind);
        }
        if(kind&&el.getAttribute('data-placeholder')!=='1'){
          var row=(lastSnap&&Array.isArray(lastSnap.agents)?lastSnap.agents:[]).find(function(r){
            return String(r&&r.kind||'')===kind;
          })||{};
          var st=String(el.getAttribute('data-status')||row.state||'idle');
          el.__tipLines=agentChipTipLines(kind,row,row.usage||{},st,lastSnap||{});
        }
        showAgentTip(el, el.__tipLines||[]);
      });
      el.addEventListener('pointerleave',function(){
        var isMiniChip=!!(el.classList&&el.classList.contains('overlay-mini__agent'));
        var isPadChip=!!(el.classList&&el.classList.contains('soft-pad-agent-bar__chip'));
        if(isMiniChip||isPadChip) clearHoverUsagePreview();
        hideAgentTip();
      });
      el.addEventListener('focus',function(){
        var kind=String(el.getAttribute('data-agent')||'').trim();
        var isMiniChip=!!(el.classList&&el.classList.contains('overlay-mini__agent'));
        var isPadChip=!!(el.classList&&el.classList.contains('soft-pad-agent-bar__chip'));
        if(kind&&el.getAttribute('data-placeholder')!=='1'&&(isMiniChip||isPadChip)){
          pinUsageFocusOnHover(kind);
        }
        showAgentTip(el, el.__tipLines||[]);
      });
      el.addEventListener('blur',function(){
        var isMiniChip=!!(el.classList&&el.classList.contains('overlay-mini__agent'));
        var isPadChip=!!(el.classList&&el.classList.contains('soft-pad-agent-bar__chip'));
        if(isMiniChip||isPadChip) clearHoverUsagePreview();
        hideAgentTip();
      });
    }

    function agentChipTipLines(kind,row,usage,state,s){
      if(kind==='cursor'){
        return cursorChipTipText(row,usage,state).lines||[];
      }
      var lines=[agentLabel(kind)+'：'+lightStatusLabel(state)];
      var fail=chipFailureHonestyLine(state);
      if(fail) lines.push(fail);
      var summary=usageSummary(kind,usage||{},true,row,s);
      if(summary){
        lines.push(summary);
      }else{
        var bits=usageLineBits(kind,usage||{},row,s);
        if(bits.length) lines.push(bits.slice(0,2).join(' · '));
      }
      lines.push(chipFocusActionLine(kind));
      return lines;
    }

    function usageSummary(kind,usage,detail,row,snap){
      usage=usage||{};
      var status=String(usage.status||'unavailable');
      if(kind==='cursor'){
        if(isCursorActivityUsage(usage)){
          var bits=cursorActivityBits(usage,!!detail);
          return bits.join(detail?' · ':' / ');
        }
        var cmsg=String(usage.message||'').trim();
        if(/未启用/.test(cmsg)||!cmsg){
          return detail?'点击启用 Cursor 活动统计':'点击启用统计';
        }
        return cmsg;
      }
      if(status==='disabled') return detail?'用量已关闭':'已关闭';
      var balCap=(kind==='claude'||kind==='minimax')?providerBalanceCaption(usage):'';
      if(balCap){
        var locBits=[];
        var lt=usageValue(usage,'localTodayTokens','local_today_tokens');
        if(detail&&lt!=null&&Number(lt)>0) locBits.push('本机今日 '+Math.round(Number(lt)));
        var base=balCap+(locBits.length?(' · '+locBits.join(' · ')):'');
        if(status==='stale') return base+(detail?' · 数据陈旧':' · 陈旧');
        return base;
      }
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      var bits=[];
      if(kind==='codex'||kind==='claude'||kind==='minimax'){
        windows.slice(0,2).forEach(function(w){
          // Each window shows its own reset (do not share primary countdown with 7d).
          var lab=windowLabel(w,true);
          if(lab) bits.push(lab);
        });
        if(windows.length>2) bits.push('另 '+(windows.length-2)+' 项');
        if(!bits.length){
          if(kind==='claude'){
            var otel=claudeOtelBits(usage,detail);
            if(otel.length) bits=otel;
            else return claudeFallbackCaption(row,snap,!!detail);
          } else {
            // codex + minimax: remainingPercent; never Claude OTel on MiniMax
            var remaining=usageValue(usage,'remainingPercent','remaining_percent');
            if(remaining!=null){
              var base='窗口余 '+Math.round(Number(remaining))+'%';
              if(detail){
                var cd=formatResetCountdown(usageValue(usage,'resetsAt','resets_at'));
                if(cd) base+=' · '+cd+'重置';
              }
              bits.push(base);
            }
          }
        }
        if(kind==='codex'){
          var lifetime=usageValue(usage,'lifetimeTokens','lifetime_tokens');
          if(detail&&lifetime!=null) bits.push('累计 '+compactNumber(lifetime));
        }
      }
      if(status==='stale'){
        if(bits.length) return bits.join(detail?' · ':' / ')+(detail?' · 数据陈旧':' · 陈旧');
        return detail?(friendlyUsageMessage(usage.message)||'数据陈旧，保留上次值'):'数据陈旧';
      }
      if(status==='waiting'){
        if(bits.length) return bits.join(detail?' · ':' / ');
        return detail?(friendlyUsageMessage(usage.message)||'正在同步额度'):'同步中';
      }
      if(status!=='ready'){
        if(bits.length) return bits.join(detail?' · ':' / ');
        var message=friendlyUsageMessage(usage.message);
        return detail?(message||'用量数据未连接'):'未连接';
      }
      return bits.length?bits.join(detail?' · ':' / '):(detail?'用量数据未返回':'--');
    }

    function friendlyUsageMessage(msg){
      var s=String(msg||'').trim();
      if(!s) return '';
      var lower=s.toLowerCase();
      if(lower.indexOf('timed out')>=0||lower.indexOf('timeout')>=0) return '同步超时，稍后重试';
      if(lower.indexOf('token usage profile')>=0) return '同步超时，稍后重试';
      return s;
    }

    function healthCap(healthRows,cap){
      if(!Array.isArray(healthRows)) return null;
      for(var i=0;i<healthRows.length;i++){
        if(healthRows[i]&&String(healthRows[i].capability||'')===cap) return healthRows[i];
      }
      return null;
    }

    /** Usage-rail badge: usage channel only (never lifecycle aggregate). */
    function usageRailBadge(kind,usage,healthRows){
      usage=usage||{};
      var u=healthCap(healthRows,'usage');
      var state=String(u&&u.state||'');
      var status=String(usage.status||'unavailable');
      var hasWindows=Array.isArray(usage.windows)&&usage.windows.some(function(w){
        return w&&(w.remainingPercent!=null||w.remaining_percent!=null);
      });
      var hasRem=usageValue(usage,'remainingPercent','remaining_percent')!=null||hasWindows;
      if(kind==='cursor'){
        if(isCursorActivityUsage(usage)){
          return { label:'本地活动', state:'live' };
        }
        return { label:String(usage.message||'未启用活动统计').slice(0,12)||'未启用', state:'unsupported' };
      }
      var hasOtel=kind==='claude'&&(
        usageValue(usage,'sessionTokens','session_tokens')!=null||
        usageValue(usage,'estimatedCostUsd','estimated_cost_usd')!=null
      );
      if(kind==='claude'&&!hasRem&&!hasOtel){
        return { label:'用量暂无接口', state:'unsupported' };
      }
      // Codex + Claude with windows or OTel
      if(status==='ready'||state==='live'||((hasRem||hasOtel)&&status!=='stale'&&status!=='waiting')){
        return { label:'正常', state:'live' };
      }
      if(status==='stale'||state==='stale') return { label:'数据陈旧', state:'stale' };
      if(status==='waiting'||state==='configured_waiting') return { label:'同步中', state:'configured_waiting' };
      if(status==='disabled'||state==='disabled') return { label:'已关闭', state:'disabled' };
      if(state==='error'&&!hasRem&&!hasOtel) return { label:'出错', state:'error' };
      if(hasRem||hasOtel) return { label:'正常', state:'live' };
      return { label:'同步中', state:'configured_waiting' };
    }

    function isShellUsageKind(kind){
      return kind==='workbuddy'||kind==='trae'||kind==='qoder';
    }

    function miniUsageAbbrev(kind){
      if(kind==='codex') return 'C';
      if(kind==='claude') return 'Cl';
      if(kind==='cursor') return 'Cu';
      if(kind==='minimax') return 'Mn';
      if(kind==='workbuddy') return 'Wb';
      if(kind==='trae') return 'Tr';
      if(kind==='qoder') return 'Qd';
      return String(kind||'?').slice(0,1).toUpperCase();
    }

    function shellUsageCaption(usage){
      usage=usage||{};
      var src=String(usage.source||'');
      var conf=String(usage.confidence||'');
      if(conf==='manual_or_local_estimate'||/qoder_|workbuddy_|trae_/.test(src)){
        var msg=String(usage.message||'').trim();
        if(msg) return msg.split(' · ')[0];
      }
      return '';
    }

    function isRenderableUsage(kind,usage){
      usage=usage||{};
      var status=String(usage.status||'');
      if(kind==='cursor') return isCursorActivityUsage(usage);
      if(status==='disabled'||status==='unavailable') return false;
      if((kind==='claude'||kind==='minimax')&&providerBalanceCaption(usage)){
        return status==='ready'||status==='stale'||status==='waiting';
      }
      if((kind==='claude'||kind==='minimax')&&String(usage.confidence||'')==='manual_or_local_estimate'){
        return status==='ready'||status==='stale'||status==='waiting';
      }
      if(isShellUsageKind(kind)&&(shellUsageCaption(usage)||String(usage.confidence||'')==='manual_or_local_estimate')){
        return status==='ready'||status==='stale'||status==='waiting';
      }
      // Claude OTel session burn — auxiliary only; never invent remaining %; never on MiniMax.
      if(kind==='claude'&&claudeOtelBits(usage,false).length){
        return status==='ready'||status==='stale'||status==='waiting';
      }
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      for(var i=0;i<windows.length;i++){
        var w=windows[i];
        if(!w) continue;
        var rem=w.remainingPercent!=null?w.remainingPercent:w.remaining_percent;
        if(rem==null) continue;
        var n=Number(rem);
        if(Number.isFinite(n)&&n>=0&&n<=100) return true;
      }
      var remScalar=usageValue(usage,'remainingPercent','remaining_percent');
      if(remScalar!=null){
        var sn=Number(remScalar);
        if(Number.isFinite(sn)&&sn>=0&&sn<=100) return true;
      }
      return false;
    }

    /** MiniMax mini pill — windows / balance; never Claude OTel. */
    function minimaxMiniText(usage){
      usage=usage||{};
      var bal=providerBalanceCaption(usage);
      if(bal) return bal.replace(/^MiniMax\s+/,'');
      if(String(usage.confidence||'')==='manual_or_local_estimate'){
        var loc=usageValue(usage,'localTodayTokens','local_today_tokens');
        if(loc!=null&&Number(loc)>0) return '本机今日 '+Math.round(Number(loc));
        return 'Mn · 需 Key 看 5h/倒计时';
      }
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      var pw=windows.find(function(w){ return String(w.kind||'')==='primary'; })||windows[0];
      if(pw){
        var lab=windowLabel(pw,false);
        if(lab) return 'Mn · '+lab;
      }
      var rem=usageValue(usage,'remainingPercent','remaining_percent');
      if(rem!=null) return 'Mn · '+Math.round(Number(rem))+'%';
      return '';
    }

    function miniUsageText(kind,usage){
      usage=usage||{};
      if(!isRenderableUsage(kind,usage)) return '';
      if(kind==='cursor'){
        var turns=usageValue(usage,'localTodayRequests','local_today_requests');
        if(turns==null) return '';
        return 'Cu · '+Math.round(Number(turns))+'次';
      }
      if(kind==='minimax') return minimaxMiniText(usage);
      var bal=kind==='claude'?providerBalanceCaption(usage):(isShellUsageKind(kind)?shellUsageCaption(usage):'');
      if(bal){
        return bal.replace(/^(DeepSeek|Kimi)\s+/,'');
      }
      if((kind==='claude'||isShellUsageKind(kind))&&String(usage.confidence||'')==='manual_or_local_estimate'){
        var loc=usageValue(usage,'localTodayTokens','local_today_tokens');
        if(loc!=null&&Number(loc)>0) return '本机今日 '+Math.round(Number(loc));
        return '控制台查额度';
      }
      var rem=usageValue(usage,'remainingPercent','remaining_percent');
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      var pw=windows.find(function(w){ return String(w.kind||'')==='primary'; })||windows[0];
      if(rem==null&&pw) rem=pw.remainingPercent!=null?pw.remainingPercent:pw.remaining_percent;
      if(rem!=null){
        var cd=formatResetCountdown(primaryResetAt(usage));
        return miniUsageAbbrev(kind)+' '+Math.round(Number(rem))+'%'+(cd?' · '+cd:'');
      }
      // Claude OTel-only: show session burn, never as remaining %.
      if(kind==='claude'){
        var otel=claudeOtelBits(usage,false);
        if(otel.length) return otel[0];
      }
      return '';
    }

    /** One visible pill: pinned focus → app_agent → renderable-first (Cursor activity ok). */
    function pickMiniUsageKind(s){
      var rows=Array.isArray(s&&s.agents)?s.agents:[];
      var byKind={};
      rows.forEach(function(row){
        var kind=String(row&&row.kind||'').trim();
        if(kind) byKind[kind]=row;
      });
      function hasRenderable(kind){
        return isRenderableUsage(kind,(byKind[kind]||{}).usage||{});
      }
      // Hover preview wins even when that agent has no renderable usage yet.
      if(hoverUsageKind) return hoverUsageKind;
      if(usageFocusPinned&&focusedUsageAgent&&hasRenderable(focusedUsageAgent)) return focusedUsageAgent;
      var fg=String(s&&(s.foregroundAgent||s.foreground_agent)||'').trim().toLowerCase();
      if(fg&&hasRenderable(fg)) return fg;
      var app=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
      if(app&&hasRenderable(app)) return app;
      var active=['needs_input','running'];
      for(var i=0;i<rows.length;i++){
        var st=String(rows[i]&&rows[i].state||'').trim();
        var k=String(rows[i]&&rows[i].kind||'').trim();
        if(active.indexOf(st)>=0&&hasRenderable(k)) return k;
      }
      if(hasRenderable('codex')) return 'codex';
      if(hasRenderable('claude')) return 'claude';
      if(hasRenderable('cursor')) return 'cursor';
      for(var n=0;n<rows.length;n++){
        var kk=String(rows[n]&&rows[n].kind||'').trim();
        if(kk&&hasRenderable(kk)) return kk;
      }
      return '';
    }

    function isUsageFocusKind(kind){
      return kind==='codex'||kind==='claude'||kind==='cursor'||kind==='minimax'||
        kind==='workbuddy'||kind==='trae'||kind==='qoder'||
        kind==='cline'||kind==='opencode'||kind==='aider'||kind==='copilotCli'||kind==='gemini';
    }

    function resolveUsageFocus(s){
      if(hoverUsageKind) return hoverUsageKind;
      if(usageFocusPinned&&isUsageFocusKind(focusedUsageAgent)){
        return focusedUsageAgent;
      }
      var fg=String(s&&(s.foregroundAgent||s.foreground_agent)||'').trim().toLowerCase();
      if(isUsageFocusKind(fg)) return fg;
      var app=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
      if(isUsageFocusKind(app)) return app;
      var auto=pickMiniUsageKind(s);
      if(auto) return auto;
      return focusedUsageAgent||'codex';
    }

    function usageLineBits(kind,usage,row,snap){
      usage=usage||{};
      var lines=[];
      // Prefer official balance / windows over OTel「本会话」(Soft Pad caption + tooltip).
      var balCap=(kind==='claude'||kind==='minimax')?providerBalanceCaption(usage):(isShellUsageKind(kind)?shellUsageCaption(usage):'');
      if(balCap){
        lines.push(balCap);
        return lines;
      }
      var windows=Array.isArray(usage.windows)?usage.windows:[];
      windows.slice(0,2).forEach(function(w){
        var lab=windowLabel(w,true);
        if(lab) lines.push(lab);
      });
      if(!lines.length&&kind==='claude'){
        claudeOtelBits(usage,true).forEach(function(b){ lines.push(b); });
      }
      if(!lines.length&&(kind==='codex'||kind==='minimax')){
        var remaining=usageValue(usage,'remainingPercent','remaining_percent');
        if(remaining!=null){
          var base='窗口余 '+Math.round(Number(remaining))+'%';
          var cd=formatResetCountdown(usageValue(usage,'resetsAt','resets_at'));
          lines.push(cd?base+' · '+cd+'重置':base);
        }
      }
      if(!lines.length){
        if(kind==='cursor'){
          if(isCursorActivityUsage(usage)) cursorActivityBits(usage,true).forEach(function(b){ lines.push(b); });
          else lines.push(String(usage.message||'').trim()||'点击启用 Cursor 活动统计');
        }
        else if(kind==='claude') lines.push(claudeFallbackCaption(row,snap,true));
        else lines.push('用量 --');
      }
      return lines;
    }

    function usageCaptionText(kind,usage,row,snap){
      // Same contract as usageSummary (balance-first); do not bypass via OTel-only bits.
      var summary=usageSummary(kind,usage||{},false,row,snap);
      if(summary) return summary;
      var lines=usageLineBits(kind,usage||{},row,snap);
      return lines.length?lines[0]:'';
    }

    function snapshotProviderQuotas(s){
      var rows=s&&(s.providerQuotas||s.provider_quotas);
      return Array.isArray(rows)?rows:[];
    }

    function setMiniQuotaOpen(open){
      miniQuotaOpen=!!open;
      if(miniQuotaDropdown) miniQuotaDropdown.hidden=!miniQuotaOpen;

    var usageCaptionIdle='';

    // Entity-keyed status edge memory (not DOM data-status — remount-safe).
    var agentStatusMemory = Object.create(null);

    function agentSurfaceKey(el){
      var kind=String(el&&el.getAttribute('data-agent')||'').trim()||'unknown';
      var surface='overlay';
      try{
        if(el.closest&&el.closest('#overlayMini')) surface='mini';
        else if(el.closest&&(el.closest('#padAgentBar')||el.closest('.soft-pad-agent-bar'))) surface='overlay';
      }catch(_){}
      return surface+':'+kind;
    }

    function applyAgentStatusEdge(el, nextState, row){
      var Edge=window.OneToneAgentStatusEdge;
      var key=agentSurfaceKey(el);
      var next=Edge&&Edge.normalizeStatus?Edge.normalizeStatus(nextState):String(nextState||'idle').trim().toLowerCase()||'idle';
      if(next==='error') next='failed';
      var meta=Edge&&Edge.metaFromRow?Edge.metaFromRow(row):{sequence:null,timestamp:null};
      var prev=agentStatusMemory[key]||null;
      var decision=Edge&&Edge.decideAgentStatusEdge
        ?Edge.decideAgentStatusEdge(prev, next, meta)
        :{accepted:true,stateChanged:!!(prev&&prev.warmed&&prev.status!==next),nextMemory:{status:next,sequence:meta.sequence,timestamp:meta.timestamp,warmed:true}};
      if(decision.accepted&&decision.nextMemory){
        agentStatusMemory[key]=decision.nextMemory;
      }
      return decision;
    }

    function playAgentChipEdge(el, state){
      var Motion=window.OneToneMotion;
      if(!Motion||typeof Motion.playOnce!=='function'||!el) return;
      var target=el.querySelector('.overlay-mini__agent-dot, .soft-pad-agent-bar__dot')||el;
      var next=String(state||'').trim().toLowerCase();
      if(next==='error') next='failed';
      if(next==='done'||next==='needs_input') Motion.playOnce(target,'ot-sparkle-once');
      else if(next==='failed') Motion.playOnce(target,'ot-shake');
      // Pad + mini: brief chip flash when a run finishes.
      if(next==='done'&&el.classList&&(
        el.classList.contains('soft-pad-agent-bar__chip')||
        el.classList.contains('overlay-mini__agent')
      )){
        el.classList.remove('is-status-flash');
        void el.offsetWidth;
        el.classList.add('is-status-flash');
        clearTimeout(el.__statusFlashTimer);
        el.__statusFlashTimer=setTimeout(function(){
          el.classList.remove('is-status-flash');
        }, 560);
      }
    }

    function applyAgentChipEl(el,s,byKind,focus){
      if(!el) return;
      var kind=String(el.getAttribute('data-agent')||'');
      var Rank=window.OneToneSoftPadAgentBarRank;
      var row=byKind[kind]||{};
      var lightsOn = !!(row.lightsEnabled || row.lights_enabled);
      var hookCfg=row.hookConfigured;
      if(hookCfg===undefined) hookCfg=row.hook_configured;
      var shellUnconfigured=(kind==='workbuddy'||kind==='trae'||kind==='qoder')&&hookCfg===false;
      var asPlaceholder = shellUnconfigured || (!lightsOn && Rank && Rank.isPlaceholderKind && Rank.isPlaceholderKind(kind));
      if(asPlaceholder){
        el.setAttribute('data-placeholder', '1');
        el.setAttribute('data-status', 'idle');
        el.classList.remove('is-usage-focus');
        el.classList.remove('is-status-flash');
        el.removeAttribute('data-lane-id');
        el.removeAttribute('data-session-id');
        el.setAttribute('aria-pressed', 'false');
        el.hidden=false;
        el.setAttribute('aria-label', agentLabel(kind)+'：未配置 Hook');
        el.setAttribute('title', '未配置 Hook · 点击去 Soft Pad 安装');
        el.__tipLines=null;
        return;
      }
      el.removeAttribute('data-placeholder');
      var state=String(row.state||'idle').trim().toLowerCase()||'idle';
      var activeState=(state==='running'||state==='needs_input'||state==='done'||state==='failed'||state==='error');
      // Fallback: when usage rail/model rows lag behind, derive Claude chip state
      // from app-state / hook source so the lamp still reflects live CLI progress.
      if(kind==='claude'&&!activeState){
        var appAgent=String(s&&(s.appAgent||s.app_agent)||'').trim().toLowerCase();
        var appStatus=String(s&&(s.appStatus||s.app_status)||'').trim().toLowerCase();
        var appSrc=String(s&&(s.appLastSource||s.app_last_source)||'').trim().toLowerCase();
        var waitingHint=String(s&&(s.claudeWaitingHint||s.claude_waiting_hint)||'').trim();
        var claudeLiveSrc=(appSrc==='claude_hook'||appSrc==='claude_app');
        if((appAgent==='claude'||claudeLiveSrc)&&(appStatus==='running'||appStatus==='needs_input'||appStatus==='done'||appStatus==='failed')){
          state=appStatus;
        }else if(waitingHint){
          state='needs_input';
        }
      }
      // Always sync focus chrome first (not derived from stale row state).
      el.classList.toggle('is-usage-focus', kind===focus);
      el.setAttribute('aria-pressed', kind===focus?'true':'false');

      var decision=applyAgentStatusEdge(el, state, row);
      var Edge=window.OneToneAgentStatusEdge;
      var plan=Edge&&Edge.planAgentChipProjection
        ?Edge.planAgentChipProjection({
          accepted:!(decision&&decision.accepted===false),
          stateChanged:!!(decision&&decision.stateChanged),
          lightsOn:lightsOn
        })
        :{
          applyRow:!(decision&&decision.accepted===false),
          hidden:(decision&&decision.accepted===false)?null:!lightsOn,
          applyStatusTip:!(decision&&decision.accepted===false)&&lightsOn,
          playEdge:!(decision&&decision.accepted===false)&&lightsOn&&!!(decision&&decision.stateChanged)
        };
      if(!plan.applyRow) return;
      if(plan.hidden!=null) el.hidden=!!plan.hidden;
      var laneId=String(row.laneId||row.lane_id||'').trim();
      var sessionId=String(row.sessionId||row.session_id||'').trim();
      if(laneId) el.setAttribute('data-lane-id', laneId);
      else el.removeAttribute('data-lane-id');
      if(sessionId) el.setAttribute('data-session-id', sessionId);
      else el.removeAttribute('data-session-id');
      if(!plan.applyStatusTip) return;

      var usage=row.usage||{};
      var label=agentLabel(kind)+'：'+lightStatusLabel(state);
      var tipLines=agentChipTipLines(kind,row,usage,state,s);
      if(kind==='cursor'){
        var built=cursorChipTipText(row,usage,state);
        el.setAttribute('data-status', state);
        el.setAttribute('aria-label', built.aria);
        el.removeAttribute('title');
        bindAgentTipHover(el, tipLines);
      }else{
        var line2=tipLines[1]||'';
        el.setAttribute('data-status', state);
        el.setAttribute('aria-label', label+'，'+line2);
        el.removeAttribute('title');
        bindAgentTipHover(el, tipLines);
      }
      if(plan.playEdge) playAgentChipEdge(el, state);
    }

    function rankAgentBarKinds(s, byKind, focus, opts){
      var Rank=window.OneToneSoftPadAgentBarRank;
      if(Rank&&Rank.rankPadAgentBarKinds){
        return Rank.rankPadAgentBarKinds(s, byKind, focus, agentBarRecency, opts);
      }
      return { top: [], rest: [] };
    }

    function reorderChipsBeforeAnchor(root, chipSel, top, rest, anchor){
      if(!root) return { chips: [], byEl: {}, topSet: {}, restSet: {} };
      var topSet={};
      (top||[]).forEach(function(k){ topSet[k]=1; });
      var restSet={};
      (rest||[]).forEach(function(k){ restSet[k]=1; });
      var chips=[];
      root.querySelectorAll(chipSel).forEach(function(el){ chips.push(el); });
      var byEl={};
      chips.forEach(function(el){
        byEl[String(el.getAttribute('data-agent')||'')]=el;
      });
      (top||[]).forEach(function(k){
        if(byEl[k]&&anchor) root.insertBefore(byEl[k], anchor);
        else if(byEl[k]) root.appendChild(byEl[k]);
      });
      (rest||[]).forEach(function(k){
        if(byEl[k]&&anchor) root.insertBefore(byEl[k], anchor);
        else if(byEl[k]) root.appendChild(byEl[k]);
      });
      chips.forEach(function(el){
        var k=String(el.getAttribute('data-agent')||'');
        if(topSet[k]||restSet[k]) return;
        if(anchor) root.insertBefore(el, anchor);
      });
      return { chips: chips, byEl: byEl, topSet: topSet, restSet: restSet };
    }

    function layoutMiniAgentBar(s, byKind, focus){
      if(!miniAgents) return;
      var Rank=window.OneToneSoftPadAgentBarRank;
      var visibleMax=(Rank&&Rank.VISIBLE_PAD)||6;
      var ranked=rankAgentBarKinds(s, byKind, focus, { visibleMax: visibleMax });
      if(Rank&&Rank.mergePlaceholderKinds){
        ranked=Rank.mergePlaceholderKinds(ranked, byKind, visibleMax);
      }
      var top=ranked.top||[];
      var rest=ranked.rest||[];
      var laid=reorderChipsBeforeAnchor(
        miniAgents,
        '.overlay-mini__agent[data-agent]',
        top,
        rest,
        miniAgentMore||null
      );
      laid.chips.forEach(function(el){
        var k=String(el.getAttribute('data-agent')||'');
        applyAgentChipEl(el, s, byKind, focus);
        el.hidden=!laid.topSet[k];
      });
      if(miniAgentMore){
        var n=rest.length;
        if(n>0){
          miniAgentMore.hidden=false;
          miniAgentMore.textContent='+'+n;
          miniAgentMore.setAttribute('aria-label', '还有 '+n+' 个 Agent');
          miniAgentMore.title='展开查看更多 Agent（+'+n+'）';
        } else {
          miniAgentMore.hidden=true;
          miniAgentMore.textContent='+0';
        }
      }
    }

    function layoutPadAgentBar(s, byKind, focus){
      if(!padAgentBar) return;
      var Rank=window.OneToneSoftPadAgentBarRank;
      var visibleMax=(Rank&&Rank.VISIBLE_PAD)||6;
      var ranked=rankAgentBarKinds(s, byKind, focus, { visibleMax: visibleMax });
      if(Rank&&Rank.mergePlaceholderKinds){
        ranked=Rank.mergePlaceholderKinds(ranked, byKind, visibleMax);
      }
      var top=ranked.top||[];
      var rest=ranked.rest||[];
      var anchor=padAgentBarMore||padAgentBarOverflow||null;
      var laid=reorderChipsBeforeAnchor(
        padAgentBar,
        '.soft-pad-agent-bar__chip[data-agent]',
        top,
        rest,
        anchor
      );
      var expanded=agentBarExpanded&&rest.length>0;
      if(agentBarExpanded&&!rest.length){
        setAgentBarExpanded(false);
        expanded=false;
      }
      laid.chips.forEach(function(el){
        var k=String(el.getAttribute('data-agent')||'');
        applyAgentChipEl(el, s, byKind, focus);
        el.hidden=expanded?!(laid.topSet[k]||laid.restSet[k]):!laid.topSet[k];
      });

      if(padAgentBarMore){
        var n=rest.length;
        if(n>0){
          padAgentBarMore.hidden=false;
          if(expanded){
            padAgentBarMore.textContent='收起';
            padAgentBarMore.setAttribute('aria-label', '收起 Agent 列表');
            padAgentBarMore.title='收起';
          } else {
            padAgentBarMore.textContent='+'+n;
            padAgentBarMore.setAttribute('aria-label', '展开查看更多 Agent（+'+n+'）');
            padAgentBarMore.title='展开为两排查看（+'+n+'）';
          }
          padAgentBarMore.setAttribute('aria-expanded', expanded?'true':'false');
        } else {
          padAgentBarMore.hidden=true;
          padAgentBarMore.textContent='+0';
        }

      if(padAgentBarOverflow){
        padAgentBarOverflow.innerHTML='';
        padAgentBarOverflow.hidden=true;

    function formatAgeMs(ageMs){
      var n=Number(ageMs)||0;
      if(n<=0) return '';
      if(n<1000) return '刚刚';
      if(n<60_000) return Math.floor(n/1000)+'s 前';
      if(n<3600_000) return Math.floor(n/60_000)+'m 前';
      return Math.floor(n/3600_000)+'h 前';
    }

    function shortId(id){
      var s=String(id||'').trim();
      if(!s) return '';
      if(s.length<=10) return s;
      return '…'+s.slice(-8);
    }

    function applyAppMetaChip(s){
      if(!overlayAppMeta) return;
      var lastSrc=String(s&&(s.appLastSource||s.app_last_source)||'').trim();
      var lastEv=String(s&&(s.appLastEvent||s.app_last_event)||'').trim();
      var enabled=!!(s&&(s.appStateEnabled||s.app_state_enabled));
      var confidence=String(s&&(s.appConfidence||s.app_confidence)||'').trim();
      var ageMs=Number(s&&(s.appAgeMs!=null?s.appAgeMs:s.app_age_ms))||0;
      var msg=String(s&&(s.appMessage||s.app_message)||'').trim();
      var taskId=String(s&&(s.appTaskId||s.app_task_id)||'').trim();
      var sessionId=String(s&&(s.appSessionId||s.app_session_id)||'').trim();
      var waitingHint=String(s&&(s.claudeWaitingHint||s.claude_waiting_hint)||'').trim();
      // Snapshot-only: never re-derive light from lastEvent on the FE.
      var light=String(s&&(s.appStatus||s.app_status)||'').trim()||'idle';
      // Quiet idle: hide unless Claude waiting hint (copy-only; no lamp color).
      if(!enabled || (!lastEv && !lastSrc && !waitingHint) || (light==='idle' && !waitingHint)){
        overlayAppMeta.hidden=true;
        if(overlayAppMetaRow) overlayAppMetaRow.textContent='';
        if(overlayAppMetaTask){
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
        overlayAppMeta.removeAttribute('title');
        overlayAppMeta.removeAttribute('data-light');
        wrap.classList.remove('is-pass-through');
        return;
      }
      if(light==='idle' && waitingHint){
        overlayAppMeta.hidden=false;
        if(overlayAppMetaRow) overlayAppMetaRow.textContent=waitingHint;
        else overlayAppMeta.textContent=waitingHint;
        if(overlayAppMetaTask){
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
        overlayAppMeta.setAttribute('title', waitingHint);
        overlayAppMeta.removeAttribute('data-light');
        wrap.classList.remove('is-pass-through');
        return;
      }
      var bits=[lightStatusLabel(light)];
      if(lastSrc) bits.push(statusSourceLabel(lastSrc));
      var agent=String(s&&(s.appAgent||s.app_agent)||'').trim();
      if(agent==='claude'||agent==='codex'){
        var agentLbl=agent==='claude'?'Claude':'Codex';
        if(bits.indexOf(agentLbl)<0 && bits.indexOf(agentLbl+' Hook')<0 && bits.indexOf(agentLbl+' App')<0){
          // Prefer source label (already agent-aware); only add agent when source is generic.
          if(lastSrc!=='codex_hook'&&lastSrc!=='claude_hook'&&lastSrc!=='codex_app'&&lastSrc!=='claude_app'){
            bits.push(agentLbl);
          }
        }
      }
      var age=formatAgeMs(ageMs);
      if(age) bits.push(age);
      if(confidence==='low') bits.push('推断');
      if(overlayAppMetaRow) overlayAppMetaRow.textContent=bits.join(' · ');
      else overlayAppMeta.textContent=bits.join(' · ');

      var taskBits=[];
      if(msg) taskBits.push(msg);
      if(waitingHint && light!=='idle') taskBits.push(waitingHint);
      var tid=shortId(taskId);
      var sid=shortId(sessionId);
      if(tid) taskBits.push('任务 '+tid);
      if(sid) taskBits.push('会话 '+sid);
      if(overlayAppMetaTask){
        if(taskBits.length){
          overlayAppMetaTask.textContent=taskBits.join(' · ');
          overlayAppMetaTask.hidden=false;
        } else {
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
      }

      var tipParts=[lightStatusLabel(light), statusSourceLabel(lastSrc)||lastSrc];
      if(age) tipParts.push(age);
      if(confidence) tipParts.push('置信度 '+confidence);
      if(msg) tipParts.push(msg);
      if(taskId) tipParts.push('任务 '+taskId);
      if(sessionId) tipParts.push('会话 '+sessionId);
      if(lastEv) tipParts.push('事件 '+lastEv);
      overlayAppMeta.title=tipParts.filter(Boolean).join(' · ');
      overlayAppMeta.hidden=false;

    function applyPadLightGlow(s){
      var appOn=!!(s&&(s.appStateEnabled||s.app_state_enabled));
      var appSt=String(s&&(s.appStatus||s.app_status)||'').trim()||'idle';
      var ambient=String(s&&(s.ambientStatus||s.ambient_status)||'').trim();
      backendAppLightsOn=appOn;
      backendAppStatus=appSt;
      var padSt=effectivePadStatus();
      var Rank=window.OneToneSoftPadAgentBarRank;
      var byKind={};
      (Array.isArray(s&&s.agents)?s.agents:[]).forEach(function(row){
        var kind=String(row&&row.kind||'').trim();
        if(kind) byKind[kind]=row;
      });
      var fromAgents=Rank&&Rank.padLightFromRanked
        ? Rank.padLightFromRanked(s, byKind, resolveUsageFocus(s), agentBarRecency)
        : '';
      // Soft RGB / chassis prefer ambient aggregate; chips still inform when richer.
      var light=fromAgents || (ambient&&ambient!=='idle' ? ambient : (appOn && appSt && appSt!=='idle' ? appSt : padSt));
      wrap.setAttribute('data-light', light);
      maybeNotifyAttention(light);
      // Soft Pad chassis stays static — breathing/flash lives on agent chips only.
      wrap.classList.remove('ot-status-pulse', 'ot-status-pulse-slow', 'is-status-flash');

      // Soft RGB Output Adapter: color only from snapshot.rgb (Rust), never FE palette.
      var rgb=null;
      if(s && s.rgb && s.rgb.r!=null) rgb=s.rgb;
      if(!rgb){
        wrap.classList.remove('has-rgb-glow');
        wrap.style.removeProperty('--overlay-rgb-glow');
        wrap.removeAttribute('role');
        wrap.removeAttribute('tabindex');
        return;
      }
      wrap.classList.add('has-rgb-glow');
      wrap.style.setProperty('--overlay-rgb-glow', 'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.42)');
      wrap.setAttribute('role','button');
      wrap.setAttribute('tabindex','0');
      if(!wrap.__softRgbFocusBound){
        wrap.__softRgbFocusBound=true;
        wrap.addEventListener('click',function(e){
          if(e.target&&e.target.closest&&e.target.closest('[data-micro-key],button,a,input')) return;
          if(!wrap.classList.contains('has-rgb-glow')) return;
          var snap=lastSnap||{};
          var kind=String(snap.appAgent||snap.app_agent||snap.appliedAgent||snap.applied_agent||resolveUsageFocus(snap)||'codex').trim()||'codex';
          setUsageFocusFromUi(kind,{
            sessionId:String(snap.appSessionId||snap.app_session_id||'').trim(),
            clickKind:'soft_rgb'
          });
        });
      }
    }

    function fire(id,phase){
      var isNav=isNavKeyId(id);
      return invoke('cmd_codex_micro_pad_fire',{microKeyId:id,phase:phase}).then(function(res){
        if(isNav) return res;
        if(!res) return res;
        var reason=String(res.reason||'');
        var slot=String(res.slotId||res.slot_id||'').trim();
        var slotHint=slot?(' · '+slot):'';
        if(reason==='hold_down'){
          holdLockId=id;
          holdSuppressCancel=true;
          holdUiReleased=false;
          setLocalStatus('listening', id);
          toast('听写中 · 松开结束'+slotHint);
        } else if(reason==='hold_up'){
          holdLockId='';
          holdSuppressCancel=false;
          holdUiReleased=false;
          setLocalStatus('done', id);
          toast('已完成'+slotHint);
        }
        else if(reason==='hold_busy'){
          setFootHint('听写进行中');
        }
        else if(reason==='numpad_mode'){
          // Trust backend snapshot — do not force local OFF while switch still paints ON.
          toastNumpadMode();
          lastGridSig='';
          pull();
        }
        else if(reason==='fired' || reason==='enhance_pulse' || reason==='healing' || reason==='numpad_pulse'){
          setLocalStatus('running', id);
          if(id==='ENC' && phase==='down') toast('召唤 Codex');
          else if(phase==='down') toast('已触发'+slotHint);
        }
        else if(!res.ok && phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
          setFootHint(reasonHint(reason)||DEFAULT_FOOT);
        }
        return res;
      }).catch(function(){
        if(phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
        }
        return null;
      });
    }

    function bindEnc(el){

          var actual=String(mode||'')==='numpad'?'numpad':'codex';
          if(actual!==padMode){

            padEnabled=actual==='codex';

            render(Object.assign({}, lastSnap, {
              visible:true,
              enabled:padEnabled,
              padMode:padMode,
              joyArrowsLive:!!lastSnap.joyArrowsLive
            }));
          }
          if(padMode==='codex'){
            fire('ENC','down');

        }).catch(function(err){
          var msg=String((err&&err.message)||err||'');
          padMode=padMode==='codex'?'numpad':'codex';
          padEnabled=padMode==='codex';
          persistPadMode();
          lastGridSig='';
          render(Object.assign({}, lastSnap, {
            visible:true,
            enabled:padEnabled,
            padMode:padMode
          }));
          if(msg.indexOf('no_mapping')>=0) toast('请先创建并启用 Codex 应用场景');
          else toast('无法切换模式');
        }).then(function(){

        });

    function bindFire(){
      ensureOverlayHoldPointerUp();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        if(el.classList.contains('micro-hw__key--placeholder')) return;
        var id=el.getAttribute('data-micro-key');
        if(id==='JOY') return;
        if(id==='ENC'){ bindEnc(el); return; }
        el.addEventListener('pointerdown',function(e){
          if(e.button!=null&&e.button!==0) return;
          var snap=lastSnap||{};
          var statusHost=String(snap.statusLightMicroKeyId||snap.status_light_micro_key_id||'').trim();
          if(statusHost&&id===statusHost){
            var appSt=String(snap.appStatus||snap.app_status||'idle').trim();
            // Status-host gate: idle/offline pass; running swallow; needs_input/error/done intercept.
            if(appSt==='running'||appSt==='listening'||appSt==='working'){
              e.preventDefault();
              e.stopPropagation();
              el.classList.add('is-pressed');
              setTimeout(function(){ el.classList.remove('is-pressed'); }, 80);
              return;
            }
            if(appSt==='needs_input'||appSt==='error'||appSt==='failed'||appSt==='done'){
              e.preventDefault();
              e.stopPropagation();
              var kind=String(snap.appAgent||snap.app_agent||snap.appliedAgent||snap.applied_agent||'codex').trim()||'codex';
              setUsageFocusFromUi(kind,{
                sessionId:String(snap.appSessionId||snap.app_session_id||'').trim(),
                clickKind:'status_host'
              });
              el.classList.add('is-pressed','is-active');
              setTimeout(function(){ el.classList.remove('is-pressed','is-active'); }, 120);
              return;
            }
            // idle/offline → fall through to original binding
          }
          var numpadTap=isNumpadKeyId(id);
          if(!padEnabled && !numpadTap){
            // Still flash so user sees the key reacted, then toast.
            el.classList.add('is-pressed','is-active');
            setTimeout(function(){ el.classList.remove('is-pressed','is-active'); }, 120);
            toastNumpadMode();
            return;
          }
          // Non-hold keys: drop re-entrancy while a tap inject is in flight (rapid
          // ACT09/SEARCH storms previously wedged WebView2 after FG thrash).
          if(id!=='ACT10' && tapFireBusy){
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          activePtr=id;
          captionFromKeyEl(el);
          if(id==='ACT10'){
            holdLockId=id;
            holdSuppressCancel=true;
            holdUiReleased=false;
            setLocalStatus('listening', id);
          } else {
            tapFireBusy=true;
            setLocalStatus('running', id);
          }
          el.classList.add('is-pressed','is-active');
          el.setAttribute('data-run-status', id==='ACT10'?'listening':'running');
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
          fire(id,'down').then(function(){
            if(id==='ACT10') return;
            setTimeout(function(){ tapFireBusy=false; }, 220);
          }).catch(function(){
            if(id!=='ACT10') tapFireBusy=false;
          });
        });
        // ACT10 hold: release via window pointerup (ensureOverlayHoldPointerUp).
        // Also bind element pointerup so mic ends even if capture fails.
        el.addEventListener('pointerup',function(e){
          if(e.button!=null&&e.button!==0) return;
          if(activePtr!==id) return;
          if(id==='ACT10'){
            activePtr='';
            holdLockId='';
            holdSuppressCancel=false;
            holdUiReleased=true;
            el.classList.remove('is-pressed','is-active');
            fire(id,'up');
            return;
          }
          activePtr='';
          // Linger pressed look — instant feedback even on very short taps.
          setTimeout(function(){
            if(activePtr===id) return;
            el.classList.remove('is-pressed','is-active');
          }, 120);
          fire(id,'up');
        });
        el.addEventListener('pointercancel',function(){
          // Ignore — focus steal during chord inject must not wipe press visual.
        });
      });
    }

    function gridSignature(s,map,_active){
      // Structural identity only — ephemeral press/run/context/connection fields are
      // patched in place. Including connectionState/visible forced remount → 位移抖动.
      // keyRole must be structural: sessions heal flips AG to agentLane without always
      // changing uiIconId on a stale client cache.
      var parts=(s.cells||[]).map(function(c){
        if(!c||!c.microKeyId) return '';
        return c.microKeyId+':'+(c.bound?1:0)+':'+(c.uiIconId||'')+':'+(c.sourceKind||'')+':'+(c.keyRole||'action');
      });
      var mode=String(s.padMode||'')==='numpad'?'numpad':(s.enabled===false?'numpad':'codex');
      var navOn=s.showNavigationPad!==false && s.show_navigation_pad!==false
        && s.navKeysEnabled!==false && s.nav_keys_enabled!==false;
      var cols=Number(s.layoutColumns||s.layout_columns||0)|| (navOn?5:4);
      if(mode==='numpad') cols=4;
      var purpose=String(s.purpose||'shortcuts');
      var ag=String(s.agSurface||s.ag_surface||'');
      return [!!s.softwareEnhanceEnabled,mode,navOn?1:0,cols,purpose,ag,parts.join('|')].join(';');
    }

    function patchGridRunStates(map,active){
      if(!grid) return;
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var info=map[id]||{};
        var backendRun=String(info.runStatus||'idle');
        var src=String(info.statusSource||'inferred');
        var keyRole=String(info.keyRole||'action');
        var isNav=isNavKeyId(id);
        var isNp=isNumpadKeyId(id);
        // Session lanes / status host may lack chord binding but must stay lit.
        var bound=isNp||isNav||!!info.bound||keyRole==='agentLane';
        el.setAttribute('data-backend-run',backendRun);
        el.setAttribute('data-run-status',mergeRunStatus(id,backendRun));
        el.setAttribute('data-status-source',src);
        el.setAttribute('data-key-role',keyRole);
        el.classList.toggle('micro-hw__key--lane', keyRole==='agentLane');

        if(info.laneId) el.setAttribute('data-lane-id',String(info.laneId));
        else el.removeAttribute('data-lane-id');
        if(info.subagentCount) el.setAttribute('data-subagent-count',String(info.subagentCount));
        else el.removeAttribute('data-subagent-count');
        var rank=String(info.contextRank||'').trim();
        el.classList.toggle('is-context-emphasize',rank==='emphasize');
        el.classList.toggle('is-context-dim',rank==='dim');
        if(info.contextHint) el.setAttribute('data-context-hint',String(info.contextHint));
        else el.removeAttribute('data-context-hint');
        var pressed = (activePtr === id) || (!!active && active === id);
        el.classList.toggle('is-pressed',pressed);
        el.classList.toggle('is-active',pressed);
      });
