<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Micro</title>
  <link rel="stylesheet" href="css/codex-micro-overlay.css" />
</head>
<body>
  <div class="root">
    <div class="wrap" id="wrap">
      <div class="overlay-mini" id="overlayMini">
        <span class="overlay-mini__mark" aria-hidden="true">M</span>
        <div class="overlay-mini__leds" id="miniLeds" data-pad-status="idle" aria-hidden="true">
          <span class="overlay-mini__led"></span>
          <span class="overlay-mini__led"></span>
          <span class="overlay-mini__led"></span>
        </div>
        <button type="button" class="overlay-mini__btn" data-act="expand" title="展开" aria-label="展开">▢</button>
        <button type="button" class="overlay-mini__btn" data-act="close" title="关闭" aria-label="关闭">×</button>
      </div>

      <div class="overlay-full" id="overlayFull">
        <header class="overlay-chrome">
          <button type="button" class="overlay-chrome__btn" data-act="minimize" title="最小化" aria-label="最小化">—</button>
          <button type="button" class="overlay-chrome__btn overlay-chrome__btn--close" data-act="close" title="关闭" aria-label="关闭">×</button>
        </header>
        <div class="overlay-body" id="overlayBody">
          <aside class="overlay-nav-rail" id="navRail" aria-label="方向轨" hidden>
            <span class="overlay-nav-rail__screw overlay-nav-rail__screw--tl" aria-hidden="true"></span>
            <span class="overlay-nav-rail__screw overlay-nav-rail__screw--tr" aria-hidden="true"></span>
            <span class="overlay-nav-rail__screw overlay-nav-rail__screw--bl" aria-hidden="true"></span>
            <span class="overlay-nav-rail__screw overlay-nav-rail__screw--br" aria-hidden="true"></span>
            <div class="overlay-nav-rail__caption" id="navRailCaption" hidden></div>
            <div class="overlay-nav-rail__pad">
              <button type="button" class="overlay-nav-key overlay-nav-key--up" data-nav="NAV_UP" title="上" aria-label="上"></button>
              <button type="button" class="overlay-nav-key overlay-nav-key--left" data-nav="NAV_LEFT" title="左" aria-label="左"></button>
              <button type="button" class="overlay-nav-key overlay-nav-key--down" data-nav="NAV_DOWN" title="下" aria-label="下"></button>
              <button type="button" class="overlay-nav-key overlay-nav-key--right" data-nav="NAV_RIGHT" title="右" aria-label="右"></button>
            </div>
          </aside>
          <div class="micro-hw micro-hw--sm">
            <span class="micro-hw__aura" aria-hidden="true"></span>
            <div class="micro-hw__face">
              <div class="micro-hw__grid" id="grid"></div>
              <div class="status-chip" id="statusChip" data-status="idle" aria-hidden="true"></div>
            </div>
          </div>
        </div>
        <div class="overlay-app-meta" id="overlayAppMeta" hidden aria-live="polite">
          <div class="overlay-app-meta__row" id="overlayAppMetaRow"></div>
          <div class="overlay-app-meta__task" id="overlayAppMetaTask" hidden></div>
        </div>
        <div class="overlay-toast" id="overlayToast" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <script>
    var invoke=window.__TAURI_INTERNALS__?function(cmd,args){return window.__TAURI_INTERNALS__.invoke(cmd,args);}:function(){return Promise.resolve();};
    var listen=window.__TAURI__&&window.__TAURI__.event&&window.__TAURI__.event.listen
      ?window.__TAURI__.event.listen.bind(window.__TAURI__.event)
      :(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__):null);

    var LAYOUT=[
      {id:'ENC',kind:'control',row:1,col:1,icon:'codex'},
      {id:'AG00',kind:'agent',row:1,col:2,ag:0,icon:'agent'},
      {id:'AG01',kind:'agent',row:1,col:3,ag:1,icon:'claude'},
      {id:'AG02',kind:'agent',row:1,col:4,ag:2,icon:'model'},
      {id:'JOY',kind:'control',row:1,col:5,icon:'empty'},
      {id:'AG03',kind:'agent',row:2,col:2,ag:3,icon:'folder'},
      {id:'AG04',kind:'agent',row:2,col:3,ag:4,icon:'status'},
      {id:'AG05',kind:'agent',row:2,col:4,ag:5,icon:'cloud'},
      {id:'ACT06',kind:'command',row:3,col:2,icon:'fast'},
      {id:'ACT07',kind:'command',row:3,col:3,icon:'palette'},
      {id:'ACT08',kind:'command',row:3,col:4,icon:'reject'},
      {id:'ACT09',kind:'command',row:3,col:5,icon:'fork'},
      {id:'ACT10',kind:'command',row:4,col:2,span:2,icon:'mic'},
      {id:'ACT12',kind:'command',row:4,col:4,icon:'send'}
    ];

    /** PC numpad layout (ENC replaces NumLock): / * - · 789+ · 456 · 123 Enter · 0 . */
    var LAYOUT_NUMPAD=[
      {id:'ENC',kind:'control',row:1,col:1,icon:'codex'},
      {id:'NP_DIV',kind:'numpad',row:1,col:2,label:'/'},
      {id:'NP_MUL',kind:'numpad',row:1,col:3,label:'*'},
      {id:'NP_SUB',kind:'numpad',row:1,col:4,label:'-'},
      {id:'NP7',kind:'numpad',row:2,col:1,label:'7'},
      {id:'NP8',kind:'numpad',row:2,col:2,label:'8'},
      {id:'NP9',kind:'numpad',row:2,col:3,label:'9'},
      {id:'NP_ADD',kind:'numpad',row:2,col:4,rowSpan:2,label:'+'},
      {id:'NP4',kind:'numpad',row:3,col:1,label:'4'},
      {id:'NP5',kind:'numpad',row:3,col:2,label:'5'},
      {id:'NP6',kind:'numpad',row:3,col:3,label:'6'},
      {id:'NP1',kind:'numpad',row:4,col:1,label:'1'},
      {id:'NP2',kind:'numpad',row:4,col:2,label:'2'},
      {id:'NP3',kind:'numpad',row:4,col:3,label:'3'},
      {id:'NP_ENTER',kind:'numpad',row:4,col:4,rowSpan:2,label:'↵'},
      {id:'NP0',kind:'numpad',row:5,col:1,span:2,label:'0'},
      {id:'NP_DOT',kind:'numpad',row:5,col:3,label:'.'}
    ];

    function activeLayout(){
      return padMode==='numpad' ? LAYOUT_NUMPAD : LAYOUT;
    }

    function isNumpadKeyId(id){
      return /^NP/.test(String(id||''));
    }

    var ICON={
      fast:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 10-14h-7l0-6z"/></svg>',
      reject:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
      fork:'<svg viewBox="0 0 24 24"><path d="M7 4v8a4 4 0 004 4h2a4 4 0 004-4V4"/><path d="M17 4l3 3-3 3M7 4L4 7l3 3"/></svg>',
      mic:'<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
      send:'<svg viewBox="0 0 24 24"><path d="M4 12h12"/><path d="M12 6l6 6-6 6"/><path d="M20 7v10"/></svg>',
      codex:'<svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z"/></svg>',
      palette:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>',
      status:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
      plan:'<svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',
      review:'<svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
      folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
      cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-8 5.5 5.5 0 00-10.7 1.5A3.5 3.5 0 007 18z"/></svg>',
      agent:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/></svg>',
      claude:'<svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.2L21 12l-6.8 2.8L12 21l-2.2-6.2L3 12l6.8-2.8z"/></svg>',
      model:'<svg viewBox="0 0 24 24"><path d="M4 7h16v10H4z"/><path d="M8 7V5h8v2M8 17v2h8v-2"/><path d="M9 11h6M9 14h4"/></svg>',
      undo:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a5 5 0 010 10h-1"/></svg>',
      search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>',
      empty:'<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" stroke-dasharray="3 3"/></svg>'
    };

    var STATUS_LABEL={idle:'',running:'执行中',listening:'听写中',done:'完成',failed:'失败'};
    var REASON_HINT={
      not_foreground:'请切换到 Codex 桌面版窗口',
      unbound:'此键未启用或未绑定快捷键',
      no_profile:'Codex 场景未配置',
      hold_failed:'无法启动听写（请确认 Codex 已打开）',
      invalid_key:'无效按键',
      invalid_phase:'无效操作',
      numpad_mode:'请先打开模式开关 · 切换到 Codex 场景'
    };
    var boundKeys={};
    var wrap=document.getElementById('wrap');
    var grid=document.getElementById('grid');
    var navRail=document.getElementById('navRail');
    var navRailCaption=document.getElementById('navRailCaption');
    var overlayBody=document.getElementById('overlayBody');
    var overlayToast=document.getElementById('overlayToast');
    var miniLeds=document.getElementById('miniLeds');
    var statusChip=document.getElementById('statusChip');
    var overlayAppMeta=document.getElementById('overlayAppMeta');
    var overlayAppMetaRow=document.getElementById('overlayAppMetaRow');
    var overlayAppMetaTask=document.getElementById('overlayAppMetaTask');
    var activePtr='';
    /** ACT10 hold-to-talk: block grid rebuild while pressed (innerHTML breaks pointer capture). */
    var holdLockId='';
    var holdSuppressCancel=false;
    var holdUiReleased=false;
    var lastGridSig='';
    var localPadStatus='idle';
    var localStatusMicro='';
    var localStatusTimer=null;
    var localMinimized=false;
    var backendPadStatus='idle';
    var STATUS_MS={running:800,done:600,failed:1200};
    var enhanceOn=false;
    var padEnabled=true;
    var padMode='codex';
    var joyNavOpen=false;
    var joyArrowsLive=false;
    var joyContextHint='';
    var requireNumLockOff=false;
    var numLockBlocking=false;
    var joyDrag={active:false,lastNav:'',lastFire:0,inflight:false};
    var navRepeatTimer=null;
    var dragging=false;
    var overlayHoldInstalled=false;
    var toastTimer=null;
    var lastNumpadToastAt=0;
    var DEFAULT_FOOT='';
    var SVG_ARROW={
      up:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>',
      down:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l8-8h-5V4H9v8H4z"/></svg>',
      left:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l8-8v5h8v6h-8v5z"/></svg>',
      right:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8v-5H4V8h8V3z"/></svg>'
    };

    function toast(msg){
      if(!overlayToast||!msg) return;
      overlayToast.textContent=msg;
      overlayToast.classList.add('is-show');
      if(toastTimer) clearTimeout(toastTimer);
      toastTimer=setTimeout(function(){
        overlayToast.classList.remove('is-show');
      },1800);
    }

    function toastNumpadMode(){
      var now=Date.now();
      if(now-lastNumpadToastAt<2200) return;
      lastNumpadToastAt=now;
      toast(REASON_HINT.numpad_mode);
    }

    function ensureOverlayHoldPointerUp(){
      if(overlayHoldInstalled) return;
      overlayHoldInstalled=true;
      function endOverlayPtr(e){
        if(!activePtr) return;
        if(holdSuppressCancel && e && e.type==='pointercancel') return;
        var id=activePtr;
        activePtr='';
        if(id==='ACT10') holdSuppressCancel=false;
        if(id==='ACT10') holdUiReleased=true;
        releaseKeyVisual(id);
        applyLocalStatusDom();
        fire(id,'up');
      }
      window.addEventListener('pointerup',endOverlayPtr,true);
      window.addEventListener('pointercancel',endOverlayPtr,true);
      window.addEventListener('mouseup',endOverlayPtr,true);
      // Do not end hold on pointermove — focus/inject blips used to zero `buttons`
      // and abort presses, making the pad feel frozen.
    }

    function cellMap(cells){
      var map={};
      (cells||[]).forEach(function(c){ if(c&&c.microKeyId) map[c.microKeyId]=c; });
      return map;
    }

    function escHtml(s){
      return String(s==null?'':s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function statusSourceLabel(source){
      var s=String(source||'').trim();
      if(s==='native'||s==='native_micro') return 'Native Micro';
      if(s==='codex_hook') return 'Codex Hook';
      if(s==='claude_hook') return 'Claude Hook';
      if(s==='codex_app') return 'Codex App';
      if(s==='claude_app') return 'Claude App';
      if(s==='inferred') return 'Inferred';
      if(s==='fallback') return 'Fallback';
      return s||'Fallback';
    }

    function lightStatusLabel(status){
      var st=String(status||'idle').trim();
      if(st==='listening') return '听写中';
      if(st==='needs_input') return '等待输入';
      if(st==='running') return '执行中';
      if(st==='done') return '完成';
      if(st==='failed') return '失败';
      return '空闲';
    }

    function formatAgeMs(ageMs){
      var n=Number(ageMs)||0;
      if(n<=0) return '';
      if(n<1000) return '刚刚';
      if(n<60_000) return Math.floor(n/1000)+'s 前';
      if(n<3600_000) return Math.floor(n/60_000)+'m 前';
      return Math.floor(n/3600_000)+'h 前';
    }

    function shortId(id){
      var s=String(id||'').trim();
      if(!s) return '';
      if(s.length<=10) return s;
      return '…'+s.slice(-8);
    }

    function applyAppMetaChip(s){
      if(!overlayAppMeta) return;
      var lastSrc=String(s&&(s.appLastSource||s.app_last_source)||'').trim();
      var lastEv=String(s&&(s.appLastEvent||s.app_last_event)||'').trim();
      var enabled=!!(s&&(s.appStateEnabled||s.app_state_enabled));
      var confidence=String(s&&(s.appConfidence||s.app_confidence)||'').trim();
      var ageMs=Number(s&&(s.appAgeMs!=null?s.appAgeMs:s.app_age_ms))||0;
      var msg=String(s&&(s.appMessage||s.app_message)||'').trim();
      var taskId=String(s&&(s.appTaskId||s.app_task_id)||'').trim();
      var sessionId=String(s&&(s.appSessionId||s.app_session_id)||'').trim();
      // Snapshot-only: never re-derive light from lastEvent on the FE.
      var light=String(s&&(s.appStatus||s.app_status)||'').trim()||'idle';
      // Event-driven only: hide quiet idle so the bar is not permanently sticky.
      if(!enabled || (!lastEv && !lastSrc) || light==='idle'){
        overlayAppMeta.hidden=true;
        if(overlayAppMetaRow) overlayAppMetaRow.textContent='';
        if(overlayAppMetaTask){
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
        overlayAppMeta.removeAttribute('title');
        overlayAppMeta.removeAttribute('data-light');
        wrap.classList.remove('is-pass-through');
        return;
      }
      var bits=[lightStatusLabel(light)];
      if(lastSrc==='codex_hook'||lastSrc==='codex_app') bits.push('Hook');
      else if(lastSrc) bits.push(statusSourceLabel(lastSrc));
      var age=formatAgeMs(ageMs);
      if(age) bits.push(age);
      if(confidence==='low') bits.push('推断');
      if(overlayAppMetaRow) overlayAppMetaRow.textContent=bits.join(' · ');
      else overlayAppMeta.textContent=bits.join(' · ');

      var taskBits=[];
      if(msg) taskBits.push(msg);
      var tid=shortId(taskId);
      var sid=shortId(sessionId);
      if(tid) taskBits.push('任务 '+tid);
      if(sid) taskBits.push('会话 '+sid);
      if(overlayAppMetaTask){
        if(taskBits.length){
          overlayAppMetaTask.textContent=taskBits.join(' · ');
          overlayAppMetaTask.hidden=false;
        } else {
          overlayAppMetaTask.textContent='';
          overlayAppMetaTask.hidden=true;
        }
      }

      var tipParts=[lightStatusLabel(light), statusSourceLabel(lastSrc)||lastSrc];
      if(age) tipParts.push(age);
      if(confidence) tipParts.push('置信度 '+confidence);
      if(msg) tipParts.push(msg);
      if(taskId) tipParts.push('任务 '+taskId);
      if(sessionId) tipParts.push('会话 '+sessionId);
      if(lastEv) tipParts.push('事件 '+lastEv);
      overlayAppMeta.title=tipParts.filter(Boolean).join(' · ');
      overlayAppMeta.hidden=false;
      overlayAppMeta.setAttribute('data-source', lastSrc||'');
      overlayAppMeta.setAttribute('data-light', light);
      overlayAppMeta.setAttribute('data-confidence', confidence||'');
      overlayAppMeta.setAttribute('data-enabled', '1');
      wrap.classList.toggle('is-pass-through', light==='needs_input' && enabled);
      if(statusChip){
        statusChip.setAttribute('data-status', light);
        statusChip.setAttribute('data-light', light);
      }
    }

    function sourceClass(kind, cellId){
      if(cellId==='JOY') return '';
      if(kind==='screen') return ' is-screen-only';
      if(kind==='advanced') return ' is-advanced-only';
      return '';
    }

    function clearLocalTimer(){
      if(localStatusTimer){ clearTimeout(localStatusTimer); localStatusTimer=null; }
    }

    var backendAppStatus='idle';
    var backendAppLightsOn=false;

    /** Local key feedback overrides; long-lived light comes from snapshot only. */
    function effectivePadStatus(){
      if(localPadStatus!=='idle') return localPadStatus;
      if(backendAppLightsOn && backendAppStatus && backendAppStatus!=='idle') return backendAppStatus;
      return backendPadStatus||'idle';
    }

    function applyPadLightGlow(s){
      var appOn=!!(s&&(s.appStateEnabled||s.app_state_enabled));
      var appSt=String(s&&(s.appStatus||s.app_status)||'').trim()||'idle';
      backendAppLightsOn=appOn;
      backendAppStatus=appSt;
      var padSt=effectivePadStatus();
      var light=appOn ? (appSt||'idle') : padSt;
      wrap.setAttribute('data-light', light);

      // Soft RGB Output Adapter: color only from snapshot.rgb (Rust), never FE palette.
      var rgb=null;
      if(s && s.rgb && s.rgb.r!=null) rgb=s.rgb;
      if(!rgb){
        wrap.classList.remove('has-rgb-glow');
        wrap.style.removeProperty('--overlay-rgb-glow');
        return;
      }
      wrap.classList.add('has-rgb-glow');
      wrap.style.setProperty('--overlay-rgb-glow', 'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.42)');
    }

    function syncEncSwitchDom(){
      if(!grid) return;
      var enc=grid.querySelector('[data-micro-key="ENC"]');
      if(!enc) return;
      enc.classList.toggle('is-mode-on', !!padEnabled);
      enc.classList.toggle('is-mode-off', !padEnabled);
      var sw=enc.querySelector('[data-act="pad-mode"]');
      if(sw){
        sw.classList.toggle('is-on', !!padEnabled);
        sw.setAttribute('aria-checked', padEnabled?'true':'false');
        sw.setAttribute('title', padEnabled?'Codex 场景模式':'数字键模式');
      }
      enc.setAttribute('aria-label', padEnabled?'Codex 场景模式':'数字键模式');
    }

    function syncJoyDom(){
      if(!grid) return;
      var joy=grid.querySelector('[data-micro-key="JOY"]');
      if(!joy) return;
      joy.classList.toggle('is-joy-on', !!joyNavOpen);
      joy.classList.toggle('is-nav-live', !!padEnabled);
      var stick=joy.querySelector('.micro-hw__joy-stick');
      if(stick) stick.classList.toggle('is-on', !!joyNavOpen);
    }

    function applyLocalStatusDom(){
      var padSt=effectivePadStatus();
      var showListen=padSt==='listening' && !holdUiReleased;
      wrap.classList.toggle('is-status-open', showListen || padSt==='failed');
      wrap.classList.toggle('is-minimized', !!localMinimized);
      wrap.classList.toggle('is-mode-codex', padMode==='codex');
      wrap.classList.toggle('is-mode-numpad', padMode==='numpad');
      wrap.classList.toggle('is-joy-open', !!joyNavOpen);
      // Digits are first-class in numpad layout — do not dim the whole pad.
      wrap.classList.toggle('is-pad-off', false);
      var rootEl=document.querySelector('.root');
      if(rootEl) rootEl.classList.toggle('is-mini-host', !!localMinimized);
      if(overlayBody) overlayBody.classList.toggle('has-nav-rail', !!joyNavOpen);
      if(navRail){
        navRail.classList.toggle('is-arrows-live', !!joyArrowsLive);
        if(joyNavOpen){
          navRail.hidden=false;
          navRail.removeAttribute('hidden');
        } else {
          navRail.hidden=true;
          navRail.setAttribute('hidden','');
        }
      }
      if(navRailCaption){
        if(joyNavOpen && joyContextHint){
          navRailCaption.textContent=joyContextHint;
          navRailCaption.hidden=false;
        } else {
          navRailCaption.textContent='';
          navRailCaption.hidden=true;
        }
      }
      syncEncSwitchDom();
      syncJoyDom();
      if(miniLeds) miniLeds.setAttribute('data-pad-status', padSt);
      if(statusChip){
        statusChip.setAttribute('data-status', padSt);
      }
    }

    function mergeRunStatus(cellId, backendRun){
      var br=String(backendRun||'idle');
      if(localPadStatus==='listening' && localStatusMicro===cellId){
        return activePtr===cellId ? 'listening' : 'idle';
      }
      if(localPadStatus!=='idle' && localStatusMicro===cellId) return localPadStatus;
      return br;
    }

    function releaseKeyVisual(id){
      if(!grid||!id) return;
      grid.querySelectorAll('[data-micro-key="'+id+'"]').forEach(function(el){
        el.classList.remove('is-pressed','is-active');
        el.setAttribute('data-run-status','idle');
      });
    }

    function setLocalStatus(status, microId){
      localPadStatus=status||'idle';
      localStatusMicro=localPadStatus==='idle' ? '' : String(microId||localStatusMicro||'');
      applyLocalStatusDom();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var br=el.getAttribute('data-backend-run')||'idle';
        el.setAttribute('data-run-status', mergeRunStatus(id, br));
      });
      clearLocalTimer();
      if(localPadStatus==='running'){
        localStatusTimer=setTimeout(function(){ setLocalStatus('done', localStatusMicro); }, STATUS_MS.running);
      } else if(localPadStatus==='done'){
        localStatusTimer=setTimeout(function(){
          setLocalStatus('idle', '');
          lastGridSig='';
          pull();
        }, STATUS_MS.done);
      } else if(localPadStatus==='failed'){
        localStatusTimer=setTimeout(function(){ setLocalStatus('idle', ''); }, STATUS_MS.failed);
      }
    }

    function encInnerHtml(codexOn){
      return '<span class="micro-hw__enc" aria-hidden="true">'
        +'<span class="micro-hw__mode-switch'+(codexOn?' is-on':'')+'" data-act="pad-mode" role="switch" aria-checked="'+(codexOn?'true':'false')+'" title="'+(codexOn?'Codex 场景模式':'数字键模式')+'">'
        +'<span class="micro-hw__mode-label micro-hw__mode-label--on">ON</span>'
        +'<span class="micro-hw__mode-label micro-hw__mode-label--off">OFF</span>'
        +'<span class="micro-hw__mode-knob"></span>'
        +'</span>'
        +'</span>';
    }

    function joyInnerHtml(open){
      return '<span class="micro-hw__joy-stick'+(open?' is-on':'')+'" aria-hidden="true">'
        +'<span class="micro-hw__joy-stem"></span>'
        +'<span class="micro-hw__joy-top"><span class="micro-hw__joy-cross"></span></span>'
        +'</span>';
    }

    function fireNav(nav){
      var now=Date.now();
      if(nav===joyDrag.lastNav && now-joyDrag.lastFire<110) return;
      if(joyDrag.inflight) return;
      joyDrag.lastNav=nav;
      joyDrag.lastFire=now;
      joyDrag.inflight=true;
      invoke('cmd_codex_micro_pad_fire',{microKeyId:nav,phase:'down'}).then(function(res){
        if(res&&!res.ok&&res.reason==='numpad_mode') toastNumpadMode();
      }).catch(function(){}).then(function(){
        joyDrag.inflight=false;
      });
    }

    function stopNavRepeat(){
      if(navRepeatTimer){ clearInterval(navRepeatTimer); navRepeatTimer=null; }
      joyDrag.lastNav='';
      joyDrag.inflight=false;
      if(navRail){
        navRail.querySelectorAll('.overlay-nav-key').forEach(function(k){ k.classList.remove('is-lit'); });
      }
    }

    function startNavRepeat(nav, keyEl){
      if(!padEnabled||!joyNavOpen) return;
      stopNavRepeat();
      if(keyEl) keyEl.classList.add('is-lit');
      fireNav(nav);
      navRepeatTimer=setInterval(function(){ fireNav(nav); }, 160);
    }

    function ensureNavPointerUp(){
      if(window._navPtrBound) return;
      window._navPtrBound=true;
      function endNav(){ stopNavRepeat(); }
      window.addEventListener('pointerup', endNav, true);
      window.addEventListener('pointercancel', endNav, true);
      window.addEventListener('mouseup', endNav, true);
      window.addEventListener('blur', endNav);
    }

    function setFootHint(text){
      if(text) toast(text);
    }

    function fire(id,phase){
      var isNav=/^NAV_/.test(id);
      return invoke('cmd_codex_micro_pad_fire',{microKeyId:id,phase:phase}).then(function(res){
        if(isNav) return res;
        if(!res) return res;
        var reason=String(res.reason||'');
        if(reason==='hold_down'){
          holdLockId=id;
          holdSuppressCancel=true;
          holdUiReleased=false;
          setLocalStatus('listening', id);
        } else if(reason==='hold_up'){
          holdLockId='';
          holdSuppressCancel=false;
          holdUiReleased=false;
          setLocalStatus('done', id);
        }
        else if(reason==='hold_busy'){
          setFootHint('听写进行中');
        }
        else if(reason==='numpad_mode'){
          // Trust backend snapshot — do not force local OFF while switch still paints ON.
          toastNumpadMode();
          lastGridSig='';
          pull();
        }
        else if(reason==='fired' || reason==='enhance_pulse' || reason==='healing' || reason==='numpad_pulse'){
          setLocalStatus('running', id);
          if(id==='ENC' && phase==='down') toast('召唤 Codex');
        }
        else if(!res.ok && phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
          setFootHint(REASON_HINT[reason]||DEFAULT_FOOT);
        }
        return res;
      }).catch(function(){
        if(phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
        }
        return null;
      });
    }

    function bindJoy(el){
      el.addEventListener('pointerdown',function(e){
        if(e.button!=null&&e.button!==0) return;
        e.preventDefault(); e.stopPropagation();
        el.classList.add('is-pressed','is-active');
      });
      function joyUp(){ el.classList.remove('is-pressed','is-active'); }
      el.addEventListener('pointerup',joyUp);
      el.addEventListener('pointercancel',joyUp);
      el.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        if(!padEnabled){
          toastNumpadMode();
          return;
        }
        invoke('cmd_codex_micro_overlay_toggle_joy_panel',{}).then(function(open){
          joyNavOpen=!!open;
          applyLocalStatusDom();
          return invoke('cmd_codex_micro_overlay_get_state',{});
        }).then(function(s){
          if(s) render(s);
          if(!joyNavOpen){
            toast('方向轨已关闭');
            return;
          }
          toast(joyContextHint||(joyArrowsLive?'方向轨已开 · 物理方向键已接入':'方向轨已开'));
        }).catch(function(){ toast('无法切换方向轨'); });
      });
    }

    function bindEnc(el){
      var modeSw=el.querySelector('[data-act="pad-mode"]');
      if(modeSw){
        modeSw.addEventListener('pointerdown',function(e){
          e.preventDefault(); e.stopPropagation();
          if(e.button!=null&&e.button!==0) return;
          modeSw.classList.add('is-pressed');
        });
        function clearPress(){ modeSw.classList.remove('is-pressed'); }
        modeSw.addEventListener('pointerup',clearPress);
        modeSw.addEventListener('pointerleave',clearPress);
        modeSw.addEventListener('pointercancel',clearPress);
        modeSw.addEventListener('click',function(e){
          e.preventDefault(); e.stopPropagation();
          modeSw.classList.remove('is-pressed');
          invoke('cmd_codex_micro_overlay_toggle_pad_mode',{}).then(function(mode){
            padMode=String(mode||'')==='numpad'?'numpad':'codex';
            padEnabled=padMode==='codex';
            if(!padEnabled) joyNavOpen=false;
            applyLocalStatusDom();
            // Rebuild grid so Codex AG layout ↔ standard numpad positions.
            lastGridSig='';
            render(Object.assign({}, lastSnap, {
              visible:true,
              enabled:padEnabled,
              padMode:padMode,
              joyNavPanelOpen:joyNavOpen
            }));
            toast(padMode==='codex'?'Codex 场景模式':'数字键模式');
          }).catch(function(err){
            var msg=String((err&&err.message)||err||'');
            if(msg.indexOf('no_mapping')>=0) toast('请先创建并启用 Codex 工作场景');
            else toast('无法切换模式');
          });
        });
      }
      el.addEventListener('pointerdown',function(e){
        if(e.button!=null&&e.button!==0) return;
        if(e.target&&e.target.closest&&e.target.closest('[data-act="pad-mode"]')) return;
        e.preventDefault(); e.stopPropagation();
        el.classList.add('is-pressed','is-active');
      });
      function encUp(){ el.classList.remove('is-pressed','is-active'); }
      el.addEventListener('pointerup',encUp);
      el.addEventListener('pointercancel',encUp);
      el.addEventListener('click',function(e){
        if(e.target&&e.target.closest&&e.target.closest('[data-act="pad-mode"]')) return;
        e.preventDefault(); e.stopPropagation();
        fire('ENC','down');
      });
    }

    function bindNavRail(){
      ensureNavPointerUp();
      if(!navRail||navRail._bound) return;
      navRail._bound=true;
      navRail.querySelectorAll('[data-nav]').forEach(function(btn){
        var dir=btn.getAttribute('data-nav');
        var icon=dir==='NAV_UP'?SVG_ARROW.up:dir==='NAV_DOWN'?SVG_ARROW.down:dir==='NAV_LEFT'?SVG_ARROW.left:SVG_ARROW.right;
        btn.innerHTML=icon;
        btn.addEventListener('pointerdown',function(e){
          if(e.button!=null&&e.button!==0) return;
          e.preventDefault(); e.stopPropagation();
          try{ btn.setPointerCapture(e.pointerId); }catch(_){}
          startNavRepeat(dir, btn);
        });
        btn.addEventListener('pointerup',function(e){
          stopNavRepeat();
          try{ btn.releasePointerCapture(e.pointerId); }catch(_){}
        });
        btn.addEventListener('pointercancel',stopNavRepeat);
        btn.addEventListener('lostpointercapture',stopNavRepeat);
      });
    }

    function bindFire(){
      ensureOverlayHoldPointerUp();
      bindNavRail();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        if(el.classList.contains('micro-hw__key--placeholder')) return;
        var id=el.getAttribute('data-micro-key');
        if(id==='JOY'){ bindJoy(el); return; }
        if(id==='ENC'){ bindEnc(el); return; }
        el.addEventListener('pointerdown',function(e){
          if(e.button!=null&&e.button!==0) return;
          var numpadTap=isNumpadKeyId(id);
          if(!padEnabled && !numpadTap){
            toastNumpadMode();
            return;
          }
          e.preventDefault();
          e.stopPropagation();
          activePtr=id;
          if(id==='ACT10'){
            holdLockId=id;
            holdSuppressCancel=true;
            holdUiReleased=false;
          }
          el.classList.add('is-pressed','is-active');
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
          fire(id,'down');
        });
        // ACT10 hold: release via window pointerup (ensureOverlayHoldPointerUp).
        // Also bind element pointerup so mic ends even if capture fails.
        el.addEventListener('pointerup',function(e){
          if(e.button!=null&&e.button!==0) return;
          if(activePtr!==id) return;
          if(id==='ACT10'){
            activePtr='';
            holdLockId='';
            holdSuppressCancel=false;
            holdUiReleased=true;
            el.classList.remove('is-pressed','is-active');
            fire(id,'up');
            return;
          }
          activePtr='';
          el.classList.remove('is-pressed','is-active');
          fire(id,'up');
        });
        el.addEventListener('pointercancel',function(e){
          if(activePtr!==id) return;
          if(id==='ACT10' && holdSuppressCancel) return;
          activePtr='';
          if(id==='ACT10'){
            holdLockId='';
            holdSuppressCancel=false;
          }
          el.classList.remove('is-pressed','is-active');
        });
      });
    }

    function gridSignature(s,map,active){
      // Include padMode so Codex ↔ numpad swaps rebuild the physical key grid.
      // statusSource must be included so native→fallback with same idle still updates styles.
      var parts=(s.cells||[]).map(function(c){
        if(!c||!c.microKeyId) return '';
        return c.microKeyId+':'+(c.bound?1:0)+':'+(c.uiIconId||'')+':'+(c.sourceKind||'')+':'+(c.runStatus||'')+':'+(c.statusSource||'')+':'+(c.nativeRunStatus||'')+':'+(c.contextRank||'')+':'+(c.contextHint||'');
      });
      var mode=String(s.padMode||'')==='numpad'?'numpad':(s.enabled===false?'numpad':'codex');
      return [!!s.visible,!!s.softwareEnhanceEnabled,String(s.connectionState||''),active,mode,parts.join('|')].join(';');
    }

    function patchGridRunStates(map,active){
      if(!grid) return;
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var info=map[id]||{};
        var backendRun=String(info.runStatus||'idle');
        var src=String(info.statusSource||'inferred');
        el.setAttribute('data-backend-run',backendRun);
        el.setAttribute('data-run-status',mergeRunStatus(id,backendRun));
        el.setAttribute('data-status-source',src);
        var rank=String(info.contextRank||'').trim();
        el.classList.toggle('is-context-emphasize',rank==='emphasize');
        el.classList.toggle('is-context-dim',rank==='dim');
        if(info.contextHint) el.setAttribute('data-context-hint',String(info.contextHint));
        else el.removeAttribute('data-context-hint');
        var pressed=activePtr===id;
        el.classList.toggle('is-pressed',pressed);
        el.classList.toggle('is-active',pressed);
      });
    }

    function shouldDeferGridRebuild(){
      return !!holdLockId || localPadStatus==='listening' || !!activePtr;
    }

    var lastSnap={};
    var APP_STATE_URL='http://127.0.0.1:8796/api/codex-app/state';

    function mergeAppLightIntoSnap(base, j){
      var st=j&&j.state?j.state:{};
      var out=Object.assign({}, base||{});
      out.appStateEnabled=!!(j&&j.appStateEnabled);
      out.appStatus=String(j&&j.appStatus||st.status||'').trim()||'idle';
      out.appLastEvent=String(st.lastEvent||st.event||'').trim();
      out.appLastSource=String(st.lastSource||st.source||'').trim();
      if(j&&j.softRgb&&j.softRgb.r!=null){
        out.rgb={r:j.softRgb.r,g:j.softRgb.g,b:j.softRgb.b};
      } else if(j&&j.appStateEnabled){
        // Lights on + idle/no softRgb: clear sticky vendor mint.
        out.rgb=null;
      }
      return out;
    }

    /** Bypass wedged Tauri IPC: poll Hook state over loopback HTTP for pad color. */
    function pullAppLightHttp(){
      fetch(APP_STATE_URL,{method:'GET',cache:'no-store'}).then(function(r){
        return r.ok?r.json():null;
      }).then(function(j){
        if(!j||!j.ok) return;
        lastSnap=mergeAppLightIntoSnap(lastSnap,j);
        applyPadLightGlow(lastSnap);
        applyAppMetaChip(lastSnap);
      }).catch(function(){});
    }

    function render(s){
      s=s||{};
      lastSnap=Object.assign({}, lastSnap, s);
      wrap.classList.toggle('is-visible',!!s.visible);
      if(!s.visible){ holdLockId=''; applyAppMetaChip(s); return; }
      padEnabled=!!s.enabled;
      padMode=String(s.padMode||'')==='numpad'?'numpad':(padEnabled?'codex':'numpad');
      joyNavOpen=!!s.joyNavPanelOpen && padMode==='codex';
      joyArrowsLive=!!s.joyArrowsLive && joyNavOpen;
      joyContextHint=String(s.joyContextHint||s.joy_context_hint||'').trim();
      requireNumLockOff=!!s.requireNumLockOff;
      numLockBlocking=!!s.numLockBlocking;
      enhanceOn=!!s.softwareEnhanceEnabled;
      localMinimized=!!s.minimized;
      applyPadLightGlow(s);
      applyAppMetaChip(s);
      var map=cellMap(s.cells);
      var active=String(s.activeMicroKeyId||'');
      backendPadStatus=String(s.padStatus||'idle');
      var snapMicro=String(s.statusMicroKeyId||'');
      if(backendPadStatus==='listening' || backendPadStatus==='running' || backendPadStatus==='done' || backendPadStatus==='failed'){
        if(localPadStatus!==backendPadStatus || localStatusMicro!==snapMicro){
          if(backendPadStatus==='listening'){
            clearLocalTimer();
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
            if(snapMicro && activePtr) holdLockId=snapMicro;
          } else if(!localStatusTimer) {
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
          }
        }
      } else if((backendPadStatus==='done' || backendPadStatus==='idle') && snapMicro==='ACT10'){
        activePtr='';
        holdLockId='';
        holdSuppressCancel=false;
        holdUiReleased=false;
        releaseKeyVisual('ACT10');
        if(!localStatusTimer){
          localPadStatus=backendPadStatus;
          localStatusMicro=backendPadStatus==='idle' ? '' : snapMicro;
        }
      } else if(backendPadStatus==='idle' && !localStatusTimer && localPadStatus!=='listening' && localPadStatus!=='running' && !activePtr){
        localPadStatus='idle';
        localStatusMicro='';
        if(!holdSuppressCancel) holdLockId='';
      }
      var sig=gridSignature(s,map,active);
      if(shouldDeferGridRebuild()){
        (s.cells||[]).forEach(function(c){ if(c&&c.microKeyId) boundKeys[c.microKeyId]=!!c.bound; });
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      if(sig===lastGridSig){
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      lastGridSig=sig;
      boundKeys={};
      grid.innerHTML=activeLayout().map(function(cell){
        var info=map[cell.id]||{};
        var bound=!!info.bound;
        var isNp=cell.kind==='numpad';
        if(isNp) bound=true;
        boundKeys[cell.id]=bound;
        var iconId=info.uiIconId||cell.icon||'empty';
        var kind=String(info.sourceKind||'none');
        var backendRun=String(info.runStatus||'idle');
        var runSt=mergeRunStatus(cell.id, backendRun);
        var statusSrc=String(info.statusSource||'inferred');
        var cls='micro-hw__key micro-hw__key--'+cell.kind + sourceClass(kind, cell.id);
        if(cell.span===2) cls+=' micro-hw__key--span2';
        if(cell.rowSpan===2) cls+=' micro-hw__key--rowspan2';
        if(isNp) cls+=' is-bound';
        else if(bound) cls+=' is-bound';
        else if(cell.id!=='ENC' && cell.id!=='JOY') cls+=' is-route-disabled';
        if(cell.id==='ENC'){
          cls+= padEnabled ? ' is-mode-on' : ' is-mode-off';
        }
        if(cell.id==='JOY'){
          if(joyNavOpen) cls+=' is-joy-on';
          if(padEnabled) cls+=' is-nav-live';
        }
        if(active&&active===cell.id&&activePtr===cell.id) cls+=' is-pressed is-active';
        var ctxRank=String(info.contextRank||'').trim();
        if(ctxRank==='emphasize') cls+=' is-context-emphasize';
        else if(ctxRank==='dim') cls+=' is-context-dim';
        var ctxHint=String(info.contextHint||'').trim();
        var agAttr=cell.ag!=null ? ' data-ag="'+cell.ag+'"' : '';
        var style='grid-row:'+cell.row+(cell.rowSpan?' / span '+cell.rowSpan:'')
          +';grid-column:'+cell.col+(cell.span?' / span '+cell.span:'')+';';
        var tag=cell.kind==='placeholder'?'div':'button';
        var type=tag==='button'?' type="button"':'';
        var inner;
        if(cell.id==='ENC'){
          inner=encInnerHtml(padEnabled);
        } else if(cell.id==='JOY'){
          inner=joyInnerHtml(joyNavOpen);
        } else if(isNp){
          inner='<span class="micro-hw__digit" aria-hidden="true">'+escHtml(cell.label||'')+'</span>';
        } else {
          inner='<span class="micro-hw__icon">'+(ICON[iconId]||ICON.empty)+'</span>';
        }
        if(cell.id!=='ENC' && !isNp){
          var metaName=String(info.label||'').trim();
          var metaChord=String(info.sub||'').trim();
          if(cell.id==='JOY' && !metaName) metaName='方向轨';
          if(metaName || metaChord){
            inner+='<span class="micro-hw__meta" aria-hidden="true">'
              +(metaName?'<span class="micro-hw__meta-name">'+escHtml(metaName)+'</span>':'')
              +(metaChord?'<span class="micro-hw__meta-chord">'+escHtml(metaChord)+'</span>':'')
              +'</span>';
          }
        }
        var npAriaMap={'/':'除','*':'乘','-':'减','+':'加','.':'小数点','↵':'回车'};
        var aria=cell.id==='ENC'
          ? (padEnabled?'Codex 场景模式':'数字键模式')
          : (cell.id==='JOY'
            ? (joyNavOpen?(joyContextHint||'方向轨已开'):'打开方向轨')
            : (isNp ? (npAriaMap[cell.label]||String(cell.label||cell.id)) : ([info.label, info.sub].filter(Boolean).join(' · ') || cell.id)));
        if(cell.ag!=null && statusSrc){
          aria+=(aria?' · ':'')+statusSourceLabel(statusSrc);
        }
        var actTitle='';
        if(cell.id.indexOf('ACT')===0){
          if(ctxHint) actTitle=ctxHint;
          else if(cell.id==='ACT10') actTitle='按住说话';
        }
        return '<'+tag+type+' class="'+cls+'" data-micro-key="'+cell.id+'"'+agAttr
          +' data-run-status="'+runSt+'" data-backend-run="'+backendRun+'" data-status-source="'+escHtml(statusSrc)+'" data-source-kind="'+kind+'"'
          +(ctxHint?' data-context-hint="'+escHtml(ctxHint)+'"':'')
          +' style="'+style+'"'
          +' aria-label="'+escHtml(aria)+'"'
          +(actTitle?' title="'+escHtml(actTitle)+'"':'')
          +(cell.id==='ENC'?' title="召唤 Codex"':'')
          +(cell.id==='JOY'?' title="'+(joyNavOpen?(joyContextHint||'方向轨已开'):'打开方向轨')+'"':'')
          +(isNp?' title="'+escHtml(aria)+'"':'')
          +'>'+inner+'</'+tag+'>';
      }).join('');
      applyLocalStatusDom();
      bindFire();
    }

    function dismiss(){
      invoke('cmd_codex_micro_overlay_dismiss',{}).catch(function(){});
    }

    function isDragBlocked(target){
      return !!(target && target.closest && target.closest('[data-micro-key],[data-nav],[data-act],button,a,input,select,textarea'));
    }

    wrap.addEventListener('pointerdown',function(e){
      if(e.button!=null&&e.button!==0) return;
      if(isDragBlocked(e.target)) return;
      dragging=true;
      invoke('cmd_codex_micro_overlay_start_drag',{}).catch(function(){});
    });
    window.addEventListener('pointerup',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });
    window.addEventListener('pointercancel',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });

    document.querySelectorAll('[data-act="close"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        dismiss();
      });
    });

    document.querySelectorAll('[data-act="minimize"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:true}).catch(function(){});
      });
    });

    document.querySelectorAll('[data-act="expand"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:false}).catch(function(){});
      });
    });

    if(listen){ listen('codex_micro_overlay_state',function(ev){ render(ev.payload); }).catch(function(){}); }
    function pull(){
      if(holdLockId||localPadStatus==='listening') return;
      invoke('cmd_codex_micro_overlay_get_state',{}).then(function(s){ render(s); }).catch(function(){});
    }
    pull();
    pullAppLightHttp();
    setInterval(pull, 1500);
    setInterval(pullAppLightHttp, 500);
  </script>
</body>
