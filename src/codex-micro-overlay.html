<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Micro</title>
  <link rel="stylesheet" href="css/codex-micro-overlay.css" />
</head>
<body>
  <div class="root">
    <div class="wrap" id="wrap">
      <div class="overlay-mini" id="overlayMini">
        <span class="overlay-mini__mark" aria-hidden="true">M</span>
        <div class="overlay-mini__leds" id="miniLeds" data-pad-status="idle" aria-hidden="true">
          <span class="overlay-mini__led"></span>
          <span class="overlay-mini__led"></span>
          <span class="overlay-mini__led"></span>
        </div>
        <button type="button" class="overlay-mini__btn" data-act="expand" title="展开" aria-label="展开">▢</button>
        <button type="button" class="overlay-mini__btn" data-act="close" title="关闭" aria-label="关闭">×</button>
      </div>

      <div class="overlay-full" id="overlayFull">
        <header class="overlay-chrome">
          <span class="overlay-chrome__title">Codex Micro</span>
          <button type="button" class="overlay-chrome__btn" data-act="minimize" title="最小化" aria-label="最小化">—</button>
          <button type="button" class="overlay-chrome__btn overlay-chrome__btn--close" data-act="close" title="关闭" aria-label="关闭">×</button>
        </header>
        <div class="overlay-body">
          <div class="micro-hw micro-hw--sm">
            <span class="micro-hw__aura" aria-hidden="true"></span>
            <div class="micro-hw__face">
              <span class="micro-hw__brand micro-hw__brand--left" aria-hidden="true">Work Loud | OneTone 2026</span>
              <span class="micro-hw__brand micro-hw__brand--right" aria-hidden="true">You can just build things</span>
              <span class="micro-hw__arrow" aria-hidden="true">↑</span>
              <span class="micro-hw__aux-hole" aria-hidden="true"></span>
              <div class="micro-hw__grid" id="grid"></div>
              <div class="micro-hw__leds" id="leds" data-pad-status="idle" aria-hidden="true">
                <span class="micro-hw__led"></span><span class="micro-hw__led"></span><span class="micro-hw__led"></span>
              </div>
              <span class="micro-hw__build" aria-hidden="true">Let's build</span>
              <div class="status-chip" id="statusChip" data-status="idle"></div>
            </div>
          </div>
          <p class="foot" id="footHint">仅 Codex 前台 · 点击触发</p>
        </div>
      </div>
    </div>
  </div>
  <script>
    var invoke=window.__TAURI_INTERNALS__?function(cmd,args){return window.__TAURI_INTERNALS__.invoke(cmd,args);}:function(){return Promise.resolve();};
    var listen=window.__TAURI__&&window.__TAURI__.event&&window.__TAURI__.event.listen
      ?window.__TAURI__.event.listen.bind(window.__TAURI__.event)
      :(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__):null);

    var LAYOUT=[
      {id:'ENC',kind:'control',row:1,col:1,icon:'codex'},
      {id:'AG00',kind:'agent',row:1,col:2,ag:0,icon:'status'},
      {id:'AG01',kind:'agent',row:1,col:3,ag:1,icon:'plan'},
      {id:'AG02',kind:'agent',row:1,col:4,ag:2,icon:'review'},
      {id:'JOY',kind:'control',row:1,col:5,icon:'empty'},
      {id:'AG03',kind:'agent',row:2,col:2,ag:3,icon:'folder'},
      {id:'AG04',kind:'agent',row:2,col:3,ag:4,icon:'agent'},
      {id:'AG05',kind:'agent',row:2,col:4,ag:5,icon:'cloud'},
      {id:'ACT06',kind:'command',row:3,col:2,icon:'fast'},
      {id:'ACT07',kind:'command',row:3,col:3,icon:'palette'},
      {id:'ACT08',kind:'command',row:3,col:4,icon:'reject'},
      {id:'ACT09',kind:'command',row:3,col:5,icon:'fork'},
      {id:'ACT10',kind:'command',row:4,col:2,span:2,icon:'mic'},
      {id:'ACT12',kind:'command',row:4,col:4,icon:'send'}
    ];

    var ICON={
      fast:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 10-14h-7l0-6z"/></svg>',
      reject:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
      fork:'<svg viewBox="0 0 24 24"><path d="M7 4v8a4 4 0 004 4h2a4 4 0 004-4V4"/><path d="M17 4l3 3-3 3M7 4L4 7l3 3"/></svg>',
      mic:'<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3z"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
      send:'<svg viewBox="0 0 24 24"><path d="M4 12h12"/><path d="M12 6l6 6-6 6"/><path d="M20 7v10"/></svg>',
      codex:'<svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z"/></svg>',
      palette:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>',
      status:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
      plan:'<svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>',
      review:'<svg viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
      folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>',
      cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 00.5-8 5.5 5.5 0 00-10.7 1.5A3.5 3.5 0 007 18z"/></svg>',
      agent:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 5v2M12 17v2M5 12h2M17 12h2"/></svg>',
      empty:'<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" stroke-dasharray="3 3"/></svg>'
    };

    var STATUS_LABEL={idle:'',running:'执行中',listening:'听写中',done:'完成',failed:'失败'};
    var REASON_HINT={
      not_foreground:'请切换到 Codex 桌面版窗口',
      unbound:'此键未启用或未绑定快捷键',
      no_profile:'Codex 场景未配置',
      hold_failed:'无法启动听写（请确认 Codex 已打开）',
      invalid_key:'无效按键',
      invalid_phase:'无效操作'
    };
    var DEFAULT_FOOT='仅 Codex 前台 · 点击触发';
    var lastFootHint=DEFAULT_FOOT;
    var boundKeys={};
    var wrap=document.getElementById('wrap');
    var grid=document.getElementById('grid');
    var leds=document.getElementById('leds');
    var miniLeds=document.getElementById('miniLeds');
    var statusChip=document.getElementById('statusChip');
    var footHint=document.getElementById('footHint');
    var activePtr='';
    /** ACT10 hold-to-talk: block grid rebuild while pressed (innerHTML breaks pointer capture). */
    var holdLockId='';
    var holdSuppressCancel=false;
    var holdUiReleased=false;
    var lastGridSig='';
    var localPadStatus='idle';
    var localStatusMicro='';
    var localStatusTimer=null;
    var localMinimized=false;
    var backendPadStatus='idle';
    var STATUS_MS={running:800,done:600,failed:1200};
    var enhanceOn=false;
    var JOY_DIR_MS=3000;
    var joyDirUntil=0;
    var joyDirTimer=null;
    var joyDirKeyHandler=null;
    var dragging=false;
    var overlayHoldInstalled=false;

    function ensureOverlayHoldPointerUp(){
      if(overlayHoldInstalled) return;
      overlayHoldInstalled=true;
      function endOverlayPtr(e){
        if(!activePtr) return;
        if(holdSuppressCancel && e && e.type==='pointercancel') return;
        var id=activePtr;
        activePtr='';
        if(id==='ACT10') holdSuppressCancel=false;
        if(id==='ACT10') holdUiReleased=true;
        releaseKeyVisual(id);
        applyLocalStatusDom();
        fire(id,'up');
      }
      window.addEventListener('pointerup',endOverlayPtr,true);
      window.addEventListener('pointercancel',endOverlayPtr,true);
      window.addEventListener('mouseup',endOverlayPtr,true);
      window.addEventListener('pointermove',function(e){
        if(!activePtr) return;
        if(typeof e.buttons==='number' && e.buttons!==0 && (e.buttons&1)!==0) return;
        endOverlayPtr(e);
      },true);
    }

    function cellMap(cells){
      var map={};
      (cells||[]).forEach(function(c){ if(c&&c.microKeyId) map[c.microKeyId]=c; });
      return map;
    }

    function sourceClass(kind){
      if(kind==='screen') return ' is-screen-only';
      if(kind==='advanced') return ' is-advanced-only';
      return '';
    }

    function clearLocalTimer(){
      if(localStatusTimer){ clearTimeout(localStatusTimer); localStatusTimer=null; }
    }

    function effectivePadStatus(){
      if(localPadStatus!=='idle') return localPadStatus;
      return backendPadStatus||'idle';
    }

    function applyRgbGlow(rgb){
      if(!rgb||rgb.r==null){
        wrap.classList.remove('has-rgb-glow');
        return;
      }
      wrap.classList.add('has-rgb-glow');
      wrap.style.setProperty('--overlay-rgb-glow', 'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0.32)');
    }

    function applyLocalStatusDom(){
      var padSt=effectivePadStatus();
      var showListen=padSt==='listening' && !holdUiReleased;
      wrap.classList.toggle('is-status-open', showListen || padSt==='failed');
      wrap.classList.toggle('is-minimized', !!localMinimized);
      if(leds) leds.setAttribute('data-pad-status', padSt);
      if(miniLeds) miniLeds.setAttribute('data-pad-status', padSt);
      if(statusChip){
        statusChip.setAttribute('data-status', padSt);
        statusChip.textContent=STATUS_LABEL[padSt]||'';
      }
      if(footHint){
        if(showListen) footHint.textContent='听写中 · 松开结束';
        else if(padSt==='running') footHint.textContent='执行中';
        else if(padSt==='failed') footHint.textContent=lastFootHint||'触发失败';
        else if(joyDirUntil && Date.now()<=joyDirUntil) footHint.textContent='方向模式 · 方向键/Enter/Esc';
        else footHint.textContent=DEFAULT_FOOT;
      }
    }

    function mergeRunStatus(cellId, backendRun){
      var br=String(backendRun||'idle');
      if(localPadStatus==='listening' && localStatusMicro===cellId){
        return activePtr===cellId ? 'listening' : 'idle';
      }
      if(localPadStatus!=='idle' && localStatusMicro===cellId) return localPadStatus;
      return br;
    }

    function releaseKeyVisual(id){
      if(!grid||!id) return;
      grid.querySelectorAll('[data-micro-key="'+id+'"]').forEach(function(el){
        el.classList.remove('is-pressed','is-active');
        el.setAttribute('data-run-status','idle');
      });
    }

    function setLocalStatus(status, microId){
      localPadStatus=status||'idle';
      localStatusMicro=localPadStatus==='idle' ? '' : String(microId||localStatusMicro||'');
      applyLocalStatusDom();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var br=el.getAttribute('data-backend-run')||'idle';
        el.setAttribute('data-run-status', mergeRunStatus(id, br));
      });
      clearLocalTimer();
      if(localPadStatus==='running'){
        localStatusTimer=setTimeout(function(){ setLocalStatus('done', localStatusMicro); }, STATUS_MS.running);
      } else if(localPadStatus==='done'){
        localStatusTimer=setTimeout(function(){
          setLocalStatus('idle', '');
          lastGridSig='';
          pull();
        }, STATUS_MS.done);
      } else if(localPadStatus==='failed'){
        localStatusTimer=setTimeout(function(){ setLocalStatus('idle', ''); }, STATUS_MS.failed);
      }
    }

    function exitJoyDir(){
      joyDirUntil=0;
      if(joyDirTimer){ clearTimeout(joyDirTimer); joyDirTimer=null; }
      if(joyDirKeyHandler){
        window.removeEventListener('keydown', joyDirKeyHandler, true);
        joyDirKeyHandler=null;
      }
      grid.querySelectorAll('[data-micro-key="JOY"]').forEach(function(el){ el.classList.remove('is-joy-dir'); });
      applyLocalStatusDom();
    }

    function enterJoyDir(){
      if(!enhanceOn) return;
      exitJoyDir();
      joyDirUntil=Date.now()+JOY_DIR_MS;
      grid.querySelectorAll('[data-micro-key="JOY"]').forEach(function(el){ el.classList.add('is-joy-dir'); });
      joyDirKeyHandler=function(e){
        if(!joyDirUntil || Date.now()>joyDirUntil){ exitJoyDir(); return; }
        var nav=null;
        if(e.key==='ArrowUp') nav='NAV_UP';
        else if(e.key==='ArrowDown') nav='NAV_DOWN';
        else if(e.key==='ArrowLeft') nav='NAV_LEFT';
        else if(e.key==='ArrowRight') nav='NAV_RIGHT';
        else if(e.key==='Enter') nav='NAV_PRESS';
        else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); exitJoyDir(); return; }
        if(!nav) return;
        e.preventDefault(); e.stopPropagation();
        fire(nav,'down').then(function(){ fire(nav,'up'); });
      };
      window.addEventListener('keydown', joyDirKeyHandler, true);
      joyDirTimer=setTimeout(exitJoyDir, JOY_DIR_MS);
      applyLocalStatusDom();
    }

    function setFootHint(text){
      lastFootHint=text||DEFAULT_FOOT;
      if(footHint) footHint.textContent=lastFootHint;
    }

    function fire(id,phase){
      return invoke('cmd_codex_micro_pad_fire',{microKeyId:id,phase:phase}).then(function(res){
        if(!res) return res;
        var reason=String(res.reason||'');
        if(reason==='hold_down'){
          holdLockId=id;
          holdSuppressCancel=true;
          holdUiReleased=false;
          setLocalStatus('listening', id);
        } else if(reason==='hold_up'){
          holdLockId='';
          holdSuppressCancel=false;
          holdUiReleased=false;
          setLocalStatus('done', id);
        }
        else if(reason==='hold_busy'){
          setFootHint('听写进行中');
        }
        else if(reason==='fired' || reason==='enhance_pulse') setLocalStatus('running', id);
        else if(!res.ok && phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
          setFootHint(REASON_HINT[reason]||DEFAULT_FOOT);
        } else if(res.ok && phase==='down'){
          setFootHint(DEFAULT_FOOT);
        }
        return res;
      }).catch(function(){
        if(phase==='down'){
          if(holdLockId===id){
            holdLockId='';
            holdSuppressCancel=false;
          }
          setLocalStatus('failed', id);
        }
        return null;
      });
    }

    function bindFire(){
      ensureOverlayHoldPointerUp();
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        if(el.classList.contains('micro-hw__key--placeholder')) return;
        var id=el.getAttribute('data-micro-key');
        if(id==='JOY' && enhanceOn){
          el.addEventListener('pointerdown',function(e){
            if(e.button!=null&&e.button!==0) return;
            e.preventDefault();
            e.stopPropagation();
            var isCenter=!!(e.target&&e.target.closest&&e.target.closest('.micro-hw__joy'));
            if(isCenter && joyDirUntil && Date.now()<=joyDirUntil){
              fire('NAV_PRESS','down').then(function(){ fire('NAV_PRESS','up'); });
              return;
            }
            enterJoyDir();
          });
          return;
        }
        el.addEventListener('pointerdown',function(e){
          if(e.button!=null&&e.button!==0) return;
          e.preventDefault();
          e.stopPropagation();
          activePtr=id;
          if(id==='ACT10'){
            holdLockId=id;
            holdSuppressCancel=true;
            holdUiReleased=false;
          }
          el.classList.add('is-pressed','is-active');
          try{ el.setPointerCapture(e.pointerId); }catch(_){}
          fire(id,'down');
        });
        if(id==='ENC' && enhanceOn){
          el.addEventListener('wheel',function(e){
            e.preventDefault(); e.stopPropagation();
            var cw=e.deltaY>0||e.deltaX>0;
            var mid=cw?'ENC_CW':'ENC_CC';
            fire(mid,'down').then(function(){ fire(mid,'up'); });
          },{passive:false});
        }
      });
    }

    function gridSignature(s,map,active){
      var parts=(s.cells||[]).map(function(c){
        if(!c||!c.microKeyId) return '';
        return c.microKeyId+':'+(c.bound?1:0)+':'+(c.uiIconId||'')+':'+(c.sourceKind||'')+':'+(c.runStatus||'');
      });
      return [!!s.visible,!!s.softwareEnhanceEnabled,!!s.minimized,active,parts.join('|')].join(';');
    }

    function patchGridRunStates(map,active){
      if(!grid) return;
      grid.querySelectorAll('[data-micro-key]').forEach(function(el){
        var id=el.getAttribute('data-micro-key');
        var info=map[id]||{};
        var backendRun=String(info.runStatus||'idle');
        el.setAttribute('data-backend-run',backendRun);
        el.setAttribute('data-run-status',mergeRunStatus(id,backendRun));
        var pressed=activePtr===id;
        el.classList.toggle('is-pressed',pressed);
        el.classList.toggle('is-active',pressed);
      });
    }

    function shouldDeferGridRebuild(){
      return !!holdLockId || localPadStatus==='listening' || !!activePtr;
    }

    function render(s){
      s=s||{};
      wrap.classList.toggle('is-visible',!!s.visible);
      if(!s.visible){ exitJoyDir(); holdLockId=''; return; }
      enhanceOn=!!s.softwareEnhanceEnabled;
      localMinimized=!!s.minimized;
      applyRgbGlow(s.rgb);
      var map=cellMap(s.cells);
      var active=String(s.activeMicroKeyId||'');
      backendPadStatus=String(s.padStatus||'idle');
      var snapMicro=String(s.statusMicroKeyId||'');
      if(backendPadStatus==='listening' || backendPadStatus==='running' || backendPadStatus==='done' || backendPadStatus==='failed'){
        if(localPadStatus!==backendPadStatus || localStatusMicro!==snapMicro){
          if(backendPadStatus==='listening'){
            clearLocalTimer();
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
            if(snapMicro && activePtr) holdLockId=snapMicro;
          } else if(!localStatusTimer) {
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
          }
        }
      } else if((backendPadStatus==='done' || backendPadStatus==='idle') && snapMicro==='ACT10'){
        activePtr='';
        holdLockId='';
        holdSuppressCancel=false;
        holdUiReleased=false;
        releaseKeyVisual('ACT10');
        if(!localStatusTimer){
          localPadStatus=backendPadStatus;
          localStatusMicro=backendPadStatus==='idle' ? '' : snapMicro;
        }
      } else if(backendPadStatus==='idle' && !localStatusTimer && localPadStatus!=='listening' && localPadStatus!=='running' && !activePtr){
        localPadStatus='idle';
        localStatusMicro='';
        if(!holdSuppressCancel) holdLockId='';
      }
      var sig=gridSignature(s,map,active);
      if(shouldDeferGridRebuild()){
        (s.cells||[]).forEach(function(c){ if(c&&c.microKeyId) boundKeys[c.microKeyId]=!!c.bound; });
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      if(sig===lastGridSig){
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      lastGridSig=sig;
      boundKeys={};
      grid.innerHTML=LAYOUT.map(function(cell){
        var info=map[cell.id]||{};
        var bound=!!info.bound;
        boundKeys[cell.id]=bound;
        var iconId=info.uiIconId||cell.icon||'empty';
        var kind=String(info.sourceKind||'none');
        var backendRun=String(info.runStatus||'idle');
        var runSt=mergeRunStatus(cell.id, backendRun);
        var cls='micro-hw__key micro-hw__key--'+cell.kind + sourceClass(kind);
        if(cell.span===2) cls+=' micro-hw__key--span2';
        if(bound) cls+=' is-bound';
        else cls+=' is-route-disabled';
        if(active&&active===cell.id&&activePtr===cell.id) cls+=' is-pressed is-active';
        if(cell.id==='JOY' && joyDirUntil && Date.now()<=joyDirUntil) cls+=' is-joy-dir';
        var agAttr=cell.ag!=null ? ' data-ag="'+cell.ag+'"' : '';
        var style='grid-row:'+cell.row+';grid-column:'+cell.col+(cell.span?' / span '+cell.span:'')+';';
        var tag=cell.kind==='placeholder'?'div':'button';
        var type=tag==='button'?' type="button"':'';
        var inner=cell.id==='ENC'
          ? '<span class="micro-hw__pwr is-on" aria-hidden="true"><span class="micro-hw__pwr-rocker"></span></span>'
          : (cell.id==='JOY'
            ? '<span class="micro-hw__joy" aria-hidden="true"></span>'
            : '<span class="micro-hw__icon">'+(ICON[iconId]||ICON.empty)+'</span>');
        return '<'+tag+type+' class="'+cls+'" data-micro-key="'+cell.id+'"'+agAttr
          +' data-run-status="'+runSt+'" data-backend-run="'+backendRun+'" data-source-kind="'+kind+'" style="'+style+'"'
          +(cell.id==='ACT10'?' title="小键盘 0 · 按住说话"':'')
          +'>'+inner+'</'+tag+'>';
      }).join('');
      applyLocalStatusDom();
      bindFire();
    }

    function dismiss(){
      invoke('cmd_codex_micro_overlay_dismiss',{}).catch(function(){});
    }

    function isDragBlocked(target){
      return !!(target && target.closest && target.closest('[data-micro-key],[data-act],button,a,input,select,textarea'));
    }

    wrap.addEventListener('pointerdown',function(e){
      if(e.button!=null&&e.button!==0) return;
      if(isDragBlocked(e.target)) return;
      dragging=true;
      invoke('cmd_codex_micro_overlay_start_drag',{}).catch(function(){});
    });
    window.addEventListener('pointerup',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });
    window.addEventListener('pointercancel',function(){
      if(!dragging) return;
      dragging=false;
      invoke('cmd_codex_micro_overlay_snap_position',{}).catch(function(){});
    });

    document.querySelectorAll('[data-act="close"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        dismiss();
      });
    });

    document.querySelectorAll('[data-act="minimize"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:true}).catch(function(){});
      });
    });

    document.querySelectorAll('[data-act="expand"]').forEach(function(btn){
      btn.addEventListener('click',function(e){
        e.preventDefault(); e.stopPropagation();
        invoke('cmd_codex_micro_overlay_set_minimized',{minimized:false}).catch(function(){});
      });
    });

    if(listen){ listen('codex_micro_overlay_state',function(ev){ render(ev.payload); }).catch(function(){}); }
    function pull(){
      if(holdLockId||localPadStatus==='listening') return;
      invoke('cmd_codex_micro_overlay_get_state',{}).then(function(s){ render(s); }).catch(function(){});
    }
    pull();
    setInterval(pull, 1500);
  </script>
</body>
</html>
