    var lastSnap={};
    var lastNotifiedLight='';

    function maybeNotifyAttention(light){
      light=String(light||'').trim();
      if(light!=='needs_input'&&light!=='error'&&light!=='failed') return;
      if(light===lastNotifiedLight) return;
      lastNotifiedLight=light;
      if(document.visibilityState==='visible'&&document.hasFocus()) return;
      try{
        if(!window.Notification) return;
        if(Notification.permission==='granted'){
          new Notification(light==='needs_input'?'Soft Pad：需要你确认':'Soft Pad：会话出错',{silent:true});
        }else if(Notification.permission==='default'){
          // Preference-driven request happens in Hub; never silent-request on boot.
          toast(light==='needs_input'?'有会话在等你确认':'有会话出错');
        }else{
          toast(light==='needs_input'?'有会话在等你确认':'有会话出错');
        }
      }catch(_){
        toast(light==='needs_input'?'有会话在等你确认':'有会话出错');
      }
    }
    var APP_STATE_URL='http://127.0.0.1:8796/api/codex-app/state';

    function mergeAppLightIntoSnap(base, j){
      var st=j&&j.state?j.state:{};
      var out=Object.assign({}, base||{});
      out.appStateEnabled=!!(j&&j.appStateEnabled);
      out.appStatus=String(j&&j.appStatus||st.status||'').trim()||'idle';
      out.appLastEvent=String(st.lastEvent||st.event||'').trim();
      out.appLastSource=String(st.lastSource||st.source||'').trim();
      if(j&&j.softRgb&&j.softRgb.r!=null){
        out.rgb={r:j.softRgb.r,g:j.softRgb.g,b:j.softRgb.b};
      } else if(j&&j.appStateEnabled){
        // Lights on + idle/no softRgb: clear sticky vendor mint.
        out.rgb=null;
      }
      return out;
    }

    /** Bypass wedged Tauri IPC: poll Hook state over loopback HTTP for pad color. */
    function pullAppLightHttp(){
      fetch(APP_STATE_URL,{method:'GET',cache:'no-store'}).then(function(r){
        return r.ok?r.json():null;
      }).then(function(j){
        if(!j||!j.ok) return;
        lastSnap=mergeAppLightIntoSnap(lastSnap,j);
        applyPadLightGlow(lastSnap);
        applyAppMetaChip(lastSnap);
      }).catch(function(){});
    }

    function render(s){
      s=s||{};
      lastSnap=Object.assign({}, lastSnap, s);
      syncOverlayTheme();
      applyMiniAgentChips(s);
      applyMiniUsagePill(s);
      var padSkin=normalizeOverlaySkin(s.skin||s.padSkin);
      var rootEl=document.querySelector('.root');
      if(rootEl) rootEl.setAttribute('data-pad-skin', padSkin);
      wrap.setAttribute('data-pad-skin', padSkin);
      var purpose=String(s.purpose||'shortcuts').toLowerCase()==='sessions'?'sessions':'shortcuts';
      var agRaw=String(s.agSurface||'').toLowerCase();
      var agSurface=(agRaw==='mixed'||agRaw==='sessionlanes')?'mixed':'actions';
      var navSlots=Array.isArray(s.navigationSlots)?s.navigationSlots:(Array.isArray(s.navigation_slots)?s.navigation_slots:[]);
      var navOverflow=Number(s.navigationOverflow!=null?s.navigationOverflow:(s.navigation_overflow!=null?s.navigation_overflow:0))||0;
      var multiLights=!!s.multiAgentLights;
      if(rootEl){
        rootEl.setAttribute('data-purpose', purpose);
        rootEl.setAttribute('data-ag-surface', agSurface);
        rootEl.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
        rootEl.setAttribute('data-navigation-slots', navSlots.join(','));
        rootEl.setAttribute('data-navigation-overflow', String(navOverflow));
        if(s.appliedAgent) rootEl.setAttribute('data-applied-agent', String(s.appliedAgent));
      }
      wrap.setAttribute('data-purpose', purpose);
      wrap.setAttribute('data-ag-surface', agSurface);
      wrap.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
      wrap.setAttribute('data-navigation-slots', navSlots.join(','));
      wrap.setAttribute('data-navigation-overflow', String(navOverflow));
      applyNavCta(s);
      applyLightGate(s);
      var hw=wrap.querySelector('.micro-hw');
      if(hw){
        hw.setAttribute('data-pad-skin', padSkin);
        hw.setAttribute('data-purpose', purpose);
        hw.setAttribute('data-ag-surface', agSurface);
        hw.setAttribute('data-multi-agent-lights', multiLights?'true':'false');
        hw.setAttribute('data-navigation-slots', navSlots.join(','));
        hw.setAttribute('data-navigation-overflow', String(navOverflow));
      }
      wrap.classList.toggle('is-visible',!!s.visible);
      // Always sync mode — previously returned early while hidden, so first show
      // still showed default Codex even when last mode was 数字键.
      if(s.enabled!=null || s.padMode!=null){
        if(s.enabled!=null) padEnabled=!!s.enabled;
        padMode=String(s.padMode||'')==='numpad'?'numpad':(padEnabled?'codex':'numpad');
        persistPadMode();
      }
      if(!s.visible){
        holdLockId='';
        applyAppMetaChip(s);
        applyLocalStatusDom();
        // Prefetch grid while hidden so show only toggles visibility.
        if(grid && !grid.children.length){
          var prefetch=Object.assign({}, s, { visible:true, _prefetch:1 });
          // Fall through by forcing a one-shot paint without is-visible.
          s=prefetch;
          wrap.classList.toggle('is-visible', false);
        } else {
          return;
        }
      }
      if(!s._prefetch){
        padEnabled=!!s.enabled;
        padMode=String(s.padMode||'')==='numpad'?'numpad':(padEnabled?'codex':'numpad');
        persistPadMode();
      }
      joyArrowsLive=!!s.joyArrowsLive && padMode==='codex';
      joyContextHint=String(s.joyContextHint||s.joy_context_hint||'').trim();
      requireNumLockOff=!!s.requireNumLockOff;
      numLockBlocking=!!s.numLockBlocking;
      navKeysEnabled=s.showNavigationPad!==false && s.show_navigation_pad!==false
        && s.navKeysEnabled!==false && s.nav_keys_enabled!==false;
      layoutColumns=Number(s.layoutColumns||s.layout_columns||0)||(navKeysEnabled?5:4);
      if(padMode==='numpad') layoutColumns=4;
      enhanceOn=!!s.softwareEnhanceEnabled;
      localMinimized=!!s.minimized;
      wrap.classList.toggle('is-no-nav', padMode==='codex' && !navKeysEnabled);
      var hwGrid=wrap.querySelector('.micro-hw__grid');
      if(hwGrid){
        hwGrid.classList.toggle('micro-hw__grid--no-nav', padMode==='codex' && !navKeysEnabled);
        hwGrid.classList.toggle('micro-hw__grid--numpad', padMode==='numpad');
      }
      applyPadLightGlow(s);
      applyAppMetaChip(s);
      var map=cellMap(s.cells);
      var active=String(s.activeMicroKeyId||'');
      backendPadStatus=String(s.padStatus||'idle');
      var snapMicro=String(s.statusMicroKeyId||'');
      if(backendPadStatus==='listening' || backendPadStatus==='running' || backendPadStatus==='done' || backendPadStatus==='failed'){
        if(localPadStatus!==backendPadStatus || localStatusMicro!==snapMicro){
          if(backendPadStatus==='listening'){
            clearLocalTimer();
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
            if(snapMicro) holdLockId=snapMicro;
          } else if(!localStatusTimer) {
            localPadStatus=backendPadStatus;
            localStatusMicro=snapMicro;
          }
        }
      } else if((backendPadStatus==='done' || backendPadStatus==='idle') && snapMicro==='ACT10'){
        activePtr='';
        holdLockId='';
        holdSuppressCancel=false;
        holdUiReleased=false;
        releaseKeyVisual('ACT10');
        if(!localStatusTimer){
          localPadStatus=backendPadStatus;
          localStatusMicro=backendPadStatus==='idle' ? '' : snapMicro;
        }
      } else if(backendPadStatus==='idle' && !localStatusTimer && localPadStatus!=='listening' && localPadStatus!=='running' && !activePtr){
        localPadStatus='idle';
        localStatusMicro='';
        if(!holdSuppressCancel) holdLockId='';
      }
      var sig=gridSignature(s,map,active);
      if(shouldDeferGridRebuild()){
        (s.cells||[]).forEach(function(c){ if(c&&c.microKeyId) boundKeys[c.microKeyId]=!!c.bound; });
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      if(sig===lastGridSig){
        patchGridRunStates(map,active);
        applyLocalStatusDom();
        return;
      }
      lastGridSig=sig;
      boundKeys={};
      grid.innerHTML=activeLayout().map(function(cell){
        var info=map[cell.id]||{};
        var isNav=isNavKeyId(cell.id);
        var bound=!!info.bound;
        var isNp=cell.kind==='numpad';
        if(isNp || isNav) bound=true;
        boundKeys[cell.id]=bound;
        var iconId=info.uiIconId||cell.icon||'empty';
        var keyRole=String(info.keyRole||'action');
        var kind=String(info.sourceKind||'none');
        var backendRun=String(info.runStatus||'idle');
        var runSt=mergeRunStatus(cell.id, backendRun);
        var statusSrc=String(info.statusSource||'inferred');
        // agentLane has no chord — still show lamp (do not grey via is-route-disabled).
        if(keyRole==='agentLane') bound=true;
        var cls='micro-hw__key micro-hw__key--'+cell.kind + sourceClass(kind, cell.id);
        if(keyRole==='agentLane') cls+=' micro-hw__key--lane';
        if(cell.span===2) cls+=' micro-hw__key--span2';
        if(cell.rowSpan===2) cls+=' micro-hw__key--rowspan2';
        if(isNp || isNav || bound) cls+=' is-bound';
        else if(cell.id!=='ENC') cls+=' is-route-disabled';
        if(cell.id==='ENC'){
          cls+= padEnabled ? ' is-mode-on' : ' is-mode-off';
        }
        if(isNav && joyArrowsLive) cls+=' is-nav-live';
        if((active&&active===cell.id)||(activePtr&&activePtr===cell.id)) cls+=' is-pressed is-active';
        var ctxRank=String(info.contextRank||'').trim();
        if(ctxRank==='emphasize') cls+=' is-context-emphasize';
        else if(ctxRank==='dim') cls+=' is-context-dim';
        var ctxHint=String(info.contextHint||'').trim();
        var agAttr=cell.ag!=null ? ' data-ag="'+cell.ag+'"' : '';
        var style='grid-row:'+cell.row+(cell.rowSpan?' / span '+cell.rowSpan:'')
          +';grid-column:'+cell.col+(cell.span?' / span '+cell.span:'')+';';
        var tag=cell.kind==='placeholder'?'div':'button';
        var type=tag==='button'?' type="button"':'';
        var inner;
        if(cell.id==='ENC'){
          inner=encInnerHtml(padEnabled, iconId);
        } else if(isNp){
          inner='<span class="micro-hw__digit" aria-hidden="true">'+escHtml(cell.label||'')+'</span>';
        } else if(isNav){
          inner='<span class="micro-hw__icon">'+navIconHtml(cell.id, iconId)+'</span>';
        } else {
          inner='<span class="micro-hw__icon">'+(ICON[iconId]||ICON.empty)+'</span>';
        }
        var metaName='';
        var metaChord='';
        if(cell.id==='ENC'){
          metaName=padEnabled?'虚拟键盘模式':'数字键模式';
          metaChord=padEnabled?'ON':'OFF';
        } else if(isNp){
          metaName=String(cell.label||cell.id||'');
        } else if(isNav){
          metaName=({NAV_UP:'上',NAV_DOWN:'下',NAV_LEFT:'左',NAV_RIGHT:'右'})[cell.id]||cell.id;
          metaChord=joyArrowsLive?'方向键已接入':'';
        } else if(keyRole==='agentLane'){
          metaName=String(info.label||'').trim()||cell.id;
          metaChord=String(info.sub||'').trim()||'会话槽 · 灯=状态';
        } else {
          metaName=String(info.label||'').trim();
          metaChord=String(info.sub||'').trim();
        }
        var npAriaMap={'/':'除','*':'乘','-':'减','+':'加','.':'小数点','↵':'回车'};
        var aria=cell.id==='ENC'
          ? metaName
          : (isNav
            ? metaName
            : (isNp ? (npAriaMap[cell.label]||String(cell.label||cell.id)) : ([metaName, metaChord].filter(Boolean).join(' · ') || cell.id)));
        if(cell.ag!=null && statusSrc){
          aria+=(aria?' · ':'')+statusSourceLabel(statusSrc);
        }
        var actTitle='';
        if(isNav){
          if(joyContextHint) actTitle=joyContextHint;
          else if(joyArrowsLive) actTitle='主键盘方向键已接入';
        } else if(keyRole==='agentLane'){
          actTitle='会话槽：查看状态、聚焦终端或恢复线程；不保证打开 App 内侧栏对话';
        } else if(cell.id.indexOf('ACT')===0){
          if(ctxHint) actTitle=ctxHint;
          else if(cell.id==='ACT10') actTitle='按住说话';
        }
        var encAttrs=cell.id==='ENC'
          ? ' data-act="pad-mode" role="switch" aria-checked="'+(padEnabled?'true':'false')+'"'
          : '';
        return '<'+tag+type+encAttrs+' class="'+cls+'" data-micro-key="'+cell.id+'"'+agAttr
          +' data-key-role="'+escHtml(keyRole)+'"'
          +(info.laneId?' data-lane-id="'+escHtml(String(info.laneId))+'"':'')
          +(info.subagentCount?' data-subagent-count="'+escHtml(String(info.subagentCount))+'"':'')
          +' data-run-status="'+runSt+'" data-backend-run="'+backendRun+'" data-status-source="'+escHtml(statusSrc)+'" data-source-kind="'+kind+'"'
          +(ctxHint?' data-context-hint="'+escHtml(ctxHint)+'"':'')
          +(metaName?' data-cap-name="'+escHtml(metaName)+'"':'')
          +(metaChord?' data-cap-chord="'+escHtml(metaChord)+'"':'')
          +' style="'+style+'"'
          +' aria-label="'+escHtml(aria)+'"'
          +(cell.id==='ENC'?' title="'+escHtml(aria)+'"':(actTitle?' title="'+escHtml(actTitle)+'"':''))
          +(isNp?' title="'+escHtml(aria)+'"':'')
          +'>'+inner+'</'+tag+'>';
      }).join('');
      applyLocalStatusDom();
      bindFire();
      bindKeyCaption();
      setKeyCaption('', '');
    }

              invoke('cmd_soft_pad_open_shell_hook',{kind:pk}).catch(function(){});

          setUsageFocusFromUi(el.getAttribute('data-agent'),{
            laneId:el.getAttribute('data-lane-id')||'',
            sessionId:el.getAttribute('data-session-id')||'',
            clickKind:'chip'

              laneId:el.getAttribute('data-lane-id')||'',
              sessionId:el.getAttribute('data-session-id')||'',
              clickKind:'chip'

        });
      });

      panel.__bound=true;
      var input=document.getElementById('overlayMinimaxKeyInput');
      var saveBtn=panel.querySelector('[data-act="mm-key-save"]');
      var consoleBtn=panel.querySelector('[data-act="mm-key-console"]');
      var cancelBtn=panel.querySelector('[data-act="mm-key-cancel"]');
      if(saveBtn){
        saveBtn.addEventListener('click',function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          saveMinimaxKeyFromOverlay(input&&input.value);
        });
      }
      if(consoleBtn){
        consoleBtn.addEventListener('click',function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          invoke('cmd_open_url',{url:'https://platform.minimaxi.com/'}).catch(function(){});
        });
      }
      if(cancelBtn){
        cancelBtn.addEventListener('click',function(ev){
          ev.preventDefault();
          ev.stopPropagation();
          setMinimaxKeyPanel(false);
        });
      }
      if(input){
        input.addEventListener('keydown',function(ev){
          if(ev.key==='Enter'){
            ev.preventDefault();
            saveMinimaxKeyFromOverlay(input.value);
          } else if(ev.key==='Escape'){
            ev.preventDefault();
            setMinimaxKeyPanel(false);
          }
        });
        input.addEventListener('click',function(ev){ ev.stopPropagation(); });
      }
    })();
    var capEl=document.getElementById('overlayKeyCaption');
    if(capEl){
      capEl.classList.add('is-clickable');
      capEl.addEventListener('pointerdown',function(e){
        // Never start Soft Pad window-drag from the usage caption.
        e.stopPropagation();
      });
      capEl.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        if(captionWantsEnable(usageCaptionIdle)){
          enableCursorActivityFromOverlay();
          return;
        }
        if(captionWantsMinimaxKey(usageCaptionIdle)||focusUsageIsMinimax()){
          configureMinimaxKeyFromOverlay();
          return;
        }
        // Fallback: still open MiniMax key panel / console when caption names MiniMax.
        if(/MiniMax/.test(String(usageCaptionIdle||''))){
          configureMinimaxKeyFromOverlay();
        }
      });
    }
    var mmPanelEl=document.getElementById('overlayMinimaxKey');
    if(mmPanelEl){
      mmPanelEl.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
    }
    if(miniUsagePill){
      miniUsagePill.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        var action=String(miniUsagePill.getAttribute('data-pill-action')||'');
        var kind=String(miniUsagePill.getAttribute('data-agent')||'').trim();
        var t=String(miniUsagePill.textContent||'');
        var tipJoin=Array.isArray(miniUsagePill.__tipLines)?miniUsagePill.__tipLines.join(' '):'';
        if(action==='quota_menu'){
          setMiniQuotaOpen(!miniQuotaOpen);
          return;
        }
        if(action==='enable_cursor'||captionWantsEnable(t)||captionWantsEnable(tipJoin)){
          enableCursorActivityFromOverlay();
          return;
        }
        if(action==='minimax_key'||captionWantsMinimaxKey(t)||captionWantsMinimaxKey(tipJoin)){
          configureMinimaxKeyFromOverlay();
          return;
        }
        if(action==='refresh'&&kind){
          refreshUsageFromOverlay(kind);
          return;
        }
      });
    }
    if(miniQuotaDropdown){
      miniQuotaDropdown.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
      miniQuotaDropdown.addEventListener('click',function(e){ e.stopPropagation(); });
    }
    setInterval(pull, 1500);
    setInterval(pullAppLightHttp, 500);
  </script>
</body>
</html>
