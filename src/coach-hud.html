<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach HUD</title>
  <style>
    :root{
      --primary:#2a9cc4;
      --primary-soft:rgba(42,156,196,.18);
      --success:#16a34a;
      --success-soft:rgba(22,163,74,.16);
      --surface:rgba(244,249,252,.94);
      --on-surface:#152238;
      --on-surface-muted:#5a7086;
      --outline:rgba(26,45,74,.12);
      --shadow:0 12px 36px rgba(26,45,74,.22);
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
    }
    @media (prefers-color-scheme:dark){
      :root{
        --primary:#5ec8e8;
        --primary-soft:rgba(94,200,232,.16);
        --success:#4ade80;
        --success-soft:rgba(74,222,128,.14);
        --surface:rgba(30,40,56,.94);
        --on-surface:#e8f0f8;
        --on-surface-muted:#9aa8b8;
        --outline:rgba(148,163,184,.18);
        --shadow:0 14px 40px rgba(0,0,0,.5);
      }
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;
      background:transparent !important;user-select:none;
    }
    .hud-root{
      width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
      padding:0 8px 6px;
    }
    .hud-pill{
      width:100%;max-width:344px;display:flex;align-items:center;gap:12px;
      padding:11px 14px 11px 16px;border-radius:16px;border:1px solid var(--outline);
      background:var(--surface);box-shadow:var(--shadow);color:var(--on-surface);
      backdrop-filter:blur(14px);transition:transform .2s ease, border-color .2s ease;
    }
    .hud-pill.is-hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
    .hud-pill.is-success{border-color:rgba(22,163,74,.35);background:linear-gradient(135deg,var(--surface),var(--success-soft))}
    .hud-icon{
      flex:0 0 34px;width:34px;height:34px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      background:var(--primary-soft);color:var(--primary);font-size:17px;line-height:1;
    }
    .hud-pill.is-success .hud-icon{background:var(--success-soft);color:var(--success)}
    .hud-body{flex:1;min-width:0}
    .hud-title{margin:0;font-size:13px;font-weight:700;line-height:1.35}
    .hud-sub{margin:3px 0 0;font-size:11px;line-height:1.45;color:var(--on-surface-muted)}
    .hud-keys{display:inline-flex;align-items:center;gap:6px;margin-top:2px}
    .hud-key{
      display:inline-flex;align-items:center;justify-content:center;min-width:28px;
      padding:2px 8px;border-radius:8px;background:rgba(42,156,196,.12);
      color:var(--primary);font-size:11px;font-weight:700;line-height:1.3;
    }
    .hud-arrow{color:var(--on-surface-muted);font-size:11px}
    .hud-dismiss{
      flex:0 0 auto;width:28px;height:28px;border:none;border-radius:10px;
      background:transparent;color:var(--on-surface-muted);font-size:16px;line-height:1;cursor:pointer;
    }
    .hud-dismiss:hover{background:var(--primary-soft);color:var(--primary)}
  </style>
</head>
<body>
  <div class="hud-root">
    <div class="hud-pill is-hidden" id="hudPill" role="status" aria-live="polite">
      <div class="hud-icon" id="hudIcon" aria-hidden="true">⌨</div>
      <div class="hud-body">
        <p class="hud-title" id="hudTitle">—</p>
        <p class="hud-sub" id="hudSub"></p>
      </div>
      <button type="button" class="hud-dismiss" id="hudDismiss" title="Dismiss" aria-label="Dismiss">×</button>
    </div>
  </div>
  <script src="js/key-labels.js"></script>
  <script>
    const invoke=window.__TAURI_INTERNALS__?function(cmd,args){return window.__TAURI_INTERNALS__.invoke(cmd,args);}:function(){return Promise.resolve();};
    const listen=window.__TAURI__&&window.__TAURI__.event&&window.__TAURI__.event.listen
      ?window.__TAURI__.event.listen.bind(window.__TAURI__.event)
      :(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__):null);

    const I18N={
      zh:{
        key_only_title:'按唤起键开始输入',
        key_only_sub:'一声会替你按下输入法快捷键',
        success_title:'已唤起',
        success_sub:'快捷键已发送',
        dismiss:'本次隐藏'
      },
      en:{
        key_only_title:'Press your trigger key',
        key_only_sub:'OneTone sends your IME shortcut',
        success_title:'Triggered',
        success_sub:'Shortcut sent',
        dismiss:'Hide for now'
      }
    };

    function lang(){
      try{ const v=localStorage.getItem('vp_lang'); return v==='en'?'en':'zh'; }catch(_){ return 'zh'; }
    }
    function t(key){ return (I18N[lang()]||I18N.zh)[key]||key; }
    function labelKey(key){ return window.OneToneKeyLabels?window.OneToneKeyLabels.friendlyKeyName(key,lang()):String(key||''); }

    const pill=document.getElementById('hudPill');
    const icon=document.getElementById('hudIcon');
    const title=document.getElementById('hudTitle');
    const sub=document.getElementById('hudSub');
    const dismiss=document.getElementById('hudDismiss');

    function renderKeys(triggerKey,targetKey){
      if(!triggerKey&&!targetKey) return '';
      return '<span class="hud-keys"><span class="hud-key">'+labelKey(triggerKey||'?')+'</span><span class="hud-arrow">→</span><span class="hud-key">'+labelKey(targetKey||'?')+'</span></span>';
    }

    function applyState(s){
      const mode=s&&s.mode?s.mode:'hidden';
      const visible=!!(s&&s.visible);
      pill.classList.toggle('is-hidden',!visible);
      pill.classList.toggle('is-success',visible&&mode==='success');
      if(!visible) return;

      const keys=renderKeys(s.triggerKey||'',s.targetKey||'');
      if(mode==='success'){
        icon.textContent='✓';
        title.textContent=t('success_title');
        sub.innerHTML=t('success_sub')+(keys?' · '+keys:'');
        return;
      }
      icon.textContent='⌨';
      title.textContent=t('key_only_title');
      sub.innerHTML=keys||t('key_only_sub');
    }

    dismiss.onclick=function(){ invoke('cmd_coach_hud_dismiss',{}).catch(function(){}); };
    dismiss.setAttribute('title',t('dismiss'));
    dismiss.setAttribute('aria-label',t('dismiss'));

    if(listen){ listen('coach_state',function(ev){ applyState(ev.payload); }).catch(function(){}); }
    invoke('cmd_coach_hud_get_state',{}).then(function(s){ applyState(s); }).catch(function(){});
  </script>
</body>
</html>
