<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>一声托盘菜单</title>
<link rel="stylesheet" href="css/ot-switch.css"/>
<link rel="stylesheet" href="css/tray-scene-block.css"/>
<link rel="stylesheet" href="css/tray-os-channels.css"/>
<link rel="stylesheet" href="css/tray-editor.css"/>
<style>
:root{
  --surface:#fff;--surface-2:#f8fafc;--primary:#2a9cc4;--primary-soft:#e6f7fc;--primary-deep:#1e87ad;
  --on-surface:#152238;--on-surface-muted:#5a7086;--on-surface-soft:#8a98a8;
  --outline-variant:rgba(26,45,74,.10);--green:#2e7d4f;
  --radius:12px;--shadow:0 4px 16px rgba(26,45,74,.10);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface:#1e2838;--surface-2:#252f40;--primary:#5ec8e8;--primary-soft:rgba(94,200,232,.14);--primary-deep:#3aa8cc;
    --on-surface:#e8f0f8;--on-surface-muted:#9aa8b8;--on-surface-soft:#7a8898;
    --outline-variant:rgba(148,163,184,.16);--shadow:0 4px 16px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html{margin:0;height:100%;background:transparent!important}
body{margin:0;padding:8px;min-height:100%;background:transparent!important;overflow:visible;user-select:none}
.menu-shell{width:316px;overflow-x:hidden;overflow-y:visible;background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;color:var(--on-surface);font-size:13px}
tray-channel-block,tray-mic-toggle,tray-footer-links{display:block}
tray-channel-block[hidden],#trayChannelsHead[hidden],#traySceneBlock[hidden]{display:none!important}
</style>
</head>
<body>
<div class="menu-shell" id="shell">
  <div id="traySceneBlock" data-block-id="block:scene"></div>
  <div class="sep"></div>
  <div class="sec-head" id="trayChannelsHead"><span class="dot"></span><span>开关</span></div>
  <tray-channel-block data-id="voice"></tray-channel-block>
  <tray-channel-block data-id="keys"></tray-channel-block>
  <tray-channel-block data-id="softPad"></tray-channel-block>
  <tray-channel-block data-id="camera"></tray-channel-block>
  <div class="sep"></div>
  <tray-mic-toggle></tray-mic-toggle>
  <tray-footer-links></tray-footer-links>
</div>
<script src="js/core/icons.js"></script>
<script src="js/features/settings/channel-config-state-keys.generated.js"></script>
<script src="js/features/settings/channel-config-state-keys.js"></script>
<script>
window.OneToneIpc={invoke:function(c,a){return window.__TAURI_INTERNALS__?window.__TAURI_INTERNALS__.invoke(c,a):Promise.resolve();}};
</script>
<script src="js/features/settings/tray-i18n-lite.js"></script>
<script src="js/features/settings/tray-layout-v2.js"></script>
<script src="js/features/settings/tray-data-store.js"></script>
<script src="js/features/settings/tray-switch-io.js"></script>
<script src="js/features/settings/tray-render-os.js"></script>
<script src="js/features/settings/tray-render-editor.js"></script>
<script src="js/features/settings/tray-footer.js"></script>
<script src="js/features/settings/tray-channel-controls.js"></script>
<script src="js/features/settings/tray-scene-preset.js"></script>
<script>
(function(){
  var invoke=window.__TAURI_INTERNALS__?function(c,a){return window.__TAURI_INTERNALS__.invoke(c,a);}:function(){return Promise.resolve();};
  var listen=window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__):function(){return Promise.resolve(function(){});};
  var state={global:{mode:'listening',activeChannelIds:[]},mic:{available:false,muted:false,device:'—'},channels:[],deepLinks:[]};
  var layoutV2=null;
  var SEGS=['global','mic','channels'];
  var openOsChannel=null;
  var TRAY_CHROME = 16;
  var perfT0 = typeof performance !== 'undefined' ? performance.now() : 0;
  var traySizeTimer = null;
  var refreshDebounce = null;
  var menuRevealed = false;
  function syncTrayMenuSize(opts) {
    opts = opts || {};
    if (traySizeTimer) clearTimeout(traySizeTimer);
    function measure(andReveal) {
      requestAnimationFrame(function () {
        var shell = document.getElementById('shell');
        if (!shell) return;
        var shellH = Math.max(Math.ceil(shell.getBoundingClientRect().height), shell.scrollHeight);
        var w = shell.offsetWidth + TRAY_CHROME;
        var h = Math.min(680, Math.max(320, shellH + TRAY_CHROME + 2));
        invoke('cmd_tray_menu_set_size', { height: h, width: w }).then(function () {
          if (andReveal && !menuRevealed) {
            menuRevealed = true;
            invoke('cmd_tray_menu_reveal').catch(function () {});
          }
        }).catch(function () {});
      });
    }
    measure(!!opts.reveal);
    if (!opts.skipRemeasure) {
      traySizeTimer = setTimeout(function () { measure(false); }, 280);
    }
  }
  var ICONS=(window.OneToneIcons&&window.OneToneIcons.tray)||{};
  function act(action,payload){invoke('cmd_tray_action',{action:action,payload:payload||null}).catch(function(){});}
  function esc(s){return String(s||'').replace(/</g,'&lt;');}
  function refreshScene(){var SP=window.OneToneTrayScenePreset;if(!SP)return;SP.renderSceneBlock(document.getElementById('traySceneBlock'),{onRefresh:refreshAll,global:state.global});}
  function refreshAll(opts){
    opts=opts||{};
    refreshScene();
    if(opts.sceneMic==='mute'&&state.mic)state.mic=Object.assign({},state.mic,{muted:true});
    else if(opts.sceneMic==='allOn'&&state.mic)state.mic=Object.assign({},state.mic,{muted:false});
    if(!opts.skipChannelRender){
    var V2=window.OneToneTrayLayoutV2;
    var lay=layoutV2;
    var SP=window.OneToneTrayScenePreset;
    var TCC=window.OneToneTrayChannelControls;
    var sceneSnap=SP&&SP.getActiveSceneSnap&&SP.getActiveSceneSnap();
    if(sceneSnap&&TCC&&TCC.syncOsTrayToggleDom){
      TCC.syncOsTrayToggleDom(sceneSnap);
    }else{
    document.querySelectorAll('tray-channel-block').forEach(function(el){
      if(el.hidden)return;
      if(lay&&V2&&!V2.blockVisible(lay,'block:channel:'+el.dataset.id))return;
      if(el.render)el.render();
    });
    }
    }
    var mic=document.querySelector('tray-mic-toggle');
    if(mic&&!mic.hidden&&mic.render)mic.render();
    var ft=document.querySelector('tray-footer-links');
    if(ft&&!ft.hidden&&ft.render)ft.render();
    syncTrayMenuSize();
  }
  function scheduleRefreshAll(){
    if(refreshDebounce)clearTimeout(refreshDebounce);
    refreshDebounce=setTimeout(refreshAll,80);
  }
  function patchSeg(seg,payload){
    if(seg==='global'){
      var prevHabit=state.global&&state.global.activeHabitId;
      state.global=payload;
      var habitChanged=prevHabit&&payload.activeHabitId&&prevHabit!==payload.activeHabitId;
      refreshScene();
      var TCC=window.OneToneTrayChannelControls;
      if(TCC&&TCC.syncOsMappingFromGlobal)TCC.syncOsMappingFromGlobal();
      var SP=window.OneToneTrayScenePreset;
      var after=function(){
        var V2=window.OneToneTrayLayoutV2;
        var lay=layoutV2;
        document.querySelectorAll('tray-channel-block').forEach(function(el){
          if(el.hidden)return;
          if(lay&&V2&&!V2.blockVisible(lay,'block:channel:'+el.dataset.id))return;
          if(el.render)el.render();
        });
      };
      if(habitChanged&&SP&&SP.applyPersistedSceneDeferred){
        SP.applyPersistedSceneDeferred({ skipVoice: true }).then(after);
      }else{
        after();
      }
      return;
    }
    if(seg==='mic')state.mic=payload;
    else if(seg==='channels')state.channels=payload;
    if(seg==='mic')document.querySelector('tray-mic-toggle').render();
    if(seg==='channels'){
      var SP=window.OneToneTrayScenePreset;
      var TCC=window.OneToneTrayChannelControls;
      var sceneSnap=SP&&SP.getActiveSceneSnap&&SP.getActiveSceneSnap();
      if(sceneSnap&&TCC&&TCC.syncOsTrayToggleDom){
        TCC.syncOsTrayToggleDom(sceneSnap);
      }else{
        document.querySelectorAll('tray-channel-block').forEach(function(el){
          if(!el.hidden&&el.render)el.render();
        });
      }
    }
  }
  function resolveLayoutV2(cfg){
    var V2=window.OneToneTrayLayoutV2;
    if(!V2)return null;
    return V2.mergeLayoutWithCatalog(cfg&&cfg.version===V2.VERSION?cfg:V2.migrateV1(cfg||{})).layout;
  }
  function applyLayout(cfg){
    var V2=window.OneToneTrayLayoutV2;
    if(!V2)return;
    var merged=V2.mergeLayoutWithCatalog(cfg&&cfg.version===V2.VERSION?cfg:V2.migrateV1(cfg||{}));
    var lay=merged.layout;
    layoutV2=lay;
    var TCC=window.OneToneTrayChannelControls;
    if(TCC&&TCC.setTrayLayoutV2)TCC.setTrayLayoutV2(lay);
    if(merged.newBlocks>0||merged.newControls>0||merged.repaired){
      invoke('cmd_tray_customization_save',lay).catch(function(){});
    }
    var shell=document.getElementById('shell');
    if(!shell||!lay||!V2)return;
    function setVis(blockId,els){
      var on=V2.blockVisible(lay,blockId);
      els.forEach(function(el){if(el)el.hidden=!on;});
      return on;
    }
    setVis('block:scene',[document.getElementById('traySceneBlock')]);
    var chOn={};
    ['voice','keys','softPad','camera'].forEach(function(ch){
      chOn[ch]=setVis('block:channel:'+ch,[shell.querySelector('tray-channel-block[data-id="'+ch+'"]')]);
    });
    var head=document.getElementById('trayChannelsHead');
    if(head)head.hidden=!(chOn.voice||chOn.keys||chOn.softPad||chOn.camera);
    setVis('block:mic',[shell.querySelector('tray-mic-toggle')]);
    setVis('block:footer',[shell.querySelector('tray-footer-links')]);
    var seps=Array.from(shell.querySelectorAll('.sep'));
    var blocks=(lay.blocks||[]).slice().sort(function(a,b){return a.order-b.order;});
    var channelStarted=false;
    blocks.forEach(function(b){
      var isCh=b.id.indexOf('block:channel:')===0;
      if(isCh&&!channelStarted){channelStarted=true;if(seps[0])shell.appendChild(seps[0]);if(head)shell.appendChild(head);}
      if(b.id==='block:mic'&&seps[1])shell.appendChild(seps[1]);
      if(b.id==='block:scene'){var el=document.getElementById('traySceneBlock');if(el)shell.appendChild(el);}
      if(isCh){var chEl=shell.querySelector('tray-channel-block[data-id="'+b.id.slice('block:channel:'.length)+'"]');if(chEl)shell.appendChild(chEl);}
      if(b.id==='block:mic'){var mic=shell.querySelector('tray-mic-toggle');if(mic)shell.appendChild(mic);}
      if(b.id==='block:footer'){var ft=shell.querySelector('tray-footer-links');if(ft)shell.appendChild(ft);}
    });
    document.querySelectorAll('tray-channel-block').forEach(function(el){if(el.render)el.render();});
  }
  function applyFull(data, opts) {
    opts = opts || {};
    state.global = data.global || state.global;
    state.mic = data.mic || state.mic;
    state.channels = data.channels || [];
    state.deepLinks = data.deepLinks || [];
    if (!opts.deferRender) {
      refreshAll();
      document.querySelector('tray-footer-links').render();
    }
  }
  class TrayChannelBlock extends HTMLElement{
    connectedCallback(){
      if(window.__trayBootstrapped&&this.render) this.render();
    }
    render(){
      var id=this.dataset.id;
      var TCC=window.OneToneTrayChannelControls;
      if(!TCC||!TCC.renderOsTrayBlock)return;
      var self=this;
      TCC.renderOsTrayBlock(this,id,state,{
        onSwitchChange:function(){
          var SP=window.OneToneTrayScenePreset;
          if(SP&&SP.onTrayChannelSwitchChange)SP.onTrayChannelSwitchChange();
          else if(SP)SP.onManualSwitchChange();
          refreshScene();
          self.render();
        },
        onResize:function(){
          syncTrayMenuSize();
        }
      });
    }
  }
  class TrayMicToggle extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var self=this;
      var m=state.mic||{};var muted=!!m.muted;var ok=!!m.available;
      this.className=muted?'muted':'';this.classList.toggle('disabled',!ok);
      this.innerHTML='<div class="mic-row'+(muted?' muted':'')+(ok?'':' disabled')+'"><span class="icowrap"><span class="ico">'+ICONS.mic+'</span></span><span class="body"><span class="name">麦克风</span><span class="meta">'+(muted?'静音':'开')+' · '+String(m.device||'默认')+'</span></span><button type="button" class="toggle-switch page-status-toggle" aria-label="切换麦克风静音"></button></div>';
      var btn=this.querySelector('.toggle-switch');
      if(btn){
        btn.classList.toggle('on',!muted);
        btn.setAttribute('aria-checked',muted?'false':'true');
        btn.onclick=function(e){
          e.stopPropagation();
          if(!ok)return;
          var nextMuted=!muted;
          btn.classList.toggle('on',!nextMuted);
          btn.setAttribute('aria-checked',nextMuted?'false':'true');
          invoke('cmd_mic_set_mute',{muted:nextMuted}).then(function(st){
            if(st)state.mic=st;
            self.render();
          }).catch(function(){
            self.render();
          });
        };
      }
    }
  }
  class TrayFooterLinks extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var TF=window.OneToneTrayFooter;
      if(!TF){this.innerHTML='';return;}
      var links=state.deepLinks&&state.deepLinks.length?state.deepLinks:TF.defaultLinks();
      this.innerHTML=TF.renderFooterHtml(links);
      TF.bindFooter(this);
    }
  }
  customElements.define('tray-channel-block',TrayChannelBlock);
  customElements.define('tray-mic-toggle',TrayMicToggle);
  customElements.define('tray-footer-links',TrayFooterLinks);
  window.__tray_ready__=function(){
    menuRevealed=false;
    var subPromise=Promise.all(SEGS.map(function(s){return invoke('cmd_tray_subscribe_segment',{segment:s}).catch(function(){});}));
    var SP=window.OneToneTrayScenePreset;
    var Store=window.OneToneTrayDataStore;
    function finishBoot(displayData,customization,rt){
      applyFull(displayData,{deferRender:true});
      var rtPromise=SP&&SP.loadRuntime?SP.loadRuntime(rt):Promise.resolve();
      return rtPromise.then(function(){
        applyLayout(customization||{});
        window.__trayBootstrapped=true;
        refreshScene();
        refreshAll();
        document.querySelector('tray-footer-links').render();
      });
    }
    if(Store&&Store.bootstrap){
      return Store.bootstrap('os').then(function(bundle){
        if(bundle&&bundle.display)return finishBoot(bundle.display,bundle.customization,bundle.runtime);
        return invoke('cmd_tray_menu_ready').then(function(raw){
          var data=typeof raw==='string'?JSON.parse(raw):raw;
          return finishBoot(data,{},null);
        });
      }).then(function(){return subPromise;}).then(function(){
        requestAnimationFrame(function(){
          syncTrayMenuSize({ reveal: true });
          var ms=(typeof performance!=='undefined'?performance.now():0)-perfT0;
          invoke('cmd_app_log',{line:'tray_menu_ready_ms='+Math.round(ms)}).catch(function(){});
        });
      });
    }
    return invoke('cmd_tray_menu_ready').then(function(raw){
      var data=typeof raw==='string'?JSON.parse(raw):raw;
      return finishBoot(data,{},null);
    }).then(function(){return subPromise;}).then(function(){
      requestAnimationFrame(function(){
        syncTrayMenuSize();
        var ms=(typeof performance!=='undefined'?performance.now():0)-perfT0;
        invoke('cmd_app_log',{line:'tray_menu_ready_ms='+Math.round(ms)}).catch(function(){});
      });
    });
  };
  listen('tray://patch',function(ev){var p=ev.payload||{};if(p.segment)patchSeg(p.segment,p.payload);}).catch(function(){});
  listen('tray://layout',function(ev){applyLayout(ev.payload||{});refreshScene();}).catch(function(){});
  window.addEventListener('channel-config:changed',function(ev){
    var d=ev&&ev.detail||{};
    if(d._fromNotify)return;
    var SP=window.OneToneTrayScenePreset;
    if(SP&&SP.isApplying&&SP.isApplying())return;
    scheduleRefreshAll();
  });
  document.addEventListener('tray-scene-mic',function(ev){
    if(ev&&ev.detail)state.mic=ev.detail;
    var mic=document.querySelector('tray-mic-toggle');
    if(mic&&!mic.hidden&&mic.render)mic.render();
  });
})();
</script>
</body>
</html>
