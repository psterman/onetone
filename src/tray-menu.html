<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>一声托盘菜单</title>
<style>
:root{
  --surface:#fff;--surface-2:#f8fafc;--primary:#2a9cc4;--primary-soft:#e6f7fc;--primary-deep:#1e87ad;
  --on-surface:#152238;--on-surface-muted:#5a7086;--on-surface-soft:#8a98a8;
  --outline-variant:rgba(26,45,74,.10);--danger:#dc2626;--danger-soft:rgba(220,38,38,.08);
  --green:#2e7d4f;--green-soft:rgba(46,125,79,.10);--orange:#b9530a;--orange-soft:rgba(185,83,10,.10);
  --yellow:#b45309;--yellow-soft:rgba(245,166,35,.16);--purple:#6d4ab0;--purple-soft:rgba(109,74,176,.10);
  --blue:#00a3ff;--blue-soft:rgba(0,163,255,.10);--radius:12px;--shadow:0 10px 28px rgba(26,45,74,.18);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface:#1e2838;--surface-2:#252f40;--primary:#5ec8e8;--primary-soft:rgba(94,200,232,.14);--primary-deep:#3aa8cc;
    --on-surface:#e8f0f8;--on-surface-muted:#9aa8b8;--on-surface-soft:#7a8898;
    --outline-variant:rgba(148,163,184,.16);--shadow:0 12px 32px rgba(0,0,0,.45);
    --green-soft:rgba(46,125,79,.22);--orange-soft:rgba(185,83,10,.22);--blue-soft:rgba(0,163,255,.18);
    --purple-soft:rgba(109,74,176,.22);--danger-soft:rgba(220,38,38,.18);--yellow-soft:rgba(245,166,35,.22);
  }
}
*{box-sizing:border-box}
html{margin:0;height:100%;background:transparent!important}
body{margin:0;padding:8px;min-height:100%;background:transparent!important;overflow:hidden;user-select:none}
.menu-shell{width:316px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;color:var(--on-surface);font-size:13px}
.ico{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
.ico svg{display:block;width:14px;height:14px}
.sep{height:1px;margin:4px 8px;background:var(--outline-variant)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);flex-shrink:0;display:inline-block}
.pulse.listening{background:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);animation:tp 2s ease-in-out infinite}
@keyframes tp{0%,100%{box-shadow:0 0 0 3px rgba(0,163,255,.18)}50%{box-shadow:0 0 0 5px rgba(0,163,255,.32)}}
.pulse.paused{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.pulse.error{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.pulse.idle,.pulse.standby{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.pulse.off{background:var(--on-surface-soft);box-shadow:0 0 0 3px rgba(26,45,74,.05)}
.chip{font-size:9.5px;padding:1.5px 6px;border-radius:4px;font-weight:600;letter-spacing:.02em;flex-shrink:0;display:inline-flex;align-items:center;gap:3px}
.chip.g{background:var(--green-soft);color:var(--green)}.chip.b{background:var(--blue-soft);color:#0e7490}
.chip.p{background:var(--purple-soft);color:var(--purple)}.chip.o{background:var(--orange-soft);color:var(--orange)}
.chip.n{background:rgba(26,45,74,.06);color:var(--on-surface-muted)}.chip.r{background:var(--danger-soft);color:var(--danger)}
.status-hero{margin:4px;padding:11px 12px 9px;background:linear-gradient(135deg,#fff 0%,var(--blue-soft) 100%);border:1px solid var(--outline-variant);border-radius:10px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){.status-hero{background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,var(--blue-soft) 100%)}}
.status-hero .left{flex:1;min-width:0}.status-hero .top-line{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.status-hero .ttl{font-size:14.5px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.status-hero .ttl.paused{color:var(--orange)}.status-hero .ttl.error{color:var(--danger)}
.status-hero .state-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.status-hero .action{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 11px;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;font-size:10.5px;font-weight:700;border:none;font:inherit}
.status-hero .action .ico{width:16px;height:16px;color:#fff}.status-hero .action .ico svg{width:16px;height:16px}
.status-hero .action.paused{background:linear-gradient(135deg,#f5a623,#d97706)}
.event-card{margin:4px 6px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--outline-variant);border-radius:9px}
.event-card.is-empty{opacity:.55}
.event-card .ev-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:10px;color:var(--on-surface-muted)}
.event-card .ev-head .t{font-family:ui-monospace,monospace}
.event-card .ev-text{font-size:12px;font-weight:600;color:var(--on-surface);display:flex;align-items:center;gap:6px;line-height:1.25}
.event-card .ev-text .ch-ic{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--blue-soft);flex-shrink:0}
.event-card .ev-text .ch-ic .ico{width:11px;height:11px;color:var(--blue)}.event-card .ev-text .ch-ic .ico svg{width:11px;height:11px}
.event-card .ev-text .ch-ic.keys{background:var(--primary-soft)}.event-card .ev-text .ch-ic.keys .ico{color:var(--primary)}
.event-card .ev-text .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11.5px}
.event-card .ev-outcome{font-size:10px;font-weight:700;padding:1.5px 6px;border-radius:3px;flex-shrink:0}
.event-card .ev-outcome.ok{background:var(--green-soft);color:var(--green)}
.event-card .ev-outcome.fail{background:var(--danger-soft);color:var(--danger)}
.event-card .ev-outcome.warn{background:var(--yellow-soft);color:var(--yellow)}
.sec-head{display:flex;align-items:center;gap:6px;padding:7px 12px 3px;font-size:10px;font-weight:700;color:var(--on-surface-muted);text-transform:uppercase;letter-spacing:.06em}
.sec-head .dot{width:4px;height:4px;border-radius:50%;background:var(--on-surface-soft)}
.ch-row{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:0 4px;border-radius:7px;cursor:pointer;border:none;background:transparent;color:inherit;font:inherit;text-align:left;width:calc(100% - 8px)}
.ch-row:hover{background:var(--primary-soft)}
.ch-row .icowrap{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-row .icowrap.voice{background:var(--blue-soft)}.ch-row .icowrap.voice .ico{color:var(--blue)}
.ch-row .icowrap.keys{background:var(--primary-soft)}.ch-row .icowrap.keys .ico{color:var(--primary)}
.ch-row .icowrap.softpad{background:var(--purple-soft)}.ch-row .icowrap.softpad .ico{color:var(--purple)}
.ch-row .icowrap.camera{background:var(--orange-soft)}.ch-row .icowrap.camera .ico{color:var(--orange)}
.ch-row .icowrap .ico{width:13px;height:13px}.ch-row .icowrap .ico svg{width:13px;height:13px}
.ch-row .body{flex:1;min-width:0}.ch-row .name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.ch-row .name .pulse{width:5px;height:5px;box-shadow:0 0 0 2px transparent}
.ch-row .meta{font-size:10.5px;color:var(--on-surface-muted);line-height:1.2;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-row .chev{font-size:9px;color:var(--on-surface-soft);flex-shrink:0}
.mic-row{display:flex;align-items:center;gap:9px;padding:7px 10px;margin:0 4px;border-radius:7px;background:var(--primary-soft)}
.mic-row.muted{background:var(--danger-soft)}.mic-row.disabled{opacity:.45;pointer-events:none}
.mic-row .icowrap{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;flex-shrink:0}
.mic-row .icowrap .ico{color:var(--primary)}.mic-row.muted .icowrap .ico{color:var(--danger)}
.mic-row .icowrap .ico{width:13px;height:13px}.mic-row .icowrap .ico svg{width:13px;height:13px}
.mic-row .body{flex:1;min-width:0}.mic-row .name{font-size:12.5px;font-weight:700}
.mic-row .meta{font-size:10.5px;color:var(--on-surface-muted);line-height:1.2;margin-top:1px}
.mic-row .toggle{flex-shrink:0;width:34px;height:18px;border-radius:10px;background:var(--primary);position:relative;cursor:pointer;border:none;padding:0}
.mic-row .toggle::after{content:'';position:absolute;top:2px;left:18px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mic-row.muted .toggle{background:var(--danger)}.mic-row.muted .toggle::after{left:2px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 8px 3px;border-top:1px solid var(--outline-variant);margin-top:4px}
.footer .left,.footer .right{display:flex;align-items:center;gap:6px}
.footer .fl{display:flex;align-items:center;gap:3px;color:var(--on-surface-muted);font-size:10.5px;padding:3px 6px;border-radius:4px;cursor:pointer;border:none;background:transparent;font:inherit}
.footer .fl:hover{background:rgba(26,45,74,.05);color:var(--on-surface)}
.footer .fl .ico{width:11px;height:11px;color:currentColor}.footer .fl .ico svg{width:11px;height:11px}
.footer .fl.primary{color:var(--primary);font-weight:600}
.footer .quit{color:var(--on-surface-soft);padding:4px;border-radius:4px;cursor:pointer;opacity:.6;border:none;background:transparent}
.footer .quit:hover{opacity:1;color:var(--danger);background:var(--danger-soft)}
.footer .quit .ico{width:13px;height:13px;color:currentColor}.footer .quit .ico svg{width:13px;height:13px}
tray-event-card[hidden],tray-channel-row[hidden],#trayChannelsHead[hidden]{display:none!important}
</style>
</head>
<body>
<div class="menu-shell" id="shell">
  <tray-status-hero></tray-status-hero>
  <tray-event-card></tray-event-card>
  <div class="sec-head" id="trayChannelsHead"><span class="dot"></span><span>通道</span></div>
  <tray-channel-row data-id="voice"></tray-channel-row>
  <tray-channel-row data-id="keys"></tray-channel-row>
  <tray-channel-row data-id="softPad"></tray-channel-row>
  <tray-channel-row data-id="camera"></tray-channel-row>
  <div class="sep"></div>
  <tray-mic-toggle></tray-mic-toggle>
  <tray-footer-links></tray-footer-links>
</div>
<script>
(function(){
  var invoke=window.__TAURI_INTERNALS__?function(c,a){return window.__TAURI_INTERNALS__.invoke(c,a);}:function(){return Promise.resolve();};
  var listen=window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.listen?window.__TAURI_INTERNALS__.listen.bind(window.__TAURI_INTERNALS__):function(){return Promise.resolve(function(){});};
  var state={global:{mode:'listening',activeChannelIds:[]},mic:{available:false,muted:false,device:'—'},channels:[],event:null,deepLinks:[]};
  var layout={showEvent:true,showInTray:{voice:true,keys:true,softPad:true,camera:false}};
  var SEGS=['global','mic','channels','event'];
  var ICONS={
    pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
    voice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>',
    keys:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="8" cy="12" r="1.5" fill="currentColor"/><circle cx="16" cy="12" r="1.5" fill="currentColor"/></svg>',
    softPad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="8" cy="7" r="1" fill="currentColor"/><circle cx="12" cy="7" r="1" fill="currentColor"/><circle cx="16" cy="7" r="1" fill="currentColor"/></svg>',
    camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>',
    mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/></svg>',
    open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5V3h6v2"/></svg>',
    settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83"/></svg>',
    diag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
    quit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>'
  };
  var CHIP={voice:'b',keys:'g',softPad:'p',camera:'o'};
  var CHLABEL={voice:'语音',keys:'按键',softPad:'Soft Pad',camera:'摄像头'};
  function act(action,payload){invoke('cmd_tray_action',{action:action,payload:payload||null}).catch(function(){});}
  function ago(ms){if(!ms)return'—';var s=Math.max(0,Math.floor((Date.now()-ms)/1000));if(s<5)return'刚刚';if(s<60)return s+'s 前';return Math.floor(s/60)+'m 前';}
  function modeTitle(m){return m==='paused'?'已暂停':m==='error'?'监听异常':'监听中';}
  function pulseCls(s){return s==='listening'?'listening':s==='error'?'error':s==='off'?'off':s==='paused'?'paused':'standby';}
  function outcomeLabel(o){return o==='sent'?'已发送':o==='failed'?'失败':o==='unsent'?'未发送':'';}
  function outcomeCls(o){return o==='sent'?'ok':o==='failed'?'fail':'warn';}
  function chById(id){return(state.channels||[]).find(function(c){return c.id===id;})||null;}
  function patchSeg(seg,payload){
    if(seg==='global')state.global=payload;
    else if(seg==='mic')state.mic=payload;
    else if(seg==='channels')state.channels=payload;
    else if(seg==='event')state.event=payload;
    document.querySelectorAll('[data-seg]').forEach(function(el){if(el.getAttribute('data-seg')===seg||seg==='channels'&&el.tagName==='TRAY-CHANNEL-ROW')el.render&&el.render();});
    if(seg==='global')document.querySelector('tray-status-hero').render();
    if(seg==='event')document.querySelector('tray-event-card').render();
    if(seg==='mic')document.querySelector('tray-mic-toggle').render();
    if(seg==='channels')document.querySelectorAll('tray-channel-row').forEach(function(el){el.render();});
  }
  function applyLayout(cfg){
    if(!cfg) return;
    layout.showEvent=cfg.showEvent!==false;
    var s=cfg.showInTray||{};
    layout.showInTray.voice=s.voice!==false;
    layout.showInTray.keys=s.keys!==false;
    layout.showInTray.softPad=s.softPad!==false;
    layout.showInTray.camera=!!s.camera;
    var evCard=document.querySelector('tray-event-card');
    if(evCard) evCard.hidden=!layout.showEvent;
    var any=layout.showInTray.voice||layout.showInTray.keys||layout.showInTray.softPad||layout.showInTray.camera;
    var head=document.getElementById('trayChannelsHead');
    if(head) head.hidden=!any;
    document.querySelectorAll('tray-channel-row').forEach(function(row){
      var id=row.getAttribute('data-id');
      row.hidden=!layout.showInTray[id];
    });
  }
  function applyFull(data){
    state.global=data.global||state.global;
    state.mic=data.mic||state.mic;
    state.channels=data.channels||[];
    state.event=data.event||null;
    state.deepLinks=data.deepLinks||[];
    document.querySelector('tray-status-hero').render();
    document.querySelector('tray-event-card').render();
    document.querySelectorAll('tray-channel-row').forEach(function(el){el.render();});
    document.querySelector('tray-mic-toggle').render();
    document.querySelector('tray-footer-links').render();
  }
  class TrayStatusHero extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var g=state.global||{};var paused=g.mode==='paused';
      var chips=(g.activeChannelIds||[]).map(function(id){return'<span class="chip '+(CHIP[id]||'n')+'">'+(CHLABEL[id]||id)+'</span>';}).join('');
      this.innerHTML='<div class="status-hero"><div class="left"><div class="top-line"><span class="pulse '+pulseCls(g.mode==='error'?'error':g.mode==='paused'?'paused':'listening')+'"></span><span class="ttl '+(g.mode==='paused'?'paused':g.mode==='error'?'error':'')+'">'+modeTitle(g.mode)+'</span></div><div class="state-chips">'+chips+'</div></div><button type="button" class="action'+(paused?' paused':'')+'"><span class="ico">'+(paused?ICONS.play:ICONS.pause)+'</span><span class="lbl">'+(paused?'继续':'暂停')+'</span></button></div>';
      this.querySelector('.action').onclick=function(){act('listen_toggle');};
    }
  }
  class TrayEventCard extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var ev=state.event;
      if(!ev){this.innerHTML='<div class="event-card is-empty"><div class="ev-head"><span>刚才</span><span class="t">—</span></div><div class="ev-text"><span class="txt">暂无事件</span></div></div>';return;}
      var ch=ev.channelId||'voice';var oc=ev.outcome?'<span class="ev-outcome '+outcomeCls(ev.outcome)+'">'+outcomeLabel(ev.outcome)+'</span>':'';
      this.innerHTML='<div class="event-card"><div class="ev-head"><span>刚才</span><span class="t">'+ago(ev.t)+'</span><span style="color:var(--on-surface-soft)">·</span><span>'+(CHLABEL[ch]||ch)+'</span></div><div class="ev-text"><span class="ch-ic '+(ch==='keys'?'keys':'')+'"><span class="ico">'+(ICONS[ch]||ICONS.voice)+'</span></span><span class="txt">'+String(ev.text||'').replace(/</g,'&lt;')+'</span>'+oc+'</div></div>';
    }
  }
  class TrayChannelRow extends HTMLElement{
    connectedCallback(){this.render();this.onclick=this._click.bind(this);}
    _click(){var c=chById(this.dataset.id);if(c&&c.deepLink)act('deep_link',{href:c.deepLink});}
    render(){
      var id=this.dataset.id;var c=chById(id)||{name:CHLABEL[id]||id,state:'off',meta:'(未接入)'};
      var wrap=id==='softPad'?'softpad':id;
      this.innerHTML='<button type="button" class="ch-row"><span class="icowrap '+wrap+'"><span class="ico">'+(ICONS[id]||ICONS.voice)+'</span></span><span class="body"><span class="name">'+c.name+' <span class="pulse '+pulseCls(c.state)+'"></span></span><span class="meta">'+String(c.meta||'').replace(/</g,'&lt;')+'</span></span><span class="chev">▸</span></button>';
    }
  }
  class TrayMicToggle extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var m=state.mic||{};var muted=!!m.muted;var ok=!!m.available;
      this.className=muted?'muted':'';this.classList.toggle('disabled',!ok);
      this.innerHTML='<div class="mic-row'+(muted?' muted':'')+(ok?'':' disabled')+'"><span class="icowrap"><span class="ico">'+ICONS.mic+'</span></span><span class="body"><span class="name">麦克风</span><span class="meta">'+(muted?'静音':'开')+' · '+String(m.device||'默认')+'</span></span><button type="button" class="toggle" aria-label="切换麦克风静音"></button></div>';
      var btn=this.querySelector('.toggle');if(btn){btn.onclick=function(e){e.stopPropagation();if(ok)act('mic_toggle');};}
    }
  }
  class TrayFooterLinks extends HTMLElement{
    connectedCallback(){this.render();}
    render(){
      var links=state.deepLinks&&state.deepLinks.length?state.deepLinks:[{id:'main',label:'主窗口',href:'main:home'},{id:'settings',label:'设置',href:'main:settings'},{id:'diagnose',label:'诊断',href:'main:diagnose'}];
      var left=links.map(function(l,i){return'<button type="button" class="fl'+(i===0?' primary':'')+'" data-href="'+l.href+'"><span class="ico">'+(l.id==='settings'?ICONS.settings:l.id==='diagnose'?ICONS.diag:ICONS.open)+'</span>'+l.label+'</button>';}).join('');
      this.innerHTML='<div class="footer"><div class="left">'+left+'</div><div class="right"><button type="button" class="quit" title="退出一声"><span class="ico">'+ICONS.quit+'</span></button></div></div>';
      this.querySelectorAll('.fl').forEach(function(b){b.onclick=function(){act('deep_link',{href:b.getAttribute('data-href')});};});
      this.querySelector('.quit').onclick=function(){act('quit');};
    }
  }
  customElements.define('tray-status-hero',TrayStatusHero);
  customElements.define('tray-event-card',TrayEventCard);
  customElements.define('tray-channel-row',TrayChannelRow);
  customElements.define('tray-mic-toggle',TrayMicToggle);
  customElements.define('tray-footer-links',TrayFooterLinks);
  window.__tray_ready__=function(){
    return Promise.all([
      invoke('cmd_tray_menu_ready'),
      invoke('cmd_tray_customization_get')
    ]).then(function(res){
      var data=typeof res[0]==='string'?JSON.parse(res[0]):res[0];
      applyFull(data);
      applyLayout(res[1]||{});
      return Promise.all(SEGS.map(function(s){return invoke('cmd_tray_subscribe_segment',{segment:s});}));
    });
  };
  listen('tray://patch',function(ev){var p=ev.payload||{};if(p.segment)patchSeg(p.segment,p.payload);}).catch(function(){});
  listen('tray://layout',function(ev){applyLayout(ev.payload||{});}).catch(function(){});
})();
</script>
</body>
</html>
