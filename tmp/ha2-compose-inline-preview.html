<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ha2 compose · Lucide 内化预览</title>
  <style>
    :root {
      --bg: #0f1115;
      --surface: #1a1d24;
      --line: #2a2f3a;
      --ink: #e8eaef;
      --muted: #8b93a7;
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: end center;
      padding: 48px 24px 40px;
      background: radial-gradient(1200px 600px at 50% 0%, #1b2230, var(--bg));
      color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    }
    .note {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      color: var(--muted); font-size: 12px; letter-spacing: .02em;
    }
    .ha2-lucide { display: block; flex: 0 0 auto; pointer-events: none; }

    .ha2-compose {
      width: min(720px, 100%);
      display: flex; flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: color-mix(in srgb, var(--surface) 92%, #000);
      box-shadow: 0 18px 44px -18px rgba(0,0,0,.55);
    }
    .ha2-compose:focus-within {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 18%, transparent),
                  0 18px 44px -18px rgba(0,0,0,.55);
    }
    .ha2-editor {
      width: 100%; min-height: 72px; max-height: 160px; resize: vertical;
      margin: 0; padding: 14px 16px 8px;
      border: 0; outline: 0; background: transparent;
      color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5;
    }
    .ha2-editor::placeholder { color: var(--muted); }

    .ha2-compose-rail {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px 10px;
    }
    .ha2-compose-rail-left,
    .ha2-compose-rail-right {
      display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    }
    .ha2-compose-rail-left { flex: 1 1 auto; }
    .ha2-compose-rail-right { flex: 0 0 auto; margin-left: auto; }

    .ha2-chip {
      height: 28px; display: inline-flex; align-items: center; gap: 6px;
      padding: 0 8px 0 6px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 40%, var(--surface));
      color: var(--ink); font-size: 12px; font-weight: 650;
    }
    .ha2-chip:hover { border-color: var(--accent); color: var(--accent); }
    .ha2-chip-ico {
      width: 18px; height: 18px; border-radius: 5px;
      display: grid; place-items: center; color: #9db4ff;
      background: #2a3142;
    }
    .ha2-chip-caret { color: var(--muted); display: grid; place-items: center; }

    .ha2-model-dd-trigger {
      height: 28px; display: inline-flex; align-items: center; gap: 5px;
      padding: 0 8px; border-radius: 999px; cursor: pointer;
      border: 0; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 650;
    }
    .ha2-model-dd-trigger:hover { color: var(--ink); background: color-mix(in srgb, var(--bg) 35%, transparent); }
    .ha2-model-dd-ico {
      width: 14px; height: 14px; border-radius: 3px;
      background: linear-gradient(135deg, #3d7cff, #6ea8ff);
    }

    .ha2-local-dot {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 0 6px; color: var(--muted); font-size: 11px; font-weight: 650;
    }
    .ha2-local-dot i {
      width: 7px; height: 7px; border-radius: 50%;
      background: #3ecf8e; box-shadow: 0 0 0 2px color-mix(in srgb, #3ecf8e 25%, transparent);
    }

    .ha2-round, .ha2-send, .ha2-compose-more {
      width: 30px; height: 30px; border-radius: 999px; cursor: pointer;
      display: grid; place-items: center; border: 0; flex: 0 0 auto;
      padding: 0;
    }
    .ha2-compose-more, .ha2-round {
      background: transparent; color: var(--muted);
    }
    .ha2-compose-more:hover, .ha2-round:hover {
      color: var(--ink); background: color-mix(in srgb, var(--bg) 40%, transparent);
    }
    .ha2-send {
      background: var(--ink); color: #111;
    }
    .ha2-send:disabled { opacity: .35; cursor: default; }

    .ha2-compose-overflow {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 0 10px 10px;
    }
    .ha2-compose-overflow[hidden] { display: none !important; }
    .ha2-link {
      height: 26px; padding: 0 9px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--line); background: transparent;
      color: var(--muted); font-size: 11px; font-weight: 650;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .ha2-link:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  </style>
</head>
<body>
  <p class="note">Lucide 描边图标 · file:// 打开预览</p>

  <div class="ha2-compose" data-ha2-compose>
    <textarea class="ha2-editor" data-ha2-draft rows="3"
      placeholder="聊思路、读代码疑问，或生成给其他模型的步骤…"></textarea>

    <div class="ha2-compose-rail">
      <div class="ha2-compose-rail-left">
        <button type="button" class="ha2-chip target" data-ha2-picker title="选择 Agent">
          <span class="ha2-chip-ico" aria-hidden="true">
            <!-- lucide: infinity -->
            <svg class="ha2-lucide" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/></svg>
          </span>
          <span>Agent</span>
          <span class="ha2-chip-caret" aria-hidden="true">
            <svg class="ha2-lucide" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </button>

        <button type="button" class="ha2-model-dd-trigger" title="模型">
          <span class="ha2-model-dd-ico" aria-hidden="true"></span>
          <span>Auto</span>
          <svg class="ha2-lucide" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <span class="ha2-local-dot" title="本机对话">
          <i aria-hidden="true"></i>
          <span>Local</span>
        </span>
      </div>

      <div class="ha2-compose-rail-right">
        <button type="button" class="ha2-compose-more" data-ha2-compose-more title="更多" aria-expanded="false">
          <!-- lucide: ellipsis -->
          <svg class="ha2-lucide" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
        <button type="button" class="ha2-round" data-ha2-add title="加入材料">
          <!-- lucide: paperclip -->
          <svg class="ha2-lucide" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6-8.414 8.586a2 2 0 0 0 2.829 2.829l8.414-8.586a4 4 0 1 0-5.657-5.657l-8.379 8.551a6 6 0 1 0 8.485 8.485l8.379-8.551"/></svg>
        </button>
        <button type="button" class="ha2-send" data-ha2-send title="发送" aria-label="发送" disabled>
          <!-- lucide: arrow-up -->
          <svg class="ha2-lucide" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </button>
      </div>
    </div>

    <div class="ha2-compose-overflow" data-ha2-compose-overflow hidden>
      <button type="button" class="ha2-link">
        <svg class="ha2-lucide" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        Soft Pad
      </button>
      <button type="button" class="ha2-link">
        <svg class="ha2-lucide" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        语音
      </button>
      <button type="button" class="ha2-link">
        <svg class="ha2-lucide" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        摄像头
      </button>
      <button type="button" class="ha2-link">提供方</button>
      <button type="button" class="ha2-link">整理任务</button>
    </div>
  </div>

  <script>
    (function () {
      var more = document.querySelector('[data-ha2-compose-more]');
      var ov = document.querySelector('[data-ha2-compose-overflow]');
      var ta = document.querySelector('[data-ha2-draft]');
      var send = document.querySelector('[data-ha2-send]');
      more.addEventListener('click', function () {
        var open = ov.hasAttribute('hidden');
        if (open) ov.removeAttribute('hidden');
        else ov.setAttribute('hidden', '');
        more.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      function sync() { send.disabled = !String(ta.value || '').trim(); }
      ta.addEventListener('input', sync);
      sync();
    })();
  </script>
</body>
</html>
