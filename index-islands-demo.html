<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>React Islands 演示</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .demo-section {
      margin-bottom: 40px;
      padding: 20px;
      border: 2px dashed #ddd;
      border-radius: 8px;
    }
    .demo-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .demo-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    .demo-buttons button {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .demo-buttons button:hover {
      background: #0056b3;
    }
    .old-content {
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>React Islands 演示</h1>
  <p>这个页面展示如何在现有的 HTML 中嵌入 React 组件。</p>

  <!-- Toast Island（全局） -->
  <div data-react-island="toast"></div>

  <!-- 演示 1: Settings Island -->
  <div class="demo-section">
    <div class="demo-title">🏗️ Island: Settings（设置面板）</div>
    <div class="old-content">
      这里是旧的设置面板（将被 React 组件替换）
    </div>
    <div data-react-island="settings" data-react-props='{"title": "我的设置"}'></div>
  </div>

  <!-- 演示 2: 手动调用 Toast API -->
  <div class="demo-section">
    <div class="demo-title">🍞 测试 Toast API</div>
    <div class="old-content">
      点击按钮通过 JavaScript 调用 React 的 Toast 组件
    </div>
    <div class="demo-buttons">
      <button onclick="showToast('info')">显示信息</button>
      <button onclick="showToast('success')">显示成功</button>
      <button onclick="showToast('warn')">显示警告</button>
      <button onclick="showToast('error')">显示错误</button>
    </div>
  </div>

  <!-- 演示 3: 动态挂载 Island -->
  <div class="demo-section">
    <div class="demo-title">🔌 动态挂载 Island</div>
    <div class="old-content">
      <div id="dynamic-container" style="margin-bottom: 10px;">
        点击按钮在下方动态挂载 React 组件
      </div>
    </div>
    <div id="dynamic-island"></div>
    <div class="demo-buttons">
      <button onclick="mountDynamicIsland()">挂载 Settings Island</button>
      <button onclick="unmountDynamicIsland()">卸载 Island</button>
    </div>
  </div>

  <!-- 引入 React Islands 构建文件 -->
  <!-- 注意：你需要先运行 npm run build 生成 react-dist 目录 -->
  <script type="module">
    // 在实际项目中，这里会引用构建后的文件
    console.log('请先运行 npm run build 生成 React Islands 构建文件');
    console.log('然后将 main.tsx 构建并引入到页面中');

    // 临时模拟 React Toast API（演示用）
    if (!window.ReactToast) {
      window.ReactToast = {
        show: function(message, type) {
          alert('[' + type + '] ' + message);
        }
      };
    }
  </script>

  <script>
    // 演示: 调用 Toast API
    function showToast(type) {
      const messages = {
        info: '这是一条信息提示',
        success: '操作成功！',
        warn: '请注意这个警告',
        error: '出了点问题'
      };
      if (window.ReactToast) {
        window.ReactToast.show(messages[type] || 'Hello', type);
      } else {
        alert('React Toast 未加载，请先运行 npm run build');
      }
    }

    // 演示: 动态挂载 Island
    let islandMounted = false;
    function mountDynamicIsland() {
      if (islandMounted) {
        alert('Island 已挂载');
        return;
      }

      const container = document.getElementById('dynamic-island');
      if (!container) return;

      container.setAttribute('data-react-island', 'settings');
      container.setAttribute('data-react-props', JSON.stringify({ title: '动态加载的设置' }));

      if (window.ReactIslands) {
        window.ReactIslands.mount(container);
        islandMounted = true;
      } else {
        alert('React Islands 未加载');
        // 模拟效果
        container.innerHTML = '<div style="padding: 20px; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 8px;">[模拟] Settings Island 已加载</div>';
        islandMounted = true;
      }
    }

    function unmountDynamicIsland() {
      const container = document.getElementById('dynamic-island');
      if (!container) return;

      container.removeAttribute('data-react-island');
      container.removeAttribute('data-react-props');
      container.innerHTML = '';
      islandMounted = false;
    }
  </script>
</body>
</html>
