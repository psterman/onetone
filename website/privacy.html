<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隐私政策 — 一声 OneTone</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/site.css">
</head>
<body class="bg-slate-50 dark:bg-surface-dark text-slate-900 dark:text-slate-100">
  <header class="site-nav-shell">
    <div class="site-nav-card glass-header">
      <div class="site-nav-inner">
        <a class="site-nav-brand" href="index.html">
          <img src="assets/logo.png" alt="" width="32" height="32">
          <span>一声 OneTone</span>
        </a>
      </div>
    </div>
  </header>
  <main class="max-w-2xl mx-auto px-6 pb-12 text-slate-600 dark:text-slate-300">
    <div data-lang-content="zh">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-4">隐私政策</h1>
      <p class="mb-4">一声在本地运行。设置保存在 <code class="bg-slate-100 dark:bg-slate-800 px-1 rounded">%APPDATA%\onetone\</code>，不上传服务器。</p>
      <p class="mb-4">检查更新连接 GitHub Releases。离线引擎本地处理音频。</p>
      <p><a href="https://github.com/psterman/voice-pilot/blob/main/docs/PRIVACY.md" class="text-brand-600">完整文档</a></p>
    </div>
    <div data-lang-content="en">
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-4">Privacy</h1>
      <p class="mb-4">OneTone runs locally. Settings stay in %APPDATA%\onetone\ — not uploaded.</p>
      <p class="mb-4">Update checks use GitHub Releases. Offline engines process audio on device.</p>
      <p><a href="https://github.com/psterman/voice-pilot/blob/main/docs/PRIVACY.md" class="text-brand-600">Full policy</a></p>
    </div>
  </main>
  <script src="js/site.js"></script><script src="js/i18n.js"></script>
</body>
</html>
