  <rect x="40" y="888" width="1200" height="24" rx="6" fill="rgba(46,125,79,0.1)"/>
  <text x="56" y="906" class="small" fill="#2e7d4f">✓ 无右栏 · 首屏 1 处 scope · 1 开关 · 1 连接卡 · 跨应用管理折叠</text>

