<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920">
  <defs><style type="text/css"><![CDATA[
.bg{fill:#eef3f7}.shell{fill:#f8fbfd;stroke:#d5e0eb}
.ink{fill:#142033}.muted{fill:#6b7a8d}.faint{fill:#94a3b4}
.surface{fill:#ffffff;stroke:rgba(26,45,74,0.14)}
.soft{fill:#f1f5f9;stroke:rgba(26,45,74,0.14)}
.small{font:11px 'Segoe UI','Microsoft YaHei',sans-serif}
.body{font:13px 'Segoe UI','Microsoft YaHei',sans-serif}
.title{font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif}
.h1{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif}
.label{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif}
.cap{font:700 10px 'Segoe UI','Microsoft YaHei',sans-serif}
]]></style></defs>

  <rect class="bg" width="1280" height="920"/>
  <rect x="40" y="16" width="115" height="22" rx="11" fill="#2e7d4f20" stroke="#2e7d4f"/>
