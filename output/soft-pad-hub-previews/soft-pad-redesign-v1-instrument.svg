<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs><style type="text/css"><![CDATA[
.bg{fill:#eef3f7}.shell{fill:#f8fbfd;stroke:#d5e0eb}.top{fill:#fff;stroke:#dce5ef}
.ink{fill:#142033}.muted{fill:#6b7a8d}.faint{fill:#94a3b4}
.key{fill:#fff;stroke:#d5e1ec}.keyA{fill:#f0f9fc;stroke:#9ed6e8}
.chip{fill:#fff;stroke:#d5e1ec}.chipOn{fill:#e8f6fb;stroke:#3eb8dc}
.stage{fill:#fff;stroke:#d5e1ec}.stageOn{fill:#e8f6fb;stroke:#3eb8dc;stroke-width:1.6}
.panel{fill:#f4f8fb;stroke:#d5e0eb}.row{fill:#fff;stroke:#e2eaf2}
.small{font:11px 'Segoe UI','Microsoft YaHei',sans-serif}
.body{font:13px 'Segoe UI','Microsoft YaHei',sans-serif}
.title{font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif}
.h1{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif}
.label{font:700 13px 'Segoe UI','Microsoft YaHei',sans-serif}
.cap{font:700 10px 'Segoe UI','Microsoft YaHei',sans-serif}
]]></style></defs>

  <rect class="bg" width="1280" height="900"/>
  <rect x="48" y="36" width="1184" height="760" rx="18" class="shell"/>
  <rect x="48" y="36" width="1184" height="56" rx="18" class="top"/>
  <text x="72" y="70" class="h1 ink">Codex</text>
  <rect x="148" y="52" width="52" height="24" rx="12" fill="#e8f8ef" stroke="#9ed9b5"/>
  <text x="174" y="68" text-anchor="middle" class="small" fill="#1f7a4a">已启用</text>
  <rect x="212" y="52" width="120" height="24" rx="12" class="chip"/>
  <text x="272" y="68" text-anchor="middle" class="small ink">绑定 · Codex</text>
  <rect x="1168" y="52" width="36" height="24" rx="12" class="chip"/>
  <text x="1186" y="68" text-anchor="middle" class="small muted">...</text>
  <text x="72" y="112" class="small faint">方案 V1 · 仪器台稳妥版 — 单行状态 · 无编号 · 详情默认展开 · 功能全保留</text>
  
  <g transform="translate(72 132)">
    <rect class="stageOn" x="0" y="0" width="148" height="64" rx="12"/>
    <rect x="16" y="16" width="28" height="28" rx="7" fill="#dff3fa"/>
    <rect x="22" y="22" width="6" height="6" rx="1" fill="#3eb8dc"/>
    <rect x="30" y="22" width="6" height="6" rx="1" fill="#3eb8dc"/>
    <rect x="22" y="30" width="6" height="6" rx="1" fill="#3eb8dc"/>
    <rect x="30" y="30" width="6" height="6" rx="1" fill="#3eb8dc"/>
    <text x="54" y="30" class="label ink">Soft Pad</text>
    <text x="54" y="48" class="small muted">改键位 · 何时显示</text>
    <rect class="stage" x="164" y="0" width="148" height="64" rx="12"/>
    <circle cx="194" cy="30" r="8" fill="#eef2f6" stroke="#c5d0dc"/>
    <circle cx="194" cy="28" r="2.2" fill="#94a3b4"/>
    <text x="218" y="30" class="label ink">状态灯</text>
    <text x="218" y="48" class="small muted">看 AI 忙不忙</text>
    <rect class="stage" x="328" y="0" width="168" height="64" rx="12"/>
    <rect x="344" y="22" width="28" height="16" rx="8" fill="#fff7e8" stroke="#f0c56d"/>
    <text x="382" y="30" class="label ink">时间胶囊</text>
    <text x="382" y="48" class="small muted">恢复前自动保存</text>
  </g>
  <g transform="translate(72 220)">
    <rect class="panel" width="560" height="430" rx="16"/>
    
    <g transform="translate(24 18)">
      <rect class="chipOn" x="0" y="0" width="88" height="28" rx="14"/>
      <text x="44" y="18" text-anchor="middle" class="cap" fill="#1f7a92">何时显示</text>
      <rect class="chip" x="98" y="0" width="64" height="28" rx="14"/>
      <text x="130" y="18" text-anchor="middle" class="cap muted">外观</text>
      <rect class="chip" x="172" y="0" width="64" height="28" rx="14"/>
      <text x="204" y="18" text-anchor="middle" class="cap muted">改按键</text>
      <rect class="chip" x="246" y="0" width="108" height="28" rx="14"/>
      <text x="300" y="18" text-anchor="middle" class="cap muted">动作键 · 会话槽</text>
    </g>
    <rect x="48" y="64" width="464" height="330" rx="14" fill="#f7fafc" stroke="#dde6ef"/>
    <g transform="translate(72 92)"><rect class="keyA" x="0" y="0" width="72" height="52" rx="10"/>
    <text x="36" y="22" text-anchor="middle" class="label ink">ENC</text>
    <text x="36" y="40" text-anchor="middle" class="cap faint">模式</text><rect class="key" x="84" y="0" width="72" height="52" rx="10"/>
    <text x="120" y="22" text-anchor="middle" class="label ink">7</text>
    <text x="120" y="40" text-anchor="middle" class="cap faint">AGENT</text><rect class="key" x="168" y="0" width="72" height="52" rx="10"/>
    <text x="204" y="22" text-anchor="middle" class="label ink">8</text>
    <text x="204" y="40" text-anchor="middle" class="cap faint">CLAUDE</text><rect class="key" x="252" y="0" width="72" height="52" rx="10"/>
    <text x="288" y="22" text-anchor="middle" class="label ink">9</text>
    <text x="288" y="40" text-anchor="middle" class="cap faint">CODEX</text><rect class="key" x="336" y="0" width="72" height="52" rx="10"/>
    <text x="372" y="22" text-anchor="middle" class="label ink">NAV</text>
    <text x="372" y="40" text-anchor="middle" class="cap faint">方向</text><rect class="key" x="0" y="64" width="72" height="52" rx="10"/>
    <text x="36" y="86" text-anchor="middle" class="label ink">4</text>
    <text x="36" y="104" text-anchor="middle" class="cap faint">PERMIT</text><rect class="key" x="84" y="64" width="72" height="52" rx="10"/>
    <text x="120" y="86" text-anchor="middle" class="label ink">5</text>
    <text x="120" y="104" text-anchor="middle" class="cap faint">STATUS</text><rect class="key" x="168" y="64" width="72" height="52" rx="10"/>
    <text x="204" y="86" text-anchor="middle" class="label ink">6</text>
    <text x="204" y="104" text-anchor="middle" class="cap faint">APPS</text><rect class="keyA" x="252" y="64" width="72" height="52" rx="10"/>
    <text x="288" y="86" text-anchor="middle" class="label ink">UNDO</text>
    <text x="288" y="104" text-anchor="middle" class="cap faint">撤销</text><rect class="keyA" x="336" y="64" width="72" height="52" rx="10"/>
    <text x="372" y="86" text-anchor="middle" class="label ink">SEARCH</text>
    <text x="372" y="104" text-anchor="middle" class="cap faint">搜索</text><rect class="key" x="0" y="128" width="72" height="52" rx="10"/>
    <text x="36" y="150" text-anchor="middle" class="label ink">1</text>
    <text x="36" y="168" text-anchor="middle" class="cap faint">FAST</text><rect class="key" x="84" y="128" width="72" height="52" rx="10"/>
    <text x="120" y="150" text-anchor="middle" class="label ink">2</text>
    <text x="120" y="168" text-anchor="middle" class="cap faint">CMD</text><rect class="key" x="168" y="128" width="72" height="52" rx="10"/>
    <text x="204" y="150" text-anchor="middle" class="label ink">3</text>
    <text x="204" y="168" text-anchor="middle" class="cap faint">REJECT</text><rect class="keyA" x="252" y="128" width="156" height="52" rx="10"/>
    <text x="330" y="150" text-anchor="middle" class="label ink">SEND</text>
    <text x="330" y="168" text-anchor="middle" class="cap faint">发送</text><rect class="key" x="0" y="192" width="156" height="52" rx="10"/>
    <text x="78" y="214" text-anchor="middle" class="label ink">VOICE</text>
    <text x="78" y="232" text-anchor="middle" class="cap faint">语音</text><rect class="key" x="168" y="192" width="72" height="52" rx="10"/>
    <text x="204" y="214" text-anchor="middle" class="label ink">0</text>
    <text x="204" y="232" text-anchor="middle" class="cap faint">DOT</text><rect class="key" x="252" y="192" width="156" height="52" rx="10"/>
    <text x="330" y="214" text-anchor="middle" class="label ink">PLUS</text>
    <text x="330" y="232" text-anchor="middle" class="cap faint">扩展</text></g>
  </g>
  <g transform="translate(656 220)">
    <rect class="panel" width="544" height="430" rx="16"/>
    
    <text x="24" y="36" class="title ink">何时显示</text>
    <text x="24" y="56" class="small muted">浮窗怎么出现；冷门开关收在高级里</text>
    <rect class="row" x="24" y="78" width="496" height="52" rx="10"/>
    <circle cx="48" cy="104" r="7" fill="#3eb8dc"/>
    <text x="68" y="100" class="label ink">跟随应用</text>
    <text x="68" y="116" class="small muted">前台是绑定 App 时显示</text>
    <rect class="row" x="24" y="140" width="496" height="52" rx="10"/>
    <circle cx="48" cy="166" r="7" fill="#fff" stroke="#c5d0dc"/>
    <text x="68" y="162" class="label ink">保持在最前</text>
    <text x="68" y="178" class="small muted">始终置顶浮窗</text>
    <rect class="row" x="24" y="202" width="496" height="52" rx="10"/>
    <circle cx="48" cy="228" r="7" fill="#fff" stroke="#c5d0dc"/>
    <text x="68" y="224" class="label ink">迷你条</text>
    <text x="68" y="240" class="small muted">只看状态灯 · 156x44</text>
    <rect class="row" x="24" y="264" width="496" height="52" rx="10"/>
    <circle cx="48" cy="290" r="7" fill="#fff" stroke="#c5d0dc"/>
    <text x="68" y="286" class="label ink">不显示浮窗</text>
    <text x="68" y="302" class="small muted">仅保留热键能力</text>
    <rect x="24" y="340" width="496" height="1" fill="#e2eaf2"/>
    <text x="24" y="370" class="label muted">高级</text>
    <text x="24" y="392" class="small faint">NumLock · 导航键 · 测试前台 · 账号额度</text>
  </g>
  <text x="72" y="840" class="title ink">V1 · 仪器台稳妥版</text>
  <text x="72" y="866" class="body muted">迁移成本最低：保留左键盘 + 右详情，砍掉重复 cockpit 与编号装饰；默认打开「何时显示」。</text>
