<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs><style type="text/css"><![CDATA[
.bg{fill:#e9eef3}.shell{fill:#f7fafc;stroke:#d2dde8}
.ink{fill:#132033}.muted{fill:#6b7a8d}.faint{fill:#93a0b0}
.cyan{fill:#3eb8dc}
.small{font:11px 'Segoe UI','Microsoft YaHei',sans-serif}
.body{font:13px 'Segoe UI','Microsoft YaHei',sans-serif}
.title{font:700 15px 'Segoe UI','Microsoft YaHei',sans-serif}
.h1{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif}
.h0{font:700 26px 'Segoe UI','Microsoft YaHei',sans-serif}
.label{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif}
.cap{font:700 10px 'Segoe UI','Microsoft YaHei',sans-serif}
.key{fill:#fff;stroke:#d2deea}.keyA{fill:#eef8fb;stroke:#8ecfe0}
.chip{fill:#fff;stroke:#d2deea}.chipOn{fill:#e5f5fb;stroke:#3eb8dc}
.seg{fill:#e8eef4}.segOn{fill:#fff;stroke:#3eb8dc;stroke-width:1.5}
.panel{fill:#f3f7fa;stroke:#d2dde8}.row{fill:#fff;stroke:#e1e9f1}
.rail{fill:#121820}.railInk{fill:#e8f0f8}.railMuted{fill:#8b9aab}
.railOn{fill:#1c2836;stroke:#3eb8dc}
.bezel{fill:#dfe8f0}.bezelDial{fill:#1a2430}
.lb{fill:#0f141c}.dot{fill:#34d399}
.spine{fill:#f7f1e6;stroke:#e5d2a8}
]]></style></defs>

  <rect class="bg" width="1280" height="900"/>
  <rect x="40" y="28" width="1200" height="780" rx="16" class="shell"/>

  <!-- L0 left app rail -->
  <rect x="40" y="28" width="200" height="780" rx="16" class="rail"/>
  <text x="60" y="64" class="title railInk">应用</text>
  <text x="60" y="88" class="small railMuted">虚拟键盘</text>

  <rect x="56" y="116" width="168" height="64" rx="12" class="railOn"/>
  <text x="72" y="142" class="label railInk">Codex</text>
  <text x="72" y="162" class="cap" fill="#5ec8e8">已启用</text>

  <rect x="56" y="192" width="168" height="52" rx="12" fill="#161e2a"/>
  <text x="72" y="222" class="label railMuted">Claude</text>
  <rect x="56" y="256" width="168" height="52" rx="12" fill="#161e2a"/>
  <text x="72" y="286" class="label railMuted">Cursor</text>

  <rect x="56" y="340" width="168" height="1" fill="#2a3544"/>
  <text x="60" y="370" class="cap railMuted">更多</text>
  <text x="60" y="396" class="small railMuted">账号</text>
  <text x="60" y="416" class="small railMuted">额度</text>
  <text x="60" y="436" class="small railMuted">测试前台</text>

  <!-- L1 face list under workspace header -->
  <g transform="translate(268 48)">
    <text x="0" y="0" class="small faint">L0 左侧 App 轨常驻 → L1 面名单列 → L2 右侧全宽工作区互斥替换</text>
    <text x="0" y="36" class="h1 ink">工作区</text>
    <!-- face as vertical text tabs, not cards -->
    <g transform="translate(0 56)">
      <rect x="0" y="0" width="4" height="56" fill="#3eb8dc"/>
      <text x="16" y="18" class="title ink">Soft Pad</text>
      <text x="16" y="38" class="small muted">出现 / 键位 / 外观</text>
      <text x="16" y="78" class="label muted">状态灯</text>
      <text x="16" y="108" class="label muted">时间胶囊</text>
    </g>
  </g>

  <!-- L2 workspace only Soft Pad -->
  <g transform="translate(420 120)">
    <rect width="780" height="640" rx="14" fill="#eef3f7" stroke="#d0dbe6"/>
    <rect x="24" y="20" width="460" height="420" rx="16" fill="#f7fafc" stroke="#c9d6e3"/>
    <g transform="translate(48 44)"><rect class="keyA" x="0" y="0" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="32.3" y="20" text-anchor="middle" class="label ink">ENC</text>
        <text x="32.3" y="36" text-anchor="middle" class="cap faint">模式</text><rect class="key" x="74.1" y="0" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="106.39999999999999" y="20" text-anchor="middle" class="label ink">7</text>
        <text x="106.39999999999999" y="36" text-anchor="middle" class="cap faint">AG</text><rect class="key" x="148.2" y="0" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="180.5" y="20" text-anchor="middle" class="label ink">8</text>
        <text x="180.5" y="36" text-anchor="middle" class="cap faint">CL</text><rect class="key" x="222.29999999999998" y="0" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="254.59999999999997" y="20" text-anchor="middle" class="label ink">9</text>
        <text x="254.59999999999997" y="36" text-anchor="middle" class="cap faint">CX</text><rect class="key" x="296.4" y="0" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="328.7" y="20" text-anchor="middle" class="label ink">NAV</text>
        <text x="328.7" y="36" text-anchor="middle" class="cap faint">方向</text><rect class="key" x="0" y="55.099999999999994" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="32.3" y="75.1" text-anchor="middle" class="label ink">4</text>
        <text x="32.3" y="91.1" text-anchor="middle" class="cap faint">PERM</text><rect class="key" x="74.1" y="55.099999999999994" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="106.39999999999999" y="75.1" text-anchor="middle" class="label ink">5</text>
        <text x="106.39999999999999" y="91.1" text-anchor="middle" class="cap faint">STAT</text><rect class="key" x="148.2" y="55.099999999999994" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="180.5" y="75.1" text-anchor="middle" class="label ink">6</text>
        <text x="180.5" y="91.1" text-anchor="middle" class="cap faint">APPS</text><rect class="keyA" x="222.29999999999998" y="55.099999999999994" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="254.59999999999997" y="75.1" text-anchor="middle" class="label ink">UNDO</text>
        <text x="254.59999999999997" y="91.1" text-anchor="middle" class="cap faint">撤销</text><rect class="keyA" x="296.4" y="55.099999999999994" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="328.7" y="75.1" text-anchor="middle" class="label ink">FIND</text>
        <text x="328.7" y="91.1" text-anchor="middle" class="cap faint">搜索</text><rect class="key" x="0" y="110.19999999999999" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="32.3" y="130.2" text-anchor="middle" class="label ink">1</text>
        <text x="32.3" y="146.2" text-anchor="middle" class="cap faint">FAST</text><rect class="key" x="74.1" y="110.19999999999999" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="106.39999999999999" y="130.2" text-anchor="middle" class="label ink">2</text>
        <text x="106.39999999999999" y="146.2" text-anchor="middle" class="cap faint">CMD</text><rect class="key" x="148.2" y="110.19999999999999" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="180.5" y="130.2" text-anchor="middle" class="label ink">3</text>
        <text x="180.5" y="146.2" text-anchor="middle" class="cap faint">NO</text><rect class="keyA" x="222.29999999999998" y="110.19999999999999" width="138.7" height="45.599999999999994" rx="9"/>
        <text x="291.65" y="130.2" text-anchor="middle" class="label ink">SEND</text>
        <text x="291.65" y="146.2" text-anchor="middle" class="cap faint">发送</text><rect class="key" x="0" y="165.29999999999998" width="138.7" height="45.599999999999994" rx="9"/>
        <text x="69.35" y="185.29999999999998" text-anchor="middle" class="label ink">VOICE</text>
        <text x="69.35" y="201.29999999999998" text-anchor="middle" class="cap faint">语音</text><rect class="key" x="148.2" y="165.29999999999998" width="64.6" height="45.599999999999994" rx="9"/>
        <text x="180.5" y="185.29999999999998" text-anchor="middle" class="label ink">0</text>
        <text x="180.5" y="201.29999999999998" text-anchor="middle" class="cap faint">DOT</text><rect class="key" x="222.29999999999998" y="165.29999999999998" width="138.7" height="45.599999999999994" rx="9"/>
        <text x="291.65" y="185.29999999999998" text-anchor="middle" class="label ink">PLUS</text>
        <text x="291.65" y="201.29999999999998" text-anchor="middle" class="cap faint">+</text></g>
    <!-- mode as side stack fused to workspace, not subtab bar -->
    <g transform="translate(24 460)">
      <text x="0" y="0" class="cap faint">padMode</text>
      <rect x="0" y="12" width="72" height="28" rx="8" fill="#3eb8dc"/>
      <text x="36" y="30" text-anchor="middle" class="cap" fill="#06202a">出现</text>
      <rect x="80" y="12" width="64" height="28" rx="8" class="chip"/>
      <text x="112" y="30" text-anchor="middle" class="cap muted">键位</text>
      <rect x="152" y="12" width="64" height="28" rx="8" class="chip"/>
      <text x="184" y="30" text-anchor="middle" class="cap muted">外观</text>
      <rect x="224" y="12" width="64" height="28" rx="8" class="chip"/>
      <text x="256" y="30" text-anchor="middle" class="cap muted">用途</text>
    </g>
    
  <g transform="translate(510 20)">
    <rect class="panel" width="246" height="520" rx="14"/>
    <text x="18" y="28" class="title ink">出现</text>
    <text x="18" y="48" class="small muted">前台匹配时显示</text>
    <rect class="row" x="16" y="66" width="214" height="48" rx="10"/>
    <circle cx="36" cy="90" r="6" fill="#3eb8dc"/>
    <text x="52" y="86" class="label ink">跟随应用</text>
    <text x="52" y="102" class="small muted">前台匹配时显示</text>
    <rect class="row" x="16" y="124" width="214" height="48" rx="10"/>
    <circle cx="36" cy="148" r="6" fill="#fff" stroke="#c5d0dc"/>
    <text x="52" y="144" class="label ink">置顶</text>
    <rect class="row" x="16" y="182" width="214" height="48" rx="10"/>
    <circle cx="36" cy="206" r="6" fill="#fff" stroke="#c5d0dc"/>
    <text x="52" y="202" class="label ink">迷你条</text>
    <rect class="row" x="16" y="240" width="214" height="48" rx="10"/>
    <circle cx="36" cy="264" r="6" fill="#fff" stroke="#c5d0dc"/>
    <text x="52" y="260" class="label ink">不显示</text>
  </g>
  </g>

  <text x="268" y="850" class="title ink">思路 B · 应用轨工作台</text>
  <text x="268" y="874" class="body muted">应用与面设置物理分离：绑定/开关永远在左轨；右侧只有当前面的 Hero。</text>

</svg>