<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs><style>
    .bg{fill:#eef2f6}.panel{fill:#fbfcfe;stroke:#d6e1ec}.top{fill:#fff;stroke:#dce5ee}.ink{fill:#142033}.muted{fill:#687789}.tile{fill:#fff;stroke:#d8e1ec}.active{fill:#f6fbff;stroke:#8fc4ff;stroke-width:1.5}.key{fill:#fff;stroke:#d8e1ec}.on{fill:#fff7ed;stroke:#fdba74}.pill{fill:#f1f5f9}.green{fill:#dcfce7;stroke:#9ee6b5}.small{font:12px "Microsoft YaHei",Arial}.body{font:14px "Microsoft YaHei",Arial}.title{font:700 18px "Microsoft YaHei",Arial}.h1{font:700 24px "Microsoft YaHei",Arial}.label{font:700 16px "Microsoft YaHei",Arial}.big{font:700 30px Arial}
  </style></defs>
  <rect class="bg" width="1280" height="900"/>
  <rect x="54" y="44" width="1172" height="812" rx="24" class="panel"/>
  <rect x="54" y="44" width="1172" height="64" rx="24" class="top"/>
  <text x="86" y="84" class="h1 ink">Soft Pad</text>
  <rect x="1012" y="62" width="96" height="28" rx="14" class="green"/><text x="1040" y="82" class="small" fill="#166534">开着</text>
  <rect x="1122" y="62" width="70" height="28" rx="14" class="pill"/><text x="1142" y="82" class="small muted">Codex</text>
  <g transform="translate(86 142)">
    <text x="0" y="0" class="title ink">键盘预览</text><text x="0" y="26" class="body muted">预览只回答“现在长什么样”</text>
    <rect x="0" y="60" width="652" height="320" rx="22" fill="#edf3f8" stroke="#d7e2ee"/>
    <g transform="translate(26 88)">
      <rect class="key on" x="0" y="0" width="112" height="62" rx="14"/><text x="38" y="38" class="body ink">状态</text>
      <rect class="key" x="126" y="0" width="112" height="62" rx="14"/><text x="164" y="38" class="body ink">命令</text>
      <rect class="key" x="252" y="0" width="112" height="62" rx="14"/><text x="290" y="38" class="body ink">输入</text>
      <rect class="key on" x="378" y="0" width="112" height="62" rx="14"/><text x="416" y="38" class="body ink">确认</text>
      <rect class="key" x="504" y="0" width="112" height="62" rx="14"/><text x="546" y="38" class="body ink">/</text>
      <rect class="key" x="0" y="82" width="112" height="62" rx="14"/><text x="50" y="120" class="body ink">7</text>
      <rect class="key on" x="126" y="82" width="112" height="62" rx="14"/><text x="164" y="120" class="body ink">发送</text>
      <rect class="key" x="252" y="82" width="112" height="62" rx="14"/><text x="302" y="120" class="body ink">9</text>
      <rect class="key" x="378" y="82" width="112" height="62" rx="14"/><text x="428" y="120" class="body ink">4</text>
      <rect class="key" x="504" y="82" width="112" height="144" rx="14"/><text x="542" y="162" class="body ink">回车</text>
      <rect class="key on" x="0" y="164" width="112" height="62" rx="14"/><text x="38" y="202" class="body ink">取消</text>
      <rect class="key" x="126" y="164" width="238" height="62" rx="14"/><text x="220" y="202" class="body ink">空格</text>
      <rect class="key" x="378" y="164" width="112" height="62" rx="14"/><text x="428" y="202" class="body ink">3</text>
    </g>
  </g>
  <g transform="translate(86 562)">
    <rect class="tile active" x="0" y="0" width="268" height="134" rx="16"/>
    <text x="22" y="44" class="big" fill="#2563eb">1</text><text x="70" y="42" class="label ink">改按键</text><text x="70" y="68" class="small muted">点键盘上的键，改它做什么</text><rect x="70" y="88" width="84" height="24" rx="12" class="pill"/><text x="84" y="105" class="small muted">已设 12/15</text>
    <rect class="tile" x="292" y="0" width="268" height="134" rx="16"/>
    <text x="314" y="44" class="big" fill="#10b981">2</text><text x="362" y="42" class="label ink">外观</text><text x="362" y="68" class="small muted">大键盘或迷你条，换皮肤</text><rect x="362" y="88" width="66" height="24" rx="12" class="pill"/><text x="377" y="105" class="small muted">大键盘</text>
    <rect class="tile" x="584" y="0" width="268" height="134" rx="16"/>
    <text x="606" y="44" class="big" fill="#f59e0b">3</text><text x="654" y="42" class="label ink">何时显示</text><text x="654" y="68" class="small muted">跟应用一起出现；要不要占数字键</text><rect x="654" y="88" width="92" height="24" rx="12" class="pill"/><text x="669" y="105" class="small muted">开着 · 浮窗</text>
    <rect class="tile" x="876" y="0" width="268" height="134" rx="16" opacity=".74"/>
    <text x="898" y="44" class="big" fill="#64748b">4</text><text x="946" y="42" class="label ink">更多</text><text x="946" y="68" class="small muted">状态灯等进阶选项</text><rect x="946" y="88" width="54" height="24" rx="12" class="pill"/><text x="960" y="105" class="small muted">进阶</text>
  </g>
  <text x="86" y="764" class="title ink">方案 C：向导化横排版</text>
  <text x="86" y="792" class="body muted">把四块放在预览下方，像步骤入口；第一屏更扁平，适合“先看键盘，再选动作”的路径。</text>
</svg>
