<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneTone 首页轻量预览</title><style>
:root{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:#18334b;background:#f7fafb}*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #7bc2ed;outline-offset:3px}.wrap{max-width:940px;margin:auto;padding:30px 28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.top button{border:0;background:none;color:#58778a;font-size:13px}.content{max-width:730px;margin:76px auto 0}.resume{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #dce7ed;padding:0 0 21px}.resume small{color:#5b8197}.resume h1{font-size:21px;line-height:1.35;letter-spacing:-.025em;margin:6px 0}.resume p{font-size:13px;color:#698596;margin:0}.resume button,.send{border:0;border-radius:8px;background:#078ad2;color:#fff;padding:10px 15px;font-weight:700;white-space:nowrap}.composer{margin-top:54px}.composer label{display:block;font-size:19px;font-weight:700;margin-bottom:15px}.box{border:1px solid #d7e4eb;background:#fff;border-radius:13px;padding:12px;box-shadow:0 8px 25px #1c5b7c0a}textarea{width:100%;min-height:110px;resize:vertical;border:0;outline:0;padding:7px;color:#18334b}textarea::placeholder{color:#94a9b5}.bottom{display:flex;justify-content:space-between;align-items:center;padding:3px;color:#718c9c;font-size:12px}.bottom button{padding:8px 13px}.more{margin-top:28px;border-top:1px solid #e1eaee;padding-top:15px;color:#6a8595;font-size:13px}.more summary{cursor:pointer}.details{padding:16px 0 0;line-height:1.75}.details p{margin:0 0 9px}.details button{border:0;background:none;color:#0781bd;padding:0}.toast{display:none;position:fixed;bottom:22px;right:22px;background:#163c56;color:white;padding:10px 14px;border-radius:8px}.toast.open{display:block}@media(max-width:600px){.wrap{padding:22px}.content{margin-top:48px}.resume{align-items:flex-start;flex-direction:column}.composer{margin-top:42px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">OneTone</div><button id="history">历史</button></header><main class="content"><section class="resume" aria-label="可继续的任务"><div><small>上次工作可继续 · Cursor</small><h1>最近修改了什么代码？</h1><p>项目 voice-pilot · 已保存上次进度</p></div><button id="resume">继续</button></section><section class="composer"><label for="goal">今天想做什么？</label><div class="box"><textarea id="goal" placeholder="描述想法、问题，或想修改的地方…"></textarea><div class="bottom"><span>项目：voice-pilot　 ·　 可添加截图或文件</span><button class="send" id="start">发送</button></div></div></section><details class="more"><summary>查看上次工作的详细状态</summary><div class="details"><p>有一条编辑回合记录，但没有确认的文件写入。另有 3 个可恢复档案。</p><p>这里仅展示已保存的事实；实际步骤和改动需打开任务查看。</p><button id="open">打开任务详情</button></div></details></main></div><div class="toast" id="toast" role="status"></div><script>
const $=id=>document.getElementById(id);function msg(s){$('toast').textContent=s;$('toast').classList.add('open');setTimeout(()=>$('toast').classList.remove('open'),3000)}$('resume').onclick=()=>msg('原型：打开可继续的 Cursor 工作');$('start').onclick=()=>msg($('goal').value.trim()?'原型：发送新任务':'先写下你想做什么');$('history').onclick=()=>msg('原型：打开历史');$('open').onclick=()=>msg('原型：打开任务详情');
</script></body></html>
